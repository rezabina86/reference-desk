/www.malcolmhall.com/2023/01/31/mainactor-does-not-always-mean-main-thread/"}, {"ref": "SE-0302", "label": "Sendable and @Sendable closures", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0302-concurrent-value-and-concurrent-closures.md"}, {"ref": "SE-0414", "label": "Region based Isolation", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md"}, {"ref": "SE-0430", "label": "sending parameter and result values", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0430-transferring-parameters-and-results.md"}, {"ref": "SE-0304", "label": "Structured concurrency", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0304-structured-concurrency.md"}]}, {"title": "Mobile System Design", "slug": "system-design", "tagline": "Whiteboard questions, answered client-side", "summary": "Fourteen questions as interviewers actually ask them, each with a full answer in the shape a 45-minute round rewards: clarifying questions, scope, the box diagram, the API, two or three deep dives with their trade-offs, and the follow-ups that come after a good answer. Client-side throughout; no backend sharding.", "status": "in progress", "accentIndex": 3, "chapters": [{"slug": "the-shape-of-the-round", "title": "The shape of the round", "summary": "How a session runs as a simulated 45-minute interview, what is graded, and how each question chapter is laid out.", "minutes": "6", "sources": [{"ref": "", "label": "weeeBox · Mobile System Design (the public exercise set and its grading criteria)", "url": "https://github.com/weeeBox/mobile-system-design"}, {"ref": "", "label": "System Design Handbook · Mobile system design interview", "url": "https://www.systemdesignhandbook.com/guides/mobile-system-design-interview/"}], "html": "<p>At senior level this is usually the round that decides the outcome, and it is the one where knowing the material and passing come apart most often. What's graded is how you run 45 minutes, out loud, while someone interrupts you.<\/p><p>So every question here is written to be <strong>performed, not read<\/strong>. The prompt is at the top; the whole answer is behind collapsed sections, in the order a real round unfolds — including the interviewer's own lines: how they'd answer your clarifying questions, which component they'd pick to go deep on, and what they'd push on next.<\/p><h2 id=\"the-45-minutes\">The 45 minutes<\/h2><div class=\"scroll\"><table><thead><tr><th>Clock<\/th><th>Phase<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td>0:00–0:02<\/td><td>The prompt<\/td><td>You repeat it back and say how you'll spend the time<\/td><\/tr><tr><td>0:02–0:07<\/td><td>Clarify<\/td><td>You ask; they answer; you state your assumptions<\/td><\/tr><tr><td>0:07–0:12<\/td><td>Scope<\/td><td>Out of scope <strong>first<\/strong>, then 3–5 features, then the non-functional ones that matter<\/td><\/tr><tr><td>0:12–0:24<\/td><td>High level<\/td><td>The boxes, the flow, the contract, the types and why those types<\/td><\/tr><tr><td>0:24–0:40<\/td><td>Deep dives<\/td><td>They pick a component and push<\/td><\/tr><tr><td>0:40–0:45<\/td><td>Follow-ups and recap<\/td><td>Rapid fire, then the whole design in 60 seconds<\/td><\/tr><\/tbody><\/table><\/div><p>About 30 working minutes. Running out of time before the deep dive is the most common way a strong candidate fails.<\/p><h2 id=\"how-to-run-a-session\">How to run a session<\/h2><ol start=\"1\"><li><strong>Timer on, standing, out loud, sketching<\/strong> on paper or an iPad. Nothing open in front of you.<\/li><li>At each phase boundary, move on whether or not you're finished. That discipline <em>is<\/em> the skill.<\/li><li>When the 35 minutes are up, open the sections one at a time and mark each <strong>clean<\/strong>, <strong>partial<\/strong> or <strong>missed<\/strong>. Finish with the scorecard section.<\/li><li>Keep the misses somewhere. A section you skip twice is a gap, not an oversight, and the second time is when it is worth reading up on.<\/li><\/ol><h2 id=\"what-is-actually-graded\">What is actually graded<\/h2><p>The public exercise set these prompts are drawn from publishes its criteria, and they are not what candidates expect: clear communication and active listening · thoughtful requirement clarification · practical trade-off analysis · <strong>honestly acknowledging the limits of your knowledge<\/strong> · balancing engineering quality against business timelines.<\/p><p>Read that list again. Only one line is about the design. The rest is about how you behave while producing it. In practice that means:<\/p><p><strong>Scoping out loud.<\/strong> Three features done properly beat eight named. <em>\"Offline editing is out of scope for this pass\"<\/em> is a positive signal.<\/p><p><strong>Trade-offs, not choices.<\/strong> Every box arrives with the alternative you rejected and the condition under which you'd switch.<\/p><p><strong>Staying client-side.<\/strong> The classic failure is drifting into sharding and QPS. You're sizing a cache and reasoning about what happens on the U-Bahn with no signal.<\/p><p><strong>Naming the smaller version.<\/strong> Saying <em>\"for a single screen, <code><span class=\"t-typ\">AsyncImage<\/span><\/code> and <code><span class=\"t-typ\">NSCache<\/span><\/code> are enough — here's when they stop being enough\"<\/em> reads as senior. Building a pipeline for a settings screen does not.<\/p><p><strong>Saying what you don't know<\/strong>, then reasoning about it anyway.<\/p><h2 id=\"components-and-saying-why-those-components\">Components, and saying why those components<\/h2><p>Every one of these rounds reaches <em>\"why these types and not one big one?\"<\/em>. That question is asking whether you can justify a boundary, and the useful vocabulary for it is SOLID — used as reasons, not names:<\/p><ul><li><strong>Single responsibility<\/strong> — say what would make each type change. Different reasons, different types.<\/li><li><strong>Open–closed<\/strong> — new behaviour arrives as a new conformance, not as another <code><span class=\"t-kw\">if<\/span><\/code> in the coordinator.<\/li><li><strong>Liskov<\/strong> — the contract is behavioural: every conformance must cancel, throw and be callable concurrently the same way, or callers written against the protocol break.<\/li><li><strong>Interface segregation<\/strong> — if a test double needs twelve methods to test one, the protocol is too fat.<\/li><li><strong>Dependency inversion<\/strong> — depend on protocols, inject the concrete types at the composition root. This is what makes the interesting race testable at all.<\/li><\/ul><p>And the caveat worth saying in the room: SOLID came from class hierarchies; on iOS half of it lands as value types and protocol witnesses, and pushed too far it produces thirty one-method types. <em>\"I split where the reasons to change differ, not per noun.\"<\/em><\/p><h2 id=\"the-checklist-to-touch-briefly-in-every-answer\">The checklist to touch, briefly, in every answer<\/h2><p>Data flow and ownership of state · networking (protocol, pagination, retry, cancellation) · caching (tiers, keys, eviction, invalidation) · offline behaviour and the mutation queue · concurrency (what's on the main actor, how duplicate work is avoided) · memory and performance · observability, feature flags, testing and rollout — one sentence each is enough for the last group.<\/p><h2 id=\"how-each-chapter-is-laid-out\">How each chapter is laid out<\/h2><p>Visible: the prompt, the clock, and <strong>what the question is really testing<\/strong> — the framing, not the answer. Then, collapsed:<\/p><ol start=\"1\"><li>The interviewer answers your clarifying questions<\/li><li>Requirements and scope — what you should have said<\/li><li>The design, on the whiteboard — a real diagram<\/li><li>The types, and the reasons behind them (SOLID, out loud)<\/li><li>API and data model<\/li><\/ol><p>6–8. Deep dives, each opened by the line the interviewer would actually use<\/p><ol start=\"9\"><li>Failure modes and 10×<\/li><li>Rapid fire — the follow-ups<\/li><li>Scorecard — mark yourself, 0 / 1 / 2<\/li><li>The 60-second recap<\/li><\/ol><p>You did it right if all four are true: you named out-of-scope first, every choice carried a rejected alternative and a switch condition, you stayed client-side, and you could answer at least two follow-ups before opening them.<\/p>", "text": "at senior level this is usually the round that decides the outcome, and it is the one where knowing the material and passing come apart most often. what's graded is how you run 45 minutes, out loud, while someone interrupts you. so every question here is written to be performed, not read . the prompt is at the top; the whole answer is behind collapsed sections, in the order a real round unfolds — including the interviewer's own lines: how they'd answer your clarifying questions, which component they'd pick to go deep on, and what they'd push on next. the 45 minutes clock phase what happens 0:00–0:02 the prompt you repeat it back and say how you'll spend the time 0:02–0:07 clarify you ask; they answer; you state your assumptions 0:07–0:12 scope out of scope first , then 3–5 features, then the non functional ones that matter 0:12–0:24 high level the boxes, the flow, the contract, the types and why those types 0:24–0:40 deep dives they pick a component and push 0:40–0:45 follow ups and recap rapid fire, then the whole design in 60 seconds about 30 working minutes. running out of time before the deep dive is the most common way a strong candidate fails. how to run a session 1. timer on, standing, out loud, sketching on paper or an ipad. nothing open in front of you. 2. at each phase boundary, move on whether or not you're finished. that discipline is the skill. 3. when the 35 minutes are up, open the sections one at a time and mark each clean , partial or missed . finish with the scorecard section. 4. keep the misses somewhere. a section you skip twice is a gap, not an oversight, and the second time is when it is worth reading up on. what is actually graded the public exercise set these prompts are drawn from publishes its criteria, and they are not what candidates expect: clear communication and active listening · thoughtful requirement clarification · practical trade off analysis · honestly acknowledging the limits of your knowledge · balancing engineering quality against business timelines. read that list again. only one line is about the design. the rest is about how you behave while producing it. in practice that means: scoping out loud. three features done properly beat eight named. \"offline editing is out of scope for this pass\" is a positive signal. trade offs, not choices. every box arrives with the alternative you rejected and the condition under which you'd switch. staying client side. the classic failure is drifting into sharding and qps. you're sizing a cache and reasoning about what happens on the u bahn with no signal. naming the smaller version. saying \"for a single screen, asyncimage and nscache are enough — here's when they stop being enough\" reads as senior. building a pipeline for a settings screen does not. saying what you don't know , then reasoning about it anyway. components, and saying why those components every one of these rounds reaches \"why these types and not one big one?\" . that question is asking whether you can justify a boundary, and the useful vocabulary for it is solid — used as reasons, not names: single responsibility — say what would make each type change. different reasons, different types. open–closed — new behaviour arrives as a new conformance, not as another if in the coordinator. liskov — the contract is behavioural: every conformance must cancel, throw and be callable concurrently the same way, or callers written against the protocol break. interface segregation — if a test double needs twelve methods to test one, the protocol is too fat. dependency inversion — depend on protocols, inject the concrete types at the composition root. this is what makes the interesting race testable at all. and the caveat worth saying in the room: solid came from class hierarchies; on ios half of it lands as value types and protocol witnesses, and pushed too far it produces thirty one method types. \"i split where the reasons to change differ, not per noun.\" the checklist to touch, briefly, in every answer data flow and ownership of state · networking (protocol, pagination, retry, cancellation) · caching (tiers, keys, eviction, invalidation) · offline behaviour and the mutation queue · concurrency (what's on the main actor, how duplicate work is avoided) · memory and performance · observability, feature flags, testing and rollout — one sentence each is enough for the last group. how each chapter is laid out visible: the prompt, the clock, and what the question is really testing — the framing, not the answer. then, collapsed: 1. the interviewer answers your clarifying questions 2. requirements and scope — what you should have said 3. the design, on the whiteboard — a real diagram 4. the types, and the reasons behind them (solid, out loud) 5. api and data model 6–8. deep dives, each opened by the line the interviewer would actually use 9. failure modes and 10× 10. rapid fire — the follow ups 11. scorecard — mark yourself, 0 / 1 / 2 12. the 60 second recap you did it right if all four are true: you named out of scope first, every choice carried a rejected alternative and a switch condition, you stayed client side, and you could answer at least two follow ups before opening them. ", "outline": [{"a": "the-45-minutes", "t": "The 45 minutes"}, {"a": "how-to-run-a-session", "t": "How to run a session"}, {"a": "what-is-actually-graded", "t": "What is actually graded"}, {"a": "components-and-saying-why-those-components", "t": "Components, and saying why those components"}, {"a": "the-checklist-to-touch-briefly-in-every-answer", "t": "The checklist to touch, briefly, in every answer"}, {"a": "how-each-chapter-is-laid-out", "t": "How each chapter is laid out"}]}, {"slug": "image-loading-and-caching-library", "title": "01 · Image loading and caching library", "summary": "\"Design an image loading library, something like Kingfisher or Nuke.\"", "minutes": "50", "sources": [{"ref": "", "label": "weeeBox · Mobile system design exercise, Image library", "url": "https://github.com/weeeBox/mobile-system-design/blob/master/exercises/image-library.md"}, {"ref": "WWDC18", "label": "Image and graphics best practices", "url": "https://developer.apple.com/videos/play/wwdc2018/219/"}, {"ref": "WWDC21", "label": "Make blazing fast lists and collection views", "url": "https://developer.apple.com/videos/play/wwdc2021/10252/"}, {"ref": "WWDC19", "label": "Advances in networking, part 1 (Low Data Mode)", "url": "https://developer.apple.com/videos/play/wwdc2019/712/"}, {"ref": "", "label": "Apple · CGImageSourceCreateThumbnailAtIndex", "url": "https://developer.apple.com/documentation/imageio/cgimagesourcecreatethumbnailatindex(_:_:_:)"}, {"ref": "", "label": "Apple · UIImage.preparingForDisplay()", "url": "https://developer.apple.com/documentation/uikit/uiimage/3750834-preparingfordisplay"}, {"ref": "", "label": "Apple · NSCache", "url": "https://developer.apple.com/documentation/foundation/nscache"}, {"ref": "", "label": "Apple · allowsConstrainedNetworkAccess", "url": "https://developer.apple.com/documentation/foundation/urlsessionconfiguration/allowsconstrainednetworkaccess"}, {"ref": "", "label": "Apple · UICollectionViewDataSourcePrefetching", "url": "https://developer.apple.com/documentation/uikit/uicollectionviewdatasourceprefetching"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "", "label": "Nuke · request coalescing and the pipeline", "url": "https://github.com/kean/Nuke"}], "html": "<p><em>A recurring senior mobile prompt in first-hand interview reports. The public exercise interviewers draw their wording from is weeeBox's image-library brief, which also publishes the grading criteria used below.<\/em><\/p><blockquote class=\"aside plain\"><p><strong>Interviewer:<\/strong> \"We show a lot of images — feeds, avatars, a photo grid. I'd like you to design the image loading library we'd build for that. Something in the spirit of Kingfisher or Nuke. Where would you start?\"<\/p><\/blockquote><h2 id=\"run-it-as-a-round-not-as-reading\">Run it as a round, not as reading<\/h2><p>Set a timer. Stand up. Sketch on paper or an iPad. Talk the whole time — silence is the thing that fails these rounds. <strong>Do not open a section until its slot is over.<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Clock<\/th><th>Phase<\/th><th>What you do<\/th><\/tr><\/thead><tbody><tr><td>0:00–0:02<\/td><td>The prompt<\/td><td>Repeat it back in one sentence and say what you're going to do with the time<\/td><\/tr><tr><td>0:02–0:07<\/td><td>Clarify<\/td><td>Ask; then open section 1 only after you've asked yours, and take its answers as the interviewer's<\/td><\/tr><tr><td>0:07–0:12<\/td><td>Scope<\/td><td>Out of scope first, then 3–5 functional, then the non-functional ones that matter<\/td><\/tr><tr><td>0:12–0:24<\/td><td>High level<\/td><td>The boxes, the flow, the API and the keys<\/td><\/tr><tr><td>0:24–0:40<\/td><td>Deep dives<\/td><td>The interviewer picks; sections 6–8 are the three they pick from<\/td><\/tr><tr><td>0:40–0:45<\/td><td>Follow-ups and recap<\/td><td>Rapid fire, then the 60-second summary<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"what-this-question-is-really-testing\">What this question is really testing<\/h2><p>It looks like a question about caching. It isn't, quite.<\/p><ul><li><strong>Can you find the axis?<\/strong> Every decision here trades <strong>memory ↔ disk ↔ CPU ↔ bandwidth<\/strong>. A candidate who names that axis in the first five minutes has already passed the framing part.<\/li><li><strong>Do you know what a decoded image costs?<\/strong> Width × height × 4 bytes, regardless of file size. Everything about memory follows from that one fact, and it's the most common gap.<\/li><li><strong>Can you design components with reasons?<\/strong> They will ask why these types and not fewer. This is where SOLID earns its keep — not as vocabulary, but as four or five sentences about what would change and what wouldn't.<\/li><li><strong>Do you think about the same image twice?<\/strong> Two cells, one URL. Dedupe of in-flight work is the concurrency content of this question and the thing most answers miss.<\/li><li><strong>Do you know when to stop?<\/strong> <code><span class=\"t-typ\">AsyncImage<\/span><\/code> and <code><span class=\"t-typ\">NSCache<\/span><\/code> are legitimate answers for a small app. Saying so, with the condition attached, reads as senior. Building a pipeline for a settings screen does not.<\/li><\/ul><p><strong>Traps:<\/strong> drifting into CDN and backend design; describing a cache with no eviction; forgetting cancellation entirely; naming Kingfisher's features instead of designing; decoding on the main actor without noticing.<\/p><details class=\"reveal\"><summary>1 · The interviewer answers your clarifying questions<\/summary><div class=\"reveal-body\"><p>Ask yours first. These are the answers you'd get, and the assumptions the rest of this chapter runs on.<\/p><p><strong>\"Is this a library for one app, or an SDK other teams adopt?\"<\/strong> → <em>One app to start, but shaped so it could be extracted as a package later.<\/em><\/p><p><strong>\"Where do images come from — network only?\"<\/strong> → <em>Network mostly, but also files on disk and a few bundled assets. The public version of this exercise wants all three.<\/em><\/p><p><strong>\"Who consumes them? Views only, or code too?\"<\/strong> → <em><code><span class=\"t-typ\">UIImageView<\/span><\/code> and SwiftUI, and occasionally non-UI code that wants the image to share or export.<\/em><\/p><p><strong>\"What's the heaviest screen?\"<\/strong> → <em>A grid of thumbnails you can fling through, plus full-screen detail views.<\/em><\/p><p><strong>\"Can the server resize? Is there a CDN with a width parameter?\"<\/strong> → <em>Yes, assume <code>?w=<\/code> works and the CDN sends <code><span class=\"t-typ\">ETag<\/span><\/code> and <code><span class=\"t-typ\">Cache<\/span>-<span class=\"t-typ\">Control<\/span><\/code>.<\/em><\/p><p><strong>\"Do images need to show offline?\"<\/strong> → <em>Yes. Anything the user has seen should still appear with no network.<\/em><\/p><p><strong>\"Anything sensitive in these images?\"<\/strong> → <em>Not today. Ask me again at the end.<\/em> (They will.)<\/p><p><strong>\"What are we optimising — smoothness, data, battery?\"<\/strong> → <em>Scrolling must stay smooth on a three-year-old phone, and we've had memory-pressure kills in the field.<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>2 · Requirements and scope — what you should have said<\/summary><div class=\"reveal-body\"><p><strong>Out of scope, stated first, before any design:<\/strong> animated GIF/APNG playback, video thumbnails, editing and filters beyond resize, placeholder and transition animations (the caller owns those), plug-in loaders for arbitrary formats, and everything server-side beyond \"there is a CDN with a width parameter\". Progressive JPEG is a stretch goal if time allows.<\/p><p><strong>Functional — five, no more<\/strong><\/p><ol start=\"1\"><li>Load an image by URL from network, file or bundle, into a view or back to a caller.<\/li><li>Downsample to the size it will actually be displayed at.<\/li><li>Cache in memory and on disk; previously seen images appear offline.<\/li><li>Cancel automatically when a view stops needing the image — cell reuse, disappearance.<\/li><li>Prefetch ahead of the scroll position.<\/li><\/ol><p><strong>Non-functional that matter here<\/strong><\/p><ul><li><strong>Memory<\/strong> — decoded bitmaps are what gets the app killed. Budget them explicitly.<\/li><li><strong>Main-thread time<\/strong> — no decode and no disk I/O on the main actor; the scroll holds its frame rate.<\/li><li><strong>Bandwidth and battery<\/strong> — never fetch the same bytes twice; honour Low Data Mode.<\/li><li><strong>Correctness<\/strong> — a reused cell never shows another row's image.<\/li><li><strong>Testability<\/strong> — every I/O boundary behind a protocol.<\/li><\/ul><p>Then say the axis out loud: <em>\"Everything from here is memory against disk against CPU against bandwidth. I'll keep naming which one each choice spends.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>3 · The design, on the whiteboard<\/summary><div class=\"reveal-body\"><figure class=\"dg\">\n  <figcaption>One request, four layers, two cache keys<\/figcaption>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">Call site<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node\"><b>UIImageView.setImage<\/b><span>@MainActor · cancels on reuse<\/span><\/div>\n      <div class=\"dg-node\"><b>LazyImage<\/b><span>SwiftUI · .task(id: request)<\/span><\/div>\n      <div class=\"dg-node ghost\"><b>Any async caller<\/b><span>share sheet, export<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-flow\">ImageRequest(url, pixel size, priority)<\/div>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">Pipeline<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node accent\"><b>ImagePipeline · actor<\/b><span>look up, join in-flight work, or start one<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">owns<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node\"><b>MemoryCache<\/b><span>key: url + pixel size · LRU with a byte budget<\/span><\/div>\n      <div class=\"dg-node\"><b>inFlight[ImageKey]<\/b><span>Task + how many callers are waiting<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-flow\">memory miss → ask for bytes, keyed by url alone<\/div>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">Data<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node\"><b>DataLoader<\/b><span>dedupes downloads by url<\/span><\/div>\n      <div class=\"dg-node\"><b>DiskCache<\/b><span>encoded bytes · SHA-256 filename · LRU index + ETag<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-flow\">disk miss<\/div>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">Sources<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node warm\"><b>URLSession → CDN<\/b><span>?w= bucket · ETag · Low Data Mode<\/span><\/div>\n      <div class=\"dg-node\"><b>File / bundle<\/b><span>same protocol, no network<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-flow up\">bytes<\/div>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">Decode<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node accent\"><b>ImageDecoder · @concurrent<\/b><span>downsample straight to pixel size, decode eagerly<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-flow up\">UIImage → memory cache → every caller waiting on this key<\/div>\n\n  <p class=\"dg-note\">The two keys are the point: bytes are the same at any display size, a decoded bitmap is not.<\/p>\n  <div class=\"dg-legend\"><span>accent · owns concurrency<\/span><span>warm · crosses the network<\/span><span>dashed · optional caller<\/span><\/div>\n<\/figure><p>Narrate it in one pass: a request carries a URL and the pixel size it will be shown at. The pipeline checks the memory cache under URL + size; a hit returns in the same frame. On a miss it looks for an in-flight task for that key and joins it instead of starting a second one. Otherwise it asks for bytes — disk first, then network, deduplicated by URL alone — hands them to the decoder, which downsamples off the main actor, stores the result and gives it to everyone waiting. Only the final assignment to the view is main-actor work.<\/p><\/div><\/details><details class=\"reveal\"><summary>4 · The types, and the reasons behind them — SOLID out loud<\/summary><div class=\"reveal-body\"><p>They will ask <em>\"why these types and not one <code><span class=\"t-typ\">ImageManager<\/span><\/code>?\"<\/em>. The answer is five sentences about change, not five principle names. Name the principle <strong>after<\/strong> the reason, if at all.<\/p><figure class=\"dg\">\n  <figcaption>What depends on what — protocols in the middle, concretes at the edges<\/figcaption>\n\n  <div class=\"dg-group\">\n    <p class=\"dg-group-label\">Composition root — the only place concrete types are named<\/p>\n    <div class=\"dg-split\">\n      <div class=\"dg-node ghost\"><b>URLSessionDataLoader<\/b><span>network bytes<\/span><\/div>\n      <div class=\"dg-node ghost\"><b>FileDataLoader<\/b><span>disk / bundle bytes<\/span><\/div>\n      <div class=\"dg-node ghost\"><b>ImageIODecoder<\/b><span>downsample + decode<\/span><\/div>\n      <div class=\"dg-node ghost\"><b>LRUMemoryCache<\/b><span>byte budget<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-flow up\">injected once, at start-up<\/div>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">Seams<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node accent\"><b>ImageDataLoaderType<\/b><span>data(for:) async throws<\/span><\/div>\n      <div class=\"dg-node accent\"><b>ImageDecoderType<\/b><span>image(from:to:) async throws<\/span><\/div>\n      <div class=\"dg-node accent\"><b>ImageCacheType<\/b><span>get / set / removeAll<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dg-flow up\">depends only on these<\/div>\n\n  <div class=\"dg-row\"><span class=\"dg-lane\">Policy<\/span>\n    <div class=\"dg-nodes\">\n      <div class=\"dg-node\"><b>ImagePipeline<\/b><span>coordination: keys, dedupe, cancellation, cache writes<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/figure><p><strong>Single responsibility — say it as \"what would make each of these change\".<\/strong> The loader changes when the transport changes. The decoder changes when the format or the downsampling strategy changes. The cache changes when the eviction policy changes. The pipeline changes when the <em>coordination<\/em> rules change — dedupe, cancellation, which cache to consult first. Four reasons, four types. One <code><span class=\"t-typ\">ImageManager<\/span><\/code> would be touched by all four, which is why it becomes the file nobody wants to review.<\/p><p><strong>Open–closed, concretely.<\/strong> Adding a source — bundle assets today, the Photos framework tomorrow, base64 data URLs for tests — is a new conformance to <code><span class=\"t-typ\">ImageDataLoaderType<\/span><\/code> and a line in the composition root. No <code><span class=\"t-kw\">switch<\/span><\/code> inside the pipeline grows. That's the practical form of the principle: new behaviour by composition, not by editing the coordinator.<\/p><p><strong>Liskov, in the form it actually bites on iOS.<\/strong> Every loader must honour the same contract: it throws <code><span class=\"t-typ\">CancellationError<\/span><\/code> when cancelled, it never returns half the bytes, and it is safe to call concurrently. A file loader that quietly ignores cancellation satisfies the <em>compiler<\/em> and breaks every caller written against the protocol. Contracts in a protocol are behaviour, not just signatures — which is why the protocol's documentation comment says those three things, and why the same test suite runs against every conformance.<\/p><p><strong>Interface segregation.<\/strong> <code><span class=\"t-typ\">ImagePipelineType<\/span><\/code> has three methods. Prefetching lives in its own <code><span class=\"t-typ\">ImagePrefetchingType<\/span><\/code>, so a detail screen that shows one image doesn't depend on — or have to fake — prefetch. The test is the doubles: if a mock needs twelve methods to test one, the protocol is too fat.<\/p><p><strong>Dependency inversion.<\/strong> The pipeline depends on protocols; <code><span class=\"t-typ\">URLSession<\/span><\/code>, ImageIO and the file system are injected at the composition root. In Swift this mostly looks like taking protocols in <code><span class=\"t-kw\">init<\/span><\/code>, and its payoff is concrete: the dedupe test in section 6 needs a loader whose response is held open by the test, which is impossible if the pipeline constructs a <code><span class=\"t-typ\">URLSession<\/span><\/code> itself.<\/p><p><strong>And the honest caveat, which is worth saying in the room:<\/strong> SOLID came from a world of class hierarchies. On iOS, half of it shows up as value types and protocol witnesses rather than inheritance, and taken too far SRP gives you thirty one-method types nobody can navigate. <em>\"I split where a reason to change differs, not per noun.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>5 · API and the two keys<\/summary><div class=\"reveal-body\"><p><strong>The server contract.<\/strong> Nothing of our own. <code><span class=\"t-typ\">GET<\/span> https:<span class=\"t-com\">//img.example.com/{id}?w={pixels}<\/span><\/code>, with <code><span class=\"t-typ\">ETag<\/span><\/code> and <code><span class=\"t-typ\">Cache<\/span>-<span class=\"t-typ\">Control<\/span><\/code>. The client rounds width up into buckets — 160, 320, 640, 1280 — so neighbouring sizes share a CDN entry and a disk entry.<\/p><p><strong>Public API — three entry points over one pipeline<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">ImageRequest<\/span>: <span class=\"t-typ\">Hashable<\/span>, <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">let<\/span> url: <span class=\"t-typ\">URL<\/span>\n    <span class=\"t-kw\">let<\/span> targetPixelSize: <span class=\"t-typ\">CGSize<\/span>?      <span class=\"t-com\">// nil = full size<\/span>\n    <span class=\"t-kw\">let<\/span> priority: <span class=\"t-typ\">Priority<\/span>            <span class=\"t-com\">// .veryLow ... .high<\/span>\n    <span class=\"t-kw\">let<\/span> allowsConstrainedNetwork: <span class=\"t-typ\">Bool<\/span>\n}\n\n<span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImagePipelineType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">func<\/span> image(<span class=\"t-kw\">for<\/span> request: <span class=\"t-typ\">ImageRequest<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">UIImage<\/span>\n}\n\n<span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImagePrefetchingType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">func<\/span> prefetch(_ requests: [<span class=\"t-typ\">ImageRequest<\/span>])\n    <span class=\"t-kw\">func<\/span> cancelPrefetch(_ requests: [<span class=\"t-typ\">ImageRequest<\/span>])\n}\n\n<span class=\"t-kw\">extension<\/span> <span class=\"t-typ\">UIImageView<\/span> {                         <span class=\"t-com\">// thin, @MainActor<\/span>\n    <span class=\"t-atr\">@MainActor<\/span> <span class=\"t-kw\">func<\/span> setImage(_ request: <span class=\"t-typ\">ImageRequest<\/span>?)\n}\n\n<span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">LazyImage<\/span>: <span class=\"t-typ\">View<\/span> { <span class=\"t-kw\">init<\/span>(request: <span class=\"t-typ\">ImageRequest<\/span>) }   <span class=\"t-com\">// .task(id: request)<\/span><\/code><\/pre><\/div><p><code><span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span><\/code> is the core and the view helpers are thin, for three reasons: cancellation comes free from task cancellation, non-UI callers use the same path, and tests call it directly with no view in sight.<\/p><p><strong>The two keys — the detail most answers miss<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">DataKey<\/span>: <span class=\"t-typ\">Hashable<\/span>  { <span class=\"t-kw\">let<\/span> url: <span class=\"t-typ\">URL<\/span> }                    <span class=\"t-com\">// disk + network<\/span>\n<span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">ImageKey<\/span>: <span class=\"t-typ\">Hashable<\/span> { <span class=\"t-kw\">let<\/span> url: <span class=\"t-typ\">URL<\/span>; <span class=\"t-kw\">let<\/span> pixelSize: <span class=\"t-typ\">CGSize<\/span>? }   <span class=\"t-com\">// memory + decode<\/span><\/code><\/pre><\/div><p>Bytes don't depend on display size, so downloads and disk entries dedupe on the URL. A decoded bitmap is only reusable at the size it was decoded for, so the memory cache and in-flight decodes key on URL + size. Two cells showing one avatar at 80 pt and 300 pt share a download and get two decodes.<\/p><p><strong>Local model.<\/strong> Memory: <code><span class=\"t-typ\">ImageKey<\/span> → (<span class=\"t-typ\">UIImage<\/span>, cost)<\/code>. Disk: files in <code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span>/<span class=\"t-typ\">Images<\/span>/<\/code> named by the SHA-256 hex of the URL, plus a small index — <code>hash → (byteCount, lastAccess, etag)<\/code> — for eviction and revalidation.<\/p><\/div><\/details><details class=\"reveal\"><summary>6 · Deep dive — \"Two cells show the same avatar. Walk me through it.\"<\/summary><div class=\"reveal-body\"><p><strong>Decision: an actor holds a dictionary of in-flight <code><span class=\"t-typ\">Task<\/span><\/code>s keyed by <code><span class=\"t-typ\">ImageKey<\/span><\/code>; callers join; the work is cancelled only when the last subscriber leaves.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">ImagePipeline<\/span>: <span class=\"t-typ\">ImagePipelineType<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> inFlight: [<span class=\"t-typ\">ImageKey<\/span>: <span class=\"t-typ\">Entry<\/span>] = [:]\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">Entry<\/span> { <span class=\"t-kw\">let<\/span> task: <span class=\"t-typ\">Task<\/span>&lt;<span class=\"t-typ\">UIImage<\/span>, <span class=\"t-typ\">Error<\/span>&gt;; <span class=\"t-kw\">var<\/span> subscribers: <span class=\"t-typ\">Int<\/span> }\n\n    <span class=\"t-kw\">func<\/span> image(<span class=\"t-kw\">for<\/span> request: <span class=\"t-typ\">ImageRequest<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">UIImage<\/span> {\n        <span class=\"t-kw\">let<\/span> key = <span class=\"t-typ\">ImageKey<\/span>(request)\n        <span class=\"t-kw\">if<\/span> <span class=\"t-kw\">let<\/span> hit = memory.value(<span class=\"t-kw\">for<\/span>: key) { <span class=\"t-kw\">return<\/span> hit }\n\n        <span class=\"t-kw\">let<\/span> task: <span class=\"t-typ\">Task<\/span>&lt;<span class=\"t-typ\">UIImage<\/span>, <span class=\"t-typ\">Error<\/span>&gt;\n        <span class=\"t-kw\">if<\/span> <span class=\"t-kw\">var<\/span> entry = inFlight[key] {                  <span class=\"t-com\">// join, don&#x27;t restart<\/span>\n            entry.subscribers += <span class=\"t-num\">1<\/span>; inFlight[key] = entry; task = entry.task\n        } <span class=\"t-kw\">else<\/span> {\n            task = <span class=\"t-typ\">Task<\/span> { <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> load(key, request) }\n            inFlight[key] = <span class=\"t-typ\">Entry<\/span>(task: task, subscribers: <span class=\"t-num\">1<\/span>)\n        }\n\n        <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> withTaskCancellationHandler {\n            <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> task.value\n        } onCancel: {\n            <span class=\"t-typ\">Task<\/span> { <span class=\"t-kw\">await<\/span> <span class=\"t-kw\">self<\/span>.unsubscribe(key) }        <span class=\"t-com\">// last one out cancels<\/span>\n        }\n    }\n}<\/code><\/pre><\/div><p>The lookup and the insert happen with no <code><span class=\"t-kw\">await<\/span><\/code> between them, so they're atomic on the actor. That's the entire trick. The naive version — check the cache, <code><span class=\"t-kw\">await<\/span><\/code> the download, insert — lets two callers both miss and both download, because an actor is re-entrant at every <code><span class=\"t-kw\">await<\/span><\/code>. Storing the <strong>task<\/strong> rather than the result closes the window. The task must also remove its entry when it finishes, success or failure, or one failed load poisons that key forever.<\/p><p><em>Alternative rejected: cancel the shared work when any caller cancels.<\/em> Simpler and wrong — cell A scrolls away and kills the download cell B is still waiting for. <em>Alternative rejected: never cancel shared work.<\/em> Wastes bandwidth exactly during a fast fling, when requests pile up.<\/p><p><em>Switch condition:<\/em> if profiling showed duplicate URLs are rare on screen, the subscriber count is complexity for nothing; plain per-caller cancellation is fine. A nice middle: on last unsubscribe let the <strong>download<\/strong> finish into the disk cache and cancel only the <strong>decode<\/strong>.<\/p><p><strong>Where each piece runs.<\/strong> <code>setImage<\/code> is <code><span class=\"t-atr\">@MainActor<\/span><\/code> and reads the memory cache synchronously, so a hit paints in the same frame with no flicker. The pipeline actor does bookkeeping only — it must never decode, or every decode in the app serialises behind one executor. Decoding is <code><span class=\"t-atr\">@concurrent<\/span><\/code>, because since SE-0461 a plain <code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">async<\/span><\/code> function runs on the caller's actor: \"it's async\" no longer means \"it's off the main thread\", so the hop has to be asked for.<\/p><p><strong>Cell reuse is a cancellation problem, not a caching one.<\/strong> <code>setImage<\/code> keeps the current <code><span class=\"t-typ\">Task<\/span><\/code> on the view; a new call or <code>prepareForReuse<\/code> cancels it. On completion the view checks the request it finished for is still its current one, because cancellation is cooperative and a late result can still arrive. That check is what stops the wrong-image-in-a-reused-cell bug. SwiftUI's <code>.task(id: request)<\/code> gives you both behaviours for free.<\/p><\/div><\/details><details class=\"reveal\"><summary>7 · Deep dive — \"This grid gets the app killed on an iPhone 12. Why?\"<\/summary><div class=\"reveal-body\"><p><strong>The fact the rest rests on:<\/strong> memory cost comes from pixel dimensions, not file size. A decoded 8-bit RGBA bitmap costs width × height × 4 bytes. A 4032 × 3024 photo that's 2 MB as a JPEG is about 49 MB decoded. Twenty of those at full size is the kill.<\/p><p><strong>Decision: decode straight to display size with ImageIO; never decode full-size and then scale.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@concurrent<\/span>\n<span class=\"t-kw\">func<\/span> downsample(_ data: <span class=\"t-typ\">Data<\/span>, to maxPixelSize: <span class=\"t-typ\">CGFloat<\/span>) -&gt; <span class=\"t-typ\">CGImage<\/span>? {\n    <span class=\"t-kw\">let<\/span> source = <span class=\"t-typ\">CGImageSourceCreateWithData<\/span>(\n        data <span class=\"t-kw\">as<\/span> <span class=\"t-typ\">CFData<\/span>, [kCGImageSourceShouldCache: <span class=\"t-kw\">false<\/span>] <span class=\"t-kw\">as<\/span> <span class=\"t-typ\">CFDictionary<\/span>)!\n    <span class=\"t-kw\">let<\/span> options: [<span class=\"t-typ\">CFString<\/span>: <span class=\"t-typ\">Any<\/span>] = [\n        kCGImageSourceCreateThumbnailFromImageAlways: <span class=\"t-kw\">true<\/span>,\n        kCGImageSourceShouldCacheImmediately: <span class=\"t-kw\">true<\/span>,        <span class=\"t-com\">// decode here, off main<\/span>\n        kCGImageSourceCreateThumbnailWithTransform: <span class=\"t-kw\">true<\/span>,  <span class=\"t-com\">// honour EXIF orientation<\/span>\n        kCGImageSourceThumbnailMaxPixelSize: maxPixelSize,\n    ]\n    <span class=\"t-kw\">return<\/span> <span class=\"t-typ\">CGImageSourceCreateThumbnailAtIndex<\/span>(source, <span class=\"t-num\">0<\/span>, options <span class=\"t-kw\">as<\/span> <span class=\"t-typ\">CFDictionary<\/span>)\n}<\/code><\/pre><\/div><p><code><span class=\"t-typ\">ShouldCache<\/span>: <span class=\"t-kw\">false<\/span><\/code> stops ImageIO holding a full-size decode; <code><span class=\"t-typ\">ShouldCacheImmediately<\/span><\/code> forces the decode to happen here rather than lazily at first render on the main thread. That pair is the difference between a smooth scroll and a hitch.<\/p><p><em>Alternative rejected:<\/em> redrawing through <code><span class=\"t-typ\">UIGraphicsImageRenderer<\/span><\/code> — it decodes the full image first, so peak memory is the full bitmap. <em>Also available:<\/em> <code><span class=\"t-typ\">UIImage<\/span>.byPreparingThumbnail(ofSize:)<\/code> and <code>byPreparingForDisplay()<\/code> (iOS 15) do this with far less code. <em>Switch condition:<\/em> if you don't need EXIF-transform control or exotic formats, use them and own less code. Sizes must be in <strong>pixels<\/strong> — points × <code>displayScale<\/code> — which is why the request carries a pixel size the view computes.<\/p><p><strong>Decision: a custom LRU memory cache with a byte budget<\/strong>, costed by <code>bytesPerRow × height<\/code> of the decoded image. Budget a fraction of what the process may use (sample <code>os_proc_available_memory()<\/code> at launch, take 15–20%, cap it). Purge on <code>didReceiveMemoryWarningNotification<\/code>; trim on background.<\/p><p><em>Alternative rejected: <code><span class=\"t-typ\">NSCache<\/span><\/code>.<\/em> Thread-safe, reacts to memory pressure by itself, and an entirely respectable answer. Its costs: eviction order is undocumented, you can't enumerate it to purge one URL at every size, and it's widely observed to empty itself on backgrounding — behaviour that isn't documented, so you can't design around it. <em>Switch condition:<\/em> one image screen, no need to purge by URL → <code><span class=\"t-typ\">NSCache<\/span><\/code> with a <code>totalCostLimit<\/code>, and say so out loud.<\/p><p><strong>\"Why cache decoded images at all, when the disk has the bytes?\"<\/strong> Because a disk read plus a decode is milliseconds of CPU per image, and scrolling back up the feed must paint in the same frame. Memory buys CPU and smoothness — the axis again.<\/p><\/div><\/details><details class=\"reveal\"><summary>8 · Deep dive — \"Why not just use URLCache?\"<\/summary><div class=\"reveal-body\"><p><strong>Decision: own a disk cache of encoded bytes, keyed by SHA-256 of the URL, in <code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span><\/code>, with a size cap and LRU eviction driven by a small index.<\/strong><\/p><ul><li><strong>Encoded, not decoded.<\/strong> Bytes are 10–50× smaller than the bitmap, and decoding is cheap next to the network. Storing bitmaps trades a lot of disk for a little CPU — the wrong direction on a phone.<\/li><li><strong>Atomic writes.<\/strong> Write to a temp file and rename (<code><span class=\"t-typ\">Data<\/span>.write(to:options: .atomic)<\/code>), so a kill mid-write leaves the old file or nothing, never a truncated JPEG that fails forever.<\/li><li><strong>LRU needs its own index.<\/strong> File access dates aren't a dependable \"recently used\" signal, so keep <code>hash → (bytes, lastAccess, etag)<\/code> in a small file or SQLite, updated in memory and flushed in batches.<\/li><li><strong>Sweep off the launch path.<\/strong> Enforce the cap (150–300 MB) on background entry or a low-priority task, never during start-up.<\/li><li><strong><code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span><\/code> is not backed up and the system may purge it<\/strong> — correct for a cache, and the code must treat any file as possibly gone.<\/li><\/ul><p><em>Alternative rejected: <code><span class=\"t-typ\">URLCache<\/span><\/code>.<\/em> Free, handles HTTP semantics, and Nuke's default loader leans on it. It loses here because it obeys the server: a CDN sending <code>max-age=<span class=\"t-num\">300<\/span><\/code> means \"offline after five minutes\", which breaks functional requirement 3. It also gives no control over eviction, can't purge one URL, and covers network sources only. <em>Switch condition:<\/em> if you control the cache headers and offline display isn't required, <code><span class=\"t-typ\">URLCache<\/span><\/code> with a large <code>diskCapacity<\/code> is the better answer — less code, correct revalidation for free. Say that it's a judgement call, not a rule.<\/p><p><strong>Revalidation.<\/strong> Store the <code><span class=\"t-typ\">ETag<\/span><\/code>; past a freshness window, show the disk copy immediately and revalidate in the background with <code><span class=\"t-typ\">If<\/span>-<span class=\"t-typ\">None<\/span>-<span class=\"t-typ\">Match<\/span><\/code>. A 304 just touches the index. Stale-while-revalidate, client-side.<\/p><\/div><\/details><details class=\"reveal\"><summary>9 · Failure modes and 10×<\/summary><div class=\"reveal-body\"><ul><li><strong>Offline.<\/strong> Disk hits work; misses fail fast with a typed error the view maps to a placeholder. Don't retry into a dead network — watch <code><span class=\"t-typ\">NWPathMonitor<\/span><\/code> and let the view re-request when the path returns.<\/li><li><strong>Errors and retries.<\/strong> One retry with jittered backoff for transient failures (timeout, connection lost, 5xx); none for 4xx. Remember 404s briefly in memory so a broken URL isn't refetched on every scroll.<\/li><li><strong>Races.<\/strong> Duplicate work: the in-flight dictionary. Late result into a reused cell: the current-request check.<\/li><li><strong>Corrupt bytes.<\/strong> Decode returns nil → delete the disk entry, refetch once, then give up. Never loop on a file that will never decode.<\/li><li><strong>Memory pressure.<\/strong> Memory warning purges the cache; in-flight decodes for visible cells finish. MetricKit's exit reasons tell you if you're being killed in the field; the first knob is the budget, the second the width buckets.<\/li><li><strong>Killed mid-operation.<\/strong> Atomic writes keep the disk consistent; the index may lag, so the next sweep reconciles — orphan files deleted, entries without files dropped.<\/li><li><strong>Low Data Mode.<\/strong> Prefetches set <code>allowsConstrainedNetworkAccess = <span class=\"t-kw\">false<\/span><\/code> and simply don't run on a constrained path; visible requests still load at a smaller bucket. A failure with <code>networkUnavailableReason == .constrained<\/code> becomes tap-to-load.<\/li><li><strong>Too many requests at once.<\/strong> A fling issues dozens. Cap per-host connections and give visible requests priority over prefetches; decodes run on the cooperative pool, already sized to the cores.<\/li><\/ul><p><strong>At 10×<\/strong> — ten times denser grid, or ten times more images per session:<\/p><ul><li>Memory: the budget is fixed by the device, so hit rate falls. Smaller buckets for thumbnails; cache fewer sizes per URL.<\/li><li>Disk: the index moves to SQLite so eviction is a query rather than a full load.<\/li><li>CPU: decode becomes the bottleneck on older devices. Prefetch decodes one screenful ahead, bytes further ahead.<\/li><li>Bandwidth: the CDN width parameter carries almost all of it. The client's job is to ask for the smallest bucket that still looks sharp.<\/li><\/ul><\/div><\/details><details class=\"reveal\"><summary>10 · Rapid fire — the follow-ups<\/summary><div class=\"reveal-body\"><ol start=\"1\"><li><strong>\"Why not just use <code><span class=\"t-typ\">AsyncImage<\/span><\/code>?\"<\/strong> → No memory cache you control, no downsampling, no prefetch, no dedupe across views. Fine for a settings screen, not a feed.<\/li><li><strong>\"Same URL on screen at two sizes — what happens?\"<\/strong> → One download (data key is the URL), two decodes and two memory entries (image key includes size), one copy on disk.<\/li><li><strong>\"A cell scrolls away. What exactly gets cancelled?\"<\/strong> → Its subscription. The shared task only when the count hits zero — optionally let the download finish into disk and cancel only the decode.<\/li><li><strong>\"These are medical scans. What changes?\"<\/strong> → Ask whether caching is permitted at all; then no disk cache, or <code>.completeFileProtection<\/code>; purge memory on background; no third-party CDN caching; encrypt at rest with a Keychain key if it stays.<\/li><li><strong>\"How do you test the dedupe?\"<\/strong> → A loader double whose response is held open by the test: fire two requests, assert one load call, release, assert both callers got the same image. Count <code><span class=\"t-typ\">Task<\/span>.yield()<\/code>s, never sleep.<\/li><li><strong>\"How do you know it's working in production?\"<\/strong> → <code>os_signpost<\/code> around load and decode, hit-rate counters for both caches, MetricKit for hangs and memory-pressure exits, and the cache budget behind a remote flag.<\/li><li><strong>\"Why is <code><span class=\"t-typ\">ImagePipeline<\/span><\/code> an actor and not a class with a lock?\"<\/strong> → The coordination is async by nature (it awaits loads), and a lock can't be held across an <code><span class=\"t-kw\">await<\/span><\/code>. The actor gives serialised bookkeeping without blocking a pool thread.<\/li><li><strong>\"What would you cut if you had two days instead of two weeks?\"<\/strong> → Memory cache + downsampling + cancel-on-reuse. Those three carry the smoothness and the crashes. Disk cache, prefetch and dedupe come next, in that order.<\/li><\/ol><\/div><\/details><details class=\"reveal\"><summary>11 · Scorecard — mark yourself, 0 / 1 / 2<\/summary><div class=\"reveal-body\"><p>The public exercise this prompt comes from lists what the interviewer grades: clear communication, requirement clarification, practical trade-off analysis, honestly acknowledging what you don't know, and balancing engineering quality against timelines. Those are the first five rows; the rest are specific to this question.<\/p><div class=\"scroll\"><table><thead><tr><th><\/th><th>Did you…<\/th><th>0–2<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Narrate continuously, and listen when interrupted<\/td><td><\/td><\/tr><tr><td>2<\/td><td>Clarify before designing, and state your assumptions<\/td><td><\/td><\/tr><tr><td>3<\/td><td>Attach a rejected alternative and a switch condition to each choice<\/td><td><\/td><\/tr><tr><td>4<\/td><td>Say plainly where your knowledge ends<\/td><td><\/td><\/tr><tr><td>5<\/td><td>Name a smaller version that would be enough (<code><span class=\"t-typ\">AsyncImage<\/span><\/code>, <code><span class=\"t-typ\">NSCache<\/span><\/code>)<\/td><td><\/td><\/tr><tr><td>6<\/td><td>Say out of scope <strong>first<\/strong><\/td><td><\/td><\/tr><tr><td>7<\/td><td>Name the memory ↔ disk ↔ CPU ↔ bandwidth axis<\/td><td><\/td><\/tr><tr><td>8<\/td><td>Give the decoded-bitmap cost formula<\/td><td><\/td><\/tr><tr><td>9<\/td><td>Use two keys: URL for bytes, URL + size for images<\/td><td><\/td><\/tr><tr><td>10<\/td><td>Dedupe in-flight work, and handle cancellation with sharing<\/td><td><\/td><\/tr><tr><td>11<\/td><td>Keep decode off the main actor, explicitly<\/td><td><\/td><\/tr><tr><td>12<\/td><td>Land the recap inside 60 seconds<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p>12+ is a pass in a real round.A zero is worth more than the total: it names the thing to read about before the next one.:::<\/p><details class=\"reveal\"><summary>12 · The 60-second recap<\/summary><div class=\"reveal-body\"><p>An image library is a set of caches trading memory, disk, CPU and bandwidth. A request carries a URL and the pixel size it will be shown at. An actor-owned pipeline checks a memory cache keyed by URL plus size, then joins any in-flight task for that key so nothing loads twice. On a miss, bytes come from a disk cache keyed by URL alone, or from the network. Decoding happens off the main actor and straight to display size, because a decoded bitmap costs width × height × 4 bytes whatever the file size. The memory cache is an LRU with a byte budget that empties on memory warnings; the disk cache holds encoded bytes with atomic writes and its own index, rather than trusting <code><span class=\"t-typ\">URLCache<\/span><\/code>, because offline display can't depend on the server's cache headers. Cell reuse is cancellation: a view cancels its subscription, shared work stops only when nobody is waiting, and a late result is dropped if the cell has moved on. Four types — loader, decoder, cache, pipeline — because each has its own reason to change, and everything crosses a protocol so the pipeline can be tested with doubles.<\/p><\/div><\/details><\/div><\/details>", "text": " a recurring senior mobile prompt in first hand interview reports. the public exercise interviewers draw their wording from is weeebox's image library brief, which also publishes the grading criteria used below. interviewer: \"we show a lot of images — feeds, avatars, a photo grid. i'd like you to design the image loading library we'd build for that. something in the spirit of kingfisher or nuke. where would you start?\" run it as a round, not as reading set a timer. stand up. sketch on paper or an ipad. talk the whole time — silence is the thing that fails these rounds. do not open a section until its slot is over. clock phase what you do 0:00–0:02 the prompt repeat it back in one sentence and say what you're going to do with the time 0:02–0:07 clarify ask; then open section 1 only after you've asked yours, and take its answers as the interviewer's 0:07–0:12 scope out of scope first, then 3–5 functional, then the non functional ones that matter 0:12–0:24 high level the boxes, the flow, the api and the keys 0:24–0:40 deep dives the interviewer picks; sections 6–8 are the three they pick from 0:40–0:45 follow ups and recap rapid fire, then the 60 second summary what this question is really testing it looks like a question about caching. it isn't, quite. can you find the axis? every decision here trades memory ↔ disk ↔ cpu ↔ bandwidth . a candidate who names that axis in the first five minutes has already passed the framing part. do you know what a decoded image costs? width × height × 4 bytes, regardless of file size. everything about memory follows from that one fact, and it's the most common gap. can you design components with reasons? they will ask why these types and not fewer. this is where solid earns its keep — not as vocabulary, but as four or five sentences about what would change and what wouldn't. do you think about the same image twice? two cells, one url. dedupe of in flight work is the concurrency content of this question and the thing most answers miss. do you know when to stop? asyncimage and nscache are legitimate answers for a small app. saying so, with the condition attached, reads as senior. building a pipeline for a settings screen does not. traps: drifting into cdn and backend design; describing a cache with no eviction; forgetting cancellation entirely; naming kingfisher's features instead of designing; decoding on the main actor without noticing. ::: 1 · the interviewer answers your clarifying questions ask yours first. these are the answers you'd get, and the assumptions the rest of this chapter runs on. \"is this a library for one app, or an sdk other teams adopt?\" → one app to start, but shaped so it could be extracted as a package later. \"where do images come from — network only?\" → network mostly, but also files on disk and a few bundled assets. the public version of this exercise wants all three. \"who consumes them? views only, or code too?\" → uiimageview and swiftui, and occasionally non ui code that wants the image to share or export. \"what's the heaviest screen?\" → a grid of thumbnails you can fling through, plus full screen detail views. \"can the server resize? is there a cdn with a width parameter?\" → yes, assume ?w= works and the cdn sends etag and cache control . \"do images need to show offline?\" → yes. anything the user has seen should still appear with no network. \"anything sensitive in these images?\" → not today. ask me again at the end. (they will.) \"what are we optimising — smoothness, data, battery?\" → scrolling must stay smooth on a three year old phone, and we've had memory pressure kills in the field. ::: ::: 2 · requirements and scope — what you should have said out of scope, stated first, before any design: animated gif/apng playback, video thumbnails, editing and filters beyond resize, placeholder and transition animations (the caller owns those), plug in loaders for arbitrary formats, and everything server side beyond \"there is a cdn with a width parameter\". progressive jpeg is a stretch goal if time allows. functional — five, no more 1. load an image by url from network, file or bundle, into a view or back to a caller. 2. downsample to the size it will actually be displayed at. 3. cache in memory and on disk; previously seen images appear offline. 4. cancel automatically when a view stops needing the image — cell reuse, disappearance. 5. prefetch ahead of the scroll position. non functional that matter here memory — decoded bitmaps are what gets the app killed. budget them explicitly. main thread time — no decode and no disk i/o on the main actor; the scroll holds its frame rate. bandwidth and battery — never fetch the same bytes twice; honour low data mode. correctness — a reused cell never shows another row's image. testability — every i/o boundary behind a protocol. then say the axis out loud: \"everything from here is memory against disk against cpu against bandwidth. i'll keep naming which one each choice spends.\" ::: ::: 3 · the design, on the whiteboard diagram <figure class=\"dg\" <figcaption one request, four layers, two cache keys<\/figcaption <div class=\"dg row\" <span class=\"dg lane\" call site<\/span <div class=\"dg nodes\" <div class=\"dg node\" <b uiimageview.setimage<\/b <span @mainactor · cancels on reuse<\/span <\/div <div class=\"dg node\" <b lazyimage<\/b <span swiftui · .task(id: request)<\/span <\/div <div class=\"dg node ghost\" <b any async caller<\/b <span share sheet, export<\/span <\/div <\/div <\/div <div class=\"dg flow\" imagerequest(url, pixel size, priority)<\/div <div class=\"dg row\" <span class=\"dg lane\" pipeline<\/span <div class=\"dg nodes\" <div class=\"dg node accent\" <b imagepipeline · actor<\/b <span look up, join in flight work, or start one<\/span <\/div <\/div <\/div <div class=\"dg row\" <span class=\"dg lane\" owns<\/span <div class=\"dg nodes\" <div class=\"dg node\" <b memorycache<\/b <span key: url + pixel size · lru with a byte budget<\/span <\/div <div class=\"dg node\" <b inflight[imagekey]<\/b <span task + how many callers are waiting<\/span <\/div <\/div <\/div <div class=\"dg flow\" memory miss → ask for bytes, keyed by url alone<\/div <div class=\"dg row\" <span class=\"dg lane\" data<\/span <div class=\"dg nodes\" <div class=\"dg node\" <b dataloader<\/b <span dedupes downloads by url<\/span <\/div <div class=\"dg node\" <b diskcache<\/b <span encoded bytes · sha 256 filename · lru index + etag<\/span <\/div <\/div <\/div <div class=\"dg flow\" disk miss<\/div <div class=\"dg row\" <span class=\"dg lane\" sources<\/span <div class=\"dg nodes\" <div class=\"dg node warm\" <b urlsession → cdn<\/b <span ?w= bucket · etag · low data mode<\/span <\/div <div class=\"dg node\" <b file / bundle<\/b <span same protocol, no network<\/span <\/div <\/div <\/div <div class=\"dg flow up\" bytes<\/div <div class=\"dg row\" <span class=\"dg lane\" decode<\/span <div class=\"dg nodes\" <div class=\"dg node accent\" <b imagedecoder · @concurrent<\/b <span downsample straight to pixel size, decode eagerly<\/span <\/div <\/div <\/div <div class=\"dg flow up\" uiimage → memory cache → every caller waiting on this key<\/div <p class=\"dg note\" the two keys are the point: bytes are the same at any display size, a decoded bitmap is not.<\/p <div class=\"dg legend\" <span accent · owns concurrency<\/span <span warm · crosses the network<\/span <span dashed · optional caller<\/span <\/div <\/figure narrate it in one pass: a request carries a url and the pixel size it will be shown at. the pipeline checks the memory cache under url + size; a hit returns in the same frame. on a miss it looks for an in flight task for that key and joins it instead of starting a second one. otherwise it asks for bytes — disk first, then network, deduplicated by url alone — hands them to the decoder, which downsamples off the main actor, stores the result and gives it to everyone waiting. only the final assignment to the view is main actor work. ::: ::: 4 · the types, and the reasons behind them — solid out loud they will ask \"why these types and not one imagemanager ?\" . the answer is five sentences about change, not five principle names. name the principle after the reason, if at all. diagram <figure class=\"dg\" <figcaption what depends on what — protocols in the middle, concretes at the edges<\/figcaption <div class=\"dg group\" <p class=\"dg group label\" composition root — the only place concrete types are named<\/p <div class=\"dg split\" <div class=\"dg node ghost\" <b urlsessiondataloader<\/b <span network bytes<\/span <\/div <div class=\"dg node ghost\" <b filedataloader<\/b <span disk / bundle bytes<\/span <\/div <div class=\"dg node ghost\" <b imageiodecoder<\/b <span downsample + decode<\/span <\/div <div class=\"dg node ghost\" <b lrumemorycache<\/b <span byte budget<\/span <\/div <\/div <\/div <div class=\"dg flow up\" injected once, at start up<\/div <div class=\"dg row\" <span class=\"dg lane\" seams<\/span <div class=\"dg nodes\" <div class=\"dg node accent\" <b imagedataloadertype<\/b <span data(for:) async throws<\/span <\/div <div class=\"dg node accent\" <b imagedecodertype<\/b <span image(from:to:) async throws<\/span <\/div <div class=\"dg node accent\" <b imagecachetype<\/b <span get / set / removeall<\/span <\/div <\/div <\/div <div class=\"dg flow up\" depends only on these<\/div <div class=\"dg row\" <span class=\"dg lane\" policy<\/span <div class=\"dg nodes\" <div class=\"dg node\" <b imagepipeline<\/b <span coordination: keys, dedupe, cancellation, cache writes<\/span <\/div <\/div <\/div <\/figure single responsibility — say it as \"what would make each of these change\". the loader changes when the transport changes. the decoder changes when the format or the downsampling strategy changes. the cache changes when the eviction policy changes. the pipeline changes when the coordination rules change — dedupe, cancellation, which cache to consult first. four reasons, four types. one imagemanager would be touched by all four, which is why it becomes the file nobody wants to review. open–closed, concretely. adding a source — bundle assets today, the photos framework tomorrow, base64 data urls for tests — is a new conformance to imagedataloadertype and a line in the composition root. no switch inside the pipeline grows. that's the practical form of the principle: new behaviour by composition, not by editing the coordinator. liskov, in the form it actually bites on ios. every loader must honour the same contract: it throws cancellationerror when cancelled, it never returns half the bytes, and it is safe to call concurrently. a file loader that quietly ignores cancellation satisfies the compiler and breaks every caller written against the protocol. contracts in a protocol are behaviour, not just signatures — which is why the protocol's documentation comment says those three things, and why the same test suite runs against every conformance. interface segregation. imagepipelinetype has three methods. prefetching lives in its own imageprefetchingtype , so a detail screen that shows one image doesn't depend on — or have to fake — prefetch. the test is the doubles: if a mock needs twelve methods to test one, the protocol is too fat. dependency inversion. the pipeline depends on protocols; urlsession , imageio and the file system are injected at the composition root. in swift this mostly looks like taking protocols in init , and its payoff is concrete: the dedupe test in section 6 needs a loader whose response is held open by the test, which is impossible if the pipeline constructs a urlsession itself. and the honest caveat, which is worth saying in the room: solid came from a world of class hierarchies. on ios, half of it shows up as value types and protocol witnesses rather than inheritance, and taken too far srp gives you thirty one method types nobody can navigate. \"i split where a reason to change differs, not per noun.\" ::: ::: 5 · api and the two keys the server contract. nothing of our own. get https://img.example.com/{id}?w={pixels} , with etag and cache control . the client rounds width up into buckets — 160, 320, 640, 1280 — so neighbouring sizes share a cdn entry and a disk entry. public api — three entry points over one pipeline swift struct imagerequest: hashable, sendable { let url: url let targetpixelsize: cgsize? // nil = full size let priority: priority // .verylow ... .high let allowsconstrainednetwork: bool } protocol imagepipelinetype: sendable { func image(for request: imagerequest) async throws uiimage } protocol imageprefetchingtype: sendable { func prefetch(_ requests: [imagerequest]) func cancelprefetch(_ requests: [imagerequest]) } extension uiimageview { // thin, @mainactor @mainactor func setimage(_ request: imagerequest?) } struct lazyimage: view { init(request: imagerequest) } // .task(id: request) async throws is the core and the view helpers are thin, for three reasons: cancellation comes free from task cancellation, non ui callers use the same path, and tests call it directly with no view in sight. the two keys — the detail most answers miss swift struct datakey: hashable { let url: url } // disk + network struct imagekey: hashable { let url: url; let pixelsize: cgsize? } // memory + decode bytes don't depend on display size, so downloads and disk entries dedupe on the url. a decoded bitmap is only reusable at the size it was decoded for, so the memory cache and in flight decodes key on url + size. two cells showing one avatar at 80 pt and 300 pt share a download and get two decodes. local model. memory: imagekey → (uiimage, cost) . disk: files in library/caches/images/ named by the sha 256 hex of the url, plus a small index — hash → (bytecount, lastaccess, etag) — for eviction and revalidation. ::: ::: 6 · deep dive — \"two cells show the same avatar. walk me through it.\" decision: an actor holds a dictionary of in flight task s keyed by imagekey ; callers join; the work is cancelled only when the last subscriber leaves. swift actor imagepipeline: imagepipelinetype { private var inflight: [imagekey: entry] = [:] private struct entry { let task: task<uiimage, error ; var subscribers: int } func image(for request: imagerequest) async throws uiimage { let key = imagekey(request) if let hit = memory.value(for: key) { return hit } let task: task<uiimage, error if var entry = inflight[key] { // join, don't restart entry.subscribers += 1; inflight[key] = entry; task = entry.task } else { task = task { try await load(key, request) } inflight[key] = entry(task: task, subscribers: 1) } return try await withtaskcancellationhandler { try await task.value } oncancel: { task { await self.unsubscribe(key) } // last one out cancels } } } the lookup and the insert happen with no await between them, so they're atomic on the actor. that's the entire trick. the naive version — check the cache, await the download, insert — lets two callers both miss and both download, because an actor is re entrant at every await . storing the task rather than the result closes the window. the task must also remove its entry when it finishes, success or failure, or one failed load poisons that key forever. alternative rejected: cancel the shared work when any caller cancels. simpler and wrong — cell a scrolls away and kills the download cell b is still waiting for. alternative rejected: never cancel shared work. wastes bandwidth exactly during a fast fling, when requests pile up. switch condition: if profiling showed duplicate urls are rare on screen, the subscriber count is complexity for nothing; plain per caller cancellation is fine. a nice middle: on last unsubscribe let the download finish into the disk cache and cancel only the decode . where each piece runs. setimage is @mainactor and reads the memory cache synchronously, so a hit paints in the same frame with no flicker. the pipeline actor does bookkeeping only — it must never decode, or every decode in the app serialises behind one executor. decoding is @concurrent , because since se 0461 a plain nonisolated async function runs on the caller's actor: \"it's async\" no longer means \"it's off the main thread\", so the hop has to be asked for. cell reuse is a cancellation problem, not a caching one. setimage keeps the current task on the view; a new call or prepareforreuse cancels it. on completion the view checks the request it finished for is still its current one, because cancellation is cooperative and a late result can still arrive. that check is what stops the wrong image in a reused cell bug. swiftui's .task(id: request) gives you both behaviours for free. ::: ::: 7 · deep dive — \"this grid gets the app killed on an iphone 12. why?\" the fact the rest rests on: memory cost comes from pixel dimensions, not file size. a decoded 8 bit rgba bitmap costs width × height × 4 bytes. a 4032 × 3024 photo that's 2 mb as a jpeg is about 49 mb decoded. twenty of those at full size is the kill. decision: decode straight to display size with imageio; never decode full size and then scale. swift @concurrent func downsample(_ data: data, to maxpixelsize: cgfloat) cgimage? { let source = cgimagesourcecreatewithdata( data as cfdata, [kcgimagesourceshouldcache: false] as cfdictionary)! let options: [cfstring: any] = [ kcgimagesourcecreatethumbnailfromimagealways: true, kcgimagesourceshouldcacheimmediately: true, // decode here, off main kcgimagesourcecreatethumbnailwithtransform: true, // honour exif orientation kcgimagesourcethumbnailmaxpixelsize: maxpixelsize, ] return cgimagesourcecreatethumbnailatindex(source, 0, options as cfdictionary) } shouldcache: false stops imageio holding a full size decode; shouldcacheimmediately forces the decode to happen here rather than lazily at first render on the main thread. that pair is the difference between a smooth scroll and a hitch. alternative rejected: redrawing through uigraphicsimagerenderer — it decodes the full image first, so peak memory is the full bitmap. also available: uiimage.bypreparingthumbnail(ofsize:) and bypreparingfordisplay() (ios 15) do this with far less code. switch condition: if you don't need exif transform control or exotic formats, use them and own less code. sizes must be in pixels — points × displayscale — which is why the request carries a pixel size the view computes. decision: a custom lru memory cache with a byte budget , costed by bytesperrow × height of the decoded image. budget a fraction of what the process may use (sample os_proc_available_memory() at launch, take 15–20%, cap it). purge on didreceivememorywarningnotification ; trim on background. alternative rejected: nscache . thread safe, reacts to memory pressure by itself, and an entirely respectable answer. its costs: eviction order is undocumented, you can't enumerate it to purge one url at every size, and it's widely observed to empty itself on backgrounding — behaviour that isn't documented, so you can't design around it. switch condition: one image screen, no need to purge by url → nscache with a totalcostlimit , and say so out loud. \"why cache decoded images at all, when the disk has the bytes?\" because a disk read plus a decode is milliseconds of cpu per image, and scrolling back up the feed must paint in the same frame. memory buys cpu and smoothness — the axis again. ::: ::: 8 · deep dive — \"why not just use urlcache?\" decision: own a disk cache of encoded bytes, keyed by sha 256 of the url, in library/caches , with a size cap and lru eviction driven by a small index. encoded, not decoded. bytes are 10–50× smaller than the bitmap, and decoding is cheap next to the network. storing bitmaps trades a lot of disk for a little cpu — the wrong direction on a phone. atomic writes. write to a temp file and rename ( data.write(to:options: .atomic) ), so a kill mid write leaves the old file or nothing, never a truncated jpeg that fails forever. lru needs its own index. file access dates aren't a dependable \"recently used\" signal, so keep hash → (bytes, lastaccess, etag) in a small file or sqlite, updated in memory and flushed in batches. sweep off the launch path. enforce the cap (150–300 mb) on background entry or a low priority task, never during start up. library/caches is not backed up and the system may purge it — correct for a cache, and the code must treat any file as possibly gone. alternative rejected: urlcache . free, handles http semantics, and nuke's default loader leans on it. it loses here because it obeys the server: a cdn sending max age=300 means \"offline after five minutes\", which breaks functional requirement 3. it also gives no control over eviction, can't purge one url, and covers network sources only. switch condition: if you control the cache headers and offline display isn't required, urlcache with a large diskcapacity is the better answer — less code, correct revalidation for free. say that it's a judgement call, not a rule. revalidation. store the etag ; past a freshness window, show the disk copy immediately and revalidate in the background with if none match . a 304 just touches the index. stale while revalidate, client side. ::: ::: 9 · failure modes and 10× offline. disk hits work; misses fail fast with a typed error the view maps to a placeholder. don't retry into a dead network — watch nwpathmonitor and let the view re request when the path returns. errors and retries. one retry with jittered backoff for transient failures (timeout, connection lost, 5xx); none for 4xx. remember 404s briefly in memory so a broken url isn't refetched on every scroll. races. duplicate work: the in flight dictionary. late result into a reused cell: the current request check. corrupt bytes. decode returns nil → delete the disk entry, refetch once, then give up. never loop on a file that will never decode. memory pressure. memory warning purges the cache; in flight decodes for visible cells finish. metrickit's exit reasons tell you if you're being killed in the field; the first knob is the budget, the second the width buckets. killed mid operation. atomic writes keep the disk consistent; the index may lag, so the next sweep reconciles — orphan files deleted, entries without files dropped. low data mode. prefetches set allowsconstrainednetworkaccess = false and simply don't run on a constrained path; visible requests still load at a smaller bucket. a failure with networkunavailablereason == .constrained becomes tap to load. too many requests at once. a fling issues dozens. cap per host connections and give visible requests priority over prefetches; decodes run on the cooperative pool, already sized to the cores. at 10× — ten times denser grid, or ten times more images per session: memory: the budget is fixed by the device, so hit rate falls. smaller buckets for thumbnails; cache fewer sizes per url. disk: the index moves to sqlite so eviction is a query rather than a full load. cpu: decode becomes the bottleneck on older devices. prefetch decodes one screenful ahead, bytes further ahead. bandwidth: the cdn width parameter carries almost all of it. the client's job is to ask for the smallest bucket that still looks sharp. ::: ::: 10 · rapid fire — the follow ups 1. \"why not just use asyncimage ?\" → no memory cache you control, no downsampling, no prefetch, no dedupe across views. fine for a settings screen, not a feed. 2. \"same url on screen at two sizes — what happens?\" → one download (data key is the url), two decodes and two memory entries (image key includes size), one copy on disk. 3. \"a cell scrolls away. what exactly gets cancelled?\" → its subscription. the shared task only when the count hits zero — optionally let the download finish into disk and cancel only the decode. 4. \"these are medical scans. what changes?\" → ask whether caching is permitted at all; then no disk cache, or .completefileprotection ; purge memory on background; no third party cdn caching; encrypt at rest with a keychain key if it stays. 5. \"how do you test the dedupe?\" → a loader double whose response is held open by the test: fire two requests, assert one load call, release, assert both callers got the same image. count task.yield() s, never sleep. 6. \"how do you know it's working in production?\" → os_signpost arou", "outline": [{"a": "run-it-as-a-round-not-as-reading", "t": "Run it as a round, not as reading"}, {"a": "what-this-question-is-really-testing", "t": "What this question is really testing"}]}], "minutes": 56, "sources": [{"ref": "", "label": "weeeBox
