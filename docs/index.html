th the highest\" — a top k selection. the textbook tool for top k is a heap of size k, but there is a sharper observation here: a count can never be larger than n. so the counts themselves can be used as array positions, and no comparison based sort is needed at all. ::: ::: approach first, walk the numbers once and count each value in a dictionary. then make a row of n + 1 empty buckets, one for each possible count from 0 to n, and drop each value into the bucket that matches its count. finally, walk the buckets from the highest count down, collecting values until you have k of them. time o(n): one pass to count, one pass over the distinct values to fill buckets, one pass down the buckets. space o(n) for the dictionary and the buckets. the alternatives, so you can say why not: sorting the distinct values by count is o(d log d) for d distinct values — fine, and easier to write correctly, so it is a sound first answer. a min heap of size k is o(n log k), the right tool when the numbers arrive as a stream and you can't hold them all. ::: ::: swift solution swift func topkfrequent(_ numbers: [int], _ k: int) [int] { var countbyvalue: [int: int] = [:] for number in numbers { countbyvalue[number, default: 0] += 1 } // buckets[c] holds every value that appears exactly c times. var buckets = array(repeating: [int](), count: numbers.count + 1) for (value, count) in countbyvalue { buckets[count].append(value) } var result: [int] = [] for count in stride(from: numbers.count, through: 1, by: 1) { for value in buckets[count] { result.append(value) if result.count == k { return result } } } return result } the sort based version, which is a perfectly good first answer before you optimise: swift func topkfrequentsorted(_ numbers: [int], _ k: int) [int] { var countbyvalue: [int: int] = [:] for number in numbers { countbyvalue[number, default: 0] += 1 } return array(countbyvalue.sorted { $0.value $1.value }.prefix(k).map(\\.key)) } verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus five more — every value the same ( [5, 5, 5] , k 1), k equal to the number of distinct values ( [1, 2, 3] , k 3), a close race where 2 appears four times and 0 three times (k 1), negatives and zero together (k 3), and counts of 1, 2 and 3 where the walk must stop after two values. ::: ::: walk it through [4, 4, 4, 7, 7, 9] , k = 2 step state count 4: 3, 7: 2, 9: 1 buckets (0…6) [3] = [4] , [2] = [7] , [1] = [9] , the rest empty walk from 6 down 6, 5, 4 empty · 3 → take 4 · 2 → take 7, now 2 values, stop answer [4, 7] . [6] , k = 1 — count 6: 1 , buckets has two slots, [1] = [6] . the walk starts at 1, takes 6, stops. nothing special needed; the numbers.count + 1 size is exactly what makes a count of n fit. ::: ::: the swift trap there is no heap in the standard library. the answer most people have memorised — \"min heap of size k\" — is not writable in a shared editor without swift collections , and writing a heap from scratch eats half your 20 minutes. say the heap answer and its o(n log k), then write the bucket version or the sort. saying why you aren't writing the heap is a senior signal, not a gap. smaller one, in the sort version: prefix(k) on an array returns an arrayslice , not an array , and a slice keeps its parent's indices — a slice that starts at position 3 has startindex == 3 , so slice[0] traps. wrap it in array(...) before returning or indexing. and if there were ties at the cut off, dictionary iteration order is randomised per process, so which tied value you return would change between runs. this problem rules ties out; say you noticed. ::: ::: what they ask next \"the numbers arrive as a stream too big for memory.\" → keep the counts (or an approximate counter such as count min sketch if even that's too big) and a min heap of size k; each update is o(log k). \"return them ordered, most frequent first.\" → the bucket walk already produces that order; the sort version too. state the tie break rule you'd use if ties were allowed — say, smaller value first. \"top k most frequent words, ties broken alphabetically.\" → same count, then sort by (count descending, word ascending) . the bucket trick still works if you sort inside each bucket. ::: ", "outline": []}, {"slug": "longest-consecutive-sequence", "title": "4 · Longest Consecutive Sequence", "summary": "Given an unsorted list of whole numbers, find how long the longest unbroken run of consecutive values is.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 128 · Longest Consecutive Sequence", "url": "https://leetcode.com/problems/longest-consecutive-sequence/"}, {"ref": "", "label": "Swift standard library · Set", "url": "https://developer.apple.com/documentation/swift/set"}, {"ref": "", "label": "The Swift Programming Language · Overflow Operators", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/advancedoperators/#Overflow-Operators"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get an unsorted array of integers. A run is a set of values that follow each other with no gap — 7, 8, 9, 10 — wherever they sit in the array. Return the length of the longest run. Repeated values count once. The interviewer wants it in O(n) time, which rules out sorting first.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>Answer<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">31<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">30<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">32<\/span>]<\/code><\/td><td><code><span class=\"t-num\">4<\/span><\/code><\/td><td>2, 3, 4, 5 — longer than 30, 31, 32<\/td><\/tr><tr><td><code>[]<\/code><\/td><td><code><span class=\"t-num\">0<\/span><\/code><\/td><td>no numbers, no run<\/td><\/tr><tr><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td>the second 2 adds nothing<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 100,000 numbers; values from −10⁹ to 10⁹. The array is not sorted and you must not rely on position — the run is about values, not neighbours in the array.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Hash set.<\/strong> The cue is <em>\"unsorted\"<\/em> combined with <em>\"O(n)\"<\/em>. Sorting would make the runs obvious but costs O(n log n), so you need another way to ask \"is the next value present?\" in constant time — that question is a set lookup.<\/p><p>The trick that keeps it linear: only start counting a run from its <strong>bottom<\/strong>. A value is the bottom of a run if the value one below it is <em>not<\/em> in the set. Every other value is skipped, so each run is walked exactly once.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Put every number into a set, which also removes repeats. Then look at each value in the set. If the value one less is also in the set, this value is in the middle of a run — skip it. Otherwise it starts a run: step upward one value at a time while the next value is in the set, and count the steps. Keep the longest count you have seen.<\/p><p>Time O(n): building the set is O(n); the outer loop visits each value once; the inner walk only runs from run starts, and every value is walked over by at most one of those — so the inner steps add up to n in total, not n per value. Space O(n) for the set.<\/p><p>Sorting and scanning is O(n log n) and O(1) extra — say it as the fallback, and why the problem forbids it.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> longestConsecutive(_ numbers: [<span class=\"t-typ\">Int<\/span>]) -&gt; <span class=\"t-typ\">Int<\/span> {\n    <span class=\"t-kw\">let<\/span> seen = <span class=\"t-typ\">Set<\/span>(numbers)\n    <span class=\"t-kw\">var<\/span> longest = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">for<\/span> start <span class=\"t-kw\">in<\/span> seen {\n        <span class=\"t-com\">// Only start counting at the bottom of a run.<\/span>\n        <span class=\"t-kw\">if<\/span> start &gt; .min, seen.contains(start - <span class=\"t-num\">1<\/span>) { <span class=\"t-kw\">continue<\/span> }\n\n        <span class=\"t-kw\">var<\/span> end = start\n        <span class=\"t-kw\">while<\/span> end &lt; .max, seen.contains(end + <span class=\"t-num\">1<\/span>) {\n            end += <span class=\"t-num\">1<\/span>\n        }\n        longest = max(longest, end - start + <span class=\"t-num\">1<\/span>)\n    }\n    <span class=\"t-kw\">return<\/span> longest\n}<\/code><\/pre><\/div><p>The <code>start &gt; .min<\/code> and <code>end &lt; .max<\/code> guards look fussy; the trap below explains why they are there. Within the stated constraints you can leave them out and say so.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above plus six more — a single value, the same value three times, a run crossing zero (<code>-<span class=\"t-num\">2<\/span> … <span class=\"t-num\">1<\/span><\/code>), values sitting at <code><span class=\"t-typ\">Int<\/span>.max<\/code> and <code><span class=\"t-typ\">Int<\/span>.min<\/code> (which crash the unguarded version), no two values adjacent, and a run of five given in descending order.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">31<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">30<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">32<\/span>]<\/code><\/strong><\/p><p>The set holds 2, 3, 4, 5, 30, 31, 32 (in whatever order Swift picks — it doesn't matter).<\/p><div class=\"scroll\"><table><thead><tr><th>Value<\/th><th>One below in set?<\/th><th>Action<\/th><th>Longest<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>1 — no<\/td><td>walk 3, 4, 5, stop at 6 → length 4<\/td><td>4<\/td><\/tr><tr><td>3, 4, 5<\/td><td>yes<\/td><td>skip<\/td><td>4<\/td><\/tr><tr><td>30<\/td><td>29 — no<\/td><td>walk 31, 32, stop at 33 → length 3<\/td><td>4<\/td><\/tr><tr><td>31, 32<\/td><td>yes<\/td><td>skip<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div><p>Seven values, seven checks in the outer loop, five steps in total in the inner walks. Answer 4.<\/p><p><strong><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/strong> — the set is {1, 2, 3}. 1 starts a run, walks to 3, length 3. The duplicate never reaches the loop, which is why iterating the set rather than the array matters: with the array, a value repeated a thousand times at the bottom of a long run would walk that run a thousand times.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong><code>start - <span class=\"t-num\">1<\/span><\/code> and <code>end + <span class=\"t-num\">1<\/span><\/code> crash at the edges of <code><span class=\"t-typ\">Int<\/span><\/code>.<\/strong> In C, <code><span class=\"t-typ\">INT_MIN<\/span> - <span class=\"t-num\">1<\/span><\/code> quietly wraps around to the maximum; in Swift, arithmetic that overflows traps — the process stops. So an input containing <code><span class=\"t-typ\">Int<\/span>.min<\/code> crashes on the very first check, and one containing <code><span class=\"t-typ\">Int<\/span>.max<\/code> crashes when the walk tries to look past it. The problem's constraints keep values within ±10⁹, so this won't fire on LeetCode, but it will fire on a test an interviewer writes to probe you. Guard the comparison (<code>start &gt; .min<\/code>), or use the reporting forms (<code>start.subtractingReportingOverflow(<span class=\"t-num\">1<\/span>)<\/code>) — not <code>&amp;-<\/code>, which wraps <code><span class=\"t-typ\">Int<\/span>.min<\/code> around to <code><span class=\"t-typ\">Int<\/span>.max<\/code> and, if <code><span class=\"t-typ\">Int<\/span>.max<\/code> is also in the set, silently gives a wrong answer instead of a crash.<\/p><p>The related one: iterate <code>seen<\/code>, not <code>numbers<\/code>. It gives the same answer either way, and only the complexity breaks — which is the kind of bug a test won't catch and an interviewer will.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Return the run itself, not its length.\"<\/strong> → Keep <code>bestStart<\/code> alongside <code>longest<\/code>; the run is <code>bestStart ... bestStart + longest - <span class=\"t-num\">1<\/span><\/code>.<\/li><li><strong>\"Numbers keep arriving; keep the answer up to date.\"<\/strong> → Union-find, or a dictionary from each run's endpoints to its length: on insert, merge with the run ending at <code>x − <span class=\"t-num\">1<\/span><\/code> and the one starting at <code>x + <span class=\"t-num\">1<\/span><\/code>, update both new endpoints. O(1) amortised per insert.<\/li><li><strong>\"Memory is tight.\"<\/strong> → Sort in place and scan, skipping equal neighbours: O(n log n) time, O(1) extra. Trade the time back for the space, and say that's the trade.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get an unsorted array of integers. a run is a set of values that follow each other with no gap — 7, 8, 9, 10 — wherever they sit in the array. return the length of the longest run. repeated values count once. the interviewer wants it in o(n) time, which rules out sorting first. numbers answer why [31, 5, 2, 30, 4, 3, 32] 4 2, 3, 4, 5 — longer than 30, 31, 32 [] 0 no numbers, no run [1, 2, 2, 3] 3 the second 2 adds nothing constraints that matter: up to 100,000 numbers; values from −10⁹ to 10⁹. the array is not sorted and you must not rely on position — the run is about values, not neighbours in the array. ::: pattern and cue hash set. the cue is \"unsorted\" combined with \"o(n)\" . sorting would make the runs obvious but costs o(n log n), so you need another way to ask \"is the next value present?\" in constant time — that question is a set lookup. the trick that keeps it linear: only start counting a run from its bottom . a value is the bottom of a run if the value one below it is not in the set. every other value is skipped, so each run is walked exactly once. ::: ::: approach put every number into a set, which also removes repeats. then look at each value in the set. if the value one less is also in the set, this value is in the middle of a run — skip it. otherwise it starts a run: step upward one value at a time while the next value is in the set, and count the steps. keep the longest count you have seen. time o(n): building the set is o(n); the outer loop visits each value once; the inner walk only runs from run starts, and every value is walked over by at most one of those — so the inner steps add up to n in total, not n per value. space o(n) for the set. sorting and scanning is o(n log n) and o(1) extra — say it as the fallback, and why the problem forbids it. ::: ::: swift solution swift func longestconsecutive(_ numbers: [int]) int { let seen = set(numbers) var longest = 0 for start in seen { // only start counting at the bottom of a run. if start .min, seen.contains(start 1) { continue } var end = start while end < .max, seen.contains(end + 1) { end += 1 } longest = max(longest, end start + 1) } return longest } the start .min and end < .max guards look fussy; the trap below explains why they are there. within the stated constraints you can leave them out and say so. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus six more — a single value, the same value three times, a run crossing zero ( 2 … 1 ), values sitting at int.max and int.min (which crash the unguarded version), no two values adjacent, and a run of five given in descending order. ::: ::: walk it through [31, 5, 2, 30, 4, 3, 32] the set holds 2, 3, 4, 5, 30, 31, 32 (in whatever order swift picks — it doesn't matter). value one below in set? action longest 2 1 — no walk 3, 4, 5, stop at 6 → length 4 4 3, 4, 5 yes skip 4 30 29 — no walk 31, 32, stop at 33 → length 3 4 31, 32 yes skip 4 seven values, seven checks in the outer loop, five steps in total in the inner walks. answer 4. [1, 2, 2, 3] — the set is {1, 2, 3}. 1 starts a run, walks to 3, length 3. the duplicate never reaches the loop, which is why iterating the set rather than the array matters: with the array, a value repeated a thousand times at the bottom of a long run would walk that run a thousand times. ::: ::: the swift trap start 1 and end + 1 crash at the edges of int . in c, int_min 1 quietly wraps around to the maximum; in swift, arithmetic that overflows traps — the process stops. so an input containing int.min crashes on the very first check, and one containing int.max crashes when the walk tries to look past it. the problem's constraints keep values within ±10⁹, so this won't fire on leetcode, but it will fire on a test an interviewer writes to probe you. guard the comparison ( start .min ), or use the reporting forms ( start.subtractingreportingoverflow(1) ) — not & , which wraps int.min around to int.max and, if int.max is also in the set, silently gives a wrong answer instead of a crash. the related one: iterate seen , not numbers . it gives the same answer either way, and only the complexity breaks — which is the kind of bug a test won't catch and an interviewer will. ::: ::: what they ask next \"return the run itself, not its length.\" → keep beststart alongside longest ; the run is beststart ... beststart + longest 1 . \"numbers keep arriving; keep the answer up to date.\" → union find, or a dictionary from each run's endpoints to its length: on insert, merge with the run ending at x − 1 and the one starting at x + 1 , update both new endpoints. o(1) amortised per insert. \"memory is tight.\" → sort in place and scan, skipping equal neighbours: o(n log n) time, o(1) extra. trade the time back for the space, and say that's the trade. ::: ", "outline": []}, {"slug": "subarray-sum-equals-k", "title": "5 · Subarray Sum Equals K", "summary": "Given a list of whole numbers and a target, count how many unbroken stretches of the list add up to exactly that target.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 560 · Subarray Sum Equals K", "url": "https://leetcode.com/problems/subarray-sum-equals-k/"}, {"ref": "", "label": "Swift standard library · Dictionary.subscript(_:default:)", "url": "https://developer.apple.com/documentation/swift/dictionary/subscript(_:default:)-45arb"}], "html": "<p><em>Medium<\/em><\/p><p>You get an array of integers, which may include negatives and zeros, and a target number k. A stretch is one or more entries that sit next to each other in the array. Count how many stretches add up to exactly k. Two stretches count separately if they start or end at different positions, even when they hold the same values.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>k<\/th><th>Answer<\/th><th>The stretches<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code>, <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>]<\/code>, <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>]<\/code><\/td><\/tr><tr><td><code>[<span class=\"t-num\">3<\/span>, -<span class=\"t-num\">3<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td>the first <code><span class=\"t-num\">3<\/span><\/code>, the last <code><span class=\"t-num\">3<\/span><\/code>, and all three together<\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/td><td><code><span class=\"t-num\">0<\/span><\/code><\/td><td><code><span class=\"t-num\">6<\/span><\/code><\/td><td>every stretch — three of length 1, two of length 2, one of length 3<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 20,000 numbers, each between −1,000 and 1,000, so running totals stay small. Checking every start and end is O(n²) — that is the answer to beat. The negatives are the point of the problem: they are what breaks the obvious approach.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Prefix sums, with a hash map of the sums seen so far.<\/strong> The cue is <em>\"stretches that add up to exactly k\"<\/em> — a subarray sum. Any stretch's total is the difference of two running totals: the total up to its end minus the total just before its start. So \"a stretch ending here sums to k\" becomes \"some earlier running total equals the current one minus k\" — and \"have I seen this value before, how many times?\" is a dictionary lookup.<\/p><p>Why not a sliding window? A window grows while the sum is too small and shrinks while it is too big. That only works when adding an element always increases the sum. With negatives and zeros it doesn't, so the window has no rule for when to move.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Walk the array once, keeping a running total. Keep a dictionary that counts how many times each running total has appeared so far, starting with a total of 0 seen once — that stands for \"nothing taken yet\", and it is what lets a stretch that starts at the very first entry be counted. At each entry, add it to the running total, then ask the dictionary how many earlier totals equal the current total minus k: each one marks the start of a stretch that ends here and sums to k. Add that count to the answer, then record the current total.<\/p><p>Time O(n): one pass, O(1) average per dictionary step. Space O(n): at most one dictionary entry per distinct running total.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> subarraySum(_ numbers: [<span class=\"t-typ\">Int<\/span>], _ k: <span class=\"t-typ\">Int<\/span>) -&gt; <span class=\"t-typ\">Int<\/span> {\n    <span class=\"t-kw\">var<\/span> countBySum: [<span class=\"t-typ\">Int<\/span>: <span class=\"t-typ\">Int<\/span>] = [<span class=\"t-num\">0<\/span>: <span class=\"t-num\">1<\/span>]   <span class=\"t-com\">// the empty prefix<\/span>\n    <span class=\"t-kw\">var<\/span> sum = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> matches = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">for<\/span> number <span class=\"t-kw\">in<\/span> numbers {\n        sum += number\n        matches += countBySum[sum - k, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>]\n        countBySum[sum, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span>\n    }\n    <span class=\"t-kw\">return<\/span> matches\n}<\/code><\/pre><\/div><p>The order inside the loop matters: <strong>look up, then record.<\/strong> Recording first would count the empty stretch that starts and ends at the same place whenever k is 0.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, six more (an empty array, a single entry that does and doesn't match, <code>[-<span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]<\/code> with k 0, <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]<\/code> with k 2, and alternating <code>[<span class=\"t-num\">2<\/span>, -<span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>, -<span class=\"t-num\">2<\/span>]<\/code> with k 0), and 2,000 random arrays with values from −3 to 3, each checked against the O(n²) brute force.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code>, k = 3<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Entry<\/th><th>Running total<\/th><th>Look for (total − 3)<\/th><th>Found<\/th><th>Matches<\/th><th>Totals seen after<\/th><\/tr><\/thead><tbody><tr><td>—<\/td><td>0<\/td><td>—<\/td><td>—<\/td><td>0<\/td><td><code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>−2<\/td><td>0<\/td><td>0<\/td><td><code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>2<\/td><td>3<\/td><td>0<\/td><td>1<\/td><td>1 — <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td><code>+ <span class=\"t-num\">3<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>1<\/td><td>4<\/td><td>1<\/td><td>1<\/td><td>2 — <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/td><td><code>+ <span class=\"t-num\">4<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>−1<\/td><td>3<\/td><td>0<\/td><td>1<\/td><td>3 — <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, −<span class=\"t-num\">1<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span>:<span class=\"t-num\">2<\/span><\/code><\/td><\/tr><tr><td>2<\/td><td>5<\/td><td>2<\/td><td>0<\/td><td>3<\/td><td><code>+ <span class=\"t-num\">5<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Answer 3.<\/p><p><strong><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code>, k = 0<\/strong> — the running total stays 0. Before each record the dictionary holds <code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">1<\/span><\/code>, then <code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">2<\/span><\/code>, then <code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">3<\/span><\/code>, so the matches add up 1 + 2 + 3 = 6. That is every stretch, which is right. Record before looking up and you'd get 2 + 3 + 4 = 9.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>Reading a missing key.<\/strong> <code>countBySum[sum - k]<\/code> is an <code><span class=\"t-typ\">Int<\/span>?<\/code>, so <code>matches += countBySum[sum - k]<\/code> doesn't compile. Under time pressure the tempting fix is <code>countBySum[sum - k]!<\/code>, which crashes on the first entry — at that point almost nothing has been seen. Use <code>countBySum[sum - k, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>]<\/code>: in a read, the default subscript just returns 0 and does <strong>not<\/strong> insert the key, so lookups never grow the dictionary. In a write — <code>countBySum[sum, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span><\/code> — it inserts and increments in one hash. Knowing that the same subscript behaves differently when read and when written is exactly the kind of detail an interviewer probes.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Return the longest such stretch instead of the count.\"<\/strong> → Store the <em>first<\/em> position each running total appeared at, not a count; at each entry the length is <code>i − firstIndex[sum − k]<\/code>.<\/li><li><strong>\"What if every number were positive?\"<\/strong> → Then a sliding window works in O(1) space: grow the right edge, shrink from the left while the sum exceeds k.<\/li><li><strong>\"Count stretches whose sum is divisible by k.\"<\/strong> → Same shape, keyed by the running total modulo k — and normalise negative remainders, because Swift's <code>%<\/code> keeps the sign of the left side (<code>-<span class=\"t-num\">1<\/span> % <span class=\"t-num\">5<\/span> == -<span class=\"t-num\">1<\/span><\/code>).<\/li><\/ul><\/div><\/details>", "text": " medium you get an array of integers, which may include negatives and zeros, and a target number k. a stretch is one or more entries that sit next to each other in the array. count how many stretches add up to exactly k. two stretches count separately if they start or end at different positions, even when they hold the same values. numbers k answer the stretches [1, 2, 1, 1, 2] 3 3 [1, 2] , [2, 1] , [1, 2, 1, 1] [3, 3, 3] 3 3 the first 3 , the last 3 , and all three together [0, 0, 0] 0 6 every stretch — three of length 1, two of length 2, one of length 3 constraints that matter: up to 20,000 numbers, each between −1,000 and 1,000, so running totals stay small. checking every start and end is o(n²) — that is the answer to beat. the negatives are the point of the problem: they are what breaks the obvious approach. ::: pattern and cue prefix sums, with a hash map of the sums seen so far. the cue is \"stretches that add up to exactly k\" — a subarray sum. any stretch's total is the difference of two running totals: the total up to its end minus the total just before its start. so \"a stretch ending here sums to k\" becomes \"some earlier running total equals the current one minus k\" — and \"have i seen this value before, how many times?\" is a dictionary lookup. why not a sliding window? a window grows while the sum is too small and shrinks while it is too big. that only works when adding an element always increases the sum. with negatives and zeros it doesn't, so the window has no rule for when to move. ::: ::: approach walk the array once, keeping a running total. keep a dictionary that counts how many times each running total has appeared so far, starting with a total of 0 seen once — that stands for \"nothing taken yet\", and it is what lets a stretch that starts at the very first entry be counted. at each entry, add it to the running total, then ask the dictionary how many earlier totals equal the current total minus k: each one marks the start of a stretch that ends here and sums to k. add that count to the answer, then record the current total. time o(n): one pass, o(1) average per dictionary step. space o(n): at most one dictionary entry per distinct running total. ::: ::: swift solution swift func subarraysum(_ numbers: [int], _ k: int) int { var countbysum: [int: int] = [0: 1] // the empty prefix var sum = 0 var matches = 0 for number in numbers { sum += number matches += countbysum[sum k, default: 0] countbysum[sum, default: 0] += 1 } return matches } the order inside the loop matters: look up, then record. recording first would count the empty stretch that starts and ends at the same place whenever k is 0. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, six more (an empty array, a single entry that does and doesn't match, [ 1, 1, 1] with k 0, [1, 1, 1] with k 2, and alternating [2, 2, 2, 2] with k 0), and 2,000 random arrays with values from −3 to 3, each checked against the o(n²) brute force. ::: ::: walk it through [1, 2, 1, 1, 2] , k = 3 entry running total look for (total − 3) found matches totals seen after — 0 — — 0 0:1 1 1 −2 0 0 0:1, 1:1 2 3 0 1 1 — [1, 2] + 3:1 1 4 1 1 2 — [2, 1] + 4:1 −1 3 0 1 3 — [1, 2, 1, −1] 3:2 2 5 2 0 3 + 5:1 answer 3. [0, 0, 0] , k = 0 — the running total stays 0. before each record the dictionary holds 0:1 , then 0:2 , then 0:3 , so the matches add up 1 + 2 + 3 = 6. that is every stretch, which is right. record before looking up and you'd get 2 + 3 + 4 = 9. ::: ::: the swift trap reading a missing key. countbysum[sum k] is an int? , so matches += countbysum[sum k] doesn't compile. under time pressure the tempting fix is countbysum[sum k]! , which crashes on the first entry — at that point almost nothing has been seen. use countbysum[sum k, default: 0] : in a read, the default subscript just returns 0 and does not insert the key, so lookups never grow the dictionary. in a write — countbysum[sum, default: 0] += 1 — it inserts and increments in one hash. knowing that the same subscript behaves differently when read and when written is exactly the kind of detail an interviewer probes. ::: ::: what they ask next \"return the longest such stretch instead of the count.\" → store the first position each running total appeared at, not a count; at each entry the length is i − firstindex[sum − k] . \"what if every number were positive?\" → then a sliding window works in o(1) space: grow the right edge, shrink from the left while the sum exceeds k. \"count stretches whose sum is divisible by k.\" → same shape, keyed by the running total modulo k — and normalise negative remainders, because swift's % keeps the sign of the left side ( 1 % 5 == 1 ). ::: ", "outline": []}, {"slug": "valid-palindrome", "title": "6 · Valid Palindrome", "summary": "Decide whether a sentence reads the same forwards and backwards once you ignore case, spaces and punctuation.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 125 · Valid Palindrome", "url": "https://leetcode.com/problems/valid-palindrome/"}, {"ref": "", "label": "Swift standard library · String.Index", "url": "https://developer.apple.com/documentation/swift/string/index"}, {"ref": "", "label": "Swift standard library · Character.isLetter", "url": "https://developer.apple.com/documentation/swift/character/isletter"}], "html": "<p><em>Easy · G — the warm-up; the point is to finish it clean in under ten minutes<\/em><\/p><p>You get a string. Keep only its letters and digits, treat uppercase and lowercase as the same, and decide whether what's left reads the same forwards and backwards. A string with nothing left after that clean-up counts as reading the same both ways.<\/p><div class=\"scroll\"><table><thead><tr><th>Text<\/th><th>Answer<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code><span class=\"t-str\">&quot;Taco cat&quot;<\/span><\/code><\/td><td><code><span class=\"t-kw\">true<\/span><\/code><\/td><td>cleaned: <code>tacocat<\/code><\/td><\/tr><tr><td><code><span class=\"t-str\">&quot;Coffee&quot;<\/span><\/code><\/td><td><code><span class=\"t-kw\">false<\/span><\/code><\/td><td>cleaned: <code>coffee<\/code>, backwards <code>eeffoc<\/code><\/td><\/tr><tr><td><code><span class=\"t-str\">&quot;, ;&quot;<\/span><\/code><\/td><td><code><span class=\"t-kw\">true<\/span><\/code><\/td><td>nothing left — the empty string is a palindrome<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 200,000 characters, all printable ASCII. Letters and digits both count; everything else is skipped. The simple answer builds a cleaned copy and compares it with its reverse — correct, but it uses O(n) extra memory, and the follow-up will be to do without it.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Two pointers, moving inward from both ends.<\/strong> The cue is <em>\"reads the same forwards and backwards\"<\/em> — you are comparing the first with the last, the second with the second-to-last, and so on. Two positions walking toward each other do that in one pass, and skipping punctuation is just \"move this pointer on without comparing\".<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Put one finger on the first character and one on the last. If the left finger is on something that isn't a letter or digit, move it right; if the right finger is, move it left. When both are on letters or digits, compare them ignoring case: if they differ, the answer is no; if they match, move both inward. When the fingers meet or cross, every pair matched, so the answer is yes.<\/p><p>Time O(n): each finger only moves inward, so together they visit each character once. Space O(n) in the version below, because it copies the string into an array for indexing; the String.Index version in the trap is O(1).<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> isPalindrome(_ text: <span class=\"t-typ\">String<\/span>) -&gt; <span class=\"t-typ\">Bool<\/span> {\n    <span class=\"t-kw\">let<\/span> characters = <span class=\"t-typ\">Array<\/span>(text)\n    <span class=\"t-kw\">var<\/span> left = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> right = characters.count - <span class=\"t-num\">1<\/span>\n\n    <span class=\"t-kw\">while<\/span> left &lt; right {\n        <span class=\"t-kw\">guard<\/span> isAlphanumeric(characters[left]) <span class=\"t-kw\">else<\/span> { left += <span class=\"t-num\">1<\/span>; <span class=\"t-kw\">continue<\/span> }\n        <span class=\"t-kw\">guard<\/span> isAlphanumeric(characters[right]) <span class=\"t-kw\">else<\/span> { right -= <span class=\"t-num\">1<\/span>; <span class=\"t-kw\">continue<\/span> }\n        <span class=\"t-kw\">if<\/span> characters[left].lowercased() != characters[right].lowercased() {\n            <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">false<\/span>\n        }\n        left += <span class=\"t-num\">1<\/span>\n        right -= <span class=\"t-num\">1<\/span>\n    }\n    <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">true<\/span>\n}\n\n<span class=\"t-kw\">func<\/span> isAlphanumeric(_ character: <span class=\"t-typ\">Character<\/span>) -&gt; <span class=\"t-typ\">Bool<\/span> {\n    character.isASCII &amp;&amp; (character.isLetter || character.isNumber)\n}<\/code><\/pre><\/div><p>For an empty string <code>right<\/code> starts at −1, the loop never runs, and the answer is <code><span class=\"t-kw\">true<\/span><\/code> — no special case, but say that you checked.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above plus nine more — the empty string, one character, letters mixed with digits (<code><span class=\"t-str\">&quot;ab2A&quot;<\/span><\/code>, <code><span class=\"t-str\">&quot;1a1&quot;<\/span><\/code>, <code><span class=\"t-str\">&quot;0P&quot;<\/span><\/code>), a full sentence with punctuation, a trailing full stop, and two strings with accented letters that the ASCII rule skips.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code><span class=\"t-str\">&quot;Taco cat&quot;<\/span><\/code><\/strong> — eight characters, positions 0 to 7.<\/p><div class=\"scroll\"><table><thead><tr><th>Left<\/th><th>Right<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>0 <code><span class=\"t-typ\">T<\/span><\/code><\/td><td>7 <code>t<\/code><\/td><td>same ignoring case → move both<\/td><\/tr><tr><td>1 <code>a<\/code><\/td><td>6 <code>a<\/code><\/td><td>same → move both<\/td><\/tr><tr><td>2 <code>c<\/code><\/td><td>5 <code>c<\/code><\/td><td>same → move both<\/td><\/tr><tr><td>3 <code>o<\/code><\/td><td>4 <code>␣<\/code><\/td><td>right is a space → right moves to 3<\/td><\/tr><tr><td>3<\/td><td>3<\/td><td>fingers meet → <code><span class=\"t-kw\">true<\/span><\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong><code><span class=\"t-str\">&quot;, ;&quot;<\/span><\/code><\/strong> — left skips <code>,<\/code> then the space and reaches position 2; right is already at 2. <code><span class=\"t-num\">2<\/span> &lt; <span class=\"t-num\">2<\/span><\/code> is false, the loop ends, <code><span class=\"t-kw\">true<\/span><\/code>.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>You can't write <code>text[left]<\/code> with an <code><span class=\"t-typ\">Int<\/span><\/code>.<\/strong> A Swift <code><span class=\"t-typ\">String<\/span><\/code> is a collection of <code><span class=\"t-typ\">Character<\/span><\/code>s, each possibly several bytes, so it has no integer indexing. There are two honest ways out, and you should name the cost of each. <code><span class=\"t-typ\">Array<\/span>(text)<\/code> gives you integer indexing at the price of an O(n) copy — what the solution above does. Or walk two <code><span class=\"t-typ\">String<\/span>.<span class=\"t-typ\">Index<\/span><\/code> values with <code>text.index(after:)<\/code> and <code>text.index(before:)<\/code>, which is O(1) extra space and exactly what \"can you do it without the copy?\" is asking for. Either is fine; writing <code>text[text.index(text.startIndex, offsetBy: i)]<\/code> inside the loop is not — each of those is O(i), and the whole thing quietly becomes O(n²).<\/p><p>Smaller one: <code><span class=\"t-typ\">Character<\/span>.isLetter<\/code> and <code>isNumber<\/code> are Unicode-wide — <code><span class=\"t-str\">&quot;é&quot;<\/span><\/code> is a letter, <code><span class=\"t-str\">&quot;½&quot;<\/span><\/code> is a number. The problem means ASCII, hence the <code>isASCII<\/code> check. And <code><span class=\"t-typ\">Character<\/span>.lowercased()<\/code> returns a <code><span class=\"t-typ\">String<\/span><\/code>, not a <code><span class=\"t-typ\">Character<\/span><\/code>; comparing two strings is fine, but don't try to store it back into a <code>[<span class=\"t-typ\">Character<\/span>]<\/code>.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Do it in O(1) extra space.\"<\/strong> → Two <code><span class=\"t-typ\">String<\/span>.<span class=\"t-typ\">Index<\/span><\/code> values, <code>index(after:)<\/code> and <code>index(before:)<\/code>, loop while <code>left &lt; right<\/code>. Same logic.<\/li><li><strong>\"May you delete at most one character to make it a palindrome?\"<\/strong> → On the first mismatch, try skipping the left character or the right one, and check the rest of each with the same two-pointer loop. Still O(n).<\/li><li><strong>\"Unicode text, where <code>é<\/code> should equal <code>e<\/code>?\"<\/strong> → Normalise first: <code>text.folding(options: [.caseInsensitive, .diacriticInsensitive], locale: <span class=\"t-kw\">nil<\/span>)<\/code> from Foundation, then drop the <code>isASCII<\/code> check.<\/li><\/ul><\/div><\/details>", "text": " easy · g — the warm up; the point is to finish it clean in under ten minutes you get a string. keep only its letters and digits, treat uppercase and lowercase as the same, and decide whether what's left reads the same forwards and backwards. a string with nothing left after that clean up counts as reading the same both ways. text answer why \"taco cat\" true cleaned: tacocat \"coffee\" false cleaned: coffee , backwards eeffoc \", ;\" true nothing left — the empty string is a palindrome constraints that matter: up to 200,000 characters, all printable ascii. letters and digits both count; everything else is skipped. the simple answer builds a cleaned copy and compares it with its reverse — correct, but it uses o(n) extra memory, and the follow up will be to do without it. ::: pattern and cue two pointers, moving inward from both ends. the cue is \"reads the same forwards and backwards\" — you are comparing the first with the last, the second with the second to last, and so on. two positions walking toward each other do that in one pass, and skipping punctuation is just \"move this pointer on without comparing\". ::: ::: approach put one finger on the first character and one on the last. if the left finger is on something that isn't a letter or digit, move it right; if the right finger is, move it left. when both are on letters or digits, compare them ignoring case: if they differ, the answer is no; if they match, move both inward. when the fingers meet or cross, every pair matched, so the answer is yes. time o(n): each finger only moves inward, so together they visit each character once. space o(n) in the version below, because it copies the string into an array for indexing; the string.index version in the trap is o(1). ::: ::: swift solution swift func ispalindrome(_ text: string) bool { let characters = array(text) var left = 0 var right = characters.count 1 while left < right { guard isalphanumeric(characters[left]) else { left += 1; continue } guard isalphanumeric(characters[right]) else { right = 1; continue } if characters[left].lowercased() != characters[right].lowercased() { return false } left += 1 right = 1 } return true } func isalphanumeric(_ character: character) bool { character.isascii && (character.isletter character.isnumber) } for an empty string right starts at −1, the loop never runs, and the answer is true — no special case, but say that you checked. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus nine more — the empty string, one character, letters mixed with digits ( \"ab2a\" , \"1a1\" , \"0p\" ), a full sentence with punctuation, a trailing full stop, and two strings with accented letters that the ascii rule skips. ::: ::: walk it through \"taco cat\" — eight characters, positions 0 to 7. left right action 0 t 7 t same ignoring case → move both 1 a 6 a same → move both 2 c 5 c same → move both 3 o 4 ␣ right is a space → right moves to 3 3 3 fingers meet → true \", ;\" — left skips , then the space and reaches position 2; right is already at 2. 2 < 2 is false, the loop ends, true . ::: ::: the swift trap you can't write text[left] with an int . a swift string is a collection of character s, each possibly several bytes, so it has no integer indexing. there are two honest ways out, and you should name the cost of each. array(text) gives you integer indexing at the price of an o(n) copy — what the solution above does. or walk two string.index values with text.index(after:) and text.index(before:) , which is o(1) extra space and exactly what \"can you do it without the copy?\" is asking for. either is fine; writing text[text.index(text.startindex, offsetby: i)] inside the loop is not — each of those is o(i), and the whole thing quietly becomes o(n²). smaller one: character.isletter and isnumber are unicode wide — \"é\" is a letter, \"½\" is a number. the problem means ascii, hence the isascii check. and character.lowercased() returns a string , not a character ; comparing two strings is fine, but don't try to store it back into a [character] . ::: ::: what they ask next \"do it in o(1) extra space.\" → two string.index values, index(after:) and index(before:) , loop while left < right . same logic. \"may you delete at most one character to make it a palindrome?\" → on the first mismatch, try skipping the left character or the right one, and check the rest of each with the same two pointer loop. still o(n). \"unicode text, where é should equal e ?\" → normalise first: text.folding(options: [.caseinsensitive, .diacriticinsensitive], locale: nil) from foundation, then drop the isascii check. ::: ", "outline": []}, {"slug": "two-sum-ii-input-array-is-sorted", "title": "7 · Two Sum II — Input Array Is Sorted", "summary": "Given a list of whole numbers already in ascending order and a target, find the two entries that add up to it, using no extra memory.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 167 · Two Sum II — Input Array Is Sorted", "url": "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"}, {"ref": "", "label": "Swift standard library · addingReportingOverflow(_:)", "url": "https://developer.apple.com/documentation/swift/int/addingreportingoverflow(_:)"}], "html": "<p><em>Medium — problem 1 again, with one new constraint that changes the best answer<\/em><\/p><p>You get an array of integers sorted from smallest to largest, and a target. Exactly two different entries add up to the target. Return their positions <strong>counted from 1<\/strong>, smaller first. The catch: you may only use a constant amount of extra memory — no dictionary.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>Target<\/th><th>Answer<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">13<\/span>]<\/code><\/td><td><code><span class=\"t-num\">16<\/span><\/code><\/td><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><td>3 + 13<\/td><\/tr><tr><td><code>[-<span class=\"t-num\">3<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">4<\/span>]<\/code><\/td><td><code>-<span class=\"t-num\">4<\/span><\/code><\/td><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>−3 + −1<\/td><\/tr><tr><td><code>[<span class=\"t-num\">5<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><td><code><span class=\"t-num\">10<\/span><\/code><\/td><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>two different entries with the same value<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 2 and 30,000 numbers, each between −1,000 and 1,000; exactly one answer exists. The dictionary answer from problem 1 still works, but it uses O(n) memory, which this version forbids.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Two pointers, from both ends inward.<\/strong> The cues are <em>\"sorted\"<\/em> and <em>\"constant extra memory\"<\/em>. Sorted means that moving right always gives a bigger number and moving left a smaller one — so a sum that is too small has exactly one fix (move the left end up) and a sum that is too big has exactly one fix (move the right end down). No lookup table is needed, because the order itself tells you which way to go.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Start with one finger on the smallest number and one on the largest. Add them. If the sum is the target, you are done. If it is too small, the smallest number can't be part of the answer — even paired with the largest, it falls short — so move the left finger right. If it is too big, the largest can't be part of it, so move the right finger left. Each step rules out one number for good.<\/p><p>Time O(n): every step moves one finger inward, and they can only meet once. Space O(1): two positions and a sum.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> twoSum(_ numbers: [<span class=\"t-typ\">Int<\/span>], _ target: <span class=\"t-typ\">Int<\/span>) -&gt; [<span class=\"t-typ\">Int<\/span>] {\n    <span class=\"t-kw\">var<\/span> left = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> right = numbers.count - <span class=\"t-num\">1<\/span>\n\n    <span class=\"t-kw\">while<\/span> left &lt; right {\n        <span class=\"t-kw\">let<\/span> (sum, overflowed) = numbers[left].addingReportingOverflow(numbers[right])\n        <span class=\"t-kw\">if<\/span> !overflowed &amp;&amp; sum == target {\n            <span class=\"t-kw\">return<\/span> [left + <span class=\"t-num\">1<\/span>, right + <span class=\"t-num\">1<\/span>]          <span class=\"t-com\">// positions are 1-based<\/span>\n        }\n        <span class=\"t-com\">// On overflow the true sum is past Int&#x27;s range in the direction of the larger value.<\/span>\n        <span class=\"t-kw\">let<\/span> tooBig = overflowed ? numbers[right] &gt; <span class=\"t-num\">0<\/span> : sum &gt; target\n        <span class=\"t-kw\">if<\/span> tooBig { right -= <span class=\"t-num\">1<\/span> } <span class=\"t-kw\">else<\/span> { left += <span class=\"t-num\">1<\/span> }\n    }\n    <span class=\"t-kw\">return<\/span> []\n}<\/code><\/pre><\/div><p>Within the stated constraints the plain <code><span class=\"t-kw\">let<\/span> sum = numbers[left] + numbers[right]<\/code> is fine — say so, and say why you'd guard it in production (see the trap).<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above plus seven more — the minimum two entries, zeros, a long run of equal values before the partner, a mixed-sign array, and three arrays holding <code><span class=\"t-typ\">Int<\/span>.max<\/code> or <code><span class=\"t-typ\">Int<\/span>.min<\/code>, which crash the unguarded version.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">13<\/span>]<\/code>, target 16<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Left<\/th><th>Right<\/th><th>Sum<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>1 → <code><span class=\"t-num\">2<\/span><\/code><\/td><td>5 → <code><span class=\"t-num\">13<\/span><\/code><\/td><td>15<\/td><td>too small → left moves<\/td><\/tr><tr><td>2 → <code><span class=\"t-num\">3<\/span><\/code><\/td><td>5 → <code><span class=\"t-num\">13<\/span><\/code><\/td><td>16<\/td><td>found → <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong><code>[<span class=\"t-num\">5<\/span>, <span class=\"t-num\">5<\/span>]<\/code>, target 10<\/strong> — left on position 1, right on position 2, sum 10, answer <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code>. The two fingers start on different entries, so equal values are never a problem.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>The sum of two valid entries can crash.<\/strong> The answer pair always fits in <code><span class=\"t-typ\">Int<\/span><\/code> — its sum is the target — but the pairs you try on the way don't have to. With <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-typ\">Int<\/span>.max]<\/code> and target 3, the first step adds <code><span class=\"t-num\">1<\/span> + <span class=\"t-typ\">Int<\/span>.max<\/code>, and Swift traps where C would wrap. Rewriting the check as <code>numbers[left] &gt; target - numbers[right]<\/code> only moves the problem to the subtraction. <code>addingReportingOverflow<\/code> gives you the wrapped result plus a flag, and in a sorted array the direction of an overflow tells you which finger to move: overflowing upward means the sum is too big.<\/p><p>The other slip here is not Swift's fault: the answer is <strong>1-based<\/strong>. Returning <code>[left, right]<\/code> passes every self-made test and fails the grader. Read the statement back (the R in REACTO) and you catch it.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Why does moving the left pointer never skip the answer?\"<\/strong> → If the sum is too small with the largest remaining number, the current left number can't reach the target with anything, so discarding it is safe. Same argument mirrored for the right.<\/li><li><strong>\"Return every pair, not just one.\"<\/strong> → On a match, record it, move both fingers, and skip past repeats of each value so pairs aren't duplicated. That skip is the heart of the next problem.<\/li><li><strong>\"The array isn't sorted.\"<\/strong> → Either sort pairs of (value, position) — O(n log n), O(n) space — or use the dictionary from problem 1, O(n) and O(n). Sorting in place and returning positions doesn't work: the positions move.<\/li><\/ul><\/div><\/details>", "text": " medium — problem 1 again, with one new constraint that changes the best answer you get an array of integers sorted from smallest to largest, and a target. exactly two different entries add up to the target. return their positions counted from 1 , smaller first. the catch: you may only use a constant amount of extra memory — no dictionary. numbers target answer why [2, 3, 5, 8, 13] 16 [2, 5] 3 + 13 [ 3, 1, 0, 4] 4 [1, 2] −3 + −1 [5, 5] 10 [1, 2] two different entries with the same value constraints that matter: between 2 and 30,000 numbers, each between −1,000 and 1,000; exactly one answer exists. the dictionary answer from problem 1 still works, but it uses o(n) memory, which this version forbids. ::: pattern and cue two pointers, from both ends inward. the cues are \"sorted\" and \"constant extra memory\" . sorted means that moving right always gives a bigger number and moving left a smaller one — so a sum that is too small has exactly one fix (move the left end up) and a sum that is too big has exactly one fix (move the right end down). no lookup table is needed, because the order itself tells you which way to go. ::: ::: approach start with one finger on the smallest number and one on the largest. add them. if the sum is the target, you are done. if it is too small, the smallest number can't be part of the answer — even paired with the largest, it falls short — so move the left finger right. if it is too big, the largest can't be part of it, so move the right finger left. each step rules out one number for good. time o(n): every step moves one finger inward, and they can only meet once. space o(1): two positions and a sum. ::: ::: swift solution swift func twosum(_ numbers: [int], _ target: int) [int] { var left = 0 var right = numbers.count 1 while left < right { let (sum, overflowed) = numbers[left].addingreportingoverflow(numbers[right]) if !overflowed && sum == target { return [left + 1, right + 1] // positions are 1 based } // on overflow the true sum is past int's range in the direction of the larger value. let toobig = overflowed ? numbers[right] 0 : sum target if toobig { right = 1 } else { left += 1 } } return [] } within the stated constraints the plain let sum = numbers[left] + numbers[right] is fine — say so, and say why you'd guard it in production (see the trap). verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus seven more — the minimum two entries, zeros, a long run of equal values before the partner, a mixed sign array, and three arrays holding int.max or int.min , which crash the unguarded version. ::: ::: walk it through [2, 3, 5, 8, 13] , target 16 left right sum action 1 → 2 5 → 13 15 too small → left moves 2 → 3 5 → 13 16 found → [2, 5] [5, 5] , target 10 — left on position 1, right on position 2, sum 10, answer [1, 2] . the two fingers start on different entries, so equal values are never a problem. ::: ::: the swift trap the sum of two valid entries can crash. the answer pair always fits in int — its sum is the target — but the pairs you try on the way don't have to. with [1, 2, int.max] and target 3, the first step adds 1 + int.max , and swift traps where c would wrap. rewriting the check as numbers[left] target numbers[right] only moves the problem to the subtraction. addingreportingoverflow gives you the wrapped result plus a flag, and in a sorted array the direction of an overflow tells you which finger to move: overflowing upward means the sum is too big. the other slip here is not swift's fault: the answer is 1 based . returning [left, right] passes every self made test and fails the grader. read the statement back (the r in reacto) and you catch it. ::: ::: what they ask next \"why does moving the left pointer never skip the answer?\" → if the sum is too small with the largest remaining number, the current left number can't reach the target with anything, so discarding it is safe. same argument mirrored for the right. \"return every pair, not just one.\" → on a match, record it, move both fingers, and skip past repeats of each value so pairs aren't duplicated. that skip is the heart of the next problem. \"the array isn't sorted.\" → either sort pairs of (value, position) — o(n log n), o(n) space — or use the dictionary from problem 1, o(n) and o(n). sorting in place and returning positions doesn't work: the positions move. ::: ", "outline": []}, {"slug": "3sum", "title": "8 · 3Sum", "summary": "Given a list of whole numbers, find every distinct set of three entries that adds up to zero.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 15 · 3Sum", "url": "https://leetcode.com/problems/3sum/"}, {"ref": "", "label": "Swift standard library · Hashable", "url": "https://developer.apple.com/documentation/swift/hashable"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get an array of integers in no particular order. Find every group of three entries, at three different positions, whose values add up to zero. Return each group of <strong>values<\/strong> once: two groups made of the same three values count as one, even if they come from different positions. The order of the groups, and of the values inside each group, doesn't matter.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>Groups<\/th><\/tr><\/thead><tbody><tr><td><code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td><code>[[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>], [-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]]<\/code><\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/td><td><code>[[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]]<\/code> — four zeros, but one distinct group<\/td><\/tr><tr><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, -<span class=\"t-num\">4<\/span>]<\/code><\/td><td><code>[]<\/code> — the only three entries add up to −1<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 3 and 3,000 numbers, each between −100,000 and 100,000. Trying every group of three is O(n³); the target is O(n²). Because order is free, the Xcode test sorts each group and then the list of groups before comparing.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Sort, then two pointers inside a loop.<\/strong> The cue is <em>\"groups of three\"<\/em> that <em>\"add up to\"<\/em> a target, with <em>\"distinct\"<\/em> groups. Fix the first value and what remains is problem 7 exactly: find two entries in a sorted range that sum to minus the first value. Sorting is what makes both halves work — it enables the two-pointer search, and it puts equal values next to each other so repeats can be skipped instead of filtered out afterwards.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Sort the numbers. Take each value in turn as the first member of a group, skipping it if it is the same as the value just before (it would find the same groups again). For each first value, run the two-finger search from problem 7 on everything to its right, looking for a pair that brings the total to zero. When a pair is found, record the group, move both fingers inward, and move the left finger past any copies of the value it just used. Once the first value is above zero you can stop: everything to its right is at least as large, so no group can add up to zero.<\/p><p>Time O(n²): the sort is O(n log n), then n first values each run an O(n) scan. Space O(1) beyond the output, or O(n) if you count the sorted copy — Swift's <code>sorted()<\/code> returns a new array, and sorting the input in place would change the caller's data.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> threeSum(_ numbers: [<span class=\"t-typ\">Int<\/span>]) -&gt; [[<span class=\"t-typ\">Int<\/span>]] {\n    <span class=\"t-kw\">let<\/span> sorted = numbers.sorted()\n    <span class=\"t-kw\">var<\/span> triplets: [[<span class=\"t-typ\">Int<\/span>]] = []\n\n    <span class=\"t-kw\">for<\/span> first <span class=\"t-kw\">in<\/span> sorted.indices {\n        <span class=\"t-kw\">if<\/span> sorted[first] &gt; <span class=\"t-num\">0<\/span> { <span class=\"t-kw\">break<\/span> }                                   <span class=\"t-com\">// nothing to the right can bring it back to 0<\/span>\n        <span class=\"t-kw\">if<\/span> first &gt; <span class=\"t-num\">0<\/span> &amp;&amp; sorted[first] == sorted[first - <span class=\"t-num\">1<\/span>] { <span class=\"t-kw\">continue<\/span> }  <span class=\"t-com\">// same first value, same triplets<\/span>\n\n        <span class=\"t-kw\">var<\/span> left = first + <span class=\"t-num\">1<\/span>\n        <span class=\"t-kw\">var<\/span> right = sorted.count - <span class=\"t-num\">1<\/span>\n        <span class=\"t-kw\">while<\/span> left &lt; right {\n            <span class=\"t-kw\">let<\/span> sum = sorted[first] + sorted[left] + sorted[right]\n            <span class=\"t-kw\">if<\/span> sum &lt; <span class=\"t-num\">0<\/span> {\n                left += <span class=\"t-num\">1<\/span>\n            } <span class=\"t-kw\">else<\/span> <span class=\"t-kw\">if<\/span> sum &gt; <span class=\"t-num\">0<\/span> {\n                right -= <span class=\"t-num\">1<\/span>\n            } <span class=\"t-kw\">else<\/span> {\n                triplets.append([sorted[first], sorted[left], sorted[right]])\n                left += <span class=\"t-num\">1<\/span>\n                right -= <span class=\"t-num\">1<\/span>\n                <span class=\"t-kw\">while<\/span> left &lt; right &amp;&amp; sorted[left] == sorted[left - <span class=\"t-num\">1<\/span>] { left += <span class=\"t-num\">1<\/span> }\n            }\n        }\n    }\n    <span class=\"t-kw\">return<\/span> triplets\n}<\/code><\/pre><\/div><p>Skipping repeats of the left value is enough: once left has moved past its copies, the right value that completes the group is fixed, so a duplicate on the right can't produce a new match.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, six more (empty, one and two entries, a seven-value mix with four answers, fifteen values heavy with repeats, and <code>[-<span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code>), and 2,000 random arrays checked against a brute-force O(n³) search — including a check that no group comes back twice.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/strong> (already sorted)<\/p><div class=\"scroll\"><table><thead><tr><th>First<\/th><th>Left<\/th><th>Right<\/th><th>Sum<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>−2<\/td><td>0<\/td><td>2<\/td><td>0<\/td><td>record <code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>]<\/code>; move both<\/td><\/tr><tr><td>−2<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>record <code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]<\/code>; move both, fingers cross<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>too big → right moves<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><td>2<\/td><td>too big → right moves, fingers meet<\/td><\/tr><tr><td>1<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>first value above 0 → stop<\/td><\/tr><\/tbody><\/table><\/div><p>Two groups.<\/p><p><strong><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/strong> — first value is the zero at position 0; left at 1, right at 3, sum 0, record <code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code>; both move to 2 and meet. Positions 1, 2 and 3 as first value are all repeats of 0 and are skipped. One group.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>A tuple can't go in a <code><span class=\"t-typ\">Set<\/span><\/code>.<\/strong> The instinct is to collect every match into a set to remove repeats — <code><span class=\"t-typ\">Set<\/span>&lt;(<span class=\"t-typ\">Int<\/span>, <span class=\"t-typ\">Int<\/span>, <span class=\"t-typ\">Int<\/span>)&gt;<\/code> — and it doesn't compile, because tuples aren't <code><span class=\"t-typ\">Hashable<\/span><\/code> in Swift. <code><span class=\"t-typ\">Set<\/span>&lt;[<span class=\"t-typ\">Int<\/span>]&gt;<\/code> does compile, but only if every group is sorted first, and it adds O(k) hashing for k results plus a conversion back to an array at the end. It is a working answer, and an interviewer will accept it with a nudge; skipping repeats in the sorted array is the one they are waiting for, and it removes the need for the set entirely. Say both, write the second.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Closest sum to a target instead of exactly zero.\"<\/strong> → Same loop; track the sum with the smallest distance to the target and move the fingers by comparing with the target. No duplicate-skipping needed.<\/li><li><strong>\"4Sum.\"<\/strong> → Two nested loops for the first two values, each skipping repeats, then the two-finger scan: O(n³). Generalises to k-sum by recursion down to two.<\/li><li><strong>\"Can you beat O(n²)?\"<\/strong> → Not in general — 3Sum is the textbook problem believed to need about n² time. Saying that is a better answer than inventing an optimisation.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get an array of integers in no particular order. find every group of three entries, at three different positions, whose values add up to zero. return each group of values once: two groups made of the same three values count as one, even if they come from different positions. the order of the groups, and of the values inside each group, doesn't matter. numbers groups [ 2, 0, 1, 1, 2] [[ 2, 0, 2], [ 2, 1, 1]] [0, 0, 0, 0] [[0, 0, 0]] — four zeros, but one distinct group [1, 2, 4] [] — the only three entries add up to −1 constraints that matter: between 3 and 3,000 numbers, each between −100,000 and 100,000. trying every group of three is o(n³); the target is o(n²). because order is free, the xcode test sorts each group and then the list of groups before comparing. ::: pattern and cue sort, then two pointers inside a loop. the cue is \"groups of three\" that \"add up to\" a target, with \"distinct\" groups. fix the first value and what remains is problem 7 exactly: find two entries in a sorted range that sum to minus the first value. sorting is what makes both halves work — it enables the two pointer search, and it puts equal values next to each other so repeats can be skipped instead of filtered out afterwards. ::: ::: approach sort the numbers. take each value in turn as the first member of a group, skipping it if it is the same as the value just before (it would find the same groups again). for each first value, run the two finger search from problem 7 on everything to its right, looking for a pair that brings the total to zero. when a pair is found, record the group, move both fingers inward, and move the left finger past any copies of the value it just used. once the first value is above zero you can stop: everything to its right is at least as large, so no group can add up to zero. time o(n²): the sort is o(n log n), then n first values each run an o(n) scan. space o(1) beyond the output, or o(n) if you count the sorted copy — swift's sorted() returns a new array, and sorting the input in place would change the caller's data. ::: ::: swift solution swift func threesum(_ numbers: [int]) [[int]] { let sorted = numbers.sorted() var triplets: [[int]] = [] for first in sorted.indices { if sorted[first] 0 { break } // nothing to the right can bring it back to 0 if first 0 && sorted[first] == sorted[first 1] { continue } // same first value, same triplets var left = first + 1 var right = sorted.count 1 while left < right { let sum = sorted[first] + sorted[left] + sorted[right] if sum < 0 { left += 1 } else if sum 0 { right = 1 } else { triplets.append([sorted[first], sorted[left], sorted[right]]) left += 1 right = 1 while left < right && sorted[left] == sorted[left 1] { left += 1 } } } } return triplets } skipping repeats of the left value is enough: once left has moved past its copies, the right value that completes the group is fixed, so a duplicate on the right can't produce a new match. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, six more (empty, one and two entries, a seven value mix with four answers, fifteen values heavy with repeats, and [ 1, 1, 1, 2, 2] ), and 2,000 random arrays checked against a brute force o(n³) search — including a check that no group comes back twice. ::: ::: walk it through [ 2, 0, 1, 1, 2] (already sorted) first left right sum action −2 0 2 0 record [ 2, 0, 2] ; move both −2 1 1 0 record [ 2, 1, 1] ; move both, fingers cross 0 1 2 3 too big → right moves 0 1 1 2 too big → right moves, fingers meet 1 — — — first value above 0 → stop two groups. [0, 0, 0, 0] — first value is the zero at position 0; left at 1, right at 3, sum 0, record [0, 0, 0] ; both move to 2 and meet. positions 1, 2 and 3 as first value are all repeats of 0 and are skipped. one group. ::: ::: the swift trap a tuple can't go in a set . the instinct is to collect every match into a set to remove repeats — set<(int, int, int) — and it doesn't compile, because tuples aren't hashable in swift. set<[int] does compile, but only if every group is sorted first, and it adds o(k) hashing for k results plus a conversion back to an array at the end. it is a working answer, and an interviewer will accept it with a nudge; skipping repeats in the sorted array is the one they are waiting for, and it removes the need for the set entirely. say both, write the second. ::: ::: what they ask next \"closest sum to a target instead of exactly zero.\" → same loop; track the sum with the smallest distance to the target and move the fingers by comparing with the target. no duplicate skipping needed. \"4sum.\" → two nested loops for the first two values, each skipping repeats, then the two finger scan: o(n³). generalises to k sum by recursion down to two. \"can you beat o(n²)?\" → not in general — 3sum is the textbook problem believed to need about n² time. saying that is a better answer than inventing an optimisation. ::: ", "outline": []}, {"slug": "container-with-most-water", "title": "9 · Container With Most Water", "summary": "Given a row of vertical walls, pick the two that hold the most water between them.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 11 · Container With Most Water", "url": "https://leetcode.com/problems/container-with-most-water/"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get an array of non-negative integers. Each entry is the height of a vertical wall standing at that position, one unit apart from its neighbours. Pick any two walls: together with the ground they form a tank, and the water it holds is as high as the <strong>shorter<\/strong> of the two walls and as wide as the distance between them. The walls in between don't get in the way. Return the largest amount of water any pair can hold.<\/p><div class=\"scroll\"><table><thead><tr><th>Heights<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">6<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/td><td><code><span class=\"t-num\">28<\/span><\/code> — the 7 at position 1 and the 8 at position 5: height 7, width 4<\/td><\/tr><tr><td><code>[<span class=\"t-num\">5<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><td><code><span class=\"t-num\">20<\/span><\/code> — the two outer walls: height 5, width 4<\/td><\/tr><tr><td><code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">4<\/span>]<\/code><\/td><td><code><span class=\"t-num\">4<\/span><\/code> — only one pair, height 4, width 1<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 2 and 100,000 walls, each between 0 and 10,000 high. Trying every pair is O(n²), about five billion pairs at the top end; the target is one pass, O(n).<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Two pointers from both ends, moving the weaker side.<\/strong> The cue is <em>\"two\"<\/em> entries of an array whose score depends on the <em>distance between them<\/em> and the <em>smaller<\/em> of the two. Start with the widest pair — the two outer walls — and walk inward. Every step inward loses one unit of width, so the only step that can ever pay off is one that might raise the shorter wall.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Put one finger on the first wall and one on the last. Work out the water between them and keep the best seen so far. Then move the finger that sits on the <strong>shorter<\/strong> wall one step inward, and repeat until the fingers meet.<\/p><p>Why moving the shorter wall is safe: pair the shorter wall with any wall closer in than the other finger, and the water is capped by that shorter wall's height while the width only shrinks — every one of those pairs is worse than the one just measured. So the shorter wall has nothing left to offer, and it can be dropped. Moving the taller wall instead can never help, because the shorter wall still caps the height. On a tie either finger can move: neither wall can do better with anything in between.<\/p><p>Time O(n): each step moves one finger, and they meet after n − 1 steps. Space O(1): two indices and a running best.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> maxArea(_ heights: [<span class=\"t-typ\">Int<\/span>]) -&gt; <span class=\"t-typ\">I
