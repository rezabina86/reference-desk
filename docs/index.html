ey had got to — and pick up somebody else's slip instead. The bookmark is the part that matters: the desk is cleared completely, so nothing of yours occupies it while you wait.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>A synchronous function keeps its local state on the thread's stack, which is why it cannot be put down — the stack frame would have to survive, and stacks don't work that way. An <code><span class=\"t-kw\">async<\/span><\/code> function is compiled differently: anything needed <em>across<\/em> a suspension point is stored in a heap-allocated <strong>async frame<\/strong>, while anything used only within one uninterrupted stretch stays on the stack. The chain of async frames is the runtime representation of a <strong>continuation<\/strong>. When the function suspends, its stack frame is destroyed and the thread's stack is reused by the next piece of work — nothing is left occupied.<\/p><\/blockquote><h2 id=\"the-cooperative-thread-pool\">The cooperative thread pool<\/h2><p>Swift's threads live in a pool with a deliberate size limit, stated by Apple plainly:<\/p><blockquote class=\"aside plain\"><p>\"The new thread pool will only spawn as many threads as there are CPU cores, thereby making sure not to overcommit the system.\"<\/p><\/blockquote><p>Six cores, six threads. Not sixteen times more. Thread explosion isn't mitigated — it is structurally impossible, because no mechanism exists that creates the seventh thread.<\/p><p>This is only safe because of the rule from chapter 2. If a pool thread could block, six blocked threads would mean a frozen app with no way to recover. <strong>The pool is small because threads never block, and threads never block because <code><span class=\"t-kw\">await<\/span><\/code> suspends instead.<\/strong><\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Six desks, six workers, permanently. Nobody is hired mid-crisis, because nobody ever stands on hold — they put the slip down instead. The small permanent staff is only possible <em>because<\/em> of that rule, and the rule is only bearable <em>because<\/em> the staff is small.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>Apple calls this the <strong>runtime contract<\/strong>: every thread must always be able to make forward progress. It is why <code><span class=\"t-kw\">await<\/span><\/code> suspends rather than waits, and why the runtime needs to know task dependencies — that knowledge is what lets it schedule without ever parking a thread.<\/p><p>It is also why semaphores and condition variables are <strong>unsafe<\/strong> here rather than merely discouraged: they create a dependency the runtime cannot see, so it cannot schedule around it, and a pool thread sits blocked. <code>os_unfair_lock<\/code> and <code><span class=\"t-typ\">NSLock<\/span><\/code> are acceptable for tight critical sections with no <code><span class=\"t-kw\">await<\/span><\/code> inside, because the runtime can always progress toward the release. Set <code><span class=\"t-typ\">LIBDISPATCH_COOPERATIVE_POOL_STRICT<\/span>=<span class=\"t-num\">1<\/span><\/code> to have a debug runtime catch violations.<\/p><\/blockquote><h2 id=\"switching-work-is-now-cheap\">Switching work is now cheap<\/h2><p>Because suspended work lives on the heap rather than on a thread's stack, a thread moving from one task to another needs no help from the operating system:<\/p><blockquote class=\"aside plain\"><p>\"When threads execute work under Swift concurrency they switch between continuations instead of performing a full thread context switch. This means that we now only pay the cost of a function call instead.\"<\/p><\/blockquote><p>A context switch costs microseconds and involves the kernel. A continuation switch costs about what calling a function costs. That difference is why a six-thread pool can service enormous numbers of tasks.<\/p><h2 id=\"interleaving\">Interleaving<\/h2><p>Put all of the above together and you get what Apple calls <strong>interleaving<\/strong>: one thread alternating between many tasks, each taking a turn whenever it can make progress.<\/p><p>Worth stating plainly, because beginners always ask: <em>on one thread, with no extra cores, does any of this help?<\/em> Yes — enormously — because the time it reclaims was time spent waiting, and waiting never needed a core.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>One clerk with forty slips on the go, working whichever has something to do right now. From outside it looks like forty people. It costs one desk.<\/p><\/blockquote>", "text": " a task is a job, not a worker this is the central move, and everything else follows from it. under the old model, \"do this in the background\" meant get a thread — hire a worker. workers are expensive, so you couldn't have many. under swift concurrency you create a task : a description of work to be done. a task is not a thread. it is an object on the heap, cheap enough that having tens of thousands is unremarkable. behind them sits a small, fixed pool of actual threads that pick tasks up and run them. many tasks, few threads. that single sentence is the shape of the whole system. in the office. stop hiring people. just stop confusing jobs with workers . write each job on a slip of paper and put it in a tray. a slip is not a person; it costs nothing, so you can write ten thousand. then employ exactly six workers, one per desk , and have them take slips from the tray and work them. ten thousand slips, six workers, six desks, nobody standing around. many slips, few workers — that's the whole rearrangement. async and await a function marked async is one that might need to pause. inside it, every point where it might pause is marked await : swift func loadprofile(id: string) async throws profile { let data = try await fetch(id) // might pause here return try decode(data) // ordinary work, no pause } await is not an instruction to go elsewhere. it marks a place where the function may be suspended : put down, with a note of where it had got to, so the thread can run something else. when the answer arrives the task resumes — possibly on a different thread. two consequences, and they are the two people get wrong. await does not mean \"background\". it means \"this may pause\". which thread continues afterwards is a separate question, answered in chapter 6. await does mean \"the world may have moved.\" you put the work down. other work ran. anything you checked before the await may no longer be true after it. that single fact is the root of chapter 5. in the office. a marked point on the slip where the worker may set it down — with a bookmark noting exactly where they had got to — and pick up somebody else's slip instead. the bookmark is the part that matters: the desk is cleared completely, so nothing of yours occupies it while you wait. under the hood. a synchronous function keeps its local state on the thread's stack, which is why it cannot be put down — the stack frame would have to survive, and stacks don't work that way. an async function is compiled differently: anything needed across a suspension point is stored in a heap allocated async frame , while anything used only within one uninterrupted stretch stays on the stack. the chain of async frames is the runtime representation of a continuation . when the function suspends, its stack frame is destroyed and the thread's stack is reused by the next piece of work — nothing is left occupied. the cooperative thread pool swift's threads live in a pool with a deliberate size limit, stated by apple plainly: \"the new thread pool will only spawn as many threads as there are cpu cores, thereby making sure not to overcommit the system.\" six cores, six threads. not sixteen times more. thread explosion isn't mitigated — it is structurally impossible, because no mechanism exists that creates the seventh thread. this is only safe because of the rule from chapter 2. if a pool thread could block, six blocked threads would mean a frozen app with no way to recover. the pool is small because threads never block, and threads never block because await suspends instead. in the office. six desks, six workers, permanently. nobody is hired mid crisis, because nobody ever stands on hold — they put the slip down instead. the small permanent staff is only possible because of that rule, and the rule is only bearable because the staff is small. under the hood. apple calls this the runtime contract : every thread must always be able to make forward progress. it is why await suspends rather than waits, and why the runtime needs to know task dependencies — that knowledge is what lets it schedule without ever parking a thread. it is also why semaphores and condition variables are unsafe here rather than merely discouraged: they create a dependency the runtime cannot see, so it cannot schedule around it, and a pool thread sits blocked. os_unfair_lock and nslock are acceptable for tight critical sections with no await inside, because the runtime can always progress toward the release. set libdispatch_cooperative_pool_strict=1 to have a debug runtime catch violations. switching work is now cheap because suspended work lives on the heap rather than on a thread's stack, a thread moving from one task to another needs no help from the operating system: \"when threads execute work under swift concurrency they switch between continuations instead of performing a full thread context switch. this means that we now only pay the cost of a function call instead.\" a context switch costs microseconds and involves the kernel. a continuation switch costs about what calling a function costs. that difference is why a six thread pool can service enormous numbers of tasks. interleaving put all of the above together and you get what apple calls interleaving : one thread alternating between many tasks, each taking a turn whenever it can make progress. worth stating plainly, because beginners always ask: on one thread, with no extra cores, does any of this help? yes — enormously — because the time it reclaims was time spent waiting, and waiting never needed a core. in the office. one clerk with forty slips on the go, working whichever has something to do right now. from outside it looks like forty people. it costs one desk. ", "outline": [{"a": "a-task-is-a-job-not-a-worker", "t": "A task is a job, not a worker"}, {"a": "async-and-await", "t": "async and await"}, {"a": "the-cooperative-thread-pool", "t": "The cooperative thread pool"}, {"a": "switching-work-is-now-cheap", "t": "Switching work is now cheap"}, {"a": "interleaving", "t": "Interleaving"}]}, {"slug": "actors", "title": "Actors", "summary": "What an actor is, and the difference between an actor and a thread.", "minutes": "9", "sources": [{"ref": "SE-0306", "label": "Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0306-actors.md"}, {"ref": "SE-0392", "label": "Custom Actor Executors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0392-custom-actor-executors.md"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<p>Chapter 3 solved <em>too many threads<\/em>. It did nothing about <em>shared data<\/em>. That is this chapter.<\/p><h2 id=\"what-an-actor-is\">What an actor is<\/h2><p>An <strong>actor<\/strong> is a thing that owns some data and is the only route to it.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">BankAccount<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> balance: <span class=\"t-typ\">Decimal<\/span> = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">func<\/span> deposit(_ amount: <span class=\"t-typ\">Decimal<\/span>) {\n        balance += amount\n    }\n\n    <span class=\"t-kw\">func<\/span> currentBalance() -&gt; <span class=\"t-typ\">Decimal<\/span> {\n        balance\n    }\n}<\/code><\/pre><\/div><p>From outside you cannot touch <code>balance<\/code>. You can only ask the actor to do something, and asking costs an <code><span class=\"t-kw\">await<\/span><\/code>:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">let<\/span> account = <span class=\"t-typ\">BankAccount<\/span>()\n<span class=\"t-kw\">await<\/span> account.deposit(<span class=\"t-num\">100<\/span>)\n<span class=\"t-kw\">let<\/span> b = <span class=\"t-kw\">await<\/span> account.currentBalance()<\/code><\/pre><\/div><p>Two callers can never be inside the actor at the same moment, so <code>balance += <span class=\"t-num\">100<\/span><\/code> cannot lose an increment. That safety is <strong>structural<\/strong> — there is no other route to the data — rather than a rule everyone has to remember. This is the difference between an actor and a lock, and it is the entire point.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Take the cabinet out of the open office. Put it in a back room, with a counter and a clerk in front of it. Now nobody <em>can<\/em> reach the cabinet — not \"shouldn't\", can't, there is a wall. You write your request, hand it across, and wait your turn. Two people can no longer spoil the same page because neither of them ever touches it.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0306 defines an actor as \"a reference type that protects access to its mutable state.\" Cross-actor access is permitted in exactly two forms: reading an immutable <code><span class=\"t-kw\">let<\/span><\/code> within the same module, or an asynchronous call. Everything else is a compile error, not a convention.<\/p><\/blockquote><h2 id=\"how-is-an-actor-different-from-a-thread\">How is an actor different from a thread?<\/h2><p>This is the most common point of confusion, and the reason is that the question quietly assumes they are the same kind of thing. They are not.<\/p><p><strong>A thread is a worker.<\/strong> It <em>executes<\/em>. It has a stack, the OS schedules it onto a core, and while it runs it consumes a core.<\/p><p><strong>An actor is a protected area around data.<\/strong> It does not execute anything. It has no stack. The OS has never heard of it. It is not scheduled onto a core, because it isn't the sort of thing that runs.<\/p><p>Asking how an actor differs from a thread is like asking how a bank vault differs from a bank teller. One is a worker, the other is a protected place workers must go through. They are not alternatives — a real system has both.<\/p><p><strong>So what runs an actor's code?<\/strong> A thread from the pool in chapter 3. Which one? Whichever is free.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">Counter<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> n = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">func<\/span> bump() {\n        n += <span class=\"t-num\">1<\/span>\n        print(<span class=\"t-typ\">Thread<\/span>.current)   <span class=\"t-com\">// a DIFFERENT thread on different calls<\/span>\n    }\n}<\/code><\/pre><\/div><p>Call <code>bump()<\/code> ten times and you may see several different threads. The actor doesn't care; nothing about its guarantee depends on which thread does the work. Conversely, one pool thread will, over a second, run work belonging to dozens of actors.<\/p><p><em>(Swift discourages inspecting <code><span class=\"t-typ\">Thread<\/span>.current<\/code> from concurrent code precisely because the answer is meaningless to the model — but as a one-off demonstration it makes the point better than any paragraph.)<\/em><\/p><p><strong>The guarantee, stated exactly.<\/strong> An actor gives <strong>mutual exclusion, not thread affinity<\/strong>. SE-0392 is explicit: a serial executor guarantees that for any two jobs, all of one happens before all of the other — and deliberately says nothing about threads. Apple's wording: <em>\"Swift's concurrency design is intentionally vague about the details of how code is actually run.\"<\/em><\/p><div class=\"scroll\"><table><thead><tr><th><\/th><th>Thread<\/th><th>Actor<\/th><\/tr><\/thead><tbody><tr><td>What it is<\/td><td>a worker that executes<\/td><td>a protected region of data<\/td><\/tr><tr><td>Owned by<\/td><td>the operating system<\/td><td>your program<\/td><\/tr><tr><td>Has a stack<\/td><td>yes, ~0.5 MB+<\/td><td>no<\/td><\/tr><tr><td>Scheduled onto a core<\/td><td>yes<\/td><td>never — it doesn't run<\/td><\/tr><tr><td>How many<\/td><td>hundreds, each costs<\/td><td>millions, they're just objects<\/td><\/tr><tr><td>Created because<\/td><td>you need something executed<\/td><td>you have state to protect<\/td><\/tr><tr><td>Guarantees<\/td><td>nothing about your data<\/td><td>one access at a time<\/td><\/tr><tr><td>Runs on<\/td><td>a core<\/td><td>whatever pool thread is free<\/td><\/tr><\/tbody><\/table><\/div><p><strong>The one sentence:<\/strong> <em>a thread is who does the work; an actor is what the work must go through to reach the data.<\/em><\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The clerk is a worker. The counter is a place. The counter doesn't <em>do<\/em> anything — it is the arrangement that forces requests through one at a time. Whoever happens to be free staffs it, and it may be a different person each time. The counter never notices, and the guarantee never depended on who was standing there.<\/p><\/blockquote><h2 id=\"what-an-actor-is-made-of\">What an actor is made of<\/h2><p>Precisely, an actor is two things stuck together — and separating them is what makes chapter 6 make sense.<\/p><p><strong>An isolation domain.<\/strong> A compile-time idea: a named region of state, plus the rule that only code belonging to that region may touch it. This exists entirely in the compiler. It has no runtime existence; it is checked and then erased.<\/p><p><strong>A serial executor.<\/strong> A runtime object that accepts jobs and runs them one at a time. The thing that turns the compile-time promise into actual behaviour.<\/p><p>The split matters because the halves are independent. The domain says <em>who may touch this state<\/em>. The executor says <em>where the work runs<\/em>. Chapter 6 is entirely about what happens when people assume those are one question.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0392 formalises this. Every actor has an <code>unownedExecutor<\/code> — by default a fresh serial executor, but you can supply your own. Two different actors can be given the <em>same<\/em> executor and both remain correctly isolated from each other, because isolation is a compile-time property of the types, not of which executor they share. That is the cleanest available proof that isolation and execution are different things.<\/p><\/blockquote><h2 id=\"actor-versus-serial-queue\">Actor versus serial queue<\/h2><p>The closest older tool is a serial <code><span class=\"t-typ\">DispatchQueue<\/span><\/code>. Both give one-at-a-time access. They differ in what happens when someone has to wait — which is exactly the theme of chapter 2.<\/p><div class=\"scroll\"><table><thead><tr><th><\/th><th>Serial DispatchQueue<\/th><th>Actor<\/th><\/tr><\/thead><tbody><tr><td>Nobody's using it<\/td><td>dispatches to a thread — a context switch<\/td><td>current thread hops straight in, ~a function call<\/td><\/tr><tr><td>Someone's using it<\/td><td><strong>blocks the calling thread<\/strong><\/td><td><strong>suspends the caller<\/strong>, frees the thread<\/td><\/tr><tr><td>Blocked callers<\/td><td>occupy threads → thread explosion<\/td><td>none — nothing blocks<\/td><\/tr><tr><td>Order of work<\/td><td>strictly FIFO<\/td><td>not guaranteed FIFO<\/td><\/tr><tr><td>High-priority work stuck behind low<\/td><td>yes — priority inversion<\/td><td>no — can be run ahead<\/td><\/tr><\/tbody><\/table><\/div><p>That last row is worth understanding rather than memorising. With a serial queue, work runs in arrival order; a high-priority item behind five low-priority ones waits for all five. The old workaround was to boost the priority of everything ahead of it, which makes the five finish sooner but doesn't change that they must finish first. An actor isn't FIFO: pending work can be reordered, so the important item can go next.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A one-at-a-time window where waiting customers stand in line, versus one where you drop off a slip and go do something else. With the line, an urgent request behind five routine ones waits for all five, no matter how urgent. With slips, the urgent one can be pulled forward.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0306 states plainly that \"tasks awaiting an actor are not guaranteed to be run in the same order they originally awaited that actor.\" Non-FIFO isn't sloppiness — it is the mechanism that solves priority inversion, and it is why an actor is not a drop-in replacement for a serial queue in code that silently depended on ordering.<\/p><\/blockquote><h2 id=\"hopping-between-actors-is-cheap\">Hopping between actors is cheap<\/h2><p>When code on actor A calls actor B and B is free, no thread changes and the OS is not involved — the runtime suspends A's work item and starts B's on the same thread. Apple: <em>\"the thread did not block while hopping actors… hopping did not require a different thread.\"<\/em> The cost is close to a function call.<\/p><p>When B is busy the caller is suspended and the thread goes off to do other work. Still no blocking.<\/p><p>Compare with a serial queue, where \"busy\" means the calling thread waits — which is where thread explosion came from.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>If the back room is free, the clerk you are already talking to simply walks through — no new person, no handover. If it is busy, you leave your slip and go; nobody stands waiting.<\/p><\/blockquote>", "text": "chapter 3 solved too many threads . it did nothing about shared data . that is this chapter. what an actor is an actor is a thing that owns some data and is the only route to it. swift actor bankaccount { private var balance: decimal = 0 func deposit(_ amount: decimal) { balance += amount } func currentbalance() decimal { balance } } from outside you cannot touch balance . you can only ask the actor to do something, and asking costs an await : swift let account = bankaccount() await account.deposit(100) let b = await account.currentbalance() two callers can never be inside the actor at the same moment, so balance += 100 cannot lose an increment. that safety is structural — there is no other route to the data — rather than a rule everyone has to remember. this is the difference between an actor and a lock, and it is the entire point. in the office. take the cabinet out of the open office. put it in a back room, with a counter and a clerk in front of it. now nobody can reach the cabinet — not \"shouldn't\", can't, there is a wall. you write your request, hand it across, and wait your turn. two people can no longer spoil the same page because neither of them ever touches it. under the hood. se 0306 defines an actor as \"a reference type that protects access to its mutable state.\" cross actor access is permitted in exactly two forms: reading an immutable let within the same module, or an asynchronous call. everything else is a compile error, not a convention. how is an actor different from a thread? this is the most common point of confusion, and the reason is that the question quietly assumes they are the same kind of thing. they are not. a thread is a worker. it executes . it has a stack, the os schedules it onto a core, and while it runs it consumes a core. an actor is a protected area around data. it does not execute anything. it has no stack. the os has never heard of it. it is not scheduled onto a core, because it isn't the sort of thing that runs. asking how an actor differs from a thread is like asking how a bank vault differs from a bank teller. one is a worker, the other is a protected place workers must go through. they are not alternatives — a real system has both. so what runs an actor's code? a thread from the pool in chapter 3. which one? whichever is free. swift actor counter { private var n = 0 func bump() { n += 1 print(thread.current) // a different thread on different calls } } call bump() ten times and you may see several different threads. the actor doesn't care; nothing about its guarantee depends on which thread does the work. conversely, one pool thread will, over a second, run work belonging to dozens of actors. (swift discourages inspecting thread.current from concurrent code precisely because the answer is meaningless to the model — but as a one off demonstration it makes the point better than any paragraph.) the guarantee, stated exactly. an actor gives mutual exclusion, not thread affinity . se 0392 is explicit: a serial executor guarantees that for any two jobs, all of one happens before all of the other — and deliberately says nothing about threads. apple's wording: \"swift's concurrency design is intentionally vague about the details of how code is actually run.\" thread actor what it is a worker that executes a protected region of data owned by the operating system your program has a stack yes, ~0.5 mb+ no scheduled onto a core yes never — it doesn't run how many hundreds, each costs millions, they're just objects created because you need something executed you have state to protect guarantees nothing about your data one access at a time runs on a core whatever pool thread is free the one sentence: a thread is who does the work; an actor is what the work must go through to reach the data. in the office. the clerk is a worker. the counter is a place. the counter doesn't do anything — it is the arrangement that forces requests through one at a time. whoever happens to be free staffs it, and it may be a different person each time. the counter never notices, and the guarantee never depended on who was standing there. what an actor is made of precisely, an actor is two things stuck together — and separating them is what makes chapter 6 make sense. an isolation domain. a compile time idea: a named region of state, plus the rule that only code belonging to that region may touch it. this exists entirely in the compiler. it has no runtime existence; it is checked and then erased. a serial executor. a runtime object that accepts jobs and runs them one at a time. the thing that turns the compile time promise into actual behaviour. the split matters because the halves are independent. the domain says who may touch this state . the executor says where the work runs . chapter 6 is entirely about what happens when people assume those are one question. under the hood. se 0392 formalises this. every actor has an unownedexecutor — by default a fresh serial executor, but you can supply your own. two different actors can be given the same executor and both remain correctly isolated from each other, because isolation is a compile time property of the types, not of which executor they share. that is the cleanest available proof that isolation and execution are different things. actor versus serial queue the closest older tool is a serial dispatchqueue . both give one at a time access. they differ in what happens when someone has to wait — which is exactly the theme of chapter 2. serial dispatchqueue actor nobody's using it dispatches to a thread — a context switch current thread hops straight in, ~a function call someone's using it blocks the calling thread suspends the caller , frees the thread blocked callers occupy threads → thread explosion none — nothing blocks order of work strictly fifo not guaranteed fifo high priority work stuck behind low yes — priority inversion no — can be run ahead that last row is worth understanding rather than memorising. with a serial queue, work runs in arrival order; a high priority item behind five low priority ones waits for all five. the old workaround was to boost the priority of everything ahead of it, which makes the five finish sooner but doesn't change that they must finish first. an actor isn't fifo: pending work can be reordered, so the important item can go next. in the office. a one at a time window where waiting customers stand in line, versus one where you drop off a slip and go do something else. with the line, an urgent request behind five routine ones waits for all five, no matter how urgent. with slips, the urgent one can be pulled forward. under the hood. se 0306 states plainly that \"tasks awaiting an actor are not guaranteed to be run in the same order they originally awaited that actor.\" non fifo isn't sloppiness — it is the mechanism that solves priority inversion, and it is why an actor is not a drop in replacement for a serial queue in code that silently depended on ordering. hopping between actors is cheap when code on actor a calls actor b and b is free, no thread changes and the os is not involved — the runtime suspends a's work item and starts b's on the same thread. apple: \"the thread did not block while hopping actors… hopping did not require a different thread.\" the cost is close to a function call. when b is busy the caller is suspended and the thread goes off to do other work. still no blocking. compare with a serial queue, where \"busy\" means the calling thread waits — which is where thread explosion came from. in the office. if the back room is free, the clerk you are already talking to simply walks through — no new person, no handover. if it is busy, you leave your slip and go; nobody stands waiting. ", "outline": [{"a": "what-an-actor-is", "t": "What an actor is"}, {"a": "how-is-an-actor-different-from-a-thread", "t": "How is an actor different from a thread?"}, {"a": "what-an-actor-is-made-of", "t": "What an actor is made of"}, {"a": "actor-versus-serial-queue", "t": "Actor versus serial queue"}, {"a": "hopping-between-actors-is-cheap", "t": "Hopping between actors is cheap"}]}, {"slug": "reentrancy", "title": "Reentrancy", "summary": "The honest limitation — an actor stops data races, not the world moving while you wait.", "minutes": "7", "sources": [{"ref": "SE-0306", "label": "Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0306-actors.md"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<p>This is the chapter that separates people who have used actors from people who have read about them. It gets its own chapter because it is also the most-asked senior interview question in the whole area.<\/p><h2 id=\"the-guarantee-and-its-edge\">The guarantee, and its edge<\/h2><p>An actor guarantees that two pieces of code are never inside it <em>simultaneously<\/em>.<\/p><p>It does <strong>not<\/strong> guarantee that one piece of code runs start to finish without anyone else getting in.<\/p><p>Because when code inside an actor hits an <code><span class=\"t-kw\">await<\/span><\/code>, it is put down. The actor is released. Someone else gets in. When your work resumes, the world has moved.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">ImageLoader<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> cache: [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Data<\/span>] = [:]\n\n    <span class=\"t-kw\">func<\/span> data(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Data<\/span> {\n        <span class=\"t-kw\">if<\/span> <span class=\"t-kw\">let<\/span> cached = cache[url] { <span class=\"t-kw\">return<\/span> cached }       <span class=\"t-com\">// A: not there<\/span>\n        <span class=\"t-kw\">let<\/span> data = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> download(url)                 <span class=\"t-com\">// actor released here<\/span>\n        cache[url] = data\n        <span class=\"t-kw\">return<\/span> data\n    }\n}<\/code><\/pre><\/div><p>Two callers ask for the same image at the same time. Both reach A, both find nothing, both download, both store.<\/p><p><strong>No data race. No crash. Nothing corrupted. Two downloads.<\/strong><\/p><p>Doubled bandwidth, doubled cost, and every tool you own says the code is safe — because it is safe. It is just wrong.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The clerk has to phone a supplier about your request. Rather than making the whole queue wait ten minutes, he sets your slip aside and serves the next person — which is the good design, and is also the catch. While your slip was aside, other requests went through. The record you checked before the call may not say the same thing after it.<\/p><\/blockquote><h2 id=\"the-single-threaded-illusion\">The single-threaded illusion<\/h2><p>Apple's name for what an actor provides is the <strong>single-threaded illusion<\/strong>: no two functions ever run <em>concurrently<\/em> on an actor, but they may <strong>interleave<\/strong> at suspension points.<\/p><p>Interleaving is a feature, not a defect. It is what prevents deadlock, what frees the thread instead of blocking it, and what lets high-priority work jump the queue. Reentrancy is the bill for all three.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0306 chose reentrancy deliberately over the alternative. A non-reentrant actor — one that refuses new work while any call is suspended — deadlocks the moment two actors await each other, and reintroduces exactly the priority inversion that chapter 4 showed actors solving. The proposal's framing is that reentrancy trades a hard failure (deadlock) for a soft one (invariants needing re-validation), and the soft one is at least fixable in your own code.<\/p><\/blockquote><h2 id=\"the-fix\">The fix<\/h2><p>Never a bigger lock. A lock changes nothing here, because the two callers were never simultaneous — the problem is a gap in time, not simultaneous access.<\/p><p>The fix is to record that work is <strong>already in flight<\/strong>, and to record it <strong>before<\/strong> suspending:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">ImageLoader<\/span> {\n\n    <span class=\"t-com\">// MARK: - Publics<\/span>\n\n    <span class=\"t-kw\">func<\/span> data(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Data<\/span> {\n        <span class=\"t-kw\">switch<\/span> cache[url] {\n        <span class=\"t-kw\">case<\/span> .ready(<span class=\"t-kw\">let<\/span> data):\n            <span class=\"t-kw\">return<\/span> data\n        <span class=\"t-kw\">case<\/span> .inFlight(<span class=\"t-kw\">let<\/span> task):\n            <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> task.value          <span class=\"t-com\">// join the existing download<\/span>\n        <span class=\"t-kw\">case<\/span> <span class=\"t-kw\">nil<\/span>:\n            <span class=\"t-kw\">break<\/span>\n        }\n\n        <span class=\"t-kw\">let<\/span> task = <span class=\"t-typ\">Task<\/span> { <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> <span class=\"t-kw\">self<\/span>.download(url) }\n        cache[url] = .inFlight(task)             <span class=\"t-com\">// ← before any await. No window exists.<\/span>\n\n        <span class=\"t-kw\">do<\/span> {\n            <span class=\"t-kw\">let<\/span> data = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> task.value\n            cache[url] = .ready(data)\n            <span class=\"t-kw\">return<\/span> data\n        } <span class=\"t-kw\">catch<\/span> {\n            cache[url] = <span class=\"t-kw\">nil<\/span>                     <span class=\"t-com\">// don&#x27;t cache the failure<\/span>\n            <span class=\"t-kw\">throw<\/span> error\n        }\n    }\n\n    <span class=\"t-com\">// MARK: - Privates<\/span>\n\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">enum<\/span> <span class=\"t-typ\">Entry<\/span> {\n        <span class=\"t-kw\">case<\/span> inFlight(<span class=\"t-typ\">Task<\/span>&lt;<span class=\"t-typ\">Data<\/span>, <span class=\"t-typ\">Error<\/span>&gt;)\n        <span class=\"t-kw\">case<\/span> ready(<span class=\"t-typ\">Data<\/span>)\n    }\n\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> cache: [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Entry<\/span>] = [:]\n\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">func<\/span> download(_ url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Data<\/span> { /* … */ }\n}<\/code><\/pre><\/div><p>The load-bearing line is <code>cache[url] = .inFlight(task)<\/code> sitting between creating the task and the first <code><span class=\"t-kw\">await<\/span><\/code>. <strong>Actor code runs uninterrupted between suspension points<\/strong>, so there is no moment in which a second caller can slip past.<\/p><p>Two details worth keeping:<\/p><p><code><span class=\"t-typ\">Task<\/span> { … }<\/code> inside an actor method inherits the actor's isolation, so <code><span class=\"t-kw\">self<\/span>.download(url)<\/code> is a normal isolated call. The explicit <code><span class=\"t-kw\">self<\/span>.<\/code> is required because the closure escapes.<\/p><p><code>cache[url] = <span class=\"t-kw\">nil<\/span><\/code> in the <code><span class=\"t-kw\">catch<\/span><\/code> is what makes a transient failure retryable rather than permanent. Caching the failure is the second-most-common bug in this shape.<\/p><h2 id=\"the-general-rule\">The general rule<\/h2><p><strong>Establish your invariant before you suspend, and re-check anything you assumed after you resume.<\/strong><\/p><p>That covers every case in this family, and the family is large: the same shape recurs as a token-refresh actor, a mutation queue, a generic in-flight registry, and a deduplicating network layer. Learn it once and you have all four.<\/p><p><strong>The sentence to have automatic:<\/strong> <em>\"Actors guarantee no data races, not atomicity across suspension points — every invariant has to be re-validated after every <code><span class=\"t-kw\">await<\/span><\/code>.\"<\/em><\/p>", "text": "this is the chapter that separates people who have used actors from people who have read about them. it gets its own chapter because it is also the most asked senior interview question in the whole area. the guarantee, and its edge an actor guarantees that two pieces of code are never inside it simultaneously . it does not guarantee that one piece of code runs start to finish without anyone else getting in. because when code inside an actor hits an await , it is put down. the actor is released. someone else gets in. when your work resumes, the world has moved. swift actor imageloader { private var cache: [url: data] = [:] func data(for url: url) async throws data { if let cached = cache[url] { return cached } // a: not there let data = try await download(url) // actor released here cache[url] = data return data } } two callers ask for the same image at the same time. both reach a, both find nothing, both download, both store. no data race. no crash. nothing corrupted. two downloads. doubled bandwidth, doubled cost, and every tool you own says the code is safe — because it is safe. it is just wrong. in the office. the clerk has to phone a supplier about your request. rather than making the whole queue wait ten minutes, he sets your slip aside and serves the next person — which is the good design, and is also the catch. while your slip was aside, other requests went through. the record you checked before the call may not say the same thing after it. the single threaded illusion apple's name for what an actor provides is the single threaded illusion : no two functions ever run concurrently on an actor, but they may interleave at suspension points. interleaving is a feature, not a defect. it is what prevents deadlock, what frees the thread instead of blocking it, and what lets high priority work jump the queue. reentrancy is the bill for all three. under the hood. se 0306 chose reentrancy deliberately over the alternative. a non reentrant actor — one that refuses new work while any call is suspended — deadlocks the moment two actors await each other, and reintroduces exactly the priority inversion that chapter 4 showed actors solving. the proposal's framing is that reentrancy trades a hard failure (deadlock) for a soft one (invariants needing re validation), and the soft one is at least fixable in your own code. the fix never a bigger lock. a lock changes nothing here, because the two callers were never simultaneous — the problem is a gap in time, not simultaneous access. the fix is to record that work is already in flight , and to record it before suspending: swift actor imageloader { // mark: publics func data(for url: url) async throws data { switch cache[url] { case .ready(let data): return data case .inflight(let task): return try await task.value // join the existing download case nil: break } let task = task { try await self.download(url) } cache[url] = .inflight(task) // ← before any await. no window exists. do { let data = try await task.value cache[url] = .ready(data) return data } catch { cache[url] = nil // don't cache the failure throw error } } // mark: privates private enum entry { case inflight(task<data, error ) case ready(data) } private var cache: [url: entry] = [:] private func download(_ url: url) async throws data { / … / } } the load bearing line is cache[url] = .inflight(task) sitting between creating the task and the first await . actor code runs uninterrupted between suspension points , so there is no moment in which a second caller can slip past. two details worth keeping: task { … } inside an actor method inherits the actor's isolation, so self.download(url) is a normal isolated call. the explicit self. is required because the closure escapes. cache[url] = nil in the catch is what makes a transient failure retryable rather than permanent. caching the failure is the second most common bug in this shape. the general rule establish your invariant before you suspend, and re check anything you assumed after you resume. that covers every case in this family, and the family is large: the same shape recurs as a token refresh actor, a mutation queue, a generic in flight registry, and a deduplicating network layer. learn it once and you have all four. the sentence to have automatic: \"actors guarantee no data races, not atomicity across suspension points — every invariant has to be re validated after every await .\" ", "outline": [{"a": "the-guarantee-and-its-edge", "t": "The guarantee, and its edge"}, {"a": "the-single-threaded-illusion", "t": "The single-threaded illusion"}, {"a": "the-fix", "t": "The fix"}, {"a": "the-general-rule", "t": "The general rule"}]}, {"slug": "isolation-and-mainactor", "title": "Isolation, and why @MainActor is not the main thread", "summary": "Isolation domains are compile-time; threads are runtime. Four reasons they're not the same.", "minutes": "10", "sources": [{"ref": "SE-0316", "label": "Global Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0316-global-actors.md"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}, {"ref": "", "label": "Donny Wals · Setting default actor isolation in Xcode 26", "url": "https://www.donnywals.com/setting-default-actor-isolation-in-xcode-26/"}, {"ref": "", "label": "Malcolm Hall · @MainActor does not always mean main thread (2023, pre-SE-0461)", "url": "https://www.malcolmhall.com/2023/01/31/mainactor-does-not-always-mean-main-thread/"}], "html": "<h2 id=\"what-an-isolation-domain-is\">What an isolation domain is<\/h2><p>Chapter 4 split an actor into two halves. This chapter is about the compile-time half.<\/p><p>An <strong>isolation domain<\/strong> is a region of state plus the rule about who may touch it. Every piece of code belongs to exactly one of three kinds:<\/p><ul><li><strong>No domain<\/strong> — <code><span class=\"t-kw\">nonisolated<\/span><\/code>. It touches no protected state, so it needs no permission.<\/li><li><strong>An actor instance's domain<\/strong> — the code of <code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">BankAccount<\/span><\/code> belongs to whichever instance it runs on. Each instance is its own domain.<\/li><li><strong>A global actor's domain<\/strong> — <code><span class=\"t-atr\">@MainActor<\/span><\/code> being the one everybody knows. One domain, shared by the whole program.<\/li><\/ul><p>The compiler's entire job here is to check, wherever code touches state, that the code and the state are in the same domain. If not, you need an <code><span class=\"t-kw\">await<\/span><\/code> to get there, and what you carry across must be safe to carry.<\/p><p><strong>This is all checked and then thrown away.<\/strong> Isolation has no runtime representation. It is not a flag the program can inspect while running. It is a rule enforced before the app ever launches.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The rulebook entry saying which records each part of the building may touch. It lives in the rulebook, not in the building. The auditor reads it before opening day, confirms nobody's job description breaks it, and files it away. Nothing about it is visible once the doors open.<\/p><\/blockquote><h2 id=\"what-mainactor-is\">What <code><span class=\"t-atr\">@MainActor<\/span><\/code> is<\/h2><p><code><span class=\"t-atr\">@MainActor<\/span><\/code> is a <strong>global actor<\/strong>: an actor of which there is exactly one for the whole program, referred to by name rather than by holding an instance.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">ProfileViewModel<\/span> {\n    <span class=\"t-kw\">private<\/span>(<span class=\"t-kw\">set<\/span>) <span class=\"t-kw\">var<\/span> state: <span class=\"t-typ\">State<\/span> = .loading   <span class=\"t-com\">// main-actor state<\/span>\n\n    <span class=\"t-kw\">func<\/span> load() <span class=\"t-kw\">async<\/span> {\n        state = .loading\n        <span class=\"t-kw\">let<\/span> profile = <span class=\"t-kw\">try<\/span>? <span class=\"t-kw\">await<\/span> repository.profile()\n        state = profile.map(<span class=\"t-typ\">State<\/span>.loaded) ?? .failed\n    }\n}<\/code><\/pre><\/div><p>Everything visible to the user lives in this domain, and the reason is coherence rather than speed. A screen must never show half the old state and half the new. Funnelling every visible change through one domain, one at a time, makes a half-updated screen impossible.<\/p><p>Its executor is the main thread. <code><span class=\"t-typ\">MainActor<\/span><\/code> is the one actor with a dedicated thread, because the platform requires it: UIKit and AppKit must be driven from that specific thread.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>One counter faces the customers: the display board, the shop window, the queue number on the screen. Exactly one in the whole company, and everything the public can see goes through it. Its clerk is one specific named person who does nothing else — because the display equipment only responds to them.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>In Xcode 26 the build setting <code><span class=\"t-typ\">SWIFT_DEFAULT_ACTOR_ISOLATION<\/span><\/code> can put every unannotated declaration in a module into the main-actor domain, and it is the default for new app projects. It accepts exactly two values, <code><span class=\"t-typ\">MainActor<\/span><\/code> and <code><span class=\"t-kw\">nonisolated<\/span><\/code> — there is no diagnostic-only mode. Apple's framing is that an app should <em>start<\/em> entirely on the main actor and introduce concurrency only where profiling shows it is needed.<\/p><\/blockquote><h2 id=\"why-it-is-not-the-main-thread\">Why it is not \"the main thread\"<\/h2><p>They are so closely related that treating them as one thing usually produces correct code, which is exactly why the confusion survives. Four reasons, in increasing order of how convincing they are.<\/p><h3 id=\"1-they-are-different-categories-of-thing\">1 — they are different categories of thing<\/h3><p>The main thread is a <strong>runtime resource<\/strong>: an actual OS thread, with a stack, that the scheduler puts on a core. It exists while the program runs. You can count it.<\/p><p><code><span class=\"t-atr\">@MainActor<\/span><\/code> is a <strong>compile-time contract<\/strong> about which state a piece of code may touch. It does not exist at runtime at all.<\/p><p>One is a fact about execution. The other is a rule about access. They are connected — the rule is enforced <em>by<\/em> using that thread — but they are not the same statement, any more than \"holding the key\" and \"being authorised\" are the same statement.<\/p><h3 id=\"2-running-on-the-main-thread-does-not-make-you-main-actor-isolated\">2 — running on the main thread does not make you main-actor isolated<\/h3><p>This one you can demonstrate in ten seconds:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-typ\">DispatchQueue<\/span>.main.<span class=\"t-kw\">async<\/span> {\n    <span class=\"t-kw\">self<\/span>.label.text = <span class=\"t-str\">&quot;hello&quot;<\/span>      <span class=\"t-com\">// error: main actor-isolated property<\/span>\n}                                  <span class=\"t-com\">// …on the main thread.<\/span><\/code><\/pre><\/div><p>That closure runs on the main thread. Guaranteed, by name. And the compiler still refuses, because the closure is not <em>declared<\/em> as belonging to the main actor's domain. Being physically on the thread tells the compiler nothing, because the compiler is not reasoning about threads.<\/p><p>The bridge Apple provides is an assertion, not a hop:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-typ\">DispatchQueue<\/span>.main.<span class=\"t-kw\">async<\/span> {\n    <span class=\"t-typ\">MainActor<\/span>.assumeIsolated {\n        <span class=\"t-kw\">self<\/span>.label.text = <span class=\"t-str\">&quot;hello&quot;<\/span>   <span class=\"t-com\">// fine<\/span>\n    }\n}<\/code><\/pre><\/div><p><code>assumeIsolated<\/code> doesn't move anything. It says <em>I know I'm already there, take my word for it and check me at runtime<\/em> — and it traps if you were wrong.<\/p><p><strong>The existence of this API is itself the proof.<\/strong> If being on the main thread and being main-actor isolated were the same thing, there would be nothing to assume.<\/p><p>Contrast <code><span class=\"t-kw\">await<\/span> <span class=\"t-typ\">MainActor<\/span>.run { }<\/code>, which genuinely does move the work. Assert versus hop — two tools for two situations, and knowing which you need is knowing this distinction.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Standing in the front office is not the same as being authorised at the front desk. A courier can be physically inside the front office and still not be allowed to change the display board, and no amount of standing there grants it — authorisation is written in the rulebook, standing there is just where your feet happen to be. <code>assumeIsolated<\/code> is the courier saying <em>check my badge, I really do have authorisation<\/em> — a sentence that would be meaningless if being in the room were the authorisation.<\/p><\/blockquote><h3 id=\"3-the-guarantee-is-about-state-not-location\">3 — the guarantee is about state, not location<\/h3><p>What main-actor isolation buys you is: <em>no other code is touching this state at the same time.<\/em><\/p><p>Running on one specific thread is how that guarantee happens to be delivered <strong>for this one actor<\/strong>. Every other actor gets the identical guarantee with no dedicated thread at all — its work runs on whatever pool thread is free.<\/p><p>So \"runs on the main thread\" is a property of <code><span class=\"t-typ\">MainActor<\/span><\/code>'s particular executor. It is not what isolation <em>means<\/em>. Define <code><span class=\"t-atr\">@MainActor<\/span><\/code> as \"the main thread\" and you have defined it by an implementation detail that no other actor shares.<\/p><h3 id=\"4-the-thread-behaviour-changed-and-the-isolation-didn-t\">4 — the thread behaviour changed and the isolation didn't<\/h3><p>The most convincing one, because it is a natural experiment Swift ran on itself.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">func<\/span> refresh() <span class=\"t-kw\">async<\/span> {\n    <span class=\"t-kw\">let<\/span> items = <span class=\"t-kw\">await<\/span> loader.load()   <span class=\"t-com\">// loader.load() is nonisolated async<\/span>\n    <span class=\"t-kw\">self<\/span>.items = items\n}<\/code><\/pre><\/div><p><strong>Before Swift 6.2:<\/strong> <code>load()<\/code> hopped to the cooperative pool. It ran off the main thread. <strong>From Swift 6.2 (SE-0461):<\/strong> <code>load()<\/code> runs on the caller's actor. It runs <em>on<\/em> the main thread.<\/p><p>Same source. Same isolation before and after — <code>refresh()<\/code> was main-actor isolated in both, <code>load()<\/code> was nonisolated in both. Completely different thread behaviour.<\/p><p>If isolation and thread placement were the same thing, this change could not have happened. They moved independently, because they are independent.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>This is why articles written between 2021 and 2025 saying \"a nonisolated async function runs on a background thread\" are now wrong — including good ones, one of which is cited below precisely because it documents the old behaviour. SE-0338 made that the rule; SE-0461 reversed the default and introduced <code><span class=\"t-atr\">@concurrent<\/span><\/code> as the explicit opt-out. The migration hazard is real: work that used to drift off the main thread by default now stays on it, so Swift 6.2 can move CPU work <em>onto<\/em> main in code nobody edited.<\/p><\/blockquote><h3 id=\"and-the-one-that-makes-it-concrete\">And the one that makes it concrete<\/h3><p>A <code><span class=\"t-atr\">@MainActor<\/span><\/code> function is still main-actor isolated while it is suspended at an <code><span class=\"t-kw\">await<\/span><\/code> — during which the main thread is off running something else entirely. The isolation persists across a gap in which the code is not executing on any thread at all.<\/p><p><strong>A thread cannot be borrowed and given back. A domain can.<\/strong><\/p><p><strong>For a room:<\/strong> <em>\"<code><span class=\"t-atr\">@MainActor<\/span><\/code> is an isolation domain — a compile-time statement about which state you may touch. The main thread is the executor that happens to back it. <code><span class=\"t-typ\">DispatchQueue<\/span>.main.<span class=\"t-kw\">async<\/span><\/code> puts you on the thread without putting you in the domain, which is exactly why <code><span class=\"t-typ\">MainActor<\/span>.assumeIsolated<\/code> exists.\"<\/em><\/p><h2 id=\"nonisolated\"><code><span class=\"t-kw\">nonisolated<\/span><\/code><\/h2><p>Belongs to no domain, because it touches no protected state.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Formatter<\/span> {\n    <span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">func<\/span> format(_ n: <span class=\"t-typ\">Int<\/span>) -&gt; <span class=\"t-typ\">String<\/span> { <span class=\"t-str\">&quot;\\(n)&quot;<\/span> }   <span class=\"t-com\">// callable anywhere, no await<\/span>\n}<\/code><\/pre><\/div><p>Free — no queue, no waiting — and the compiler holds you to the claim. Reach for protected state from nonisolated code and you are stopped at compile time.<\/p><p>Since SE-0461, a <code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">async<\/span><\/code> function runs on <strong>the caller's actor<\/strong>, start to finish, including after every <code><span class=\"t-kw\">await<\/span><\/code>. \"Belongs to no domain\" no longer implies \"runs somewhere else.\"<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Work that touches no records at all: converting a measurement, adding up figures somebody handed you. No counter, no queue, no permission. Anyone, anywhere, any number at once.<\/p><\/blockquote><h2 id=\"concurrent\"><code><span class=\"t-atr\">@concurrent<\/span><\/code><\/h2><p>The explicit instruction to leave the caller's actor and run on the cooperative pool.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@concurrent<\/span>\n<span class=\"t-kw\">func<\/span> decodeImage(_ data: <span class=\"t-typ\">Data<\/span>) <span class=\"t-kw\">async<\/span> -&gt; <span class=\"t-typ\">Image<\/span> { /* … */ }<\/code><\/pre><\/div><p>It always hops — even from a caller that had no actor, where the hop buys nothing. <code><span class=\"t-kw\">async<\/span><\/code>-only, and mutually exclusive with <code><span class=\"t-atr\">@MainActor<\/span><\/code>.<\/p><p><strong>When it is justified:<\/strong> measured CPU work — decoding a large payload, downsampling an image, running inference. Back to chapter 1: this is the <em>real work<\/em> tool, not the <em>waiting<\/em> tool. Networking already suspends, and suspending doesn't occupy the actor, so moving I/O off buys nothing and costs two hops.<\/p><p>Apple's instruction is to profile first: <em>\"If it can't be made faster [without concurrency], you might need to introduce concurrency.\"<\/em> Not speculatively.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Deliberately sending a job to the back office rather than doing it at your own desk. Right for a long stocktake. A straight loss for adding up four numbers, because the two handovers cost more than the sum did.<\/p><\/blockquote>", "text": " what an isolation domain is chapter 4 split an actor into two halves. this chapter is about the compile time half. an isolation domain is a region of state plus the rule about who may touch it. every piece of code belongs to exactly one of three kinds: no domain — nonisolated . it touches no protected state, so it needs no permission. an actor instance's domain — the code of actor bankaccount belongs to whichever instance it runs on. each instance is its own domain. a global actor's domain — @mainactor being the one everybody knows. one domain, shared by the whole program. the compiler's entire job here is to check, wherever code touches state, that the code and the state are in the same domain. if not, you need an await to get there, and what you carry across must be safe to carry. this is all checked and then thrown away. isolation has no runtime representation. it is not a flag the program can inspect while running. it is a rule enforced before the app ever launches. in the office. the rulebook entry saying which records each part of the building may touch. it lives in the rulebook, not in the building. the auditor reads it before opening day, confirms nobody's job description breaks it, and files it away. nothing about it is visible once the doors open. what @mainactor is @mainactor is a global actor : an actor of which there is exactly one for the whole program, referred to by name rather than by holding an instance. swift @mainactor final class profileviewmodel { private(set) var state: state = .loading // main actor state func load() async { state = .loading let profile = try? await repository.profile() state = profile.map(state.loaded) ?? .failed } } everything visible to the user lives in this domain, and the reason is coherence rather than speed. a screen must never show half the old state and half the new. funnelling every visible change through one domain, one at a time, makes a half updated screen impossible. its executor is the main thread. mainactor is the one actor with a dedicated thread, because the platform requires it: uikit and appkit must be driven from that specific thread. in the office. one counter faces the customers: the display board, the shop window, the queue number on the screen. exactly one in the whole company, and everything the public can see goes through it. its clerk is one specific named person who does nothing else — because the display equipment only responds to them. under the hood. in xcode 26 the build setting swift_default_actor_isolation can put every unannotated declaration in a module into the main actor domain, and it is the default for new app projects. it accepts exactly two values, mainactor and nonisolated — there is no diagnostic only mode. apple's framing is that an app should start entirely on the main actor and introduce concurrency only where profiling shows it is needed. why it is not \"the main thread\" they are so closely related that treating them as one thing usually produces correct code, which is exactly why the confusion survives. four reasons, in increasing order of how convincing they are. 1 — they are different categories of thing the main thread is a runtime resource : an actual os thread, with a stack, that the scheduler puts on a core. it exists while the program runs. you can count it. @mainactor is a compile time contract about which state a piece of code may touch. it does not exist at runtime at all. one is a fact about execution. the other is a rule about access. they are connected — the rule is enforced by using that thread — but they are not the same statement, any more than \"holding the key\" and \"being authorised\" are the same statement. 2 — running on the main thread does not make you main actor isolated this one you can demonstrate in ten seconds: swift dispatchqueue.main.async { self.label.text = \"hello\" // error: main actor isolated property } // …on the main thread. that closure runs on the main thread. guaranteed, by name. and the compiler still refuses, because the closure is not declared as belonging to the main actor's domain. being physically on the thread tells the compiler nothing, because the compiler is not reasoning about threads. the bridge apple provides is an assertion, not a hop: swift dispatchqueue.main.async { mainactor.assumeisolated { self.label.text = \"hello\" // fine } } assumeisolated doesn't move anything. it says i know i'm already there, take my word for it and check me at runtime — and it traps if you were wrong. the existence of this api is itself the proof. if being on the main thread and being main actor isolated were the same thing, there would be nothing to assume. contrast await mainactor.run { } , which genuinely does move the work. assert versus hop — two tools for two situations, and knowing which you need is knowing this distinction. in the office. standing in the front office is not the same as being authorised at the front desk. a courier can be physically inside the front office and still not be allowed to change the display board, and no amount of standing there grants it — authorisation is written in the rulebook, standing there is just where your feet happen to be. assumeisolated is the courier saying check my badge, i really do have authorisation — a sentence that would be meaningless if being in the room were the authorisation. 3 — the guarantee is about state, not location what main actor isolation buys you is: no other code is touching this state at the same time. running on one specific thread is how that guarantee happens to be delivered for this one actor . every other actor gets the identical guarantee with no dedicated thread at all — its work runs on whatever pool thread is free. so \"runs on the main thread\" is a property of mainactor 's particular executor. it is not what isolation means . define @mainactor as \"the main thread\" and you have defined it by an implementation detail that no other actor shares. 4 — the thread behaviour changed and the isolation didn't the most convincing one, because it is a natural experiment swift ran on itself. swift @mainactor func refresh() async { let items = await loader.load() // loader.load() is nonisolated async self.items = items } before swift 6.2: load() hopped to the cooperative pool. it ran off the main thread. from swift 6.2 (se 0461): load() runs on the caller's actor. it runs on the main thread. same source. same isolation before and after — refresh() was main actor isolated in both, load() was nonisolated in both. completely different thread behaviour. if isolation and thread placement were the same thing, this change could not have happened. they moved independently, because they are independent. under the hood. this is why articles written between 2021 and 2025 saying \"a nonisolated async function runs on a background thread\" are now wrong — including good ones, one of which is cited below precisely because it documents the old behaviour. se 0338 made that the rule; se 0461 reversed the default and introduced @concurrent as the explicit opt out. the migration hazard is real: work that used to drift off the main thread by default now stays on it, so swift 6.2 can move cpu work onto main in code nobody edited. and the one that makes it concrete a @mainactor function is still main actor isolated while it is suspended at an await — during which the main thread is off running something else entirely. the isolation persists across a gap in which the code is not executing on any thread at all. a thread cannot be borrowed and given back. a domain can. for a room: \" @mainactor is an isolation domain — a compile time statement about which state you may touch. the main thread is the executor that happens to back it. dispatchqueue.main.async puts you on the thread without putting you in the domain, which is exactly why mainactor.assumeisolated exists.\" nonisolated belongs to no domain, because it touches no protected state. swift @mainactor final class formatter { nonisolated func format(_ n: int) string { \"\\(n)\" } // callable anywhere, no await } free — no queue, no waiting — and the compiler holds you to the claim. reach for protected state from nonisolated code and you are stopped at compile time. since se 0461, a nonisolated async function runs on the caller's actor , start to finish, including after every await . \"belongs to no domain\" no longer implies \"runs somewhere else.\" in the office. work that touches no records at all: converting a measurement, adding up figures somebody handed you. no counter, no queue, no permission. anyone, anywhere, any number at once. @concurrent the explicit instruction to leave the caller's actor and run on the cooperative pool. swift @concurrent func decodeimage(_ data: data) async image { / … / } it always hops — even from a caller that had no actor, where the hop buys nothing. async only, and mutually exclusive with @mainactor . when it is justified: measured cpu work — decoding a large payload, downsampling an image, running inference. back to chapter 1: this is the real work tool, not the waiting tool. networking already suspends, and suspending doesn't occupy the actor, so moving i/o off buys nothing and costs two hops. apple's instruction is to profile first: \"if it can't be made faster [without concurrency], you might need to introduce concurrency.\" not speculatively. in the office. deliberately sending a job to the back office rather than doing it at your own desk. right for a long stocktake. a straight loss for adding up four numbers, because the two handovers cost more than the sum did. ", "outline": [{"a": "what-an-isolation-domain-is", "t": "What an isolation domain is"}, {"a": "what-mainactor-is", "t": "What @MainActor is"}, {"a": "why-it-is-not-the-main-thread", "t": "Why it is not \"the main thread\""}, {"a": "nonisolated", "t": "nonisolated"}, {"a": "concurrent", "t": "@concurrent"}]}, {"slug": "sendable", "title": "Sendable", "summary": "What is allowed to cross a boundary — and the two separate jobs the one keyword does.", "minutes": "6", "sources": [{"ref": "SE-0302", "label": "Sendable and @Sendable closures", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0302-concurrent-value-and-concurrent-closures.md"}, {"ref": "SE-0414", "label": "Region based Isolation", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md"}, {"ref": "SE-0430", "label": "sending parameter and result values", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0430-transferring-parameters-and-results.md"}, {"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}], "html": "<p>Once there are domains, things have to move between them — and not everything can safely move.<\/p><h2 id=\"the-whole-idea-in-one-question\">The whole idea in one question<\/h2><p>When I hand this to somewhere else, <strong>do they get their own copy, or do we both end up holding the same thing?<\/strong><\/p><p>Own copy → nothing can go wrong → <code><span class=\"t-typ\">Sendable<\/span><\/code>. Same thing → we can both change it at once → not <code><span class=\"t-typ\">Sendable<\/span><\/code>.<\/p><p>That maps almost exactly onto value types versus reference types.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>What may go across the counter. A photocopy is fine — you each end up with your own, and neither can spoil the other's. A key to a room you also hold a key to is not fine: you have handed the problem straight through the wall, and the counter did nothing for you.<\/p><\/blockquote><h2 id=\"the-four-cases\">The four cases<\/h2><p><strong>Value types — free.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">Money<\/span> {                    <span class=\"t-com\">// implicitly Sendable, no annotation<\/span>\n    <span class=\"t-kw\">let<\/span> amount: <span class=\"t-typ\">Decimal<\/span>\n    <span class=\"t-kw\">var<\/span> currency: <span class=\"t-typ\">String<\/span>          <span class=\"t-com\">// `var` is fine — each holder has its own copy<\/span>\n}<\/code><\/pre><\/div><p><strong>Immutable final class — declare it, the compiler verifies.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Config<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">let<\/span> apiKey: <span class=\"t-typ\">String<\/span>            <span class=\"t-com\">// every stored property must be `let`<\/span>\n    <span class=\"t-kw\">let<\/span> timeout: <span class=\"t-typ\">TimeInterval<\/span>     <span class=\"t-com\">// and every type must itself be Sendable<\/span>\n}<\/code><\/pre><\/div><p>Swift infers <code><span class=\"t-typ\">Sendable<\/span><\/code> for structs and enums, never for classes. You state it; it checks you.<\/p><p><strong>Mutable class — refused.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Counter<\/span>: <span class=\"t-typ\">Sendable<\/span> {   <span class=\"t-com\">// error: stored property &#x27;value&#x27; is mutable<\/span>\n    <span class=\"t-kw\">var<\/span> value = <span class=\"t-num\">0<\/span>\n}<\/code><\/pre><\/div><p>Refused because the property <em>can<\/em> be mutated, not because anything does. <code><span class=\"t-kw\">let<\/span><\/code> versus <code><span class=\"t-kw\">var<\/span><\/code> only matters for classes; for a struct it is irrelevant, because copying already solved the problem.<\/p><p><strong>Protection the compiler can't see — <code><span class=\"t-atr\">@unchecked<\/span><\/code>.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">ImageStore<\/span>: <span class=\"t-atr\">@unchecked<\/span> <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">let<\/span> lock = <span class=\"t-typ\">NSLock<\/span>()\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> images: [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Data<\/span>] = [:]\n\n    <span class=\"t-kw\">func<\/span> image(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) -&gt; <span class=\"t-typ\">Data<\/span>? {\n        lock.lock(); <span class=\"t-kw\">defer<\/span> { lock.unlock() }\n        <span class=\"t-kw\">return<\/span> images[url]\n    }\n}<\/code><\/pre><\/div><p>A promise, not a proof. The obvious follow-up is <em>how do you know?<\/em>, and the only honest answers are \"there is a lock\", \"it is immutable in practice\", or \"one task drives it, and here is where that is written down.\"<\/p><h2 id=\"the-trap-that-catches-everyone\">The trap that catches everyone<\/h2><p>A container is only as safe as its contents.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">UserProfile<\/span>: <span class=\"t-typ\">Sendable<\/span> {    <span class=\"t-com\">// error — and it points at `avatar`<\/span>\n    <span class=\"t-kw\">let<\/span> name: <span class=\"t-typ\">String<\/span>\n    <span class=\"t-kw\">let<\/span> avatar: <span class=\"t-typ\">ImageBuffer<\/span>       <span class=\"t-com\">// a non-Sendable class<\/span>\n}<\/code><\/pre><\/div><p>It is a struct, everything is <code><span class=\"t-kw\">let<\/span><\/code>, and it still fails. Copying the struct copies the <em>reference<\/em> to the buffer, not the buffer. You handed over a key and called it a photocopy.<\/p><h2 id=\"two-jobs-one-keyword\">Two jobs, one keyword<\/h2><p>This is the distinction that separates people who understand <code><span class=\"t-typ\">Sendable<\/span><\/code> from people who have memorised it.<\/p><div class=\"scroll\"><table><thead><tr><th>Job<\/th><th>Checked<\/th><th>Rescued by region isolation?<\/th><\/tr><\/thead><tbody><tr><td>A value crossing a boundary at a call site<\/td><td>by dataflow<\/td><td><strong>Yes<\/strong> — a <em>disconnected<\/em> value can cross without conforming<\/td><\/tr><tr><td>A conformance requirement (<code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">P<\/span>: <span class=\"t-typ\">Sendable<\/span><\/code>, a <code><span class=\"t-typ\">Sendable<\/span><\/code> struct's properties)<\/td><td>on the declaration<\/td><td><strong>No<\/strong> — there is no dataflow to analyse<\/td><\/tr><\/tbody><\/table><\/div><p>That is why removing <code>&amp; <span class=\"t-typ\">Sendable<\/span><\/code> from a return type sometimes compiles and removing <code>: <span class=\"t-typ\">Sendable<\/span><\/code> from a protocol never does.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><strong>SE-0414 (region-based isolation)<\/strong> lets the compiler track which values can reach which others and prove a value is <em>disconnected<\/em> — nothing outside this region can still reach it. A disconnected non-<code><span class=\"t-typ\">Sendable<\/span><\/code> value can safely cross, because after the transfer the sender provably cannot touch it.<\/p><p><strong>SE-0430 (<code><span class=\"t-kw\">sending<\/span><\/code>)<\/strong> carries that fact across a function signature. Region analysis is intraprocedural: at a call site the compiler knows only the <em>signature<\/em>, not the callee's body. So a function returning a bare non-<code><span class=\"t-typ\">Sendable<\/span><\/code> value is assumed to be handing back something possibly still in its own region, and the transfer is rejected. <code>-&gt; <span class=\"t-kw\">sending<\/span> <span class=\"t-typ\">T<\/span><\/code> is the callee promising the result is disconnected, verified inside the callee.<\/p><p>Choosing between them: a <code><span class=\"t-typ\">Sendable<\/span><\/code> bound when the type genuinely is safe to share — checked once, at the type. <code><span class=\"t-kw\">sending<\/span><\/code> when the type isn't <code><span class=\"t-typ\">Sendable<\/span><\/code> but this particular value is exclusively owned — checked at every implementation of the signature, which is a larger maintenance surface.<\/p><\/blockquote><h2 id=\"why-it-goes-on-a-protocol\">Why it goes on a protocol<\/h2><p><code><span class=\"t-typ\">Sendable<\/span><\/code> is transitive. Anything <em>storing<\/em> an <code><span class=\"t-kw\">any<\/span> <span class=\"t-typ\">HTTPClientType<\/span><\/code> needs that type to be <code><span class=\"t-typ\">Sendable<\/span><\/code> in order to be <code><span class=\"t-typ\">Sendable<\/span><\/code> itself. Leave it off the contract and every holder becomes non-<code><span class=\"t-typ\">Sendable<\/span><\/code>, and it spreads outward through the app.<\/p><p>You cannot add it cheaply later, which is why it belongs on the job description written at the start rather than on any particular implementation.<\/p><h2 id=\"the-bit-most-people-miss\">The bit most people miss<\/h2><p><strong><code><span class=\"t-typ\">Sendable<\/span><\/code> is only ever checked at a crossing.<\/strong><\/p><p>A mutable class used entirely within one domain never needs it. It is not a verdict on whether a type is well written — it is a question asked at a specific boundary, about a specific value, at a specific moment.<\/p><p>Which is why <em>\"why does this need to be <code><span class=\"t-typ\">Sendable<\/span><\/code>?\"<\/em> has the answer <strong>\"because it crosses here — and if I move that line, it doesn't.\"<\/strong><\/p>", "text": "once there are domains, things have to move between them — and not everything can safely move. the whole idea in one question when i hand this to somewhere else, do they get their own copy, or do we both end up holding the same thing? own copy → nothing can go wrong → sendable . same thing → we can both change it at once → not sendable . that maps almost exactly onto value types versus reference types. in the office. what may go across the
