 every post; the api is the agreed set of requests the app may send it (like the forms a counter clerk accepts). endpoint — one specific request the api accepts, such as \"give me the next posts\". feed, page — the feed is the endless list of posts; it arrives in pages of about 20 at a time, so the app never downloads everything at once. cursor — a bookmark the server hands back with each page, meaning \"you stopped here\". the app sends it back to get the page after it. layer — a group of parts with the same kind of job. here: presentation (what you see), domain (the plain description of the data and what may be asked for), data (where the data actually comes from). view model — the part that holds a screen's current state and decisions, separate from the drawing of it. model — a plain description of one thing (a post), with no behaviour. the domain model is the app's own version. dto and mapping — a dto is a copy of the server's format, field for field; mapping translates it into the app's domain model, like converting a form from another office into your own. protocol — a written promise of what a part can do, without how. any part that keeps the promise can stand in, including a fake one in a test. repository — the one place the app asks for data, which hides whether it came from the server or the phone. cache — a kept copy of something fetched before, so it's instant next time. main thread / main actor — the single lane that draws the screen. slow work there freezes scrolling, so it's kept short. optimistic update — showing the result of a tap (the red heart) immediately, before the server confirms, and undoing it if the server says no. idempotent — a request that has the same effect sent once or twice (\"set liked to yes\"), so repeating it after a network blip is safe. decode, pixel — a photo arrives compressed (a jpeg); decoding unpacks it into the grid of coloured dots ( pixels ) the screen draws. unpacked, it's many times bigger. ::: ::: 1 · the interviewer answers your clarifying questions ask yours first. these are the answers you'd get, and the assumptions the rest of this chapter runs on. \"what's in a post?\" → one photo, an author, a caption, a like count and whether i liked it. carousels and video exist in the real app; leave them out. \"who orders the feed — chronological or ranked?\" → ranked, by the server. the client gets pages in order and doesn't reorder. \"how much should work offline?\" → opening the app on the u bahn should show what you saw last time. posting and liking offline are nice to haves. \"do new posts appear live?\" → we'd like the user to know there's something new. we don't need a live socket for it. \"which interactions matter?\" → like and unlike from the feed. comments open a separate screen — out of scope. \"minimum os, uikit or swiftui?\" → ios 17 minimum. swiftui app, but the feed screen is the most performance sensitive thing we have — tell me what you'd use. \"what hurts today?\" → stutter when flinging on older phones, the list jumping when images load, and data use. ::: ::: 2 · requirements and scope — what you should have said out of scope, stated first: ranking and the server timeline, posting and the camera, comments, stories, video and carousels, ads, search. the image loading pipeline is in scope only as a dependency — it's question 1, and you say so. functional — four 1. show a ranked feed of photo posts that loads more as you scroll, without a visible wait in normal conditions. 2. pull to refresh; tell the user when newer posts exist, without moving what they're reading. 3. like and unlike, instantly, surviving a refresh and a flaky network. 4. show the last seen feed immediately on launch, including offline. non functional that matter here smoothness — no dropped frames while flinging on a three year old phone. no decode, no json parsing, no layout measurement of unknown images on the main actor. stability — the content under the user's thumb never moves unless they asked it to. memory — bounded however far you scroll; decoded images are the budget, not models. data and battery — prefetch a little ahead, not a lot; honour low data mode. correctness — no duplicates, no gaps, no stale like state. then say the axis: \"everything here trades how far ahead i load against memory, data and battery. too little and the user waits; too much and we pay for posts nobody sees.\" ::: ::: 3 · the idea, in 30 seconds — before you draw anything say the whole design in plain words first, so the interviewer knows where you're going before the first box appears: \"the feed is a list that loads pages from the server with a cursor. one view model owns that list and decides when to load more. it gets posts from a repository, which hides whether they came from the network or from the copy we saved on disk. each post carries its image's size, so cells know their height before the image arrives, and the pixels come from the image library we designed in question 1. three layers: presentation, domain, data.\" that's it: four sentences. if they stop you here, you've already shown the shape of the answer. everything after this is filling it in. ::: ::: 4 · what we need — the components, before the sketch list them out loud, in the order you'll draw them. name each by what it does , not by its class name: the interviewer should understand the board without knowing swift. the type name is a detail you mention while explaining it. component type name layer its one job 1 feed screen feedview presentation the part of the app you see and scroll. draws the posts; reports scrolls, pulls and taps. 2 feed view model feedviewmodel presentation the screen's brain: which posts are shown, whether it's loading, when to fetch more. 3 post model feeditem domain the app's own description of one post: who, the caption, the likes, where the photo is and how big. 4 feed repository (protocol) feedrepository domain a written list of what the screen's brain may ask for, without saying how it's done. 5 feed repository (the real one) remotefeedrepository data does what that list promises: answers from the phone's copy or the server, and translates the server's format into the app's. 6 api client feedapi data the messenger to the company's servers. brings posts back in the server's own format. 7 local storage feedstore data a notebook on the phone with the last 200 posts, so the app opens even without internet. 8 image loader imagepipeline reused the photo library from question 1: fetches photos, shrinks them, remembers them. then say what's deliberately not on the list yet: an outbox for offline likes, a shared post store for several screens, a socket for live posts. \"i'll add those if we go there.\" ::: ::: 5 · the sketch mermaid flowchart tb subgraph p[\"presentation\"] view[\" 1 · feed screen feedview \"] \"user actions → posts\" vm[\" 2 · feed view model feedviewmodel \"] end subgraph d[\"domain\"] item[\" 3 · post model feeditem the app's own shape \"] repo[\" 4 · feed repository «protocol» \"] end subgraph da[\"data\"] impl[\" 5 · feed repository remotefeedrepository maps dto → feeditem \"] api[\" 6 · api client feedapi returns dtos \"] store[\" 7 · local storage feedstore \"] end pipe[\" 8 · image loader from question 1 \"] vm \"ask for posts → feeditems\" repo repo ~~~ impl impl . \"implements\" . repo impl \"requests → dtos\" api impl \"load · save posts\" store view \"photo url + size → image\" pipe class view,vm pres class item,repo dom class impl,store data class api net class pipe reuse each card is what it does in bold, with the type name underneath. a newcomer to the board reads the bold line; you say the type name as you point at it. how to read the arrows. a solid arrow means asks : it points from the part that asks to the part that answers, which is also the direction of dependency. its label reads request → reply , so the data coming back travels the other way along the same arrow. the dashed arrow means implements . section 7 replays the same flow step by step. drawing it on miro, step by step (about four minutes, talking the whole time): 1. three wide frames stacked top to bottom: presentation , domain , data . label them before putting anything in them. 2. fill them in the order of your list, one card per component, one colour per layer: blue for presentation, purple for domain, green for data, orange for anything that crosses the network, grey and dashed for the reused image loader. 3. arrows last, each pointing from the part that asks to the part that answers, labelled request → reply : the screen reports what the user did and gets posts to show; the view model asks the repository for posts; the real repository fetches pages from the api client and loads and saves posts in local storage; each row asks the image loader for its photo. then one dashed arrow up from the real repository to the protocol, labelled \"implements\". 4. write «protocol» on the domain repository card. this is where dependency inversion shows: both arrows touching that card point at it. the view model depends on the protocol (from above), and the data layer depends on it too (from below, by implementing it). nothing in the domain points down at the data layer, so the domain never depends on networking or storage. \"everything else is behind a protocol too, for tests. this is the one that defines the architecture.\" eight cards, three frames, five arrows. methods don't go on the board; they come up when the interviewer asks about a component, which is the next section. ::: ::: 6 · each component: its job, its interface, the choice inside it point at each card and cover three things: what it owns , its interface (what others can call or read, which is what an interviewer means by \"what does this expose?\"), and the choice you made inside it . the under the hood notes are for learning; you won't recite them in the room, but they're what lets you answer the follow up. 1 · feed screen ( feedview ) in plain words: the part of the app you actually see and scroll. it draws the posts it's handed and tells the rest of the app what you did: scrolled near the bottom, pulled down to refresh, tapped a heart. like a shop window: it shows things, it doesn't decide what's in stock. owns: nothing. it renders the posts it's given and reports what the user did. interface: it's created with a view model, reads three things from it ( items , phase , neweravailable ), and calls four ( onappear , onnearend , refresh , togglelike ). no other dependency: if the screen needs to know something, the view model exposes it. the choice inside it: uicollectionview with a diffable data source, wrapped in uiviewcontrollerrepresentable , because it recycles rows, has a prefetch callback, and has been tuned for this for a decade. rejected: swiftui lazyvstack , which creates rows lazily but is widely reported to keep them, so memory grows with how far you scroll. switch condition: simple rows on ios 18, where list profiles clean on the oldest supported phone. under the hood. in plain words: the list doesn't build a row for every post. it keeps about a screenful of rows and repaints them as you scroll, like a waiter reusing the same few plates. so a row must never assume what it showed a moment ago. the detail: a collection view keeps only the rows on screen plus a few spare; when a row scrolls off, it's reused for the one scrolling on. that's why a row must never assume what it showed before, and why images are requested per row and cancelled on reuse. a diffable data source takes a list of ids, works out what was inserted, removed or moved, and animates only that. it needs every id to be unique, which is why duplicate posts must be filtered out (a duplicate crashes, rather than glitching). 2 · feed view model ( feedviewmodel ) in plain words: the screen's brain. it keeps the list of posts currently shown, knows whether something is loading or failed, and decides when it's time to fetch the next batch. the screen only ever asks it \"what should i show now?\" owns: everything the screen shows: the posts, the loading state, whether newer posts exist, and the cursor for the next page. interface: swift @mainactor @observable final class feedviewmodel { init(repository: feedrepository) /// what the list shows private(set) var items: [feeditem] /// idle, loading first / more, refreshing, failed, no more pages private(set) var phase: phase /// drives the \"new posts\" pill private(set) var neweravailable: bool /// saved posts, then page 1 func onappear() async /// the only way the next page loads func onnearend() async /// pull to refresh func refresh() async /// optimistic, see deep dive 11 func togglelike(_ id: postid) } the choices inside it: one phase , not five booleans. separate isloading , isrefreshing , haserror flags allow states that can't exist, like loading and failed at once. one value with six cases can't. on the main actor , because the screen reads it every frame. every change happens in one place, so \"is it already loading? if not, start\" needs no lock. why mvvm. the view model is what makes the feed testable without a screen: give it a fake repository, call onnearend() twice, check one request went out. rejected: a single reducer store (tca style), which buys a strict event log at the cost of a dependency and a learning curve. switch condition: several screens sharing feed state. under the hood. in plain words: the screen redraws only the parts whose information changed, like a scoreboard that flips one digit instead of repainting the whole board. the detail: @observable (ios 17) makes swiftui track exactly which properties a view read while drawing, and redraw that view only when one of those changes. a row that reads one post's like count isn't redrawn when phase flips. the older observableobject redraws every listener on any @published change. @mainactor means \"all of this runs on the main thread\", enforced by the compiler, so the ui never reads half updated state. 3 · post model ( feeditem ) in plain words: a description of one post, like an index card: who posted it, the caption, the number of likes, whether you liked it, and the address of the photo with its width and height. the card says where the photo is, never holds the photo itself. owns: one post's data. no behaviour. interface: swift struct feeditem: identifiable, hashable, sendable { let id: postid /// name, avatar url let author: author let caption: string /// url, pixel width, pixel height, placeholder colour let image: imageref var likecount: int var likedbyme: bool } the choice inside it: no uiimage in the model. the image's width and height are in it, because they decide the row's height before any pixel arrives. under the hood. in plain words: a post's text is tiny, but its photo, once unpacked for the screen, is thousands of times bigger. so each post carries only the photo's address and size, and the photos themselves live in one place with a size limit. the detail: a post as data is about a kilobyte, so ten thousand of them is about 10 mb. a decoded photo is width × height × 4 bytes: a 12 megapixel photo is about 48 mb. put images in the model and the model's memory grows with every post scrolled past; leave them to the image loader, whose cache has a fixed budget, and memory stays flat. sendable means the struct can safely be handed from a background task to the main actor, which is how a page travels from the network to the screen. 4 · feed repository, the protocol ( feedrepository ) in plain words: a written menu of what the screen's brain is allowed to ask for: the posts saved on the phone, the next page, how many new posts there are, and \"like this\". it lists what you can order, not how the kitchen cooks it, so the kitchen can change without the menu changing. owns: nothing. it's a list of promises the data layer makes to the view model. interface: swift protocol feedrepository: sendable { /// what we stored last time, instantly func savedfeed() async [feeditem] /// posts + next cursor (nil = no more) func page(after cursor: cursor?) async throws feedpage /// for the \"new posts\" pill func newcount(since token: headtoken) async throws int /// like / unlike func setliked(_ liked: bool, post: postid) async throws } the choice inside it: this is the one protocol drawn on the board. the view model depends on it, never on the real repository, so a test can swap in a fake, and the data layer can change (a database instead of a file, graphql instead of rest) without the view model noticing. rejected: use case classes between the two ( loadnextpageusecase …); each would only forward a call. switch condition: real logic that belongs to neither the screen nor the data, such as combining two repositories. under the hood. in plain words: think of a restaurant. card 4 is the menu : it lists what the screen can order (saved posts, the next page, a like) and says nothing about cooking. card 5 is the kitchen that makes each order, from the server or from the phone's notebook. the dashed arrow pointing up is the kitchen promising to cook what's on the menu: the kitchen adapts to the menu, never the other way round. the screen only ever reads the menu, so you can swap the kitchen (a test kitchen with fake posts, a different server, a database) and the screen never notices, as long as the new kitchen serves what's on the menu. in one line: the screen depends on a promise, not on whoever keeps it, and whoever keeps it depends on the same promise. the detail: this is dependency inversion : the higher layer (presentation) defines what it needs as a protocol in the domain, and the lower layer (data) conforms to it. the arrow of dependency points up from data to domain, so the screen's code never imports anything about networking. in practice it's what makes the view model unit testable. 5 · feed repository, the real one ( remotefeedrepository ) in plain words: the kitchen behind that menu. when asked for posts, it decides whether to answer from the copy kept on the phone or to ask the company's servers, and it refreshes the phone's copy when fresh posts arrive. owns: the decision of where posts come from, keeping the disk copy fresh, and translating between the server's format, the saved format and the app's feeditem . interface: it conforms to feedrepository (above) and is built from the two things it coordinates: init(api: feedapitype, store: feedstoretype) . nothing else is public. the choices inside it: where posts come from. savedfeed() reads local storage; page(after: nil) fetches page 1 and, on success, rewrites the saved copy; later pages come from the network only. mapping at the boundary. the api client hands back postdto s, the server's shape; the repository turns each into a feeditem , the app's shape, in one small function. that's where a string date becomes a date , a missing optional gets a default, and a post that can't be shown (no image url, say) is dropped and logged instead of crashing a screen. saved posts are mapped the same way, from the store's own record. all of it runs off the main actor, so the view model receives finished values. rejected: decoding the json straight into feeditem . one type for both looks simpler, until the server renames a field or makes one optional and every screen that uses posts has to change. switch condition: a throwaway prototype, or an api you own and version together with the app. under the hood. in plain words: the repository is the single counter you ask for posts. behind the counter, someone decides whether they come from the notebook on the phone or from the server; you never have to know. the detail: the repository pattern puts one object between the app and all its data sources, so callers ask for \"posts\", never \"posts from the network\". it's also where you decide what counts as the truth: here the server is, and the disk is only a copy for opening fast and offline. (an app that edits data offline flips that, and the disk becomes the truth.) under the hood. in plain words: the server sends posts on its own form, and the app uses its own form. the repository copies one onto the other. when the server changes its form, only that copying step changes, not every screen that shows a post. the detail: a dto (data transfer object) is a type that exists only to match the outside world's format, field for field: the server's json, or the shape you save on disk. the domain model is the app's own idea of the same thing, in the types the app wants. keeping them separate means each changes for its own reason: the server team can rename likes_count and only the dto and one mapping line change. the mapping lives in the data layer (here the repository), because the domain must not know the server exists — the same rule as dependency inversion, applied to data. 6 · api client ( feedapi ) in plain words: the messenger to the company's servers. it knows their addresses and the format messages must be in, sends the request, and brings back the answer. nothing else in the app talks to the servers. owns: the http details: urls, headers, auth, and decoding the json into dtos that mirror it exactly. interface: swift /// the server's shape, field for field. lives in the data layer; never reaches a screen. struct feedpagedto: decodable, sendable { let items: [postdto] let nextcursor: string? let headtoken: string } struct postdto: decodable, sendable { let id", "outline": [{"a": "run-it-as-a-round-not-as-reading", "t": "Run it as a round, not as reading"}, {"a": "what-this-question-is-really-testing", "t": "What this question is really testing"}]}], "minutes": 106, "sources": [{"ref": "", "label": "weeeBox · Mobile system design, the Twitter feed walkthrough (cursor pagination, local storage, real-time options)", "url": "https://github.com/weeeBox/mobile-system-design"}, {"ref": "", "label": "System Design Handbook · Mobile system design interview", "url": "https://www.systemdesignhandbook.com/guides/mobile-system-design-interview/"}, {"ref": "", "label": "ByteByteGo · A framework for mobile system design interviews", "url": "https://bytebytego.com/courses/mobile-system-design-interview/a-framework-for-mobile-sd-interviews"}, {"ref": "", "label": "weeeBox · Mobile system design exercise, Image library", "url": "https://github.com/weeeBox/mobile-system-design/blob/master/exercises/image-library.md"}, {"ref": "WWDC18", "label": "Image and graphics best practices", "url": "https://developer.apple.com/videos/play/wwdc2018/219/"}, {"ref": "WWDC21", "label": "Make blazing fast lists and collection views", "url": "https://developer.apple.com/videos/play/wwdc2021/10252/"}, {"ref": "WWDC19", "label": "Advances in networking, part 1 (Low Data Mode)", "url": "https://developer.apple.com/videos/play/wwdc2019/712/"}, {"ref": "", "label": "Apple · CGImageSourceCreateThumbnailAtIndex", "url": "https://developer.apple.com/documentation/imageio/cgimagesourcecreatethumbnailatindex(_:_:_:)"}, {"ref": "", "label": "Apple · UIImage.preparingForDisplay()", "url": "https://developer.apple.com/documentation/uikit/uiimage/3750834-preparingfordisplay"}, {"ref": "", "label": "Apple · NSCache", "url": "https://developer.apple.com/documentation/foundation/nscache"}, {"ref": "", "label": "Apple · allowsConstrainedNetworkAccess", "url": "https://developer.apple.com/documentation/foundation/urlsessionconfiguration/allowsconstrainednetworkaccess"}, {"ref": "", "label": "Apple · UICollectionViewDataSourcePrefetching", "url": "https://developer.apple.com/documentation/uikit/uicollectionviewdatasourceprefetching"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "", "label": "Nuke · request coalescing and the pipeline", "url": "https://github.com/kean/Nuke"}, {"ref": "", "label": "System Design Handbook · iOS system design interview", "url": "https://www.systemdesignhandbook.com/guides/ios-system-design-interview/"}, {"ref": "WWDC19", "label": "Advances in UI data sources", "url": "https://developer.apple.com/videos/play/wwdc2019/220/"}, {"ref": "WWDC23", "label": "Discover Observation in SwiftUI", "url": "https://developer.apple.com/videos/play/wwdc2023/10149/"}, {"ref": "", "label": "Apple · NSDiffableDataSourceSnapshot.reconfigureItems(_:)", "url": "https://developer.apple.com/documentation/uikit/nsdiffabledatasourcesnapshot/reconfigureitems(_:)"}, {"ref": "", "label": "Apple · onScrollTargetVisibilityChange(idType:threshold:_:)", "url": "https://developer.apple.com/documentation/swiftui/view/onscrolltargetvisibilitychange(idtype:threshold:_:)"}]}], "built": "2026-10-02"}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);
  var view = document.getElementById('view');
  var tree = document.getElementById('tree');
  var rail = document.getElementById('rail');
  var find = document.getElementById('find');
  var outline = document.getElementById('outline');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function topicBy(slug) { return DATA.topics.filter(function (t) { return t.slug === slug; })[0]; }

  document.getElementById('foot').textContent = 'Built ' + DATA.built;

  /* ------------------------------------------------------------- sidebar */
  var showAllUpcoming = false;

  function sessionRail(t, route) {
    var out = '', group = null;
    t.chapters.forEach(function (c) {
      if (c.group !== group) {
        out += (group === null ? '' : '</div>') + '<p class="tl-sect">' + esc(c.group) + '</p><div class="tl">';
        group = c.group;
      }
      var on = route.topic === t.slug && route.chapter === c.slug;
      out += '<a class="' + (on ? 'on' : '') + '" href="#/' + t.slug + '/' + c.slug + '" title="' +
             esc(c.title) + '"><span class="n">' + esc(c.day.replace(/^0+/, '')) + '</span>' +
             esc(c.short || c.title) + '</a>';
    });
    var up = (t.upcoming || []);
    var shown = showAllUpcoming ? up : up.slice(0, 2);
    shown.forEach(function (u) {
      if (u.group !== group) {
        out += '</div><p class="tl-sect">' + esc(u.group) + '</p><div class="tl">';
        group = u.group;
      }
      out += '<a class="soon" title="' + esc(u.full || u.short) + '"><span class="n">' + esc(u.day) + '</span>' +
             esc(u.short) + '</a>';
    });
    out += group === null ? '' : '</div>';
    if (up.length > 2) {
      out += '<button class="tl-more" data-more="1">' +
             (showAllUpcoming ? 'Show less' : 'Show the remaining ' + (up.length - 2) + ' days') + '</button>';
    }
    var done = t.chapters.filter(function (c) { return c.day && c.day.indexOf('S') !== 0; }).length;
    return '<p class="tl-sect" style="margin-top:4px"><a href="#/' + t.slug + '" style="color:inherit;text-decoration:none">' +
           esc(t.title) + ' · ' + done + ' of ' + (t.total || t.chapters.length) + '</a></p>' + out;
  }

  function paintTree(route) {
    var sessions = DATA.topics.filter(function (t) { return t.kind === 'sessions'; });
    var others = DATA.topics.filter(function (t) { return t.kind !== 'sessions'; });

    var html = sessions.map(function (t) { return sessionRail(t, route); }).join('');
    if (others.length) html += '<p class="tl-sect">Reference</p>';

    html += others.map(function (t) {
      var open = route.topic === t.slug;
      var kids = !open ? '' : '<div class="kids">' + t.chapters.map(function (c, i) {
        var on = route.chapter === c.slug;
        return '<a class="' + (on ? 'on' : '') + '" href="#/' + t.slug + '/' + c.slug + '">' +
               '<span class="num">' + pad(i + 1) + '</span><span>' + esc(c.title) + '</span></a>';
      }).join('') + '</div>';
      return '<div class="tp' + (open ? ' open' : '') + '"><button data-topic="' + esc(t.slug) + '">' +
        '<span class="chev">' + (open ? '▾' : '▸') + '</span><span class="nm">' + esc(t.title) + '</span>' +
        '<span class="ct">' + t.chapters.length + '</span></button>' + kids + '</div>';
    }).join('');

    tree.innerHTML = html;
  }

  tree.addEventListener('click', function (e) {
    var more = e.target.closest('[data-more]');
    if (more) { showAllUpcoming = !showAllUpcoming; route(); return; }
    var head = e.target.closest('[data-topic]');
    if (head) { location.hash = '#/' + head.getAttribute('data-topic'); }
  });

  /* ---------------------------------------------------------------- home */
  function home() {
    var cards = DATA.topics.map(function (t) {
      var list = t.chapters.map(function (c, i) {
        return '<li><a href="#/' + t.slug + '/' + c.slug + '">' +
          '<span class="num">' + pad(i + 1) + '</span>' +
          '<span class="ch-t">' + esc(c.title) + '</span>' +
          '<span class="ch-m">' + esc(c.minutes) + ' min</span>' +
          '<span class="ch-s">' + esc(c.summary) + '</span></a></li>';
      }).join('');
      return '<section class="topic-card">' +
        '<p class="tagline">' + esc(t.tagline || '') + '</p>' +
        '<h2><a href="#/' + t.slug + '">' + esc(t.title) + '</a></h2>' +
        '<p class="blurb">' + esc(t.summary || '') + '</p>' +
        '<ul class="chapters">' + list + '</ul>' +
        '<div class="facts"><span><b>' + t.chapters.length + '</b> chapters</span>' +
        '<span><b>' + t.minutes + '</b> min end to end</span>' +
        '<span><b>' + t.sources.length + '</b> sources</span></div></section>';
    }).join('');

    view.innerHTML =
      '<header class="hero"><h1>The Reference Desk</h1>' +
      '<p>Things worth understanding properly rather than looking up again. Each topic builds from the ground ' +
      'up, every claim about mechanism carries its source, and the sources are linked where they are used.</p></header>' +
      '<div class="hr"></div>' + cards;
    document.title = 'The Reference Desk';
  }

  /* -------------------------------------------------------- session index */
  function sessionIndex(t) {
    var groups = [], byGroup = {};
    t.chapters.forEach(function (c) {
      if (!byGroup[c.group]) { byGroup[c.group] = []; groups.push(c.group); }
      byGroup[c.group].push(
        '<a class="card" href="#/' + t.slug + '/' + c.slug + '"><span class="n">DAY ' +
        esc(c.day.replace(/^0+/, '')) + '</span><b>' + esc(c.short || c.title) + '</b>' +
        '<span class="s">' + esc(c.minutes) + ' min · reading, code, questions</span></a>');
    });
    (t.upcoming || []).forEach(function (u) {
      if (!byGroup[u.group]) { byGroup[u.group] = []; groups.push(u.group); }
      byGroup[u.group].push(
        '<div class="card next"><span class="n">DAY ' + esc(u.day) + '</span><b>' + esc(u.short) +
        '</b><span class="s">not written yet</span></div>');
    });
    var done = t.chapters.length;
    view.innerHTML =
      '<div class="ix-head"><h1>' + esc(t.title) + '</h1><span class="meta">' + done + ' written · ' +
      (t.total || done) + ' planned · ' + t.minutes + ' min</span></div>' +
      '<p class="ix-lede">' + esc(t.summary || '') + '</p>' +
      groups.map(function (g) {
        return '<section class="build"><h3>' + esc(g) + '</h3><div class="cards">' +
               byGroup[g].join('') + '</div></section>';
      }).join('');
    document.title = t.title + ' · The Reference Desk';
  }

  /* ---------------------------------------------------------- topic index */
  function topicIndex(t) {
    var list = t.chapters.map(function (c, i) {
      return '<li><a href="#/' + t.slug + '/' + c.slug + '">' +
        '<span class="num">' + pad(i + 1) + '</span><span class="ch-t">' + esc(c.title) + '</span>' +
        '<span class="ch-m">' + esc(c.minutes) + ' min</span>' +
        '<span class="ch-s">' + esc(c.summary) + '</span></a></li>';
    }).join('');
    view.innerHTML =
      '<div class="ix-head"><h1>' + esc(t.title) + '</h1><span class="meta">' + t.chapters.length +
      ' chapters · ' + t.minutes + ' min</span></div>' +
      '<p class="ix-lede">' + esc(t.summary || '') + '</p>' +
      '<ul class="chapters">' + list + '</ul>';
    document.title = t.title + ' · The Reference Desk';
  }

  /* ------------------------------------------------------------- chapter */
  function chapter(t, c, idx) {
    var prev = t.chapters[idx - 1], next = t.chapters[idx + 1];
    var srcs = c.sources.length ? '<section class="sources"><h2>Sources for this chapter</h2><div class="src">' +
      c.sources.map(function (s) {
        return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
          '<span class="s-r">' + esc(s.ref) + '</span>' +
          '<span class="s-l">' + esc(s.label) + '<span class="s-u">' + esc(s.url) + '</span></span></a>';
      }).join('') + '</div></section>' : '';

    var pager = '<nav class="pager">' +
      (prev ? '<a href="#/' + t.slug + '/' + prev.slug + '"><span class="dir">Previous</span>' +
              '<span class="nm">' + esc(prev.title) + '</span></a>' : '') +
      (next ? '<a class="next" href="#/' + t.slug + '/' + next.slug + '"><span class="dir">Next</span>' +
              '<span class="nm">' + esc(next.title) + '</span></a>' : '') + '</nav>';

    var prog = '';
    if (t.kind === 'sessions' && c.day && c.day.indexOf('S') !== 0) {
      var n = parseInt(c.day, 10), total = t.total || t.chapters.length;
      var slice = 0, size = 0;
      t.chapters.concat(t.upcoming || []).forEach(function (x) {
        if (x.group === c.group) { size++; if (String(parseInt(x.day, 10)) === String(n)) slice = size; }
      });
      prog = '<div class="prog"><span class="lb">' + esc(c.group) +
        (slice ? ' · slice ' + slice + ' of ' + size : '') + '</span>' +
        '<span class="bar"><i style="width:' + Math.round(n / total * 100) + '%"></i></span>' +
        '<span class="lb">Day ' + n + ' of ' + total + '</span></div>';
    }

    view.innerHTML = '<article>' + prog +
      '<div class="eyebrow"><a href="#/' + t.slug + '">' + esc(t.title) + '</a><span class="dot"></span>' +
      'Chapter ' + pad(idx + 1) + ' of ' + pad(t.chapters.length) +
      '<span class="dot"></span>' + esc(c.minutes) + ' min</div>' +
      '<h1 class="title">' + esc(c.title) + '</h1>' +
      '<p class="lede">' + esc(c.summary) + '</p>' +
      c.html + srcs + pager + '</article>';
    document.title = c.title + ' · The Reference Desk';
    paintOutline(c);
    renderBoards();
  }


  /* ------------------------------------------------------- mermaid boards */
  var mermaidLib = null;
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function boardClasses() {
    function def(name, fill, stroke, extra) {
      return 'classDef ' + name + ' fill:' + cssVar(fill) + ',stroke:' + cssVar(stroke) +
             ',stroke-width:1.5px,color:' + cssVar('--ink') + (extra || '') + ';';
    }
    return [def('pres', '--b-pres', '--b-pres-s'), def('dom', '--b-dom', '--b-dom-s'),
            def('data', '--b-data', '--b-data-s'), def('net', '--b-net', '--b-net-s'),
            def('reuse', '--b-reuse', '--b-reuse-s', ',stroke-dasharray:5 4'),
            def('focus', '--b-pres', '--b-pres-s', ',stroke-width:3px')].join('\n');
  }
  function renderBoards() {
    var srcs = view.querySelectorAll('pre.board-src');
    if (!srcs.length) return;
    mermaidLib = mermaidLib || import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
      .then(function (m) { return m.default; });
    // Mermaid sizes every box by measuring its label. Measure with the real web font, or the box is
    // sized for the fallback face and the label is clipped once Plex Sans arrives.
    var fontsReady = document.fonts && document.fonts.load
      ? Promise.all(['400 15px "IBM Plex Sans"', '600 15px "IBM Plex Sans"'].map(function (f) {
          return document.fonts.load(f);
        })).then(function () { return document.fonts.ready; }).catch(function () {})
      : Promise.resolve();
    Promise.all([mermaidLib, fontsReady]).then(function (r) { return r[0]; }).then(function (mermaid) {
      mermaid.initialize({
        startOnLoad: false, securityLevel: 'strict', theme: 'base',
        fontFamily: "'IBM Plex Sans', -apple-system, sans-serif",
        themeCSS: 'b, strong { font-weight: 600; }',
        htmlLabels: false,
        flowchart: { htmlLabels: false, curve: 'basis', nodeSpacing: 36, rankSpacing: 46, padding: 14, wrappingWidth: 400 },
        sequence: { mirrorActors: false, messageAlign: 'center', actorFontSize: 15, messageFontSize: 15, noteFontSize: 14 },
        themeVariables: {
          fontSize: '15px', background: cssVar('--panel'), primaryColor: cssVar('--raised'),
          primaryTextColor: cssVar('--ink'), primaryBorderColor: cssVar('--faint'),
          lineColor: cssVar('--muted'), textColor: cssVar('--ink'), titleColor: cssVar('--ink'),
          clusterBkg: cssVar('--b-lane'), clusterBorder: cssVar('--rule'),
          edgeLabelBackground: cssVar('--panel'), actorBkg: cssVar('--raised'),
          actorBorder: cssVar('--faint'), actorTextColor: cssVar('--ink'),
          signalColor: cssVar('--muted'), signalTextColor: cssVar('--ink'),
          noteBkgColor: cssVar('--accent-soft'), noteBorderColor: cssVar('--accent'),
          noteTextColor: cssVar('--ink'), activationBkgColor: cssVar('--accent-soft'),
          activationBorderColor: cssVar('--accent'), labelBoxBkgColor: cssVar('--raised'),
          labelBoxBorderColor: cssVar('--faint'), loopTextColor: cssVar('--ink')
        }
      });
      Array.prototype.forEach.call(srcs, function (pre, i) {
        var text = pre.textContent;
        if (/^\s*(---[\s\S]*?---\s*)?flowchart/.test(text)) text += '\n' + boardClasses();
        mermaid.render('board-' + Date.now() + '-' + i, text).then(function (r) {
          var host = pre.parentNode, old = host.querySelector('.board-svg');
          if (old) old.remove();
          var div = document.createElement('div');
          div.className = 'board-svg';
          div.innerHTML = r.svg;
          // Frame labels top-left, like a Miro frame, so arrows entering from above don't cross them.
          Array.prototype.forEach.call(div.querySelectorAll('g.cluster'), function (c) {
            var rect = c.querySelector('rect'), label = c.querySelector('.cluster-label');
            if (!rect || !label) return;
            var m = /translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/.exec(label.getAttribute('transform') || '');
            if (!m) return;
            label.setAttribute('transform', 'translate(' + (parseFloat(rect.getAttribute('x')) + 10) + ', ' + m[2] + ')');
          });
          host.appendChild(div);
          pre.hidden = true;
        }).catch(function () { pre.hidden = false; });
      });
    }).catch(function () { /* offline: the source stays visible */ });
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(renderBoards);
  }

  var spy = null;
  function paintOutline(c) {
    var items = c.outline || [];
    if (items.length < 3) { outline.innerHTML = ''; return; }
    outline.innerHTML = '<p class="h">' + (c.day ? 'This session' : 'On this page') + '</p>' + items.map(function (o) {
      return '<a href="#' + esc(o.a) + '" data-anchor="' + esc(o.a) + '">' + esc(o.t) + '</a>';
    }).join('');

    if (spy) spy.disconnect();
    var links = {};
    outline.querySelectorAll('a').forEach(function (a) { links[a.getAttribute('data-anchor')] = a; });
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var a = links[e.target.id];
        if (!a) return;
        if (e.isIntersecting) {
          outline.querySelectorAll('a.on').forEach(function (x) { x.classList.remove('on'); });
          a.classList.add('on');
        }
      });
    }, { rootMargin: '0px 0px -75% 0px' });
    items.forEach(function (o) {
      var el = document.getElementById(o.a);
      if (el) spy.observe(el);
    });
  }

  /* -------------------------------------------------------------- search */
  function search(q) {
    outline.innerHTML = '';
    var hits = [];
    DATA.topics.forEach(function (t) {
      t.chapters.forEach(function (c, i) {
        var hay = (c.title + ' ' + c.summary + ' ' + c.text).toLowerCase();
        if (hay.indexOf(q) !== -1) hits.push({ t: t, c: c, i: i });
      });
    });
    view.innerHTML = '<div class="eyebrow">' + hits.length + ' chapter' + (hits.length === 1 ? '' : 's') +
      ' matching &ldquo;' + esc(q) + '&rdquo;</div>' +
      (hits.length ? '<ul class="results">' + hits.map(function (h) {
        return '<li><a href="#/' + h.t.slug + '/' + h.c.slug + '">' +
          '<div class="where">' + esc(h.t.title) + ' · ' + pad(h.i + 1) + '</div>' +
          '<div class="ch-t">' + esc(h.c.title) + '</div>' +
          '<div class="ch-s">' + esc(h.c.summary) + '</div></a></li>';
      }).join('') + '</ul>' : '<p class="empty">Nothing here yet. Try a different word.</p>');
  }

  /* -------------------------------------------------------------- router */
  function route() {
    var q = find.value.trim().toLowerCase();
    var parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
    var r = { topic: parts[0], chapter: parts[1] };
    paintTree(r);
    if (q.length > 1) { search(q); return; }

    var t = r.topic && topicBy(r.topic);
    if (!t) { outline.innerHTML = ''; home(); }
    else if (!r.chapter) {
      outline.innerHTML = '';
      if (t.kind === 'sessions') sessionIndex(t); else topicIndex(t);
    }
    else {
      var idx = -1;
      t.chapters.forEach(function (c, i) { if (c.slug === r.chapter) idx = i; });
      if (idx === -1) { outline.innerHTML = ''; home(); } else chapter(t, t.chapters[idx], idx);
    }
    window.scrollTo(0, 0);
    rail.classList.remove('open');
  }

  window.addEventListener('hashchange', route);
  find.addEventListener('input', route);
  document.getElementById('burger').addEventListener('click', function () { rail.classList.toggle('open'); });
  document.getElementById('home-link').addEventListener('click', function () {
    find.value = ''; location.hash = '#/';
    if (location.hash === '#/') route();
  });
  route();
})();
</script>
