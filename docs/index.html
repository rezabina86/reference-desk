, export) and tests use the same path.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> an actor is like a desk clerk who serves one person at a time, so two people never scribble on the same form at once. But while the clerk is on hold on a phone call, the next person in line may step up, so the clerk writes \"already being handled\" on the board <em>before<\/em> picking up the phone.<\/p><p><em>The detail:<\/em> An <em>actor<\/em> is an object that runs one piece of its code at a time, so its data can't be changed by two threads at once. The catch is <em>re-entrancy<\/em>: whenever the actor waits (an <code><span class=\"t-kw\">await<\/span><\/code>), other callers may run. So \"check the table, wait for a download, then write the table\" is not safe: two callers can both check before either writes. The fix, recording the running load <em>before<\/em> waiting, is deep dive 9.<\/p><\/blockquote><h3 id=\"3-memory-cache-imagememorycache-inside-the-pipeline\">3 · Memory cache (<code><span class=\"t-typ\">ImageMemoryCache<\/span><\/code>, inside the pipeline)<\/h3><p><strong>In plain words:<\/strong> a small, fast shelf of pictures ready to show, kept in the phone's working memory. It has a fixed size; when it's full, the picture unused the longest is thrown out to make room.<\/p><p><strong>Owns:<\/strong> decoded, ready-to-draw images.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImageMemoryCacheType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-com\">/// Fast, safe to call from the main thread<\/span>\n    <span class=\"t-kw\">func<\/span> image(<span class=\"t-kw\">for<\/span> key: <span class=\"t-typ\">ImageKey<\/span>) -&gt; <span class=\"t-typ\">UIImage<\/span>?\n    <span class=\"t-com\">/// Cost = the image&#x27;s bytes<\/span>\n    <span class=\"t-kw\">func<\/span> store(_ image: <span class=\"t-typ\">UIImage<\/span>, <span class=\"t-kw\">for<\/span> key: <span class=\"t-typ\">ImageKey<\/span>)\n    <span class=\"t-com\">/// On memory warning<\/span>\n    <span class=\"t-kw\">func<\/span> removeAll()\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> a least-recently-used cache with a <strong>byte budget<\/strong>, keyed by URL <strong>plus pixel size<\/strong>. <em>Rejected:<\/em> <code><span class=\"t-typ\">NSCache<\/span><\/code>, a fine answer for one image screen, but its eviction order is undocumented and you can't remove one URL at every size. <em>Switch condition:<\/em> one screen, no purging by URL.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> a shelf with a fixed size: when it's full, the item nobody has touched for the longest goes first.<\/p><p><em>The detail:<\/em> <em>LRU<\/em> (least recently used): when the cache is full, throw out what was used longest ago. It's built from a dictionary (find by key) plus a linked list ordered by use (find the oldest), so both are instant. The budget is in <strong>bytes<\/strong>, not item count, because one full-screen image can cost as much as a hundred thumbnails.<\/p><\/blockquote><h3 id=\"4-disk-cache-imagediskcache\">4 · Disk cache (<code><span class=\"t-typ\">ImageDiskCache<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> a bigger but slower drawer on the phone's storage that keeps the downloaded files themselves. Pictures you've seen before come from here instead of the internet, which is also how they still appear offline.<\/p><p><strong>Owns:<\/strong> downloaded, still-compressed bytes on disk.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImageDiskCacheType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">func<\/span> data(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> -&gt; <span class=\"t-typ\">Data<\/span>?\n    <span class=\"t-kw\">func<\/span> store(_ data: <span class=\"t-typ\">Data<\/span>, <span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span>\n    <span class=\"t-com\">/// Evict oldest, off the launch path<\/span>\n    <span class=\"t-kw\">func<\/span> trim(toBytes limit: <span class=\"t-typ\">Int<\/span>) <span class=\"t-kw\">async<\/span>\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> compressed bytes, keyed by <strong>URL alone<\/strong>, in <code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span><\/code>. <em>Rejected:<\/em> <code><span class=\"t-typ\">URLCache<\/span><\/code>, which obeys the server's cache headers, so <code>max-age=<span class=\"t-num\">300<\/span><\/code> would mean \"offline after five minutes\".<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> pictures are kept on the phone in their small, packed form and unpacked only when shown, like clothes kept vacuum-packed in a drawer and shaken out when you wear them.<\/p><p><em>The detail:<\/em> Compressed bytes (JPEG, HEIC) are 10–50 times smaller than the decoded image, and decoding is fast next to downloading, so disk stores bytes and memory stores images. Files are named by a hash of the URL (so any URL makes a safe file name) and written <em>atomically<\/em>: to a temporary file, then renamed, so a crash never leaves half an image.<\/p><\/blockquote><h3 id=\"5-data-loader-the-protocol-dataloader\">5 · Data loader, the protocol (<code><span class=\"t-typ\">DataLoader<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> a job description: \"given an address, bring back the file\". It's written once, so anything that can do that job (the internet, the phone's own storage, a test) can be plugged in.<\/p><p><strong>Owns:<\/strong> nothing. It's the promise every source makes.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">DataLoader<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">func<\/span> data(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Data<\/span>\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> it's the one protocol drawn on the board, because it's where the library grows. A new source (the Photos library, test fixtures) is a new conformance, never a <code><span class=\"t-kw\">switch<\/span><\/code> inside the pipeline.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> this card is <strong>dependency inversion<\/strong>. Think of a dispatcher hiring delivery drivers. The dispatcher (the pipeline) writes one <strong>job description<\/strong>, \"given an address, bring back the file\", and hires only against that. The drivers (the network and file loaders) each promise to fit the description; that's the dashed arrow pointing <strong>up<\/strong> at it. The dispatcher never needs to know which driver turned up, so you can add a new driver (the Photos library, a test driver with fake files) without changing the dispatcher at all. In one line: <em>the dispatcher depends on a job description, not on any particular driver, and every driver depends on the same description.<\/em><\/p><p><em>The detail:<\/em> the pipeline (core) holds a <code><span class=\"t-typ\">DataLoader<\/span><\/code>, never a <code><span class=\"t-typ\">NetworkDataLoader<\/span><\/code>; the concrete loaders are created once when the library is set up and handed in. The dependency arrows all point at the protocol, so the core never imports networking or file code, and a test can pass a loader whose response it controls.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> every worker hired for the same job must behave the same way (stop when told, never hand over half a file) or the people relying on them get surprises.<\/p><p><em>The detail:<\/em> A protocol's contract is more than its signature. Every loader must also <strong>stop when cancelled<\/strong>, <strong>never return half the bytes<\/strong>, and be <strong>safe to call from several tasks at once<\/strong>. A loader that ignores cancellation still compiles, but breaks every caller that relies on it: that's the <em>Liskov substitution principle<\/em> in practice. Write the promises in the protocol's comment, and run the same tests against every loader.<\/p><\/blockquote><h3 id=\"6-network-and-file-loaders-networkdataloader-filedataloader\">6 · Network and file loaders (<code><span class=\"t-typ\">NetworkDataLoader<\/span><\/code>, <code><span class=\"t-typ\">FileDataLoader<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> the two workers who do that job: one downloads files from the internet, the other reads files already on the phone or packed inside the app.<\/p><p><strong>Owns:<\/strong> one source each.<\/p><p><strong>Interface:<\/strong> both conform to <code><span class=\"t-typ\">DataLoader<\/span><\/code>; nothing else is public. They differ only in what they're built from: <code><span class=\"t-typ\">NetworkDataLoader<\/span>(session: <span class=\"t-typ\">URLSession<\/span>)<\/code>, <code><span class=\"t-typ\">FileDataLoader<\/span>(fileManager: <span class=\"t-typ\">FileManager<\/span>)<\/code>.<\/p><p><strong>The choice inside it:<\/strong> the network loader asks the CDN for a resized image (<code>?w=<\/code>), rounding the width up to a few buckets (160, 320, 640, 1280) so neighbouring sizes share one cached copy.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> a chain of nearby warehouses that keep copies of each picture and can cut it down to size before sending it, so the phone downloads less.<\/p><p><em>The detail:<\/em> A <em>CDN<\/em> is a network of servers that keep copies of files close to users. One that can resize on request means the phone downloads a 640-pixel image instead of a 4000-pixel original: less data, less memory, less decoding. Rounding widths into buckets keeps the number of distinct copies small, so they're more likely to be cached.<\/p><\/blockquote><h3 id=\"7-image-decoder-imagedecoder\">7 · Image decoder (<code><span class=\"t-typ\">ImageDecoder<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> a downloaded picture is a compressed file, like a zipped folder. The decoder unpacks it into the grid of coloured dots the screen draws, and shrinks it to the size it will be shown while doing so.<\/p><p><strong>Owns:<\/strong> turning compressed bytes into a drawable image.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImageDecoderType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">func<\/span> image(from data: <span class=\"t-typ\">Data<\/span>, maxPixelSize: <span class=\"t-typ\">CGFloat<\/span>?) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">UIImage<\/span>\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> decode <strong>directly at the display size<\/strong> with ImageIO, off the main thread, and decode immediately rather than at first draw. Details in deep dive 10.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> a packed photo might be 2 MB, but unpacked into dots for the screen it's about 49 MB. Shrinking it while unpacking means the big version never exists on the phone.<\/p><p><em>The detail:<\/em> A decoded image costs <strong>width × height × 4 bytes<\/strong> (one byte each for red, green, blue, transparency), whatever the file size. A 4032 × 3024 photo is a 2 MB JPEG but 49 MB decoded; at 300 × 300 pixels it's 0.36 MB. Shrinking during decoding means the large version never exists in memory.<\/p><\/blockquote><h3 id=\"why-these-seven-and-not-one-imagemanager\">Why these seven, and not one ImageManager<\/h3><p>Each changes for a different reason: the loader with the transport, the decoder with the format, the caches with the eviction policy, the pipeline with the coordination rules. One <code><span class=\"t-typ\">ImageManager<\/span><\/code> would be touched by all of them. <em>\"I split where the reasons to change differ, not per noun.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>7 · One request through the sketch<\/summary><div class=\"reveal-body\"><p>Trace one request across the cards, the case where two rows want the same avatar at once:<\/p><div class=\"board\"><pre class=\"board-src\">sequenceDiagram\n  participant A as Row A\n  participant B as Row B\n  participant P as Image pipeline\n  participant M as Memory cache\n  participant D as Disk cache\n  participant L as Data loader\n  participant X as Image decoder\n  A-&gt;&gt;P: image(for: url, 160 px)\n  P-&gt;&gt;M: image(for: key)\n  M--&gt;&gt;P: nil\n  Note over P: no load running, so start one and record it\n  B-&gt;&gt;P: image(for: url, 160 px)\n  Note over P: same key already loading, so wait on it\n  P-&gt;&gt;D: data(for: url)\n  D--&gt;&gt;P: nil\n  P-&gt;&gt;L: data(for: url)\n  L--&gt;&gt;P: bytes\n  P-&gt;&gt;D: store(bytes)\n  P-&gt;&gt;X: image(from: bytes, 160)\n  X--&gt;&gt;P: image\n  P-&gt;&gt;M: store(image)\n  P--&gt;&gt;A: image\n  P--&gt;&gt;B: same image\n  Note over A,B: both rows show it<\/pre><\/div><p>In words: one download and one decode serve both rows. Solid arrows are requests, each a method from the interfaces in section 6; dashed arrows are the replies, the data flowing back: bytes up from disk or network, an image up from the decoder, and finally the image to both rows.<\/p><\/div><\/details><details class=\"reveal\"><summary>8 · The server contract and the two keys<\/summary><div class=\"reveal-body\"><p><strong>The server contract.<\/strong> Nothing of our own: <code><span class=\"t-typ\">GET<\/span> https:<span class=\"t-com\">//img.example.com/{id}?w={pixels}<\/span><\/code>, returning <code><span class=\"t-typ\">ETag<\/span><\/code> and <code><span class=\"t-typ\">Cache<\/span>-<span class=\"t-typ\">Control<\/span><\/code> headers. The client rounds width up into buckets so neighbouring sizes share a CDN entry and a disk entry.<\/p><p><strong>The two keys, the detail most answers miss.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-com\">/// Memory cache + running loads<\/span>\n<span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">ImageKey<\/span>: <span class=\"t-typ\">Hashable<\/span> { <span class=\"t-kw\">let<\/span> url: <span class=\"t-typ\">URL<\/span>; <span class=\"t-kw\">let<\/span> pixelSize: <span class=\"t-typ\">CGSize<\/span>? }\n<span class=\"t-com\">// the disk cache and the loaders key on the URL alone<\/span><\/code><\/pre><\/div><p>Bytes don't depend on the display size, so downloads and disk entries are shared by URL. A decoded image is only reusable at the size it was decoded for, so the memory cache keys on URL + size. Two rows showing one avatar at 80 and 300 points share a download and get two decodes.<\/p><p><strong>What's stored.<\/strong> Memory: key → image and its byte cost. Disk: one file per URL, named by its SHA-256 hash, in <code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span>/<span class=\"t-typ\">Images<\/span>/<\/code>, plus a small index of size, last use and <code><span class=\"t-typ\">ETag<\/span><\/code> for eviction and revalidation.<\/p><\/div><\/details><details class=\"reveal\"><summary>9 · Deep dive — \"Two cells show the same avatar. Walk me through it.\"<\/summary><div class=\"reveal-body\"><p><strong>Decision: an actor holds a dictionary of in-flight <code><span class=\"t-typ\">Task<\/span><\/code>s keyed by <code><span class=\"t-typ\">ImageKey<\/span><\/code>; callers join; the work is cancelled only when the last subscriber leaves.<\/strong><\/p><p>Say it as four steps, pointing at the pipeline card (section 7 draws exactly this):<\/p><ol start=\"1\"><li><strong>Check memory.<\/strong> A hit returns at once.<\/li><li><strong>Look for a load already running for this key.<\/strong> The pipeline keeps a small table: key → the running load and how many callers are waiting on it. If there's an entry, add one to the count and wait on that same load.<\/li><li><strong>Otherwise start a load and put it in the table straight away<\/strong>, before waiting on anything.<\/li><li><strong>When a caller goes away<\/strong> (its cell scrolled off), take one off the count. Only when nobody is left waiting is the load cancelled. When the load finishes, success or failure, its entry is removed.<\/li><\/ol><p><strong>Why step 3 says \"straight away\" — the whole trick.<\/strong> The pipeline is an actor, and an actor lets other callers in every time it waits. The naive version (check the cache, wait for the download, then store the result) leaves a gap: two callers both find nothing, both wait, both download. Recording the <em>running load<\/em> before waiting closes the gap, because the second caller finds it in the table. And the entry must be removed on failure too, or one failed load blocks that image forever.<\/p><p><em>Alternative rejected: cancel the shared work when any caller cancels.<\/em> Simpler and wrong — cell A scrolls away and kills the download cell B is still waiting for. <em>Alternative rejected: never cancel shared work.<\/em> Wastes bandwidth exactly during a fast fling, when requests pile up.<\/p><p><em>Switch condition:<\/em> if profiling showed duplicate URLs are rare on screen, the subscriber count is complexity for nothing; plain per-caller cancellation is fine. A nice middle: on last unsubscribe let the <strong>download<\/strong> finish into the disk cache and cancel only the <strong>decode<\/strong>.<\/p><p><strong>Where each piece runs.<\/strong> <code>setImage<\/code> is <code><span class=\"t-atr\">@MainActor<\/span><\/code> and reads the memory cache synchronously, so a hit paints in the same frame with no flicker. The pipeline actor does bookkeeping only — it must never decode, or every decode in the app serialises behind one executor. Decoding is <code><span class=\"t-atr\">@concurrent<\/span><\/code>, because since SE-0461 a plain <code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">async<\/span><\/code> function runs on the caller's actor: \"it's async\" no longer means \"it's off the main thread\", so the hop has to be asked for.<\/p><p><strong>Cell reuse is a cancellation problem, not a caching one.<\/strong> <code>setImage<\/code> keeps the current <code><span class=\"t-typ\">Task<\/span><\/code> on the view; a new call or <code>prepareForReuse<\/code> cancels it. On completion the view checks the request it finished for is still its current one, because cancellation is cooperative and a late result can still arrive. That check is what stops the wrong-image-in-a-reused-cell bug. SwiftUI's <code>.task(id: request)<\/code> gives you both behaviours for free.<\/p><\/div><\/details><details class=\"reveal\"><summary>10 · Deep dive — \"This grid gets the app killed on an iPhone 12. Why?\"<\/summary><div class=\"reveal-body\"><p><strong>The fact the rest rests on:<\/strong> memory cost comes from pixel dimensions, not file size. A decoded 8-bit RGBA bitmap costs width × height × 4 bytes. A 4032 × 3024 photo that's 2 MB as a JPEG is about 49 MB decoded. Twenty of those at full size is the kill.<\/p><p><strong>Decision: decode straight to display size with ImageIO; never decode full-size and then scale.<\/strong><\/p><p>ImageIO can produce a thumbnail directly from the compressed bytes, at a maximum pixel size you give it, so the full-size bitmap is never created. Three settings matter, and they're worth naming:<\/p><ul><li><strong>Don't keep a full-size copy<\/strong> in ImageIO's own cache.<\/li><li><strong>Decode now<\/strong>, here, off the main thread, not lazily the first time the image is drawn (which would happen on the main thread, mid-scroll).<\/li><li><strong>Apply the photo's orientation<\/strong> while shrinking, so portrait photos don't come out sideways.<\/li><\/ul><p>The first two are the difference between a smooth scroll and a hitch. (The API is <code><span class=\"t-typ\">CGImageSourceCreateThumbnailAtIndex<\/span><\/code>; naming it is enough, nobody will ask for the option keys.)<\/p><p><em>Alternative rejected:<\/em> redrawing through <code><span class=\"t-typ\">UIGraphicsImageRenderer<\/span><\/code> — it decodes the full image first, so peak memory is the full bitmap. <em>Also available:<\/em> <code><span class=\"t-typ\">UIImage<\/span>.byPreparingThumbnail(ofSize:)<\/code> and <code>byPreparingForDisplay()<\/code> (iOS 15) do this with far less code. <em>Switch condition:<\/em> if you don't need EXIF-transform control or exotic formats, use them and own less code. Sizes must be in <strong>pixels<\/strong> — points × <code>displayScale<\/code> — which is why the request carries a pixel size the view computes.<\/p><p><strong>Decision: a custom LRU memory cache with a byte budget<\/strong>, costed by <code>bytesPerRow × height<\/code> of the decoded image. Budget a fraction of what the process may use (sample <code>os_proc_available_memory()<\/code> at launch, take 15–20%, cap it). Purge on <code>didReceiveMemoryWarningNotification<\/code>; trim on background.<\/p><p><em>Alternative rejected: <code><span class=\"t-typ\">NSCache<\/span><\/code>.<\/em> Thread-safe, reacts to memory pressure by itself, and an entirely respectable answer. Its costs: eviction order is undocumented, you can't enumerate it to purge one URL at every size, and it's widely observed to empty itself on backgrounding — behaviour that isn't documented, so you can't design around it. <em>Switch condition:<\/em> one image screen, no need to purge by URL → <code><span class=\"t-typ\">NSCache<\/span><\/code> with a <code>totalCostLimit<\/code>, and say so out loud.<\/p><p><strong>\"Why cache decoded images at all, when the disk has the bytes?\"<\/strong> Because a disk read plus a decode is milliseconds of CPU per image, and scrolling back up the feed must paint in the same frame. Memory buys CPU and smoothness — the axis again.<\/p><\/div><\/details><details class=\"reveal\"><summary>11 · Deep dive — \"Why not just use URLCache?\"<\/summary><div class=\"reveal-body\"><p><strong>Decision: own a disk cache of encoded bytes, keyed by SHA-256 of the URL, in <code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span><\/code>, with a size cap and LRU eviction driven by a small index.<\/strong><\/p><ul><li><strong>Encoded, not decoded.<\/strong> Bytes are 10–50× smaller than the bitmap, and decoding is cheap next to the network. Storing bitmaps trades a lot of disk for a little CPU — the wrong direction on a phone.<\/li><li><strong>Atomic writes.<\/strong> Write to a temp file and rename (<code><span class=\"t-typ\">Data<\/span>.write(to:options: .atomic)<\/code>), so a kill mid-write leaves the old file or nothing, never a truncated JPEG that fails forever.<\/li><li><strong>LRU needs its own index.<\/strong> File access dates aren't a dependable \"recently used\" signal, so keep <code>hash → (bytes, lastAccess, etag)<\/code> in a small file or SQLite, updated in memory and flushed in batches.<\/li><li><strong>Sweep off the launch path.<\/strong> Enforce the cap (150–300 MB) on background entry or a low-priority task, never during start-up.<\/li><li><strong><code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span><\/code> is not backed up and the system may purge it<\/strong> — correct for a cache, and the code must treat any file as possibly gone.<\/li><\/ul><p><em>Alternative rejected: <code><span class=\"t-typ\">URLCache<\/span><\/code>.<\/em> Free, handles HTTP semantics, and Nuke's default loader leans on it. It loses here because it obeys the server: a CDN sending <code>max-age=<span class=\"t-num\">300<\/span><\/code> means \"offline after five minutes\", which breaks functional requirement 3. It also gives no control over eviction, can't purge one URL, and covers network sources only. <em>Switch condition:<\/em> if you control the cache headers and offline display isn't required, <code><span class=\"t-typ\">URLCache<\/span><\/code> with a large <code>diskCapacity<\/code> is the better answer — less code, correct revalidation for free. Say that it's a judgement call, not a rule.<\/p><p><strong>Revalidation.<\/strong> Store the <code><span class=\"t-typ\">ETag<\/span><\/code>; past a freshness window, show the disk copy immediately and revalidate in the background with <code><span class=\"t-typ\">If<\/span>-<span class=\"t-typ\">None<\/span>-<span class=\"t-typ\">Match<\/span><\/code>. A 304 just touches the index. Stale-while-revalidate, client-side.<\/p><\/div><\/details><details class=\"reveal\"><summary>12 · Failure modes and 10×<\/summary><div class=\"reveal-body\"><ul><li><strong>Offline.<\/strong> Disk hits work; misses fail fast with a typed error the view maps to a placeholder. Don't retry into a dead network — watch <code><span class=\"t-typ\">NWPathMonitor<\/span><\/code> and let the view re-request when the path returns.<\/li><li><strong>Errors and retries.<\/strong> One retry with jittered backoff for transient failures (timeout, connection lost, 5xx); none for 4xx. Remember 404s briefly in memory so a broken URL isn't refetched on every scroll.<\/li><li><strong>Races.<\/strong> Duplicate work: the in-flight dictionary. Late result into a reused cell: the current-request check.<\/li><li><strong>Corrupt bytes.<\/strong> Decode returns nil → delete the disk entry, refetch once, then give up. Never loop on a file that will never decode.<\/li><li><strong>Memory pressure.<\/strong> Memory warning purges the cache; in-flight decodes for visible cells finish. MetricKit's exit reasons tell you if you're being killed in the field; the first knob is the budget, the second the width buckets.<\/li><li><strong>Killed mid-operation.<\/strong> Atomic writes keep the disk consistent; the index may lag, so the next sweep reconciles — orphan files deleted, entries without files dropped.<\/li><li><strong>Low Data Mode.<\/strong> Prefetches set <code>allowsConstrainedNetworkAccess = <span class=\"t-kw\">false<\/span><\/code> and simply don't run on a constrained path; visible requests still load at a smaller bucket. A failure with <code>networkUnavailableReason == .constrained<\/code> becomes tap-to-load.<\/li><li><strong>Too many requests at once.<\/strong> A fling issues dozens. Cap per-host connections and give visible requests priority over prefetches; decodes run on the cooperative pool, already sized to the cores.<\/li><\/ul><p><strong>At 10×<\/strong> — ten times denser grid, or ten times more images per session:<\/p><ul><li>Memory: the budget is fixed by the device, so hit rate falls. Smaller buckets for thumbnails; cache fewer sizes per URL.<\/li><li>Disk: the index moves to SQLite so eviction is a query rather than a full load.<\/li><li>CPU: decode becomes the bottleneck on older devices. Prefetch decodes one screenful ahead, bytes further ahead.<\/li><li>Bandwidth: the CDN width parameter carries almost all of it. The client's job is to ask for the smallest bucket that still looks sharp.<\/li><\/ul><\/div><\/details><details class=\"reveal\"><summary>13 · Question bank — everything they can push on<\/summary><div class=\"reveal-body\"><p>Grouped by the checklist from the first chapter. Read the question, answer it out loud, <em>then<\/em> open it. Each area ends with a follow-up chain, because a real interviewer doesn't change topic after your first answer; they go one level deeper.<\/p><h3 id=\"clarify-and-scope\">Clarify and scope<\/h3><details><summary>\"Where would you start?\"<\/summary><p>Questions first: one app or an SDK, which sources (network, file, bundle), who consumes images (views and code), the heaviest screen, whether the CDN can resize, offline needs. Then out of scope first (GIFs, video, editing, transitions), then five features.<\/p><\/details><details><summary>\"Why not just use Kingfisher or Nuke?\"<\/summary><p>In a real team I'd start there: they're mature and cover this design. The exercise is to show I understand what they do. Reasons to own it: a size or dependency budget, an SDK that can't impose a dependency, or needs they don't meet.<\/p><\/details><details><summary>\"Why not AsyncImage?\"<\/summary><p>No memory cache you control, no downsampling, no prefetch, no dedupe across views. Fine for a settings screen, not for a grid you fling through.<\/p><\/details><details><summary>\"What are you optimising?\"<\/summary><p>Memory, disk, CPU and bandwidth trade against each other, and every choice spends one of them. The two hard requirements given: smooth scrolling on an old phone and no memory-pressure kills.<\/p><\/details><details><summary>Follow-up chain: \"Smallest version.\"<\/summary><ol start=\"1\"><li><em>\"You have two days. What do you build?\"<\/em> → A memory cache, downsampling, and cancel on reuse.<\/li><li><em>\"Why those three?\"<\/em> → They carry smoothness and the memory kills. Everything else is efficiency.<\/li><li><em>\"What comes next, in order?\"<\/em> → Disk cache (offline), then prefetch, then in-flight dedupe.<\/li><\/ol><\/details><h3 id=\"architecture-and-components\">Architecture and components<\/h3><details><summary>\"Walk me through the components.\"<\/summary><p>The API layer (view helpers and an async call), one pipeline actor that coordinates, and I/O underneath: a disk cache, a data loader per source, and a decoder. Four types plus the thin API.<\/p><\/details><details><summary>\"Why not one ImageManager?\"<\/summary><p>Each type changes for a different reason: the loader with the transport, the decoder with the format, the cache with the eviction policy, the pipeline with the coordination rules. One class would be touched by all four changes.<\/p><\/details><details><summary>\"Where is dependency inversion?\"<\/summary><p>The pipeline depends on loader, cache and decoder protocols; the concrete types are created once at the composition root and injected. That's what lets a test hold a download open to test dedupe.<\/p><\/details><details><summary>\"How do you add a new image source, say the Photos library?\"<\/summary><p>A new conformance to the loader protocol and one line in the composition root. The pipeline doesn't change; there's no <code><span class=\"t-kw\">switch<\/span><\/code> over sources to grow.<\/p><\/details><details><summary>\"Why is the pipeline an actor and not a class with a lock?\"<\/summary><p>Its coordination is async (it awaits loads), and a lock can't be held across an <code><span class=\"t-kw\">await<\/span><\/code>. The actor serialises the bookkeeping without blocking a thread.<\/p><\/details><details><summary>\"Is prefetching part of the main protocol?\"<\/summary><p>No, its own small protocol. A detail screen showing one image shouldn't depend on prefetching, or have to fake it in tests.<\/p><\/details><details><summary>Follow-up chain: \"Make it an SDK.\"<\/summary><ol start=\"1\"><li><em>\"Other teams want to adopt this. What changes?\"<\/em> → A Swift package with a small public surface: the request type, the async call, the view helpers.<\/li><li><em>\"How do they customise it?\"<\/em> → They inject their own loader, cache or decoder through the same protocols, so the seams become the extension points.<\/li><li><em>\"What do you guarantee?\"<\/em> → The protocol contracts in writing: loaders honour cancellation, never return partial data, are safe to call concurrently. And a shared test suite every conformance must pass.<\/li><\/ol><\/details><h3 id=\"api-and-keys\">API and keys<\/h3><details><summary>\"Design the public API.\"<\/summary><p>An <code><span class=\"t-typ\">ImageRequest<\/span><\/code> (URL, target pixel size, priority, whether constrained networks are allowed), an <code><span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span><\/code> call that returns an image, a separate prefetch protocol, and thin <code><span class=\"t-typ\">UIImageView<\/span><\/code> and SwiftUI helpers on top.<\/p><\/details><details><summary>\"Why async/await at the core and not callbacks?\"<\/summary><p>Cancellation comes free with task cancellation, non-UI callers use the same path, and tests call it directly with no view.<\/p><\/details><details><summary>\"What's the cache key?\"<\/summary><p>Two keys. Bytes (disk and network) key on the URL, because they're the same at any display size. Decoded images (memory and in-flight decodes) key on URL plus pixel size.<\/p><\/details><details><summary>\"Why does the request carry a pixel size?\"<\/summary><p>The decoder needs it to downsample, and it must be pixels (points × screen scale), which only the view knows.<\/p><\/details><details><summary>\"What does the server need to provide?\"<\/summary><p>A width parameter on the CDN, and <code><span class=\"t-typ\">ETag<\/span><\/code> / <code><span class=\"t-typ\">Cache<\/span>-<span class=\"t-typ\">Control<\/span><\/code> headers. The client rounds widths up into a few buckets so neighbouring sizes share one cache entry.<\/p><\/details><details><summary>Follow-up chain: \"Same URL, two sizes.\"<\/summary><ol start=\"1\"><li><em>\"Same URL on screen at 80 and 300 points. What happens?\"<\/em> → One download, two decodes, two memory entries, one file on disk.<\/li><li><em>\"Could you decode once?\"<\/em> → Decode the larger and scale down for the smaller, but that holds a bigger bitmap and costs a redraw. Usually not worth it.<\/li><li><em>\"When is it?\"<\/em> → When the two sizes are close: then round both to the same width bucket and they share everything.<\/li><\/ol><\/details><h3 id=\"caching\">Caching<\/h3><details><summary>\"Memory cache: NSCache or your own?\"<\/summary><p>My own LRU with a byte budget, so I control eviction order, can purge one URL at every size, and can cost entries in bytes. NSCache is a respectable answer for a single image screen: thread-safe and pressure-aware.<\/p><\/details><details><summary>\"How big is the memory cache?\"<\/summary><p>A fraction of what the process may use, about 15–20% of <code>os_proc_available_memory()<\/code> at launch, capped. Costed by the decoded bitmap's bytes, purged on memory warning.<\/p><\/details><details><summary>\"Why cache decoded images at all if the disk has the bytes?\"<\/summary><p>A disk read plus a decode is milliseconds of CPU per image. Scrolling back up must paint in the same frame, so memory buys smoothness.<\/p><\/details><details><summary>\"Why not URLCache for the disk?\"<\/summary><p>It obeys the server's headers, so <code>max-age=<span class=\"t-num\">300<\/span><\/code> means offline after five minutes, and it gives no control over eviction or purging one URL. If I controlled the headers and didn't need offline, URLCache would be the better, smaller answer.<\/p><\/details><details><summary>\"What do you store on disk?\"<\/summary><p>Encoded bytes, not bitmaps: 10–50× smaller. Files named by the SHA-256 of the URL in <code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span><\/code>, written atomically, with a small index of size, last access and ETag for LRU eviction.<\/p><\/details><details><summary>\"How do you keep images fresh?\"<\/summary><p>Show the disk copy at once, and past a freshness window revalidate in the background with <code><span class=\"t-typ\">If<\/span>-<span class=\"t-typ\">None<\/span>-<span class=\"t-typ\">Match<\/span><\/code>. A 304 only touches the index.<\/p><\/details><details><summary>Follow-up chain: \"The disk cache is full.\"<\/summary><ol start=\"1\"><li><em>\"The disk cache hits its cap. What happens?\"<\/em> → Evict least recently used files using the index.<\/li><li><em>\"When does eviction run?\"<\/em> → On background entry or a low-priority task, never on the launch path.<\/li><li><em>\"The app is killed mid-eviction.\"<\/em> → Writes are atomic, so files are whole or gone; the next sweep reconciles the index with what's actually on disk.<\/li><\/ol><\/details><h3 id=\"concurrency\">Concurrency<\/h3><details><summary>\"Two cells request the same image at once.\"<\/summary><p>The pipeline keeps a dictionary of in-flight tasks by key. The second caller joins the existing task. Lookup and insert happen with no <code><span class=\"t-kw\">await<\/span><\/code> between them, so it's atomic on the actor.<\/p><\/details><details><summary>\"A cell scrolls away. What gets cancelled?\"<\/summary><p>Its subscription. The shared task is cancelled only when the last subscriber leaves. Optionally let the download finish into the disk cache and cancel only the decode.<\/p><\/details><details><summary>\"Where does decoding run?\"<\/summary><p>On the cooperative pool via a <code><span class=\"t-atr\">@concurrent<\/span><\/code> function, never on the pipeline actor (it would serialise every decode) and never on the main actor. Under SE-0461 (Swift 6.2, when its upcoming feature is on), a plain <code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">async<\/span><\/code> function runs on the caller's actor, so the hop must be asked for.<\/p><\/details><details><summary>\"How do you stop a reused cell showing the wrong image?\"<\/summary><p>The view keeps its current request; a new request or reuse cancels the old task, and on completion the view checks the result is for its current request before assigning it. Cancellation is cooperative, so a late result can still arrive.<\/p><\/details><details><summary>\"A load fails. What happens to the in-flight entry?\"<\/summary><p>The task removes its entry on success and failure alike. Otherwise one failed load poisons that key forever.<\/p><\/details><details><summary>Follow-up chain: \"The naive version.\"<\/summary><ol start=\"1\"><li><em>\"Why not check the cache, await the download, then insert?\"<\/em> → Two callers both miss and both download, because an actor is re-entrant at every <code><span class=\"t-kw\">await<\/span><\/code>.<\/li><li><em>\"So how does storing the task fix it?\"<\/em> → The task is in the dictionary before the first <code><span class=\"t-kw\">await<\/span><\/code>, so the second caller finds it.<\/li><li><em>\"Where else does this bug appear?\"<\/em> → Anywhere a check and a set have an <code><span class=\"t-kw\">await<\/span><\/code> between them, like a feed's load-more guard.<\/li><\/ol><\/details><h3 id=\"performance-and-memory\">Performance and memory<\/h3><details><summary>\"What does a decoded image cost?\"<\/summary><p>Width × height × 4 bytes, regardless of file size. A 4032 × 3024 photo is about 49 MB decoded, though the JPEG is 2 MB.<\/p><\/details><details><summary>\"How do you downsample?\"<\/summary><p>ImageIO's <code><span class=\"t-typ\">CGImageSourceCreateThumbnailAtIndex<\/span><\/code> with a max pixel size, decoding immediately and honouring EXIF orientation, so the full-size bitmap never exists. <code><span class=\"t-typ\">UIImage<\/span>.byPreparingThumbnail(ofSize:)<\/code> does it with less code if I don't need the control.<\/p><\/details><details><summary>\"Why is the decode forced eagerly?\"<\/summary><p>Otherwise the image decodes lazily at first render, on the main thread, and that's the hitch.<\/p><\/details><details><summary>\"The grid gets killed on an iPhone 12. Why?\"<\/summary><p>Full-size decodes: twenty 49 MB bitmaps. Downsample to display size, cap the memory cache by bytes, purge on memory warning.<\/p><\/details><details><summary>\"How do you prefetch?\"<\/summary><p>From the collection view's prefetch callbacks, at low priority, cancelled when the user flings past, and off in Low Data Mode. Decode one screen ahead; fetch bytes further ahead.<\/p><\/details><details><summary>Follow-up chain: \"Still hitching.\"<\/summary><ol start=\"1\"><li><em>\"Decoding is off main and it still hitches. Where do you look?\"<\/em> → Instruments: Animation Hitches and a signpost around assignment. Maybe the image is still being decoded at render.<\/li><li><em>\"How would that happen?\"<\/em> → An image that wasn't force-decoded, or one at the wrong pixel size being scaled on render.<\/li><li><em>\"Fix it.\"<\/em> → Decode eagerly to exactly the displayed pixel size, and check sizes are pixels, not points.<\/li><\/ol><\/details><h3 id=\"networking-and-failures\">Networking and failures<\/h3><details><summary>\"How many downloads run at once?\"<\/summary><p>Cap concurrent connections per host and give visible requests priority over prefetches, so a fling doesn't queue fifty requests ahead of the cell on screen.<\/p><\/details><details><summary>\"A URL returns 404.\"<\/summary><p>No retry for 4xx. Remember the failure briefly in memory so the same broken URL isn't refetched on every scroll.<\/p><\/details><details><summary>\"The bytes are corrupt.\"<\/summary><p>The decode fails: delete the disk entry, refetch once, then give up. Never loop on a file that will never decode.<\/p><\/details><details><summary>\"What happens offline?\"<\/summary><p>Disk hits work; misses fail fast with a typed error the view maps to a placeholder. Watch <code><span class=\"t-typ\">NWPathMonitor<\/span><\/code> and let visible views re-request when the network returns.<\/p><\/details><details><summary>\"What does Low Data Mode change?\"<\/summary><p>Prefetches set <code>allowsConstrainedNetworkAccess = <span class=\"t-kw\">false<\/span><\/code> and don't run; visible images load at a smaller width bucket.<\/p><\/details><details><summary>Follow-up chain: \"Flaky network.\"<\/summary><ol start=\"1\"><li><em>\"Requests time out half the time. What do you do?\"<\/em> → One retry with jittered backoff for timeouts and 5xx.<\/li><li><em>\"Why only one?\"<\/em> → The user has scrolled on; more retries spend battery on images nobody's looking at.<\/li><li><em>\"And for the image they're looking at?\"<\/em> → Show the placeholder with tap-to-retry, and re-request when the path improves.<\/li><\/ol><\/details><h3 id=\"testing-observability-and-security\">Testing, observability and security<\/h3><details><summary>\"How do you test the dedupe?\"<\/summary><p>A loader fake whose response the test holds open: fire two requests, assert one load call, release, assert both callers got the same image. Wait by yielding, never by sleeping.<\/p><\/details><details><summary>\"How do you test cancellation?\"<\/summary><p>Two subscribers, cancel one, assert the load continues; cancel the second, assert the loader saw cancellation.<\/p><\/details><details><summary>\"How do you know it works in production?\"<\/summary><p>Signposts around load and decode, hit rates for both caches, MetricKit for hangs and memory-pressure exits, and the cache budget behind a remote flag.<\/p><\/details><details><summary>\"These are medical scans. What changes?\"<\/summary><p>Ask whether caching is allowed at all. Then no disk cache, or one with complete file protection and a Keychain-held key; purge memory on background; no third-party CDN caching.<\/p><\/details><details><summary>Follow-up chain: \"Cache hit rate dropped.\"<\/summary><ol start=\"1\"><li><em>\"Memory hit rate fell from 80% to 50% after a release. Why?\"<\/em> → Something changed the key: likely more distinct pixel sizes.<\/li><li><em>\"How do you confirm?\"<\/em> → Log the distinct sizes requested per URL in a debug build.<\/li><li><em>\"Fix?\"<\/em> → Round sizes to buckets before they reach the key.<\/li><\/ol><\/details><h3 id=\"scale-and-change\">Scale and change<\/h3><details><summary>\"Ten times denser grid.\"<\/summary><p>The memory budget is fixed by the device, so the hit rate falls. Smaller thumbnail buckets and fewer cached sizes per URL; decode one screen ahead, fetch bytes further.<\/p><\/details><details><summary>\"Add animated GIFs.\"<\/summary><p>A different decoder conformance that returns frames, and a view that plays them. Cost per GIF is frames × bitmap size, so cap frame count or decode on the fly.<\/p><\/details><details><summary>\"Add progressive JPEG.\"<\/summary><p>The loader streams bytes and the pipeline emits intermediate images, so the API returns a sequence rather than one image. That's an API change, which is why I'd leave it out unless asked.<\/p><\/details><details><summary>\"Millions of images on disk?\"<\/summary><p>Move the index to SQLite so eviction is a query rather than loading the whole index.<\/p><\/details><details><summary>Follow-up chain: \"Video thumbnails.\"<\/summary><ol start=\"1\"><li><em>\"Product wants video thumbnails in the same grid.\"<\/em> → A loader for video that extracts a frame with <code><span class=\"t-typ\">AVAssetImageGenerator<\/span><\/code>, behind the same protocol.<\/li><li><em>\"It's slow.\"<\/em> → Ask the server for a poster image instead; generating frames on device is the fallback.<\/li><li><em>\"Which is the right answer?\"<\/em> → The server poster: cheaper for every client, and the client code stays one more conformance.<\/li><\/ol><\/details><\/div><\/details><details class=\"reveal\"><summary>14 · Scorecard — mark yourself, 0 / 1 / 2<\/summary><div class=\"reveal-body\"><p>The public exercise this prompt comes from lists what the interviewer grades: clear communication, requirement clarification, practical trade-off analysis, honestly acknowledging what you don't know, and balancing engineering quality against timelines. Those are the first five rows; the rest are specific to this question.<\/p><div class=\"scroll\"><table><thead><tr><th><\/th><th>Did you…<\/th><th>0–2<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Narrate continuously, and listen when interrupted<\/td><td><\/td><\/tr><tr><td>2<\/td><td>Clarify before designing, and state your assumptions<\/td><td><\/td><\/tr><tr><td>3<\/td><td>Attach a rejected alternative and a switch condition to each choice<\/td><td><\/td><\/tr><tr><td>4<\/td><td>Say plainly where your knowledge ends<\/td><td><\/td><\/tr><tr><td>5<\/td><td>Name a smaller version that would be enough (<code><span class=\"t-typ\">AsyncImage<\/span><\/code>, <code><span class=\"t-typ\">NSCache<\/span><\/code>)<\/td><td><\/td><\/tr><tr><td>6<\/td><td>Say out of scope <strong>first<\/strong><\/td><td><\/td><\/tr><tr><td>7<\/td><td>Name the memory ↔ disk ↔ CPU ↔ bandwidth axis<\/td><td><\/td><\/tr><tr><td>8<\/td><td>Give the decoded-bitmap cost formula<\/td><td><\/td><\/tr><tr><td>9<\/td><td>Use two keys: URL for bytes, URL + size for images<\/td><td><\/td><\/tr><tr><td>10<\/td><td>Dedupe in-flight work, and handle cancellation with sharing<\/td><td><\/td><\/tr><tr><td>11<\/td><td>Keep decode off the main actor, explicitly<\/td><td><\/td><\/tr><tr><td>12<\/td><td>Say the idea, list the components, <em>then<\/em> sketch: three layers, about seven cards, one seam<\/td><td><\/td><\/tr><tr><td>13<\/td><td>Land the recap inside 60 seconds<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p>13+ is a pass in a real round.A zero is worth more than the total: it names the thing to read about before the next one.:::<\/p><details class=\"reveal\"><summary>15 · The 60-second recap<\/summary><div class=\"reveal-body\"><p>An image library is a set of caches trading memory, disk, CPU and bandwidth. A request carries a URL and the pixel size it will be shown at. An actor-owned pipeline checks a memory cache keyed by URL plus size, then joins any in-flight task for that key so nothing loads twice. On a miss, bytes come from a disk cache keyed by URL alone, or from the network. Decoding happens off the main actor and straight to display size, because a decoded bitmap costs width × height × 4 bytes whatever the file size. The memory cache is an LRU with a byte budget that empties on memory warnings; the disk cache holds encoded bytes with atomic writes and its own index, rather than trusting <code><span class=\"t-typ\">URLCache<\/span><\/code>, because offline display can't depend on the server's cache headers. Cell reuse is cancellation: a view cancels its subscription, shared work stops only when nobody is waiting, and a late result is dropped if the cell has moved on. Four types — loader, decoder, cache, pipeline — because each has its own reason to change, and everything crosses a protocol so the pipeline can be tested with doubles.<\/p><\/div><\/details><\/div><\/details>", "text": " a recurring senior mobile prompt in first hand interview reports. the public exercise interviewers draw their wording from is weeebox's image library brief, which also publishes the grading criteria used below. interviewer: \"we show a lot of images — feeds, avatars, a photo grid. i'd like you to design the image loading library we'd build for that. something in the spirit of kingfisher or nuke. where would you start?\" run it as a round, not as reading set a timer. stand up. sketch on paper or an ipad. talk the whole time — silence is the thing that fails these rounds. do not open a section until its slot is over. clock phase what you do 0:00–0:02 the prompt repeat it back in one sentence and say what you're going to do with the time 0:02–0:07 clarify ask; then open section 1 only after you've asked yours, and take its answers as the interviewer's 0:07–0:12 scope out of scope first, then 3–5 functional, then the non functional ones that matter 0:12–0:24 high level say the idea (1 min) · list the components (2) · sketch them (4) · explain each (4) · trace one request (1) 0:24–0:40 deep dives the interviewer picks; sections 9–11 are the three they pick from 0:40–0:45 follow ups and recap whatever they still probe, then the 60 second summary; the question bank afterwards what this question is really testing it looks like a question about caching. it isn't, quite. can you find the axis? every decision here trades memory ↔ disk ↔ cpu ↔ bandwidth . a candidate who names that axis in the first five minutes has already passed the framing part. do you know what a decoded image costs? width × height × 4 bytes, regardless of file size. everything about memory follows from that one fact, and it's the most common gap. can you design components with reasons? they will ask why these types and not fewer. this is where solid earns its keep — not as vocabulary, but as four or five sentences about what would change and what wouldn't. do you think about the same image twice? two cells, one url. dedupe of in flight work is the concurrency content of this question and the thing most answers miss. do you know when to stop? asyncimage and nscache are legitimate answers for a small app. saying so, with the condition attached, reads as senior. building a pipeline for a settings screen does not. traps: drifting into cdn and backend design; describing a cache with no eviction; forgetting cancellation entirely; naming kingfisher's features instead of designing; decoding on the main actor without noticing. ::: words used in this chapter plain definitions for the technical words this chapter uses. read once; come back when a word stops you. url — the web address of a picture. library — reusable code other parts of the app call; here, the code that loads every picture in the app. pixel — one coloured dot on the screen. a picture's size in pixels is how many dots wide and tall it is. decode — a picture arrives compressed (a jpeg or heic file); decoding unpacks it into pixels the screen can draw. unpacked, it's many times bigger: width × height × 4 bytes. memory vs disk — memory is the phone's fast, small working space, emptied when the app closes; disk is its slower, larger storage that survives. cache — a kept copy of something fetched before, so it's instant next time. eviction is throwing old entries out when it's full. cdn — a network of servers that keep copies of files close to users; this one can also resize a picture before sending it. main thread — the single lane that draws the screen. slow work there (like decoding) freezes scrolling, so it's done elsewhere. actor — a part that handles one request at a time, so two requests can never trample the same data. protocol — a written promise of what a part can do, without how. anything that keeps the promise can be plugged in. cancel — stopping work nobody needs any more, such as a download for a row that scrolled away. prefetch — fetching pictures just before they come into view, so they're already there. offline — no internet connection. ::: ::: 1 · the interviewer answers your clarifying questions ask yours first. these are the answers you'd get, and the assumptions the rest of this chapter runs on. \"is this a library for one app, or an sdk other teams adopt?\" → one app to start, but shaped so it could be extracted as a package later. \"where do images come from — network only?\" → network mostly, but also files on disk and a few bundled assets. the public version of this exercise wants all three. \"who consumes them? views only, or code too?\" → uiimageview and swiftui, and occasionally non ui code that wants the image to share or export. \"what's the heaviest screen?\" → a grid of thumbnails you can fling through, plus full screen detail views. \"can the server resize? is there a cdn with a width parameter?\" → yes, assume ?w= works and the cdn sends etag and cache control . \"do images need to show offline?\" → yes. anything the user has seen should still appear with no network. \"anything sensitive in these images?\" → not today. ask me again at the end. (they will.) \"what are we optimising — smoothness, data, battery?\" → scrolling must stay smooth on a three year old phone, and we've had memory pressure kills in the field. ::: ::: 2 · requirements and scope — what you should have said out of scope, stated first, before any design: animated gif/apng playback, video thumbnails, editing and filters beyond resize, placeholder and transition animations (the caller owns those), plug in loaders for arbitrary formats, and everything server side beyond \"there is a cdn with a width parameter\". progressive jpeg is a stretch goal if time allows. functional — five, no more 1. load an image by url from network, file or bundle, into a view or back to a caller. 2. downsample to the size it will actually be displayed at. 3. cache in memory and on disk; previously seen images appear offline. 4. cancel automatically when a view stops needing the image — cell reuse, disappearance. 5. prefetch ahead of the scroll position. non functional that matter here memory — decoded bitmaps are what gets the app killed. budget them explicitly. main thread time — no decode and no disk i/o on the main actor; the scroll holds its frame rate. bandwidth and battery — never fetch the same bytes twice; honour low data mode. correctness — a reused cell never shows another row's image. testability — every i/o boundary behind a protocol. then say the axis out loud: \"everything from here is memory against disk against cpu against bandwidth. i'll keep naming which one each choice spends.\" ::: ::: 3 · the idea, in 30 seconds — before you draw anything say the whole design in plain words first: \"a view asks for an image by url and by the size it will show it at. one coordinator checks a memory cache first; if the image is already being loaded for someone else, it waits for that load instead of starting another. otherwise it gets the bytes from a disk cache or the network, shrinks them to the display size off the main thread, and keeps the result in memory. it's a library, not an app, so three layers of its own: the api callers touch, the core that coordinates, and the i/o that does the work.\" then the axis, in one sentence: \"every choice here trades memory against disk against cpu against bandwidth.\" ::: ::: 4 · what we need — the components, before the sketch list them out loud, in the order you'll draw them. name each by what it does , not by its class name; the type name is a detail you mention while explaining it. component type name layer its one job 1 image view helpers setimage · lazyimage api the one line a screen calls to say \"show this picture here\". calls it off if the row scrolls away. 2 image pipeline imagepipeline core the dispatcher: is the picture ready, is someone already fetching it, or send someone. 3 memory cache imagememorycache core a small, fast shelf of ready to show pictures in the phone's memory. lives inside the dispatcher. 4 disk cache imagediskcache i/o a bigger, slower drawer of downloaded files on the phone, so seen pictures show offline. 5 data loader (protocol) dataloader i/o the job description \"get the file at this address\", written once for every source. 6 network and file loaders networkdataloader · filedataloader sources the two workers who do that job: one downloads from the internet, one reads from the phone. 7 image decoder imagedecoder i/o unpacks the downloaded file into a picture the screen can draw, at the size it's shown. and what's deliberately not on the list yet: prefetching, revalidation, low data mode, the disk index. \"i'll add those if we go there.\" ::: ::: 5 · the sketch mermaid flowchart tb subgraph a[\"api\"] call[\" 1 · image view helpers setimage · lazyimage \"] end subgraph c[\"core\"] pipe[\" 2 · image pipeline imagepipeline (actor) checks and fills card 3: memory cache \"] end subgraph io[\"i/o\"] disk[\" 4 · disk cache imagediskcache \"] loader[\" 5 · data loader «protocol» \"] dec[\" 7 · image decoder imagedecoder \"] end net[\" 6 · network loader networkdataloader \"] file[\" 6 · file loader filedataloader \"] call \"url + size → image\" pipe pipe \"1 · read · save bytes\" disk pipe \"2 · url → bytes\" loader pipe \"3 · bytes → image\" dec loader ~~~ net loader ~~~ file net . \"implements\" . loader file . \"implements\" . loader class call pres class pipe dom class disk,loader,dec data class net net class file data each card is what it does in bold, with the type name underneath. how to read the arrows. a solid arrow means asks : it points from the part that asks to the part that answers, which is also the direction of dependency. its label reads request → reply , so the data coming back travels the other way along the same arrow. the dashed arrow means implements . section 7 replays the same flow step by step. the numbers are the order on a memory miss: look on disk (and save there after a download), download, decode. drawing it on miro, step by step (about four minutes, talking the whole time): 1. three wide frames stacked top to bottom: api , core , i/o . label them first. 2. fill them in the order of your list, one card per component: blue for what callers touch, purple for the core, green for i/o, orange for the network. 3. write the memory cache inside the pipeline card (the pipeline owns it and checks it first), then number the pipeline's three arrows as you draw them, labelled request → reply . that numbering is the algorithm on a memory miss: bytes from disk if they're there, otherwise download them and save them to disk, then decode them into an image, which goes into the memory cache and back up to the view. 4. write «protocol» on the data loader card, put the two loaders under it, and draw a dashed \"implements\" arrow from each up to it. the pipeline depends on the protocol, and so do the loaders; the pipeline never points at a concrete loader. that's dependency inversion on the board. that's the one seam worth drawing: a new image source is a new card under it, never a change to the pipeline. \"the caches and the decoder are behind protocols too, for tests.\" seven cards, three frames, six arrows. methods stay off the board; they come up when the interviewer asks about a component, which is the next section. ::: ::: 6 · each component: its job, its interface, the choice inside it point at each card and cover three things: what it owns , its interface (what others can call), and the choice you made inside it . the under the hood notes are for learning; they're what lets you answer the follow up. first, the one value every component passes around: swift struct imagerequest: hashable, sendable { let url: url /// the size it will be shown at, in pixels; nil = full size let targetpixelsize: cgsize? /// visible rows high, prefetch low let priority: priority /// false for prefetch, so low data mode skips it let allowsconstrainednetwork: bool } 1 · image view helpers ( setimage , lazyimage ) in plain words: the single line a screen calls to say \"show the picture at this address, at this size, here\". if the row it was for scrolls away before the picture arrives, it calls the job off so no time is wasted. owns: the link between one view and its current request. interface: swift extension uiimageview { /// nil cancels and clears @mainactor func setimage(_ request: imagerequest?) } struct lazyimage: view { /// swiftui; reloads when request changes init(request: imagerequest) } the choice inside it: both are thin. setimage reads the memory cache straight away, so a cached image appears in the same frame with no flicker, and remembers its request so a reused row can cancel it. when a load finishes, it checks the result is for the row's current request before showing it. that check stops the classic wrong image in a reused row bug. under the hood. in plain words: calling off a job only leaves the worker a note saying \"stop\"; the worker may finish before reading it. so the screen also checks that the picture it receives is still the one it wants. the detail: cancelling in swift concurrency is cooperative : cancelling a task only sets a flag, and the work stops at its next check. so a result can still arrive after you cancelled, which is why the \"is this still my request?\" check is needed on top of cancelling. swiftui's .task(id:) gives you both for free: it cancels the old task and starts a new one whenever the id changes. 2 · image pipeline ( imagepipeline ) in plain words: the dispatcher every request goes through. it checks whether the picture is already on the ready shelf, whether someone is already fetching that same picture (then it simply waits for them), and otherwise sends someone to get it. owns: the coordination: which images are cached, which are loading, who is waiting for each. interface: swift protocol imagepipelinetype: sendable { func image(for request: imagerequest) async throws uiimage } protocol imageprefetchingtype: sendable { /// rows about to appear, low priority func prefetch(_ requests: [imagerequest]) /// rows the user flung past func cancelprefetch(_ requests: [imagerequest]) } the choices inside it: it's an actor that does bookkeeping only, never decoding, or every decode in the app would queue behind it. prefetching is a separate protocol , so a detail screen showing one image doesn't depend on it. the core call is async throws , so cancelling comes free with the calling task, and non ui code (share, export) and tests use the same path. under the hood. in plain words: an actor is like a desk clerk who serves one person at a time, so two people never scribble on the same form at once. but while the clerk is on hold on a phone call, the next person in line may step up, so the clerk writes \"already being handled\" on the board before picking up the phone. the detail: an actor is an object that runs one piece of its code at a time, so its data can't be changed by two threads at once. the catch is re entrancy : whenever the actor waits (an await ), other callers may run. so \"check the table, wait for a download, then write the table\" is not safe: two callers can both check before either writes. the fix, recording the running load before waiting, is deep dive 9. 3 · memory cache ( imagememorycache , inside the pipeline) in plain words: a small, fast shelf of pictures ready to show, kept in the phone's working memory. it has a fixed size; when it's full, the picture unused the longest is thrown out to make room. owns: decoded, ready to draw images. interface: swift protocol imagememorycachetype: sendable { /// fast, safe to call from the main thread func image(for key: imagekey) uiimage? /// cost = the image's bytes func store(_ image: uiimage, for key: imagekey) /// on memory warning func removeall() } the choice inside it: a least recently used cache with a byte budget , keyed by url plus pixel size . rejected: nscache , a fine answer for one image screen, but its eviction order is undocumented and you can't remove one url at every size. switch condition: one screen, no purging by url. under the hood. in plain words: a shelf with a fixed size: when it's full, the item nobody has touched for the longest goes first. the detail: lru (least recently used): when the cache is full, throw out what was used longest ago. it's built from a dictionary (find by key) plus a linked list ordered by use (find the oldest), so both are instant. the budget is in bytes , not item count, because one full screen image can cost as much as a hundred thumbnails. 4 · disk cache ( imagediskcache ) in plain words: a bigger but slower drawer on the phone's storage that keeps the downloaded files themselves. pictures you've seen before come from here instead of the internet, which is also how they still appear offline. owns: downloaded, still compressed bytes on disk. interface: swift protocol imagediskcachetype: sendable { func data(for url: url) async data? func store(_ data: data, for url: url) async /// evict oldest, off the launch path func trim(tobytes limit: int) async } the choice inside it: compressed bytes, keyed by url alone , in library/caches . rejected: urlcache , which obeys the server's cache headers, so max age=300 would mean \"offline after five minutes\". under the hood. in plain words: pictures are kept on the phone in their small, packed form and unpacked only when shown, like clothes kept vacuum packed in a drawer and shaken out when you wear them. the detail: compressed bytes (jpeg, heic) are 10–50 times smaller than the decoded image, and decoding is fast next to downloading, so disk stores bytes and memory stores images. files are named by a hash of the url (so any url makes a safe file name) and written atomically : to a temporary file, then renamed, so a crash never leaves half an image. 5 · data loader, the protocol ( dataloader ) in plain words: a job description: \"given an address, bring back the file\". it's written once, so anything that can do that job (the internet, the phone's own storage, a test) can be plugged in. owns: nothing. it's the promise every source makes. interface: swift protocol dataloader: sendable { func data(for url: url) async throws data } the choice inside it: it's the one protocol drawn on the board, because it's where the library grows. a new source (the photos library, test fixtures) is a new conformance, never a switch inside the pipeline. under the hood. in plain words: this card is dependency inversion . think of a dispatcher hiring delivery drivers. the dispatcher (the pipeline) writes one job description , \"given an address, bring back the file\", and hires only against that. the drivers (the network and file loaders) each promise to fit the description; that's the dashed arrow pointing up at it. the dispatcher never needs to know which driver turned up, so you can add a new driver (the photos library, a test driver with fake files) without changing the dispatcher at all. in one line: the dispatcher depends on a job description, not on any particular driver, and every driver depends on the same description. the detail: the pipeline (core) holds a dataloader , never a networkdataloader ; the concrete loaders are created once when the library is set up and handed in. the dependency arrows all point at the protocol, so the core never imports networking or file code, and a test can pass a loader whose response it controls. under the hood. in plain words: every worker hired for the same job must behave the same way (stop when told, never hand over half a file) or the people relying on them get surprises. the detail: a protocol's contract is more than its signature. every loader must also stop when cancelled , never return half the bytes , and be safe to call from several tasks at once . a loader that ignores cancellation still compiles, but breaks every caller that relies on it: that's the liskov substitution principle in practice. write the promises in the protocol's comment, and run the same tests against every loader. 6 · network and file loaders ( networkdataloader , filedataloader ) in plain words: the two workers who do that job: one downloads files from the internet, the other reads files already on the phone or packed inside the app. owns: one source each. interface: both conform to dataloader ; nothing else is public. they differ only in what they're built from: networkdataloader(session: urlsession) , filedataloader(filemanager: filemanager) . the choice inside it: the network loader asks the cdn for a resized image ( ?w= ), rounding the width up to a few buckets (160, 320, 640, 1280) so neighbouring sizes share one cached copy. under the hood. in plain words: a chain of nearby warehouses that keep copies of each picture and can cut it down to size before sending it, so the phone downloads less. the detail: a cdn is a network of servers that keep copies of files close to users. one that can resize on request means the phone downloads a 640 pixel image instead of a 4000 pixel original: less data, less memory, less decoding. rounding widths into buckets keeps the number of distinct copies small, so they're more likely to be cached. 7 · image decoder ( imagedecoder ) in plain words: a downloaded picture is a compressed file, like a zipped folder. the decoder unpacks it into the grid of coloured dots the screen draws, and shrinks it to the size it will be shown while doing so. owns: turning compressed bytes into a drawable image. interface: swift protocol imagedecodertype: sendable { func image(from data: data, maxpixelsize: cgfloat?) async throws uiimage } the choice inside it: decode directly at the display size with imageio, off the main thread, and decode immediately rather than at first draw. details in deep dive 10. under the hood. in plain words: a packed photo might be 2 mb, but unpacked into dots for the screen it's about 49 mb. shrinking it while unpacking means the big version never exists on the phone. the detail: a decoded image costs width × height × 4 bytes (one byte each for red, green, blue, transparency), whatever the file size. a 4032 × 3024 photo is a 2 mb jpeg but 49 mb decoded; at 300 × 300 pixels it's 0.36 mb. shrinking during decoding means the large version never exists in memory. why these seven, and not one imagemanager each changes for a different reason: the loader with the transport, the decoder with the format, the caches with the eviction policy, the pipeline with the coordination rules. one imagemanager would be touched by all of them. \"i split where the reasons to change differ, not per noun.\" ::: ::: 7 · one request through the sketch trace one request across the cards, the case where two rows want the same avatar at once: mermaid sequencediagram participant a as row a participant b as row b participant p as image pipeline participant m as memory cache participant d as disk cache participant l as data loader participant x as image decoder a p: image(for: url, 160 px) p m: image(for: key) m p: nil note over p: no load running, so start one and record it b p: image(for: url, 160 px) note over p: same key already loading, so wait on it p d: data(for: url) d p: nil p l: data(for: url) l p: bytes p d: store(bytes) p x: image(from: bytes, 160) x p: image p m: store(image) p a: image p b: same image note over a,b: both rows show it in words: one download and one decode serve both rows. solid arrows are requests, each a method from the interfaces in section 6; dashed arrows are the replies, the data flowing back: bytes up from disk or network, an image up from the decoder, and finally the image to both rows. ::: ::: 8 · the server contract and the two keys the server contract. nothing of our own: get https://img.example.com/{id}?w={pixels} , returning etag and cache control headers. the client rounds width up into buckets so neighbouring sizes share a cdn entry and a disk entry. the two keys, the detail most answers miss. swift /// memory cache + running loads struct imagekey: hashable { let url: url; let pixelsize: cgsize? } // the disk cache and the loaders", "outline": [{"a": "run-it-as-a-round-not-as-reading", "t": "Run it as a round, not as reading"}, {"a": "what-this-question-is-really-testing", "t": "What this question is really testing"}]}, {"slug": "infinite-photo-feed", "title": "02 · Infinite photo feed", "summary": "\"We have a feed of photos that scrolls forever. Design the client.\"", "minutes": "50", "sources": [{"ref": "", "label": "weeeBox · Mobile system design, the Twitter feed walkthrough (cursor pagination, local storage, real-time options)", "url": "https://github.com/weeeBox/mobile-system-design"}, {"ref": "", "label": "System Design Handbook · iOS system design interview", "url": "https://www.systemdesignhandbook.com/guides/ios-system-design-interview/"}, {"ref": "WWDC21", "label": "Make blazing fast lists and collection views", "url": "https://developer.apple.com/videos/play/wwdc2021/10252/"}, {"ref": "WWDC19", "label": "Advances in UI data sources", "url": "https://developer.apple.com/videos/play/wwdc2019/220/"}, {"ref": "WWDC23", "label": "Discover Observation in SwiftUI", "url": "https://developer.apple.com/videos/play/wwdc2023/10149/"}, {"ref": "", "label": "Apple · UICollectionViewDataSourcePrefetching", "url": "https://developer.apple.com/documentation/uikit/uicollectionviewdatasourceprefetching"}, {"ref": "", "label": "Apple · NSDiffableDataSourceSnapshot.reconfigureItems(_:)", "url": "https://developer.apple.com/documentation/uikit/nsdiffabledatasourcesnapshot/reconfigureitems(_:)"}, {"ref": "", "label": "Apple · onScrollTargetVisibilityChange(idType:threshold:_:)", "url": "https://developer.apple.com/documentation/swiftui/view/onscrolltargetvisibilitychange(idtype:threshold:_:)"}, {"ref": "", "label": "Apple · allowsConstrainedNetworkAccess", "url": "https://developer.apple.com/documentation/foundation/urlsessionconfiguration/allowsconstrainednetworkaccess"}], "html": "<p><em>An image-heavy feed is one of the recurring senior mobile prompts in the first-hand reports collected for this programme. The public corpus interviewers draw on uses a Twitter-style feed as its main worked example, and the pagination advice below matches it: cursors, not offsets.<\/em><\/p><blockquote class=\"aside plain\"><p><strong>Interviewer:<\/strong> \"We have a feed of photos — think Instagram's home feed. It scrolls forever. Design the client for me.\"<\/p><\/blockquote><h2 id=\"run-it-as-a-round-not-as-reading\">Run it as a round, not as reading<\/h2><p>Set a timer. Stand up. Sketch. Talk the whole time. <strong>Do not open a section until its slot is over.<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Clock<\/th><th>Phase<\/th><th>What you do<\/th><\/tr><\/thead><tbody><tr><td>0:00–0:02<\/td><td>The prompt<\/td><td>Repeat it back in one sentence and say how you'll use the time<\/td><\/tr><tr><td>0:02–0:07<\/td><td>Clarify<\/td><td>Ask yours; then open section 1 and take its answers as the interviewer's<\/td><\/tr><tr><td>0:07–0:12<\/td><td>Scope<\/td><td>Out of scope first, then 3–5 functional, then the non-functional ones that matter<\/td><\/tr><tr><td>0:12–0:24<\/td><td>High level<\/td><td>Say the idea (1 min) · list the components (2) · sketch them (4) · explain each (4) · trace one request (1)<\/td><\/tr><tr><td>0:24–0:40<\/td><td>Deep dives<\/td><td>The interviewer picks; sections 9–11 are the three they pick from<\/td><\/tr><tr><td>0:40–0:45<\/td><td>Follow-ups and recap<\/td><td>Whatever they still probe, then the 60-second summary; the question bank afterwards<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"what-this-question-is-really-testing\">What this question is really testing<\/h2><p>It looks like a question about lists. It is a question about <strong>three clocks running at once<\/strong>: the frame clock (16 ms, or 8 ms on a 120 Hz screen), the network clock (hundreds of milliseconds per page) and the user's thumb, which is faster than both.<\/p><ul><li><strong>Do you pick cursor pagination, and can you say why?<\/strong> Offsets break the moment someone posts while you scroll. This is the single most-checked line in the answer.<\/li><li><strong>Do you know the cell's height before the image arrives?<\/strong> Layout jumps are the visible bug in most feeds, and the fix is in the API, not in the view.<\/li><li><strong>Can you keep \"load the next page\" from firing five times?<\/strong> That's the concurrency content: a guard that is atomic on the main actor, and a refresh that doesn't race with a page load.<\/li><li><strong>Do you treat the image work as solved?<\/strong> You built it in question 1. Say \"the image pipeline from before\" and spend the time on the feed.<\/li><li><strong>Do you keep it client-side?<\/strong> Ranking, fan-out and timelines are the server's job. Name them as out of scope in the first minute.<\/li><\/ul><p><strong>Traps:<\/strong> offset pagination; inserting new posts at the top while the user is reading; holding <code><span class=\"t-typ\">UIImage<\/span><\/code>s in the model; a like button that flickers back when the feed refreshes; designing the ranking algorithm.<\/p><details class=\"reveal\"><summary>Words used in this chapter<\/summary><div class=\"reveal-body\"><p>Plain definitions for the technical words this chapter uses. Read once; come back when a word stops you.<\/p><ul><li><strong>App, server, API<\/strong> — the <em>app<\/em> runs on the phone; the <em>server<\/em> is the company's computer that stores every post; the <em>API<\/em> is the agreed set of requests the app may send it (like the forms a counter clerk accepts).<\/li><li><strong>Endpoint<\/strong> — one specific request the API accepts, such as \"give me the next posts\".<\/li><li><strong>Feed, page<\/strong> — the <em>feed<\/em> is the endless list of posts; it arrives in <em>pages<\/em> of about 20 at a time, so the app never downloads everything at once.<\/li><li><strong>Cursor<\/strong> — a bookmark the server hands back with each page, meaning \"you stopped here\". The app sends it back to get the page after it.<\/li><li><strong>Layer<\/strong> — a group of parts with the same kind of job. Here: <em>presentation<\/em> (what you see), <em>domain<\/em> (the plain description of the data and what may be asked for), <em>data<\/em> (where the data actually comes from).<\/li><li><strong>View model<\/strong> — the part that holds a screen's current state and decisions, separate from the drawing of it.<\/li><li><strong>Model<\/strong> — a plain description of one thing (a post), with no behaviour. The <em>domain model<\/em> is the app's own version.<\/li><li><strong>DTO and mapping<\/strong> — a <em>DTO<\/em> is a copy of the server's format, field for field; <em>mapping<\/em> translates it into the app's domain model, like converting a form from another office into your own.<\/li><li><strong>Protocol<\/strong> — a written promise of what a part can do, without how. Any part that keeps the promise can stand in, including a fake one in a test.<\/li><li><strong>Repository<\/strong> — t
