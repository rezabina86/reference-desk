ibly outlive the customer, because the customer is the only route to it. when you can state a reason like that in one sentence, unowned is right. when your sentence contains \"shouldn't\" or \"in practice\", use weak . there is also unowned(unsafe) , which removes the check as well. it's the equivalent of objective c's assign — a raw pointer with no safety net at all, reading freed memory rather than trapping. it exists for interop and hot paths; if you're reaching for it to silence a crash, you've found a lifetime bug, not a performance problem. in the library. an unowned reference is a note in your own pocket saying \"book 412, i'm certain it's still on the shelf.\" nobody updates it. if you're right, it's the cheapest thing possible. if you're wrong, you walk to shelf 412 and the building stops you at the door — better than handing you whatever is now in that slot. which one, and when the question to ask is never \"which is safer?\" it's can this reference outlive what it points at? situation use why you own it — it should live as long as you do strong the default, and correct far more often than people assume a back pointer to something that owns you, with equal or longer life unowned provably can't outlive it; no optional, no side table a back pointer whose lifetime is independent of yours weak it can vanish, and you need to survive that a delegate weak the delegate almost always owns you; classic cycle otherwise a reference held across an await , a network call, or any callback weak the thing can die while you're suspended; see chapter 6 interop, or a measured hot path where you can prove the lifetime unowned(unsafe) no check at all — you are the check a useful second question when you're stuck: if this object died right now, is my code still meaningful? if yes, weak — write the nil path. if the answer is \"that can't happen and the code would be nonsense\", unowned is the honest spelling, and the crash is the enforcement of what you just said. the thing people get wrong weak is not the safe default, and treating it that way causes its own class of bugs. a weak reference tells the reader this can disappear at any moment and i'm fine with that . when it isn't true — when the object really should have been kept alive, and something else was supposed to be holding it — the symptom isn't a crash. it's a screen that silently stops updating, a callback that never fires, a save that never happens, because by the time the work finished, self was nil and the closure returned early. nothing is logged. nothing is reported. that is far harder to find than a leak. decide ownership first. reach for weak when the answer to \"who owns this?\" is genuinely \"somebody else\", not as a way of avoiding the question. under the hood. the three counts exist to make the middle of an object's death safe. when the strong count reaches zero the object is deinited and its weak references start reading nil , but the storage can't be freed while unowned references still exist — those have to find something valid to trap on. the unowned count keeps the allocation alive past deinit ; the weak count keeps the side table alive past the allocation. deiniting , deinited , freed , dead : four states between \"last owner let go\" and \"the space is reusable\", and all of them are there so weak can be nil and unowned can trap instead of both reading rubbish. ", "outline": [{"a": "strong", "t": "Strong"}, {"a": "weak", "t": "Weak"}, {"a": "unowned", "t": "Unowned"}, {"a": "which-one-and-when", "t": "Which one, and when"}, {"a": "the-thing-people-get-wrong", "t": "The thing people get wrong"}]}, {"slug": "retain-cycles", "title": "Retain cycles", "summary": "The five shapes a cycle actually takes in an iOS app, how to spot each, and why \"make it a tree\" beats sprinkling weak.", "minutes": "8", "sources": [{"ref": "", "label": "Apple · Automatic Reference Counting (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/"}, {"ref": "WWDC21", "label": "ARC in Swift: Basics and beyond", "url": "https://developer.apple.com/videos/play/wwdc2021/10216/"}, {"ref": "WWDC24", "label": "Analyze heap memory", "url": "https://developer.apple.com/videos/play/wwdc2024/10173/"}], "html": "<p>A <strong>retain cycle<\/strong> is a loop of strong references. Every object in the loop is kept alive by another object in the loop, so no count in it ever reaches zero, and nothing outside can reach any of them. It is the one failure ARC cannot fix for you, and in practice it arrives in about five recognisable shapes.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>Two books, each holding the other's only loan card. Neither tally reaches zero, so neither is ever pulped, and no reader can find either of them. The shelf space is gone for the lifetime of the building.<\/p><\/blockquote><h2 id=\"shape-1-two-objects-that-own-each-other\">Shape 1 — two objects that own each other<\/h2><p>The textbook one from chapter 3: <code><span class=\"t-typ\">Parent<\/span><\/code> holds <code><span class=\"t-typ\">Child<\/span><\/code> strongly, <code><span class=\"t-typ\">Child<\/span><\/code> holds <code><span class=\"t-typ\">Parent<\/span><\/code> strongly. Usually it enters a codebase as \"the child needs to call back up\".<\/p><p>The fix is to decide which direction is ownership. Almost always the parent owns the child, and the back-pointer becomes <code><span class=\"t-kw\">weak<\/span><\/code> — or <code><span class=\"t-kw\">unowned<\/span><\/code> if the child genuinely cannot outlive the parent.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Parent<\/span> { <span class=\"t-kw\">var<\/span> child: <span class=\"t-typ\">Child<\/span>? }\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Child<\/span>  { <span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">var<\/span> parent: <span class=\"t-typ\">Parent<\/span>? }<\/code><\/pre><\/div><h2 id=\"shape-2-the-delegate\">Shape 2 — the delegate<\/h2><p>The same thing wearing a suit. A view controller creates a loader and makes itself the loader's delegate; the loader holds the delegate strongly; neither is ever released.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">ImageLoader<\/span> {\n    <span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">var<\/span> delegate: <span class=\"t-typ\">ImageLoaderDelegate<\/span>?     <span class=\"t-com\">// the fix, and the convention<\/span>\n}<\/code><\/pre><\/div><p>This is why \"delegates are weak\" is a rule of thumb in Cocoa. Two riders worth knowing: the protocol must be class-bound (<code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImageLoaderDelegate<\/span>: <span class=\"t-typ\">AnyObject<\/span><\/code>) for <code><span class=\"t-kw\">weak<\/span><\/code> to be allowed at all, and the rule is not universal — a delegate that isn't the owner, like a data source living in a separate object graph, may legitimately be strong. Convention over reasoning is how the \"safe\" version of this becomes the silent-failure version from chapter 4.<\/p><h2 id=\"shape-3-a-closure-stored-on-the-object-it-captures\">Shape 3 — a closure stored on the object it captures<\/h2><p>The most common cycle in modern Swift by a distance, because closures are objects too. A closure stored in a property is on the heap and holds strong references to everything it captured — including <code><span class=\"t-kw\">self<\/span><\/code>, if <code><span class=\"t-kw\">self<\/span><\/code> is mentioned.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">SearchBox<\/span> {\n    <span class=\"t-kw\">var<\/span> onChange: ((<span class=\"t-typ\">String<\/span>) -&gt; <span class=\"t-typ\">Void<\/span>)?\n\n    <span class=\"t-kw\">func<\/span> configure() {\n        onChange = { text <span class=\"t-kw\">in<\/span>\n            <span class=\"t-kw\">self<\/span>.results = <span class=\"t-kw\">self<\/span>.filter(text)     <span class=\"t-com\">// self retained by the closure,<\/span>\n        }                                        <span class=\"t-com\">// closure retained by self<\/span>\n    }\n}<\/code><\/pre><\/div><p>The loop is <code><span class=\"t-kw\">self<\/span> → onChange → <span class=\"t-kw\">self<\/span><\/code>. Swift makes you write <code><span class=\"t-kw\">self<\/span>.<\/code> explicitly inside escaping closures precisely so this is visible at the call site — that requirement is a warning sign, not a syntax tax. Chapter 6 is the whole mechanism and the capture-list fix.<\/p><h2 id=\"shape-4-the-timer-the-observer-the-subscription\">Shape 4 — the timer, the observer, the subscription<\/h2><p>Anything long-lived that you hand a block to, and that holds the block until you tell it to stop.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code>timer = <span class=\"t-typ\">Timer<\/span>.scheduledTimer(withTimeInterval: <span class=\"t-num\">1<\/span>, repeats: <span class=\"t-kw\">true<\/span>) { _ <span class=\"t-kw\">in<\/span>\n    <span class=\"t-kw\">self<\/span>.tick()                                  <span class=\"t-com\">// the run loop holds the timer,<\/span>\n}                                                <span class=\"t-com\">// the timer holds this block,<\/span>\n                                                 <span class=\"t-com\">// the block holds self<\/span><\/code><\/pre><\/div><p>Notice the loop doesn't run through your own properties this time: <code><span class=\"t-kw\">self<\/span> → timer → block → <span class=\"t-kw\">self<\/span><\/code>, with the run loop keeping the timer alive independently. A repeating <code><span class=\"t-typ\">Timer<\/span><\/code> retains its target or block until it is invalidated, so the object never dies, so nothing ever calls <code>invalidate()<\/code>. The same shape appears with <code><span class=\"t-typ\">NotificationCenter<\/span><\/code>'s block-based observer, with a Combine <code><span class=\"t-typ\">AnyCancellable<\/span><\/code> stored on the object whose <code>sink<\/code> mentions <code><span class=\"t-kw\">self<\/span><\/code>, and with any <code>addObserver<\/code> that returns a token you're supposed to hold.<\/p><p>Two fixes, and you often want both: capture <code><span class=\"t-kw\">self<\/span><\/code> weakly in the block, and give the object an explicit teardown point that invalidates or cancels. Relying on <code><span class=\"t-kw\">deinit<\/span><\/code> to do the cancelling can't work when the cycle is what's preventing <code><span class=\"t-kw\">deinit<\/span><\/code>.<\/p><h2 id=\"shape-5-the-cache-the-registry-the-singleton\">Shape 5 — the cache, the registry, the singleton<\/h2><p>Not a cycle at all, and it deserves to be in this list because it produces the identical symptom: a screen that never goes away.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-typ\">ScreenRegistry<\/span>.shared.register(<span class=\"t-kw\">self<\/span>)     <span class=\"t-com\">// nothing ever unregisters<\/span><\/code><\/pre><\/div><p>A global dictionary, an array of \"recent\" view models, a coordinator that appends every child and never removes one. Reference counting is working perfectly; something really is still holding the object. WWDC24 calls this <strong>abandoned memory<\/strong> and separates it from leaked memory for exactly this reason: a leak is unreachable, this is reachable and simply unwanted.<\/p><p>The fix is never <code><span class=\"t-kw\">weak<\/span><\/code> sprinkled on a property. It's an eviction policy: a bound, an unregister call, <code><span class=\"t-typ\">NSCache<\/span><\/code>, or a lifetime tied to something that actually ends.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>Shape 5 is the shelf of books that are all correctly catalogued and were last opened in 2019. Nothing is broken. The building is still full.<\/p><\/blockquote><h2 id=\"how-you-actually-find-one\">How you actually find one<\/h2><p>In order of how often it works:<\/p><p><strong>Print in <code><span class=\"t-kw\">deinit<\/span><\/code>, close the screen, watch for nothing.<\/strong> Crude and unreasonably effective. If it doesn't print, something is holding it.<\/p><p><strong>Xcode's Memory Graph Debugger.<\/strong> Run, reach the suspect state, dismiss the screen, press the memory-graph button, and search for the type. If an instance is still there, the graph shows you every strong reference pointing at it — including <code>closure context<\/code> nodes, which is how a shape-3 cycle names itself. Purple badges mark what Xcode believes is leaked.<\/p><p><strong>Instruments, when it's not one object but a pattern.<\/strong> Chapter 9.<\/p><p>The question to ask the graph is not \"is it leaked\" but <strong>\"who is still pointing at this, and should they be?\"<\/strong> Half the time the answer is shape 5 and there's no cycle to break at all.<\/p><h2 id=\"the-better-fix-change-the-shape\">The better fix: change the shape<\/h2><p><code><span class=\"t-kw\">weak<\/span><\/code> and <code><span class=\"t-kw\">unowned<\/span><\/code> break cycles. They don't prevent them, and a graph held together by a dozen weak back-pointers is hard to reason about — every one is a place where the object may have vanished and the code silently does nothing.<\/p><p>WWDC21's advice is worth taking literally: prefer transforming cyclic class relationships into <strong>tree<\/strong> structures. One direction owns, the other direction is either absent or a non-owning callback. Two specific moves do most of the work:<\/p><p><strong>Pass it in instead of storing it.<\/strong> If the child needs the parent only while a method runs, take it as a parameter. A parameter creates no cycle because it doesn't outlive the call.<\/p><p><strong>Send values, not references.<\/strong> Replace \"child holds a pointer back to the parent so it can tell it things\" with \"child hands out a value and the parent decides what to do\" — a closure that captures the <em>store<\/em> rather than the view controller, or an <code><span class=\"t-typ\">AsyncStream<\/span><\/code> the parent reads. The pointer that closed the loop stops existing.<\/p><p>And the structural version of the same advice: <strong>a struct cannot be in a retain cycle<\/strong>, because nothing points at it. Chapter 7 is what that does and doesn't buy you.<\/p>", "text": "a retain cycle is a loop of strong references. every object in the loop is kept alive by another object in the loop, so no count in it ever reaches zero, and nothing outside can reach any of them. it is the one failure arc cannot fix for you, and in practice it arrives in about five recognisable shapes. in the library. two books, each holding the other's only loan card. neither tally reaches zero, so neither is ever pulped, and no reader can find either of them. the shelf space is gone for the lifetime of the building. shape 1 — two objects that own each other the textbook one from chapter 3: parent holds child strongly, child holds parent strongly. usually it enters a codebase as \"the child needs to call back up\". the fix is to decide which direction is ownership. almost always the parent owns the child, and the back pointer becomes weak — or unowned if the child genuinely cannot outlive the parent. swift final class parent { var child: child? } final class child { weak var parent: parent? } shape 2 — the delegate the same thing wearing a suit. a view controller creates a loader and makes itself the loader's delegate; the loader holds the delegate strongly; neither is ever released. swift final class imageloader { weak var delegate: imageloaderdelegate? // the fix, and the convention } this is why \"delegates are weak\" is a rule of thumb in cocoa. two riders worth knowing: the protocol must be class bound ( protocol imageloaderdelegate: anyobject ) for weak to be allowed at all, and the rule is not universal — a delegate that isn't the owner, like a data source living in a separate object graph, may legitimately be strong. convention over reasoning is how the \"safe\" version of this becomes the silent failure version from chapter 4. shape 3 — a closure stored on the object it captures the most common cycle in modern swift by a distance, because closures are objects too. a closure stored in a property is on the heap and holds strong references to everything it captured — including self , if self is mentioned. swift final class searchbox { var onchange: ((string) void)? func configure() { onchange = { text in self.results = self.filter(text) // self retained by the closure, } // closure retained by self } } the loop is self → onchange → self . swift makes you write self. explicitly inside escaping closures precisely so this is visible at the call site — that requirement is a warning sign, not a syntax tax. chapter 6 is the whole mechanism and the capture list fix. shape 4 — the timer, the observer, the subscription anything long lived that you hand a block to, and that holds the block until you tell it to stop. swift timer = timer.scheduledtimer(withtimeinterval: 1, repeats: true) { _ in self.tick() // the run loop holds the timer, } // the timer holds this block, // the block holds self notice the loop doesn't run through your own properties this time: self → timer → block → self , with the run loop keeping the timer alive independently. a repeating timer retains its target or block until it is invalidated, so the object never dies, so nothing ever calls invalidate() . the same shape appears with notificationcenter 's block based observer, with a combine anycancellable stored on the object whose sink mentions self , and with any addobserver that returns a token you're supposed to hold. two fixes, and you often want both: capture self weakly in the block, and give the object an explicit teardown point that invalidates or cancels. relying on deinit to do the cancelling can't work when the cycle is what's preventing deinit . shape 5 — the cache, the registry, the singleton not a cycle at all, and it deserves to be in this list because it produces the identical symptom: a screen that never goes away. swift screenregistry.shared.register(self) // nothing ever unregisters a global dictionary, an array of \"recent\" view models, a coordinator that appends every child and never removes one. reference counting is working perfectly; something really is still holding the object. wwdc24 calls this abandoned memory and separates it from leaked memory for exactly this reason: a leak is unreachable, this is reachable and simply unwanted. the fix is never weak sprinkled on a property. it's an eviction policy: a bound, an unregister call, nscache , or a lifetime tied to something that actually ends. in the library. shape 5 is the shelf of books that are all correctly catalogued and were last opened in 2019. nothing is broken. the building is still full. how you actually find one in order of how often it works: print in deinit , close the screen, watch for nothing. crude and unreasonably effective. if it doesn't print, something is holding it. xcode's memory graph debugger. run, reach the suspect state, dismiss the screen, press the memory graph button, and search for the type. if an instance is still there, the graph shows you every strong reference pointing at it — including closure context nodes, which is how a shape 3 cycle names itself. purple badges mark what xcode believes is leaked. instruments, when it's not one object but a pattern. chapter 9. the question to ask the graph is not \"is it leaked\" but \"who is still pointing at this, and should they be?\" half the time the answer is shape 5 and there's no cycle to break at all. the better fix: change the shape weak and unowned break cycles. they don't prevent them, and a graph held together by a dozen weak back pointers is hard to reason about — every one is a place where the object may have vanished and the code silently does nothing. wwdc21's advice is worth taking literally: prefer transforming cyclic class relationships into tree structures. one direction owns, the other direction is either absent or a non owning callback. two specific moves do most of the work: pass it in instead of storing it. if the child needs the parent only while a method runs, take it as a parameter. a parameter creates no cycle because it doesn't outlive the call. send values, not references. replace \"child holds a pointer back to the parent so it can tell it things\" with \"child hands out a value and the parent decides what to do\" — a closure that captures the store rather than the view controller, or an asyncstream the parent reads. the pointer that closed the loop stops existing. and the structural version of the same advice: a struct cannot be in a retain cycle , because nothing points at it. chapter 7 is what that does and doesn't buy you. ", "outline": [{"a": "shape-1-two-objects-that-own-each-other", "t": "Shape 1 — two objects that own each other"}, {"a": "shape-2-the-delegate", "t": "Shape 2 — the delegate"}, {"a": "shape-3-a-closure-stored-on-the-object-it-captures", "t": "Shape 3 — a closure stored on the object it captures"}, {"a": "shape-4-the-timer-the-observer-the-subscription", "t": "Shape 4 — the timer, the observer, the subscription"}, {"a": "shape-5-the-cache-the-registry-the-singleton", "t": "Shape 5 — the cache, the registry, the singleton"}, {"a": "how-you-actually-find-one", "t": "How you actually find one"}, {"a": "the-better-fix-change-the-shape", "t": "The better fix: change the shape"}]}, {"slug": "closures-and-capture-lists", "title": "Closures and capture lists", "summary": "Why a closure is an object, what a capture list actually captures, and when [weak self] is wrong.", "minutes": "8", "sources": [{"ref": "", "label": "Apple · Closures (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/closures/"}, {"ref": "", "label": "Apple · Automatic Reference Counting (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/"}, {"ref": "SE-0345", "label": "if let shorthand for shadowing an existing optional variable", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0345-if-let-shorthand.md"}], "html": "<p>Chapter 5 listed the closure cycle as the most common one in modern Swift. This chapter is why it happens, which is a matter of what a closure <em>is<\/em>.<\/p><h2 id=\"a-closure-is-an-object\">A closure is an object<\/h2><p>A closure is code plus the things it needs to run that code — the values it captured from where it was written. Those values have to live somewhere for as long as the closure might be called, so a closure that outlives its creating scope is a heap allocation: a <strong>context<\/strong> object holding the captures, reference counted exactly like a class instance.<\/p><p>Which means every capture is a strong reference, held by an object that you are probably storing somewhere.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Screen<\/span> {\n    <span class=\"t-kw\">var<\/span> onTap: (() -&gt; <span class=\"t-typ\">Void<\/span>)?\n\n    <span class=\"t-kw\">func<\/span> setUp() {\n        onTap = { <span class=\"t-kw\">self<\/span>.reload() }      <span class=\"t-com\">// context retains self; self retains context<\/span>\n    }\n}<\/code><\/pre><\/div><p>That's the cycle, and it's structural rather than accidental. Nothing about the code is careless; two entirely normal decisions — store a callback, mention <code><span class=\"t-kw\">self<\/span><\/code> inside it — happen to form a loop.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>A closure is a note pinned to a book: <em>\"when this is returned, do the following — and the following mentions book 412.\"<\/em> The note counts as a reader of 412. Pin the note inside 412 itself and you have a book whose own note keeps it borrowed forever.<\/p><\/blockquote><h2 id=\"escaping-is-the-whole-distinction\">Escaping is the whole distinction<\/h2><p>A <strong>non-escaping<\/strong> closure is guaranteed not to outlive the call it was passed to. <code>map<\/code>, <code>filter<\/code>, <code>sorted<\/code>, most callbacks that run before the function returns. It can live on the stack, it doesn't need to retain its captures in the same way, and <strong>it cannot create a cycle<\/strong> — it's gone before anything could observe one.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">let<\/span> names = users.map { $<span class=\"t-num\">0<\/span>.name }          <span class=\"t-com\">// no self., no cycle, nothing to think about<\/span><\/code><\/pre><\/div><p>An <strong><code><span class=\"t-atr\">@escaping<\/span><\/code><\/strong> closure may be stored and called later: completion handlers, <code><span class=\"t-typ\">Task<\/span><\/code> bodies, subscriptions, anything handed to a timer. It has to keep its captures alive, and Swift makes you write <code><span class=\"t-kw\">self<\/span>.<\/code> explicitly inside it. That requirement is the language pointing at the exact thing this chapter is about — if you're typing <code><span class=\"t-kw\">self<\/span>.<\/code> inside a closure, you're creating a strong reference to <code><span class=\"t-kw\">self<\/span><\/code> that will live as long as the closure does.<\/p><p>The first question, then, is never \"should I use <code><span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span><\/code>?\" It's <strong>does this closure escape, and who stores it?<\/strong><\/p><h2 id=\"what-a-capture-list-actually-does\">What a capture list actually does<\/h2><p>A capture list is the <code>[ ... ]<\/code> before the parameters. It captures the listed values <strong>at the moment the closure is created<\/strong>, rather than referring to the variable afterwards.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">var<\/span> count = <span class=\"t-num\">0<\/span>\n<span class=\"t-kw\">let<\/span> printLater = { print(count) }          <span class=\"t-com\">// refers to the variable<\/span>\n<span class=\"t-kw\">let<\/span> printNow   = { [count] <span class=\"t-kw\">in<\/span> print(count) }  <span class=\"t-com\">// captured the value 0, right now<\/span>\n\ncount = <span class=\"t-num\">42<\/span>\nprintLater()   <span class=\"t-com\">// 42<\/span>\nprintNow()     <span class=\"t-com\">// 0<\/span><\/code><\/pre><\/div><p>Two separate mechanisms, and people usually meet only the memory half. Without a capture list a mutable local variable is captured <strong>by reference<\/strong> — it's promoted to a heap box that both the closure and the enclosing scope share, which is also the reason <code><span class=\"t-atr\">@Sendable<\/span><\/code> closures refuse mutable captures (that's the concurrency topic's ground). With a capture list you get a copy, made once, at closure creation.<\/p><p>For references, the list is also where you choose the strength: <code>[<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>]<\/code>, <code>[<span class=\"t-kw\">unowned<\/span> <span class=\"t-kw\">self<\/span>]<\/code>, <code>[<span class=\"t-kw\">weak<\/span> delegate, <span class=\"t-kw\">unowned<\/span> store]<\/code>.<\/p><h2 id=\"the-weak-self-dance-and-why-it-has-three-forms\">The weak-self dance, and why it has three forms<\/h2><div class=\"scroll\"><pre data-lang=\"swift\"><code>loader.load { [<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>] result <span class=\"t-kw\">in<\/span>\n    <span class=\"t-kw\">guard<\/span> <span class=\"t-kw\">let<\/span> <span class=\"t-kw\">self<\/span> <span class=\"t-kw\">else<\/span> { <span class=\"t-kw\">return<\/span> }        <span class=\"t-com\">// SE-0345 shorthand, Swift 5.7+<\/span>\n    <span class=\"t-kw\">self<\/span>.apply(result)\n}<\/code><\/pre><\/div><p><code>[<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>]<\/code> makes <code><span class=\"t-kw\">self<\/span><\/code> an optional that reads <code><span class=\"t-kw\">nil<\/span><\/code> once the object is gone. The <code><span class=\"t-kw\">guard<\/span><\/code> turns it back into a strong reference for the duration of this call, which is what you want: it means <code><span class=\"t-kw\">self<\/span><\/code> can't die half way through the body.<\/p><p>There are three shapes, and they say different things.<\/p><p><strong><code><span class=\"t-kw\">guard<\/span> <span class=\"t-kw\">let<\/span> <span class=\"t-kw\">self<\/span> <span class=\"t-kw\">else<\/span> { <span class=\"t-kw\">return<\/span> }<\/code><\/strong> — the object may be gone, and if it is, doing nothing is correct. Fine for \"update the UI with this result\".<\/p><p><strong><code><span class=\"t-kw\">self<\/span>?.method()<\/code> with no guard<\/strong> — same, but each mention is a separate weak read, so <code><span class=\"t-kw\">self<\/span><\/code> may exist on line one and be <code><span class=\"t-kw\">nil<\/span><\/code> on line three. Acceptable for a single call; a trap in a multi-step body.<\/p><p><strong>No capture list at all<\/strong> — the closure keeps the object alive on purpose. This is right more often than the internet suggests. A network request whose completion writes to a database <em>should<\/em> keep the writer alive until it finishes; making that <code><span class=\"t-kw\">weak<\/span><\/code> turns a rare race into a silently dropped save.<\/p><p>That's the judgement to make, and it's the same one as chapter 4: if the object dying mid-flight would make the work meaningless, use <code><span class=\"t-kw\">weak<\/span><\/code> and return early. If the work must finish regardless, hold it strongly and make sure the closure doesn't get stored on the object itself.<\/p><p><code>[<span class=\"t-kw\">unowned<\/span> <span class=\"t-kw\">self<\/span>]<\/code> in an escaping closure deserves suspicion. It says <em>this closure can never outlive self<\/em>, which for anything asynchronous means you are promising that a network response cannot arrive after the screen is dismissed. That promise is usually false, and the payoff for being right is one optional unwrap.<\/p><h2 id=\"tasks-capture-too\">Tasks capture too<\/h2><p><code><span class=\"t-typ\">Task<\/span> { }<\/code> takes a closure, so everything above applies — with one extra wrinkle worth saying out loud.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Screen<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> task: <span class=\"t-typ\">Task<\/span>&lt;<span class=\"t-typ\">Void<\/span>, <span class=\"t-typ\">Never<\/span>&gt;?\n\n    <span class=\"t-kw\">func<\/span> start() {\n        task = <span class=\"t-typ\">Task<\/span> {                       <span class=\"t-com\">// this closure captures self strongly<\/span>\n            <span class=\"t-kw\">let<\/span> items = <span class=\"t-kw\">await<\/span> load()\n            <span class=\"t-kw\">self<\/span>.show(items)\n        }\n    }\n    <span class=\"t-kw\">deinit<\/span> { task?.cancel() }\n}<\/code><\/pre><\/div><p>A running task holds its closure, and therefore its captures, until it completes or is cancelled. So a <code><span class=\"t-typ\">Task<\/span><\/code> that mentions <code><span class=\"t-kw\">self<\/span><\/code> keeps <code><span class=\"t-kw\">self<\/span><\/code> alive for the duration of the work — which is often exactly what you want, and is not a leak: it ends.<\/p><p>It becomes a leak when you also store the task on <code><span class=\"t-kw\">self<\/span><\/code>, as above, because now <code><span class=\"t-kw\">self<\/span> → task → closure → <span class=\"t-kw\">self<\/span><\/code> is a cycle for as long as the task runs. Two rules keep it honest: store the handle only if you intend to cancel it, and cancel from a real teardown point (<code>onDisappear<\/code>, a <code>stop()<\/code> method) rather than from <code><span class=\"t-kw\">deinit<\/span><\/code>, which the cycle is preventing from ever running.<\/p><p>An infinite task — <code><span class=\"t-kw\">for<\/span> <span class=\"t-kw\">await<\/span> event <span class=\"t-kw\">in<\/span> stream { … }<\/code> — never completes on its own, so \"it ends\" stops being true and the capture becomes permanent. Those need <code>[<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>]<\/code> and a cancel, or the whole thing needs to be owned by something with a shorter life.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>A running task is a reader who has taken the book home. Nothing is wrong: they'll bring it back. It only becomes a problem when the book is what's holding their address, and the trip has no end date.<\/p><\/blockquote><h2 id=\"the-short-version\">The short version<\/h2><p>Ask the questions in this order, and most of the difficulty disappears:<\/p><ol start=\"1\"><li><strong>Does this closure escape?<\/strong> No — stop, there is nothing to do.<\/li><li><strong>Who stores it?<\/strong> If the thing storing it is the thing it captures, that's a cycle; break it in the capture list or move the storage.<\/li><li><strong>If the captured object died mid-flight, should the work still finish?<\/strong> Yes — capture strongly. No — <code>[<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>]<\/code> with a <code><span class=\"t-kw\">guard<\/span><\/code>.<\/li><li><strong>Can I state a reason the closure cannot outlive the object?<\/strong> Only then is <code><span class=\"t-kw\">unowned<\/span><\/code> the honest spelling.<\/li><\/ol>", "text": "chapter 5 listed the closure cycle as the most common one in modern swift. this chapter is why it happens, which is a matter of what a closure is . a closure is an object a closure is code plus the things it needs to run that code — the values it captured from where it was written. those values have to live somewhere for as long as the closure might be called, so a closure that outlives its creating scope is a heap allocation: a context object holding the captures, reference counted exactly like a class instance. which means every capture is a strong reference, held by an object that you are probably storing somewhere. swift final class screen { var ontap: (() void)? func setup() { ontap = { self.reload() } // context retains self; self retains context } } that's the cycle, and it's structural rather than accidental. nothing about the code is careless; two entirely normal decisions — store a callback, mention self inside it — happen to form a loop. in the library. a closure is a note pinned to a book: \"when this is returned, do the following — and the following mentions book 412.\" the note counts as a reader of 412. pin the note inside 412 itself and you have a book whose own note keeps it borrowed forever. escaping is the whole distinction a non escaping closure is guaranteed not to outlive the call it was passed to. map , filter , sorted , most callbacks that run before the function returns. it can live on the stack, it doesn't need to retain its captures in the same way, and it cannot create a cycle — it's gone before anything could observe one. swift let names = users.map { $0.name } // no self., no cycle, nothing to think about an @escaping closure may be stored and called later: completion handlers, task bodies, subscriptions, anything handed to a timer. it has to keep its captures alive, and swift makes you write self. explicitly inside it. that requirement is the language pointing at the exact thing this chapter is about — if you're typing self. inside a closure, you're creating a strong reference to self that will live as long as the closure does. the first question, then, is never \"should i use weak self ?\" it's does this closure escape, and who stores it? what a capture list actually does a capture list is the [ ... ] before the parameters. it captures the listed values at the moment the closure is created , rather than referring to the variable afterwards. swift var count = 0 let printlater = { print(count) } // refers to the variable let printnow = { [count] in print(count) } // captured the value 0, right now count = 42 printlater() // 42 printnow() // 0 two separate mechanisms, and people usually meet only the memory half. without a capture list a mutable local variable is captured by reference — it's promoted to a heap box that both the closure and the enclosing scope share, which is also the reason @sendable closures refuse mutable captures (that's the concurrency topic's ground). with a capture list you get a copy, made once, at closure creation. for references, the list is also where you choose the strength: [weak self] , [unowned self] , [weak delegate, unowned store] . the weak self dance, and why it has three forms swift loader.load { [weak self] result in guard let self else { return } // se 0345 shorthand, swift 5.7+ self.apply(result) } [weak self] makes self an optional that reads nil once the object is gone. the guard turns it back into a strong reference for the duration of this call, which is what you want: it means self can't die half way through the body. there are three shapes, and they say different things. guard let self else { return } — the object may be gone, and if it is, doing nothing is correct. fine for \"update the ui with this result\". self?.method() with no guard — same, but each mention is a separate weak read, so self may exist on line one and be nil on line three. acceptable for a single call; a trap in a multi step body. no capture list at all — the closure keeps the object alive on purpose. this is right more often than the internet suggests. a network request whose completion writes to a database should keep the writer alive until it finishes; making that weak turns a rare race into a silently dropped save. that's the judgement to make, and it's the same one as chapter 4: if the object dying mid flight would make the work meaningless, use weak and return early. if the work must finish regardless, hold it strongly and make sure the closure doesn't get stored on the object itself. [unowned self] in an escaping closure deserves suspicion. it says this closure can never outlive self , which for anything asynchronous means you are promising that a network response cannot arrive after the screen is dismissed. that promise is usually false, and the payoff for being right is one optional unwrap. tasks capture too task { } takes a closure, so everything above applies — with one extra wrinkle worth saying out loud. swift final class screen { private var task: task<void, never ? func start() { task = task { // this closure captures self strongly let items = await load() self.show(items) } } deinit { task?.cancel() } } a running task holds its closure, and therefore its captures, until it completes or is cancelled. so a task that mentions self keeps self alive for the duration of the work — which is often exactly what you want, and is not a leak: it ends. it becomes a leak when you also store the task on self , as above, because now self → task → closure → self is a cycle for as long as the task runs. two rules keep it honest: store the handle only if you intend to cancel it, and cancel from a real teardown point ( ondisappear , a stop() method) rather than from deinit , which the cycle is preventing from ever running. an infinite task — for await event in stream { … } — never completes on its own, so \"it ends\" stops being true and the capture becomes permanent. those need [weak self] and a cancel, or the whole thing needs to be owned by something with a shorter life. in the library. a running task is a reader who has taken the book home. nothing is wrong: they'll bring it back. it only becomes a problem when the book is what's holding their address, and the trip has no end date. the short version ask the questions in this order, and most of the difficulty disappears: 1. does this closure escape? no — stop, there is nothing to do. 2. who stores it? if the thing storing it is the thing it captures, that's a cycle; break it in the capture list or move the storage. 3. if the captured object died mid flight, should the work still finish? yes — capture strongly. no — [weak self] with a guard . 4. can i state a reason the closure cannot outlive the object? only then is unowned the honest spelling. ", "outline": [{"a": "a-closure-is-an-object", "t": "A closure is an object"}, {"a": "escaping-is-the-whole-distinction", "t": "Escaping is the whole distinction"}, {"a": "what-a-capture-list-actually-does", "t": "What a capture list actually does"}, {"a": "the-weak-self-dance-and-why-it-has-three-forms", "t": "The weak-self dance, and why it has three forms"}, {"a": "tasks-capture-too", "t": "Tasks capture too"}, {"a": "the-short-version", "t": "The short version"}]}, {"slug": "value-types-and-cow", "title": "Value types and copy-on-write", "summary": "Why a struct sidesteps the whole problem, the trap of a struct holding a class, and how Array avoids copying everything.", "minutes": "8", "sources": [{"ref": "", "label": "Swift · isKnownUniquelyReferenced (stdlib source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/core/ManagedBuffer.swift"}, {"ref": "WWDC21", "label": "ARC in Swift: Basics and beyond", "url": "https://developer.apple.com/videos/play/wwdc2021/10216/"}, {"ref": "", "label": "Apple · Structures and Classes (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/classesandstructures/"}], "html": "<p>Everything so far has been about reference types, because they're the only things that need managing. This chapter is the other half of the advice WWDC21 gives after all its ARC material: prefer value types to avoid the dangers of unintended sharing.<\/p><h2 id=\"why-a-struct-has-no-memory-question\">Why a struct has no memory question<\/h2><p>Assigning a struct copies it. Two variables, two independent values, no sharing.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">Point<\/span> { <span class=\"t-kw\">var<\/span> x: <span class=\"t-typ\">Double<\/span>; <span class=\"t-kw\">var<\/span> y: <span class=\"t-typ\">Double<\/span> }\n\n<span class=\"t-kw\">var<\/span> a = <span class=\"t-typ\">Point<\/span>(x: <span class=\"t-num\">0<\/span>, y: <span class=\"t-num\">0<\/span>)\n<span class=\"t-kw\">var<\/span> b = a          <span class=\"t-com\">// a copy — a genuinely separate value<\/span>\nb.x = <span class=\"t-num\">10<\/span>           <span class=\"t-com\">// a.x is still 0<\/span><\/code><\/pre><\/div><p>Because nothing points at it, a struct cannot be in a retain cycle, cannot be shared across threads by accident, and doesn't need a count. Its lifetime is its owner's: a local struct dies when the function returns, and one stored in a class dies with the class. There is no decision to make, and no <code><span class=\"t-kw\">deinit<\/span><\/code> to reason about — value types don't have one.<\/p><p>This is why a codebase built mostly from values simply has fewer memory bugs. Not because anybody was careful: because most of the questions never come up.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>A value type is a photocopy you take away with you. Nothing is shared, nobody has to be told when you're done, and there's no tally slip — when you throw your copy away, that's the end of it.<\/p><\/blockquote><h2 id=\"the-trap-a-struct-that-holds-a-class\">The trap: a struct that holds a class<\/h2><p>A struct is only a value in the sense that <em>its own storage<\/em> is copied. Copying it copies whatever is inside it — and if one of its properties is a class reference, the copy is of the reference, not of the object.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Buffer<\/span> { <span class=\"t-kw\">var<\/span> bytes: [<span class=\"t-typ\">UInt8<\/span>] = [] }\n\n<span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">Document<\/span> {\n    <span class=\"t-kw\">var<\/span> title: <span class=\"t-typ\">String<\/span>       <span class=\"t-com\">// genuinely copied<\/span>\n    <span class=\"t-kw\">var<\/span> buffer: <span class=\"t-typ\">Buffer<\/span>      <span class=\"t-com\">// the reference is copied; both share one Buffer<\/span>\n}\n\n<span class=\"t-kw\">var<\/span> one = <span class=\"t-typ\">Document<\/span>(title: <span class=\"t-str\">&quot;A&quot;<\/span>, buffer: <span class=\"t-typ\">Buffer<\/span>())\n<span class=\"t-kw\">var<\/span> two = one\ntwo.buffer.bytes = [<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]\n<span class=\"t-com\">// one.buffer.bytes is now [1, 2, 3] as well<\/span><\/code><\/pre><\/div><p><code>two<\/code> looks like an independent value and half of it is. This is the most common \"but I used a struct\" surprise, and the reason <code><span class=\"t-typ\">Sendable<\/span><\/code> checking for structs looks at every stored property rather than stopping at the keyword <code><span class=\"t-kw\">struct<\/span><\/code>. A struct is <code><span class=\"t-typ\">Sendable<\/span><\/code> only if everything inside it is, and the <code><span class=\"t-typ\">Buffer<\/span><\/code> above is precisely what stops it.<\/p><p>Two ways out. Make the inner type a value type as well, which is usually the right answer. Or keep the class deliberately — and then either make it immutable, or implement copy-on-write so that the sharing is invisible. Which is what the standard library does.<\/p><h2 id=\"how-array-can-afford-to-be-a-value-type\">How Array can afford to be a value type<\/h2><p><code><span class=\"t-typ\">Array<\/span><\/code>, <code><span class=\"t-typ\">String<\/span><\/code>, <code><span class=\"t-typ\">Dictionary<\/span><\/code> and <code><span class=\"t-typ\">Set<\/span><\/code> all behave like values, yet copying one doesn't copy its contents:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">let<\/span> million = <span class=\"t-typ\">Array<\/span>(<span class=\"t-num\">0<\/span>..&lt;1_000_000)\n<span class=\"t-kw\">let<\/span> alsoMillion = million       <span class=\"t-com\">// no million-element copy happens here<\/span><\/code><\/pre><\/div><p>Both now refer to one buffer. The copy is deferred until somebody writes, and only then, and only if the buffer is shared. That is <strong>copy-on-write<\/strong>, and it is implemented in ordinary Swift on top of exactly the reference counting from chapter 3.<\/p><p>The mechanism is one question: <em>am I the only owner of this buffer?<\/em> The standard library asks it with <code>isKnownUniquelyReferenced(_:)<\/code>, which returns true when the object's strong count is one.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">Bytes<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> storage: <span class=\"t-typ\">Buffer<\/span>      <span class=\"t-com\">// a class, holding the actual memory<\/span>\n\n    <span class=\"t-kw\">mutating<\/span> <span class=\"t-kw\">func<\/span> append(_ byte: <span class=\"t-typ\">UInt8<\/span>) {\n        <span class=\"t-kw\">if<\/span> !isKnownUniquelyReferenced(&amp;storage) {\n            storage = storage.copy()     <span class=\"t-com\">// somebody else is looking — copy first<\/span>\n        }\n        storage.bytes.append(byte)       <span class=\"t-com\">// now it&#x27;s ours alone; mutate in place<\/span>\n    }\n}<\/code><\/pre><\/div><p>Read that with chapter 3's counting in mind and the whole design falls out. Copying the struct retains the buffer, so the count goes to two; the next mutation sees a count above one and forks. If the other copy has since gone away, the count is back to one and the mutation is in place, for free. Value semantics at the surface, one allocation underneath, and the reference count is the entire coordination mechanism.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The library doesn't photocopy a 400-page report for every reader — everyone shares the one copy while they're only <em>reading<\/em>. The moment somebody wants to write in the margins, the desk checks whether anyone else has it out. If yes, they get a photocopy to scribble on. If not, they scribble on the original.<\/p><\/blockquote><h2 id=\"two-things-to-know-before-you-implement-it\">Two things to know before you implement it<\/h2><p><strong>The <code>&amp;&amp;<\/code> ordering gotcha<\/strong>, straight from the standard library's own documentation. In a debug build, an instance on the left of a <code>&amp;&amp;<\/code> may still be referenced while the right-hand side is evaluated, inflating the count — so this version copies on <em>every<\/em> call:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-com\">// copies too frequently<\/span>\n<span class=\"t-kw\">if<\/span> storage.shouldCopy || !isKnownUniquelyReferenced(&amp;storage) { … }<\/code><\/pre><\/div><p>Put the uniqueness check first, or compute the other condition into a local first. A performance bug that only exists in debug builds is a memorable one to have been bitten by.<\/p><p><strong>It checks strong references only.<\/strong> Weak and unowned references to the buffer don't make it non-unique, and passing a weak reference always returns <code><span class=\"t-kw\">false<\/span><\/code>. And uniqueness is meaningless without synchronisation: if two threads can reach the same struct, the check can say \"unique\" while another thread is mid-copy. The documentation's wording is that you must only call it from mutating methods with appropriate thread synchronisation — which for a value type usually means the value isn't shared across threads in the first place, and if it is, you have a data race, not a CoW problem.<\/p><h2 id=\"when-to-reach-for-this\">When to reach for this<\/h2><p>Almost never directly. Use <code><span class=\"t-typ\">Array<\/span><\/code> and <code><span class=\"t-typ\">Dictionary<\/span><\/code>, which do it for you.<\/p><p>The cases where you write it yourself are specific: a value type wrapping a large buffer that gets copied often and mutated rarely (image data, a big matrix, a parsed document), or a value type wrapping something expensive to duplicate, like a <code><span class=\"t-typ\">CGContext<\/span><\/code> or a database handle. Outside those, a struct holding value properties is simpler and faster, because there's no allocation to share in the first place.<\/p><p>The reverse also matters: <strong>not everything should be a struct.<\/strong> A type with genuine identity — a network session, a cache, a coordinator, anything where \"the same one\" means something — is a class, and making it a struct produces its own confusing bugs. The question is identity, not performance. When two instances with identical contents should be interchangeable, that's a value. When they shouldn't, that's an object.<\/p><h2 id=\"where-this-leaves-the-topic\">Where this leaves the topic<\/h2><p>Values sidestep ownership; references need it decided. Most application code can be mostly values with a thin layer of long-lived objects — the caches, the coordinators, the sessions — and that thin layer is where all the material from chapters 4 to 6 applies.<\/p><p>Next: what happens to any of this when more than one thread is involved. The short version is that the counting is safe and the object isn't, and the difference is where several genuinely nasty crashes live.<\/p>", "text": "everything so far has been about reference types, because they're the only things that need managing. this chapter is the other half of the advice wwdc21 gives after all its arc material: prefer value types to avoid the dangers of unintended sharing. why a struct has no memory question assigning a struct copies it. two variables, two independent values, no sharing. swift struct point { var x: double; var y: double } var a = point(x: 0, y: 0) var b = a // a copy — a genuinely separate value b.x = 10 // a.x is still 0 because nothing points at it, a struct cannot be in a retain cycle, cannot be shared across threads by accident, and doesn't need a count. its lifetime is its owner's: a local struct dies when the function returns, and one stored in a class dies with the class. there is no decision to make, and no deinit to reason about — value types don't have one. this is why a codebase built mostly from values simply has fewer memory bugs. not because anybody was careful: because most of the questions never come up. in the library. a value type is a photocopy you take away with you. nothing is shared, nobody has to be told when you're done, and there's no tally slip — when you throw your copy away, that's the end of it. the trap: a struct that holds a class a struct is only a value in the sense that its own storage is copied. copying it copies whatever is inside it — and if one of its properties is a class reference, the copy is of the reference, not of the object. swift final class buffer { var bytes: [uint8] = ; the next mutation sees a count above one and forks. if the other copy has since gone away, the count is back to one and the mutation is in place, for free. value semantics at the surface, one allocation underneath, and the reference count is the entire coordination mechanism. in the library. the library doesn't photocopy a 400 page report for every reader — everyone shares the one copy while they're only reading . the moment somebody wants to write in the margins, the desk checks whether anyone else has it out. if yes, they get a photocopy to scribble on. if not, they scribble on the original. two things to know before you implement it the && ordering gotcha , straight from the standard library's own documentation. in a debug build, an instance on the left of a && may still be referenced while the right hand side is evaluated, inflating the count — so this version copies on every call: swift // copies too frequently if storage.shouldcopy !isknownuniquelyreferenced(&storage) { … } put the uniqueness check first, or compute the other condition into a local first. a performance bug that only exists in debug builds is a memorable one to have been bitten by. it checks strong references only. weak and unowned references to the buffer don't make it non unique, and passing a weak reference always returns false . and uniqueness is meaningless without synchronisation: if two threads can reach the same struct, the check can say \"unique\" while another thread is mid copy. the documentation's wording is that you must only call it from mutating methods with appropriate thread synchronisation — which for a value type usually means the value isn't shared across threads in the first place, and if it is, you have a data race, not a cow problem. when to reach for this almost never directly. use array and dictionary , which do it for you. the cases where you write it yourself are specific: a value type wrapping a large buffer that gets copied often and mutated rarely (image data, a big matrix, a parsed document), or a value type wrapping something expensive to duplicate, like a cgcontext or a database handle. outside those, a struct holding value properties is simpler and faster, because there's no allocation to share in the first place. the reverse also matters: not everything should be a struct. a type with genuine identity — a network session, a cache, a coordinator, anything where \"the same one\" means something — is a class, and making it a struct produces its own confusing bugs. the question is identity, not performance. when two instances with identical contents should be interchangeable, that's a value. when they shouldn't, that's an object. where this leaves the topic values sidestep ownership; references need it decided. most application code can be mostly values with a thin layer of long lived objects — the caches, the coordinators, the sessions — and that thin layer is where all the material from chapters 4 to 6 applies. next: what happens to any of this when more than one thread is involved. the short version is that the counting is safe and the object isn't, and the difference is where several genuinely nasty crashes live. ", "outline": [{"a": "why-a-struct-has-no-memory-question", "t": "Why a struct has no memory question"}, {"a": "the-trap-a-struct-that-holds-a-class", "t": "The trap: a struct that holds a class"}, {"a": "how-array-can-afford-to-be-a-value-type", "t": "How Array can afford to be a value type"}, {"a": "two-things-to-know-before-you-implement-it", "t": "Two things to know before you implement it"}, {"a": "when-to-reach-for-this", "t": "When to reach for this"}, {"a": "where-this-leaves-the-topic", "t": "Where this leaves the topic"}]}, {"slug": "arc-under-concurrency", "title": "ARC under concurrency", "summary": "Why the count is thread-safe and the object isn't, what a task keeps alive, and which thread runs deinit.", "minutes": "8", "sources": [{"ref": "", "label": "Swift · RefCount.h (runtime source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/SwiftShims/swift/shims/RefCount.h"}, {"ref": "SE-0371", "label": "Isolated synchronous deinit", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0371-isolated-synchronous-deinit.md"}, {"ref": "SE-0302", "label": "Sendable and @Sendable closures", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0302-concurrent-value-and-concurrent-closures.md"}], "html": "<p>This chapter is the seam between this topic and the concurrency one. It answers a question people often assume away in both directions: <em>if two threads share an object, does ARC protect me?<\/em><\/p><p>Partly. It protects the count. It does not protect the object.<\/p><h2 id=\"the-count-is-atomic-the-contents-are-not\">The count is atomic; the contents are not<\/h2><p>The reference count lives in an <code>atomic<\/code> word in the object's header. Two threads retaining and releasing the same object at the same instant cannot corrupt it, cannot lose an increment, and cannot cause a premature free. That is a property of the runtime's data layout, not of your code, and it holds whatever you do.<\/p><p>What it buys you is exactly one guarantee: <strong>while you hold a strong reference, the object will not be destroyed underneath you.<\/strong> That's real, and it's why passing an object between threads never produces the chapter 1 use-after-free on its own.<\/p><p>What it does not touch is the object's <em>state<\/em>. Two threads calling <code>account.balance += <span class=\"t-num\">100<\/span><\/code> race on <code>balance<\/code> just as hard as they ever did. ARC keeps the book on the shelf; it says nothing about two people writing on page 40 at once.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The tally slip is written in a special pen that two hands can't smudge — the count is always exactly right. The pages are ordinary paper.<\/p><\/blockquote><p>This is the whole reason <code><span class=\"t-typ\">Sendable<\/span><\/code> exists as a separate idea from reference counting, and why a <code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span><\/code> with only <code><span class=\"t-kw\">let<\/span><\/code> properties can be <code><span class=\"t-typ\">Sendable<\/span><\/code> while the same class with one <code><span class=\"t-kw\">var<\/span><\/code> cannot. Counting safety is free and automatic; state safety is the thing you have to design.<\/p><h2 id=\"atomic-isn-t-free\">Atomic isn't free<\/h2><p>Each retain and release is an atomic read-modify-write on a word that other cores may be touching. In a loop over a large collection of class instances, or a chain of <code><span class=\"t-kw\">weak<\/span><\/code> reads (chapter 4), that traffic is measurable — it's cache-line contention, not just instruction count.<\/p><p>Two things follow, in this order of importance.<\/p><p><strong>Don't optimise it by reflex.<\/strong> The compiler removes most redundant pairs, and the remainder is usually dwarfed by whatever the code is actually doing. Chasing retain traffic without a profile is the classic wasted afternoon.<\/p><p><strong>When it does show up, it shows up as a shape.<\/strong> Time Profiler attributing real time to <code>swift_retain<\/code> / <code>swift_release<\/code>, typically from a tight loop over reference types. The fix is structural — values instead of references in the hot path, or hoisting a weak read out of a loop — not micro-tweaks.<\/p><h2 id=\"what-a-task-keeps-alive\">What a task keeps alive<\/h2><p>A <code><span class=\"t-typ\">Task<\/span><\/code> holds its closure until it finishes, and the closure holds its captures (chapter 6). So the rule is short: <strong>anything a running task mentions stays alive until that task ends.<\/strong><\/p><p>That is usually correct and often the point. An upload that must complete should keep its uploader alive. The cases to watch are the ones where \"until it ends\" isn't a bound:<\/p><ul><li>a task looping over an <code><span class=\"t-typ\">AsyncStream<\/span><\/code> that never terminates<\/li><li>a task stored on the object it captures — the cycle from chapter 6<\/li><li>a detached task that outlives the screen that started it, still holding a view model<\/li><\/ul><p>Structured concurrency helps by construction: <code><span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span><\/code> and task groups end before their scope does, so their captures can't outlive it. Unstructured <code><span class=\"t-typ\">Task<\/span> { }<\/code> is the one you have to reason about, and cancellation is how you bound it. Cancelling doesn't kill anything on its own — the task still has to notice and return — but returning is what releases the captures.<\/p><h2 id=\"actors-hold-references-like-anything-else\">Actors hold references like anything else<\/h2><p>An actor is a class, so it is reference counted, and everything it stores it stores strongly. A cache actor holding view models keeps them alive; a task stored in an actor's dictionary keeps its closure alive. Isolation says who may <em>touch<\/em> state; it says nothing about how long that state lives.<\/p><p>The cycle shapes from chapter 5 all still apply inside actors, with one twist: you can't break one from outside, because you can't reach in without <code><span class=\"t-kw\">await<\/span><\/code>. That makes \"the actor holds everything for ever\" a common shape — an in-flight-task registry that never removes finished entries is a cache with no eviction (shape 5), wearing a concurrency hat.<\/p><h2 id=\"which-thread-runs-deinit\">Which thread runs deinit<\/h2><p>Whichever thread released last. That may be a background thread, the main thread, or a cooperative-pool thread running some unrelated task — the object has no say in it, and neither do you.<\/p><p>This produces a specific, nasty crash class: a <code><span class=\"t-kw\">deinit<\/span><\/code> that touches UIKit, or a <code><span class=\"t-atr\">@MainActor<\/span><\/code>-isolated property, from whatever thread happened to drop the last reference. It fires rarely, in release builds, on other people's devices.<\/p><p>Swift's answer is <code>isolated <span class=\"t-kw\">deinit<\/span><\/code>, implemented in Swift 6.2:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Screen<\/span> {\n    <span class=\"t-kw\">let<\/span> view: <span class=\"t-typ\">UIView<\/span>\n    isolated <span class=\"t-kw\">deinit<\/span> {\n        view.removeFromSuperview()   <span class=\"t-com\">// guaranteed to run on the main actor<\/span>\n    }\n}<\/code><\/pre><\/div><p>Without it, a <code><span class=\"t-kw\">deinit<\/span><\/code> on an actor or a global-actor-isolated class cannot touch the isolated state at all — the restriction SE-0327 imposed, which is why so much code grew an explicit <code>close()<\/code> or <code>invalidate()<\/code> method instead. Both patterns are still reasonable; the explicit teardown has the advantage that it runs at a point you chose rather than at an arbitrary release.<\/p><p>Worth noticing what an isolated <code><span class=\"t-kw\">deinit<\/span><\/code> costs: if the last release happens off the main actor, the destruction has to hop, so the object's death is now asynchronous with respect to whoever released it. Determinism in <em>order<\/em> is preserved; determinism in <em>timing<\/em> is not.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>The state machine in <code><span class=\"t-typ\">RefCount<\/span>.h<\/code> is what makes the concurrent case safe at all. Between \"strong count hit zero\" and \"the memory is gone\" there are four states, and a <code><span class=\"t-kw\">weak<\/span><\/code> read arriving from another thread during any of them has a defined answer — <code><span class=\"t-kw\">nil<\/span><\/code> — rather than a race against the deallocation. That's why <code><span class=\"t-kw\">weak<\/span><\/code> reads are a runtime call and not a pointer dereference, and it's why they cost what they cost.<\/p><\/blockquote><h2 id=\"the-two-sentences-to-have-ready\">The two sentences to have ready<\/h2><p><strong>ARC is thread-safe; your object is not.<\/strong> The count is atomic, so an object won't be freed while you hold a reference. Nothing about that serialises access to its properties — that's what actors, locks and <code><span class=\"t-typ\">Sendable<\/span><\/code> are for.<\/p><p><strong>Reference counting decides lifetime; isolation decides access.<\/strong> They are orthogonal, they are enforced in different places — one at runtime, one at compile time — and most confusion here comes from expecting either to do the other's job.<\/p>", "text": "this chapter is the seam between this topic and the concurrency one. it answers a question people often assume away in both directions: if two threads share an object, does arc protect me? partly. it protects the count. it does not protect the object. the count is atomic; the contents are not the reference count lives in an atomic word in the object's header. two threads retaining and releasing the same object at the same instant cannot corrupt it, cannot lose an increment, and cannot cause a premature free. that is a property of the runtime's data layout, not of your code, and it holds whatever you do. what it buys you is exactly one guarantee: while you hold a strong reference, the object will not be destroyed underneath you. that's real, and it's why passing an object between threads never produces the chapter 1 use after free on its own. what it does not touch is the object's state . two threads calling account.balance += 100 race on balance just as hard as they ever did. arc keeps the book on the shelf; it says nothing about two people writing on page 40 ptures can't outlive it. unstructured task { } is the one you have to reason about, and cancellation is how you bound it. cancelling doesn't kill anything on its own — the task still has to notice and return — but returning is what releases the captures. actors hold references like anything else an actor is a class, so it is reference counted, and everything it stores it stores strongly. a cache actor holding view models keeps them alive; a task stored in an actor's dictionary keeps its closure alive. isolation says who may touch state; it says nothing about how long that state lives. the cycle shapes from chapter 5 all still apply inside actors, with one twist: you can't break one from outside, because you can't reach in without await . that makes \"the actor holds everything for ever\" a common shape — an in flight task registry that never removes finished entries is a cache with no eviction (shape 5), wearing a concurrency hat. which thread runs deinit whichever thread released last. that may be a background thread, the main thread, or a cooperative pool thread running some unrelated task — the object has no say in it, and neither do you. this produces a specific, nasty crash class: a deinit that touches uikit, or a @mainactor isolated property, from whatever thread happened to drop the last reference. it fires rarely, in release builds, on other people's devices. swift's answer is isolated deinit , implemented in swift 6.2: swift @mainactor final class screen { let view: uiview isolated deinit { view.removefromsuperview() // guaranteed to run on the main actor } } without it, a deinit on an actor or a global actor isolated class cannot touch the isolated state at all — the restriction se 0327 imposed, which is why so much code grew an explicit close() or invalidate() method instead. both patterns are still reasonable; the explicit teardown has the advantage that it runs at a point you chose rather than at an arbitrary release. worth noticing what an isolated deinit costs: if the last release happens off the main actor, the destruction has to hop, so the object's death is now asynchronous with respect to whoever released it. determinism in order is preserved; determinism in timing is not. under the hood. the state machine in refcount.h is what makes the concurrent case safe at all. between \"strong count hit zero\" and \"the memory is gone\" there are four states, and a weak read arriving from another thread during any of them has a defined answer — nil — rather than a race against the deallocation. that's why weak reads are a runtime call and not a pointer dereference, and it's why they cost what they cost. the two sentences to have ready arc is thread safe; your object is not. the count is atomic, so an object won't be freed while you hold a reference. nothing about that serialises access to its properties — that's what actors, locks and sendable are for. reference counting decides lifetime; isolation decides access. they are orthogonal, they are enforced in different places — one at runtime, one at compile time — and most confusion here comes from expecting either to do the other's job. ", "outline": [{"a": "the-count-is-atomic-the-contents-are-not", "t": "The count is atomic; the contents are not"}, {"a": "atomic-isn-t-free", "t": "Atomic isn't free"}, {"a": "what-a-task-keeps-alive", "t": "What a task keeps alive"}, {"a": "actors-hold-references-like-anything-else", "t": "Actors hold references like anything else"}, {"a": "which-thread-runs-deinit", "t": "Which thread runs deinit"}, {"a": "the-two-sentences-to-have-ready", "t": "The two sentences to have ready"}]}, {"slug": "finding-memory-problems", "title": "Finding memory problems", "summary": "Leaked, abandoned, useful — telling them apart, and the tool for each.", "minutes": "8", "sources": [{"ref": "WWDC24", "label": "Analyze heap memory", "url": "https://developer.apple.com/videos/play/wwdc2024/10173/"}, {"ref": "WWDC18", "label": "iOS Memory Deep Dive", "url": "https://developer.apple.com/videos/play/wwdc2018/416/"}, {"ref": "", "label": "Apple · Gathering information about memory use", "url": "https://developer.apple.com/documentation/xcode/gathering-information-about-memory-use"}], "html": "<p>Everything so far tells you what <em>should<\/em> happen. This chapter is how you find out what did.<\/p><h2 id=\"start-by-classifying-not-by-tooling\">Start by classifying, not by tooling<\/h2><p>WWDC24 splits heap memory three ways, and picking the right bucket first saves most of the time an investigation takes.<\/p><p><strong>Useful<\/strong> — reachable, and genuinely needed.<\/p><p><strong>Abandoned<\/strong> — reachable, not needed. Caches with no bound, singletons accumulating, arrays of \"recent\" things, a coordinator that never drops a child. No bug in the counting sense; the program is doing exactly what it was told.<\/p><p><strong>Leaked<\/strong> — not reachable at all, and therefore impossible to free. Retain cycles, chapters 4 to 6.<\/p><p>The symptom is identical: the memory graph in Xcode's debug navigator climbs and never comes back down. The causes are unrelated. <strong>Abandoned memory is far more common in real apps than leaks<\/strong>, and the reflex to hunt for a cycle is why an afternoon disappears into the wrong half of the problem.<\/p><p>It's also worth separating the <em>shape<\/em> of the growth, because it points at different causes:<\/p><ul><li><strong>Transient spikes<\/strong> — a burst of allocation that comes back down but goes high enough to get the app killed, or to fragment the heap. Usually a batch operation: decoding many images, a large import, a loop creating temporaries.<\/li><li><strong>Persistent growth<\/strong> — a line that steps up with each cycle of some user action and never returns. Usually leaked or abandoned.<\/li><\/ul><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>Useful: the books in use. Abandoned: perfectly catalogued shelves nobody has opened since 2019. Leaked: books not in the catalogue that nobody can remove. Transient: the pile that appears every time a delivery is processed and clears afterwards — unless a delivery is big enough to block the corridors.<\/p><\/blockquote><h2 id=\"the-five-minute-pass-in-order\">The five-minute pass, in order<\/h2><p><strong>1. <code><span class=\"t-kw\">deinit<\/span><\/code> printing.<\/strong> Put a <code>print<\/code> in the <code><span class=\"t-kw\">deinit<\/span><\/code> of the type you suspect, push the screen, pop it, watch. Nothing printed means something still holds it. This costs thirty seconds and answers the question surprisingly often.<\/p><p><strong>2. The Memory Graph Debugger.<\/strong> Run, reach the state, dismiss the screen, press the memory-graph button in the debug bar. Filter for your type. If instances are still there, select one and read the arrows pointing <em>at<\/em> it: that's every strong reference keeping it alive, including <code>closure context<\/code> nodes, which is how a captured <code><span class=\"t-kw\">self<\/span><\/code> names itself.<\/p><p>Turn on <strong>Malloc Stack Logging<\/strong> first (Edit Scheme → Run → Diagnostics → Malloc Stack Logging, \"Live Allocations Only\"). Without it the graph shows you <em>who<\/em> holds the object; with it you also get the backtrace of where each allocation came from, which is the difference between \"an array of view models holds it\" and \"<em>this line<\/em> put it there\".<\/p><p>Purple badges mark what Xcode believes is leaked. Treat them as a hint: the graph can miss cycles that go through non-Swift memory, and can flag things that are merely abandoned.<\/p><p><strong>3. Instruments — Leaks.<\/strong> Same idea, over time and without a debugger attached. Useful for \"this leaks somewhere in a long session\" rather than \"this one screen leaks\".<\/p><p><strong>4. Instruments — Allocations, with generations.<\/strong> The tool for persistent growth. Reach a steady state, press <strong>Mark Generation<\/strong>, perform one complete cycle of the suspect action, return to the same state, mark again. Repeat three or four times. Each generation shows what was allocated since the last mark and is <em>still alive<\/em> — so anything that keeps appearing generation after generation is your growth, with its allocation backtrace attached. This is the single most effective memory technique in the toolbox, and it finds abandoned memory, which the Leaks instrument by definition cannot.<\/p><p><strong>5. Command line, when the app is on a device and you can't attach.<\/strong> <code>leaks<\/code>, <code>heap<\/code>, <code>vmmap<\/code> and <code>malloc_history<\/code> do from a terminal what the graph does in Xcode.<\/p><h2 id=\"two-specific-things-to-look-for\">Two specific things to look for<\/h2><p><strong>Autorelease pools, for transient spikes.<\/strong> Objective-C APIs return objects that are released later, when the enclosing autorelease pool drains — which for the main thread means at the end of the current run-loop pass. A loop that calls into Cocoa a thousand times therefore accumulates a thousand objects before <em>any<\/em> of them is released.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">for<\/span> url <span class=\"t-kw\">in<\/span> thousandsOfURLs {\n    autoreleasepool {\n        <span class=\"t-kw\">let<\/span> image = <span class=\"t-typ\">UIImage<\/span>(contentsOfFile: url.path)   <span class=\"t-com\">// ObjC underneath<\/span>\n        process(image)\n    }                                                   <span class=\"t-com\">// drains here, every iteration<\/span>\n}<\/code><\/pre><\/div><p>The fix is to drain per iteration, as above. The tell is a sawtooth in the allocations graph with a peak far above the steady state, in a loop touching UIKit, Core Graphics, Foundation bridging or <code><span class=\"t-typ\">NSString<\/span><\/code>/<code><span class=\"t-typ\">NSData<\/span><\/code>. Pure-Swift code doesn't autorelease, which is why this is rarer than it used to be and more confusing when it happens.<\/p><p><strong>Image memory, because it's almost never the file size.<\/strong> A decoded image costs roughly width × height × 4 bytes in memory regardless of how well the JPEG compressed. A 12-megapixel photo is about 48 MB decoded, from a 3 MB file. Downsample at load time (<code><span class=\"t-typ\">CGImageSourceCreateThumbnailAtIndex<\/span><\/code> with <code>kCGImageSourceThumbnailMaxPixelSize<\/code>, or <code><span class=\"t-typ\">UIGraphicsImageRenderer<\/span><\/code> at the display size) rather than loading full-size and scaling in a view — the scaling happens after the 48 MB has already been allocated.<\/p><h2 id=\"what-too-much-memory-means-on-ios\">What \"too much memory\" means on iOS<\/h2><p>There is no fixed limit. The system watches total footprint, and when it's under pressure, it terminates — largest first, background first. Your app doesn't get an exception; it gets killed, and the user sees a relaunch. <code>applicationDidReceiveMemoryWarning<\/code> and <code>didReceiveMemoryWarning<\/code> are your one chance to shed caches before that happens, and a cache that ignores them is abandoned memory with extra steps. <code><span class=\"t-typ\">NSCache<\/span><\/code> responds to pressure automatically, which is the main reason to prefer it over a <code><span class=\"t-typ\">Dictionary<\/span><\/code> for anything large.<\/p><p>Footprint is what counts, not \"allocations\": it includes decoded images, Metal textures, layer backing stores and framework overhead, most of which never appears in your own allocation list.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The city doesn't send a warning letter when a branch gets too full. It closes the largest branch that nobody is currently standing in.<\/p><\/blockquote><h2 id=\"the-habit-worth-building\">The habit worth building<\/h2><p>Every tim
