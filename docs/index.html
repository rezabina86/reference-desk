 · Mobile System Design (the public exercise set and its grading criteria)", "url": "https://github.com/weeeBox/mobile-system-design"}, {"ref": "", "label": "System Design Handbook · Mobile system design interview", "url": "https://www.systemdesignhandbook.com/guides/mobile-system-design-interview/"}, {"ref": "", "label": "weeeBox · Mobile system design exercise, Image library", "url": "https://github.com/weeeBox/mobile-system-design/blob/master/exercises/image-library.md"}, {"ref": "WWDC18", "label": "Image and graphics best practices", "url": "https://developer.apple.com/videos/play/wwdc2018/219/"}, {"ref": "WWDC21", "label": "Make blazing fast lists and collection views", "url": "https://developer.apple.com/videos/play/wwdc2021/10252/"}, {"ref": "WWDC19", "label": "Advances in networking, part 1 (Low Data Mode)", "url": "https://developer.apple.com/videos/play/wwdc2019/712/"}, {"ref": "", "label": "Apple · CGImageSourceCreateThumbnailAtIndex", "url": "https://developer.apple.com/documentation/imageio/cgimagesourcecreatethumbnailatindex(_:_:_:)"}, {"ref": "", "label": "Apple · UIImage.preparingForDisplay()", "url": "https://developer.apple.com/documentation/uikit/uiimage/3750834-preparingfordisplay"}, {"ref": "", "label": "Apple · NSCache", "url": "https://developer.apple.com/documentation/foundation/nscache"}, {"ref": "", "label": "Apple · allowsConstrainedNetworkAccess", "url": "https://developer.apple.com/documentation/foundation/urlsessionconfiguration/allowsconstrainednetworkaccess"}, {"ref": "", "label": "Apple · UICollectionViewDataSourcePrefetching", "url": "https://developer.apple.com/documentation/uikit/uicollectionviewdatasourceprefetching"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "", "label": "Nuke · request coalescing and the pipeline", "url": "https://github.com/kean/Nuke"}]}], " <script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);
  var view = document.getElementById('view');
  var tree = document.getElementById('tree');
  var rail = document.getElementById('rail');
  var find = document.getElementById('find');
  var outline = document.getElementById('outline');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function topicBy(slug) { return DATA.topics.filter(function (t) { return t.slug === slug; })[0]; }

  document.getElementById('foot').textContent = 'Built ' + DATA.built;

  /* ------------------------------------------------------------- sidebar */
  var showAllUpcoming = false;

  function sessionRail(t, route) {
    var out = '', group = null;
    t.chapters.forEach(function (c) {
      if (c.group !== group) {
        out += (group === null ? '' : '</div>') + '<p class="tl-sect">' + esc(c.group) + '</p><div class="tl">';
        group = c.group;
      }
      var on = route.topic === t.slug && route.chapter === c.slug;
      out += '<a class="' + (on ? 'on' : '') + '" href="#/' + t.slug + '/' + c.slug + '" title="' +
             esc(c.title) + '"><span class="n">' + esc(c.day.replace(/^0+/, '')) + '</span>' +
             esc(c.short || c.title) + '</a>';
    });
    var up = (t.upcoming || []);
    var shown = showAllUpcoming ? up : up.slice(0, 2);
    shown.forEach(function (u) {
      if (u.group !== group) {
        out += '</div><p class="tl-sect">' + esc(u.group) + '</p><div class="tl">';
        group = u.group;
      }
      out += '<a class="soon" title="' + esc(u.full || u.short) + '"><span class="n">' + esc(u.day) + '</span>' +
             esc(u.short) + '</a>';
    });
    out += group === null ? '' : '</div>';
    if (up.length > 2) {
      out += '<button class="tl-more" data-more="1">' +
             (showAllUpcoming ? 'Show less' : 'Show the remaining ' + (up.length - 2) + ' days') + '</button>';
    }
    var done = t.chapters.filter(function (c) { return c.day && c.day.indexOf('S') !== 0; }).length;
    return '<p class="tl-sect" style="margin-top:4px"><a href="#/' + t.slug + '" style="color:inherit;text-decoration:none">' +
           esc(t.title) + ' · ' + done + ' of ' + (t.total || t.chapters.length) + '</a></p>' + out;
  }

  function paintTree(route) {
    var sessions = DATA.topics.filter(function (t) { return t.kind === 'sessions'; });
    var others = DATA.topics.filter(function (t) { return t.kind !== 'sessions'; });

    var html = sessions.map(function (t) { return sessionRail(t, route); }).join('');
    if (others.length) html += '<p class="tl-sect">Reference</p>';

    html += others.map(function (t) {
      var open = route.topic === t.slug;
      var kids = !open ? '' : '<div class="kids">' + t.chapters.map(function (c, i) {
        var on = route.chapter === c.slug;
        return '<a class="' + (on ? 'on' : '') + '" href="#/' + t.slug + '/' + c.slug + '">' +
               '<span class="num">' + pad(i + 1) + '</span><span>' + esc(c.title) + '</span></a>';
      }).join('') + '</div>';
      return '<div class="tp' + (open ? ' open' : '') + '"><button data-topic="' + esc(t.slug) + '">' +
        '<span class="chev">' + (open ? '▾' : '▸') + '</span><span class="nm">' + esc(t.title) + '</span>' +
        '<span class="ct">' + t.chapters.length + '</span></button>' + kids + '</div>';
    }).join('');

    tree.innerHTML = html;
  }

  tree.addEventListener('click', function (e) {
    var more = e.target.closest('[data-more]');
    if (more) { showAllUpcoming = !showAllUpcoming; route(); return; }
    var head = e.target.closest('[data-topic]');
    if (head) { location.hash = '#/' + head.getAttribute('data-topic'); }
  });

  /* ---------------------------------------------------------------- home */
  function home() {
    var cards = DATA.topics.map(function (t) {
      var list = t.chapters.map(function (c, i) {
        return '<li><a href="#/' + t.slug + '/' + c.slug + '">' +
          '<span class="num">' + pad(i + 1) + '</span>' +
          '<span class="ch-t">' + esc(c.title) + '</span>' +
          '<span class="ch-m">' + esc(c.minutes) + ' min</span>' +
          '<span class="ch-s">' + esc(c.summary) + '</span></a></li>';
      }).join('');
      return '<section class="topic-card">' +
        '<p class="tagline">' + esc(t.tagline || '') + '</p>' +
        '<h2><a href="#/' + t.slug + '">' + esc(t.title) + '</a></h2>' +
        '<p class="blurb">' + esc(t.summary || '') + '</p>' +
        '<ul class="chapters">' + list + '</ul>' +
        '<div class="facts"><span><b>' + t.chapters.length + '</b> chapters</span>' +
        '<span><b>' + t.minutes + '</b> min end to end</span>' +
        '<span><b>' + t.sources.length + '</b> sources</span></div></section>';
    }).join('');

    view.innerHTML =
      '<header class="hero"><h1>The Reference Desk</h1>' +
      '<p>Things worth understanding properly rather than looking up again. Each topic builds from the ground ' +
      'up, every claim about mechanism carries its source, and the sources are linked where they are used.</p></header>' +
      '<div class="hr"></div>' + cards;
    document.title = 'The Reference Desk';
  }

  /* -------------------------------------------------------- session index */
  function sessionIndex(t) {
    var groups = [], byGroup = {};
    t.chapters.forEach(function (c) {
      if (!byGroup[c.group]) { byGroup[c.group] = []; groups.push(c.group); }
      byGroup[c.group].push(
        '<a class="card" href="#/' + t.slug + '/' + c.slug + '"><span class="n">DAY ' +
        esc(c.day.replace(/^0+/, '')) + '</span><b>' + esc(c.short || c.title) + '</b>' +
        '<span class="s">' + esc(c.minutes) + ' min · reading, code, questions</span></a>');
    });
    (t.upcoming || []).forEach(function (u) {
      if (!byGroup[u.group]) { byGroup[u.group] = []; groups.push(u.group); }
      byGroup[u.group].push(
        '<div class="card next"><span class="n">DAY ' + esc(u.day) + '</span><b>' + esc(u.short) +
        '</b><span class="s">not written yet</span></div>');
    });
    var done = t.chapters.length;
    view.innerHTML =
      '<div class="ix-head"><h1>' + esc(t.title) + '</h1><span class="meta">' + done + ' written · ' +
      (t.total || done) + ' planned · ' + t.minutes + ' min</span></div>' +
      '<p class="ix-lede">' + esc(t.summary || '') + '</p>' +
      groups.map(function (g) {
        return '<section class="build"><h3>' + esc(g) + '</h3><div class="cards">' +
               byGroup[g].join('') + '</div></section>';
      }).join('');
    document.title = t.title + ' · The Reference Desk';
  }

  /* ---------------------------------------------------------- topic index */
  function topicIndex(t) {
    var list = t.chapters.map(function (c, i) {
      return '<li><a href="#/' + t.slug + '/' + c.slug + '">' +
        '<span class="num">' + pad(i + 1) + '</span><span class="ch-t">' + esc(c.title) + '</span>' +
        '<span class="ch-m">' + esc(c.minutes) + ' min</span>' +
        '<span class="ch-s">' + esc(c.summary) + '</span></a></li>';
    }).join('');
    view.innerHTML =
      '<div class="ix-head"><h1>' + esc(t.title) + '</h1><span class="meta">' + t.chapters.length +
      ' chapters · ' + t.minutes + ' min</span></div>' +
      '<p class="ix-lede">' + esc(t.summary || '') + '</p>' +
      '<ul class="chapters">' + list + '</ul>';
    document.title = t.title + ' · The Reference Desk';
  }

  /* ------------------------------------------------------------- chapter */
  function chapter(t, c, idx) {
    var prev = t.chapters[idx - 1], next = t.chapters[idx + 1];
    var srcs = c.sources.length ? '<section class="sources"><h2>Sources for this chapter</h2><div class="src">' +
      c.sources.map(function (s) {
        return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
          '<span class="s-r">' + esc(s.ref) + '</span>' +
          '<span class="s-l">' + esc(s.label) + '<span class="s-u">' + esc(s.url) + '</span></span></a>';
      }).join('') + '</div></section>' : '';

    var pager = '<nav class="pager">' +
      (prev ? '<a href="#/' + t.slug + '/' + prev.slug + '"><span class="dir">Previous</span>' +
              '<span class="nm">' + esc(prev.title) + '</span></a>' : '') +
      (next ? '<a class="next" href="#/' + t.slug + '/' + next.slug + '"><span class="dir">Next</span>' +
              '<span class="nm">' + esc(next.title) + '</span></a>' : '') + '</nav>';

    var prog = '';
    if (t.kind === 'sessions' && c.day && c.day.indexOf('S') !== 0) {
      var n = parseInt(c.day, 10), total = t.total || t.chapters.length;
      var slice = 0, size = 0;
      t.chapters.concat(t.upcoming || []).forEach(function (x) {
        if (x.group === c.group) { size++; if (String(parseInt(x.day, 10)) === String(n)) slice = size; }
      });
      prog = '<div class="prog"><span class="lb">' + esc(c.group) +
        (slice ? ' · slice ' + slice + ' of ' + size : '') + '</span>' +
        '<span class="bar"><i style="width:' + Math.round(n / total * 100) + '%"></i></span>' +
        '<span class="lb">Day ' + n + ' of ' + total + '</span></div>';
    }

    view.innerHTML = '<article>' + prog +
      '<div class="eyebrow"><a href="#/' + t.slug + '">' + esc(t.title) + '</a><span class="dot"></span>' +
      'Chapter ' + pad(idx + 1) + ' of ' + pad(t.chapters.length) +
      '<span class="dot"></span>' + esc(c.minutes) + ' min</div>' +
      '<h1 class="title">' + esc(c.title) + '</h1>' +
      '<p class="lede">' + esc(c.summary) + '</p>' +
      c.html + srcs + pager + '</article>';
    document.title = c.title + ' · The Reference Desk';
    paintOutline(c);
  }

  var spy = null;
  function paintOutline(c) {
    var items = c.outline || [];
    if (items.length < 3) { outline.innerHTML = ''; return; }
    outline.innerHTML = '<p class="h">' + (c.day ? 'This session' : 'On this page') + '</p>' + items.map(function (o) {
      return '<a href="#' + esc(o.a) + '" data-anchor="' + esc(o.a) + '">' + esc(o.t) + '</a>';
    }).join('');

    if (spy) spy.disconnect();
    var links = {};
    outline.querySelectorAll('a').forEach(function (a) { links[a.getAttribute('data-anchor')] = a; });
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var a = links[e.target.id];
        if (!a) return;
        if (e.isIntersecting) {
          outline.querySelectorAll('a.on').forEach(function (x) { x.classList.remove('on'); });
          a.classList.add('on');
        }
      });
    }, { rootMargin: '0px 0px -75% 0px' });
    items.forEach(function (o) {
      var el = document.getElementById(o.a);
      if (el) spy.observe(el);
    });
  }

  /* -------------------------------------------------------------- search */
  function search(q) {
    outline.innerHTML = '';
    var hits = [];
    DATA.topics.forEach(function (t) {
      t.chapters.forEach(function (c, i) {
        var hay = (c.title + ' ' + c.summary + ' ' + c.text).toLowerCase();
        if (hay.indexOf(q) !== -1) hits.push({ t: t, c: c, i: i });
      });
    });
    view.innerHTML = '<div class="eyebrow">' + hits.length + ' chapter' + (hits.length === 1 ? '' : 's') +
      ' matching &ldquo;' + esc(q) + '&rdquo;</div>' +
      (hits.length ? '<ul class="results">' + hits.map(function (h) {
        return '<li><a href="#/' + h.t.slug + '/' + h.c.slug + '">' +
          '<div class="where">' + esc(h.t.title) + ' · ' + pad(h.i + 1) + '</div>' +
          '<div class="ch-t">' + esc(h.c.title) + '</div>' +
          '<div class="ch-s">' + esc(h.c.summary) + '</div></a></li>';
      }).join('') + '</ul>' : '<p class="empty">Nothing here yet. Try a different word.</p>');
  }

  /* -------------------------------------------------------------- router */
  function route() {
    var q = find.value.trim().toLowerCase();
    var parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
    var r = { topic: parts[0], chapter: parts[1] };
    paintTree(r);
    if (q.length > 1) { search(q); return; }

    var t = r.topic && topicBy(r.topic);
    if (!t) { outline.innerHTML = ''; home(); }
    else if (!r.chapter) {
      outline.innerHTML = '';
      if (t.kind === 'sessions') sessionIndex(t); else topicIndex(t);
    }
    else {
      var idx = -1;
      t.chapters.forEach(function (c, i) { if (c.slug === r.chapter) idx = i; });
      if (idx === -1) { outline.innerHTML = ''; home(); } else chapter(t, t.chapters[idx], idx);
    }
    window.scrollTo(0, 0);
    rail.classList.remove('open');
  }

  window.addEventListener('hashchange', route);
  find.addEventListener('input', route);
  document.getElementById('burger').addEventListener('click', function () { rail.classList.toggle('open'); });
  document.getElementById('home-link').addEventListener('click', function () {
    find.value = ''; location.hash = '#/';
    if (location.hash === '#/') route();
  });
  route();
})();
</script>
