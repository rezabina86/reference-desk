; the next mutation sees a count above one and forks. if the other copy has since gone away, the count is back to one and the mutation is in place, for free. value semantics at the surface, one allocation underneath, and the reference count is the entire coordination mechanism. in the library. the library doesn't photocopy a 400 page report for every reader — everyone shares the one copy while they're only reading . the moment somebody wants to write in the margins, the desk checks whether anyone else has it out. if yes, they get a photocopy to scribble on. if not, they scribble on the original. two things to know before you implement it the && ordering gotcha , straight from the standard library's own documentation. in a debug build, an instance on the left of a && may still be referenced while the right hand side is evaluated, inflating the count — so this version copies on every call: swift // copies too frequently if storage.shouldcopy !isknownuniquelyreferenced(&storage) { … } put the uniqueness check first, or compute the other condition into a local first. a performance bug that only exists in debug builds is a memorable one to have been bitten by. it checks strong references only. weak and unowned references to the buffer don't make it non unique, and passing a weak reference always returns false . and uniqueness is meaningless without synchronisation: if two threads can reach the same struct, the check can say \"unique\" while another thread is mid copy. the documentation's wording is that you must only call it from mutating methods with appropriate thread synchronisation — which for a value type usually means the value isn't shared across threads in the first place, and if it is, you have a data race, not a cow problem. when to reach for this almost never directly. use array and dictionary , which do it for you. the cases where you write it yourself are specific: a value type wrapping a large buffer that gets copied often and mutated rarely (image data, a big matrix, a parsed document), or a value type wrapping something expensive to duplicate, like a cgcontext or a database handle. outside those, a struct holding value properties is simpler and faster, because there's no allocation to share in the first place. the reverse also matters: not everything should be a struct. a type with genuine identity — a network session, a cache, a coordinator, anything where \"the same one\" means something — is a class, and making it a struct produces its own confusing bugs. the question is identity, not performance. when two instances with identical contents should be interchangeable, that's a value. when they shouldn't, that's an object. where this leaves the topic values sidestep ownership; references need it decided. most application code can be mostly values with a thin layer of long lived objects — the caches, the coordinators, the sessions — and that thin layer is where all the material from chapters 4 to 6 applies. next: what happens to any of this when more than one thread is involved. the short version is that the counting is safe and the object isn't, and the difference is where several genuinely nasty crashes live. ", "outline": [{"a": "why-a-struct-has-no-memory-question", "t": "Why a struct has no memory question"}, {"a": "the-trap-a-struct-that-holds-a-class", "t": "The trap: a struct that holds a class"}, {"a": "how-array-can-afford-to-be-a-value-type", "t": "How Array can afford to be a value type"}, {"a": "two-things-to-know-before-you-implement-it", "t": "Two things to know before you implement it"}, {"a": "when-to-reach-for-this", "t": "When to reach for this"}, {"a": "where-this-leaves-the-topic", "t": "Where this leaves the topic"}]}, {"slug": "arc-under-concurrency", "title": "ARC under concurrency", "summary": "Why the count is thread-safe and the object isn't, what a task keeps alive, and which thread runs deinit.", "minutes": "8", "sources": [{"ref": "", "label": "Swift · RefCount.h (runtime source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/SwiftShims/swift/shims/RefCount.h"}, {"ref": "SE-0371", "label": "Isolated synchronous deinit", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0371-isolated-synchronous-deinit.md"}, {"ref": "SE-0302", "label": "Sendable and @Sendable closures", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0302-concurrent-value-and-concurrent-closures.md"}], "html": "<p>This chapter is the seam between this topic and the concurrency one. It answers a question people often assume away in both directions: <em>if two threads share an object, does ARC protect me?<\/em><\/p><p>Partly. It protects the count. It does not protect the object.<\/p><h2 id=\"the-count-is-atomic-the-contents-are-not\">The count is atomic; the contents are not<\/h2><p>The reference count lives in an <code>atomic<\/code> word in the object's header. Two threads retaining and releasing the same object at the same instant cannot corrupt it, cannot lose an increment, and cannot cause a premature free. That is a property of the runtime's data layout, not of your code, and it holds whatever you do.<\/p><p>What it buys you is exactly one guarantee: <strong>while you hold a strong reference, the object will not be destroyed underneath you.<\/strong> That's real, and it's why passing an object between threads never produces the chapter 1 use-after-free on its own.<\/p><p>What it does not touch is the object's <em>state<\/em>. Two threads calling <code>account.balance += <span class=\"t-num\">100<\/span><\/code> race on <code>balance<\/code> just as hard as they ever did. ARC keeps the book on the shelf; it says nothing about two people writing on page 40 at once.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The tally slip is written in a special pen that two hands can't smudge — the count is always exactly right. The pages are ordinary paper.<\/p><\/blockquote><p>This is the whole reason <code><span class=\"t-typ\">Sendable<\/span><\/code> exists as a separate idea from reference counting, and why a <code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span><\/code> with only <code><span class=\"t-kw\">let<\/span><\/code> properties can be <code><span class=\"t-typ\">Sendable<\/span><\/code> while the same class with one <code><span class=\"t-kw\">var<\/span><\/code> cannot. Counting safety is free and automatic; state safety is the thing you have to design.<\/p><h2 id=\"atomic-isn-t-free\">Atomic isn't free<\/h2><p>Each retain and release is an atomic read-modify-write on a word that other cores may be touching. In a loop over a large collection of class instances, or a chain of <code><span class=\"t-kw\">weak<\/span><\/code> reads (chapter 4), that traffic is measurable — it's cache-line contention, not just instruction count.<\/p><p>Two things follow, in this order of importance.<\/p><p><strong>Don't optimise it by reflex.<\/strong> The compiler removes most redundant pairs, and the remainder is usually dwarfed by whatever the code is actually doing. Chasing retain traffic without a profile is the classic wasted afternoon.<\/p><p><strong>When it does show up, it shows up as a shape.<\/strong> Time Profiler attributing real time to <code>swift_retain<\/code> / <code>swift_release<\/code>, typically from a tight loop over reference types. The fix is structural — values instead of references in the hot path, or hoisting a weak read out of a loop — not micro-tweaks.<\/p><h2 id=\"what-a-task-keeps-alive\">What a task keeps alive<\/h2><p>A <code><span class=\"t-typ\">Task<\/span><\/code> holds its closure until it finishes, and the closure holds its captures (chapter 6). So the rule is short: <strong>anything a running task mentions stays alive until that task ends.<\/strong><\/p><p>That is usually correct and often the point. An upload that must complete should keep its uploader alive. The cases to watch are the ones where \"until it ends\" isn't a bound:<\/p><ul><li>a task looping over an <code><span class=\"t-typ\">AsyncStream<\/span><\/code> that never terminates<\/li><li>a task stored on the object it captures — the cycle from chapter 6<\/li><li>a detached task that outlives the screen that started it, still holding a view model<\/li><\/ul><p>Structured concurrency helps by construction: <code><span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span><\/code> and task groups end before their scope does, so their captures can't outlive it. Unstructured <code><span class=\"t-typ\">Task<\/span> { }<\/code> is the one you have to reason about, and cancellation is how you bound it. Cancelling doesn't kill anything on its own — the task still has to notice and return — but returning is what releases the captures.<\/p><h2 id=\"actors-hold-references-like-anything-else\">Actors hold references like anything else<\/h2><p>An actor is a class, so it is reference counted, and everything it stores it stores strongly. A cache actor holding view models keeps them alive; a task stored in an actor's dictionary keeps its closure alive. Isolation says who may <em>touch<\/em> state; it says nothing about how long that state lives.<\/p><p>The cycle shapes from chapter 5 all still apply inside actors, with one twist: you can't break one from outside, because you can't reach in without <code><span class=\"t-kw\">await<\/span><\/code>. That makes \"the actor holds everything for ever\" a common shape — an in-flight-task registry that never removes finished entries is a cache with no eviction (shape 5), wearing a concurrency hat.<\/p><h2 id=\"which-thread-runs-deinit\">Which thread runs deinit<\/h2><p>Whichever thread released last. That may be a background thread, the main thread, or a cooperative-pool thread running some unrelated task — the object has no say in it, and neither do you.<\/p><p>This produces a specific, nasty crash class: a <code><span class=\"t-kw\">deinit<\/span><\/code> that touches UIKit, or a <code><span class=\"t-atr\">@MainActor<\/span><\/code>-isolated property, from whatever thread happened to drop the last reference. It fires rarely, in release builds, on other people's devices.<\/p><p>Swift's answer is <code>isolated <span class=\"t-kw\">deinit<\/span><\/code>, implemented in Swift 6.2:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Screen<\/span> {\n    <span class=\"t-kw\">let<\/span> view: <span class=\"t-typ\">UIView<\/span>\n    isolated <span class=\"t-kw\">deinit<\/span> {\n        view.removeFromSuperview()   <span class=\"t-com\">// guaranteed to run on the main actor<\/span>\n    }\n}<\/code><\/pre><\/div><p>Without it, a <code><span class=\"t-kw\">deinit<\/span><\/code> on an actor or a global-actor-isolated class cannot touch the isolated state at all — the restriction SE-0327 imposed, which is why so much code grew an explicit <code>close()<\/code> or <code>invalidate()<\/code> method instead. Both patterns are still reasonable; the explicit teardown has the advantage that it runs at a point you chose rather than at an arbitrary release.<\/p><p>Worth noticing what an isolated <code><span class=\"t-kw\">deinit<\/span><\/code> costs: if the last release happens off the main actor, the destruction has to hop, so the object's death is now asynchronous with respect to whoever released it. Determinism in <em>order<\/em> is preserved; determinism in <em>timing<\/em> is not.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>The state machine in <code><span class=\"t-typ\">RefCount<\/span>.h<\/code> is what makes the concurrent case safe at all. Between \"strong count hit zero\" and \"the memory is gone\" there are four states, and a <code><span class=\"t-kw\">weak<\/span><\/code> read arriving from another thread during any of them has a defined answer — <code><span class=\"t-kw\">nil<\/span><\/code> — rather than a race against the deallocation. That's why <code><span class=\"t-kw\">weak<\/span><\/code> reads are a runtime call and not a pointer dereference, and it's why they cost what they cost.<\/p><\/blockquote><h2 id=\"the-two-sentences-to-have-ready\">The two sentences to have ready<\/h2><p><strong>ARC is thread-safe; your object is not.<\/strong> The count is atomic, so an object won't be freed while you hold a reference. Nothing about that serialises access to its properties — that's what actors, locks and <code><span class=\"t-typ\">Sendable<\/span><\/code> are for.<\/p><p><strong>Reference counting decides lifetime; isolation decides access.<\/strong> They are orthogonal, they are enforced in different places — one at runtime, one at compile time — and most confusion here comes from expecting either to do the other's job.<\/p>", "text": "this chapter is the seam between this topic and the concurrency one. it answers a question people often assume away in both directions: if two threads share an object, does arc protect me? partly. it protects the count. it does not protect the object. the count is atomic; the contents are not the reference count lives in an atomic word in the object's header. two threads retaining and releasing the same object at the same instant cannot corrupt it, cannot lose an increment, and cannot cause a premature free. that is a property of the runtime's data layout, not of your code, and it holds whatever you do. what it buys you is exactly one guarantee: while you hold a strong reference, the object will not be destroyed underneath you. that's real, and it's why passing an object between threads never produces the chapter 1 use after free on its own. what it does not touch is the object's state . two threads calling account.balance += 100 race on balance just as hard as they ever did. arc keeps the book on the shelf; it says nothing about two people writing on page 40 at once. in the library. the tally slip is written in a special pen that two hands can't smudge — the count is always exactly right. the pages are ordinary paper. this is the whole reason sendable exists as a separate idea from reference counting, and why a final class with only let properties can be sendable while the same class with one var cannot. counting safety is free and automatic; state safety is the thing you have to design. atomic isn't free each retain and release is an atomic read modify write on a word that other cores may be touching. in a loop over a large collection of class instances, or a chain of weak reads (chapter 4), that traffic is measurable — it's cache line contention, not just instruction count. two things follow, in this order of importance. don't optimise it by reflex. the compiler removes most redundant pairs, and the remainder is usually dwarfed by whatever the code is actually doing. chasing retain traffic without a profile is the classic wasted afternoon. when it does show up, it shows up as a shape. time profiler attributing real time to swift_retain / swift_release , typically from a tight loop over reference types. the fix is structural — values instead of references in the hot path, or hoisting a weak read out of a loop — not micro tweaks. what a task keeps alive a task holds its closure until it finishes, and the closure holds its captures (chapter 6). so the rule is short: anything a running task mentions stays alive until that task ends. that is usually correct and often the point. an upload that must complete should keep its uploader alive. the cases to watch are the ones where \"until it ends\" isn't a bound: a task looping over an asyncstream that never terminates a task stored on the object it captures — the cycle from chapter 6 a detached task that outlives the screen that started it, still holding a view model structured concurrency helps by construction: async let and task groups end before their scope does, so their captures can't outlive it. unstructured task { } is the one you have to reason about, and cancellation is how you bound it. cancelling doesn't kill anything on its own — the task still has to notice and return — but returning is what releases the captures. actors hold references like anything else an actor is a class, so it is reference counted, and everything it stores it stores strongly. a cache actor holding view models keeps them alive; a task stored in an actor's dictionary keeps its closure alive. isolation says who may touch state; it says nothing about how long that state lives. the cycle shapes from chapter 5 all still apply inside actors, with one twist: you can't break one from outside, because you can't reach in without await . that makes \"the actor holds everything for ever\" a common shape — an in flight task registry that never removes finished entries is a cache with no eviction (shape 5), wearing a concurrency hat. which thread runs deinit whichever thread released last. that may be a background thread, the main thread, or a cooperative pool thread running some unrelated task — the object has no say in it, and neither do you. this produces a specific, nasty crash class: a deinit that touches uikit, or a @mainactor isolated property, from whatever thread happened to drop the last reference. it fires rarely, in release builds, on other people's devices. swift's answer is isolated deinit , implemented in swift 6.2: swift @mainactor final class screen { let view: uiview isolated deinit { view.removefromsuperview() // guaranteed to run on the main actor } } without it, a deinit on an actor or a global actor isolated class cannot touch the isolated state at all — the restriction se 0327 imposed, which is why so much code grew an explicit close() or invalidate() method instead. both patterns are still reasonable; the explicit teardown has the advantage that it runs at a point you chose rather than at an arbitrary release. worth noticing what an isolated deinit costs: if the last release happens off the main actor, the destruction has to hop, so the object's death is now asynchronous with respect to whoever released it. determinism in order is preserved; determinism in timing is not. under the hood. the state machine in refcount.h is what makes the concurrent case safe at all. between \"strong count hit zero\" and \"the memory is gone\" there are four states, and a weak read arriving from another thread during any of them has a defined answer — nil — rather than a race against the deallocation. that's why weak reads are a runtime call and not a pointer dereference, and it's why they cost what they cost. the two sentences to have ready arc is thread safe; your object is not. the count is atomic, so an object won't be freed while you hold a reference. nothing about that serialises access to its properties — that's what actors, locks and sendable are for. reference counting decides lifetime; isolation decides access. they are orthogonal, they are enforced in different places — one at runtime, one at compile time — and most confusion here comes from expecting either to do the other's job. ", "outline": [{"a": "the-count-is-atomic-the-contents-are-not", "t": "The count is atomic; the contents are not"}, {"a": "atomic-isn-t-free", "t": "Atomic isn't free"}, {"a": "what-a-task-keeps-alive", "t": "What a task keeps alive"}, {"a": "actors-hold-references-like-anything-else", "t": "Actors hold references like anything else"}, {"a": "which-thread-runs-deinit", "t": "Which thread runs deinit"}, {"a": "the-two-sentences-to-have-ready", "t": "The two sentences to have ready"}]}, {"slug": "finding-memory-problems", "title": "Finding memory problems", "summary": "Leaked, abandoned, useful — telling them apart, and the tool for each.", "minutes": "8", "sources": [{"ref": "WWDC24", "label": "Analyze heap memory", "url": "https://developer.apple.com/videos/play/wwdc2024/10173/"}, {"ref": "WWDC18", "label": "iOS Memory Deep Dive", "url": "https://developer.apple.com/videos/play/wwdc2018/416/"}, {"ref": "", "label": "Apple · Gathering information about memory use", "url": "https://developer.apple.com/documentation/xcode/gathering-information-about-memory-use"}], "html": "<p>Everything so far tells you what <em>should<\/em> happen. This chapter is how you find out what did.<\/p><h2 id=\"start-by-classifying-not-by-tooling\">Start by classifying, not by tooling<\/h2><p>WWDC24 splits heap memory three ways, and picking the right bucket first saves most of the time an investigation takes.<\/p><p><strong>Useful<\/strong> — reachable, and genuinely needed.<\/p><p><strong>Abandoned<\/strong> — reachable, not needed. Caches with no bound, singletons accumulating, arrays of \"recent\" things, a coordinator that never drops a child. No bug in the counting sense; the program is doing exactly what it was told.<\/p><p><strong>Leaked<\/strong> — not reachable at all, and therefore impossible to free. Retain cycles, chapters 4 to 6.<\/p><p>The symptom is identical: the memory graph in Xcode's debug navigator climbs and never comes back down. The causes are unrelated. <strong>Abandoned memory is far more common in real apps than leaks<\/strong>, and the reflex to hunt for a cycle is why an afternoon disappears into the wrong half of the problem.<\/p><p>It's also worth separating the <em>shape<\/em> of the growth, because it points at different causes:<\/p><ul><li><strong>Transient spikes<\/strong> — a burst of allocation that comes back down but goes high enough to get the app killed, or to fragment the heap. Usually a batch operation: decoding many images, a large import, a loop creating temporaries.<\/li><li><strong>Persistent growth<\/strong> — a line that steps up with each cycle of some user action and never returns. Usually leaked or abandoned.<\/li><\/ul><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>Useful: the books in use. Abandoned: perfectly catalogued shelves nobody has opened since 2019. Leaked: books not in the catalogue that nobody can remove. Transient: the pile that appears every time a delivery is processed and clears afterwards — unless a delivery is big enough to block the corridors.<\/p><\/blockquote><h2 id=\"the-five-minute-pass-in-order\">The five-minute pass, in order<\/h2><p><strong>1. <code><span class=\"t-kw\">deinit<\/span><\/code> printing.<\/strong> Put a <code>print<\/code> in the <code><span class=\"t-kw\">deinit<\/span><\/code> of the type you suspect, push the screen, pop it, watch. Nothing printed means something still holds it. This costs thirty seconds and answers the question surprisingly often.<\/p><p><strong>2. The Memory Graph Debugger.<\/strong> Run, reach the state, dismiss the screen, press the memory-graph button in the debug bar. Filter for your type. If instances are still there, select one and read the arrows pointing <em>at<\/em> it: that's every strong reference keeping it alive, including <code>closure context<\/code> nodes, which is how a captured <code><span class=\"t-kw\">self<\/span><\/code> names itself.<\/p><p>Turn on <strong>Malloc Stack Logging<\/strong> first (Edit Scheme → Run → Diagnostics → Malloc Stack Logging, \"Live Allocations Only\"). Without it the graph shows you <em>who<\/em> holds the object; with it you also get the backtrace of where each allocation came from, which is the difference between \"an array of view models holds it\" and \"<em>this line<\/em> put it there\".<\/p><p>Purple badges mark what Xcode believes is leaked. Treat them as a hint: the graph can miss cycles that go through non-Swift memory, and can flag things that are merely abandoned.<\/p><p><strong>3. Instruments — Leaks.<\/strong> Same idea, over time and without a debugger attached. Useful for \"this leaks somewhere in a long session\" rather than \"this one screen leaks\".<\/p><p><strong>4. Instruments — Allocations, with generations.<\/strong> The tool for persistent growth. Reach a steady state, press <strong>Mark Generation<\/strong>, perform one complete cycle of the suspect action, return to the same state, mark again. Repeat three or four times. Each generation shows what was allocated since the last mark and is <em>still alive<\/em> — so anything that keeps appearing generation after generation is your growth, with its allocation backtrace attached. This is the single most effective memory technique in the toolbox, and it finds abandoned memory, which the Leaks instrument by definition cannot.<\/p><p><strong>5. Command line, when the app is on a device and you can't attach.<\/strong> <code>leaks<\/code>, <code>heap<\/code>, <code>vmmap<\/code> and <code>malloc_history<\/code> do from a terminal what the graph does in Xcode.<\/p><h2 id=\"two-specific-things-to-look-for\">Two specific things to look for<\/h2><p><strong>Autorelease pools, for transient spikes.<\/strong> Objective-C APIs return objects that are released later, when the enclosing autorelease pool drains — which for the main thread means at the end of the current run-loop pass. A loop that calls into Cocoa a thousand times therefore accumulates a thousand objects before <em>any<\/em> of them is released.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">for<\/span> url <span class=\"t-kw\">in<\/span> thousandsOfURLs {\n    autoreleasepool {\n        <span class=\"t-kw\">let<\/span> image = <span class=\"t-typ\">UIImage<\/span>(contentsOfFile: url.path)   <span class=\"t-com\">// ObjC underneath<\/span>\n        process(image)\n    }                                                   <span class=\"t-com\">// drains here, every iteration<\/span>\n}<\/code><\/pre><\/div><p>The fix is to drain per iteration, as above. The tell is a sawtooth in the allocations graph with a peak far above the steady state, in a loop touching UIKit, Core Graphics, Foundation bridging or <code><span class=\"t-typ\">NSString<\/span><\/code>/<code><span class=\"t-typ\">NSData<\/span><\/code>. Pure-Swift code doesn't autorelease, which is why this is rarer than it used to be and more confusing when it happens.<\/p><p><strong>Image memory, because it's almost never the file size.<\/strong> A decoded image costs roughly width × height × 4 bytes in memory regardless of how well the JPEG compressed. A 12-megapixel photo is about 48 MB decoded, from a 3 MB file. Downsample at load time (<code><span class=\"t-typ\">CGImageSourceCreateThumbnailAtIndex<\/span><\/code> with <code>kCGImageSourceThumbnailMaxPixelSize<\/code>, or <code><span class=\"t-typ\">UIGraphicsImageRenderer<\/span><\/code> at the display size) rather than loading full-size and scaling in a view — the scaling happens after the 48 MB has already been allocated.<\/p><h2 id=\"what-too-much-memory-means-on-ios\">What \"too much memory\" means on iOS<\/h2><p>There is no fixed limit. The system watches total footprint, and when it's under pressure, it terminates — largest first, background first. Your app doesn't get an exception; it gets killed, and the user sees a relaunch. <code>applicationDidReceiveMemoryWarning<\/code> and <code>didReceiveMemoryWarning<\/code> are your one chance to shed caches before that happens, and a cache that ignores them is abandoned memory with extra steps. <code><span class=\"t-typ\">NSCache<\/span><\/code> responds to pressure automatically, which is the main reason to prefer it over a <code><span class=\"t-typ\">Dictionary<\/span><\/code> for anything large.<\/p><p>Footprint is what counts, not \"allocations\": it includes decoded images, Metal textures, layer backing stores and framework overhead, most of which never appears in your own allocation list.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The city doesn't send a warning letter when a branch gets too full. It closes the largest branch that nobody is currently standing in.<\/p><\/blockquote><h2 id=\"the-habit-worth-building\">The habit worth building<\/h2><p>Every time you build a screen that can be pushed and popped, push it and pop it three times with the memory graph open. Thirty seconds, and it catches nearly every cycle you will ever write — at the moment when you still remember which closure you meant to capture weakly.<\/p><p>The rest of it — generations, malloc stack logging, <code>vmmap<\/code> — is for the week when the graph is climbing and nobody knows why, which is a different and rarer day.<\/p>", "text": "everything so far tells you what should happen. this chapter is how you find out what did. start by classifying, not by tooling wwdc24 splits heap memory three ways, and picking the right bucket first saves most of the time an investigation takes. useful — reachable, and genuinely needed. abandoned — reachable, not needed. caches with no bound, singletons accumulating, arrays of \"recent\" things, a coordinator that never drops a child. no bug in the counting sense; the program is doing exactly what it was told. leaked — not reachable at all, and therefore impossible to free. retain cycles, chapters 4 to 6. the symptom is identical: the memory graph in xcode's debug navigator climbs and never comes back down. the causes are unrelated. abandoned memory is far more common in real apps than leaks , and the reflex to hunt for a cycle is why an afternoon disappears into the wrong half of the problem. it's also worth separating the shape of the growth, because it points at different causes: transient spikes — a burst of allocation that comes back down but goes high enough to get the app killed, or to fragment the heap. usually a batch operation: decoding many images, a large import, a loop creating temporaries. persistent growth — a line that steps up with each cycle of some user action and never returns. usually leaked or abandoned. in the library. useful: the books in use. abandoned: perfectly catalogued shelves nobody has opened since 2019. leaked: books not in the catalogue that nobody can remove. transient: the pi on cannot. 5. command line, when the app is on a device and you can't attach. leaks , heap , vmmap and malloc_history do from a terminal what the graph does in xcode. two specific things to look for autorelease pools, for transient spikes. objective c apis return objects that are released later, when the enclosing autorelease pool drains — which for the main thread means at the end of the current run loop pass. a loop that calls into cocoa a thousand times therefore accumulates a thousand objects before any of them is released. swift for url in thousandsofurls { autoreleasepool { let image = uiimage(contentsoffile: url.path) // objc underneath process(image) } // drains here, every iteration } the fix is to drain per iteration, as above. the tell is a sawtooth in the allocations graph with a peak far above the steady state, in a loop touching uikit, core graphics, foundation bridging or nsstring / nsdata . pure swift code doesn't autorelease, which is why this is rarer than it used to be and more confusing when it happens. image memory, because it's almost never the file size. a decoded image costs roughly width × height × 4 bytes in memory regardless of how well the jpeg compressed. a 12 megapixel photo is about 48 mb decoded, from a 3 mb file. downsample at load time ( cgimagesourcecreatethumbnailatindex with kcgimagesourcethumbnailmaxpixelsize , or uigraphicsimagerenderer at the display size) rather than loading full size and scaling in a view — the scaling happens after the 48 mb has already been allocated. what \"too much memory\" means on ios there is no fixed limit. the system watches total footprint, and when it's under pressure, it terminates — largest first, background first. your app doesn't get an exception; it gets killed, and the user sees a relaunch. applicationdidreceivememorywarning and didreceivememorywarning are your one chance to shed caches before that happens, and a cache that ignores them is abandoned memory with extra steps. nscache responds to pressure automatically, which is the main reason to prefer it over a dictionary for anything large. footprint is what counts, not \"allocations\": it includes decoded images, metal textures, layer backing stores and framework overhead, most of which never appears in your own allocation list. in the library. the city doesn't send a warning letter when a branch gets too full. it closes the largest branch that nobody is currently standing in. the habit worth building every time you build a screen that can be pushed and popped, push it and pop it three times with the memory graph open. thirty seconds, and it catches nearly every cycle you will ever write — at the moment when you still remember which closure you meant to capture weakly. the rest of it — generations, malloc stack logging, vmmap — is for the week when the graph is climbing and nobody knows why, which is a different and rarer day. ", "outline": [{"a": "start-by-classifying-not-by-tooling", "t": "Start by classifying, not by tooling"}, {"a": "the-five-minute-pass-in-order", "t": "The five-minute pass, in order"}, {"a": "two-specific-things-to-look-for", "t": "Two specific things to look for"}, {"a": "what-too-much-memory-means-on-ios", "t": "What \"too much memory\" means on iOS"}, {"a": "the-habit-worth-building", "t": "The habit worth building"}]}, {"slug": "decision-guide", "title": "The decision guide", "summary": "The ladder, the cheat sheet, the full map, and the questions to answer out loud.", "minutes": "7", "sources": [{"ref": "WWDC21", "label": "ARC in Swift: Basics and beyond", "url": "https://developer.apple.com/videos/play/wwdc2021/10216/"}, {"ref": "WWDC24", "label": "Analyze heap memory", "url": "https://developer.apple.com/videos/play/wwdc2024/10173/"}, {"ref": "", "label": "Apple · Automatic Reference Counting (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/"}], "html": "<h2 id=\"the-ladder\">The ladder<\/h2><p>Not \"manage memory\". A sequence, and you stop as soon as the problem is solved.<\/p><p><strong>Step 0 — use a value type.<\/strong> No identity, no sharing, no count, no cycle, no <code><span class=\"t-kw\">deinit<\/span><\/code> to think about. Most model data, most state, most things passed between layers. The questions in this topic don't arise for a <code><span class=\"t-kw\">struct<\/span><\/code> of <code><span class=\"t-kw\">struct<\/span><\/code>s, which is the cheapest way to not have them.<\/p><p><strong>Step 1 — use a class, with strong references, when the thing has identity.<\/strong> A cache, a session, a coordinator, a view model. Strong is the default and it is correct far more often than the internet implies. An object graph that is a tree of strong references has no memory problem at all.<\/p><p><strong>Step 2 — make the back-pointer non-owning when the tree needs a loop.<\/strong> Decide the direction of ownership first, then spell the other direction. <code><span class=\"t-kw\">weak<\/span><\/code> when the target's lifetime is independent of yours; <code><span class=\"t-kw\">unowned<\/span><\/code> only when you can say in one sentence why this reference cannot outlive its target.<\/p><p><strong>Step 3 — bound anything that accumulates.<\/strong> Caches, registries, arrays of children, dictionaries of in-flight tasks. A count limit, an eviction policy, an unregister call, or <code><span class=\"t-typ\">NSCache<\/span><\/code>. This is the step people skip, and abandoned memory is more common in real apps than leaks.<\/p><p><strong>Step 4 — verify with the graph, once, per screen.<\/strong> Push, pop, memory graph, filter for the type. Thirty seconds, at the moment you still remember what you captured.<\/p><p><strong>The error to avoid<\/strong> is starting at step 2 — sprinkling <code>[<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>]<\/code> everywhere as a precaution. It converts a loud bug class (leaks, which tools find) into a quiet one (work that silently doesn't happen because <code><span class=\"t-kw\">self<\/span><\/code> was <code><span class=\"t-kw\">nil<\/span><\/code>), and it hides the fact that nobody decided who owns what.<\/p><h2 id=\"the-reference-cheat-sheet\">The reference cheat sheet<\/h2><div class=\"scroll\"><table><thead><tr><th>Spelling<\/th><th>Keeps it alive?<\/th><th>After the object dies<\/th><th>Cost<\/th><th>Use when<\/th><\/tr><\/thead><tbody><tr><td><code><span class=\"t-kw\">let<\/span><\/code> / <code><span class=\"t-kw\">var<\/span><\/code> (strong)<\/td><td>yes<\/td><td>can't happen<\/td><td>a retain/release pair<\/td><td>you own it — the default<\/td><\/tr><tr><td><code><span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">var<\/span> x: <span class=\"t-typ\">T<\/span>?<\/code><\/td><td>no<\/td><td>reads <code><span class=\"t-kw\">nil<\/span><\/code><\/td><td>side table + a runtime call per read<\/td><td>its lifetime is independent of yours<\/td><\/tr><tr><td><code><span class=\"t-kw\">unowned<\/span> <span class=\"t-kw\">let<\/span> x: <span class=\"t-typ\">T<\/span><\/code><\/td><td>no<\/td><td><strong>traps<\/strong> on read<\/td><td>cheapest non-owning read<\/td><td>it provably cannot outlive the target<\/td><\/tr><tr><td><code><span class=\"t-kw\">unowned<\/span>(unsafe)<\/code><\/td><td>no<\/td><td>undefined behaviour<\/td><td>free<\/td><td>interop, or a measured hot path<\/td><\/tr><tr><td>capture list <code>[<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>]<\/code><\/td><td>no<\/td><td><code><span class=\"t-kw\">nil<\/span><\/code> inside the closure<\/td><td>as <code><span class=\"t-kw\">weak<\/span><\/code><\/td><td>the work is pointless if the object is gone<\/td><\/tr><tr><td>capture list <code>[<span class=\"t-kw\">self<\/span>]<\/code> or plain <code><span class=\"t-kw\">self<\/span>.<\/code><\/td><td>yes<\/td><td>can't happen<\/td><td>as strong<\/td><td>the work must finish regardless<\/td><\/tr><tr><td>non-escaping closure<\/td><td>n/a<\/td><td>n/a<\/td><td>none<\/td><td>it can't outlive the call — nothing to decide<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"the-full-map\">The full map<\/h2><div class=\"scroll\"><table><thead><tr><th>In the library<\/th><th>Real name<\/th><th>What it is<\/th><th>Where it lives<\/th><\/tr><\/thead><tbody><tr><td>A book on a shelf<\/td><td>Object / class instance<\/td><td>a thing with identity, on the heap<\/td><td>the heap<\/td><\/tr><tr><td>The desk you carry to a chair<\/td><td>Stack frame<\/td><td>scratch space, cleared when the call returns<\/td><td>per thread<\/td><\/tr><tr><td>The shelves<\/td><td>Heap<\/td><td>shared storage that outlives a call<\/td><td>the process<\/td><\/tr><tr><td>The tally slip inside the cover<\/td><td>Strong reference count<\/td><td>how many owners it has<\/td><td>the object's header<\/td><\/tr><tr><td>A mark on the slip<\/td><td>Strong reference<\/td><td>an owner — while it exists, the book stays<\/td><td>compile-time inserted<\/td><\/tr><tr><td>Pulping at zero marks<\/td><td><code><span class=\"t-kw\">deinit<\/span><\/code> + deallocation<\/td><td>destruction, deterministic, immediate<\/td><td>runtime<\/td><\/tr><tr><td>A note at the front desk<\/td><td><code><span class=\"t-kw\">weak<\/span><\/code> reference<\/td><td>zeroed when the object dies<\/td><td>the side table<\/td><\/tr><tr><td>The desk's card index for one book<\/td><td>Side table<\/td><td>created by the first <code><span class=\"t-kw\">weak<\/span><\/code> reference, never removed<\/td><td>the heap<\/td><\/tr><tr><td>A note in your pocket you swear is valid<\/td><td><code><span class=\"t-kw\">unowned<\/span><\/code> reference<\/td><td>no zeroing; a read after death halts<\/td><td>the object<\/td><\/tr><tr><td>A photocopy you take away<\/td><td>Value type<\/td><td>copied on assignment; no count, no identity<\/td><td>wherever its owner lives<\/td><\/tr><tr><td>Sharing one copy until someone writes<\/td><td>Copy-on-write<\/td><td><code>isKnownUniquelyReferenced<\/code> on the buffer<\/td><td>the stdlib, in plain Swift<\/td><\/tr><tr><td>Two books holding each other's only card<\/td><td>Retain cycle<\/td><td>a loop of strong references<\/td><td>your design<\/td><\/tr><tr><td>A note pinned inside the book it mentions<\/td><td>Closure capturing <code><span class=\"t-kw\">self<\/span><\/code>, stored on <code><span class=\"t-kw\">self<\/span><\/code><\/td><td>the same cycle, most common form<\/td><td>the heap<\/td><\/tr><tr><td>Correctly catalogued, unopened since 2019<\/td><td>Abandoned memory<\/td><td>reachable and unwanted<\/td><td>your cache<\/td><\/tr><tr><td>Not in the catalogue, can't be removed<\/td><td>Leaked memory<\/td><td>unreachable and unfreeable<\/td><td>—<\/td><\/tr><tr><td>The returns trolley emptied at closing<\/td><td>Autorelease pool<\/td><td>ObjC objects released later, in a batch<\/td><td>Cocoa interop<\/td><\/tr><tr><td>The city closing the fullest branch<\/td><td>Jetsam<\/td><td>the OS terminating on memory pressure<\/td><td>the OS<\/td><\/tr><tr><td>A special pen two hands can't smudge<\/td><td>Atomic refcount<\/td><td>the count is thread-safe; the pages aren't<\/td><td>the object's header<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"the-four-sentences\">The four sentences<\/h2><p><strong>1. ARC counts owners; it does not trace the graph.<\/strong> The rule is local, which is why destruction is immediate and why a cycle is invisible to it.<\/p><p><strong>2. Lifetime runs to the last use, not to the end of the scope.<\/strong> And observed lifetimes are an emergent property of the optimiser, so code that depends on one works by coincidence.<\/p><p><strong>3. <code><span class=\"t-kw\">weak<\/span><\/code> costs a side table and a runtime call; <code><span class=\"t-kw\">unowned<\/span><\/code> costs a promise.<\/strong> Break the promise and you get a deterministic halt, which is the cheap outcome compared with what the alternative would have handed you.<\/p><p><strong>4. The count is thread-safe; the object is not.<\/strong> Reference counting decides lifetime, isolation decides access, and neither does the other's job.<\/p><h2 id=\"answer-these-out-loud\">Answer these out loud<\/h2><p>File closed, 90 seconds each, in trade-off shape — the decision, the alternative rejected, the boundary condition.<\/p><ol start=\"1\"><li>Why isn't ARC a garbage collector, and what does Swift get in exchange for that choice?<\/li><li>What exactly does a retain do, and where does the number live?<\/li><li>Why can an object be deallocated before the end of the function that created it?<\/li><li>What does forming the first <code><span class=\"t-kw\">weak<\/span><\/code> reference to an object cost, permanently?<\/li><li><code><span class=\"t-kw\">weak<\/span><\/code> or <code><span class=\"t-kw\">unowned<\/span><\/code> — give a rule that decides it, and an example where the other one would be a bug.<\/li><li>Why is reaching for <code>[<span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span>]<\/code> everywhere a bad default? What does it hide, and what new failure does it introduce?<\/li><li>Describe a retain cycle you have actually created. What was the loop, and how did you find it?<\/li><li>A view controller isn't deallocating. Walk through what you do, in order.<\/li><li>How does <code><span class=\"t-typ\">Array<\/span><\/code> stay a value type without copying a million elements on assignment?<\/li><li>What does <code>isKnownUniquelyReferenced<\/code> check, and what would make it lie to you?<\/li><li>On which thread does <code><span class=\"t-kw\">deinit<\/span><\/code> run, and why is that a problem worth a language feature?<\/li><li>A screen's memory climbs every time the user opens and closes it, and Instruments' Leaks finds nothing. What's your next move?<\/li><\/ol>", "text": " the ladder not \"manage memory\". a sequence, and you stop as soon as the problem is solved. step 0 — use a value type. no identity, no sharing, no count, no cycle, no deini  safe; the pages aren't the object's header the four sentences 1. arc counts owners; it does not trace the graph. the rule is local, which is why destruction is immediate and why a cycle is invisible to it. 2. lifetime runs to the last use, not to the end of the scope. and observed lifetimes are an emergent property of the optimiser, so code that depends on one works by coincidence. 3. weak costs a side table and a runtime call; unowned costs a promise. break the promise and you get a deterministic halt, which is the cheap outcome compared with what the alternative would have handed you. 4. the count is thread safe; the object is not. reference counting decides lifetime, isolation decides access, and neither does the other's job. answer these out loud file closed, 90 seconds each, in trade off shape — the decision, the alternative rejected, the boundary condition. 1. why isn't arc a garbage collector, and what does swift get in exchange for that choice? 2. what exactly does a retain do, and where does the number live? 3. why can an object be deallocated before the end of the function that created it? 4. what does forming the first weak reference to an object cost, permanently? 5. weak or unowned — give a rule that decides it, and an example where the other one would be a bug. 6. why is reaching for [weak self] everywhere a bad default? what does it hide, and what new failure does it introduce? 7. describe a retain cycle you have actually created. what was the loop, and how did you find it? 8. a view controller isn't deallocating. walk through what you do, in order. 9. how does array stay a value type without copying a million elements on assignment? 10. what does isknownuniquelyreferenced check, and what would make it lie to you? 11. on which thread does deinit run, and why is that a problem worth a language feature? 12. a screen's memory climbs every time the user opens and closes it, and instruments' leaks finds nothing. what's your next move? ", "outline": [{"a": "the-ladder", "t": "The ladder"}, {"a": "the-reference-cheat-sheet", "t": "The reference cheat sheet"}, {"a": "the-full-map", "t": "The full map"}, {"a": "the-four-sentences", "t": "The four sentences"}, {"a": "answer-these-out-loud", "t": "Answer these out loud"}]}], "minutes": 77, "sources": [{"ref": "", "label": "Apple · Automatic Reference Counting (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/"}, {"ref": "WWDC21", "label": "ARC in Swift: Basics and beyond", "url": "https://developer.apple.com/videos/play/wwdc2021/10216/"}, {"ref": "", "label": "Apple · Transitioning to ARC Release Notes", "url": "https://developer.apple.com/library/archive/releasenotes/ObjectiveC/RN-TransitioningToARC/Introduction/Introduction.html"}, {"ref": "", "label": "Apple · Advanced Memory Management Programming Guide", "url": "https://developer.apple.com/library/archive/documentation/Cocoa/Conceptual/MemoryMgmt/Articles/MemoryMgmt.html"}, {"ref": "", "label": "Swift · RefCount.h (runtime source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/SwiftShims/swift/shims/RefCount.h"}, {"ref": "WWDC24", "label": "Analyze heap memory", "url": "https://developer.apple.com/videos/play/wwdc2024/10173/"}, {"ref": "", "label": "Apple · Closures (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/closures/"}, {"ref": "SE-0345", "label": "if let shorthand for shadowing an existing optional variable", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0345-if-let-shorthand.md"}, {"ref": "", "label": "Swift · isKnownUniquelyReferenced (stdlib source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/core/ManagedBuffer.swift"}, {"ref": "", "label": "Apple · Structures and Classes (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/classesandstructures/"}, {"ref": "SE-0371", "label": "Isolated synchronous deinit", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0371-isolated-synchronous-deinit.md"}, {"ref": "SE-0302", "label": "Sendable and @Sendable closures", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0302-concurrent-value-and-concurrent-closures.md"}, {"ref": "WWDC18", "label": "iOS Memory Deep Dive", "url": "https://developer.apple.com/videos/play/wwdc2018/416/"}, {"ref": "", "label": "Apple · Gathering information about memory use", "url": "https://developer.apple.com/documentation/xcode/gathering-information-about-memory-use"}]}, {"title": "DSA for Interviews", "slug": "dsa", "tagline": "56 problems, 13 patterns, mostly medium", "summary": "The problems that come up again and again in coding rounds, grouped by the pattern that solves them. Each one gives the recognition cue, the approach in plain words, and a Swift solution kept hidden until you have tried. Built for the LeetCode-medium bar of German scale-ups, with the problems Zalando, Sixt and Delivery Hero are documented asking marked.", "status": "in progress", "accentIndex": 2, "chapters": [{"slug": "the-method", "title": "The method", "summary": "How a session runs, how to talk while solving, and the cue that names each of the 13 patterns.", "minutes": "6", "sources": [{"ref": "", "label": "Zalando · Technical interview for software engineers", "url": "https://jobs.zalando.com/en/blog/technical-interview-for-software-engineers"}, {"ref": "", "label": "Grind 75", "url": "https://www.techinterviewhandbook.org/grind75"}, {"ref": "", "label": "Blind 75 (original list)", "url": "https://www.teamblind.com/post/New-Year-Gift---Curated-List-of-Top-75-LeetCode-Questions-to-Save-Your-Time-OaM1orEU"}], "html": "<p>Nothing in a coding round rewards having seen the problem before as much as it rewards recognising which <em>kind<\/em> of problem it is. That is what this topic trains: the cue in the wording that names the pattern, then the pattern, then the code.<\/p><h2 id=\"where-these-56-come-from\">Where these 56 come from<\/h2><p>No public dataset says which problems are asked most. LeetCode's company tags are paywalled and noisy, and the famous lists are curated rather than measured. So the set is built from two kinds of evidence that do exist: problems the main curated lists agree on (Blind 75, Grind 75), and problems German loops have been documented asking by name.<\/p><p>Each chapter carries its reason in the tag line:<\/p><ul><li><strong>G<\/strong> — in the Grind 75 / Blind 75 core<\/li><li><strong>Z<\/strong> — asked by name in a documented German loop (Zalando, Sixt, Delivery Hero)<\/li><\/ul><p>The mix is 44 medium, 10 easy warm-ups, and 2 hard problems marked optional. That matches the bar at German scale-ups, which is LeetCode medium. Anything beyond it is a FAANG-only concern.<\/p><h2 id=\"how-a-session-runs\">How a session runs<\/h2><p>Two problems, about 25 minutes each.<\/p><ol start=\"1\"><li><strong>Open Xcode, not this page.<\/strong> Write the problem as a <code><span class=\"t-atr\">@Test<\/span><\/code> in your test target's <code><span class=\"t-typ\">DSA<\/span>/<\/code> group. The statement and examples are in the chapter; the solution is collapsed underneath.<\/li><li><strong>Solve it with the clock running, 20 minutes, out loud.<\/strong><\/li><li><strong>Open the approach and compare, 5 minutes.<\/strong> Not just \"did I get it\" — did you name the pattern from the same cue?<\/li><li><strong>Stuck at 20 minutes: stop.<\/strong> Read the approach, close it, and re-solve it cold at the start of the next DSA session. Grinding past 20 minutes teaches endurance, not recognition.<\/li><\/ol><h2 id=\"how-to-talk-while-solving\">How to talk while solving<\/h2><p>Zalando publicly recommends a structure for its coding round, and it works everywhere. It's called <strong>REACTO<\/strong>:<\/p><div class=\"scroll\"><table><thead><tr><th>Step<\/th><th>What you say<\/th><\/tr><\/thead><tbody><tr><td><strong>R<\/strong>epeat<\/td><td>The problem back in your own words. Catches misreads before they cost ten minutes.<\/td><\/tr><tr><td><strong>E<\/strong>xamples<\/td><td>One normal case and the edge cases: empty, one element, duplicates, negatives.<\/td><\/tr><tr><td><strong>A<\/strong>pproach<\/td><td>The pattern <em>and its complexity<\/em> — before you type anything.<\/td><\/tr><tr><td><strong>C<\/strong>ode<\/td><td>Narrate decisions, not keystrokes.<\/td><\/tr><tr><td><strong>T<\/strong>est<\/td><td>Walk one example through your code by hand.<\/td><\/tr><tr><td><strong>O<\/strong>ptimise<\/td><td>What you'd change with more time, and what it costs.<\/td><\/tr><\/tbody><\/table><\/div><p>The step candidates skip is <strong>A<\/strong>. Saying <em>\"this is a sliding window, O(n) time, O(k) space\"<\/em> before typing is worth more than a clean solution written in silence.Give yourself ninety seconds to name it. Past that, you are not recognising the pattern, you are deriving it — which is a different skill and a slower one.<\/p><h2 id=\"the-cue-that-names-each-pattern\">The cue that names each pattern<\/h2><div class=\"scroll\"><table><thead><tr><th>Pattern<\/th><th>The cue in the wording<\/th><th>Typical cost<\/th><\/tr><\/thead><tbody><tr><td>Hash map / set<\/td><td>\"find a pair\", \"seen before\", \"group by\", \"count occurrences\"<\/td><td>O(n) time, O(n) space<\/td><\/tr><tr><td>Two pointers<\/td><td>a <strong>sorted<\/strong> array, pairs or triplets, \"in place\", palindromes<\/td><td>O(n), O(1)<\/td><\/tr><tr><td>Sliding window<\/td><td>\"contiguous subarray / substring\", \"longest / shortest with a condition\"<\/td><td>O(n)<\/td><\/tr><tr><td>Prefix sums<\/td><td>\"sum of a range\", \"subarray sums to k\", repeated range queries<\/td><td>O(n) build, O(1) query<\/td><\/tr><tr><td>Stack<\/td><td>matching pairs, nesting, \"next greater\", evaluate an expression<\/td><td>O(n)<\/td><\/tr><tr><td>Binary search<\/td><td>sorted input, or \"minimum value that makes X possible\"<\/td><td>O(log n)<\/td><\/tr><tr><td>Linked list<\/td><td>pointer rewiring, cycles, \"nth from the end\"<\/td><td>O(n), O(1)<\/td><\/tr><tr><td>Trees<\/td><td>hierarchy, \"depth\", \"level\", \"ancestor\", BST ordering<\/td><td>O(n), O(h) stack<\/td><\/tr><tr><td>Heap<\/td><td>\"k largest / smallest / closest\", \"top k\", merge k sorted<\/td><td>O(n log k)<\/td><\/tr><tr><td>Graphs<\/td><td>grids, \"connected\", \"islands\", spreading, dependencies<\/td><td>O(V + E)<\/td><\/tr><tr><td>Intervals<\/td><td>start/end pairs, overlaps, \"meeting rooms\"<\/td><td>O(n log n) for the sort<\/td><\/tr><tr><td>Backtracking<\/td><td>\"all combinations / permutations / subsets\"<\/td><td>exponential, by nature<\/td><\/tr><tr><td>DP (light)<\/td><td>\"number of ways\", \"minimum cost\", choices that overlap<\/td><td>O(n) or O(n·k)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"swift-traps-worth-saying-out-loud\">Swift traps worth saying out loud<\/h2><p>These are the ones an interviewer notices:<\/p><ul><li><code><span class=\"t-typ\">String<\/span><\/code> isn't randomly indexable. Convert with <code><span class=\"t-typ\">Array<\/span>(s)<\/code> first, and say that it costs O(n).<\/li><li><code><span class=\"t-typ\">Array<\/span>.removeFirst()<\/code> is O(n). A BFS queue needs an index cursor, not a shrinking array.<\/li><li>There's no <code><span class=\"t-typ\">Deque<\/span><\/code> or <code><span class=\"t-typ\">Heap<\/span><\/code> in the standard library, and <code>swift-collections<\/code> won't exist in a shared editor.<\/li><li>A doubly-linked list needs a <code><span class=\"t-kw\">class<\/span><\/code> with <code><span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">var<\/span> prev<\/code>, or it leaks.<\/li><li><code>dict[key, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span><\/code> is the idiomatic counter.<\/li><li><code><span class=\"t-typ\">Int<\/span><\/code> traps on overflow where C wraps.<\/li><li>A tuple isn't <code><span class=\"t-typ\">Hashable<\/span><\/code>. Use a small <code><span class=\"t-kw\">struct<\/span><\/code> or <code>[<span class=\"t-typ\">Int<\/span>]<\/code> as a set key.<\/li><\/ul>", "text": "nothing in a coding round rewards having seen the problem before as much as it rewards recognising which kind of problem it is. that is what this topic trains: the cue in the wording that names the pattern, then the pattern, then the code. where these 56 come from no public dataset says which problems are asked most. leetcode's company tags are paywalled and noisy, and the famous lists are curated rather than measured. so the set is built from two kinds of evidence that do exist: problems the main curated lists agree on (blind 75, grind 75), and problems german loops have been documented asking by name. each chapter carries its reason in the tag line: g — in the grind 75 / blind 75 core z — asked by name in a documented german loop (zalando, sixt, delivery hero) the mix is 44 medium, 10 easy warm ups, and 2 hard problems marked optional. that matches the bar at german scale ups, which is leetcode medium. anything beyond it is a faang only concern. how a session runs two problems, about 25 minutes each. 1. open xcode, not this page. write the problem as a @test in your test target's dsa/ group. the statement and examples are in the chapter; the solution is collapsed underneath. 2. solve it with the clock running, 20 minutes, out loud. 3. open the approach and compare, 5 minutes. not just \"did i get it\" — did you name the pattern from the same cue? 4. stuck at 20 minutes: stop. read the approach, close it, and re solve it cold at the start of the next dsa session. grinding past 20 minutes teaches endurance, not recognition. how to talk while solving zalando publicly recommends a structure for its coding round, and it works everywhere. it's called reacto : step what you say r epeat the problem back in your own words. catches misreads before they cost ten minutes. e xamples one normal case and the edge cases: empty, one element, duplicates, negatives. a pproach the pattern and its complexity — before you type anything. c ode narrate decisions, not keystrokes. t est walk one example through your code by hand. o ptimise what you'd change with more time, and what it costs. the step candidates skip is a . saying \"this is a sliding window, o(n) time, o(k) space\" before typing is worth more than a clean solution written in silence.give yourself ninety seconds to name it. past that, you are not recognising the pattern, you are deriving it — which is a different skill and a slower one. the cue that names each pattern pattern the cue in the wording typical cost hash map / set \"find a pair\", \"seen before\", \"group by\", \"count occurrences\" o(n) time, o(n) space two pointers a sorted array, pairs or triplets, \"in place\", palindromes o(n), o(1) sliding window \"contiguous subarray / substring\", \"longest / shortest with a condition\" o(n) prefix sums \"sum of a range\", \"subarray sums to k\", repeated range queries o(n) build, o(1) query stack matching pairs, nesting, \"next greater\", evaluate an expression o(n) binary search sorted input, or \"minimum value that makes x possible\" o(log n) linked list pointer rewiring, cycles, \"nth from the end\" o(n), o(1) trees hierarchy, \"depth\", \"level\", \"ancestor\", bst ordering o(n), o(h) stack heap \"k largest / smallest / closest\", \"top k\", merge k sorted o(n log k) graphs grids, \"connected\", \"islands\", spreading, dependencies o(v + e) intervals start/end pairs, overlaps, \"meeting rooms\" o(n log n) for the sort backtracking \"all combinations / permutations / subsets\" exponential, by nature dp (light) \"number of ways\", \"minimum cost\", choices that overlap o(n) or o(n·k) swift traps worth saying out loud these are the ones an interviewer notices: string isn't randomly indexable. convert with array(s) first, and say that it costs o(n). array.removefirst() is o(n). a bfs queue needs an index cursor, not a shrinking array. there's no deque or heap in the standard library, and swift collections won't exist in a shared editor. a doubly linked list needs a class with weak var prev , or it leaks. dict[key, default: 0] += 1 is the idiomatic counter. int traps on overflow where c wraps. a tuple isn't hashable . use a small struct or [int] as a set key. ", "outline": [{"a": "where-these-56-come-from", "t": "Where these 56 come from"}, {"a": "how-a-session-runs", "t": "How a session runs"}, {"a": "how-to-talk-while-solving", "t": "How to talk while solving"}, {"a": "the-cue-that-names-each-pattern", "t": "The cue that names each pattern"}, {"a": "swift-traps-worth-saying-out-loud", "t": "Swift traps worth saying out loud"}]}, {"slug": "two-sum", "title": "1 · Two Sum", "summary": "Given a list of whole numbers and a target, return the positions of the two numbers that add up to it.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 1 · Two Sum", "url": "https://leetcode.com/problems/two-sum/"}, {"ref": "", "label": "Swift standard library · Dictionary", "url": "https://developer.apple.com/documentation/swift/dictionary"}], "html": "<p><em>Easy · G — the warm-up almost every loop has seen<\/em><\/p><p>You get an array of integers and a target number. Exactly two entries in the array add up to the target. Return their two positions, smaller position first. You can't use the same entry twice, but two different entries may hold the same value.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>Target<\/th><th>Answer<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">3<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">11<\/span>, <span class=\"t-num\">4<\/span>]<\/code><\/td><td><code><span class=\"t-num\">15<\/span><\/code><\/td><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/td><td>11 + 4<\/td><\/tr><tr><td><code>[<span class=\"t-num\">5<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><td><code><span class=\"t-num\">10<\/span><\/code><\/td><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/td><td>two different fives<\/td><\/tr><tr><td><code>[-<span class=\"t-num\">4<\/span>, <span class=\"t-num\">6<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">10<\/span>]<\/code><\/td><td><code><span class=\"t-num\">6<\/span><\/code><\/td><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/td><td>−4 + 10; the 6 on its own doesn't count<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 2 and 10,000 numbers; values and target fit comfortably in <code><span class=\"t-typ\">Int<\/span><\/code> (roughly ±10⁹); exactly one valid pair always exists. The brute-force check of every pair is O(n²) — the interviewer is waiting for you to beat it.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Hash map.<\/strong> The cue is <em>\"find a pair\"<\/em> combined with <em>\"return the positions\"<\/em>. For each number you already know exactly what its partner must be — <code>target − number<\/code> — so the question becomes \"have I seen that value before, and where?\" That is a lookup, and \"seen before, and where\" is a dictionary from value to position.<\/p><p>Why not two pointers? Two pointers needs a sorted array, and sorting throws away the original positions you're asked to return. You could sort pairs of (value, position), but that's O(n log n) to reach what a dictionary gives you in O(n).<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Walk the array once, left to right. For each number, work out the partner it needs (target minus the number). Ask a dictionary whether that partner has already appeared; if it has, the dictionary tells you where, and you're done. If not, record the current number and its position in the dictionary and move on.<\/p><p>The order of those two steps matters: <strong>look first, then record.<\/strong> Recording first would let a number pair with itself when it's exactly half the target.<\/p><p>Time O(n): one pass, and each dictionary lookup and insert is O(1) on average. Space O(n): in the worst case the pair is the last two numbers and the dictionary holds everything before them.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> twoSum(_ numbers: [<span class=\"t-typ\">Int<\/span>], target: <span class=\"t-typ\">Int<\/span>) -&gt; [<span class=\"t-typ\">Int<\/span>] {\n    <span class=\"t-kw\">var<\/span> indexByValue: [<span class=\"t-typ\">Int<\/span>: <span class=\"t-typ\">Int<\/span>] = [:]\n\n    <span class=\"t-kw\">for<\/span> (index, number) <span class=\"t-kw\">in<\/span> zip(numbers.indices, numbers) {\n        <span class=\"t-kw\">if<\/span> <span class=\"t-kw\">let<\/span> partnerIndex = indexByValue[target - number] {\n            <span class=\"t-kw\">return<\/span> [partnerIndex, index]\n        }\n        indexByValue[number] = index\n    }\n\n    <span class=\"t-kw\">return<\/span> []\n}<\/code><\/pre><\/div><p>The partner is always found at the <em>second<\/em> number of the pair, so <code>partnerIndex<\/code> is always the smaller position — no sorting of the answer needed. The final <code><span class=\"t-kw\">return<\/span> []<\/code> is unreachable under the stated constraints; in a round, say so rather than reaching for <code>fatalError<\/code>.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3: the three examples above plus five more — <code>[<span class=\"t-num\">3<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">1<\/span>]<\/code> → 6 (the self-pair trap), <code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">0<\/span>]<\/code> → 0 (duplicate zeros), <code>[<span class=\"t-num\">7<\/span>, -<span class=\"t-num\">7<\/span>, <span class=\"t-num\">2<\/span>]<\/code> → 0 (negatives), a two-element input, and a pair whose sum is <code><span class=\"t-typ\">Int<\/span>.max<\/code>.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">3<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">11<\/span>, <span class=\"t-num\">4<\/span>]<\/code>, target 15<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Step<\/th><th>Number<\/th><th>Needs<\/th><th>Dictionary before<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>3<\/td><td>12<\/td><td><code>{}<\/code><\/td><td>not there → record <code><span class=\"t-num\">3<\/span>: <span class=\"t-num\">0<\/span><\/code><\/td><\/tr><tr><td>1<\/td><td>8<\/td><td>7<\/td><td><code>{<span class=\"t-num\">3<\/span>: <span class=\"t-num\">0<\/span>}<\/code><\/td><td>not there → record <code><span class=\"t-num\">8<\/span>: <span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>2<\/td><td>11<\/td><td>4<\/td><td><code>{<span class=\"t-num\">3<\/span>: <span class=\"t-num\">0<\/span>, <span class=\"t-num\">8<\/span>: <span class=\"t-num\">1<\/span>}<\/code><\/td><td>not there → record <code><span class=\"t-num\">11<\/span>: <span class=\"t-num\">2<\/span><\/code><\/td><\/tr><tr><td>3<\/td><td>4<\/td><td>11<\/td><td><code>{<span class=\"t-num\">3<\/span>: <span class=\"t-num\">0<\/span>, <span class=\"t-num\">8<\/span>: <span class=\"t-num\">1<\/span>, <span class=\"t-num\">11<\/span>: <span class=\"t-num\">2<\/span>}<\/code><\/td><td>found at 2 → return <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong><code>[<span class=\"t-num\">3<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">1<\/span>]<\/code>, target 6 — the edge case<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Step<\/th><th>Number<\/th><th>Needs<\/th><th>Dictionary before<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>3<\/td><td>3<\/td><td><code>{}<\/code><\/td><td>not there (3 isn't recorded yet) → record <code><span class=\"t-num\">3<\/span>: <span class=\"t-num\">0<\/span><\/code><\/td><\/tr><tr><td>1<\/td><td>5<\/td><td>1<\/td><td><code>{<span class=\"t-num\">3<\/span>: <span class=\"t-num\">0<\/span>}<\/code><\/td><td>not there → record <code><span class=\"t-num\">5<\/span>: <span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>5<\/td><td><code>{<span class=\"t-num\">3<\/span>: <span class=\"t-num\">0<\/span>, <span class=\"t-num\">5<\/span>: <span class=\"t-num\">1<\/span>}<\/code><\/td><td>found at 1 → return <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Had step 0 recorded 3 before looking, it would have found itself and returned <code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code>.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong><code>enumerated()<\/code> hands you offsets, not indices.<\/strong> On an <code><span class=\"t-typ\">Array<\/span><\/code> they coincide, so <code><span class=\"t-kw\">for<\/span> (i, n) <span class=\"t-kw\">in<\/span> numbers.enumerated()<\/code> works here. Change the parameter to <code><span class=\"t-typ\">ArraySlice<\/span>&lt;<span class=\"t-typ\">Int<\/span>&gt;<\/code> or any <code><span class=\"t-typ\">Collection<\/span><\/code> — which an interviewer may do as a follow-up (\"now take a slice of a bigger buffer\") — and offset 0 is no longer <code>startIndex<\/code>; subscripting with it reads the wrong element or traps. <code>zip(numbers.indices, numbers)<\/code> gives real indices on every collection, which is why the solution uses it. Say it out loud: it is a one-sentence senior signal.<\/p><p>The second trap is quieter: <code>numbers.firstIndex(of: target - number)<\/code> inside the loop reads like a lookup but is a linear scan, quietly putting you back at O(n²).<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"What if the array is sorted?\"<\/strong> → Two pointers from both ends: sum too small, move left in; too big, move right in. O(n) time, O(1) space — the dictionary disappears.<\/li><li><strong>\"Return all pairs, not just one, without duplicates.\"<\/strong> → Sort, then two pointers, skipping equal neighbours after each hit. O(n log n). This is the doorway to 3Sum (problem 8).<\/li><li><strong>\"What if the numbers don't fit in memory?\"<\/strong> → Stream them in chunks and keep only the dictionary of values seen; if that doesn't fit either, partition by value range (bucket to disk) so partners land in the same bucket.<\/li><\/ul><\/div><\/details>", "text": " easy · g — the warm up almost every loop has seen you get an array of integers and a target number. exactly two entries in the array add up to the target. return their two positions, smaller position first. you can't use the same entry twice, but two different entries may hold the same value. numbers target answer why [3, 8, 11, 4] 15 [2, 3] 11 + 4 [5, 5] 10 [0, 1] two different fives [ 4, 6, 1, 10] 6 [0, 3] −4 + 10; the 6 on its own doesn't count constraints that matter: between 2 and 10,000 numbers; values and target fit comfortably in int (roughly ±10⁹); exactly one valid pair always exists. the brute force check of every pair is o(n²) — the interviewer is waiting for you to beat it. ::: pattern and cue hash map. the cue is \"find a pair\" combined with \"return the positions\" . for each number you already know exactly what its partner must be — target − number — so the question becomes \"have i seen that value before, and where?\" that is a lookup, and \"seen before, and where\" is a dictionary from value to position. why not two pointers? two pointers needs a sorted array, and sorting throws away the original positions you're asked to return. you could sort pairs of (value, position), but that's o(n log n) to reach what a dictionary gives you in o(n). ::: ::: approach walk the array once, left to right. for each number, work out the partner it needs (target minus the number). ask a dictionary whether that partner has already appeared; if it has, the dictionary tells you where, and you're done. if not, record the current number and its position in the dictionary and move on. the order of those two steps matters: look first, then record. recording first would let a number pair with itself when it's exactly half the target. time o(n): one pass, and each dictionary lookup and insert is o(1) on average. space o(n): in the worst case the pair is the last two numbers and the dictionary holds everything before them. ::: ::: swift solution swift func twosum(_ numbers: [int], target: int) [int] { var indexbyvalue: [int: int] = [:] for (index, number) in zip(numbers.indices, numbers) { if let partnerindex = indexbyvalue[target number] { return [partnerindex, index] } indexbyvalue[number] = index } return [] } the partner is always found at the second number of the pair, so partnerindex is always the smaller position — no sorting of the answer needed. the final return [] is unreachable under the stated constraints; in a round, say so rather than reaching for fatalerror . verified with swift test on swift 6.2.3: the three examples above plus five more — [3, 5, 1] → 6 (the self pair trap), [0, 3, 0] → 0 (duplicate zeros), [7, 7, 2] → 0 (negatives), a two element input, and a pair whose sum is int.max . ::: ::: walk it through [3, 8, 11, 4] , target 15 step number needs dictionary before result 0 3 12 {} not there → record 3: 0 1 8 7 {3: 0} not there → record 8: 1 2 11 4 {3: 0, 8: 1} not there → record 11: 2 3 4 11 {3: 0, 8: 1, 11: 2} found at 2 → return [2, 3] [3, 5, 1] , target 6 — the edge case step number needs dictionary before result 0 3 3 {} not there (3 isn't recorded yet) → record 3: 0 1 5 1 {3: 0} not there → record 5: 1 2 1 5 {3: 0, 5: 1} found at 1 → return [1, 2] had step 0 recorded 3 before looking, it would have found itself and returned [0, 0] . ::: ::: the swift trap enumerated() hands you offsets, not indices. on an array they coincide, so for (i, n) in numbers.enumerated() works here. change the parameter to arrayslice<int or any collection — which an interviewer may do as a follow up (\"now take a slice of a bigger buffer\") — and offset 0 is no longer startindex ; subscripting with it reads the wrong element or traps. zip(numbers.indices, numbers) gives real indices on every collection, which is why the solution uses it. say it out loud: it is a one sentence senior signal. the second trap is quieter: numbers.firstindex(of: target number) inside the loop reads like a lookup but is a linear scan, quietly putting you back at o(n²). ::: ::: what they ask next \"what if the array is sorted?\" → two pointers from both ends: sum too small, move left in; too big, move right in. o(n) time, o(1) space — the dictionary disappears. \"return all pairs, not just one, without duplicates.\" → sort, then two pointers, skipping equal neighbours after each hit. o(n log n). this is the doorway to 3sum (problem 8). \"what if the numbers don't fit in memory?\" → stream them in chunks and keep only the dictionary of values seen; if that doesn't fit either, partition by value range (bucket to disk) so partners land in the same bucket. ::: ", "outline": []}, {"slug": "group-anagrams", "title": "2 · Group Anagrams", "summary": "Given a list of words, gather together the ones that are made of exactly the same letters.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 49 · Group Anagrams", "url": "https://leetcode.com/problems/group-anagrams/"}, {"ref": "", "label": "Swift standard library · Dictionary.init(grouping:by:)", "url": "https://developer.apple.com/documentation/swift/dictionary/init(grouping:by:)"}, {"ref": "SE-0206", "label": "Hashable Enhancements (per-process hash seeding)", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0206-hashable-enhancements.md"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get a list of words. Two words belong together if one is a rearrangement of the other: same letters, same number of each, any order. Return the words sorted into those groups. The order of the groups, and the order of words inside a group, don't matter.<\/p><div class=\"scroll\"><table><thead><tr><th>Words<\/th><th>Groups<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-str\">&quot;stone&quot;<\/span>, <span class=\"t-str\">&quot;notes&quot;<\/span>, <span class=\"t-str\">&quot;lemon&quot;<\/span>, <span class=\"t-str\">&quot;tones&quot;<\/span>, <span class=\"t-str\">&quot;melon&quot;<\/span>, <span class=\"t-str\">&quot;apple&quot;<\/span>]<\/code><\/td><td><code>[[<span class=\"t-str\">&quot;notes&quot;<\/span>, <span class=\"t-str\">&quot;stone&quot;<\/span>, <span class=\"t-str\">&quot;tones&quot;<\/span>], [<span class=\"t-str\">&quot;lemon&quot;<\/span>, <span class=\"t-str\">&quot;melon&quot;<\/span>], [<span class=\"t-str\">&quot;apple&quot;<\/span>]]<\/code><\/td><\/tr><tr><td><code>[<span class=\"t-str\">&quot;&quot;<\/span>]<\/code><\/td><td><code>[[<span class=\"t-str\">&quot;&quot;<\/span>]]<\/code> — the empty word is a group of one<\/td><\/tr><tr><td><code>[<span class=\"t-str\">&quot;x&quot;<\/span>, <span class=\"t-str\">&quot;y&quot;<\/span>, <span class=\"t-str\">&quot;x&quot;<\/span>]<\/code><\/td><td><code>[[<span class=\"t-str\">&quot;x&quot;<\/span>, <span class=\"t-str\">&quot;x&quot;<\/span>], [<span class=\"t-str\">&quot;y&quot;<\/span>]]<\/code> — repeats stay, in the same group<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 10,000 words, each up to 100 characters, lowercase English letters only. Because order is free, the Xcode test sorts the groups and the words inside them before comparing — your answer can come back in any order.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Hash map, used for grouping.<\/strong> The cue is <em>\"gather together the ones that…\"<\/em> — that is \"group by\", and \"group by\" is a dictionary from a key to a list. The whole problem is choosing the key: something every anagram of a word shares and no non-anagram does.<\/p><p>Two keys work. The word's letters sorted (<code><span class=\"t-str\">&quot;stone&quot;<\/span><\/code> → <code><span class=\"t-str\">&quot;enost&quot;<\/span><\/code>), or a count of each letter (<code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, …]<\/code>, 26 slots). Both are identical across anagrams and differ otherwise.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>For each word, compute its key by sorting its letters. Use the key to file the word into a dictionary: key on one side, the list of words that produced it on the other. When every word is filed, the dictionary's lists are the answer.<\/p><p>Time O(n · k log k), for n words of length up to k: each word is sorted once. The letter-count key makes that O(n · k), which matters only when words are long — with k ≤ 100 the sort is fine, and it is the version you'll write correctly under pressure. Space O(n · k) for the keys and the grouped copies of the words.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> groupAnagrams(_ words: [<span class=\"t-typ\">String<\/span>]) -&gt; [[<span class=\"t-typ\">String<\/span>]] {\n    <span class=\"t-kw\
