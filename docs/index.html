n&#x27;t cache the failure<\/span>\n            <span class=\"t-kw\">throw<\/span> error\n        }\n    }\n\n    <span class=\"t-com\">// MARK: - Privates<\/span>\n\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">enum<\/span> <span class=\"t-typ\">Entry<\/span> {\n        <span class=\"t-kw\">case<\/span> inFlight(<span class=\"t-typ\">Task<\/span>&lt;<span class=\"t-typ\">Data<\/span>, <span class=\"t-typ\">Error<\/span>&gt;)\n        <span class=\"t-kw\">case<\/span> ready(<span class=\"t-typ\">Data<\/span>)\n    }\n\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> cache: [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Entry<\/span>] = [:]\n\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">func<\/span> download(_ url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Data<\/span> { /* … */ }\n}<\/code><\/pre><\/div><p>The load-bearing line is <code>cache[url] = .inFlight(task)<\/code> sitting between creating the task and the first <code><span class=\"t-kw\">await<\/span><\/code>. <strong>Actor code runs uninterrupted between suspension points<\/strong>, so there is no moment in which a second caller can slip past.<\/p><p>Two details worth keeping:<\/p><p><code><span class=\"t-typ\">Task<\/span> { … }<\/code> inside an actor method inherits the actor's isolation, so <code><span class=\"t-kw\">self<\/span>.download(url)<\/code> is a normal isolated call. The explicit <code><span class=\"t-kw\">self<\/span>.<\/code> is required because the closure escapes.<\/p><p><code>cache[url] = <span class=\"t-kw\">nil<\/span><\/code> in the <code><span class=\"t-kw\">catch<\/span><\/code> is what makes a transient failure retryable rather than permanent. Caching the failure is the second-most-common bug in this shape.<\/p><h2 id=\"the-general-rule\">The general rule<\/h2><p><strong>Establish your invariant before you suspend, and re-check anything you assumed after you resume.<\/strong><\/p><p>That covers every case in this family, and the family is large: the same shape recurs as a token-refresh actor, a mutation queue, a generic in-flight registry, and a deduplicating network layer. Learn it once and you have all four.<\/p><p><strong>The sentence to have automatic:<\/strong> <em>\"Actors guarantee no data races, not atomicity across suspension points — every invariant has to be re-validated after every <code><span class=\"t-kw\">await<\/span><\/code>.\"<\/em><\/p>", "text": "this is the chapter that separates people who have used actors from people who have read about them. it gets its own chapter because it is also the most asked senior interview question in the whole area. the guarantee, and its edge an actor guarantees that two pieces of code are never inside it simultaneously . it does not guarantee that one piece of code runs start to finish without anyone else getting in. because when code inside an actor hits an await , it is put down. the actor is released. someone else gets in. when your work resumes, the world has moved. swift actor imageloader { private var cache: [url: data] = [:] func data(for url: url) async throws data { if let cached = cache[url] { return cached } // a: not there let data = try await download(url) // actor released here cache[url] = data return data } } two callers ask for the same image at the same time. both reach a, both find nothing, both download, both store. no data race. no crash. nothing corrupted. two downloads. doubled bandwidth, doubled cost, and every tool you own says the code is safe — because it is safe. it is just wrong. in the office. the clerk has to phone a supplier about your request. rather than making the whole queue wait ten minutes, he sets your slip aside and serves the next person — which is the good design, and is also the catch. while your slip was aside, other requests went through. the record you checked before the call may not say the same thing after it. the single threaded illusion apple's name for what an actor provides is the single threaded illusion : no two functions ever run concurrently on an actor, but they may interleave at suspension points. interleaving is a feature, not a defect. it is what prevents deadlock, what frees the thread instead of blocking it, and what lets high priority work jump the queue. reentrancy is the bill for all three. under the hood. se 0306 chose reentrancy deliberately over the alternative. a non reentrant actor — one that refuses new work while any call is suspended — deadlocks the moment two actors await each other, and reintroduces exactly the priority inversion that chapter 4 showed actors solving. the proposal's framing is that reentrancy trades a hard failure (deadlock) for a soft one (invariants needing re validation), and the soft one is at least fixable in your own code. the fix never a bigger lock. a lock changes nothing here, because the two callers were never simultaneous — the problem is a gap in time, not simultaneous access. the fix is to record that work is already in flight , and to record it before suspending: swift actor imageloader { // mark: publics func data(for url: url) async throws data { switch cache[url] { case .ready(let data): return data case .inflight(let task): return try await task.value // join the existing download case nil: break } let task = task { try await self.download(url) } cache[url] = .inflight(task) // ← before any await. no window exists. do { let data = try await task.value cache[url] = .ready(data) return data } catch { cache[url] = nil // don't cache the failure throw error } } // mark: privates private enum entry { case inflight(task<data, error ) case ready(data) } private var cache: [url: entry] = [:] private func download(_ url: url) async throws data { / … / } } the load bearing line is cache[url] = .inflight(task) sitting between creating the task and the first await . actor code runs uninterrupted between suspension points , so there is no moment in which a second caller can slip past. two details worth keeping: task { … } inside an actor method inherits the actor's isolation, so self.download(url) is a normal isolated call. the explicit self. is required because the closure escapes. cache[url] = nil in the catch is what makes a transient failure retryable rather than permanent. caching the failure is the second most common bug in this shape. the general rule establish your invariant before you suspend, and re check anything you assumed after you resume. that covers every case in this family, and the family is large: the same shape recurs as a token refresh actor, a mutation queue, a generic in flight registry, and a deduplicating network layer. learn it once and you have all four. the sentence to have automatic: \"actors guarantee no data races, not atomicity across suspension points — every invariant has to be re validated after every await .\" ", "outline": [{"a": "the-guarantee-and-its-edge", "t": "The guarantee, and its edge"}, {"a": "the-single-threaded-illusion", "t": "The single-threaded illusion"}, {"a": "the-fix", "t": "The fix"}, {"a": "the-general-rule", "t": "The general rule"}]}, {"slug": "isolation-and-mainactor", "title": "Isolation, and why @MainActor is not the main thread", "summary": "Isolation domains are compile-time; threads are runtime. Four reasons they're not the same.", "minutes": "10", "sources": [{"ref": "SE-0316", "label": "Global Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0316-global-actors.md"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}, {"ref": "", "label": "Donny Wals · Setting default actor isolation in Xcode 26", "url": "https://www.donnywals.com/setting-default-actor-isolation-in-xcode-26/"}, {"ref": "", "label": "Malcolm Hall · @MainActor does not always mean main thread (2023, pre-SE-0461)", "url": "https://www.malcolmhall.com/2023/01/31/mainactor-does-not-always-mean-main-thread/"}], "html": "<h2 id=\"what-an-isolation-domain-is\">What an isolation domain is<\/h2><p>Chapter 4 split an actor into two halves. This chapter is about the compile-time half.<\/p><p>An <strong>isolation domain<\/strong> is a region of state plus the rule about who may touch it. Every piece of code belongs to exactly one of three kinds:<\/p><ul><li><strong>No domain<\/strong> — <code><span class=\"t-kw\">nonisolated<\/span><\/code>. It touches no protected state, so it needs no permission.<\/li><li><strong>An actor instance's domain<\/strong> — the code of <code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">BankAccount<\/span><\/code> belongs to whichever instance it runs on. Each instance is its own domain.<\/li><li><strong>A global actor's domain<\/strong> — <code><span class=\"t-atr\">@MainActor<\/span><\/code> being the one everybody knows. One domain, shared by the whole program.<\/li><\/ul><p>The compiler's entire job here is to check, wherever code touches state, that the code and the state are in the same domain. If not, you need an <code><span class=\"t-kw\">await<\/span><\/code> to get there, and what you carry across must be safe to carry.<\/p><p><strong>This is all checked and then thrown away.<\/strong> Isolation has no runtime representation. It is not a flag the program can inspect while running. It is a rule enforced before the app ever launches.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The rulebook entry saying which records each part of the building may touch. It lives in the rulebook, not in the building. The auditor reads it before opening day, confirms nobody's job description breaks it, and files it away. Nothing about it is visible once the doors open.<\/p><\/blockquote><h2 id=\"what-mainactor-is\">What <code><span class=\"t-atr\">@MainActor<\/span><\/code> is<\/h2><p><code><span class=\"t-atr\">@MainActor<\/span><\/code> is a <strong>global actor<\/strong>: an actor of which there is exactly one for the whole program, referred to by name rather than by holding an instance.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">ProfileViewModel<\/span> {\n    <span class=\"t-kw\">private<\/span>(<span class=\"t-kw\">set<\/span>) <span class=\"t-kw\">var<\/span> state: <span class=\"t-typ\">State<\/span> = .loading   <span class=\"t-com\">// main-actor state<\/span>\n\n    <span class=\"t-kw\">func<\/span> load() <span class=\"t-kw\">async<\/span> {\n        state = .loading\n        <span class=\"t-kw\">let<\/span> profile = <span class=\"t-kw\">try<\/span>? <span class=\"t-kw\">await<\/span> repository.profile()\n        state = profile.map(<span class=\"t-typ\">State<\/span>.loaded) ?? .failed\n    }\n}<\/code><\/pre><\/div><p>Everything visible to the user lives in this domain, and the reason is coherence rather than speed. A screen must never show half the old state and half the new. Funnelling every visible change through one domain, one at a time, makes a half-updated screen impossible.<\/p><p>Its executor is the main thread. <code><span class=\"t-typ\">MainActor<\/span><\/code> is the one actor with a dedicated thread, because the platform requires it: UIKit and AppKit must be driven from that specific thread.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>One counter faces the customers: the display board, the shop window, the queue number on the screen. Exactly one in the whole company, and everything the public can see goes through it. Its clerk is one specific named person who does nothing else — because the display equipment only responds to them.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>In Xcode 26 the build setting <code><span class=\"t-typ\">SWIFT_DEFAULT_ACTOR_ISOLATION<\/span><\/code> can put every unannotated declaration in a module into the main-actor domain, and it is the default for new app projects. It accepts exactly two values, <code><span class=\"t-typ\">MainActor<\/span><\/code> and <code><span class=\"t-kw\">nonisolated<\/span><\/code> — there is no diagnostic-only mode. Apple's framing is that an app should <em>start<\/em> entirely on the main actor and introduce concurrency only where profiling shows it is needed.<\/p><\/blockquote><h2 id=\"why-it-is-not-the-main-thread\">Why it is not \"the main thread\"<\/h2><p>They are so closely related that treating them as one thing usually produces correct code, which is exactly why the confusion survives. Four reasons, in increasing order of how convincing they are.<\/p><h3 id=\"1-they-are-different-categories-of-thing\">1 — they are different categories of thing<\/h3><p>The main thread is a <strong>runtime resource<\/strong>: an actual OS thread, with a stack, that the scheduler puts on a core. It exists while the program runs. You can count it.<\/p><p><code><span class=\"t-atr\">@MainActor<\/span><\/code> is a <strong>compile-time contract<\/strong> about which state a piece of code may touch. It does not exist at runtime at all.<\/p><p>One is a fact about execution. The other is a rule about access. They are connected — the rule is enforced <em>by<\/em> using that thread — but they are not the same statement, any more than \"holding the key\" and \"being authorised\" are the same statement.<\/p><h3 id=\"2-running-on-the-main-thread-does-not-make-you-main-actor-isolated\">2 — running on the main thread does not make you main-actor isolated<\/h3><p>This one you can demonstrate in ten seconds:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-typ\">DispatchQueue<\/span>.main.<span class=\"t-kw\">async<\/span> {\n    <span class=\"t-kw\">self<\/span>.label.text = <span class=\"t-str\">&quot;hello&quot;<\/span>      <span class=\"t-com\">// error: main actor-isolated property<\/span>\n}                                  <span class=\"t-com\">// …on the main thread.<\/span><\/code><\/pre><\/div><p>That closure runs on the main thread. Guaranteed, by name. And the compiler still refuses, because the closure is not <em>declared<\/em> as belonging to the main actor's domain. Being physically on the thread tells the compiler nothing, because the compiler is not reasoning about threads.<\/p><p>The bridge Apple provides is an assertion, not a hop:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-typ\">DispatchQueue<\/span>.main.<span class=\"t-kw\">async<\/span> {\n    <span class=\"t-typ\">MainActor<\/span>.assumeIsolated {\n        <span class=\"t-kw\">self<\/span>.label.text = <span class=\"t-str\">&quot;hello&quot;<\/span>   <span class=\"t-com\">// fine<\/span>\n    }\n}<\/code><\/pre><\/div><p><code>assumeIsolated<\/code> doesn't move anything. It says <em>I know I'm already there, take my word for it and check me at runtime<\/em> — and it traps if you were wrong.<\/p><p><strong>The existence of this API is itself the proof.<\/strong> If being on the main thread and being main-actor isolated were the same thing, there would be nothing to assume.<\/p><p>Contrast <code><span class=\"t-kw\">await<\/span> <span class=\"t-typ\">MainActor<\/span>.run { }<\/code>, which genuinely does move the work. Assert versus hop — two tools for two situations, and knowing which you need is knowing this distinction.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Standing in the front office is not the same as being authorised at the front desk. A courier can be physically inside the front office and still not be allowed to change the display board, and no amount of standing there grants it — authorisation is written in the rulebook, standing there is just where your feet happen to be. <code>assumeIsolated<\/code> is the courier saying <em>check my badge, I really do have authorisation<\/em> — a sentence that would be meaningless if being in the room were the authorisation.<\/p><\/blockquote><h3 id=\"3-the-guarantee-is-about-state-not-location\">3 — the guarantee is about state, not location<\/h3><p>What main-actor isolation buys you is: <em>no other code is touching this state at the same time.<\/em><\/p><p>Running on one specific thread is how that guarantee happens to be delivered <strong>for this one actor<\/strong>. Every other actor gets the identical guarantee with no dedicated thread at all — its work runs on whatever pool thread is free.<\/p><p>So \"runs on the main thread\" is a property of <code><span class=\"t-typ\">MainActor<\/span><\/code>'s particular executor. It is not what isolation <em>means<\/em>. Define <code><span class=\"t-atr\">@MainActor<\/span><\/code> as \"the main thread\" and you have defined it by an implementation detail that no other actor shares.<\/p><h3 id=\"4-the-thread-behaviour-changed-and-the-isolation-didn-t\">4 — the thread behaviour changed and the isolation didn't<\/h3><p>The most convincing one, because it is a natural experiment Swift ran on itself.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">func<\/span> refresh() <span class=\"t-kw\">async<\/span> {\n    <span class=\"t-kw\">let<\/span> items = <span class=\"t-kw\">await<\/span> loader.load()   <span class=\"t-com\">// loader.load() is nonisolated async<\/span>\n    <span class=\"t-kw\">self<\/span>.items = items\n}<\/code><\/pre><\/div><p><strong>Before Swift 6.2:<\/strong> <code>load()<\/code> hopped to the cooperative pool. It ran off the main thread. <strong>From Swift 6.2 (SE-0461):<\/strong> <code>load()<\/code> runs on the caller's actor. It runs <em>on<\/em> the main thread.<\/p><p>Same source. Same isolation before and after — <code>refresh()<\/code> was main-actor isolated in both, <code>load()<\/code> was nonisolated in both. Completely different thread behaviour.<\/p><p>If isolation and thread placement were the same thing, this change could not have happened. They moved independently, because they are independent.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>This is why articles written between 2021 and 2025 saying \"a nonisolated async function runs on a background thread\" are now wrong — including good ones, one of which is cited below precisely because it documents the old behaviour. SE-0338 made that the rule; SE-0461 reversed the default and introduced <code><span class=\"t-atr\">@concurrent<\/span><\/code> as the explicit opt-out. The migration hazard is real: work that used to drift off the main thread by default now stays on it, so Swift 6.2 can move CPU work <em>onto<\/em> main in code nobody edited.<\/p><\/blockquote><h3 id=\"and-the-one-that-makes-it-concrete\">And the one that makes it concrete<\/h3><p>A <code><span class=\"t-atr\">@MainActor<\/span><\/code> function is still main-actor isolated while it is suspended at an <code><span class=\"t-kw\">await<\/span><\/code> — during which the main thread is off running something else entirely. The isolation persists across a gap in which the code is not executing on any thread at all.<\/p><p><strong>A thread cannot be borrowed and given back. A domain can.<\/strong><\/p><p><strong>For a room:<\/strong> <em>\"<code><span class=\"t-atr\">@MainActor<\/span><\/code> is an isolation domain — a compile-time statement about which state you may touch. The main thread is the executor that happens to back it. <code><span class=\"t-typ\">DispatchQueue<\/span>.main.<span class=\"t-kw\">async<\/span><\/code> puts you on the thread without putting you in the domain, which is exactly why <code><span class=\"t-typ\">MainActor<\/span>.assumeIsolated<\/code> exists.\"<\/em><\/p><h2 id=\"nonisolated\"><code><span class=\"t-kw\">nonisolated<\/span><\/code><\/h2><p>Belongs to no domain, because it touches no protected state.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Formatter<\/span> {\n    <span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">func<\/span> format(_ n: <span class=\"t-typ\">Int<\/span>) -&gt; <span class=\"t-typ\">String<\/span> { <span class=\"t-str\">&quot;\\(n)&quot;<\/span> }   <span class=\"t-com\">// callable anywhere, no await<\/span>\n}<\/code><\/pre><\/div><p>Free — no queue, no waiting — and the compiler holds you to the claim. Reach for protected state from nonisolated code and you are stopped at compile time.<\/p><p>Since SE-0461, a <code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">async<\/span><\/code> function runs on <strong>the caller's actor<\/strong>, start to finish, including after every <code><span class=\"t-kw\">await<\/span><\/code>. \"Belongs to no domain\" no longer implies \"runs somewhere else.\"<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Work that touches no records at all: converting a measurement, adding up figures somebody handed you. No counter, no queue, no permission. Anyone, anywhere, any number at once.<\/p><\/blockquote><h2 id=\"concurrent\"><code><span class=\"t-atr\">@concurrent<\/span><\/code><\/h2><p>The explicit instruction to leave the caller's actor and run on the cooperative pool.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@concurrent<\/span>\n<span class=\"t-kw\">func<\/span> decodeImage(_ data: <span class=\"t-typ\">Data<\/span>) <span class=\"t-kw\">async<\/span> -&gt; <span class=\"t-typ\">Image<\/span> { /* … */ }<\/code><\/pre><\/div><p>It always hops — even from a caller that had no actor, where the hop buys nothing. <code><span class=\"t-kw\">async<\/span><\/code>-only, and mutually exclusive with <code><span class=\"t-atr\">@MainActor<\/span><\/code>.<\/p><p><strong>When it is justified:<\/strong> measured CPU work — decoding a large payload, downsampling an image, running inference. Back to chapter 1: this is the <em>real work<\/em> tool, not the <em>waiting<\/em> tool. Networking already suspends, and suspending doesn't occupy the actor, so moving I/O off buys nothing and costs two hops.<\/p><p>Apple's instruction is to profile first: <em>\"If it can't be made faster [without concurrency], you might need to introduce concurrency.\"<\/em> Not speculatively.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Deliberately sending a job to the back office rather than doing it at your own desk. Right for a long stocktake. A straight loss for adding up four numbers, because the two handovers cost more than the sum did.<\/p><\/blockquote>", "text": " what an isolation domain is chapter 4 split an actor into two halves. this chapter is about the compile time half. an isolation domain is a region of state plus the rule about who may touch it. every piece of code belongs to exactly one of three kinds: no domain — nonisolated . it touches no protected state, so it needs no permission. an actor instance's domain — the code of actor bankaccount belongs to whichever instance it runs on. each instance is its own domain. a global actor's domain — @mainactor being the one everybody knows. one domain, shared by the whole program. the compiler's entire job here is to check, wherever code touches state, that the code and the state are in the same domain. if not, you need an await to get there, and what you carry across must be safe to carry. this is all checked and then thrown away. isolation has no runtime representation. it is not a flag the program can inspect while running. it is a rule enforced before the app ever launches. in the office. the rulebook entry saying which records each part of the building may touch. it lives in the rulebook, not in the building. the auditor reads it before opening day, confirms nobody's job description breaks it, and files it away. nothing about it is visible once the doors open. what @mainactor is @mainactor is a global actor : an actor of which there is exactly one for the whole program, referred to by name rather than by holding an instance. swift @mainactor final class profileviewmodel { private(set) var state: state = .loading // main actor state func load() async { state = .loading let profile = try? await repository.profile() state = profile.map(state.loaded) ?? .failed } } everything visible to the user lives in this domain, and the reason is coherence rather than speed. a screen must never show half the old state and half the new. funnelling every visible change through one domain, one at a time, makes a half updated screen impossible. its executor is the main thread. mainactor is the one actor with a dedicated thread, because the platform requires it: uikit and appkit must be driven from that specific thread. in the office. one counter faces the customers: the display board, the shop window, the queue number on the screen. exactly one in the whole company, and everything the public can see goes through it. its clerk is one specific named person who does nothing else — because the display equipment only responds to them. under the hood. in xcode 26 the build setting swift_default_actor_isolation can put every unannotated declaration in a module into the main actor domain, and it is the default for new app projects. it accepts exactly two values, mainactor and nonisolated — there is no diagnostic only mode. apple's framing is that an app should start entirely on the main actor and introduce concurrency only where profiling shows it is needed. why it is not \"the main thread\" they are so closely related that treating them as one thing usually produces correct code, which is exactly why the confusion survives. four reasons, in increasing order of how convincing they are. 1 — they are different categories of thing the main thread is a runtime resource : an actual os thread, with a stack, that the scheduler puts on a core. it exists while the program runs. you can count it. @mainactor is a compile time contract about which state a piece of code may touch. it does not exist at runtime at all. one is a fact about execution. the other is a rule about access. they are connected — the rule is enforced by using that thread — but they are not the same statement, any more than \"holding the key\" and \"being authorised\" are the same statement. 2 — running on the main thread does not make you main actor isolated this one you can demonstrate in ten seconds: swift dispatchqueue.main.async { self.label.text = \"hello\" // error: main actor isolated property } // …on the main thread. that closure runs on the main thread. guaranteed, by name. and the compiler still refuses, because the closure is not declared as belonging to the main actor's domain. being physically on the thread tells the compiler nothing, because the compiler is not reasoning about threads. the bridge apple provides is an assertion, not a hop: swift dispatchqueue.main.async { mainactor.assumeisolated { self.label.text = \"hello\" // fine } } assumeisolated doesn't move anything. it says i know i'm already there, take my word for it and check me at runtime — and it traps if you were wrong. the existence of this api is itself the proof. if being on the main thread and being main actor isolated were the same thing, there would be nothing to assume. contrast await mainactor.run { } , which genuinely does move the work. assert versus hop — two tools for two situations, and knowing which you need is knowing this distinction. in the office. standing in the front office is not the same as being authorised at the front desk. a courier can be physically inside the front office and still not be allowed to change the display board, and no amount of standing there grants it — authorisation is written in the rulebook, standing there is just where your feet happen to be. assumeisolated is the courier saying check my badge, i really do have authorisation — a sentence that would be meaningless if being in the room were the authorisation. 3 — the guarantee is about state, not location what main actor isolation buys you is: no other code is touching this state at the same time. running on one specific thread is how that guarantee happens to be delivered for this one actor . every other actor gets the identical guarantee with no dedicated thread at all — its work runs on whatever pool thread is free. so \"runs on the main thread\" is a property of mainactor 's particular executor. it is not what isolation means . define @mainactor as \"the main thread\" and you have defined it by an implementation detail that no other actor shares. 4 — the thread behaviour changed and the isolation didn't the most convincing one, because it is a natural experiment swift ran on itself. swift @mainactor func refresh() async { let items = await loader.load() // loader.load() is nonisolated async self.items = items } before swift 6.2: load() hopped to the cooperative pool. it ran off the main thread. from swift 6.2 (se 0461): load() runs on the caller's actor. it runs on the main thread. same source. same isolation before and after — refresh() was main actor isolated in both, load() was nonisolated in both. completely different thread behaviour. if isolation and thread placement were the same thing, this change could not have happened. they moved independently, because they are independent. under the hood. this is why articles written between 2021 and 2025 saying \"a nonisolated async function runs on a background thread\" are now wrong — including good ones, one of which is cited below precisely because it documents the old behaviour. se 0338 made that the rule; se 0461 reversed the default and introduced @concurrent as the explicit opt out. the migration hazard is real: work that used to drift off the main thread by default now stays on it, so swift 6.2 can move cpu work onto main in code nobody edited. and the one that makes it concrete a @mainactor function is still main actor isolated while it is suspended at an await — during which the main thread is off running something else entirely. the isolation persists across a gap in which the code is not executing on any thread at all. a thread cannot be borrowed and given back. a domain can. for a room: \" @mainactor is an isolation domain — a compile time statement about which state you may touch. the main thread is the executor that happens to back it. dispatchqueue.main.async puts you on the thread without putting you in the domain, which is exactly why mainactor.assumeisolated exists.\" nonisolated belongs to no domain, because it touches no protected state. swift @mainactor final class formatter { nonisolated func format(_ n: int) string { \"\\(n)\" } // callable anywhere, no await } free — no queue, no waiting — and the compiler holds you to the claim. reach for protected state from nonisolated code and you are stopped at compile time. since se 0461, a nonisolated async function runs on the caller's actor , start to finish, including after every await . \"belongs to no domain\" no longer implies \"runs somewhere else.\" in the office. work that touches no records at all: converting a measurement, adding up figures somebody handed you. no counter, no queue, no permission. anyone, anywhere, any number at once. @concurrent the explicit instruction to leave the caller's actor and run on the cooperative pool. swift @concurrent func decodeimage(_ data: data) async image { / … / } it always hops — even from a caller that had no actor, where the hop buys nothing. async only, and mutually exclusive with @mainactor . when it is justified: measured cpu work — decoding a large payload, downsampling an image, running inference. back to chapter 1: this is the real work tool, not the waiting tool. networking already suspends, and suspending doesn't occupy the actor, so moving i/o off buys nothing and costs two hops. apple's instruction is to profile first: \"if it can't be made faster [without concurrency], you might need to introduce concurrency.\" not speculatively. in the office. deliberately sending a job to the back office rather than doing it at your own desk. right for a long stocktake. a straight loss for adding up four numbers, because the two handovers cost more than the sum did. ", "outline": [{"a": "what-an-isolation-domain-is", "t": "What an isolation domain is"}, {"a": "what-mainactor-is", "t": "What @MainActor is"}, {"a": "why-it-is-not-the-main-thread", "t": "Why it is not \"the main thread\""}, {"a": "nonisolated", "t": "nonisolated"}, {"a": "concurrent", "t": "@concurrent"}]}, {"slug": "sendable", "title": "Sendable", "summary": "What is allowed to cross a boundary — and the two separate jobs the one keyword does.", "minutes": "6", "sources": [{"ref": "SE-0302", "label": "Sendable and @Sendable closures", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0302-concurrent-value-and-concurrent-closures.md"}, {"ref": "SE-0414", "label": "Region based Isolation", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md"}, {"ref": "SE-0430", "label": "sending parameter and result values", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0430-transferring-parameters-and-results.md"}, {"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}], "html": "<p>Once there are domains, things have to move between them — and not everything can safely move.<\/p><h2 id=\"the-whole-idea-in-one-question\">The whole idea in one question<\/h2><p>When I hand this to somewhere else, <strong>do they get their own copy, or do we both end up holding the same thing?<\/strong><\/p><p>Own copy → nothing can go wrong → <code><span class=\"t-typ\">Sendable<\/span><\/code>. Same thing → we can both change it at once → not <code><span class=\"t-typ\">Sendable<\/span><\/code>.<\/p><p>That maps almost exactly onto value types versus reference types.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>What may go across the counter. A photocopy is fine — you each end up with your own, and neither can spoil the other's. A key to a room you also hold a key to is not fine: you have handed the problem straight through the wall, and the counter did nothing for you.<\/p><\/blockquote><h2 id=\"the-four-cases\">The four cases<\/h2><p><strong>Value types — free.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">Money<\/span> {                    <span class=\"t-com\">// implicitly Sendable, no annotation<\/span>\n    <span class=\"t-kw\">let<\/span> amount: <span class=\"t-typ\">Decimal<\/span>\n    <span class=\"t-kw\">var<\/span> currency: <span class=\"t-typ\">String<\/span>          <span class=\"t-com\">// `var` is fine — each holder has its own copy<\/span>\n}<\/code><\/pre><\/div><p><strong>Immutable final class — declare it, the compiler verifies.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Config<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">let<\/span> apiKey: <span class=\"t-typ\">String<\/span>            <span class=\"t-com\">// every stored property must be `let`<\/span>\n    <span class=\"t-kw\">let<\/span> timeout: <span class=\"t-typ\">TimeInterval<\/span>     <span class=\"t-com\">// and every type must itself be Sendable<\/span>\n}<\/code><\/pre><\/div><p>Swift infers <code><span class=\"t-typ\">Sendable<\/span><\/code> for structs and enums, never for classes. You state it; it checks you.<\/p><p><strong>Mutable class — refused.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Counter<\/span>: <span class=\"t-typ\">Sendable<\/span> {   <span class=\"t-com\">// error: stored property &#x27;value&#x27; is mutable<\/span>\n    <span class=\"t-kw\">var<\/span> value = <span class=\"t-num\">0<\/span>\n}<\/code><\/pre><\/div><p>Refused because the property <em>can<\/em> be mutated, not because anything does. <code><span class=\"t-kw\">let<\/span><\/code> versus <code><span class=\"t-kw\">var<\/span><\/code> only matters for classes; for a struct it is irrelevant, because copying already solved the problem.<\/p><p><strong>Protection the compiler can't see — <code><span class=\"t-atr\">@unchecked<\/span><\/code>.<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">ImageStore<\/span>: <span class=\"t-atr\">@unchecked<\/span> <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">let<\/span> lock = <span class=\"t-typ\">NSLock<\/span>()\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> images: [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Data<\/span>] = [:]\n\n    <span class=\"t-kw\">func<\/span> image(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) -&gt; <span class=\"t-typ\">Data<\/span>? {\n        lock.lock(); <span class=\"t-kw\">defer<\/span> { lock.unlock() }\n        <span class=\"t-kw\">return<\/span> images[url]\n    }\n}<\/code><\/pre><\/div><p>A promise, not a proof. The obvious follow-up is <em>how do you know?<\/em>, and the only honest answers are \"there is a lock\", \"it is immutable in practice\", or \"one task drives it, and here is where that is written down.\"<\/p><h2 id=\"the-trap-that-catches-everyone\">The trap that catches everyone<\/h2><p>A container is only as safe as its contents.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">UserProfile<\/span>: <span class=\"t-typ\">Sendable<\/span> {    <span class=\"t-com\">// error — and it points at `avatar`<\/span>\n    <span class=\"t-kw\">let<\/span> name: <span class=\"t-typ\">String<\/span>\n    <span class=\"t-kw\">let<\/span> avatar: <span class=\"t-typ\">ImageBuffer<\/span>       <span class=\"t-com\">// a non-Sendable class<\/span>\n}<\/code><\/pre><\/div><p>It is a struct, everything is <code><span class=\"t-kw\">let<\/span><\/code>, and it still fails. Copying the struct copies the <em>reference<\/em> to the buffer, not the buffer. You handed over a key and called it a photocopy.<\/p><h2 id=\"two-jobs-one-keyword\">Two jobs, one keyword<\/h2><p>This is the distinction that separates people who understand <code><span class=\"t-typ\">Sendable<\/span><\/code> from people who have memorised it.<\/p><div class=\"scroll\"><table><thead><tr><th>Job<\/th><th>Checked<\/th><th>Rescued by region isolation?<\/th><\/tr><\/thead><tbody><tr><td>A value crossing a boundary at a call site<\/td><td>by dataflow<\/td><td><strong>Yes<\/strong> — a <em>disconnected<\/em> value can cross without conforming<\/td><\/tr><tr><td>A conformance requirement (<code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">P<\/span>: <span class=\"t-typ\">Sendable<\/span><\/code>, a <code><span class=\"t-typ\">Sendable<\/span><\/code> struct's properties)<\/td><td>on the declaration<\/td><td><strong>No<\/strong> — there is no dataflow to analyse<\/td><\/tr><\/tbody><\/table><\/div><p>That is why removing <code>&amp; <span class=\"t-typ\">Sendable<\/span><\/code> from a return type sometimes compiles and removing <code>: <span class=\"t-typ\">Sendable<\/span><\/code> from a protocol never does.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><strong>SE-0414 (region-based isolation)<\/strong> lets the compiler track which values can reach which others and prove a value is <em>disconnected<\/em> — nothing outside this region can still reach it. A disconnected non-<code><span class=\"t-typ\">Sendable<\/span><\/code> value can safely cross, because after the transfer the sender provably cannot touch it.<\/p><p><strong>SE-0430 (<code><span class=\"t-kw\">sending<\/span><\/code>)<\/strong> carries that fact across a function signature. Region analysis is intraprocedural: at a call site the compiler knows only the <em>signature<\/em>, not the callee's body. So a function returning a bare non-<code><span class=\"t-typ\">Sendable<\/span><\/code> value is assumed to be handing back something possibly still in its own region, and the transfer is rejected. <code>-&gt; <span class=\"t-kw\">sending<\/span> <span class=\"t-typ\">T<\/span><\/code> is the callee promising the result is disconnected, verified inside the callee.<\/p><p>Choosing between them: a <code><span class=\"t-typ\">Sendable<\/span><\/code> bound when the type genuinely is safe to share — checked once, at the type. <code><span class=\"t-kw\">sending<\/span><\/code> when the type isn't <code><span class=\"t-typ\">Sendable<\/span><\/code> but this particular value is exclusively owned — checked at every implementation of the signature, which is a larger maintenance surface.<\/p><\/blockquote><h2 id=\"why-it-goes-on-a-protocol\">Why it goes on a protocol<\/h2><p><code><span class=\"t-typ\">Sendable<\/span><\/code> is transitive. Anything <em>storing<\/em> an <code><span class=\"t-kw\">any<\/span> <span class=\"t-typ\">HTTPClientType<\/span><\/code> needs that type to be <code><span class=\"t-typ\">Sendable<\/span><\/code> in order to be <code><span class=\"t-typ\">Sendable<\/span><\/code> itself. Leave it off the contract and every holder becomes non-<code><span class=\"t-typ\">Sendable<\/span><\/code>, and it spreads outward through the app.<\/p><p>You cannot add it cheaply later, which is why it belongs on the job description written at the start rather than on any particular implementation.<\/p><h2 id=\"the-bit-most-people-miss\">The bit most people miss<\/h2><p><strong><code><span class=\"t-typ\">Sendable<\/span><\/code> is only ever checked at a crossing.<\/strong><\/p><p>A mutable class used entirely within one domain never needs it. It is not a verdict on whether a type is well written — it is a question asked at a specific boundary, about a specific value, at a specific moment.<\/p><p>Which is why <em>\"why does this need to be <code><span class=\"t-typ\">Sendable<\/span><\/code>?\"<\/em> has the answer <strong>\"because it crosses here — and if I move that line, it doesn't.\"<\/strong><\/p>", "text": "once there are domains, things have to move between them — and not everything can safely move. the whole idea in one question when i hand this to somewhere else, do they get their own copy, or do we both end up holding the same thing? own copy → nothing can go wrong → sendable . same thing → we can both change it at once → not sendable . that maps almost exactly onto value types versus reference types. in the office. what may go across the counter. a photocopy is fine — you each end up with your own, and neither can spoil the other's. a key to a room you also hold a key to is not fine: you have handed the problem straight through the wall, and the counter did nothing for you. the four cases value types — free. swift struct money { // implicitly sendable, no annotation let amount: decimal var currency: string // var is fine — each holder has its own copy } immutable final class — declare it, the compiler verifies. swift final class config: sendable { let apikey: string // every stored property must be let let timeout: timeinterval // and every type must itself be sendable } swift infers sendable for structs and enums, never for classes. you state it; it checks you. mutable class — refused. swift final class counter: sendable { // error: stored property 'value' is mutable var value = 0 } refused because the property can be mutated, not because anything does. let versus var only matters for classes; for a struct it is irrelevant, because copying already solved the problem. protection the compiler can't see — @unchecked . swift final class imagestore: @unchecked sendable { private let lock = nslock() private var images: [url: data] = [:] func image(for url: url) data? { lock.lock(); defer { lock.unlock() } return images[url] } } a promise, not a proof. the obvious follow up is how do you know? , and the only honest answers are \"there is a lock\", \"it is immutable in practice\", or \"one task drives it, and here is where that is written down.\" the trap that catches everyone a container is only as safe as its contents. swift struct userprofile: sendable { // error — and it points at avatar let name: string let avatar: imagebuffer // a non sendable class } it is a struct, everything is let , and it still fails. copying the struct copies the reference to the buffer, not the buffer. you handed over a key and called it a photocopy. two jobs, one keyword this is the distinction that separates people who understand sendable from people who have memorised it. job checked rescued by region isolation? a value crossing a boundary at a call site by dataflow yes — a disconnected value can cross without conforming a conformance requirement ( protocol p: sendable , a sendable struct's properties) on the declaration no — there is no dataflow to analyse that is why removing & sendable from a return type sometimes compiles and removing : sendable from a protocol never does. under the hood. se 0414 (region based isolation) lets the compiler track which values can reach which others and prove a value is disconnected — nothing outside this region can still reach it. a disconnected non sendable value can safely cross, because after the transfer the sender provably cannot touch it. se 0430 ( sending ) carries that fact across a function signature. region analysis is intraprocedural: at a call site the compiler knows only the signature , not the callee's body. so a function returning a bare non sendable value is assumed to be handing back something possibly still in its own region, and the transfer is rejected. sending t is the callee promising the result is disconnected, verified inside the callee. choosing between them: a sendable bound when the type genuinely is safe to share — checked once, at the type. sending when the type isn't sendable but this particular value is exclusively owned — checked at every implementation of the signature, which is a larger maintenance surface. why it goes on a protocol sendable is transitive. anything storing an any httpclienttype needs that type to be sendable in order to be sendable itself. leave it off the contract and every holder becomes non sendable , and it spreads outward through the app. you cannot add it cheaply later, which is why it belongs on the job description written at the start rather than on any particular implementation. the bit most people miss sendable is only ever checked at a crossing. a mutable class used entirely within one domain never needs it. it is not a verdict on whether a type is well written — it is a question asked at a specific boundary, about a specific value, at a specific moment. which is why \"why does this need to be sendable ?\" has the answer \"because it crosses here — and if i move that line, it doesn't.\" ", "outline": [{"a": "the-whole-idea-in-one-question", "t": "The whole idea in one question"}, {"a": "the-four-cases", "t": "The four cases"}, {"a": "the-trap-that-catches-everyone", "t": "The trap that catches everyone"}, {"a": "two-jobs-one-keyword", "t": "Two jobs, one keyword"}, {"a": "why-it-goes-on-a-protocol", "t": "Why it goes on a protocol"}, {"a": "the-bit-most-people-miss", "t": "The bit most people miss"}]}, {"slug": "structured-concurrency-and-cancellation", "title": "Structured concurrency and cancellation", "summary": "Child tasks that cannot outlive their parent, and why cancellation is a flag rather than a kill.", "minutes": "7", "sources": [{"ref": "SE-0304", "label": "Structured concurrency", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0304-structured-concurrency.md"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<h2 id=\"tasks-that-own-other-tasks\">Tasks that own other tasks<\/h2><p>A job often needs several things at once. You can create child tasks, and the system's rule about them is the valuable part: <strong>a parent cannot return before its children have finished.<\/strong><\/p><p>Sequential — three round trips, one after another:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">let<\/span> profile  = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetchProfile(id)\n<span class=\"t-kw\">let<\/span> settings = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetchSettings(id)\n<span class=\"t-kw\">let<\/span> badges   = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetchBadges(id)<\/code><\/pre><\/div><p>Concurrent, a fixed number of known children:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span> profile  = fetchProfile(id)\n<span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span> settings = fetchSettings(id)\n<span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span> badges   = fetchBadges(id)\n\n<span class=\"t-kw\">let<\/span> screen = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> <span class=\"t-typ\">Screen<\/span>(profile: profile, settings: settings, badges: badges)<\/code><\/pre><\/div><p>Concurrent, a number decided at runtime:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> thumbnails(<span class=\"t-kw\">for<\/span> urls: [<span class=\"t-typ\">URL<\/span>]) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Image<\/span>] {\n    <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> withThrowingTaskGroup(of: (<span class=\"t-typ\">URL<\/span>, <span class=\"t-typ\">Image<\/span>).<span class=\"t-kw\">self<\/span>) { group <span class=\"t-kw\">in<\/span>\n        <span class=\"t-kw\">for<\/span> url <span class=\"t-kw\">in<\/span> urls {\n            group.addTask { (url, <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> <span class=\"t-kw\">self<\/span>.thumbnail(<span class=\"t-kw\">for<\/span>: url)) }\n        }\n        <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> group.reduce(into: [:]) { $<span class=\"t-num\">0<\/span>[$<span class=\"t-num\">1.0<\/span>] = $<span class=\"t-num\">1.1<\/span> }\n    }\n}<\/code><\/pre><\/div><p><strong>What the parent-waits rule buys you.<\/strong> Under the old model you sent someone off to do a task and carried on — and if you finished first, or gave up, or the screen closed, that work was still out there. Nobody tracked it. It came back hours later with a result for a job that no longer existed, or held resources nothing could reclaim.<\/p><p>With structured concurrency that cannot happen. Children have a lifetime bounded by their parent's. Cancel the parent and every child is cancelled. If a child throws, the parent hears about it. Nothing is orphaned.<\/p><p>This is the quiet reason the new model produces less mess than the old one, quite apart from the data-race question.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A job that needs three sub-jobs writes three more slips and hands them out — but is not allowed to leave for the day until all three come back. Nobody goes home leaving work outstanding that nobody is tracking.<\/p><\/blockquote><h2 id=\"task-and-the-escape-hatch\"><code><span class=\"t-typ\">Task<\/span> { }<\/code> and the escape hatch<\/h2><p><code><span class=\"t-typ\">Task<\/span> { }<\/code> is <em>unstructured<\/em> — it outlives the scope that created it and nobody waits for it — but it <strong>inherits the enclosing actor isolation, priority and task-local values<\/strong>:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">FeedViewModel<\/span> {\n    <span class=\"t-kw\">private<\/span>(<span class=\"t-kw\">set<\/span>) <span class=\"t-kw\">var<\/span> items: [<span class=\"t-typ\">Item<\/span>] = []\n\n    <span class=\"t-kw\">func<\/span> refresh() {\n        <span class=\"t-typ\">Task<\/span> {                                  <span class=\"t-com\">// inherits @MainActor<\/span>\n            items = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> loader.load()     <span class=\"t-com\">// no MainActor.run needed<\/span>\n        }\n    }\n}<\/code><\/pre><\/div><p><code><span class=\"t-typ\">Task<\/span>.detached { }<\/code> inherits <strong>nothing<\/strong> — no actor, no priority, no task-locals, and nothing cancels it. The number of legitimate uses in an app codebase is close to zero. Reaching for it because \"this shouldn't block the UI\" is the classic misuse; the tool for that is <code><span class=\"t-atr\">@concurrent<\/span><\/code>, which keeps priority and cancellation.<\/p><h2 id=\"cancellation-is-cooperative\">Cancellation is cooperative<\/h2><p>You cannot kill a task mid-work. Cutting it off halfway would leave state half-written, which is worse than letting it finish.<\/p><p>So cancellation sets a <strong>flag<\/strong>. Something marks the task cancelled; the work notices <em>between steps<\/em> and stops.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> process(_ items: [<span class=\"t-typ\">Item<\/span>]) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; [<span class=\"t-typ\">Result<\/span>] {\n    <span class=\"t-kw\">var<\/span> results: [<span class=\"t-typ\">Result<\/span>] = []\n    <span class=\"t-kw\">for<\/span> item <span class=\"t-kw\">in<\/span> items {\n        <span class=\"t-kw\">try<\/span> <span class=\"t-typ\">Task<\/span>.checkCancellation()      <span class=\"t-com\">// throws CancellationError<\/span>\n        results.append(expensiveWork(item))\n    }\n    <span class=\"t-kw\">return<\/span> results\n}<\/code><\/pre><\/div><p>Two ways to observe it:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">try<\/span> <span class=\"t-typ\">Task<\/span>.checkCancellation()   <span class=\"t-com\">// throws — use in a throwing context<\/span>\n<span class=\"t-kw\">if<\/span> <span class=\"t-typ\">Task<\/span>.isCancelled { <span class=\"t-kw\">return<\/span> } <span class=\"t-com\">// boolean — use when returning partial work<\/span><\/code><\/pre><\/div><p>In SwiftUI, <code>.task<\/code> cancels for you when the view disappears:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code>.task(id: query) {              <span class=\"t-com\">// cancels the previous one when query changes<\/span>\n    <span class=\"t-kw\">await<\/span> viewModel.search(query)\n}<\/code><\/pre><\/div><p><strong>The consequence, exactly:<\/strong> work that never checks the flag never stops. A thirty-second loop with no check runs for its full thirty seconds after the user has left the screen, holding memory and burning battery, and no amount of <code>cancel()<\/code> at the call site changes that.<\/p><p><code>cancel()<\/code> does not stop anything. It marks the task and every child as cancelled. Built-in suspension points — <code><span class=\"t-typ\">Task<\/span>.sleep<\/code>, <code><span class=\"t-typ\">URLSession<\/span><\/code>'s async methods — throw when they notice. Your own CPU loops notice nothing unless you ask.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>You cannot snatch paperwork out of someone's hands mid-sentence. You stamp the slip <em>no longer needed<\/em>. The worker sees the stamp between steps, tidies up and stops. A worker who never looks up finishes the whole job regardless.<\/p><\/blockquote><p><strong>The trap:<\/strong> <code><span class=\"t-kw\">try<\/span>? <span class=\"t-kw\">await<\/span> <span class=\"t-typ\">Task<\/span>.sleep(...)<\/code> swallows the <code><span class=\"t-typ\">CancellationError<\/span><\/code>, so execution continues into whatever came next. If you use <code><span class=\"t-kw\">try<\/span>?<\/code>, follow it with an explicit <code><span class=\"t-kw\">guard<\/span> !<span class=\"t-typ\">Task<\/span>.isCancelled <span class=\"t-kw\">else<\/span> { <span class=\"t-kw\">return<\/span> }<\/code>.<\/p><p><strong>In a review, the question that separates people:<\/strong> <em>where do you check for cancellation?<\/em> A long synchronous loop with no check is not cancellable, whatever the paperwork says.<\/p><h2 id=\"bounding-the-width\">Bounding the width<\/h2><p>A task group with a thousand <code>addTask<\/code> calls will happily start a thousand children. If each holds a decoded image you have a memory problem, not a concurrency one:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-com\">// keep at most `limit` in flight<\/span>\n<span class=\"t-kw\">for<\/span> url <span class=\"t-kw\">in<\/span> urls {\n    <span class=\"t-kw\">if<\/span> inFlight &gt;= limit { _ = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> group.next(); inFlight -= <span class=\"t-num\">1<\/span> }\n    group.addTask { /* … */ }; inFlight += <span class=\"t-num\">1<\/span>\n}<\/code><\/pre><\/div><p>Structured concurrency bounds <em>lifetime<\/em>. It does not bound <em>width<\/em> — that is yours.<\/p>", "text": " tasks that own other tasks a job often needs several things at once. you can create child tasks, and the system's rule about them is the valuable part: a parent cannot return before its children have finished. sequential — three round trips, one after another: swift let profile = try await fetchprofile(id) let settings = try await fetchsettings(id) let badges = try await fetchbadges(id) concurrent, a fixed number of known children: swift async let profile = fetchprofile(id) async let settings = fetchsettings(id) async let badges = fetchbadges(id) let screen = try await screen(profile: profile, settings: settings, badges: badges) concurrent, a number decided at runtime: swift func thumbnails(for urls: [url]) async throws [url: image] { try await withthrowingtaskgroup(of: (url, image).self) { group in for url in urls { group.addtask { (url, try await self.thumbnail(for: url)) } } return try await group.reduce(into: [:]) { $0[$1.0] = $1.1 } } } what the parent waits rule buys you. under the old model you sent someone off to do a task and carried on — and if you finished first, or gave up, or the screen closed, that work was still out there. nobody tracked it. it came back hours later with a result for a job that no longer existed, or held resources nothing could reclaim. with structured concurrency that cannot happen. children have a lifetime bounded by their parent's. cancel the parent and every child is cancelled. if a child throws, the parent hears about it. nothing is orphaned. this is the quiet reason the new model produces less mess than the old one, quite apart from the data race question. in the office. a job that needs three sub jobs writes three more slips and hands them out — but is not allowed to leave for the day until all three come back. nobody goes home leaving work outstanding that nobody is tracking. task { } and the escape hatch task { } is unstructured — it outlives the scope that created it and nobody waits for it — but it inherits the enclosing actor isolation, priority and task local values : swift @mainactor final class feedviewmodel { private(set) var items: [item] = [] func refresh() { task { // inherits @mainactor items = try await loader.load() // no mainactor.run needed } } } task.detached { } inherits nothing — no actor, no priority, no task locals, and nothing cancels it. the number of legitimate uses in an app codebase is close to zero. reaching for it because \"this shouldn't block the ui\" is the classic misuse; the tool for that is @concurrent , which keeps priority and cancellation. cancellation is cooperative you cannot kill a task mid work. cutting it off halfway would leave state half written, which is worse than letting it finish. so cancellation sets a flag . something marks the task cancelled; the work notices between steps and stops. swift func process(_ items: [item]) async throws [result] { var results: [result] = [] for item in items { try task.checkcancellation() // throws cancellationerror results.append(expensivework(item)) } return results } two ways to observe it: swift try task.checkcancellation() // throws — use in a throwing context if task.iscancelled { return } // boolean — use when returning partial work in swiftui, .task cancels for you when the view disappears: swift .task(id: query) { // cancels the previous one when query changes await viewmodel.search(query) } the consequence, exactly: work that never checks the flag never stops. a thirty second loop with no check runs for its full thirty seconds after the user has left the screen, holding memory and burning battery, and no amount of cancel() at the call site changes that. cancel() does not stop anything. it marks the task and every child as cancelled. built in suspension points — task.sleep , urlsession 's async methods — throw when they notice. your own cpu loops notice nothing unless you ask. in the office. you cannot snatch paperwork out of someone's hands mid sentence. you stamp the slip no longer needed . the worker sees the stamp between steps, tidies up and stops. a worker who never looks up finishes the whole job regardless. the trap: try? await task.sleep(...) swallows the cancellationerror , so execution continues into whatever came next. if you use try? , follow it with an explicit guard !task.iscancelled else { return } . in a review, the question that separates people: where do you check for cancellation? a long synchronous loop with no check is not cancellable, whatever the paperwork says. bounding the width a task group with a thousand addtask calls will happily start a thousand children. if each holds a decoded image you have a memory problem, not a concurrency one: swift // keep at most limit in flight for url in urls { if inflight = limit { _ = try await group.next(); inflight = 1 } group.addtask { / … / }; inflight += 1 } structured concurrency bounds lifetime . it does not bound width — that is yours. ", "outline": [{"a": "tasks-that-own-other-tasks", "t": "Tasks that own other tasks"}, {"a": "task-and-the-escape-hatch", "t": "Task { } and the escape hatch"}, {"a": "cancellation-is-cooperative", "t": "Cancellation is cooperative"}, {"a": "bounding-the-width", "t": "Bounding the width"}]}, {"slug": "decision-guide", "title": "The decision guide", "summary": "Apple's ladder, the full map, and the questions to answer out loud.", "minutes": "6", "sources": [{"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<h2 id=\"the-ladder-apple-actually-recommends\">The ladder Apple actually recommends<\/h2><p>Not \"use concurrency\". A sequence — and you stop as soon as the problem is solved.<\/p><p><strong>Step 0 — everything on the main actor.<\/strong><\/p><blockquote class=\"aside plain\"><p>\"Your apps should start by running all of their code on the main thread… Many apps only need to use concurrency sparingly, and some don't need concurrency at all.\"<\/p><\/blockquote><p>No shared state means no data races, and the fastest correct program is the one that never left one domain.<\/p><p><strong>Step 1 — <code><span class=\"t-kw\">async<\/span><\/code> for waiting.<\/strong> The screen freezes during a network call. Make it <code><span class=\"t-kw\">async<\/span><\/code> and <code><span class=\"t-kw\">await<\/span><\/code> it. The main thread is released during the wait and picks the work back up when the answer arrives. No extra threads, no new domain, no new failure modes. This solves the large majority of real responsiveness problems.<\/p><p><strong>Step 2 — <code><span class=\"t-atr\">@concurrent<\/span><\/code> for measured work.<\/strong> Still stuttering, and Instruments shows real CPU time on the main thread — a big decode, a resize, an inference pass. Move that one function off. Profile first; the hop costs two context switches, and paying that to save nothing is a regression.<\/p><p><strong>Step 3 — an actor for shared non-UI state.<\/strong> Only once several concurrent things genuinely share state that isn't UI state: a cache, a connection pool, a token store. Apple's trigger:<\/p><blockquote class=\"aside plain\"><p>\"Use actors when you find that storing data on the main actor is causing too much code to run on the main thread.\"<\/p><\/blockquote><p><strong>The error to avoid<\/strong> is skipping to step 3 because actors are the interesting part. An actor around a stateless service serialises it for no benefit; <code><span class=\"t-atr\">@concurrent<\/span><\/code> on a small decode is a straight loss.<\/p><h2 id=\"the-isolation-cheat-sheet\">The isolation cheat sheet<\/h2><div class=\"scroll\"><table><thead><tr><th>Spelling<\/th><th>Where it runs<\/th><th>When<\/th><\/tr><\/thead><tbody><tr><td><code><span class=\"t-kw\">func<\/span> f()<\/code> in a <code><span class=\"t-atr\">@MainActor<\/span><\/code> type<\/td><td>main actor<\/td><td>UI state, view models<\/td><\/tr><tr><td><code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">func<\/span> f()<\/code><\/td><td>caller's context, synchronously<\/td><td>pure functions inside an isolated type<\/td><\/tr><tr><td><code><span class=\"t-kw\">func<\/span> f() <span class=\"t-kw\">async<\/span><\/code> (nonisolated)<\/td><td><strong>caller's actor<\/strong> (SE-0461)<\/td><td>the normal case for async work<\/td><\/tr><tr><td><code><span class=\"t-kw\">nonisolated<\/span>(nonsending) <span class=\"t-kw\">func<\/span> f() <span class=\"t-kw\">async<\/span><\/code><\/td><td>same — explicit spelling<\/td><td>when you want it stated regardless of flags<\/td><\/tr><tr><td><code><span class=\"t-atr\">@concurrent<\/span> <span class=\"t-kw\">func<\/span> f() <span class=\"t-kw\">async<\/span><\/code><\/td><td>global executor, always<\/td><td><strong>measured<\/strong> CPU work only<\/td><\/tr><tr><td><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">A<\/span> { <span class=\"t-kw\">func<\/span> f() }<\/code><\/td><td>A's executor, serially<\/td><td>genuinely shared mutable state<\/td><\/tr><tr><td><code><span class=\"t-typ\">Task<\/span> { }<\/code><\/td><td>inherits caller's actor<\/td><td>fire-off work from isolated code<\/td><\/tr><tr><td><code><span class=\"t-typ\">Task<\/span>.detached { }<\/code><\/td><td>nothing inherited<\/td><td>almost never<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"the-full-map\">The full map<\/h2><div class=\"scroll\"><table><thead><tr><th>In the office<\/th><th>Real name<\/th><th>What it is<\/th><th>Where it lives<\/th><\/tr><\/thead><tbody><tr><td>A desk<\/td><td>Core<\/td><td>hardware that executes instructions<\/td><td>the chip<\/td><\/tr><tr><td>A worker<\/td><td>Thread<\/td><td>a worker with a stack, scheduled by the OS<\/td><td>the OS<\/td><\/tr><tr><td>The permanent staff, one per desk<\/td><td>Cooperative pool<\/td><td>every thread Swift concurrency has<\/td><td>the runtime<\/td><\/tr><tr><td>A slip of paper in the tray<\/td><td>Task<\/td><td>a unit of work, not a worker<\/td><td>the heap<\/td><\/tr><tr><td>A slip set aside with a bookmark<\/td><td>Continuation<\/td><td>a suspended task's saved state<\/td><td>the heap<\/td><\/tr><tr><td>The marked point where a slip may be set down<\/td><td><code><span class=\"t-kw\">await<\/span><\/code><\/td><td>a point where work may be put down<\/td><td>compile + runtime<\/td><\/tr><tr><td>The rulebook: who may touch which records<\/td><td>Isolation domain<\/td><td>a region of state and who may touch it<\/td><td><strong>compile time only<\/strong><\/td><\/tr><tr><td>A back room with a counter in front<\/td><td>Actor<\/td><td>an isolation domain + a serial executor<\/td><td>both<\/td><\/tr><tr><td>The counter and its queue<\/td><td>Executor<\/td><td>runs jobs, one at a time for an actor<\/td><td>the runtime<\/td><\/tr><tr><td>The one counter facing the customers<\/td><td><code><span class=\"t-atr\">@MainActor<\/span><\/code><\/td><td>the global domain backed by the main thread<\/td><td>both<\/td><\/tr><tr><td>Work that touches no records<\/td><td><code><span class=\"t-kw\">nonisolated<\/span><\/code><\/td><td>belongs to no domain<\/td><td>compile time<\/td><\/tr><tr><td>Sending a job to the back office<\/td><td><code><span class=\"t-atr\">@concurrent<\/span><\/code><\/td><td>always run on the pool<\/td><td>both<\/td><\/tr><tr><td>A photocopy rather than a key<\/td><td><code><span class=\"t-typ\">Sendable<\/span><\/code><\/td><td>safe to carry across a boundary<\/td><td><strong>compile time only<\/strong><\/td><\/tr><tr><td>Two workers writing the same page<\/td><td>Data race<\/td><td>what the whole system exists to prevent<\/td><td>—<\/td><\/tr><tr><td>Hiring more staff who all stand on hold<\/td><td>Thread explosion<\/td><td>GCD's failure mode<\/td><td>—<\/td><\/tr><tr><td>The clerk taking a phone call mid-request<\/td><td>Actor reentrancy<\/td><td>the world moves while you're suspended<\/td><td>—<\/td><\/tr><tr><td>Standing in the office ≠ being authorised<\/td><td>isolation vs thread<\/td><td>the distinction in chapter 6<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"the-four-sentences\">The four sentences<\/h2><p>If everything compresses to anything, it is these.<\/p><p><strong>1. Many tasks, few threads.<\/strong> Tasks are cheap objects; threads are a fixed pool sized to the cores. Threads never block, which is why the pool can stay small.<\/p><p><strong>2. <code><span class=\"t-kw\">await<\/span><\/code> is a suspension point, not a thread switch.<\/strong> It guarantees the thread is released. It guarantees nothing about what is still true when you resume.<\/p><p><strong>3. An actor is not a worker, it's a protected region.<\/strong> It gives mutual exclusion, not thread affinity. Its code runs on whatever pool thread is free.<\/p><p><strong>4. Isolation is compile-time; threads are runtime.<\/strong> <code><span class=\"t-atr\">@MainActor<\/span><\/code> is a domain that happens to be backed by the main thread — which is why you can be on the thread without being in the domain.<\/p><h2 id=\"answer-these-out-loud\">Answer these out loud<\/h2><p>File closed, 90 seconds each, in trade-off shape — the decision, the alternative rejected, the boundary condition.<\/p><ol start=\"1\"><li>Why does a small fixed thread pool work when GCD's growing one didn't?<\/li><li>What does <code><span class=\"t-kw\">await<\/span><\/code> guarantee and what does it not?<\/li><li>What is the difference between an actor and a thread?<\/li><li>An actor and a serial queue both give one-at-a-time access. When does the difference matter?<\/li><li>Two callers ask an actor-backed cache for the same key at once. What happens, and why won't a lock fix it?<\/li><li>Why is <code><span class=\"t-atr\">@MainActor<\/span><\/code> not the same as the main thread? Give two independent reasons.<\/li><li>Why does <code><span class=\"t-typ\">MainActor<\/span>.assumeIsolated<\/code> exist at all?<\/li><li>What changed in Swift 6.2 about <code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">async<\/span><\/code>, and what did it break?<\/li><li>When is <code><span class=\"t-atr\">@concurrent<\/span><\/code> justified, and when is it a regression?<\/li><li>When is <code><span class=\"t-typ\">Sendable<\/span><\/code> actually required?<\/li><li>What does structured concurrency guarantee that <code><span class=\"t-typ\">Task<\/span> { }<\/code> does not?<\/li><li>Where in your code do you check for cancellation, and what happens if you don't?<\/li><\/ol>", "text": " the ladder apple actually recommends not \"use concurrency\". a sequence — and you stop as soon as the problem is solved. step 0 — everything on the main actor. \"your apps should start by running all of their code on the main thread… many apps only need to use concurrency sparingly, and some don't need concurrency at all.\" no shared state means no data races, and the fastest correct program is the one that never left one domain. step 1 — async for waiting. the screen freezes during a network call. make it async and await it. the main thread is released during the wait and picks the work back up when the answer arrives. no extra threads, no new domain, no new failure modes. this solves the large majority of real responsiveness problems. step 2 — @concurrent for measured work. still stuttering, and instruments shows real cpu time on the main thread — a big decode, a resize, an inference pass. move that one function off. profile first; the hop costs two context switches, and paying that to save nothing is a regression. step 3 — an actor for shared non ui state. only once several concurrent things genuinely share state that isn't ui state: a cache, a connection pool, a token store. apple's trigger: \"use actors when you find that storing data on the main actor is causing too much code to run on the main thread.\" the error to avoid is skipping to step 3 because actors are the interesting part. an actor around a stateless service serialises it for no benefit; @concurrent on a small decode is a straight loss. the isolation cheat sheet spelling where it runs when func f() in a @mainactor type main actor ui state, view models nonisolated func f() caller's context, synchronously pure functions inside an isolated type func f() async (nonisolated) caller's actor (se 0461) the normal case for async work nonisolated(nonsending) func f() async same — explicit spelling when you want it stated regardless of flags @concurrent func f() async global executor, always measured cpu work only actor a { func f() } a's executor, serially genuinely shared mutable state task { } inherits caller's actor fire off work from isolated code task.detached { } nothing inherited almost never the full map in the office real name what it is where it lives a desk core hardware that executes instructions the chip a worker thread a worker with a stack, scheduled by the os the os the permanent staff, one per desk cooperative pool every thread swift concurrency has the runtime a slip of paper in the tray task a unit of work, not a worker the heap a slip set aside with a bookmark continuation a suspended task's saved state the heap the marked point where a slip may be set down await a point where work may be put down compile + runtime the rulebook: who may touch which records isolation domain a region of state and who may touch it compile time only a back room with a counter in front actor an isolation domain + a serial executor both the counter and its queue executor runs jobs, one at a time for an actor the runtime the one counter facing the customers @mainactor the global domain backed by the main thread both work that touches no records nonisolated belongs to no domain compile time sending a job to the back office @concurrent always run on the pool both a photocopy rather than a key sendable safe to carry across a boundary compile time only two workers writing the same page data race what the whole system exists to prevent — hiring more staff who all stand on hold thread explosion gcd's failure mode — the clerk taking a phone call mid request actor reentrancy the world moves while you're suspended — standing in the office ≠ being authorised isolation vs thread the distinction in chapter 6 — the four sentences if everything compresses to anything, it is these. 1. many tasks, few threads. tasks are cheap objects; threads are a fixed pool sized to the cores. threads never block, which is why the pool can stay small. 2. await is a suspension point, not a thread switch. it guarantees the thread is released. it guarantees nothing about what is still true when you resume. 3. an actor is not a worker, it's a protected region. it gives mutual exclusion, not thread affinity. its code runs on whatever pool thread is free. 4. isolation is compile time; threads are runtime. @mainactor is a domain that happens to be backed by the main thread — which is why you can be on the thread without being in the domain. answer these out loud file closed, 90 seconds each, in trade off shape — the decision, the alternative rejected, the boundary condition. 1. why does a small fixed thread pool work when gcd's growing one didn't? 2. what does await guarantee and what does it not? 3. what is the difference between an actor and a thread? 4. an actor and a serial queue both give one at a time access. when does the difference matter? 5. two callers ask an actor backed cache for the same key at once. what happens, and why won't a lock fix it? 6. why is @mainactor not the same as the main thread? give two independent reasons. 7. why does mainactor.assumeisolated exist at all? 8. what changed in swift 6.2 about nonisolated async , and what did it break? 9. when is @concurrent justified, and when is it a regression? 10. when is sendable actually required? 11. what does structured concurrency guarantee that task { } does not? 12. where in your code do you check for cancellation, and what happens if you don't? ", "outline": [{"a": "the-ladder-apple-actually-recommends", "t": "The ladder Apple actually recommends"}, {"a": "the-isolation-cheat-sheet", "t": "The isolation cheat sheet"}, {"a": "the-full-map", "t": "The full map"}, {"a": "the-four-sentences", "t": "The four sentences"}, {"a": "answer-these-out-loud", "t": "Answer these out loud"}]}], "minutes": 64, "sources": [{"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}, {"ref": "", "label": "WWDCNotes · Behind the scenes (transcript detail)", "url": "https://wwdcnotes.com/documentation/wwdc21-10254-swift-concurrency-behind-the-scenes/"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "SE-0306", "label": "Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0306-actors.md"}, {"ref": "SE-0392", "label": "Custom Actor Executors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0392-custom-actor-executors.md"}, {"ref": "SE-0316", "label": "Global Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0316-global-actors.md"}, {"ref": "", "label": "Donny Wals · Setting default actor isolation in Xcode 26", "url": "https://www.donnywals.com/setting-default-actor-isolation-in-xcode-26/"}, {"ref": "", "label": "Malcolm Hall · @MainActor does not always mean main thread (2023, pre-SE-0461)", "url": "https:/
