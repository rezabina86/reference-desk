nt<\/span> {\n    <span class=\"t-kw\">var<\/span> left = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> right = heights.count - <span class=\"t-num\">1<\/span>\n    <span class=\"t-kw\">var<\/span> best = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">while<\/span> left &lt; right {\n        <span class=\"t-kw\">let<\/span> area = min(heights[left], heights[right]) * (right - left)\n        best = max(best, area)\n        <span class=\"t-kw\">if<\/span> heights[left] &lt; heights[right] {\n            left += <span class=\"t-num\">1<\/span>          <span class=\"t-com\">// the shorter wall caps every narrower pair it&#x27;s part of<\/span>\n        } <span class=\"t-kw\">else<\/span> {\n            right -= <span class=\"t-num\">1<\/span>\n        }\n    }\n    <span class=\"t-kw\">return<\/span> best\n}<\/code><\/pre><\/div><p>Empty and single-wall input return 0 without a guard: <code>right<\/code> starts at −1 or 0, the loop condition fails, and nothing is subscripted.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, six more (empty, one wall, all walls equal, two zero walls, strictly rising heights, two walls at the 10,000 maximum), and 3,000 random arrays checked against a brute-force O(n²) search over every pair.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">6<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Left (height)<\/th><th>Right (height)<\/th><th>Water<\/th><th>Best<\/th><th>Move<\/th><\/tr><\/thead><tbody><tr><td>0 (2)<\/td><td>6 (1)<\/td><td>1 × 6 = 6<\/td><td>6<\/td><td>right is shorter → right<\/td><\/tr><tr><td>0 (2)<\/td><td>5 (8)<\/td><td>2 × 5 = 10<\/td><td>10<\/td><td>left is shorter → left<\/td><\/tr><tr><td>1 (7)<\/td><td>5 (8)<\/td><td>7 × 4 = 28<\/td><td>28<\/td><td>left<\/td><\/tr><tr><td>2 (3)<\/td><td>5 (8)<\/td><td>3 × 3 = 9<\/td><td>28<\/td><td>left<\/td><\/tr><tr><td>3 (6)<\/td><td>5 (8)<\/td><td>6 × 2 = 12<\/td><td>28<\/td><td>left<\/td><\/tr><tr><td>4 (4)<\/td><td>5 (8)<\/td><td>4 × 1 = 4<\/td><td>28<\/td><td>left → fingers meet<\/td><\/tr><\/tbody><\/table><\/div><p>Answer 28, after six measurements instead of twenty-one.<\/p><p><strong><code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">4<\/span>]<\/code><\/strong> — one measurement: 4 × 1 = 4. The walls tie, the right finger moves, the fingers meet. Answer 4.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>A slice keeps its parent's indices.<\/strong> The follow-up \"now do it for walls 3 to 9 only\" tempts you to pass <code>heights[<span class=\"t-num\">3<\/span>...<span class=\"t-num\">9<\/span>]<\/code> into a version that takes <code><span class=\"t-typ\">ArraySlice<\/span>&lt;<span class=\"t-typ\">Int<\/span>&gt;<\/code> or any <code><span class=\"t-typ\">Collection<\/span><\/code>. Starting <code>left<\/code> at <code><span class=\"t-num\">0<\/span><\/code> then reads outside the range, or traps, because the slice's first index is 3, not 0. Start from <code>heights.startIndex<\/code> and <code>heights.index(before: heights.endIndex)<\/code>, and measure width with <code>heights.distance(from:to:)<\/code> — or copy into <code><span class=\"t-typ\">Array<\/span>(...)<\/code> first and say why. On a plain <code>[<span class=\"t-typ\">Int<\/span>]<\/code> the version above is correct; the moment the signature widens, the integer arithmetic is the bug.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Prove the greedy step is right.\"<\/strong> → Every pair that includes the shorter wall and a wall inside the fingers is no taller and strictly narrower than the pair just measured, so discarding that wall loses nothing. That one sentence is the answer they want.<\/li><li><strong>\"The walls aren't evenly spaced — you get their x positions, sorted.\"<\/strong> → Same algorithm with width <code>x[right] − x[left]<\/code>. Width still shrinks every step inward, so the argument still holds.<\/li><li><strong>\"How is this different from trapping rain water?\"<\/strong> → There, every wall in between matters and water sits over each position; that needs the running maximum from both sides, not a best pair. Different problem, same two-finger shape.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get an array of non negative integers. each entry is the height of a vertical wall standing at that position, one unit apart from its neighbours. pick any two walls: together with the ground they form a tank, and the water it holds is as high as the shorter of the two walls and as wide as the distance between them. the walls in between don't get in the way. return the largest amount of water any pair can hold. heights answer [2, 7, 3, 6, 4, 8, 1] 28 — the 7 at position 1 and the 8 at position 5: height 7, width 4 [5, 1, 1, 1, 5] 20 — the two outer walls: height 5, width 4 [4, 4] 4 — only one pair, height 4, width 1 constraints that matter: between 2 and 100,000 walls, each between 0 and 10,000 high. trying every pair is o(n²), about five billion pairs at the top end; the target is one pass, o(n). ::: pattern and cue two pointers from both ends, moving the weaker side. the cue is \"two\" entries of an array whose score depends on the distance between them and the smaller of the two. start with the widest pair — the two outer walls — and walk inward. every step inward loses one unit of width, so the only step that can ever pay off is one that might raise the shorter wall. ::: ::: approach put one finger on the first wall and one on the last. work out the water between them and keep the best seen so far. then move the finger that sits on the shorter wall one step inward, and repeat until the fingers meet. why moving the shorter wall is safe: pair the shorter wall with any wall closer in than the other finger, and the water is capped by that shorter wall's height while the width only shrinks — every one of those pairs is worse than the one just measured. so the shorter wall has nothing left to offer, and it can be dropped. moving the taller wall instead can never help, because the shorter wall still caps the height. on a tie either finger can move: neither wall can do better with anything in between. time o(n): each step moves one finger, and they meet after n − 1 steps. space o(1): two indices and a running best. ::: ::: swift solution swift func maxarea(_ heights: [int]) int { var left = 0 var right = heights.count 1 var best = 0 while left < right { let area = min(heights[left], heights[right]) (right left) best = max(best, area) if heights[left] < heights[right] { left += 1 // the shorter wall caps every narrower pair it's part of } else { right = 1 } } return best } empty and single wall input return 0 without a guard: right starts at −1 or 0, the loop condition fails, and nothing is subscripted. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, six more (empty, one wall, all walls equal, two zero walls, strictly rising heights, two walls at the 10,000 maximum), and 3,000 random arrays checked against a brute force o(n²) search over every pair. ::: ::: walk it through [2, 7, 3, 6, 4, 8, 1] left (height) right (height) water best move 0 (2) 6 (1) 1 × 6 = 6 6 right is shorter → right 0 (2) 5 (8) 2 × 5 = 10 10 left is shorter → left 1 (7) 5 (8) 7 × 4 = 28 28 left 2 (3) 5 (8) 3 × 3 = 9 28 left 3 (6) 5 (8) 6 × 2 = 12 28 left 4 (4) 5 (8) 4 × 1 = 4 28 left → fingers meet answer 28, after six measurements instead of twenty one. [4, 4] — one measurement: 4 × 1 = 4. the walls tie, the right finger moves, the fingers meet. answer 4. ::: ::: the swift trap a slice keeps its parent's indices. the follow up \"now do it for walls 3 to 9 only\" tempts you to pass heights[3...9] into a version that takes arrayslice<int or any collection . starting left at 0 then reads outside the range, or traps, because the slice's first index is 3, not 0. start from heights.startindex and heights.index(before: heights.endindex) , and measure width with heights.distance(from:to:) — or copy into array(...) first and say why. on a plain [int] the version above is correct; the moment the signature widens, the integer arithmetic is the bug. ::: ::: what they ask next \"prove the greedy step is right.\" → every pair that includes the shorter wall and a wall inside the fingers is no taller and strictly narrower than the pair just measured, so discarding that wall loses nothing. that one sentence is the answer they want. \"the walls aren't evenly spaced — you get their x positions, sorted.\" → same algorithm with width x[right] − x[left] . width still shrinks every step inward, so the argument still holds. \"how is this different from trapping rain water?\" → there, every wall in between matters and water sits over each position; that needs the running maximum from both sides, not a best pair. different problem, same two finger shape. ::: ", "outline": []}, {"slug": "sort-colors", "title": "10 · Sort Colors", "summary": "Rearrange an array of 0s, 1s and 2s so equal values sit together, in place and in one pass.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 75 · Sort Colors", "url": "https://leetcode.com/problems/sort-colors/"}, {"ref": "", "label": "Swift standard library · MutableCollection.swapAt(_:_:)", "url": "https://developer.apple.com/documentation/swift/mutablecollection/swapat(_:_:)"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get an array whose entries are only ever 0, 1 or 2 — think red, white and blue markers. Rearrange it so that all the 0s come first, then all the 1s, then all the 2s. Change the array you were given rather than returning a new one, don't call the library sort, and aim to look at each entry only once.<\/p><div class=\"scroll\"><table><thead><tr><th>Before<\/th><th>After<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><\/tr><tr><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/td><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/td><\/tr><tr><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/td><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code> — no 0s at all<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 1 and 300 entries, each 0, 1 or 2. \"In place\" means O(1) extra memory: a few index variables, no second array. Counting the three values and writing them back is a valid two-pass answer; the target is a single pass.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Three pointers partitioning in place — the Dutch national flag.<\/strong> The cue is <em>\"only three distinct values\"<\/em> plus <em>\"in place\"<\/em> and <em>\"one pass\"<\/em>. Two pointers mark where the finished 0s end and where the finished 2s begin; a third walks the unsorted middle and throws each value to the side it belongs on.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Keep three positions. Everything before <code>low<\/code> is a finished 0. Everything after <code>high<\/code> is a finished 2. Everything from <code>low<\/code> up to <code>mid<\/code> is a finished 1, and <code>mid<\/code> to <code>high<\/code> is still unseen.<\/p><p>Look at the value under <code>mid<\/code>. A 0 gets swapped to <code>low<\/code>, and both <code>low<\/code> and <code>mid<\/code> move forward. A 1 is already in the right zone, so only <code>mid<\/code> moves. A 2 gets swapped to <code>high<\/code>, and <code>high<\/code> moves back — but <code>mid<\/code> stays where it is, because the value that just arrived from the far end hasn't been looked at yet. Stop when <code>mid<\/code> passes <code>high<\/code>: nothing unseen is left.<\/p><p>Time O(n): every step either moves <code>mid<\/code> forward or <code>high<\/code> back, so there are at most n steps. Space O(1): three indices.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> sortColors(_ colors: <span class=\"t-kw\">inout<\/span> [<span class=\"t-typ\">Int<\/span>]) {\n    <span class=\"t-kw\">var<\/span> low = <span class=\"t-num\">0<\/span>                     <span class=\"t-com\">// next slot for a 0<\/span>\n    <span class=\"t-kw\">var<\/span> mid = <span class=\"t-num\">0<\/span>                     <span class=\"t-com\">// the value being looked at<\/span>\n    <span class=\"t-kw\">var<\/span> high = colors.count - <span class=\"t-num\">1<\/span>     <span class=\"t-com\">// next slot for a 2<\/span>\n\n    <span class=\"t-kw\">while<\/span> mid &lt;= high {\n        <span class=\"t-kw\">switch<\/span> colors[mid] {\n        <span class=\"t-kw\">case<\/span> <span class=\"t-num\">0<\/span>:\n            colors.swapAt(low, mid)\n            low += <span class=\"t-num\">1<\/span>\n            mid += <span class=\"t-num\">1<\/span>\n        <span class=\"t-kw\">case<\/span> <span class=\"t-num\">1<\/span>:\n            mid += <span class=\"t-num\">1<\/span>\n        <span class=\"t-kw\">default<\/span>:\n            colors.swapAt(mid, high)\n            high -= <span class=\"t-num\">1<\/span>               <span class=\"t-com\">// don&#x27;t move mid: the value that just arrived is unseen<\/span>\n        }\n    }\n}<\/code><\/pre><\/div><p>When a 0 is swapped from <code>low<\/code>, <code>mid<\/code> may move forward without looking, because whatever sat at <code>low<\/code> was already seen and was a 1 (or <code>low<\/code> and <code>mid<\/code> were the same position).<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, six more (empty, a single 0, a single 2, reversed <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>]<\/code>, all 1s, <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>]<\/code> with no 1s), and 3,000 random arrays checked against the library sort.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/strong> — low 0, mid 0, high 5<\/p><div class=\"scroll\"><table><thead><tr><th>Array<\/th><th>low<\/th><th>mid<\/th><th>high<\/th><th>Value at mid<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>0<\/td><td>0<\/td><td>5<\/td><td>2<\/td><td>swap with high (a 2 for a 2); high → 4<\/td><\/tr><tr><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>0<\/td><td>0<\/td><td>4<\/td><td>2<\/td><td>swap with high; high → 3<\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>0<\/td><td>0<\/td><td>3<\/td><td>0<\/td><td>swap with low (itself); low, mid → 1<\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>1<\/td><td>1<\/td><td>3<\/td><td>0<\/td><td>swap with low (itself); low, mid → 2<\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>2<\/td><td>2<\/td><td>3<\/td><td>1<\/td><td>mid → 3<\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>2<\/td><td>3<\/td><td>3<\/td><td>1<\/td><td>mid → 4, passes high → stop<\/td><\/tr><\/tbody><\/table><\/div><p>The first two rows are the reason <code>mid<\/code> holds still after a 2: the value swapped in was another 2, and it would have been left in the middle had <code>mid<\/code> moved on.<\/p><p><strong><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/strong> — the 1 at position 0 stays and <code>mid<\/code> moves to 1. The 0 there is swapped with <code>low<\/code> (position 0): <code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>]<\/code>. <code>mid<\/code> becomes 2, passes <code>high<\/code> at 1, stop.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong><code>swap(&amp;colors[i], &amp;colors[j])<\/code> breaks exclusive access.<\/strong> It is the obvious spelling and it doesn't compile: two <code><span class=\"t-kw\">inout<\/span><\/code> accesses to the same array overlap, and Swift rejects it (\"overlapping accesses to 'colors'\"). Use <code>colors.swapAt(i, j)<\/code>, which is the array's own method and is fine when <code>i == j<\/code> — which happens here every time <code>low<\/code> and <code>mid<\/code> sit together. The second trap is the <code><span class=\"t-kw\">inout<\/span><\/code> itself: <code><span class=\"t-kw\">func<\/span> sortColors(_ colors: [<span class=\"t-typ\">Int<\/span>])<\/code> receives a constant copy, so an answer that \"sorts in place\" into a local <code><span class=\"t-kw\">var<\/span><\/code> changes nothing the caller can see. Say \"in place\" and write <code><span class=\"t-kw\">inout<\/span><\/code> and <code>&amp;<\/code> at the call site.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Why not just count them?\"<\/strong> → Counting 0s, 1s and 2s and writing them back is O(n) and O(1), but takes two passes and only works because the values carry no payload. If each entry were a record sorted by a colour key, overwriting would lose the records; swapping keeps them.<\/li><li><strong>\"Is it stable?\"<\/strong> → No. Swaps with the far end reorder equal keys. A stable version needs O(n) extra memory — three buckets appended in order.<\/li><li><strong>\"Now there are k colours.\"<\/strong> → Counting sort in O(n + k), or partition repeatedly: split around the middle colour and recurse, O(n log k). The three-pointer trick doesn't generalise past three.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get an array whose entries are only ever 0, 1 or 2 — think red, white and blue markers. rearrange it so that all the 0s come first, then all the 1s, then all the 2s. change the array you were given rather than returning a new one, don't call the library sort, and aim to look at each entry only once. before after [2, 0, 1, 1, 0, 2] [0, 0, 1, 1, 2, 2] [1, 0] [0, 1] [2, 2, 1] [1, 2, 2] — no 0s at all constraints that matter: between 1 and 300 entries, each 0, 1 or 2. \"in place\" means o(1) extra memory: a few index variables, no second array. counting the three values and writing them back is a valid two pass answer; the target is a single pass. ::: pattern and cue three pointers partitioning in place — the dutch national flag. the cue is \"only three distinct values\" plus \"in place\" and \"one pass\" . two pointers mark where the finished 0s end and where the finished 2s begin; a third walks the unsorted middle and throws each value to the side it belongs on. ::: ::: approach keep three positions. everything before low is a finished 0. everything after high is a finished 2. everything from low up to mid is a finished 1, and mid to high is still unseen. look at the value under mid . a 0 gets swapped to low , and both low and mid move forward. a 1 is already in the right zone, so only mid moves. a 2 gets swapped to high , and high moves back — but mid stays where it is, because the value that just arrived from the far end hasn't been looked at yet. stop when mid passes high : nothing unseen is left. time o(n): every step either moves mid forward or high back, so there are at most n steps. space o(1): three indices. ::: ::: swift solution swift func sortcolors(_ colors: inout [int]) { var low = 0 // next slot for a 0 var mid = 0 // the value being looked at var high = colors.count 1 // next slot for a 2 while mid <= high { switch colors[mid] { case 0: colors.swapat(low, mid) low += 1 mid += 1 case 1: mid += 1 default: colors.swapat(mid, high) high = 1 // don't move mid: the value that just arrived is unseen } } } when a 0 is swapped from low , mid may move forward without looking, because whatever sat at low was already seen and was a 1 (or low and mid were the same position). verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, six more (empty, a single 0, a single 2, reversed [2, 1, 0] , all 1s, [2, 0, 2, 0] with no 1s), and 3,000 random arrays checked against the library sort. ::: ::: walk it through [2, 0, 1, 1, 0, 2] — low 0, mid 0, high 5 array low mid high value at mid action [2, 0, 1, 1, 0, 2] 0 0 5 2 swap with high (a 2 for a 2); high → 4 [2, 0, 1, 1, 0, 2] 0 0 4 2 swap with high; high → 3 [0, 0, 1, 1, 2, 2] 0 0 3 0 swap with low (itself); low, mid → 1 [0, 0, 1, 1, 2, 2] 1 1 3 0 swap with low (itself); low, mid → 2 [0, 0, 1, 1, 2, 2] 2 2 3 1 mid → 3 [0, 0, 1, 1, 2, 2] 2 3 3 1 mid → 4, passes high → stop the first two rows are the reason mid holds still after a 2: the value swapped in was another 2, and it would have been left in the middle had mid moved on. [1, 0] — the 1 at position 0 stays and mid moves to 1. the 0 there is swapped with low (position 0): [0, 1] . mid becomes 2, passes high at 1, stop. ::: ::: the swift trap swap(&colors[i], &colors[j]) breaks exclusive access. it is the obvious spelling and it doesn't compile: two inout accesses to the same array overlap, and swift rejects it (\"overlapping accesses to 'colors'\"). use colors.swapat(i, j) , which is the array's own method and is fine when i == j — which happens here every time low and mid sit together. the second trap is the inout itself: func sortcolors(_ colors: [int]) receives a constant copy, so an answer that \"sorts in place\" into a local var changes nothing the caller can see. say \"in place\" and write inout and & at the call site. ::: ::: what they ask next \"why not just count them?\" → counting 0s, 1s and 2s and writing them back is o(n) and o(1), but takes two passes and only works because the values carry no payload. if each entry were a record sorted by a colour key, overwriting would lose the records; swapping keeps them. \"is it stable?\" → no. swaps with the far end reorder equal keys. a stable version needs o(n) extra memory — three buckets appended in order. \"now there are k colours.\" → counting sort in o(n + k), or partition repeatedly: split around the middle colour and recurse, o(n log k). the three pointer trick doesn't generalise past three. ::: ", "outline": []}, {"slug": "best-time-to-buy-and-sell-stock", "title": "11 · Best Time to Buy and Sell Stock", "summary": "Given a share's price on each day, find the most you could make by buying once and selling once later.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 121 · Best Time to Buy and Sell Stock", "url": "https://leetcode.com/problems/best-time-to-buy-and-sell-stock/"}], "html": "<p><em>Easy · G — the warm-up for this block<\/em><\/p><p>You get an array of prices, one per day, in order. You may buy one share on one day and sell it on a <strong>later<\/strong> day. Return the largest profit that plan can make. If prices only ever fall, the best plan is not to trade at all, and the answer is 0 — never a negative number.<\/p><div class=\"scroll\"><table><thead><tr><th>Prices<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">8<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">6<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">4<\/span>]<\/code><\/td><td><code><span class=\"t-num\">5<\/span><\/code> — buy at 2 on day 3, sell at 7 on day 4<\/td><\/tr><tr><td><code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">10<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><td><code><span class=\"t-num\">6<\/span><\/code> — buy at 4, sell at 10; the cheapest day, 1, comes too late to beat it<\/td><\/tr><tr><td><code>[<span class=\"t-num\">9<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/td><td><code><span class=\"t-num\">0<\/span><\/code> — prices only fall, so don't trade<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 1 and 100,000 days, each price between 0 and 10,000. Checking every buy day against every later sell day is O(n²), about five billion pairs at the top end; the target is a single pass, O(n), with O(1) memory.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Sliding window with a running minimum.<\/strong> The cue is <em>\"buy on one day, sell on a later day\"<\/em>: a pair of positions where the left one must come first, scanned once from left to right. The left edge of the window sits on the cheapest day seen so far; the right edge is today. The left edge only ever jumps forward, to a new low.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Walk through the days once and remember two numbers: the cheapest price seen so far, and the best profit seen so far. On each day, first ask \"is today the cheapest day yet?\" and update the cheapest price if so. Then ask \"if I sold today, having bought on the cheapest day before it, would that beat my best?\" and update the best profit if so. At the end, the best profit is the answer.<\/p><p>That covers every useful plan: for any sell day, the best buy day is simply the cheapest day before it, and the running minimum is exactly that.<\/p><p>Time O(n): one look at each day. Space O(1): two numbers.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> maxProfit(_ prices: [<span class=\"t-typ\">Int<\/span>]) -&gt; <span class=\"t-typ\">Int<\/span> {\n    <span class=\"t-kw\">var<\/span> cheapest = <span class=\"t-typ\">Int<\/span>.max\n    <span class=\"t-kw\">var<\/span> best = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">for<\/span> price <span class=\"t-kw\">in<\/span> prices {\n        cheapest = min(cheapest, price)          <span class=\"t-com\">// best day to have bought, up to today<\/span>\n        best = max(best, price - cheapest)       <span class=\"t-com\">// sell today against that day<\/span>\n    }\n    <span class=\"t-kw\">return<\/span> best\n}<\/code><\/pre><\/div><p>Updating <code>cheapest<\/code> before computing the profit means a same-day buy and sell is considered, which is worth 0 and so never wins — harmless, and it removes a special case. <code>best<\/code> starts at 0, so falling prices and an empty array both return 0.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, five more (empty, one day, flat prices, a single 0-to-10,000 jump, and a zigzag), and 3,000 random arrays checked against a brute-force search over every buy and sell pair.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">10<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Day<\/th><th>Price<\/th><th>Cheapest so far<\/th><th>Profit selling today<\/th><th>Best<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>4<\/td><td>4<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>10<\/td><td>4<\/td><td>6<\/td><td>6<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>6<\/td><\/tr><tr><td>3<\/td><td>5<\/td><td>1<\/td><td>4<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div><p>Answer 6. This is the example that sinks \"find the lowest price, then the highest price after it\": the lowest price is 1, and the best you can do from there is 4.<\/p><p><strong><code>[<span class=\"t-num\">9<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/strong> — every day is a new low, so every \"profit selling today\" is 0 and <code>best<\/code> never moves off 0.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>A one-liner that is secretly O(n²).<\/strong> Swift makes it tempting to write <code>prices.indices.map { prices[$<span class=\"t-num\">0<\/span>] - (prices[...$<span class=\"t-num\">0<\/span>].min() ?? <span class=\"t-num\">0<\/span>) }.max()<\/code>. It reads like one pass and it compiles cleanly, but <code>prices[...$<span class=\"t-num\">0<\/span>]<\/code> is an <code><span class=\"t-typ\">ArraySlice<\/span><\/code> and <code>.min()<\/code> walks the whole slice every time, so the work grows with the square of the length — the brute force with nicer spelling. Slicing is O(1); anything you call on the slice is not. The other half of the trap is <code>prices.min()<\/code> returning an <code><span class=\"t-typ\">Optional<\/span><\/code>: starting from <code>prices[<span class=\"t-num\">0<\/span>]<\/code> or <code>prices.first!<\/code> crashes on an empty array, which is why the solution starts <code>cheapest<\/code> at <code><span class=\"t-typ\">Int<\/span>.max<\/code>. <code>price - <span class=\"t-typ\">Int<\/span>.max<\/code> is negative, not an overflow, so it is safe here.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Return the two days, not the profit.\"<\/strong> → Keep the index of the cheapest day alongside its price, and record that index plus today's index whenever <code>best<\/code> improves.<\/li><li><strong>\"You can trade as many times as you like, one share at a time.\"<\/strong> → Add up every rise from one day to the next: <code>max(<span class=\"t-num\">0<\/span>, prices[i] − prices[i − <span class=\"t-num\">1<\/span>])<\/code> summed. Greedy, O(n).<\/li><li><strong>\"At most two trades.\"<\/strong> → Four running numbers — best after first buy, first sell, second buy, second sell — updated in that order each day. Still O(n), O(1); it's the step towards dynamic programming.<\/li><\/ul><\/div><\/details>", "text": " easy · g — the warm up for this block you get an array of prices, one per day, in order. you may buy one share on one day and sell it on a later day. return the largest profit that plan can make. if prices only ever fall, the best plan is not to trade at all, and the answer is 0 — never a negative number. prices answer [8, 3, 6, 2, 7, 4] 5 — buy at 2 on day 3, sell at 7 on day 4 [4, 10, 1, 5] 6 — buy at 4, sell at 10; the cheapest day, 1, comes too late to beat it [9, 7, 4, 1] 0 — prices only fall, so don't trade constraints that matter: between 1 and 100,000 days, each price between 0 and 10,000. checking every buy day against every later sell day is o(n²), about five billion pairs at the top end; the target is a single pass, o(n), with o(1) memory. ::: pattern and cue sliding window with a running minimum. the cue is \"buy on one day, sell on a later day\" : a pair of positions where the left one must come first, scanned once from left to right. the left edge of the window sits on the cheapest day seen so far; the right edge is today. the left edge only ever jumps forward, to a new low. ::: ::: approach walk through the days once and remember two numbers: the cheapest price seen so far, and the best profit seen so far. on each day, first ask \"is today the cheapest day yet?\" and update the cheapest price if so. then ask \"if i sold today, having bought on the cheapest day before it, would that beat my best?\" and update the best profit if so. at the end, the best profit is the answer. that covers every useful plan: for any sell day, the best buy day is simply the cheapest day before it, and the running minimum is exactly that. time o(n): one look at each day. space o(1): two numbers. ::: ::: swift solution swift func maxprofit(_ prices: [int]) int { var cheapest = int.max var best = 0 for price in prices { cheapest = min(cheapest, price) // best day to have bought, up to today best = max(best, price cheapest) // sell today against that day } return best } updating cheapest before computing the profit means a same day buy and sell is considered, which is worth 0 and so never wins — harmless, and it removes a special case. best starts at 0, so falling prices and an empty array both return 0. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, five more (empty, one day, flat prices, a single 0 to 10,000 jump, and a zigzag), and 3,000 random arrays checked against a brute force search over every buy and sell pair. ::: ::: walk it through [4, 10, 1, 5] day price cheapest so far profit selling today best 0 4 4 0 0 1 10 4 6 6 2 1 1 0 6 3 5 1 4 6 answer 6. this is the example that sinks \"find the lowest price, then the highest price after it\": the lowest price is 1, and the best you can do from there is 4. [9, 7, 4, 1] — every day is a new low, so every \"profit selling today\" is 0 and best never moves off 0. ::: ::: the swift trap a one liner that is secretly o(n²). swift makes it tempting to write prices.indices.map { prices[$0] (prices[...$0].min() ?? 0) }.max() . it reads like one pass and it compiles cleanly, but prices[...$0] is an arrayslice and .min() walks the whole slice every time, so the work grows with the square of the length — the brute force with nicer spelling. slicing is o(1); anything you call on the slice is not. the other half of the trap is prices.min() returning an optional : starting from prices[0] or prices.first! crashes on an empty array, which is why the solution starts cheapest at int.max . price int.max is negative, not an overflow, so it is safe here. ::: ::: what they ask next \"return the two days, not the profit.\" → keep the index of the cheapest day alongside its price, and record that index plus today's index whenever best improves. \"you can trade as many times as you like, one share at a time.\" → add up every rise from one day to the next: max(0, prices[i] − prices[i − 1]) summed. greedy, o(n). \"at most two trades.\" → four running numbers — best after first buy, first sell, second buy, second sell — updated in that order each day. still o(n), o(1); it's the step towards dynamic programming. ::: ", "outline": []}, {"slug": "longest-substring-without-repeating-characters", "title": "12 · Longest Substring Without Repeating Characters", "summary": "Find the length of the longest run of consecutive characters in a string where no character appears twice.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 3 · Longest Substring Without Repeating Characters", "url": "https://leetcode.com/problems/longest-substring-without-repeating-characters/"}, {"ref": "", "label": "Swift standard library · Character", "url": "https://developer.apple.com/documentation/swift/character"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get a string. Look at every stretch of <strong>consecutive<\/strong> characters in it and keep only the ones where no character appears more than once. Return the length of the longest such stretch. Spaces, digits and symbols count as characters like any other. A stretch has to be contiguous: picking letters from here and there doesn't count.<\/p><div class=\"scroll\"><table><thead><tr><th>Text<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td><code><span class=\"t-str\">&quot;kayak&quot;<\/span><\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code> — <code><span class=\"t-str\">&quot;kay&quot;<\/span><\/code> or <code><span class=\"t-str\">&quot;yak&quot;<\/span><\/code><\/td><\/tr><tr><td><code><span class=\"t-str\">&quot;abba&quot;<\/span><\/code><\/td><td><code><span class=\"t-num\">2<\/span><\/code> — <code><span class=\"t-str\">&quot;ab&quot;<\/span><\/code> or <code><span class=\"t-str\">&quot;ba&quot;<\/span><\/code>; the edge case that catches most first attempts<\/td><\/tr><tr><td><code><span class=\"t-str\">&quot;zzzz&quot;<\/span><\/code><\/td><td><code><span class=\"t-num\">1<\/span><\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 50,000 characters — letters, digits, symbols and spaces. Checking every stretch is O(n²) stretches, and checking each one for repeats makes it worse; the target is one pass, O(n).<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Sliding window with a last-seen map.<\/strong> The cue is <em>\"longest\"<\/em> plus <em>\"substring\"<\/em> — a contiguous stretch — plus a condition that the stretch either meets or breaks (<em>\"without repeating\"<\/em>). Grow the window on the right one character at a time; when the new character breaks the rule, move the left edge just far enough to fix it, and never move it back.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Read the string from left to right, keeping a window of characters that has no repeats, and a note of where each character was last seen. For each new character, check whether its last appearance is inside the current window. If it is, the window has to shrink: its left edge jumps to the position just after that earlier copy. If the earlier copy is already outside the window — to the left of the left edge — ignore it. Then record the character's new position, and compare the window's length with the best so far.<\/p><p>Time O(n): the right edge visits each character once, and the left edge only jumps forward. Space O(k), where k is the number of distinct characters — at most the alphabet size.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> lengthOfLongestSubstring(_ text: <span class=\"t-typ\">String<\/span>) -&gt; <span class=\"t-typ\">Int<\/span> {\n    <span class=\"t-kw\">var<\/span> lastSeen: [<span class=\"t-typ\">Character<\/span>: <span class=\"t-typ\">Int<\/span>] = [:]\n    <span class=\"t-kw\">var<\/span> left = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> best = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">for<\/span> (right, character) <span class=\"t-kw\">in<\/span> text.enumerated() {\n        <span class=\"t-kw\">if<\/span> <span class=\"t-kw\">let<\/span> seen = lastSeen[character], seen &gt;= left {\n            left = seen + <span class=\"t-num\">1<\/span>                      <span class=\"t-com\">// jump past the earlier copy, never backwards<\/span>\n        }\n        lastSeen[character] = right\n        best = max(best, right - left + <span class=\"t-num\">1<\/span>)\n    }\n    <span class=\"t-kw\">return<\/span> best\n}<\/code><\/pre><\/div><p><code>enumerated()<\/code> gives each character with its position counted from 0, so the code never subscripts the string. The <code>seen &gt;= left<\/code> check is the whole difficulty: drop it and <code><span class=\"t-str\">&quot;abba&quot;<\/span><\/code> returns 3.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, seven more (empty, one character, all distinct, text with spaces, <code><span class=\"t-str\">&quot;dvdf&quot;<\/span><\/code>, an accented letter written two different ways, a repeated flag emoji), and 3,000 random strings checked against a brute-force search over every start position.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code><span class=\"t-str\">&quot;kayak&quot;<\/span><\/code><\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Right<\/th><th>Character<\/th><th>Last seen<\/th><th>Left after<\/th><th>Window<\/th><th>Best<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>k<\/td><td>—<\/td><td>0<\/td><td><code>k<\/code><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>a<\/td><td>—<\/td><td>0<\/td><td><code>ka<\/code><\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>y<\/td><td>—<\/td><td>0<\/td><td><code>kay<\/code><\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>a<\/td><td>1 (inside)<\/td><td>2<\/td><td><code>ya<\/code><\/td><td>3<\/td><\/tr><tr><td>4<\/td><td>k<\/td><td>0 (outside)<\/td><td>2<\/td><td><code>yak<\/code><\/td><td>3<\/td><\/tr><\/tbody><\/table><\/div><p>Answer 3. The last row is the subtle one: <code>k<\/code> was seen before, but at position 0, which the window already left behind, so nothing moves.<\/p><p><strong><code><span class=\"t-str\">&quot;abba&quot;<\/span><\/code><\/strong> — <code>a<\/code>, <code>b<\/code> give a window of 2. The second <code>b<\/code> was last seen at 1, inside the window, so left jumps to 2: window <code>b<\/code>. The final <code>a<\/code> was last seen at 0, which is behind left, so left stays at 2: window <code>ba<\/code>, length 2. Without the inside-the-window check, left would jump <em>back<\/em> to 1 and report <code>bba<\/code>, length 3 — a window with <code>b<\/code> twice.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>You can't write <code>text[i]<\/code>, and counting bytes gives the wrong answer.<\/strong> A Swift <code><span class=\"t-typ\">String<\/span><\/code> has no integer subscript, so the C-style loop doesn't compile. The two common escapes behave differently. <code><span class=\"t-typ\">Array<\/span>(text)<\/code> gives you <code>[<span class=\"t-typ\">Character<\/span>]<\/code> with integer indices — fine, O(n) memory, and correct. <code><span class=\"t-typ\">Array<\/span>(text.utf8)<\/code> is faster and also compiles, but it counts bytes, not characters: <code><span class=\"t-str\">&quot;é&quot;<\/span><\/code> written as a single code point and <code><span class=\"t-str\">&quot;e&quot;<\/span><\/code> followed by a combining accent are the <strong>same<\/strong> <code><span class=\"t-typ\">Character<\/span><\/code> in Swift, and a flag emoji is one <code><span class=\"t-typ\">Character<\/span><\/code> made of eight bytes. On <code><span class=\"t-str\">&quot;\\u{E9}e\\u{301}&quot;<\/span><\/code> the right answer is 1; the byte version says 3. If the interviewer says \"ASCII only\", bytes are a fair optimisation — say that you're making that assumption out loud.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"At most k distinct characters, instead of no repeats.\"<\/strong> → Same window, but keep a count per character; when the number of distinct keys passes k, move left forward, decrementing counts and removing keys that hit 0, until it's back to k.<\/li><li><strong>\"Return the substring itself.\"<\/strong> → Track the left and right of the best window as you go, then build the string from those offsets once at the end.<\/li><li><strong>\"Why a dictionary and not an array of 128?\"<\/strong> → An array indexed by ASCII value is faster and fixed-size, but only works if the input is ASCII. The dictionary is correct for any <code><span class=\"t-typ\">Character<\/span><\/code>.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get a string. look at every stretch of consecutive characters in it and keep only the ones where no character appears more than once. return the length of the longest such stretch. spaces, digits and symbols count as characters like any other. a stretch has to be contiguous: picking letters from here and there doesn't count. text answer \"kayak\" 3 — \"kay\" or \"yak\" \"abba\" 2 — \"ab\" or \"ba\" ; the edge case that catches most first attempts \"zzzz\" 1 constraints that matter: up to 50,000 characters — letters, digits, symbols and spaces. checking every stretch is o(n²) stretches, and checking each one for repeats makes it worse; the target is one pass, o(n). ::: pattern and cue sliding window with a last seen map. the cue is \"longest\" plus \"substring\" — a contiguous stretch — plus a condition that the stretch either meets or breaks ( \"without repeating\" ). grow the window on the right one character at a time; when the new character breaks the rule, move the left edge just far enough to fix it, and never move it back. ::: ::: approach read the string from left to right, keeping a window of characters that has no repeats, and a note of where each character was last seen. for each new character, check whether its last appearance is inside the current window. if it is, the window has to shrink: its left edge jumps to the position just after that earlier copy. if the earlier copy is already outside the window — to the left of the left edge — ignore it. then record the character's new position, and compare the window's length with the best so far. time o(n): the right edge visits each character once, and the left edge only jumps forward. space o(k), where k is the number of distinct characters — at most the alphabet size. ::: ::: swift solution swift func lengthoflongestsubstring(_ text: string) int { var lastseen: [character: int] = [:] var left = 0 var best = 0 for (right, character) in text.enumerated() { if let seen = lastseen[character], seen = left { left = seen + 1 // jump past the earlier copy, never backwards } lastseen[character] = right best = max(best, right left + 1) } return best } enumerated() gives each character with its position counted from 0, so the code never subscripts the string. the seen = left check is the whole difficulty: drop it and \"abba\" returns 3. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, seven more (empty, one character, all distinct, text with spaces, \"dvdf\" , an accented letter written two different ways, a repeated flag emoji), and 3,000 random strings checked against a brute force search over every start position. ::: ::: walk it through \"kayak\" right character last seen left after window best 0 k — 0 k 1 1 a — 0 ka 2 2 y — 0 kay 3 3 a 1 (inside) 2 ya 3 4 k 0 (outside) 2 yak 3 answer 3. the last row is the subtle one: k was seen before, but at position 0, which the window already left behind, so nothing moves. \"abba\" — a , b give a window of 2. the second b was last seen at 1, inside the window, so left jumps to 2: window b . the final a was last seen at 0, which is behind left, so left stays at 2: window ba , length 2. without the inside the window check, left would jump back to 1 and report bba , length 3 — a window with b twice. ::: ::: the swift trap you can't write text[i] , and counting bytes gives the wrong answer. a swift string has no integer subscript, so the c style loop doesn't compile. the two common escapes behave differently. array(text) gives you [character] with integer indices — fine, o(n) memory, and correct. array(text.utf8) is faster and also compiles, but it counts bytes, not characters: \"é\" written as a single code point and \"e\" followed by a combining accent are the same character in swift, and a flag emoji is one character made of eight bytes. on \"\\u{e9}e\\u{301}\" the right answer is 1; the byte version says 3. if the interviewer says \"ascii only\", bytes are a fair optimisation — say that you're making that assumption out loud. ::: ::: what they ask next \"at most k distinct characters, instead of no repeats.\" → same window, but keep a count per character; when the number of distinct keys passes k, move left forward, decrementing counts and removing keys that hit 0, until it's back to k. \"return the substring itself.\" → track the left and right of the best window as you go, then build the string from those offsets once at the end. \"why a dictionary and not an array of 128?\" → an array indexed by ascii value is faster and fixed size, but only works if the input is ascii. the dictionary is correct for any character . ::: ", "outline": []}], "minutes": 306, "sources": [{"ref": "", "label": "Zalando · Technical interview for software engineers", "url": "https://jobs.zalando.com/en/blog/technical-interview-for-software-engineers"}, {"ref": "", "label": "Grind 75", "url": "https://www.techinterviewhandbook.org/grind75"}, {"ref": "", "label": "Blind 75 (original list)", "url": "https://www.teamblind.com/post/New-Year-Gift---Curated-List-of-Top-75-LeetCode-Questions-to-Save-Your-Time-OaM1orEU"}, {"ref": "", "label": "LeetCode 1 · Two Sum", "url": "https://leetcode.com/problems/two-sum/"}, {"ref": "", "label": "Swift standard library · Dictionary", "url": "https://developer.apple.com/documentation/swift/dictionary"}, {"ref": "", "label": "LeetCode 49 · Group Anagrams", "url": "https://leetcode.com/problems/group-anagrams/"}, {"ref": "", "label": "Swift standard library · Dictionary.init(grouping:by:)", "url": "https://developer.apple.com/documentation/swift/dictionary/init(grouping:by:)"}, {"ref": "SE-0206", "label": "Hashable Enhancements (per-process hash seeding)", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0206-hashable-enhancements.md"}, {"ref": "", "label": "LeetCode 347 · Top K Frequent Elements", "url": "https://leetcode.com/problems/top-k-frequent-elements/"}, {"ref": "", "label": "Swift standard library · Array.prefix(_:)", "url": "https://developer.apple.com/documentation/swift/array/prefix(_:)"}, {"ref": "", "label": "Swift Collections · Heap", "url": "https://github.com/apple/swift-collections"}, {"ref": "", "label": "LeetCode 128 · Longest Consecutive Sequence", "url": "https://leetcode.com/problems/longest-consecutive-sequence/"}, {"ref": "", "label": "Swift standard library · Set", "url": "https://developer.apple.com/documentation/swift/set"}, {"ref": "", "label": "The Swift Programming Language · Overflow Operators", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/advancedoperators/#Overflow-Operators"}, {"ref": "", "label": "LeetCode 560 · Subarray Sum Equals K", "url": "https://leetcode.com/problems/subarray-sum-equals-k/"}, {"ref": "", "label": "Swift standard library · Dictionary.subscript(_:default:)", "url": "https://developer.apple.com/documentation/swift/dictionary/subscript(_:default:)-45arb"}, {"ref": "", "label": "LeetCode 125 · Valid Palindrome", "url": "https://leetcode.com/problems/valid-palindrome/"}, {"ref": "", "label": "Swift standard library · String.Index", "url": "https://developer.apple.com/documentation/swift/string/index"}, {"ref": "", "label": "Swift standard library · Character.isLetter", "url": "https://developer.apple.com/documentation/swift/character/isletter"}, {"ref": "", "label": "LeetCode 167 · Two Sum II — Input Array Is Sorted", "url": "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"}, {"ref": "", "label": "Swift standard library · addingReportingOverflow(_:)", "url": "https://developer.apple.com/documentation/swift/int/addingreportingoverflow(_:)"}, {"ref": "", "label": "LeetCode 15 · 3Sum", "url": "https://leetcode.com/problems/3sum/"}, {"ref": "", "label": "Swift standard library · Hashable", "url": "https://developer.apple.com/documentation/swift/hashable"}, {"ref": "", "label": "LeetCode 11 · Container With Most Water", "url": "https://leetcode.com/problems/container-with-most-water/"}, {"ref": "", "label": "LeetCode 75 · Sort Colors", "url": "https://leetcode.com/problems/sort-colors/"}, {"ref": "", "label": "Swift standard library · MutableCollection.swapAt(_:_:)", "url": "https://developer.apple.com/documentation/swift/mutablecollection/swapat(_:_:)"}, {"ref": "", "label": "LeetCode 121 · Best Time to Buy and Sell Stock", "url": "https://leetcode.com/problems/best-time-to-buy-and-sell-stock/"}, {"ref": "", "label": "LeetCode 3 · Longest Substring Without Repeating Characters", "url": "https://leetcode.com/problems/longest-substring-without-repeating-characters/"}, {"ref": "", "label": "Swift standard library · Character", "url": "https://developer.apple.com/documentation/swift/character"}]}, {"title": "Swift Concurrency", "slug": "swift-concurrency", "tagline": "How it actually works, from cores upward", "summary": "Threads, tasks, actors and isolation — built up from first principles, with the mechanism from Apple's own material. Answers the three questions that stay confusing: what an actor really is, how it differs from a thread, and why @MainActor is not the main thread.", "status": "complete", "accentIndex": 0, "chapters": [{"slug": "why-concurrency-exists", "title": "Why concurrency exists", "summary": "Cores, threads, and the two genuinely different reasons one thread isn't enough.", "minutes": "6", "sources": [{"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}], "html": "<p>Nothing in this chapter is Swift. It is the ground everything else stands on, and skipping it is why so many explanations of actors don't land.<\/p><h2 id=\"what-a-computer-actually-does\">What a computer actually does<\/h2><p>A processor core does one thing: read an instruction, carry it out, read the next. One at a time, in order, very fast.<\/p><p>A modern iPhone has several cores — six is typical. An Apple Watch has two. Each core is an independent instruction-follower. Six cores means six instructions genuinely happening at the same instant, and not one more.<\/p><p>That is the hard limit everything else is built on top of. Whenever an app appears to be \"doing many things at once\", it is either doing at most six things at once, or taking turns very quickly.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The office has <strong>six desks<\/strong>, and a desk is the only place work can actually happen. Six is the building's real capacity and it never changes. Everything that follows is about getting more done than six-things-at-once out of six desks. <strong>The desks are the cores.<\/strong> Hold onto that — people arrive in the next section, and people are a different thing.<\/p><\/blockquote><h2 id=\"what-a-thread-is\">What a thread is<\/h2><p>A <strong>thread<\/strong> is one stream of instructions with its own place to keep track of where it is — its stack of half-finished work. The operating system owns threads. It decides which thread runs on which core, and when to take a core away from one and give it to another.<\/p><p>Two things matter for everything that follows.<\/p><p><strong>A thread is expensive.<\/strong> It has a stack — memory reserved up front, typically half a megabyte or more — plus bookkeeping inside the kernel. You can have thousands, but each costs real memory whether it is doing anything or not.<\/p><p><strong>Swapping threads is expensive.<\/strong> When the OS takes a core from thread A and gives it to thread B, it saves everything A was doing and loads everything B was doing. That is a <strong>context switch<\/strong>. Individually microseconds; done constantly, it becomes the main thing the CPU is doing.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p><strong>A thread is a worker.<\/strong> That stays true for the whole of this topic — wherever you see <em>worker<\/em> or <em>staff<\/em>, it means a thread and nothing else ever does.<\/p><p>A worker is a person the company employs. They have their own locker holding their own pile of half-finished paperwork, and the locker is theirs whether or not they are currently busy. That is what makes hiring expensive.<\/p><p><strong>Workers and desks are not the same thing, and this is where people trip.<\/strong> You can employ ninety people. You still have six desks. At any instant at most six of your employees are sitting down working; the rest stand around holding paperwork. Getting one up so another can sit means packing one pile away and unpacking another — <strong>that shuffling is the context switch.<\/strong><\/p><\/blockquote><h2 id=\"why-one-thread-isn-t-enough\">Why one thread isn't enough<\/h2><p>Two reasons, and they are genuinely different problems. Keeping them apart is the single most useful distinction in the subject.<\/p><p><strong>Reason one: waiting.<\/strong> Most of what an app does is wait. For a server. For a file. For the user. While a thread waits it occupies a core and does nothing. The work isn't slow — the <em>waiting<\/em> is slow, and the thread is stuck in it.<\/p><p><strong>Reason two: actual work.<\/strong> Some things take real time because there is real computing to do. Decoding a large image. Running a model. Resizing ten thousand photos. Nothing makes that free; somebody has to do the arithmetic.<\/p><p>The fix for waiting is <em>don't sit there<\/em> — go and do something else, come back. The fix for real work is <em>use more cores<\/em>. Different problems, different mechanisms.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Both are about a worker <strong>sitting at one of your six desks<\/strong>.<\/p><p>A worker on hold to a supplier is at a desk producing nothing. One of six desks, wasted. The fix is not another person — it is <em>get up, let someone else sit, come back when the supplier answers<\/em>.<\/p><p>A worker doing a long stocktake is at a desk producing something. Nothing is wasted; the job is simply large. More people doesn't help, because there are still six desks.<\/p><p>Confusing the two is how a company ends up hiring ninety people to fix a problem that was never about headcount — which is exactly the next chapter.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>This is the distinction Apple draws in WWDC25 between <code><span class=\"t-kw\">async<\/span><\/code> and <code><span class=\"t-atr\">@concurrent<\/span><\/code>. <code><span class=\"t-kw\">async<\/span><\/code> hides <em>latency<\/em> — it exists so a thread stops sitting in a wait. <code><span class=\"t-atr\">@concurrent<\/span><\/code> moves <em>computation<\/em> — it exists so work happens somewhere other than where you called it. Asking \"is this slow because it's waiting, or slow because it's working?\" picks the tool, and picking the wrong one is the most common design error in this area.<\/p><\/blockquote><h2 id=\"concurrency-is-not-parallelism\">Concurrency is not parallelism<\/h2><p><strong>Concurrency<\/strong> is structuring a program so several things can be <em>in progress<\/em> at once. A chef with three pans going is concurrent, with two hands.<\/p><p><strong>Parallelism<\/strong> is several things actually <em>executing<\/em> in the same instant. Two chefs. It needs more cores.<\/p><p>Concurrency is a way of organising; parallelism is a hardware capability. You can have concurrency on a single core — it is just taking turns — and it still helps enormously, because most turns are spent waiting.<\/p><h2 id=\"the-two-problems-that-follow\">The two problems that follow<\/h2><p><strong>Shared data.<\/strong> Two threads change the same thing at the same moment and one change is lost, or the thing ends up in a state that should be impossible. That is a <strong>data race<\/strong>.<\/p><p>What makes data races dangerous is not how damaging they are. It is that they are <em>rare<\/em>. It doesn't go wrong in testing. It goes wrong once, on a busy day, on a customer's phone, and you cannot reproduce it on purpose.<\/p><p><strong>Too many threads.<\/strong> Each waiting thread holds memory and generates context switches. Past a point, adding threads makes everything slower.<\/p><p>Everything in Swift concurrency answers one of those two. Chapter 3 answers the second; chapters 4 to 7 answer the first.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>One filing cabinet, open to the floor. Two workers pull the same page, both write on it, one change is lost — and nobody notices for months. Meanwhile the more people you hire, the more of them stand around waiting for that one cabinet.<\/p><\/blockquote>", "text": "nothing in this chapter is swift. it is the ground everything else stands on, and skipping it is why so many explanations of actors don't land. what a computer actually does a processor core does one thing: read an instruction, carry it out, read the next. one at a time, in order, very fast. a modern iphone has several cores — six is typical. an apple watch has two. each core is an independent instruction follower. six cores means six instructions genuinely happening at the same instant, and not one more. that is the hard limit everything else is built on top of. whenever an app appears to be \"doing many things at once\", it is either doing at most six things at once, or taking turns very quickly. in the office. the office has six desks , and a desk is the only place work can actually happen. six is the building's real capacity and it never changes. everything that follows is about getting more done than six things at once out of six desks. the desks are the cores. hold onto that — people arrive in the next section, and people are a different thing. what a thread is a thread is one stream of instructions with its own place to keep track of where it is — its stack of half finished work. the operating system owns threads. it decides which thread runs on which core, and when to take a core away from one and give it to another. two things matter for everything that follows. a thread is expensive. it has a stack — memory reserved up front, typically half a megabyte or more — plus bookkeeping inside the kernel. you can have thousands, but each costs real memory whether it is doing anything or not. swapping threads is expensive. when the os takes a core from thread a and gives it to thread b, it saves everything a was doing and loads everything b was doing. that is a context switch . individually microseconds; done constantly, it becomes the main thing the cpu is doing. in the office. a thread is a worker. that stays true for the whole of this topic — wherever you see worker or staff , it means a thread and nothing else ever does. a worker is a person the company employs. they have their own locker holding their own pile of half finished paperwork, and the locker is theirs whether or not they are currently busy. that is what makes hiring expensive. workers and desks are not the same thing, and this is where people trip. you can employ ninety people. you still have six desks. at any instant at most six of your employees are sitting down working; the rest stand around holding paperwork. getting one up so another can sit means packing one pile away and unpacking another — that shuffling is the context switch. why one thread isn't enough two reasons, and they are genuinely different problems. keeping them apart is the single most useful distinction in the subject. reason one: waiting. most of what an app does is wait. for a server. for a file. for the user. while a thread waits it occupies a core and does nothing. the work isn't slow — the waiting is slow, and the thread is stuck in it. reason two: actual work. some things take real time because there is real computing to do. decoding a large image. running a model. resizing ten thousand photos. nothing makes that free; somebody has to do the arithmetic. the fix for waiting is don't sit there — go and do something else, come back. the fix for real work is use more cores . different problems, different mechanisms. in the office. both are about a worker sitting at one of your six desks . a worker on hold to a supplier is at a desk producing nothing. one of six desks, wasted. the fix is not another person — it is get up, let someone else sit, come back when the supplier answers . a worker doing a long stocktake is at a desk producing something. nothing is wasted; the job is simply large. more people doesn't help, because there are still six desks. confusing the two is how a company ends up hiring ninety people to fix a problem that was never about headcount — which is exactly the next chapter. under the hood. this is the distinction apple draws in wwdc25 between async and @concurrent . async hides latency — it exists so a thread stops sitting in a wait. @concurrent moves computation — it exists so work happens somewhere other than where you called it. asking \"is this slow because it's waiting, or slow because it's working?\" picks the tool, and picking the wrong one is the most common design error in this area. concurrency is not parallelism concurrency is structuring a program so several things can be in progress at once. a chef with three pans going is concurrent, with two hands. parallelism is several things actually executing in the same instant. two chefs. it needs more cores. concurrency is a way of organising; parallelism is a hardware capability. you can have concurrency on a single core — it is just taking turns — and it still helps enormously, because most turns are spent waiting. the two problems that follow shared data. two threads change the same thing at the same moment and one change is lost, or the thing ends up in a state that should be impossible. that is a data race . what makes data races dangerous is not how damaging they are. it is that they are rare . it doesn't go wrong in testing. it goes wrong once, on a busy day, on a customer's phone, and you cannot reproduce it on purpose. too many threads. each waiting thread holds memory and generates context switches. past a point, adding threads makes everything slower. everything in swift concurrency answers one of those two. chapter 3 answers the second; chapters 4 to 7 answer the first. in the office. one filing cabinet, open to the floor. two workers pull the same page, both write on it, one change is lost — and nobody notices for months. meanwhile the more people you hire, the more of them stand around waiting for that one cabinet. ", "outline": [{"a": "what-a-computer-actually-does", "t": "What a computer actually does"}, {"a": "what-a-thread-is", "t": "What a thread is"}, {"a": "why-one-thread-isn-t-enough", "t": "Why one thread isn't enough"}, {"a": "concurrency-is-not-parallelism", "t": "Concurrency is not parallelism"}, {"a": "the-two-problems-that-follow", "t": "The two problems that follow"}]}, {"slug": "what-went-wrong-before", "title": "What went wrong before", "summary": "Callbacks, GCD thread explosion, locks — and the single root cause underneath all three.", "minutes": "5", "sources": [{"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}, {"ref": "", "label": "WWDCNotes · Behind the scenes (transcript detail)", "url": "https://wwdcnotes.com/documentation/wwdc21-10254-swift-concurrency-behind-the-scenes/"}], "html": "<p>Swift concurrency is not a new way to do the same thing. It is a response to three specific failures, and it is much easier to hold in your head if you know what it was reacting to.<\/p><h2 id=\"callbacks\">Callbacks<\/h2><p>The first answer to waiting: hand over a piece of code to run when the answer arrives, and return immediately.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code>loadUser(id) { user <span class=\"t-kw\">in<\/span>\n    loadAvatar(user) { image <span class=\"t-kw\">in<\/span>\n        resize(image) { small <span class=\"t-kw\">in<\/span>\n            display(small)          <span class=\"t-com\">// three levels deep, and no error handling yet<\/span>\n        }\n    }\n}<\/code><\/pre><\/div><p>It works, and it has three problems. It nests — each step buries the next. Errors must be threaded through by hand at every level. And nothing forces you to call the callback: forget one branch and the operation silently never finishes, with no complaint from the compiler.<\/p><h2 id=\"gcd-and-thread-explosion\">GCD, and thread explosion<\/h2><p>Grand Central Dispatch let you hand work to queues and managed threads for you. A big improvement, with one structural flaw: <strong>when a thread blocked, GCD brought up another thread<\/strong> to keep the remaining work moving.<\/p><p>Apple's own example:<\/p><blockquote class=\"aside plain\"><p>A news app updating a hundred feeds. Each network callback needs the database, and blocks waiting for it. GCD sees blocked threads with work still queued, so it creates more. On a six-core iPhone you end up with roughly <strong>sixteen times more threads than cores<\/strong>.<\/p><\/blockquote><p>Every one of those threads holds its stack. The OS tries to give each a fair share, so it context-switches constantly. The device now spends most of its energy on the bookkeeping of having too many threads.<\/p><p>This is <strong>thread explosion<\/strong>, and it is the specific failure Swift concurrency was built to make impossible.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Whenever a worker is stuck on hold, the manager hires another so the work keeps moving. Soon there are ninety-six people in a six-desk office, almost all on hold, and most of the day goes on deciding who gets to sit down.<\/p><\/blockquote><h2 id=\"locks\">Locks<\/h2><p>The standard answer to shared data: a lock. One holder at a time, everyone else waits.<\/p><p>Locks work, and they cost three things.<\/p><p>They are a <strong>convention, not a barrier<\/strong> — the data is still reachable, and the protection holds only while every piece of code remembers to take the lock, forever.<\/p><p>Two locks taken in opposite orders by two threads produce a <strong>deadlock<\/strong>, where both wait for each other permanently.<\/p><p>And a thread waiting on a lock is a blocked thread, which in a GCD world causes the section above.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A single key to the cabinet. It works — but the cabinet is still standing open, so the protection lasts exactly as long as everyone's memory. And two workers who take two keys in opposite orders wait for each other, politely, forever.<\/p><\/blockquote><h2 id=\"the-root-cause\">The root cause<\/h2><p>Read those two together and the common factor is blocking.<\/p><p><strong>A blocked thread is a thread that is occupied but not working<\/strong>, and every bad outcome above follows from having a lot of them. Thread explosion is blocked threads multiplying. Deadlock is blocked threads that will never unblock. Even the callback pyramid exists because the alternative — writing it straight and waiting — would block.<\/p><p>So Swift's design starts from one rule: <strong>threads must never block.<\/strong> Everything in the next chapter is a consequence of taking that seriously.<\/p>", "text": "swift concurrency is not a new way to do the same thing. it is a response to three specific failures, and it is much easier to hold in your head if you know what it was reacting to. callbacks the first answer to waiting: hand over a piece of code to run when the answer arrives, and return immediately. swift loaduser(id) { user in loadavatar(user) { image in resize(image) { small in display(small) // three levels deep, and no error handling yet } } } it works, and it has three problems. it nests — each step buries the next. errors must be threaded through by hand at every level. and nothing forces you to call the callback: forget one branch and the operation silently never finishes, with no complaint from the compiler. gcd, and thread explosion grand central dispatch let you hand work to queues and managed threads for you. a big improvement, with one structural flaw: when a thread blocked, gcd brought up another thread to keep the remaining work moving. apple's own example: a news app updating a hundred feeds. each network callback needs the database, and blocks waiting for it. gcd sees blocked threads with work still queued, so it creates more. on a six core iphone you end up with roughly sixteen times more threads than cores . every one of those threads holds its stack. the os tries to give each a fair share, so it context switches constantly. the device now spends most of its energy on the bookkeeping of having too many threads. this is thread explosion , and it is the specific failure swift concurrency was built to make impossible. in the office. whenever a worker is stuck on hold, the manager hires another so the work keeps moving. soon there are ninety six people in a six desk office, almost all on hold, and most of the day goes on deciding who gets to sit down. locks the standard answer to shared data: a lock. one holder at a time, everyone else waits. locks work, and they cost three things. they are a convention, not a barrier — the data is still reachable, and the protection holds only while every piece of code remembers to take the lock, forever. two locks taken in opposite orders by two threads produce a deadlock , where both wait for each other permanently. and a thread waiting on a lock is a blocked thread, which in a gcd world causes the section above. in the office. a single key to the cabinet. it works — but the cabinet is still standing open, so the protection lasts exactly as long as everyone's memory. and two workers who take two keys in opposite orders wait for each other, politely, forever. the root cause read those two together and the common factor is blocking. a blocked thread is a thread that is occupied but not working , and every bad outcome above follows from having a lot of them. thread explosion is blocked threads multiplying. deadlock is blocked threads that will never unblock. even the callback pyramid exists because the alternative — writing it straight and waiting — would block. so swift's design starts from one rule: threads must never block. everything in the next chapter is a consequence of taking that seriously. ", "outline": [{"a": "callbacks", "t": "Callbacks"}, {"a": "gcd-and-thread-explosion", "t": "GCD, and thread explosion"}, {"a": "locks", "t": "Locks"}, {"a": "the-root-cause", "t": "The root cause"}]}, {"slug": "tasks-async-await", "title": "Tasks, async and await", "summary": "The move that makes everything else possible — separating the work from the worker.", "minutes": "8", "sources": [{"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}], "html": "<h2 id=\"a-task-is-a-job-not-a-worker\">A task is a job, not a worker<\/h2><p>This is the central move, and everything else follows from it.<\/p><p>Under the old model, \"do this in the background\" meant <em>get a thread<\/em> — hire a worker. Workers are expensive, so you couldn't have many.<\/p><p>Under Swift concurrency you create a <strong>task<\/strong>: a description of work to be done. A task is not a thread. It is an object on the heap, cheap enough that having tens of thousands is unremarkable. Behind them sits a small, fixed pool of actual threads that pick tasks up and run them.<\/p><p><strong>Many tasks, few threads.<\/strong> That single sentence is the shape of the whole system.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Stop hiring people. Just stop confusing <em>jobs<\/em> with <em>workers<\/em>.<\/p><p>Write each job on a slip of paper and put it in a tray. A slip is not a person; it costs nothing, so you can write ten thousand. Then employ exactly <strong>six workers, one per desk<\/strong>, and have them take slips from the tray and work them.<\/p><p>Ten thousand slips, six workers, six desks, nobody standing around. <strong>Many slips, few workers<\/strong> — that's the whole rearrangement.<\/p><\/blockquote><h2 id=\"async-and-await\"><code><span class=\"t-kw\">async<\/span><\/code> and <code><span class=\"t-kw\">await<\/span><\/code><\/h2><p>A function marked <code><span class=\"t-kw\">async<\/span><\/code> is one that might need to pause. Inside it, every point where it <em>might<\/em> pause is marked <code><span class=\"t-kw\">await<\/span><\/code>:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> loadProfile(id: <span class=\"t-typ\">String<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Profile<\/span> {\n    <span class=\"t-kw\">let<\/span> data = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetch(id)      <span class=\"t-com\">// might pause here<\/span>\n    <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">try<\/span> decode(data)             <span class=\"t-com\">// ordinary work, no pause<\/span>\n}<\/code><\/pre><\/div><p><code><span class=\"t-kw\">await<\/span><\/code> is not an instruction to go elsewhere. It marks a place where the function may be <strong>suspended<\/strong>: put down, with a note of where it had got to, so the thread can run something else. When the answer arrives the task resumes — possibly on a different thread.<\/p><p>Two consequences, and they are the two people get wrong.<\/p><p><strong><code><span class=\"t-kw\">await<\/span><\/code> does not mean \"background\".<\/strong> It means \"this may pause\". Which thread continues afterwards is a separate question, answered in chapter 6.<\/p><p><strong><code><span class=\"t-kw\">await<\/span><\/code> does mean \"the world may have moved.\"<\/strong> You put the work down. Other work ran. Anything you checked before the <code><span class=\"t-kw\">await<\/span><\/code> may no longer be true after it. That single fact is the root of chapter 5.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A marked point on the slip where the worker may set it down — with a bookmark noting exactly where th
