">let<\/span> groups = <span class=\"t-typ\">Dictionary<\/span>(grouping: words) { <span class=\"t-typ\">String<\/span>($<span class=\"t-num\">0<\/span>.sorted()) }\n    <span class=\"t-kw\">return<\/span> <span class=\"t-typ\">Array<\/span>(groups.values)\n}<\/code><\/pre><\/div><p><code><span class=\"t-typ\">Dictionary<\/span>(grouping:by:)<\/code> is the standard library's group-by: it builds <code>[<span class=\"t-typ\">Key<\/span>: [<span class=\"t-typ\">Element<\/span>]]<\/code> in one pass and keeps each group in input order. Writing the loop by hand — <code>groups[key, <span class=\"t-kw\">default<\/span>: []].append(word)<\/code> — is equally good; know both, because an interviewer may ask what the one-liner does underneath.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3: the three examples above plus five more — an empty list, repeated words (<code>[<span class=\"t-str\">&quot;ab&quot;<\/span>, <span class=\"t-str\">&quot;ba&quot;<\/span>, <span class=\"t-str\">&quot;ab&quot;<\/span>, <span class=\"t-str\">&quot;abc&quot;<\/span>]<\/code>), same letters in different counts (<code><span class=\"t-str\">&quot;aab&quot;<\/span><\/code> vs <code><span class=\"t-str\">&quot;abb&quot;<\/span><\/code>, not anagrams), mixed case (<code><span class=\"t-str\">&quot;Tea&quot;<\/span><\/code> vs <code><span class=\"t-str\">&quot;eat&quot;<\/span><\/code>, not anagrams as written), and <code><span class=\"t-str\">&quot;café&quot;<\/span><\/code> spelled with a precomposed é against one spelled with e + combining accent (anagrams, because Swift compares <code><span class=\"t-typ\">Character<\/span><\/code>s by canonical equivalence).<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-str\">&quot;stone&quot;<\/span>, <span class=\"t-str\">&quot;notes&quot;<\/span>, <span class=\"t-str\">&quot;lemon&quot;<\/span>, <span class=\"t-str\">&quot;tones&quot;<\/span>, <span class=\"t-str\">&quot;melon&quot;<\/span>, <span class=\"t-str\">&quot;apple&quot;<\/span>]<\/code><\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Word<\/th><th>Key<\/th><th>Dictionary after<\/th><\/tr><\/thead><tbody><tr><td>stone<\/td><td>enost<\/td><td><code>enost: [stone]<\/code><\/td><\/tr><tr><td>notes<\/td><td>enost<\/td><td><code>enost: [stone, notes]<\/code><\/td><\/tr><tr><td>lemon<\/td><td>elmno<\/td><td>+ <code>elmno: [lemon]<\/code><\/td><\/tr><tr><td>tones<\/td><td>enost<\/td><td><code>enost: [stone, notes, tones]<\/code><\/td><\/tr><tr><td>melon<\/td><td>elmno<\/td><td><code>elmno: [lemon, melon]<\/code><\/td><\/tr><tr><td>apple<\/td><td>aelpp<\/td><td>+ <code>aelpp: [apple]<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>The values are the three groups.<\/p><p><strong><code>[<span class=\"t-str\">&quot;&quot;<\/span>]<\/code><\/strong> — <code><span class=\"t-str\">&quot;&quot;<\/span>.sorted()<\/code> is an empty array, <code><span class=\"t-typ\">String<\/span>([])<\/code> is <code><span class=\"t-str\">&quot;&quot;<\/span><\/code>, so the key is the empty string and the result is <code>[[<span class=\"t-str\">&quot;&quot;<\/span>]]<\/code>. No special case needed; say that you checked.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>Dictionary order changes every run.<\/strong> Swift seeds its hash function randomly per process (SE-0206), so <code>groups.values<\/code> comes back in a different order each time you run the tests. Compare the result directly against <code>[[<span class=\"t-str\">&quot;notes&quot;<\/span>, <span class=\"t-str\">&quot;stone&quot;<\/span>, <span class=\"t-str\">&quot;tones&quot;<\/span>], …]<\/code> and the test passes on one run and fails on the next — a flaky test you wrote yourself. The fix is to normalise before comparing (sort each group, then sort the groups), which is what the Xcode stub does. Mentioning this before the interviewer sees it fail is a strong signal.<\/p><p>Smaller one: <code>word.sorted()<\/code> returns <code>[<span class=\"t-typ\">Character<\/span>]<\/code>, not a <code><span class=\"t-typ\">String<\/span><\/code>. Using the array as the key works (<code>[<span class=\"t-typ\">Character<\/span>]<\/code> is <code><span class=\"t-typ\">Hashable<\/span><\/code>), but wrap it in <code><span class=\"t-typ\">String<\/span>(...)<\/code> so the key prints readably when you debug.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Can you avoid the sort?\"<\/strong> → Count letters into a 26-slot <code>[<span class=\"t-typ\">Int<\/span>]<\/code> and use the array as the key; <code>[<span class=\"t-typ\">Int<\/span>]<\/code> is <code><span class=\"t-typ\">Hashable<\/span><\/code>, a tuple would not be. O(n · k). Only valid while the alphabet is fixed and small.<\/li><li><strong>\"What about Unicode, or uppercase?\"<\/strong> → Decide what \"same letter\" means first: lowercase (and fold diacritics if the product wants <code>é<\/code> = <code>e<\/code>) before building the key. The sorted-<code><span class=\"t-typ\">Character<\/span><\/code> key keeps working; the 26-slot array doesn't.<\/li><li><strong>\"Return only the groups with more than one word.\"<\/strong> → Filter the values: <code>groups.values.filter { $<span class=\"t-num\">0<\/span>.count &gt; <span class=\"t-num\">1<\/span> }<\/code>. Same cost.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get a list of words. two words belong together if one is a rearrangement of the other: same letters, same number of each, any order. return the words sorted into those groups. the order of the groups, and the order of words inside a group, don't matter. words groups [\"stone\", \"notes\", \"lemon\", \"tones\", \"melon\", \"apple\"] [[\"notes\", \"stone\", \"tones\"], [\"lemon\", \"melon\"], [\"apple\"]] [\"\"] [[\"\"]] — the empty word is a group of one [\"x\", \"y\", \"x\"] [[\"x\", \"x\"], [\"y\"]] — repeats stay, in the same group constraints that matter: up to 10,000 words, each up to 100 characters, lowercase english letters only. because order is free, the xcode test sorts the groups and the words inside them before comparing — your answer can come back in any order. ::: pattern and cue hash map, used for grouping. the cue is \"gather together the ones that…\" — that is \"group by\", and \"group by\" is a dictionary from a key to a list. the whole problem is choosing the key: something every anagram of a word shares and no non anagram does. two keys work. the word's letters sorted ( \"stone\" → \"enost\" ), or a count of each letter ( [1, 0, 0, …] , 26 slots). both are identical across anagrams and differ otherwise. ::: ::: approach for each word, compute its key by sorting its letters. use the key to file the word into a dictionary: key on one side, the list of words that produced it on the other. when every word is filed, the dictionary's lists are the answer. time o(n · k log k), for n words of length up to k: each word is sorted once. the letter count key makes that o(n · k), which matters only when words are long — with k ≤ 100 the sort is fine, and it is the version you'll write correctly under pressure. space o(n · k) for the keys and the grouped copies of the words. ::: ::: swift solution swift func groupanagrams(_ words: [string]) [[string]] { let groups = dictionary(grouping: words) { string($0.sorted()) } return array(groups.values) } dictionary(grouping:by:) is the standard library's group by: it builds [key: [element]] in one pass and keeps each group in input order. writing the loop by hand — groups[key, default: []].append(word) — is equally good; know both, because an interviewer may ask what the one liner does underneath. verified with swift test on swift 6.2.3: the three examples above plus five more — an empty list, repeated words ( [\"ab\", \"ba\", \"ab\", \"abc\"] ), same letters in different counts ( \"aab\" vs \"abb\" , not anagrams), mixed case ( \"tea\" vs \"eat\" , not anagrams as written), and \"café\" spelled with a precomposed é against one spelled with e + combining accent (anagrams, because swift compares character s by canonical equivalence). ::: ::: walk it through [\"stone\", \"notes\", \"lemon\", \"tones\", \"melon\", \"apple\"] word key dictionary after stone enost enost: [stone] notes enost enost: [stone, notes] lemon elmno + elmno: [lemon] tones enost enost: [stone, notes, tones] melon elmno elmno: [lemon, melon] apple aelpp + aelpp: [apple] the values are the three groups. [\"\"] — \"\".sorted() is an empty array, string([]) is \"\" , so the key is the empty string and the result is [[\"\"]] . no special case needed; say that you checked. ::: ::: the swift trap dictionary order changes every run. swift seeds its hash function randomly per process (se 0206), so groups.values comes back in a different order each time you run the tests. compare the result directly against [[\"notes\", \"stone\", \"tones\"], …] and the test passes on one run and fails on the next — a flaky test you wrote yourself. the fix is to normalise before comparing (sort each group, then sort the groups), which is what the xcode stub does. mentioning this before the interviewer sees it fail is a strong signal. smaller one: word.sorted() returns [character] , not a string . using the array as the key works ( [character] is hashable ), but wrap it in string(...) so the key prints readably when you debug. ::: ::: what they ask next \"can you avoid the sort?\" → count letters into a 26 slot [int] and use the array as the key; [int] is hashable , a tuple would not be. o(n · k). only valid while the alphabet is fixed and small. \"what about unicode, or uppercase?\" → decide what \"same letter\" means first: lowercase (and fold diacritics if the product wants é = e ) before building the key. the sorted character key keeps working; the 26 slot array doesn't. \"return only the groups with more than one word.\" → filter the values: groups.values.filter { $0.count 1 } . same cost. ::: ", "outline": []}, {"slug": "top-k-frequent-elements", "title": "3 · Top K Frequent Elements", "summary": "Given a list of numbers and a count k, return the k values that appear most often.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 347 · Top K Frequent Elements", "url": "https://leetcode.com/problems/top-k-frequent-elements/"}, {"ref": "", "label": "Swift standard library · Array.prefix(_:)", "url": "https://developer.apple.com/documentation/swift/array/prefix(_:)"}, {"ref": "", "label": "Swift Collections · Heap", "url": "https://github.com/apple/swift-collections"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get an array of integers and a number k. Count how often each distinct value appears, and return the k values with the highest counts. The answer is always unique — there is never a tie at the cut-off — and it can come back in any order.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>k<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">9<\/span>]<\/code><\/td><td><code><span class=\"t-num\">2<\/span><\/code><\/td><td><code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">7<\/span>]<\/code> — 4 appears three times, 7 twice<\/td><\/tr><tr><td><code>[<span class=\"t-num\">6<\/span>]<\/code><\/td><td><code><span class=\"t-num\">1<\/span><\/code><\/td><td><code>[<span class=\"t-num\">6<\/span>]<\/code> — one value, one answer<\/td><\/tr><tr><td><code>[-<span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">8<\/span>]<\/code><\/td><td><code><span class=\"t-num\">2<\/span><\/code><\/td><td><code>[<span class=\"t-num\">3<\/span>, -<span class=\"t-num\">1<\/span>]<\/code> — negatives count like any other value<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 100,000 numbers; k is between 1 and the number of distinct values. Sorting the counts gets you an answer in O(n log n). The follow-up you should expect is \"can you beat O(n log n)?\" Because order is free, the Xcode test sorts your answer before comparing.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Hash map to count, then a bucket by frequency.<\/strong> The first cue is <em>\"how often each value appears\"<\/em> — that is counting, and counting is <code>dict[value, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span><\/code>. The second cue is <em>\"the k … with the highest\"<\/em> — a top-k selection. The textbook tool for top-k is a heap of size k, but there is a sharper observation here: a count can never be larger than n. So the counts themselves can be used as array positions, and no comparison-based sort is needed at all.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>First, walk the numbers once and count each value in a dictionary. Then make a row of n + 1 empty buckets, one for each possible count from 0 to n, and drop each value into the bucket that matches its count. Finally, walk the buckets from the highest count down, collecting values until you have k of them.<\/p><p>Time O(n): one pass to count, one pass over the distinct values to fill buckets, one pass down the buckets. Space O(n) for the dictionary and the buckets.<\/p><p>The alternatives, so you can say why not: sorting the distinct values by count is O(d log d) for d distinct values — fine, and easier to write correctly, so it is a sound first answer. A min-heap of size k is O(n log k), the right tool when the numbers arrive as a stream and you can't hold them all.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> topKFrequent(_ numbers: [<span class=\"t-typ\">Int<\/span>], _ k: <span class=\"t-typ\">Int<\/span>) -&gt; [<span class=\"t-typ\">Int<\/span>] {\n    <span class=\"t-kw\">var<\/span> countByValue: [<span class=\"t-typ\">Int<\/span>: <span class=\"t-typ\">Int<\/span>] = [:]\n    <span class=\"t-kw\">for<\/span> number <span class=\"t-kw\">in<\/span> numbers {\n        countByValue[number, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span>\n    }\n\n    <span class=\"t-com\">// buckets[c] holds every value that appears exactly c times.<\/span>\n    <span class=\"t-kw\">var<\/span> buckets = <span class=\"t-typ\">Array<\/span>(repeating: [<span class=\"t-typ\">Int<\/span>](), count: numbers.count + <span class=\"t-num\">1<\/span>)\n    <span class=\"t-kw\">for<\/span> (value, count) <span class=\"t-kw\">in<\/span> countByValue {\n        buckets[count].append(value)\n    }\n\n    <span class=\"t-kw\">var<\/span> result: [<span class=\"t-typ\">Int<\/span>] = []\n    <span class=\"t-kw\">for<\/span> count <span class=\"t-kw\">in<\/span> stride(from: numbers.count, through: <span class=\"t-num\">1<\/span>, by: -<span class=\"t-num\">1<\/span>) {\n        <span class=\"t-kw\">for<\/span> value <span class=\"t-kw\">in<\/span> buckets[count] {\n            result.append(value)\n            <span class=\"t-kw\">if<\/span> result.count == k { <span class=\"t-kw\">return<\/span> result }\n        }\n    }\n    <span class=\"t-kw\">return<\/span> result\n}<\/code><\/pre><\/div><p>The sort-based version, which is a perfectly good first answer before you optimise:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> topKFrequentSorted(_ numbers: [<span class=\"t-typ\">Int<\/span>], _ k: <span class=\"t-typ\">Int<\/span>) -&gt; [<span class=\"t-typ\">Int<\/span>] {\n    <span class=\"t-kw\">var<\/span> countByValue: [<span class=\"t-typ\">Int<\/span>: <span class=\"t-typ\">Int<\/span>] = [:]\n    <span class=\"t-kw\">for<\/span> number <span class=\"t-kw\">in<\/span> numbers { countByValue[number, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span> }\n    <span class=\"t-kw\">return<\/span> <span class=\"t-typ\">Array<\/span>(countByValue.sorted { $<span class=\"t-num\">0<\/span>.value &gt; $<span class=\"t-num\">1<\/span>.value }.prefix(k).map(\\.key))\n}<\/code><\/pre><\/div><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above plus five more — every value the same (<code>[<span class=\"t-num\">5<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">5<\/span>]<\/code>, k 1), k equal to the number of distinct values (<code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]<\/code>, k 3), a close race where 2 appears four times and 0 three times (k 1), negatives and zero together (k 3), and counts of 1, 2 and 3 where the walk must stop after two values.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">7<\/span>, <span class=\"t-num\">9<\/span>]<\/code>, k = 2<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Step<\/th><th>State<\/th><\/tr><\/thead><tbody><tr><td>Count<\/td><td><code><span class=\"t-num\">4<\/span>: <span class=\"t-num\">3<\/span>, <span class=\"t-num\">7<\/span>: <span class=\"t-num\">2<\/span>, <span class=\"t-num\">9<\/span>: <span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>Buckets (0…6)<\/td><td><code>[<span class=\"t-num\">3<\/span>] = [<span class=\"t-num\">4<\/span>]<\/code>, <code>[<span class=\"t-num\">2<\/span>] = [<span class=\"t-num\">7<\/span>]<\/code>, <code>[<span class=\"t-num\">1<\/span>] = [<span class=\"t-num\">9<\/span>]<\/code>, the rest empty<\/td><\/tr><tr><td>Walk from 6 down<\/td><td>6, 5, 4 empty · 3 → take 4 · 2 → take 7, now 2 values, stop<\/td><\/tr><\/tbody><\/table><\/div><p>Answer <code>[<span class=\"t-num\">4<\/span>, <span class=\"t-num\">7<\/span>]<\/code>.<\/p><p><strong><code>[<span class=\"t-num\">6<\/span>]<\/code>, k = 1<\/strong> — count <code><span class=\"t-num\">6<\/span>: <span class=\"t-num\">1<\/span><\/code>, buckets has two slots, <code>[<span class=\"t-num\">1<\/span>] = [<span class=\"t-num\">6<\/span>]<\/code>. The walk starts at 1, takes 6, stops. Nothing special needed; the <code>numbers.count + <span class=\"t-num\">1<\/span><\/code> size is exactly what makes a count of n fit.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>There is no <code><span class=\"t-typ\">Heap<\/span><\/code> in the standard library.<\/strong> The answer most people have memorised — \"min-heap of size k\" — is not writable in a shared editor without <code>swift-collections<\/code>, and writing a heap from scratch eats half your 20 minutes. Say the heap answer and its O(n log k), then write the bucket version or the sort. Saying <em>why<\/em> you aren't writing the heap is a senior signal, not a gap.<\/p><p>Smaller one, in the sort version: <code>prefix(k)<\/code> on an array returns an <code><span class=\"t-typ\">ArraySlice<\/span><\/code>, not an <code><span class=\"t-typ\">Array<\/span><\/code>, and a slice keeps its parent's indices — a slice that starts at position 3 has <code>startIndex == <span class=\"t-num\">3<\/span><\/code>, so <code>slice[<span class=\"t-num\">0<\/span>]<\/code> traps. Wrap it in <code><span class=\"t-typ\">Array<\/span>(...)<\/code> before returning or indexing.<\/p><p>And if there were ties at the cut-off, dictionary iteration order is randomised per process, so which tied value you return would change between runs. This problem rules ties out; say you noticed.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"The numbers arrive as a stream too big for memory.\"<\/strong> → Keep the counts (or an approximate counter such as Count-Min Sketch if even that's too big) and a min-heap of size k; each update is O(log k).<\/li><li><strong>\"Return them ordered, most frequent first.\"<\/strong> → The bucket walk already produces that order; the sort version too. State the tie-break rule you'd use if ties were allowed — say, smaller value first.<\/li><li><strong>\"Top k most frequent words, ties broken alphabetically.\"<\/strong> → Same count, then sort by <code>(count descending, word ascending)<\/code>. The bucket trick still works if you sort inside each bucket.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get an array of integers and a number k. count how often each distinct value appears, and return the k values with the highest counts. the answer is always unique — there is never a tie at the cut off — and it can come back in any order. numbers k answer [4, 4, 4, 7, 7, 9] 2 [4, 7] — 4 appears three times, 7 twice [6] 1 [6] — one value, one answer [ 1, 1, 3, 3, 3, 8] 2 [3, 1] — negatives count like any other value constraints that matter: up to 100,000 numbers; k is between 1 and the number of distinct values. sorting the counts gets you an answer in o(n log n). the follow up you should expect is \"can you beat o(n log n)?\" because order is free, the xcode test sorts your answer before comparing. ::: pattern and cue hash map to count, then a bucket by frequency. the first cue is \"how often each value appears\" — that is counting, and counting is dict[value, default: 0] += 1 . the second cue is \"the k … with the highest\" — a top k selection. the textbook tool for top k is a heap of size k, but there is a sharper observation here: a count can never be larger than n. so the counts themselves can be used as array positions, and no comparison based sort is needed at all. ::: ::: approach first, walk the numbers once and count each value in a dictionary. then make a row of n + 1 empty buckets, one for each possible count from 0 to n, and drop each value into the bucket that matches its count. finally, walk the buckets from the highest count down, collecting values until you have k of them. time o(n): one pass to count, one pass over the distinct values to fill buckets, one pass down the buckets. space o(n) for the dictionary and the buckets. the alternatives, so you can say why not: sorting the distinct values by count is o(d log d) for d distinct values — fine, and easier to write correctly, so it is a sound first answer. a min heap of size k is o(n log k), the right tool when the numbers arrive as a stream and you can't hold them all. ::: ::: swift solution swift func topkfrequent(_ numbers: [int], _ k: int) [int] { var countbyvalue: [int: int] = [:] for number in numbers { countbyvalue[number, default: 0] += 1 } // buckets[c] holds every value that appears exactly c times. var buckets = array(repeating: [int](), count: numbers.count + 1) for (value, count) in countbyvalue { buckets[count].append(value) } var result: [int] = [] for count in stride(from: numbers.count, through: 1, by: 1) { for value in buckets[count] { result.append(value) if result.count == k { return result } } } return result } the sort based version, which is a perfectly good first answer before you optimise: swift func topkfrequentsorted(_ numbers: [int], _ k: int) [int] { var countbyvalue: [int: int] = [:] for number in numbers { countbyvalue[number, default: 0] += 1 } return array(countbyvalue.sorted { $0.value $1.value }.prefix(k).map(\\.key)) } verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus five more — every value the same ( [5, 5, 5] , k 1), k equal to the number of distinct values ( [1, 2, 3] , k 3), a close race where 2 appears four times and 0 three times (k 1), negatives and zero together (k 3), and counts of 1, 2 and 3 where the walk must stop after two values. ::: ::: walk it through [4, 4, 4, 7, 7, 9] , k = 2 step state count 4: 3, 7: 2, 9: 1 buckets (0…6) [3] = [4] , [2] = [7] , [1] = [9] , the rest empty walk from 6 down 6, 5, 4 empty · 3 → take 4 · 2 → take 7, now 2 values, stop answer [4, 7] . [6] , k = 1 — count 6: 1 , buckets has two slots, [1] = [6] . the walk starts at 1, takes 6, stops. nothing special needed; the numbers.count + 1 size is exactly what makes a count of n fit. ::: ::: the swift trap there is no heap in the standard library. the answer most people have memorised — \"min heap of size k\" — is not writable in a shared editor without swift collections , and writing a heap from scratch eats half your 20 minutes. say the heap answer and its o(n log k), then write the bucket version or the sort. saying why you aren't writing the heap is a senior signal, not a gap. smaller one, in the sort version: prefix(k) on an array returns an arrayslice , not an array , and a slice keeps its parent's indices — a slice that starts at position 3 has startindex == 3 , so slice[0] traps. wrap it in array(...) before returning or indexing. and if there were ties at the cut off, dictionary iteration order is randomised per process, so which tied value you return would change between runs. this problem rules ties out; say you noticed. ::: ::: what they ask next \"the numbers arrive as a stream too big for memory.\" → keep the counts (or an approximate counter such as count min sketch if even that's too big) and a min heap of size k; each update is o(log k). \"return them ordered, most frequent first.\" → the bucket walk already produces that order; the sort version too. state the tie break rule you'd use if ties were allowed — say, smaller value first. \"top k most frequent words, ties broken alphabetically.\" → same count, then sort by (count descending, word ascending) . the bucket trick still works if you sort inside each bucket. ::: ", "outline": []}, {"slug": "longest-consecutive-sequence", "title": "4 · Longest Consecutive Sequence", "summary": "Given an unsorted list of whole numbers, find how long the longest unbroken run of consecutive values is.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 128 · Longest Consecutive Sequence", "url": "https://leetcode.com/problems/longest-consecutive-sequence/"}, {"ref": "", "label": "Swift standard library · Set", "url": "https://developer.apple.com/documentation/swift/set"}, {"ref": "", "label": "The Swift Programming Language · Overflow Operators", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/advancedoperators/#Overflow-Operators"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get an unsorted array of integers. A run is a set of values that follow each other with no gap — 7, 8, 9, 10 — wherever they sit in the array. Return the length of the longest run. Repeated values count once. The interviewer wants it in O(n) time, which rules out sorting first.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>Answer<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">31<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">30<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">32<\/span>]<\/code><\/td><td><code><span class=\"t-num\">4<\/span><\/code><\/td><td>2, 3, 4, 5 — longer than 30, 31, 32<\/td><\/tr><tr><td><code>[]<\/code><\/td><td><code><span class=\"t-num\">0<\/span><\/code><\/td><td>no numbers, no run<\/td><\/tr><tr><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td>the second 2 adds nothing<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 100,000 numbers; values from −10⁹ to 10⁹. The array is not sorted and you must not rely on position — the run is about values, not neighbours in the array.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Hash set.<\/strong> The cue is <em>\"unsorted\"<\/em> combined with <em>\"O(n)\"<\/em>. Sorting would make the runs obvious but costs O(n log n), so you need another way to ask \"is the next value present?\" in constant time — that question is a set lookup.<\/p><p>The trick that keeps it linear: only start counting a run from its <strong>bottom<\/strong>. A value is the bottom of a run if the value one below it is <em>not<\/em> in the set. Every other value is skipped, so each run is walked exactly once.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Put every number into a set, which also removes repeats. Then look at each value in the set. If the value one less is also in the set, this value is in the middle of a run — skip it. Otherwise it starts a run: step upward one value at a time while the next value is in the set, and count the steps. Keep the longest count you have seen.<\/p><p>Time O(n): building the set is O(n); the outer loop visits each value once; the inner walk only runs from run starts, and every value is walked over by at most one of those — so the inner steps add up to n in total, not n per value. Space O(n) for the set.<\/p><p>Sorting and scanning is O(n log n) and O(1) extra — say it as the fallback, and why the problem forbids it.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> longestConsecutive(_ numbers: [<span class=\"t-typ\">Int<\/span>]) -&gt; <span class=\"t-typ\">Int<\/span> {\n    <span class=\"t-kw\">let<\/span> seen = <span class=\"t-typ\">Set<\/span>(numbers)\n    <span class=\"t-kw\">var<\/span> longest = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">for<\/span> start <span class=\"t-kw\">in<\/span> seen {\n        <span class=\"t-com\">// Only start counting at the bottom of a run.<\/span>\n        <span class=\"t-kw\">if<\/span> start &gt; .min, seen.contains(start - <span class=\"t-num\">1<\/span>) { <span class=\"t-kw\">continue<\/span> }\n\n        <span class=\"t-kw\">var<\/span> end = start\n        <span class=\"t-kw\">while<\/span> end &lt; .max, seen.contains(end + <span class=\"t-num\">1<\/span>) {\n            end += <span class=\"t-num\">1<\/span>\n        }\n        longest = max(longest, end - start + <span class=\"t-num\">1<\/span>)\n    }\n    <span class=\"t-kw\">return<\/span> longest\n}<\/code><\/pre><\/div><p>The <code>start &gt; .min<\/code> and <code>end &lt; .max<\/code> guards look fussy; the trap below explains why they are there. Within the stated constraints you can leave them out and say so.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above plus six more — a single value, the same value three times, a run crossing zero (<code>-<span class=\"t-num\">2<\/span> … <span class=\"t-num\">1<\/span><\/code>), values sitting at <code><span class=\"t-typ\">Int<\/span>.max<\/code> and <code><span class=\"t-typ\">Int<\/span>.min<\/code> (which crash the unguarded version), no two values adjacent, and a run of five given in descending order.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">31<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">30<\/span>, <span class=\"t-num\">4<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">32<\/span>]<\/code><\/strong><\/p><p>The set holds 2, 3, 4, 5, 30, 31, 32 (in whatever order Swift picks — it doesn't matter).<\/p><div class=\"scroll\"><table><thead><tr><th>Value<\/th><th>One below in set?<\/th><th>Action<\/th><th>Longest<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>1 — no<\/td><td>walk 3, 4, 5, stop at 6 → length 4<\/td><td>4<\/td><\/tr><tr><td>3, 4, 5<\/td><td>yes<\/td><td>skip<\/td><td>4<\/td><\/tr><tr><td>30<\/td><td>29 — no<\/td><td>walk 31, 32, stop at 33 → length 3<\/td><td>4<\/td><\/tr><tr><td>31, 32<\/td><td>yes<\/td><td>skip<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div><p>Seven values, seven checks in the outer loop, five steps in total in the inner walks. Answer 4.<\/p><p><strong><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/strong> — the set is {1, 2, 3}. 1 starts a run, walks to 3, length 3. The duplicate never reaches the loop, which is why iterating the set rather than the array matters: with the array, a value repeated a thousand times at the bottom of a long run would walk that run a thousand times.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong><code>start - <span class=\"t-num\">1<\/span><\/code> and <code>end + <span class=\"t-num\">1<\/span><\/code> crash at the edges of <code><span class=\"t-typ\">Int<\/span><\/code>.<\/strong> In C, <code><span class=\"t-typ\">INT_MIN<\/span> - <span class=\"t-num\">1<\/span><\/code> quietly wraps around to the maximum; in Swift, arithmetic that overflows traps — the process stops. So an input containing <code><span class=\"t-typ\">Int<\/span>.min<\/code> crashes on the very first check, and one containing <code><span class=\"t-typ\">Int<\/span>.max<\/code> crashes when the walk tries to look past it. The problem's constraints keep values within ±10⁹, so this won't fire on LeetCode, but it will fire on a test an interviewer writes to probe you. Guard the comparison (<code>start &gt; .min<\/code>), or use the reporting forms (<code>start.subtractingReportingOverflow(<span class=\"t-num\">1<\/span>)<\/code>) — not <code>&amp;-<\/code>, which wraps <code><span class=\"t-typ\">Int<\/span>.min<\/code> around to <code><span class=\"t-typ\">Int<\/span>.max<\/code> and, if <code><span class=\"t-typ\">Int<\/span>.max<\/code> is also in the set, silently gives a wrong answer instead of a crash.<\/p><p>The related one: iterate <code>seen<\/code>, not <code>numbers<\/code>. It gives the same answer either way, and only the complexity breaks — which is the kind of bug a test won't catch and an interviewer will.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Return the run itself, not its length.\"<\/strong> → Keep <code>bestStart<\/code> alongside <code>longest<\/code>; the run is <code>bestStart ... bestStart + longest - <span class=\"t-num\">1<\/span><\/code>.<\/li><li><strong>\"Numbers keep arriving; keep the answer up to date.\"<\/strong> → Union-find, or a dictionary from each run's endpoints to its length: on insert, merge with the run ending at <code>x − <span class=\"t-num\">1<\/span><\/code> and the one starting at <code>x + <span class=\"t-num\">1<\/span><\/code>, update both new endpoints. O(1) amortised per insert.<\/li><li><strong>\"Memory is tight.\"<\/strong> → Sort in place and scan, skipping equal neighbours: O(n log n) time, O(1) extra. Trade the time back for the space, and say that's the trade.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get an unsorted array of integers. a run is a set of values that follow each other with no gap — 7, 8, 9, 10 — wherever they sit in the array. return the length of the longest run. repeated values count once. the interviewer wants it in o(n) time, which rules out sorting first. numbers answer why [31, 5, 2, 30, 4, 3, 32] 4 2, 3, 4, 5 — longer than 30, 31, 32 [] 0 no numbers, no run [1, 2, 2, 3] 3 the second 2 adds nothing constraints that matter: up to 100,000 numbers; values from −10⁹ to 10⁹. the array is not sorted and you must not rely on position — the run is about values, not neighbours in the array. ::: pattern and cue hash set. the cue is \"unsorted\" combined with \"o(n)\" . sorting would make the runs obvious but costs o(n log n), so you need another way to ask \"is the next value present?\" in constant time — that question is a set lookup. the trick that keeps it linear: only start counting a run from its bottom . a value is the bottom of a run if the value one below it is not in the set. every other value is skipped, so each run is walked exactly once. ::: ::: approach put every number into a set, which also removes repeats. then look at each value in the set. if the value one less is also in the set, this value is in the middle of a run — skip it. otherwise it starts a run: step upward one value at a time while the next value is in the set, and count the steps. keep the longest count you have seen. time o(n): building the set is o(n); the outer loop visits each value once; the inner walk only runs from run starts, and every value is walked over by at most one of those — so the inner steps add up to n in total, not n per value. space o(n) for the set. sorting and scanning is o(n log n) and o(1) extra — say it as the fallback, and why the problem forbids it. ::: ::: swift solution swift func longestconsecutive(_ numbers: [int]) int { let seen = set(numbers) var longest = 0 for start in seen { // only start counting at the bottom of a run. if start .min, seen.contains(start 1) { continue } var end = start while end < .max, seen.contains(end + 1) { end += 1 } longest = max(longest, end start + 1) } return longest } the start .min and end < .max guards look fussy; the trap below explains why they are there. within the stated constraints you can leave them out and say so. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus six more — a single value, the same value three times, a run crossing zero ( 2 … 1 ), values sitting at int.max and int.min (which crash the unguarded version), no two values adjacent, and a run of five given in descending order. ::: ::: walk it through [31, 5, 2, 30, 4, 3, 32] the set holds 2, 3, 4, 5, 30, 31, 32 (in whatever order swift picks — it doesn't matter). value one below in set? action longest 2 1 — no walk 3, 4, 5, stop at 6 → length 4 4 3, 4, 5 yes skip 4 30 29 — no walk 31, 32, stop at 33 → length 3 4 31, 32 yes skip 4 seven values, seven checks in the outer loop, five steps in total in the inner walks. answer 4. [1, 2, 2, 3] — the set is {1, 2, 3}. 1 starts a run, walks to 3, length 3. the duplicate never reaches the loop, which is why iterating the set rather than the array matters: with the array, a value repeated a thousand times at the bottom of a long run would walk that run a thousand times. ::: ::: the swift trap start 1 and end + 1 crash at the edges of int . in c, int_min 1 quietly wraps around to the maximum; in swift, arithmetic that overflows traps — the process stops. so an input containing int.min crashes on the very first check, and one containing int.max crashes when the walk tries to look past it. the problem's constraints keep values within ±10⁹, so this won't fire on leetcode, but it will fire on a test an interviewer writes to probe you. guard the comparison ( start .min ), or use the reporting forms ( start.subtractingreportingoverflow(1) ) — not & , which wraps int.min around to int.max and, if int.max is also in the set, silently gives a wrong answer instead of a crash. the related one: iterate seen , not numbers . it gives the same answer either way, and only the complexity breaks — which is the kind of bug a test won't catch and an interviewer will. ::: ::: what they ask next \"return the run itself, not its length.\" → keep beststart alongside longest ; the run is beststart ... beststart + longest 1 . \"numbers keep arriving; keep the answer up to date.\" → union find, or a dictionary from each run's endpoints to its length: on insert, merge with the run ending at x − 1 and the one starting at x + 1 , update both new endpoints. o(1) amortised per insert. \"memory is tight.\" → sort in place and scan, skipping equal neighbours: o(n log n) time, o(1) extra. trade the time back for the space, and say that's the trade. ::: ", "outline": []}, {"slug": "subarray-sum-equals-k", "title": "5 · Subarray Sum Equals K", "summary": "Given a list of whole numbers and a target, count how many unbroken stretches of the list add up to exactly that target.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 560 · Subarray Sum Equals K", "url": "https://leetcode.com/problems/subarray-sum-equals-k/"}, {"ref": "", "label": "Swift standard library · Dictionary.subscript(_:default:)", "url": "https://developer.apple.com/documentation/swift/dictionary/subscript(_:default:)-45arb"}], "html": "<p><em>Medium<\/em><\/p><p>You get an array of integers, which may include negatives and zeros, and a target number k. A stretch is one or more entries that sit next to each other in the array. Count how many stretches add up to exactly k. Two stretches count separately if they start or end at different positions, even when they hold the same values.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>k<\/th><th>Answer<\/th><th>The stretches<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code>, <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>]<\/code>, <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>]<\/code><\/td><\/tr><tr><td><code>[<span class=\"t-num\">3<\/span>, -<span class=\"t-num\">3<\/span>, <span class=\"t-num\">3<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td><code><span class=\"t-num\">3<\/span><\/code><\/td><td>the first <code><span class=\"t-num\">3<\/span><\/code>, the last <code><span class=\"t-num\">3<\/span><\/code>, and all three together<\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/td><td><code><span class=\"t-num\">0<\/span><\/code><\/td><td><code><span class=\"t-num\">6<\/span><\/code><\/td><td>every stretch — three of length 1, two of length 2, one of length 3<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 20,000 numbers, each between −1,000 and 1,000, so running totals stay small. Checking every start and end is O(n²) — that is the answer to beat. The negatives are the point of the problem: they are what breaks the obvious approach.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Prefix sums, with a hash map of the sums seen so far.<\/strong> The cue is <em>\"stretches that add up to exactly k\"<\/em> — a subarray sum. Any stretch's total is the difference of two running totals: the total up to its end minus the total just before its start. So \"a stretch ending here sums to k\" becomes \"some earlier running total equals the current one minus k\" — and \"have I seen this value before, how many times?\" is a dictionary lookup.<\/p><p>Why not a sliding window? A window grows while the sum is too small and shrinks while it is too big. That only works when adding an element always increases the sum. With negatives and zeros it doesn't, so the window has no rule for when to move.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Walk the array once, keeping a running total. Keep a dictionary that counts how many times each running total has appeared so far, starting with a total of 0 seen once — that stands for \"nothing taken yet\", and it is what lets a stretch that starts at the very first entry be counted. At each entry, add it to the running total, then ask the dictionary how many earlier totals equal the current total minus k: each one marks the start of a stretch that ends here and sums to k. Add that count to the answer, then record the current total.<\/p><p>Time O(n): one pass, O(1) average per dictionary step. Space O(n): at most one dictionary entry per distinct running total.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> subarraySum(_ numbers: [<span class=\"t-typ\">Int<\/span>], _ k: <span class=\"t-typ\">Int<\/span>) -&gt; <span class=\"t-typ\">Int<\/span> {\n    <span class=\"t-kw\">var<\/span> countBySum: [<span class=\"t-typ\">Int<\/span>: <span class=\"t-typ\">Int<\/span>] = [<span class=\"t-num\">0<\/span>: <span class=\"t-num\">1<\/span>]   <span class=\"t-com\">// the empty prefix<\/span>\n    <span class=\"t-kw\">var<\/span> sum = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> matches = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">for<\/span> number <span class=\"t-kw\">in<\/span> numbers {\n        sum += number\n        matches += countBySum[sum - k, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>]\n        countBySum[sum, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span>\n    }\n    <span class=\"t-kw\">return<\/span> matches\n}<\/code><\/pre><\/div><p>The order inside the loop matters: <strong>look up, then record.<\/strong> Recording first would count the empty stretch that starts and ends at the same place whenever k is 0.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, six more (an empty array, a single entry that does and doesn't match, <code>[-<span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]<\/code> with k 0, <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]<\/code> with k 2, and alternating <code>[<span class=\"t-num\">2<\/span>, -<span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>, -<span class=\"t-num\">2<\/span>]<\/code> with k 0), and 2,000 random arrays with values from −3 to 3, each checked against the O(n²) brute force.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code>, k = 3<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Entry<\/th><th>Running total<\/th><th>Look for (total − 3)<\/th><th>Found<\/th><th>Matches<\/th><th>Totals seen after<\/th><\/tr><\/thead><tbody><tr><td>—<\/td><td>0<\/td><td>—<\/td><td>—<\/td><td>0<\/td><td><code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>−2<\/td><td>0<\/td><td>0<\/td><td><code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>2<\/td><td>3<\/td><td>0<\/td><td>1<\/td><td>1 — <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td><code>+ <span class=\"t-num\">3<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>1<\/td><td>4<\/td><td>1<\/td><td>1<\/td><td>2 — <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>]<\/code><\/td><td><code>+ <span class=\"t-num\">4<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><tr><td>−1<\/td><td>3<\/td><td>0<\/td><td>1<\/td><td>3 — <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, −<span class=\"t-num\">1<\/span>]<\/code><\/td><td><code><span class=\"t-num\">3<\/span>:<span class=\"t-num\">2<\/span><\/code><\/td><\/tr><tr><td>2<\/td><td>5<\/td><td>2<\/td><td>0<\/td><td>3<\/td><td><code>+ <span class=\"t-num\">5<\/span>:<span class=\"t-num\">1<\/span><\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Answer 3.<\/p><p><strong><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code>, k = 0<\/strong> — the running total stays 0. Before each record the dictionary holds <code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">1<\/span><\/code>, then <code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">2<\/span><\/code>, then <code><span class=\"t-num\">0<\/span>:<span class=\"t-num\">3<\/span><\/code>, so the matches add up 1 + 2 + 3 = 6. That is every stretch, which is right. Record before looking up and you'd get 2 + 3 + 4 = 9.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>Reading a missing key.<\/strong> <code>countBySum[sum - k]<\/code> is an <code><span class=\"t-typ\">Int<\/span>?<\/code>, so <code>matches += countBySum[sum - k]<\/code> doesn't compile. Under time pressure the tempting fix is <code>countBySum[sum - k]!<\/code>, which crashes on the first entry — at that point almost nothing has been seen. Use <code>countBySum[sum - k, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>]<\/code>: in a read, the default subscript just returns 0 and does <strong>not<\/strong> insert the key, so lookups never grow the dictionary. In a write — <code>countBySum[sum, <span class=\"t-kw\">default<\/span>: <span class=\"t-num\">0<\/span>] += <span class=\"t-num\">1<\/span><\/code> — it inserts and increments in one hash. Knowing that the same subscript behaves differently when read and when written is exactly the kind of detail an interviewer probes.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Return the longest such stretch instead of the count.\"<\/strong> → Store the <em>first<\/em> position each running total appeared at, not a count; at each entry the length is <code>i − firstIndex[sum − k]<\/code>.<\/li><li><strong>\"What if every number were positive?\"<\/strong> → Then a sliding window works in O(1) space: grow the right edge, shrink from the left while the sum exceeds k.<\/li><li><strong>\"Count stretches whose sum is divisible by k.\"<\/strong> → Same shape, keyed by the running total modulo k — and normalise negative remainders, because Swift's <code>%<\/code> keeps the sign of the left side (<code>-<span class=\"t-num\">1<\/span> % <span class=\"t-num\">5<\/span> == -<span class=\"t-num\">1<\/span><\/code>).<\/li><\/ul><\/div><\/details>", "text": " medium you get an array of integers, which may include negatives and zeros, and a target number k. a stretch is one or more entries that sit next to each other in the array. count how many stretches add up to exactly k. two stretches count separately if they start or end at different positions, even when they hold the same values. numbers k answer the stretches [1, 2, 1, 1, 2] 3 3 [1, 2] , [2, 1] , [1, 2, 1, 1] [3, 3, 3] 3 3 the first 3 , the last 3 , and all three together [0, 0, 0] 0 6 every stretch — three of length 1, two of length 2, one of length 3 constraints that matter: up to 20,000 numbers, each between −1,000 and 1,000, so running totals stay small. checking every start and end is o(n²) — that is the answer to beat. the negatives are the point of the problem: they are what breaks the obvious approach. ::: pattern and cue prefix sums, with a hash map of the sums seen so far. the cue is \"stretches that add up to exactly k\" — a subarray sum. any stretch's total is the difference of two running totals: the total up to its end minus the total just before its start. so \"a stretch ending here sums to k\" becomes \"some earlier running total equals the current one minus k\" — and \"have i seen this value before, how many times?\" is a dictionary lookup. why not a sliding window? a window grows while the sum is too small and shrinks while it is too big. that only works when adding an element always increases the sum. with negatives and zeros it doesn't, so the window has no rule for when to move. ::: ::: approach walk the array once, keeping a running total. keep a dictionary that counts how many times each running total has appeared so far, starting with a total of 0 seen once — that stands for \"nothing taken yet\", and it is what lets a stretch that starts at the very first entry be counted. at each entry, add it to the running total, then ask the dictionary how many earlier totals equal the current total minus k: each one marks the start of a stretch that ends here and sums to k. add that count to the answer, then record the current total. time o(n): one pass, o(1) average per dictionary step. space o(n): at most one dictionary entry per distinct running total. ::: ::: swift solution swift func subarraysum(_ numbers: [int], _ k: int) int { var countbysum: [int: int] = [0: 1] // the empty prefix var sum = 0 var matches = 0 for number in numbers { sum += number matches += countbysum[sum k, default: 0] countbysum[sum, default: 0] += 1 } return matches } the order inside the loop matters: look up, then record. recording first would count the empty stretch that starts and ends at the same place whenever k is 0. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, six more (an empty array, a single entry that does and doesn't match, [ 1, 1, 1] with k 0, [1, 1, 1] with k 2, and alternating [2, 2, 2, 2] with k 0), and 2,000 random arrays with values from −3 to 3, each checked against the o(n²) brute force. ::: ::: walk it through [1, 2, 1, 1, 2] , k = 3 entry running total look for (total − 3) found matches totals seen after — 0 — — 0 0:1 1 1 −2 0 0 0:1, 1:1 2 3 0 1 1 — [1, 2] + 3:1 1 4 1 1 2 — [2, 1] + 4:1 −1 3 0 1 3 — [1, 2, 1, −1] 3:2 2 5 2 0 3 + 5:1 answer 3. [0, 0, 0] , k = 0 — the running total stays 0. before each record the dictionary holds 0:1 , then 0:2 , then 0:3 , so the matches add up 1 + 2 + 3 = 6. that is every stretch, which is right. record before looking up and you'd get 2 + 3 + 4 = 9. ::: ::: the swift trap reading a missing key. countbysum[sum k] is an int? , so matches += countbysum[sum k] doesn't compile. under time pressure the tempting fix is countbysum[sum k]! , which crashes on the first entry — at that point almost nothing has been seen. use countbysum[sum k, default: 0] : in a read, the default subscript just returns 0 and does not insert the key, so lookups never grow the dictionary. in a write — countbysum[sum, default: 0] += 1 — it inserts and increments in one hash. knowing that the same subscript behaves differently when read and when written is exactly the kind of detail an interviewer probes. ::: ::: what they ask next \"return the longest such stretch instead of the count.\" → store the first position each running total appeared at, not a count; at each entry the length is i − firstindex[sum − k] . \"what if every number were positive?\" → then a sliding window works in o(1) space: grow the right edge, shrink from the left while the sum exceeds k. \"count stretches whose sum is divisible by k.\" → same shape, keyed by the running total modulo k — and normalise negative remainders, because swift's % keeps the sign of the left side ( 1 % 5 == 1 ). ::: ", "outline": []}, {"slug": "valid-palindrome", "title": "6 · Valid Palindrome", "summary": "Decide whether a sentence reads the same forwards and backwards once you ignore case, spaces and punctuation.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 125 · Valid Palindrome", "url": "https://leetcode.com/problems/valid-palindrome/"}, {"ref": "", "label": "Swift standard library · String.Index", "url": "https://developer.apple.com/documentation/swift/string/index"}, {"ref": "", "label": "Swift standard library · Character.isLetter", "url": "https://developer.apple.com/documentation/swift/character/isletter"}], "html": "<p><em>Easy · G — the warm-up; the point is to finish it clean in under ten minutes<\/em><\/p><p>You get a string. Keep only its letters and digits, treat uppercase and lowercase as the same, and decide whether what's left reads the same forwards and backwards. A string with nothing left after that clean-up counts as reading the same both ways.<\/p><div class=\"scroll\"><table><thead><tr><th>Text<\/th><th>Answer<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code><span class=\"t-str\">&quot;Taco cat&quot;<\/span><\/code><\/td><td><code><span class=\"t-kw\">true<\/span><\/code><\/td><td>cleaned: <code>tacocat<\/code><\/td><\/tr><tr><td><code><span class=\"t-str\">&quot;Coffee&quot;<\/span><\/code><\/td><td><code><span class=\"t-kw\">false<\/span><\/code><\/td><td>cleaned: <code>coffee<\/code>, backwards <code>eeffoc<\/code><\/td><\/tr><tr><td><code><span class=\"t-str\">&quot;, ;&quot;<\/span><\/code><\/td><td><code><span class=\"t-kw\">true<\/span><\/code><\/td><td>nothing left — the empty string is a palindrome<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: up to 200,000 characters, all printable ASCII. Letters and digits both count; everything else is skipped. The simple answer builds a cleaned copy and compares it with its reverse — correct, but it uses O(n) extra memory, and the follow-up will be to do without it.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Two pointers, moving inward from both ends.<\/strong> The cue is <em>\"reads the same forwards and backwards\"<\/em> — you are comparing the first with the last, the second with the second-to-last, and so on. Two positions walking toward each other do that in one pass, and skipping punctuation is just \"move this pointer on without comparing\".<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Put one finger on the first character and one on the last. If the left finger is on something that isn't a letter or digit, move it right; if the right finger is, move it left. When both are on letters or digits, compare them ignoring case: if they differ, the answer is no; if they match, move both inward. When the fingers meet or cross, every pair matched, so the answer is yes.<\/p><p>Time O(n): each finger only moves inward, so together they visit each character once. Space O(n) in the version below, because it copies the string into an array for indexing; the String.Index version in the trap is O(1).<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> isPalindrome(_ text: <span class=\"t-typ\">String<\/span>) -&gt; <span class=\"t-typ\">Bool<\/span> {\n    <span class=\"t-kw\">let<\/span> characters = <span class=\"t-typ\">Array<\/span>(text)\n    <span class=\"t-kw\">var<\/span> left = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> right = characters.count - <span class=\"t-num\">1<\/span>\n\n    <span class=\"t-kw\">while<\/span> left &lt; right {\n        <span class=\"t-kw\">guard<\/span> isAlphanumeric(characters[left]) <span class=\"t-kw\">else<\/span> { left += <span class=\"t-num\">1<\/span>; <span class=\"t-kw\">continue<\/span> }\n        <span class=\"t-kw\">guard<\/span> isAlphanumeric(characters[right]) <span class=\"t-kw\">else<\/span> { right -= <span class=\"t-num\">1<\/span>; <span class=\"t-kw\">continue<\/span> }\n        <span class=\"t-kw\">if<\/span> characters[left].lowercased() != characters[right].lowercased() {\n            <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">false<\/span>\n        }\n        left += <span class=\"t-num\">1<\/span>\n        right -= <span class=\"t-num\">1<\/span>\n    }\n    <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">true<\/span>\n}\n\n<span class=\"t-kw\">func<\/span> isAlphanumeric(_ character: <span class=\"t-typ\">Character<\/span>) -&gt; <span class=\"t-typ\">Bool<\/span> {\n    character.isASCII &amp;&amp; (character.isLetter || character.isNumber)\n}<\/code><\/pre><\/div><p>For an empty string <code>right<\/code> starts at −1, the loop never runs, and the answer is <code><span class=\"t-kw\">true<\/span><\/code> — no special case, but say that you checked.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above plus nine more — the empty string, one character, letters mixed with digits (<code><span class=\"t-str\">&quot;ab2A&quot;<\/span><\/code>, <code><span class=\"t-str\">&quot;1a1&quot;<\/span><\/code>, <code><span class=\"t-str\">&quot;0P&quot;<\/span><\/code>), a full sentence with punctuation, a trailing full stop, and two strings with accented letters that the ASCII rule skips.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code><span class=\"t-str\">&quot;Taco cat&quot;<\/span><\/code><\/strong> — eight characters, positions 0 to 7.<\/p><div class=\"scroll\"><table><thead><tr><th>Left<\/th><th>Right<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>0 <code><span class=\"t-typ\">T<\/span><\/code><\/td><td>7 <code>t<\/code><\/td><td>same ignoring case → move both<\/td><\/tr><tr><td>1 <code>a<\/code><\/td><td>6 <code>a<\/code><\/td><td>same → move both<\/td><\/tr><tr><td>2 <code>c<\/code><\/td><td>5 <code>c<\/code><\/td><td>same → move both<\/td><\/tr><tr><td>3 <code>o<\/code><\/td><td>4 <code>␣<\/code><\/td><td>right is a space → right moves to 3<\/td><\/tr><tr><td>3<\/td><td>3<\/td><td>fingers meet → <code><span class=\"t-kw\">true<\/span><\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong><code><span class=\"t-str\">&quot;, ;&quot;<\/span><\/code><\/strong> — left skips <code>,<\/code> then the space and reaches position 2; right is already at 2. <code><span class=\"t-num\">2<\/span> &lt; <span class=\"t-num\">2<\/span><\/code> is false, the loop ends, <code><span class=\"t-kw\">true<\/span><\/code>.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>You can't write <code>text[left]<\/code> with an <code><span class=\"t-typ\">Int<\/span><\/code>.<\/strong> A Swift <code><span class=\"t-typ\">String<\/span><\/code> is a collection of <code><span class=\"t-typ\">Character<\/span><\/code>s, each possibly several bytes, so it has no integer indexing. There are two honest ways out, and you should name the cost of each. <code><span class=\"t-typ\">Array<\/span>(text)<\/code> gives you integer indexing at the price of an O(n) copy — what the solution above does. Or walk two <code><span class=\"t-typ\">String<\/span>.<span class=\"t-typ\">Index<\/span><\/code> values with <code>text.index(after:)<\/code> and <code>text.index(before:)<\/code>, which is O(1) extra space and exactly what \"can you do it without the copy?\" is asking for. Either is fine; writing <code>text[text.index(text.startIndex, offsetBy: i)]<\/code> inside the loop is not — each of those is O(i), and the whole thing quietly becomes O(n²).<\/p><p>Smaller one: <code><span class=\"t-typ\">Character<\/span>.isLetter<\/code> and <code>isNumber<\/code> are Unicode-wide — <code><span class=\"t-str\">&quot;é&quot;<\/span><\/code> is a letter, <code><span class=\"t-str\">&quot;½&quot;<\/span><\/code> is a number. The problem means ASCII, hence the <code>isASCII<\/code> check. And <code><span class=\"t-typ\">Character<\/span>.lowercased()<\/code> returns a <code><span class=\"t-typ\">String<\/span><\/code>, not a <code><span class=\"t-typ\">Character<\/span><\/code>; comparing two strings is fine, but don't try to store it back into a <code>[<span class=\"t-typ\">Character<\/span>]<\/code>.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Do it in O(1) extra space.\"<\/strong> → Two <code><span class=\"t-typ\">String<\/span>.<span class=\"t-typ\">Index<\/span><\/code> values, <code>index(after:)<\/code> and <code>index(before:)<\/code>, loop while <code>left &lt; right<\/code>. Same logic.<\/li><li><strong>\"May you delete at most one character to make it a palindrome?\"<\/strong> → On the first mismatch, try skipping the left character or the right one, and check the rest of each with the same two-pointer loop. Still O(n).<\/li><li><strong>\"Unicode text, where <code>é<\/code> should equal <code>e<\/code>?\"<\/strong> → Normalise first: <code>text.folding(options: [.caseInsensitive, .diacriticInsensitive], locale: <span class=\"t-kw\">nil<\/span>)<\/code> from Foundation, then drop the <code>isASCII<\/code> check.<\/li><\/ul><\/div><\/details>", "text": " easy · g — the warm up; the point is to finish it clean in under ten minutes you get a string. keep only its letters and digits, treat uppercase and lowercase as the same, and decide whether what's left reads the same forwards and backwards. a string with nothing left after that clean up counts as reading the same both ways. text answer why \"taco cat\" true cleaned: tacocat \"coffee\" false cleaned: coffee , backwards eeffoc \", ;\" true nothing left — the empty string is a palindrome constraints that matter: up to 200,000 characters, all printable ascii. letters and digits both count; everything else is skipped. the simple answer builds a cleaned copy and compares it with its reverse — correct, but it uses o(n) extra memory, and the follow up will be to do without it. ::: pattern and cue two pointers, moving inward from both ends. the cue is \"reads the same forwards and backwards\" — you are comparing the first with the last, the second with the second to last, and so on. two positions walking toward each other do that in one pass, and skipping punctuation is just \"move this pointer on without comparing\". ::: ::: approach put one finger on the first character and one on the last. if the left finger is on something that isn't a letter or digit, move it right; if the right finger is, move it left. when both are on letters or digits, compare them ignoring case: if they differ, the answer is no; if they match, move both inward. when the fingers meet or cross, every pair matched, so the answer is yes. time o(n): each finger only moves inward, so together they visit each character once. space o(n) in the version below, because it copies the string into an array for indexing; the string.index version in the trap is o(1). ::: ::: swift solution swift func ispalindrome(_ text: string) bool { let characters = array(text) var left = 0 var right = characters.count 1 while left < right { guard isalphanumeric(characters[left]) else { left += 1; continue } guard isalphanumeric(characters[right]) else { right = 1; continue } if characters[left].lowercased() != characters[right].lowercased() { return false } left += 1 right = 1 } return true } func isalphanumeric(_ character: character) bool { character.isascii && (character.isletter character.isnumber) } for an empty string right starts at −1, the loop never runs, and the answer is true — no special case, but say that you checked. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus nine more — the empty string, one character, letters mixed with digits ( \"ab2a\" , \"1a1\" , \"0p\" ), a full sentence with punctuation, a trailing full stop, and two strings with accented letters that the ascii rule skips. ::: ::: walk it through \"taco cat\" — eight characters, positions 0 to 7. left right action 0 t 7 t same ignoring case → move both 1 a 6 a same → move both 2 c 5 c same → move both 3 o 4 ␣ right is a space → right moves to 3 3 3 fingers meet → true \", ;\" — left skips , then the space and reaches position 2; right is already at 2. 2 < 2 is false, the loop ends, true . ::: ::: the swift trap you can't write text[left] with an int . a swift string is a collection of character s, each possibly several bytes, so it has no integer indexing. there are two honest ways out, and you should name the cost of each. array(text) gives you integer indexing at the price of an o(n) copy — what the solution above does. or walk two string.index values with text.index(after:) and text.index(before:) , which is o(1) extra space and exactly what \"can you do it without the copy?\" is asking for. either is fine; writing text[text.index(text.startindex, offsetby: i)] inside the loop is not — each of those is o(i), and the whole thing quietly becomes o(n²). smaller one: character.isletter and isnumber are unicode wide — \"é\" is a letter, \"½\" is a number. the problem means ascii, hence the isascii check. and character.lowercased() returns a string , not a character ; comparing two strings is fine, but don't try to store it back into a [character] . ::: ::: what they ask next \"do it in o(1) extra space.\" → two string.index values, index(after:) and index(before:) , loop while left < right . same logic. \"may you delete at most one character to make it a palindrome?\" → on the first mismatch, try skipping the left character or the right one, and check the rest of each with the same two pointer loop. still o(n). \"unicode text, where é should equal e ?\" → normalise first: text.folding(options: [.caseinsensitive, .diacriticinsensitive], locale: nil) from foundation, then drop the isascii check. ::: ", "outline": []}, {"slug": "two-sum-ii-input-array-is-sorted", "title": "7 · Two Sum II — Input Array Is Sorted", "summary": "Given a list of whole numbers already in ascending order and a target, find the two entries that add up to it, using no extra memory.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 167 · Two Sum II — Input Array Is Sorted", "url": "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"}, {"ref": "", "label": "Swift standard library · addingReportingOverflow(_:)", "url": "https://developer.apple.com/documentation/swift/int/addingreportingoverflow(_:)"}], "html": "<p><em>Medium — problem 1 again, with one new constraint that changes the best answer<\/em><\/p><p>You get an array of integers sorted from smallest to largest, and a target. Exactly two different entries add up to the target. Return their positions <strong>counted from 1<\/strong>, smaller first. The catch: you may only use a constant amount of extra memory — no dictionary.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>Target<\/th><th>Answer<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">13<\/span>]<\/code><\/td><td><code><span class=\"t-num\">16<\/span><\/code><\/td><td><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><td>3 + 13<\/td><\/tr><tr><td><code>[-<span class=\"t-num\">3<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">4<\/span>]<\/code><\/td><td><code>-<span class=\"t-num\">4<\/span><\/code><\/td><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>−3 + −1<\/td><\/tr><tr><td><code>[<span class=\"t-num\">5<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><td><code><span class=\"t-num\">10<\/span><\/code><\/td><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td>two different entries with the same value<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 2 and 30,000 numbers, each between −1,000 and 1,000; exactly one answer exists. The dictionary answer from problem 1 still works, but it uses O(n) memory, which this version forbids.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Two pointers, from both ends inward.<\/strong> The cues are <em>\"sorted\"<\/em> and <em>\"constant extra memory\"<\/em>. Sorted means that moving right always gives a bigger number and moving left a smaller one — so a sum that is too small has exactly one fix (move the left end up) and a sum that is too big has exactly one fix (move the right end down). No lookup table is needed, because the order itself tells you which way to go.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Start with one finger on the smallest number and one on the largest. Add them. If the sum is the target, you are done. If it is too small, the smallest number can't be part of the answer — even paired with the largest, it falls short — so move the left finger right. If it is too big, the largest can't be part of it, so move the right finger left. Each step rules out one number for good.<\/p><p>Time O(n): every step moves one finger inward, and they can only meet once. Space O(1): two positions and a sum.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> twoSum(_ numbers: [<span class=\"t-typ\">Int<\/span>], _ target: <span class=\"t-typ\">Int<\/span>) -&gt; [<span class=\"t-typ\">Int<\/span>] {\n    <span class=\"t-kw\">var<\/span> left = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">var<\/span> right = numbers.count - <span class=\"t-num\">1<\/span>\n\n    <span class=\"t-kw\">while<\/span> left &lt; right {\n        <span class=\"t-kw\">let<\/span> (sum, overflowed) = numbers[left].addingReportingOverflow(numbers[right])\n        <span class=\"t-kw\">if<\/span> !overflowed &amp;&amp; sum == target {\n            <span class=\"t-kw\">return<\/span> [left + <span class=\"t-num\">1<\/span>, right + <span class=\"t-num\">1<\/span>]          <span class=\"t-com\">// positions are 1-based<\/span>\n        }\n        <span class=\"t-com\">// On overflow the true sum is past Int&#x27;s range in the direction of the larger value.<\/span>\n        <span class=\"t-kw\">let<\/span> tooBig = overflowed ? numbers[right] &gt; <span class=\"t-num\">0<\/span> : sum &gt; target\n        <span class=\"t-kw\">if<\/span> tooBig { right -= <span class=\"t-num\">1<\/span> } <span class=\"t-kw\">else<\/span> { left += <span class=\"t-num\">1<\/span> }\n    }\n    <span class=\"t-kw\">return<\/span> []\n}<\/code><\/pre><\/div><p>Within the stated constraints the plain <code><span class=\"t-kw\">let<\/span> sum = numbers[left] + numbers[right]<\/code> is fine — say so, and say why you'd guard it in production (see the trap).<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above plus seven more — the minimum two entries, zeros, a long run of equal values before the partner, a mixed-sign array, and three arrays holding <code><span class=\"t-typ\">Int<\/span>.max<\/code> or <code><span class=\"t-typ\">Int<\/span>.min<\/code>, which crash the unguarded version.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">3<\/span>, <span class=\"t-num\">5<\/span>, <span class=\"t-num\">8<\/span>, <span class=\"t-num\">13<\/span>]<\/code>, target 16<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Left<\/th><th>Right<\/th><th>Sum<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>1 → <code><span class=\"t-num\">2<\/span><\/code><\/td><td>5 → <code><span class=\"t-num\">13<\/span><\/code><\/td><td>15<\/td><td>too small → left moves<\/td><\/tr><tr><td>2 → <code><span class=\"t-num\">3<\/span><\/code><\/td><td>5 → <code><span class=\"t-num\">13<\/span><\/code><\/td><td>16<\/td><td>found → <code>[<span class=\"t-num\">2<\/span>, <span class=\"t-num\">5<\/span>]<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong><code>[<span class=\"t-num\">5<\/span>, <span class=\"t-num\">5<\/span>]<\/code>, target 10<\/strong> — left on position 1, right on position 2, sum 10, answer <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code>. The two fingers start on different entries, so equal values are never a problem.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>The sum of two valid entries can crash.<\/strong> The answer pair always fits in <code><span class=\"t-typ\">Int<\/span><\/code> — its sum is the target — but the pairs you try on the way don't have to. With <code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-typ\">Int<\/span>.max]<\/code> and target 3, the first step adds <code><span class=\"t-num\">1<\/span> + <span class=\"t-typ\">Int<\/span>.max<\/code>, and Swift traps where C would wrap. Rewriting the check as <code>numbers[left] &gt; target - numbers[right]<\/code> only moves the problem to the subtraction. <code>addingReportingOverflow<\/code> gives you the wrapped result plus a flag, and in a sorted array the direction of an overflow tells you which finger to move: overflowing upward means the sum is too big.<\/p><p>The other slip here is not Swift's fault: the answer is <strong>1-based<\/strong>. Returning <code>[left, right]<\/code> passes every self-made test and fails the grader. Read the statement back (the R in REACTO) and you catch it.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Why does moving the left pointer never skip the answer?\"<\/strong> → If the sum is too small with the largest remaining number, the current left number can't reach the target with anything, so discarding it is safe. Same argument mirrored for the right.<\/li><li><strong>\"Return every pair, not just one.\"<\/strong> → On a match, record it, move both fingers, and skip past repeats of each value so pairs aren't duplicated. That skip is the heart of the next problem.<\/li><li><strong>\"The array isn't sorted.\"<\/strong> → Either sort pairs of (value, position) — O(n log n), O(n) space — or use the dictionary from problem 1, O(n) and O(n). Sorting in place and returning positions doesn't work: the positions move.<\/li><\/ul><\/div><\/details>", "text": " medium — problem 1 again, with one new constraint that changes the best answer you get an array of integers sorted from smallest to largest, and a target. exactly two different entries add up to the target. return their positions counted from 1 , smaller first. the catch: you may only use a constant amount of extra memory — no dictionary. numbers target answer why [2, 3, 5, 8, 13] 16 [2, 5] 3 + 13 [ 3, 1, 0, 4] 4 [1, 2] −3 + −1 [5, 5] 10 [1, 2] two different entries with the same value constraints that matter: between 2 and 30,000 numbers, each between −1,000 and 1,000; exactly one answer exists. the dictionary answer from problem 1 still works, but it uses o(n) memory, which this version forbids. ::: pattern and cue two pointers, from both ends inward. the cues are \"sorted\" and \"constant extra memory\" . sorted means that moving right always gives a bigger number and moving left a smaller one — so a sum that is too small has exactly one fix (move the left end up) and a sum that is too big has exactly one fix (move the right end down). no lookup table is needed, because the order itself tells you which way to go. ::: ::: approach start with one finger on the s
