he one place the app asks for data, which hides whether it came from the server or the phone.<\/li><li><strong>Cache<\/strong> — a kept copy of something fetched before, so it's instant next time.<\/li><li><strong>Main thread / main actor<\/strong> — the single lane that draws the screen. Slow work there freezes scrolling, so it's kept short.<\/li><li><strong>Optimistic update<\/strong> — showing the result of a tap (the red heart) immediately, before the server confirms, and undoing it if the server says no.<\/li><li><strong>Idempotent<\/strong> — a request that has the same effect sent once or twice (\"set liked to yes\"), so repeating it after a network blip is safe.<\/li><li><strong>Decode, pixel<\/strong> — a photo arrives compressed (a JPEG); <em>decoding<\/em> unpacks it into the grid of coloured dots (<em>pixels<\/em>) the screen draws. Unpacked, it's many times bigger.<\/li><\/ul><\/div><\/details><details class=\"reveal\"><summary>1 · The interviewer answers your clarifying questions<\/summary><div class=\"reveal-body\"><p>Ask yours first. These are the answers you'd get, and the assumptions the rest of this chapter runs on.<\/p><p><strong>\"What's in a post?\"<\/strong> → <em>One photo, an author, a caption, a like count and whether I liked it. Carousels and video exist in the real app; leave them out.<\/em><\/p><p><strong>\"Who orders the feed — chronological or ranked?\"<\/strong> → <em>Ranked, by the server. The client gets pages in order and doesn't reorder.<\/em><\/p><p><strong>\"How much should work offline?\"<\/strong> → <em>Opening the app on the U-Bahn should show what you saw last time. Posting and liking offline are nice-to-haves.<\/em><\/p><p><strong>\"Do new posts appear live?\"<\/strong> → <em>We'd like the user to know there's something new. We don't need a live socket for it.<\/em><\/p><p><strong>\"Which interactions matter?\"<\/strong> → <em>Like and unlike from the feed. Comments open a separate screen — out of scope.<\/em><\/p><p><strong>\"Minimum OS, UIKit or SwiftUI?\"<\/strong> → <em>iOS 17 minimum. SwiftUI app, but the feed screen is the most performance-sensitive thing we have — tell me what you'd use.<\/em><\/p><p><strong>\"What hurts today?\"<\/strong> → <em>Stutter when flinging on older phones, the list jumping when images load, and data use.<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>2 · Requirements and scope — what you should have said<\/summary><div class=\"reveal-body\"><p><strong>Out of scope, stated first:<\/strong> ranking and the server timeline, posting and the camera, comments, stories, video and carousels, ads, search. The image loading pipeline is in scope only as a dependency — it's question 1, and you say so.<\/p><p><strong>Functional — four<\/strong><\/p><ol start=\"1\"><li>Show a ranked feed of photo posts that loads more as you scroll, without a visible wait in normal conditions.<\/li><li>Pull to refresh; tell the user when newer posts exist, without moving what they're reading.<\/li><li>Like and unlike, instantly, surviving a refresh and a flaky network.<\/li><li>Show the last-seen feed immediately on launch, including offline.<\/li><\/ol><p><strong>Non-functional that matter here<\/strong><\/p><ul><li><strong>Smoothness<\/strong> — no dropped frames while flinging on a three-year-old phone. No decode, no JSON parsing, no layout measurement of unknown images on the main actor.<\/li><li><strong>Stability<\/strong> — the content under the user's thumb never moves unless they asked it to.<\/li><li><strong>Memory<\/strong> — bounded however far you scroll; decoded images are the budget, not models.<\/li><li><strong>Data and battery<\/strong> — prefetch a little ahead, not a lot; honour Low Data Mode.<\/li><li><strong>Correctness<\/strong> — no duplicates, no gaps, no stale like state.<\/li><\/ul><p>Then say the axis: <em>\"Everything here trades how far ahead I load against memory, data and battery. Too little and the user waits; too much and we pay for posts nobody sees.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>3 · The idea, in 30 seconds — before you draw anything<\/summary><div class=\"reveal-body\"><p>Say the whole design in plain words first, so the interviewer knows where you're going before the first box appears:<\/p><blockquote class=\"aside plain\"><p><em>\"The feed is a list that loads pages from the server with a cursor. One view model owns that list and decides when to load more. It gets posts from a repository, which hides whether they came from the network or from the copy we saved on disk. Each post carries its image's size, so cells know their height before the image arrives, and the pixels come from the image library we designed in question 1. Three layers: presentation, domain, data.\"<\/em><\/p><\/blockquote><p>That's it: four sentences. If they stop you here, you've already shown the shape of the answer. Everything after this is filling it in.<\/p><\/div><\/details><details class=\"reveal\"><summary>4 · What we need — the components, before the sketch<\/summary><div class=\"reveal-body\"><p>List them out loud, in the order you'll draw them. Name each by <strong>what it does<\/strong>, not by its class name: the interviewer should understand the board without knowing Swift. The type name is a detail you mention while explaining it.<\/p><div class=\"scroll\"><table><thead><tr><th>#<\/th><th>Component<\/th><th>Type name<\/th><th>Layer<\/th><th>Its one job<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>Feed screen<\/strong><\/td><td><code><span class=\"t-typ\">FeedView<\/span><\/code><\/td><td>Presentation<\/td><td>The part of the app you see and scroll. Draws the posts; reports scrolls, pulls and taps.<\/td><\/tr><tr><td>2<\/td><td><strong>Feed view model<\/strong><\/td><td><code><span class=\"t-typ\">FeedViewModel<\/span><\/code><\/td><td>Presentation<\/td><td>The screen's brain: which posts are shown, whether it's loading, when to fetch more.<\/td><\/tr><tr><td>3<\/td><td><strong>Post model<\/strong><\/td><td><code><span class=\"t-typ\">FeedItem<\/span><\/code><\/td><td>Domain<\/td><td>The app's own description of one post: who, the caption, the likes, where the photo is and how big.<\/td><\/tr><tr><td>4<\/td><td><strong>Feed repository<\/strong> (protocol)<\/td><td><code><span class=\"t-typ\">FeedRepository<\/span><\/code><\/td><td>Domain<\/td><td>A written list of what the screen's brain may ask for, without saying how it's done.<\/td><\/tr><tr><td>5<\/td><td><strong>Feed repository<\/strong> (the real one)<\/td><td><code><span class=\"t-typ\">RemoteFeedRepository<\/span><\/code><\/td><td>Data<\/td><td>Does what that list promises: answers from the phone's copy or the server, and translates the server's format into the app's.<\/td><\/tr><tr><td>6<\/td><td><strong>API client<\/strong><\/td><td><code><span class=\"t-typ\">FeedAPI<\/span><\/code><\/td><td>Data<\/td><td>The messenger to the company's servers. Brings posts back in the server's own format.<\/td><\/tr><tr><td>7<\/td><td><strong>Local storage<\/strong><\/td><td><code><span class=\"t-typ\">FeedStore<\/span><\/code><\/td><td>Data<\/td><td>A notebook on the phone with the last 200 posts, so the app opens even without internet.<\/td><\/tr><tr><td>8<\/td><td><strong>Image loader<\/strong><\/td><td><code><span class=\"t-typ\">ImagePipeline<\/span><\/code><\/td><td>Reused<\/td><td>The photo library from question 1: fetches photos, shrinks them, remembers them.<\/td><\/tr><\/tbody><\/table><\/div><p>Then say what's deliberately <strong>not<\/strong> on the list yet: an outbox for offline likes, a shared post store for several screens, a socket for live posts. <em>\"I'll add those if we go there.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>5 · The sketch<\/summary><div class=\"reveal-body\"><div class=\"board\"><pre class=\"board-src\">flowchart TB\n  subgraph P[&quot;PRESENTATION&quot;]\n    View[&quot;`**1 · Feed screen**\nFeedView`&quot;] -- &quot;user actions → posts&quot; --&gt; VM[&quot;`**2 · Feed view model**\nFeedViewModel`&quot;]\n  end\n  subgraph D[&quot;DOMAIN&quot;]\n    Item[&quot;`**3 · Post model**\nFeedItem\nthe app&#x27;s own shape`&quot;]\n    Repo[&quot;`**4 · Feed repository**\n«protocol»`&quot;]\n  end\n  subgraph DA[&quot;DATA&quot;]\n    Impl[&quot;`**5 · Feed repository**\nRemoteFeedRepository\nmaps DTO → FeedItem`&quot;]\n    API[&quot;`**6 · API client**\nFeedAPI\nreturns DTOs`&quot;]\n    Store[&quot;`**7 · Local storage**\nFeedStore`&quot;]\n  end\n  Pipe[&quot;`**8 · Image loader**\nfrom question 1`&quot;]\n  VM -- &quot;ask for posts → FeedItems&quot; --&gt; Repo\n  Repo ~~~ Impl\n  Impl -. &quot;implements&quot; .-&gt; Repo\n  Impl -- &quot;requests → DTOs&quot; --&gt; API\n  Impl -- &quot;load · save posts&quot; --&gt; Store\n  View -- &quot;photo URL + size → image&quot; --&gt; Pipe\n  class View,VM pres\n  class Item,Repo dom\n  class Impl,Store data\n  class API net\n  class Pipe reuse<\/pre><\/div><p>Each card is <strong>what it does<\/strong> in bold, with the type name underneath. A newcomer to the board reads the bold line; you say the type name as you point at it.<\/p><p><strong>How to read the arrows.<\/strong> A solid arrow means <em>asks<\/em>: it points from the part that asks to the part that answers, which is also the direction of dependency. Its label reads <strong>request → reply<\/strong>, so the data coming back travels the other way along the same arrow. The dashed arrow means <em>implements<\/em>. Section 7 replays the same flow step by step.<\/p><p><strong>Drawing it on Miro, step by step<\/strong> (about four minutes, talking the whole time):<\/p><ol start=\"1\"><li>Three wide frames stacked top to bottom: <strong>Presentation<\/strong>, <strong>Domain<\/strong>, <strong>Data<\/strong>. Label them before putting anything in them.<\/li><li>Fill them in the order of your list, one card per component, one colour per layer: blue for presentation, purple for domain, green for data, orange for anything that crosses the network, grey and dashed for the reused image loader.<\/li><li>Arrows last, each pointing from the part that asks to the part that answers, labelled <strong>request → reply<\/strong>: the screen reports what the user did and gets posts to show; the view model asks the repository for posts; the real repository fetches pages from the API client and loads and saves posts in local storage; each row asks the image loader for its photo. Then one dashed arrow <strong>up<\/strong> from the real repository to the protocol, labelled \"implements\".<\/li><li>Write «protocol» on the domain repository card. This is where dependency inversion shows: <strong>both<\/strong> arrows touching that card point <em>at<\/em> it. The view model depends on the protocol (from above), and the data layer depends on it too (from below, by implementing it). Nothing in the domain points down at the data layer, so the domain never depends on networking or storage. <em>\"Everything else is behind a protocol too, for tests. This is the one that defines the architecture.\"<\/em><\/li><\/ol><p>Eight cards, three frames, five arrows. Methods don't go on the board; they come up when the interviewer asks about a component, which is the next section.<\/p><\/div><\/details><details class=\"reveal\"><summary>6 · Each component: its job, its interface, the choice inside it<\/summary><div class=\"reveal-body\"><p>Point at each card and cover three things: <strong>what it owns<\/strong>, <strong>its interface<\/strong> (what others can call or read, which is what an interviewer means by \"what does this expose?\"), and <strong>the choice you made inside it<\/strong>. The <em>Under the hood<\/em> notes are for learning; you won't recite them in the room, but they're what lets you answer the follow-up.<\/p><h3 id=\"1-feed-screen-feedview\">1 · Feed screen (<code><span class=\"t-typ\">FeedView<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> the part of the app you actually see and scroll. It draws the posts it's handed and tells the rest of the app what you did: scrolled near the bottom, pulled down to refresh, tapped a heart. Like a shop window: it shows things, it doesn't decide what's in stock.<\/p><p><strong>Owns:<\/strong> nothing. It renders the posts it's given and reports what the user did.<\/p><p><strong>Interface:<\/strong> it's created with a view model, reads three things from it (<code>items<\/code>, <code>phase<\/code>, <code>newerAvailable<\/code>), and calls four (<code>onAppear<\/code>, <code>onNearEnd<\/code>, <code>refresh<\/code>, <code>toggleLike<\/code>). No other dependency: if the screen needs to know something, the view model exposes it.<\/p><p><strong>The choice inside it:<\/strong> <code><span class=\"t-typ\">UICollectionView<\/span><\/code> with a diffable data source, wrapped in <code><span class=\"t-typ\">UIViewControllerRepresentable<\/span><\/code>, because it recycles rows, has a prefetch callback, and has been tuned for this for a decade. <em>Rejected:<\/em> SwiftUI <code><span class=\"t-typ\">LazyVStack<\/span><\/code>, which creates rows lazily but is widely reported to keep them, so memory grows with how far you scroll. <em>Switch condition:<\/em> simple rows on iOS 18, where <code><span class=\"t-typ\">List<\/span><\/code> profiles clean on the oldest supported phone.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> the list doesn't build a row for every post. It keeps about a screenful of rows and repaints them as you scroll, like a waiter reusing the same few plates. So a row must never assume what it showed a moment ago.<\/p><p><em>The detail:<\/em> A collection view keeps only the rows on screen plus a few spare; when a row scrolls off, it's <em>reused<\/em> for the one scrolling on. That's why a row must never assume what it showed before, and why images are requested per row and cancelled on reuse. A <em>diffable data source<\/em> takes a list of IDs, works out what was inserted, removed or moved, and animates only that. It needs every ID to be unique, which is why duplicate posts must be filtered out (a duplicate crashes, rather than glitching).<\/p><\/blockquote><h3 id=\"2-feed-view-model-feedviewmodel\">2 · Feed view model (<code><span class=\"t-typ\">FeedViewModel<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> the screen's brain. It keeps the list of posts currently shown, knows whether something is loading or failed, and decides when it's time to fetch the next batch. The screen only ever asks it \"what should I show now?\"<\/p><p><strong>Owns:<\/strong> everything the screen shows: the posts, the loading state, whether newer posts exist, and the cursor for the next page.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span> <span class=\"t-atr\">@Observable<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">FeedViewModel<\/span> {\n    <span class=\"t-kw\">init<\/span>(repository: <span class=\"t-typ\">FeedRepository<\/span>)\n\n    <span class=\"t-com\">/// What the list shows<\/span>\n    <span class=\"t-kw\">private<\/span>(<span class=\"t-kw\">set<\/span>) <span class=\"t-kw\">var<\/span> items: [<span class=\"t-typ\">FeedItem<\/span>]\n    <span class=\"t-com\">/// Idle, loading first / more, refreshing, failed, no more pages<\/span>\n    <span class=\"t-kw\">private<\/span>(<span class=\"t-kw\">set<\/span>) <span class=\"t-kw\">var<\/span> phase: <span class=\"t-typ\">Phase<\/span>\n    <span class=\"t-com\">/// Drives the &quot;new posts&quot; pill<\/span>\n    <span class=\"t-kw\">private<\/span>(<span class=\"t-kw\">set<\/span>) <span class=\"t-kw\">var<\/span> newerAvailable: <span class=\"t-typ\">Bool<\/span>\n\n    <span class=\"t-com\">/// Saved posts, then page 1<\/span>\n    <span class=\"t-kw\">func<\/span> onAppear() <span class=\"t-kw\">async<\/span>\n    <span class=\"t-com\">/// The only way the next page loads<\/span>\n    <span class=\"t-kw\">func<\/span> onNearEnd() <span class=\"t-kw\">async<\/span>\n    <span class=\"t-com\">/// Pull to refresh<\/span>\n    <span class=\"t-kw\">func<\/span> refresh() <span class=\"t-kw\">async<\/span>\n    <span class=\"t-com\">/// Optimistic, see deep dive 11<\/span>\n    <span class=\"t-kw\">func<\/span> toggleLike(_ id: <span class=\"t-typ\">PostID<\/span>)\n}<\/code><\/pre><\/div><p><strong>The choices inside it:<\/strong><\/p><ul><li><strong>One <code>phase<\/code>, not five booleans.<\/strong> Separate <code>isLoading<\/code>, <code>isRefreshing<\/code>, <code>hasError<\/code> flags allow states that can't exist, like loading <em>and<\/em> failed at once. One value with six cases can't.<\/li><li><strong>On the main actor<\/strong>, because the screen reads it every frame. Every change happens in one place, so \"is it already loading? if not, start\" needs no lock.<\/li><li><strong>Why MVVM.<\/strong> The view model is what makes the feed testable without a screen: give it a fake repository, call <code>onNearEnd()<\/code> twice, check one request went out. <em>Rejected:<\/em> a single reducer store (TCA-style), which buys a strict event log at the cost of a dependency and a learning curve. <em>Switch condition:<\/em> several screens sharing feed state.<\/li><\/ul><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> the screen redraws only the parts whose information changed, like a scoreboard that flips one digit instead of repainting the whole board.<\/p><p><em>The detail:<\/em> <code><span class=\"t-atr\">@Observable<\/span><\/code> (iOS 17) makes SwiftUI track exactly which properties a view <em>read<\/em> while drawing, and redraw that view only when one of those changes. A row that reads one post's like count isn't redrawn when <code>phase<\/code> flips. The older <code><span class=\"t-typ\">ObservableObject<\/span><\/code> redraws every listener on any <code><span class=\"t-atr\">@Published<\/span><\/code> change. <code><span class=\"t-atr\">@MainActor<\/span><\/code> means \"all of this runs on the main thread\", enforced by the compiler, so the UI never reads half-updated state.<\/p><\/blockquote><h3 id=\"3-post-model-feeditem\">3 · Post model (<code><span class=\"t-typ\">FeedItem<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> a description of one post, like an index card: who posted it, the caption, the number of likes, whether you liked it, and the address of the photo with its width and height. The card says <em>where<\/em> the photo is, never holds the photo itself.<\/p><p><strong>Owns:<\/strong> one post's data. No behaviour.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">FeedItem<\/span>: <span class=\"t-typ\">Identifiable<\/span>, <span class=\"t-typ\">Hashable<\/span>, <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">let<\/span> id: <span class=\"t-typ\">PostID<\/span>\n    <span class=\"t-com\">/// Name, avatar URL<\/span>\n    <span class=\"t-kw\">let<\/span> author: <span class=\"t-typ\">Author<\/span>\n    <span class=\"t-kw\">let<\/span> caption: <span class=\"t-typ\">String<\/span>\n    <span class=\"t-com\">/// URL, pixel width, pixel height, placeholder colour<\/span>\n    <span class=\"t-kw\">let<\/span> image: <span class=\"t-typ\">ImageRef<\/span>\n    <span class=\"t-kw\">var<\/span> likeCount: <span class=\"t-typ\">Int<\/span>\n    <span class=\"t-kw\">var<\/span> likedByMe: <span class=\"t-typ\">Bool<\/span>\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> <strong>no <code><span class=\"t-typ\">UIImage<\/span><\/code> in the model.<\/strong> The image's width and height are in it, because they decide the row's height before any pixel arrives.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> a post's text is tiny, but its photo, once unpacked for the screen, is thousands of times bigger. So each post carries only the photo's address and size, and the photos themselves live in one place with a size limit.<\/p><p><em>The detail:<\/em> A post as data is about a kilobyte, so ten thousand of them is about 10 MB. A decoded photo is width × height × 4 bytes: a 12-megapixel photo is about 48 MB. Put images in the model and the model's memory grows with every post scrolled past; leave them to the image loader, whose cache has a fixed budget, and memory stays flat. <code><span class=\"t-typ\">Sendable<\/span><\/code> means the struct can safely be handed from a background task to the main actor, which is how a page travels from the network to the screen.<\/p><\/blockquote><h3 id=\"4-feed-repository-the-protocol-feedrepository\">4 · Feed repository, the protocol (<code><span class=\"t-typ\">FeedRepository<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> a written menu of what the screen's brain is allowed to ask for: the posts saved on the phone, the next page, how many new posts there are, and \"like this\". It lists what you can order, not how the kitchen cooks it, so the kitchen can change without the menu changing.<\/p><p><strong>Owns:<\/strong> nothing. It's a list of promises the data layer makes to the view model.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">FeedRepository<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-com\">/// What we stored last time, instantly<\/span>\n    <span class=\"t-kw\">func<\/span> savedFeed() <span class=\"t-kw\">async<\/span> -&gt; [<span class=\"t-typ\">FeedItem<\/span>]\n    <span class=\"t-com\">/// Posts + next cursor (nil = no more)<\/span>\n    <span class=\"t-kw\">func<\/span> page(after cursor: <span class=\"t-typ\">Cursor<\/span>?) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">FeedPage<\/span>\n    <span class=\"t-com\">/// For the &quot;new posts&quot; pill<\/span>\n    <span class=\"t-kw\">func<\/span> newCount(since token: <span class=\"t-typ\">HeadToken<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Int<\/span>\n    <span class=\"t-com\">/// Like / unlike<\/span>\n    <span class=\"t-kw\">func<\/span> setLiked(_ liked: <span class=\"t-typ\">Bool<\/span>, post: <span class=\"t-typ\">PostID<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span>\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> this is the one protocol drawn on the board. The view model depends on it, never on the real repository, so a test can swap in a fake, and the data layer can change (a database instead of a file, GraphQL instead of REST) without the view model noticing. <em>Rejected:<\/em> use-case classes between the two (<code><span class=\"t-typ\">LoadNextPageUseCase<\/span><\/code>…); each would only forward a call. <em>Switch condition:<\/em> real logic that belongs to neither the screen nor the data, such as combining two repositories.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> think of a restaurant. Card 4 is the <strong>menu<\/strong>: it lists what the screen can order (saved posts, the next page, a like) and says nothing about cooking. Card 5 is the <strong>kitchen<\/strong> that makes each order, from the server or from the phone's notebook. The dashed arrow pointing <strong>up<\/strong> is the kitchen promising to cook what's on the menu: the kitchen adapts to the menu, never the other way round. The screen only ever reads the menu, so you can swap the kitchen (a test kitchen with fake posts, a different server, a database) and the screen never notices, as long as the new kitchen serves what's on the menu. In one line: <em>the screen depends on a promise, not on whoever keeps it, and whoever keeps it depends on the same promise.<\/em><\/p><p><em>The detail:<\/em> This is <em>dependency inversion<\/em>: the higher layer (presentation) defines what it needs as a protocol in the domain, and the lower layer (data) conforms to it. The arrow of dependency points <em>up<\/em> from data to domain, so the screen's code never imports anything about networking. In practice it's what makes the view model unit-testable.<\/p><\/blockquote><h3 id=\"5-feed-repository-the-real-one-remotefeedrepository\">5 · Feed repository, the real one (<code><span class=\"t-typ\">RemoteFeedRepository<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> the kitchen behind that menu. When asked for posts, it decides whether to answer from the copy kept on the phone or to ask the company's servers, and it refreshes the phone's copy when fresh posts arrive.<\/p><p><strong>Owns:<\/strong> the decision of where posts come from, keeping the disk copy fresh, and <strong>translating<\/strong> between the server's format, the saved format and the app's <code><span class=\"t-typ\">FeedItem<\/span><\/code>.<\/p><p><strong>Interface:<\/strong> it conforms to <code><span class=\"t-typ\">FeedRepository<\/span><\/code> (above) and is built from the two things it coordinates: <code><span class=\"t-kw\">init<\/span>(api: <span class=\"t-typ\">FeedAPIType<\/span>, store: <span class=\"t-typ\">FeedStoreType<\/span>)<\/code>. Nothing else is public.<\/p><p><strong>The choices inside it:<\/strong><\/p><ul><li><strong>Where posts come from.<\/strong> <code>savedFeed()<\/code> reads local storage; <code>page(after: <span class=\"t-kw\">nil<\/span>)<\/code> fetches page 1 and, on success, rewrites the saved copy; later pages come from the network only.<\/li><li><strong>Mapping at the boundary.<\/strong> The API client hands back <code><span class=\"t-typ\">PostDTO<\/span><\/code>s, the server's shape; the repository turns each into a <code><span class=\"t-typ\">FeedItem<\/span><\/code>, the app's shape, in one small function. That's where a string date becomes a <code><span class=\"t-typ\">Date<\/span><\/code>, a missing optional gets a default, and a post that can't be shown (no image URL, say) is dropped and logged instead of crashing a screen. Saved posts are mapped the same way, from the store's own record. All of it runs off the main actor, so the view model receives finished values.<\/li><li><em>Rejected:<\/em> decoding the JSON straight into <code><span class=\"t-typ\">FeedItem<\/span><\/code>. One type for both looks simpler, until the server renames a field or makes one optional and every screen that uses posts has to change. <em>Switch condition:<\/em> a throwaway prototype, or an API you own and version together with the app.<\/li><\/ul><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> the repository is the single counter you ask for posts. Behind the counter, someone decides whether they come from the notebook on the phone or from the server; you never have to know.<\/p><p><em>The detail:<\/em> The <em>repository pattern<\/em> puts one object between the app and all its data sources, so callers ask for \"posts\", never \"posts from the network\". It's also where you decide what counts as the truth: here the server is, and the disk is only a copy for opening fast and offline. (An app that edits data offline flips that, and the disk becomes the truth.)<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> the server sends posts on its own form, and the app uses its own form. The repository copies one onto the other. When the server changes its form, only that copying step changes, not every screen that shows a post.<\/p><p><em>The detail:<\/em> A <em>DTO<\/em> (data transfer object) is a type that exists only to match the outside world's format, field for field: the server's JSON, or the shape you save on disk. The <em>domain model<\/em> is the app's own idea of the same thing, in the types the app wants. Keeping them separate means each changes for its own reason: the server team can rename <code>likes_count<\/code> and only the DTO and one mapping line change. The mapping lives in the data layer (here the repository), because the domain must not know the server exists — the same rule as dependency inversion, applied to data.<\/p><\/blockquote><h3 id=\"6-api-client-feedapi\">6 · API client (<code><span class=\"t-typ\">FeedAPI<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> the messenger to the company's servers. It knows their addresses and the format messages must be in, sends the request, and brings back the answer. Nothing else in the app talks to the servers.<\/p><p><strong>Owns:<\/strong> the HTTP details: URLs, headers, auth, and decoding the JSON into DTOs that mirror it exactly.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-com\">/// The server&#x27;s shape, field for field. Lives in the data layer; never reaches a screen.<\/span>\n<span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">FeedPageDTO<\/span>: <span class=\"t-typ\">Decodable<\/span>, <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">let<\/span> items: [<span class=\"t-typ\">PostDTO<\/span>]\n    <span class=\"t-kw\">let<\/span> nextCursor: <span class=\"t-typ\">String<\/span>?\n    <span class=\"t-kw\">let<\/span> headToken: <span class=\"t-typ\">String<\/span>\n}\n\n<span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">PostDTO<\/span>: <span class=\"t-typ\">Decodable<\/span>, <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">let<\/span> id: <span class=\"t-typ\">String<\/span>\n    <span class=\"t-kw\">let<\/span> author: <span class=\"t-typ\">AuthorDTO<\/span>\n    <span class=\"t-kw\">let<\/span> caption: <span class=\"t-typ\">String<\/span>?\n    <span class=\"t-com\">/// URL, width, height, placeholder colour<\/span>\n    <span class=\"t-kw\">let<\/span> image: <span class=\"t-typ\">ImageDTO<\/span>?\n    <span class=\"t-kw\">let<\/span> likeCount: <span class=\"t-typ\">Int<\/span>\n    <span class=\"t-kw\">let<\/span> likedByMe: <span class=\"t-typ\">Bool<\/span>\n    <span class=\"t-com\">/// ISO 8601 text; becomes a Date when mapped<\/span>\n    <span class=\"t-kw\">let<\/span> createdAt: <span class=\"t-typ\">String<\/span>\n}\n\n<span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">FeedAPIType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">func<\/span> feed(cursor: <span class=\"t-typ\">Cursor<\/span>?, limit: <span class=\"t-typ\">Int<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">FeedPageDTO<\/span>\n    <span class=\"t-kw\">func<\/span> newCount(since token: <span class=\"t-typ\">HeadToken<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Int<\/span>\n    <span class=\"t-com\">/// PUT or DELETE<\/span>\n    <span class=\"t-kw\">func<\/span> setLiked(_ liked: <span class=\"t-typ\">Bool<\/span>, post: <span class=\"t-typ\">PostID<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span>\n}<\/code><\/pre><\/div><p><strong>The choices inside it:<\/strong> pages by <strong>cursor<\/strong>, likes as <strong>idempotent<\/strong> <code><span class=\"t-typ\">PUT<\/span><\/code> and <code><span class=\"t-typ\">DELETE<\/span><\/code> (endpoints in section 8). It returns <strong>DTOs, not <code><span class=\"t-typ\">FeedItem<\/span><\/code>s<\/strong>: the API client knows the server's format and nothing about the app's models, so it can be tested against recorded JSON on its own.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> asking for \"the 20 posts after this one\" works like a bookmark. Asking for \"posts 41 to 60\" breaks as soon as new posts arrive at the top and push everything down, so you see some twice.<\/p><p><em>The detail:<\/em> <em>Offset<\/em> pagination asks for \"posts 41–60\"; if five posts were added at the top meanwhile, 41–60 now contains five you've already seen. A <em>cursor<\/em> asks for \"the 20 after this one\", which doesn't move when posts are added above. <em>Idempotent<\/em> means sending the same request twice has the same effect as once: \"liked = true\" twice is still liked, while \"toggle\" twice is unliked. That's what makes retries safe.<\/p><\/blockquote><h3 id=\"7-local-storage-feedstore\">7 · Local storage (<code><span class=\"t-typ\">FeedStore<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> a notebook on the phone holding the last 200 or so posts you saw, so when you open the app on a train with no signal there's still something on screen.<\/p><p><strong>Owns:<\/strong> the last ~200 posts and the cursor after them, on disk.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">FeedStoreType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-com\">/// Posts + cursor, or nil on first launch<\/span>\n    <span class=\"t-kw\">func<\/span> load() <span class=\"t-kw\">async<\/span> -&gt; <span class=\"t-typ\">SavedFeed<\/span>?\n    <span class=\"t-com\">/// After each successful page 1<\/span>\n    <span class=\"t-kw\">func<\/span> save(_ feed: <span class=\"t-typ\">SavedFeed<\/span>) <span class=\"t-kw\">async<\/span>\n    <span class=\"t-com\">/// On logout<\/span>\n    <span class=\"t-kw\">func<\/span> clear() <span class=\"t-kw\">async<\/span>\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> one <code><span class=\"t-typ\">Codable<\/span><\/code> file, written atomically. <code><span class=\"t-typ\">SavedFeed<\/span><\/code> is the store's own record (posts + cursor), mapped to and from <code><span class=\"t-typ\">FeedItem<\/span><\/code> in the repository like the API's DTOs, so changing what's saved never touches the domain model. <em>Rejected:<\/em> SwiftData or SQLite, which earn their place only when other screens query posts.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> the app writes the new copy beside the old one and swaps them in a single move, so a crash halfway through never leaves a half-written notebook.<\/p><p><em>The detail:<\/em> An <em>atomic<\/em> write saves to a temporary file and then renames it over the old one. A rename can't be half done, so a crash leaves either the old file or the new one, never a broken mix. The file belongs in <code><span class=\"t-typ\">Library<\/span>/<span class=\"t-typ\">Caches<\/span><\/code>: it's a copy that can always be downloaded again, and the system may empty that folder when storage runs low, so the code treats a missing file as \"first launch\", never as an error.<\/p><\/blockquote><h3 id=\"8-image-loader-imagepipeline-from-question-1\">8 · Image loader (<code><span class=\"t-typ\">ImagePipeline<\/span><\/code>, from question 1)<\/h3><p><strong>In plain words:<\/strong> the photo library designed in question 1. Each row on screen asks it for its photo at the size it's shown; it downloads it, shrinks it to fit and remembers it for next time.<\/p><p><strong>Owns:<\/strong> everything about pixels: downloading, shrinking to the row's size, caching.<\/p><p><strong>Interface<\/strong> (the part this feed uses): <code>image(<span class=\"t-kw\">for<\/span>: <span class=\"t-typ\">ImageRequest<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">UIImage<\/span><\/code>, plus <code>prefetch(_:)<\/code> and <code>cancelPrefetch(_:)<\/code> for the rows about to appear. An <code><span class=\"t-typ\">ImageRequest<\/span><\/code> is a URL plus the pixel size the row will show.<\/p><p><strong>The choice:<\/strong> reuse it, don't redesign it. Say <em>\"that's question 1\"<\/em> and move on. The boundary is the point: <strong>the model carries URLs and sizes; only rows ever hold pixels.<\/strong><\/p><h3 id=\"why-these-eight-and-not-fewer\">Why these eight, and not fewer<\/h3><p>Each changes for a different reason: the screen with the design, the view model with the screen's behaviour, the repository with where data lives, the API client with the server, local storage with the storage format. One \"FeedManager\" would change for all of them. <em>\"I split where the reasons to change differ, not per noun.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>7 · One request through the sketch<\/summary><div class=\"reveal-body\"><p>Now trace one real flow across the cards you drew, so the interviewer sees them working together. Use launch, then the first \"load more\":<\/p><div class=\"board\"><pre class=\"board-src\">sequenceDiagram\n  participant V as Feed screen\n  participant VM as Feed view model\n  participant R as Feed repository\n  participant S as Local storage\n  participant A as API client\n  V-&gt;&gt;VM: onAppear()\n  VM-&gt;&gt;R: savedFeed()\n  R-&gt;&gt;S: load()\n  S--&gt;&gt;R: 200 saved posts\n  R--&gt;&gt;VM: saved posts\n  VM--&gt;&gt;V: show saved posts at once\n  VM-&gt;&gt;R: page(after: nil)\n  R-&gt;&gt;A: feed(cursor: nil)\n  A--&gt;&gt;R: FeedPageDTO (page 1 + next cursor)\n  Note over R: map PostDTO → FeedItem\n  R-&gt;&gt;S: save(page 1)\n  R--&gt;&gt;VM: page 1\n  VM--&gt;&gt;V: page 1 replaces the saved posts\n  Note over V,VM: user scrolls to about 5 posts from the end\n  V-&gt;&gt;VM: onNearEnd()\n  VM-&gt;&gt;R: page(after: cursor)\n  R-&gt;&gt;A: feed(cursor: cursor)\n  A--&gt;&gt;R: FeedPageDTO (page 2)\n  Note over R: map PostDTO → FeedItem\n  R--&gt;&gt;VM: page 2\n  VM--&gt;&gt;V: page 2 added below, duplicates skipped<\/pre><\/div><p>In words: the app opens with what the user saw last time, replaces it with fresh posts, and asks for the next page about a screen before the end. Solid arrows are requests, each a method from the interfaces in section 6; dashed arrows are the replies, which is the data flowing back up to the screen.<\/p><\/div><\/details><details class=\"reveal\"><summary>8 · The server contract<\/summary><div class=\"reveal-body\"><p>The interface between the app and the backend. This is the API every mobile design round asks for.<\/p><div class=\"scroll\"><pre data-lang=\"text\"><code>GET /v1/feed?cursor={opaque}&amp;limit=20\n200 {\n  &quot;items&quot;: [ { &quot;id&quot;: &quot;p_81f&quot;, &quot;author&quot;: {...}, &quot;caption&quot;: &quot;...&quot;,\n               &quot;image&quot;: { &quot;url&quot;: &quot;https://img.../p_81f&quot;, &quot;width&quot;: 3024,\n                          &quot;height&quot;: 4032, &quot;placeholder&quot;: &quot;#7A6A58&quot; },\n               &quot;likeCount&quot;: 412, &quot;likedByMe&quot;: false, &quot;createdAt&quot;: &quot;...&quot; } ],\n  &quot;nextCursor&quot;: &quot;eyJyIjo...&quot;,        // null at the end\n  &quot;headToken&quot;: &quot;h_93a&quot;               // what &quot;newest&quot; meant for this session\n}\n\nGET  /v1/feed/head?since={headToken}   → { &quot;newCount&quot;: 7 }\nPUT    /v1/posts/{id}/like              → 204   (idempotent)\nDELETE /v1/posts/{id}/like              → 204   (idempotent)<\/code><\/pre><\/div><ul><li><strong>Cursor, not offset.<\/strong> With <code>?page=<span class=\"t-num\">3<\/span><\/code>, five new posts at the top shift everything down, so page 3 repeats five you've seen; a cursor asks for \"the next 20 after <em>this one<\/em>\", and insertions above it change nothing. The cursor is <strong>opaque<\/strong>: the client never parses it, so the server can change ranking without an app release.<\/li><li><strong>Width and height in the payload.<\/strong> The row sizes itself from the aspect ratio before the image exists, so nothing jumps when it arrives; the placeholder colour fills the box meanwhile. If the server can't provide dimensions, ask for them first. It's cheaper than any client workaround.<\/li><li><strong>Like as PUT and DELETE, never \"toggle\".<\/strong> Retries and offline replays are then safe.<\/li><li><strong><code>headToken<\/code><\/strong> pins what \"newest\" meant when the session started, so \"how many are new?\" has a stable answer.<\/li><\/ul><\/div><\/details><details class=\"reveal\"><summary>9 · Deep dive — \"The user flings to the bottom. Walk me through loading more.\"<\/summary><div class=\"reveal-body\"><p><strong>Decision: one trigger, one guard, one in-flight task — and a refresh that cancels it.<\/strong><\/p><p><strong>The trigger.<\/strong> Ask for the next page when the user is within about one screen — five to ten posts — of the end. In UIKit that's <code>willDisplay<\/code> for an index past <code>items.count - threshold<\/code>, or the prefetch data source; in SwiftUI, the visibility of a post near the end via <code>onScrollTargetVisibilityChange<\/code> (iOS 18) or <code>.onAppear<\/code> on a sentinel row. <em>Alternative rejected:<\/em> fetching when the last cell appears. On a fling the user hits the bottom before the response, and sees a spinner every page. <em>Switch condition:<\/em> on a constrained network, widen the threshold and shrink the page — the round trip is the cost, not the bytes.<\/p><p><strong>The guard — the concurrency content of this question.<\/strong><\/p><p>Explain it as what happens when \"near the end\" fires:<\/p><ol start=\"1\"><li><strong>If something is already loading, or there are no more pages, ignore it.<\/strong><\/li><li><strong>Otherwise mark the state as \"loading more\" immediately<\/strong>, with no waiting between the check and the mark, then ask the repository for the page after the cursor.<\/li><li><strong>When the page comes back, first check that no refresh happened meanwhile<\/strong> (the generation number, below). If one did, throw the page away. If not, add the new posts and go back to idle, or to \"no more pages\" when the server sent no next cursor.<\/li><li><strong>If it fails<\/strong>, show an inline retry row, unless it failed because it was cancelled, which just means the user refreshed.<\/li><\/ol><p><strong>Why step 2 says \"immediately\".<\/strong> The trigger fires for every cell past the threshold, so five calls in one fling is normal. The view model lives on the main actor, so if nothing waits between checking the state and setting it, the first call wins and the other four see \"already loading\" and stop. Put any waiting between those two and two calls both get through: the same bug as question 1's double download, in a different coat.<\/p><p><strong>Refresh races with load-more.<\/strong> The user pulls to refresh while page 4 is in flight. Page 4 returns after the refresh has replaced the list with fresh page 1 — and gets appended to it, with a cursor from the old session. Two fixes, used together: the refresh <strong>cancels<\/strong> the load-more task, and a <strong>generation counter<\/strong> bumped on every refresh makes any response — or error — from an older generation drop itself without touching <code>phase<\/code>. Cancellation alone isn't enough, because it's cooperative — a response already decoded can still arrive.<\/p><div class=\"board\"><pre class=\"board-src\">sequenceDiagram\n  actor U as User\n  participant VM as FeedViewModel\n  participant R as FeedRepository\n  VM-&gt;&gt;R: page 4 (generation 1)\n  U-&gt;&gt;VM: pull to refresh\n  Note over VM: cancel page 4 · generation = 2\n  VM-&gt;&gt;R: page 1 (generation 2)\n  R--&gt;&gt;VM: page 1 replaces the list\n  R--&gt;&gt;VM: page 4 arrives late (generation 1)\n  Note over VM: 1 ≠ 2, so it is dropped<\/pre><\/div><p><strong>Merging.<\/strong> Append by id, skipping ids already present. Ranked feeds occasionally return an item again across pages; a duplicate id in a diffable snapshot is a crash, not a glitch. Keep a <code><span class=\"t-typ\">Set<\/span>&lt;<span class=\"t-typ\">PostID<\/span>&gt;<\/code> beside the array.<\/p><p><strong>Prefetch the next images, not the next pages.<\/strong> When page N+1 arrives, hand its first few image requests to the pipeline's prefetcher at low priority, with <code>allowsConstrainedNetworkAccess = <span class=\"t-kw\">false<\/span><\/code> so Low Data Mode skips them. Cancel prefetches for rows the user has flung past (<code>cancelPrefetchingForItemsAt<\/code>). That's what makes images appear already loaded, and it's question 1's API doing the work.<\/p><\/div><\/details><details class=\"reveal\"><summary>10 · Deep dive — \"It stutters on an iPhone 12, and the list jumps. Why?\"<\/summary><div class=\"reveal-body\"><p><strong>Each frame has 8–16 ms of main-thread time. Find what's spending it.<\/strong> Start in Instruments — the Hangs and Animation Hitches instruments, plus <code>os_signpost<\/code> around cell configuration — not with guesses. The usual culprits, in the order they turn up:<\/p><ol start=\"1\"><li><strong>Decoding full-size images on the main thread.<\/strong> A 12-megapixel photo decodes to about 48 MB and takes tens of milliseconds. Fixed by question 1: downsample to the cell's pixel size, off the main actor, before the image reaches the view.<\/li><li><strong>Measuring cells whose height depends on the image.<\/strong> Self-sizing that waits for the image means the cell is laid out twice, and the content above the viewport changes height — that's the jump. <strong>Fix: size from the model.<\/strong> <code>height = width × image.height / image.width<\/code>, known when the post arrives. Text height is the only measured part, and caching it per post id and width makes it a dictionary lookup.<\/li><li><strong>Reloading instead of reconfiguring.<\/strong> A like changes one number. <code>reloadItems<\/code> throws away the cell and builds a new one; <code>reconfigureItems<\/code> (iOS 15) updates the existing cell in place. In SwiftUI, Observation gives you the same thing for free if the cell reads only its own post.<\/li><li><strong>Too much view per cell.<\/strong> Nested stacks, shadows with no <code>shadowPath<\/code>, rounded-corner masks on images. Flatten the hierarchy; give layers explicit shadow paths.<\/li><li><strong>Work in <code>cellForItemAt<\/code>.<\/strong> Date formatting, string building, attributed text. Precompute in the model mapping on the repository side, so the cell assigns finished values.<\/li><\/ol><p><strong>Keeping the user's place stable.<\/strong> Three rules: never insert above the visible rows unless the user asked (that's the \"new posts\" pill in section 11); know every row's height before it's inserted; and on refresh, if the user has scrolled, keep the old list on screen until they tap to jump to the top.<\/p><p><strong>Memory, however far they scroll.<\/strong> Models are cheap; decoded images are not. Cells hold images only while visible, and the pipeline's memory cache has a byte budget, so memory is bounded by the cache, not by the scroll distance. <em>Alternative rejected:<\/em> trimming the model array as the user scrolls (windowing). It bounds memory that wasn't the problem and makes scroll-up need a second, backwards cursor. <em>Switch condition:<\/em> sessions of tens of thousands of posts with heavy models — then keep a window of pages and page backwards too.<\/p><\/div><\/details><details class=\"reveal\"><summary>11 · Deep dive — \"New posts, and the like button.\"<\/summary><div class=\"reveal-body\"><p><strong>New posts: tell, don't insert.<\/strong><\/p><p><em>Decision:<\/em> check <code><span class=\"t-typ\">GET<\/span> /feed/head?since=<\/code> when the app returns to the foreground and every couple of minutes while the feed is visible; if <code>newCount &gt; <span class=\"t-num\">0<\/span><\/code>, show a \"7 new posts\" pill. Tapping it scrolls to the top and loads page 1. The content under the user's thumb never moves on its own.<\/p><p><em>Alternative rejected:<\/em> a WebSocket or server-sent events for live insertion. It costs a held connection, battery, reconnect logic and a server component, and it buys immediacy a ranked photo feed doesn't need — ranking already means \"newest\" isn't the point. <em>Alternative rejected:<\/em> silent push to trigger a refresh. Delivery is throttled by the system and not guaranteed, so it can't be the mechanism; it can be a hint. <em>Switch condition:<\/em> a chronological, conversational feed — chat-like, sports scores — where seconds matter. Then a socket earns its cost, and that's question 3's design.<\/p><p><strong>The like: optimistic, idempotent, last intent wins.<\/strong><\/p><p>What happens on a tap, in order:<\/p><ol start=\"1\"><li><strong>Change the heart and the count on screen at once.<\/strong> Don't wait for the server.<\/li><li><strong>Send the new state<\/strong> (\"liked = true\", not \"toggle\") to the server in the background.<\/li><li><strong>If the user taps again before it lands<\/strong>, cancel the older request and send the newest state. Only the last tap matters.<\/li><li><strong>If the request fails<\/strong>, put the heart back and show a quiet message.<\/li><\/ol><ul><li><strong>Rapid taps.<\/strong> Like–unlike–like in a second sends one intent at a time per post, the newest cancelling the older. Because the request says \"liked = true\", not \"toggle\", even an older request that already left the device can't leave the post in the wrong state once the newest arrives — and if ordering matters on the server, a client timestamp or a sequence number per post settles it.<\/li><li><strong>Refresh overwrites the optimistic state.<\/strong> Page 1 comes back from the server with <code>likedByMe: <span class=\"t-kw\">false<\/span><\/code> because the PUT hasn't landed yet, and the heart flickers off. Fix: while a like is pending for a post, the merge keeps the local value. Pending mutations are an <strong>overlay<\/strong> on server data, not a write into it.<\/li><li><strong>Offline.<\/strong> Either fail fast and roll back, or queue the intent in a small persisted outbox and replay it when <code><span class=\"t-typ\">NWPathMonitor<\/span><\/code> reports a path. Idempotent PUT and DELETE make the replay safe. For likes, queueing is usually worth it; say the trade-off: the user sees \"liked\" for something the server hasn't recorded.<\/li><\/ul><p><em>Alternative rejected:<\/em> waiting for the server before changing the heart. Correct, and it feels broken — 300 ms to react to a tap. <em>Switch condition:<\/em> actions with real cost — a purchase, a follow that notifies someone — wait for the server and show progress.<\/p><\/div><\/details><details class=\"reveal\"><summary>12 · Failure modes and 10×<\/summary><div class=\"reveal-body\"><ul><li><strong>Offline at launch.<\/strong> Show the stored feed with \"Last updated 2 h ago\". Load-more at the end of stored content shows an inline retry row, not an error screen.<\/li><li><strong>First page fails.<\/strong> With a stored feed: keep it and show a banner. Without one: a full-screen error with retry. Never replace good content with an error.<\/li><li><strong>Page N fails.<\/strong> Inline retry row at the bottom; <code>phase = .failed<\/code>, and the next \"near end\" or a tap retries. One automatic retry with jittered backoff for timeouts and 5xx, none for 4xx.<\/li><li><strong>Cursor expired<\/strong> (server says 410 or \"invalid cursor\" after a long background). Reload from page 1 and keep the user's place if the post they were on comes back in it; otherwise jump to top with a pill-style hint.<\/li><li><strong>Duplicates and gaps.<\/strong> Duplicates: merge by id. Gaps: impossible with cursors unless the server breaks its contract — log them, don't paper over.<\/li><li><strong>Races.<\/strong> Double load-more: the main-actor guard. Refresh versus load-more: cancel plus generation. Late like response: per-post task, newest wins.<\/li><li><strong>Memory pressure.<\/strong> The image cache purges; models stay. Visible cells re-request their images at the same size and hit the disk cache.<\/li><li><strong>Killed mid-scroll.<\/strong> Nothing to recover: the store holds the last successful first page, the outbox holds pending likes, both written atomically.<\/li><li><strong>Low Data Mode.<\/strong> No image prefetch, smaller image width bucket, same feed.<\/li><\/ul><p><strong>At 10×<\/strong> — ten times more posts per session, or heavier posts:<\/p><ul><li><strong>Scroll distance:<\/strong> memory still bounded by the image cache; model array grows linearly, fine into the tens of thousands, then window it.<\/li><li><strong>Heavier posts (carousels, video):<\/strong> a cell that holds a player is the new memory hog. One player, reused, attached to the most-visible cell only.<\/li><li><strong>More interactions per post:<\/strong> the overlay of pending mutations generalises — one per post per field — and that's when a shared post store below the view models pays for itself.<\/li><li><strong>Data:<\/strong> the CDN width bucket and Low Data Mode carry it; the client's job is to ask for the smallest bucket that looks sharp.<\/li><\/ul><\/div><\/details><details class=\"reveal\"><summary>13 · Question bank — everything they can push on<\/summary><div class=\"reveal-body\"><p>Grouped by the checklist from the first chapter. Read the question, answer it out loud, <em>then<\/em> open it. Each area ends with a follow-up chain, because a real interviewer doesn't change topic after your first answer; they go one level deeper.<\/p><h3 id=\"clarify-and-scope\">Clarify and scope<\/h3><details><summary>\"Where would you start?\"<\/summary><p>With questions, not boxes: what's in a post, who orders the feed, what must work offline, whether new posts appear live, which interactions matter, minimum OS. Then out of scope first (ranking, posting, comments, video), then four features.<\/p><\/details><details><summary>\"Why is ranking out of scope? It's the most interesting part.\"<\/summary><p>It's the server's job. The client receives pages in order and must not reorder them. Designing a ranking algorithm in a mobile round is the classic way to spend 15 minutes on something that isn't graded.<\/p><\/details><details><summary>\"What are your non-functional requirements?\"<\/summary><p>Smooth scrolling on an old phone, nothing moving under the user's thumb, memory bounded however far they scroll, modest data use with Low Data Mode honoured, and no duplicates or stale likes. Then the axis: how far ahead I load against memory, data and battery.<\/p><\/details><details><summary>\"What's the smallest version you'd ship?\"<\/summary><p>Cursor pages with a main-actor guard, cells sized from the payload, and the image pipeline. The offline cache, the new-posts pill and offline likes come after, in that order.<\/p><\/details><details><summary>Follow-up chain: \"What does the feed show offline?\"<\/summary><ol start=\"1\"><li><em>\"What does the feed show offline?\"<\/em> → The last ~200 posts I stored, with \"last updated\" time.<\/li><li><em>\"Why 200 and not everything?\"<\/em> → It's what a user scrolls in a session; more costs disk and launch time for content nobody reaches.<\/li><li><em>\"And if they scroll past 200 offline?\"<\/em> → An inline \"you're offline, retry\" row at the end. Never an error screen over good content.<\/li><\/ol><\/details><h3 id=\"architecture-and-layers\">Architecture and layers<\/h3><details><summary>\"Walk me through the layers.\"<\/summary><p>Presentation: the view and a view model that owns the items, the phase and the cursor. Domain: the <code><span class=\"t-typ\">FeedItem<\/span><\/code> model and the <code><span class=\"t-typ\">FeedRepository<\/span><\/code> protocol. Data: the repository implementation over the API and a disk store. Each changes for a different reason, which is why they're separate.<\/p><\/details><details><summary>\"Why MVVM and not MVC, VIPER or TCA?\"<\/summary><p>The view model is the seam that lets me test the feed's behaviour with no view: a fake repository, call \"near end\" twice, assert one request. MVC puts that logic in a view controller I can't test easily. VIPER adds a router, presenter and interactor for one screen. TCA buys a strict event log at the cost of a dependency and a learning curve; I'd switch to it if several screens shared complex state.<\/p><\/details><details><summary>\"Why no use cases or interactors in the domain?\"<\/summary><p>At this size each one would just forward a call to the repository. I'd add one when there's real logic that belongs to neither the screen nor the data source, for example combining two repositories or a business rule two screens share.<\/p><\/details><details><summary>\"Why a repository and not the view model calling the API directly?\"<\/summary><p>The view model shouldn't know whether a post came from the network or from disk. The repository owns that decision, and its protocol is what I swap for a fake in tests.<\/p><\/details><details><summary>\"Would you decode the JSON straight into the model the UI uses?\"<\/summary><p>No. The API client decodes into DTOs that mirror the server; the repository maps them to <code><span class=\"t-typ\">FeedItem<\/span><\/code>. A renamed or newly optional server field then changes one DTO and one mapping line instead of every screen, and invalid posts are filtered once, at the boundary. For a prototype, or an API versioned with the app, one type is an acceptable shortcut.<\/p><\/details><details><summary>\"Show me where dependency inversion is.\"<\/summary><p>The view model depends on the <code><span class=\"t-typ\">FeedRepository<\/span><\/code> protocol in the domain; the implementation in the data layer conforms to it, so the arrow points up. Concrete types are created once at the composition root and injected.<\/p><\/details><details><summary>\"Where does the like state live?\"<\/summary><p>In the <code><span class=\"t-typ\">FeedItem<\/span><\/code> the view model holds, with pending likes kept as an overlay until the server confirms. If a second screen (a profile grid) shows the same post, I'd move posts into a shared main-actor store below both view models, so a like in one place shows everywhere.<\/p><\/details><details><summary>Follow-up chain: \"Two screens show the same post.\"<\/summary><ol start=\"1\"><li><em>\"A profile grid and the feed show the same post. The user likes it in one. What happens in the other?\"<\/em> → With per-screen state, nothing: they drift.<\/li><li><em>\"Fix it.\"<\/em> → One shared <code><span class=\"t-atr\">@MainActor<\/span><\/code> post store keyed by id. Both view models read from it; the like writes to it once.<\/li><li><em>\"Isn't that a global singleton?\"<\/em> → It's one instance, but injected, not reached for. Tests give each view model its own.<\/li><li><em>\"When would you not do this?\"<\/em> → With one screen. It's complexity you add when the second consumer appears.<\/li><\/ol><\/details><h3 id=\"api-and-networking\">API and networking<\/h3><details><summary>\"Design the endpoint.\"<\/summary><p><code><span class=\"t-typ\">GET<\/span> /v1/feed?cursor=&amp;limit=<span class=\"t-num\">20<\/span><\/code> returns items, <code>nextCursor<\/code> (null at the end) and a <code>headToken<\/code>. Each item carries the image URL with its width, height and a placeholder colour. Likes are <code><span class=\"t-typ\">PUT<\/span><\/code> and <code><span class=\"t-typ\">DELETE<\/span> /v1/posts/{id}/like<\/code>. A cheap <code><span class=\"t-typ\">GET<\/span> /feed/head?since=<\/code> returns the count of newer posts.<\/p><\/details><details><summary>\"Why not offset pagination? It's simpler.\"<\/summary><p>Insertions above your position shift every later page, so you see repeats; deletions skip posts. A cursor asks for \"the next 20 after this one\", which is stable under both. Opaque cursors also let the server change ranking without a client release.<\/p><\/details><details><summary>\"Why is like a PUT and DELETE, not a toggle?\"<\/summary><p>They're idempotent: \"liked = true\" sent twice is still liked, while \"toggle\" retried once is unliked. That's what makes retries and offline replays safe.<\/p><\/details><details><summary>\"REST, GraphQL or something else?\"<\/summary><p>REST is enough for one feed with a fixed shape. GraphQL earns its place when many screens need different slices of the same objects and over-fetching costs real data. I'd follow what the backend already offers.<\/p><\/details><details><summary>\"How do you handle errors and retries?\"<\/summary><p>One automatic retry with jittered backoff for timeouts and 5xx, none for 4xx. Page failures show an inline retry row. An expired cursor (410) reloads from the first page and tries to keep the user's place.<\/p><\/details><details><summary>\"How do you find out about new posts?\"<\/summary><p>Poll <code>/feed/head<\/code> on foreground and every couple of minutes while the feed is visible, and show a \"7 new posts\" pill. A socket costs battery and a server component for immediacy a ranked feed doesn't need.<\/p><\/details><details><summary>Follow-up chain: \"The server can't send image sizes.\"<\/summary><ol start=\"1\"><li><em>\"The backend says image dimensions are hard to add. Now what?\"<\/em> → First, push back: it's the cheapest fix for the most visible bug.<\/li><li><em>\"They still say no.\"<\/em> → Use a fixed aspect ratio box (square crop) so nothing jumps, and accept cropping.<\/li><li><em>\"Product wants the real ratio.\"<\/em> → Read the dimensions from the image header with ImageIO on the first bytes, before the full download, and cache them by URL. Slower and more code than the API field, which is why I asked for the field first.<\/li><\/ol><\/details><h3 id=\"pagination-and-the-list\">Pagination and the list<\/h3><details><summary>\"When do you load the next page?\"<\/summary><p>About one screen before the end, five to ten posts, via <code>willDisplay<\/code> or the prefetch data source in UIKit, or a near-end row's visibility in SwiftUI. Waiting for the last cell means a spinner on every fling.<\/p><\/details><details><summary>\"How do you avoid loading the same page five times?\"<\/summary><p>One <code>phase<\/code> enum on the main-actor view model, checked and set with no <code><span class=\"t-kw\">await<\/span><\/code> in between. The first call flips it to loading; the other four return.<\/p><\/details><details><summary>\"What happens on pull to refresh while a page is loading?\"<\/summary><p>The refresh cancels the load-more task, and a generation counter bumped on each refresh makes any late response from the old generation drop itself. Cancellation alone isn't enough because it's cooperative.<\/p><\/details><details><summary>\"The server returns a post you already have. What happens?\"<\/summary><p>Merge by id and skip it. A duplicate id in a diffable snapshot crashes, so I keep a set of ids beside the array.<\/p><\/details><details><summary>\"UICollectionView or SwiftUI List?\"<\/summary><p>For the app's most performance-critical screen, <code><span class=\"t-typ\">UICollectionView<\/span><\/code> with a diffable data source, wrapped for SwiftUI, because I control reuse and prefetch. On iOS 18 with simple cells, <code><span class=\"t-typ\">List<\/span><\/code> is fine if it profiles clean on the oldest supported phone.<\/p><\/details><details><summary>\"How do you stop the list jumping?\"<\/summary><p>Never insert above the visible rows unless the user asked, know every row's height before it's inserted (from the payload), and keep the old list on refresh if the user has scrolled.<\/p><\/details><details><summary>Follow-up chain: \"Infinite scroll for an hour.\"<\/summary><ol start=\"1\"><li><em>\"A user scrolls for an hour. What grows?\"<\/em> → The model array, about a kilobyte per post. Decoded images don't: the pipeline's cache has a byte budget.<\/li><li><em>\"10,000 posts?\"<\/em> → About 10 MB of models. Fine.<\/li><li><em>\"100,000 with heavy models?\"<\/em> → Then keep a window of pages and drop the far ones, which means scroll-up needs a backwards cursor too. I wouldn't build that until a profile shows the need.<\/li><\/ol><\/details><h3 id=\"caching-and-offline\">Caching and offline<\/h3><details><summary>\"What do you store on disk, and in what?\"<\/summary><p>The first ~200 posts and the cursor after them, as one Codable file written atomically after each successful first page. SwiftData or SQLite only if other screens query posts.<\/p><\/details><details><summary>\"What happens on launch?\"<\/summary><p>Show the stored feed immediately, then load the first page and replace it. If the user has already scrolled, keep their view and offer the new content behind a pill.<\/p><\/details><details><summary>\"The user likes a post offline. What happens?\"<\/summary><p>Either roll back with a quiet message, or queue the intent in a small persisted outbox and replay it when the network returns. The idempotent PUT makes the replay safe. For likes, queueing is usually worth it.<\/p><\/details><details><summary>\"How stale can the stored feed be?\"<\/summary><p>As stale as the last successful load, and the screen says so (\"updated 2 h ago\"). It's a fallback for opening the app, not a source of truth.<\/p><\/details><details><summary>Follow-up chain: \"Offline likes conflict.\"<\/summary><ol start=\"1\"><li><em>\"User likes offline, then unlikes on another device, then this phone comes online. What wins?\"<\/em> → The last intent by time, if the server compares a client timestamp per post.<\/li><li><em>\"Clocks lie.\"<\/em> → A per-post sequence number from the server's last known state, or accept last-write-wins: for a like, the cost of being wrong is tiny.<\/li><li><em>\"Would you do the same for a payment?\"<\/em> → No. Anything with real cost waits for the server and never replays blindly.<\/li><\/ol><\/details><h3 id=\"concurrency\">Concurrency<\/h3><details><summary>\"What runs on the main actor?\"<\/summary><p>The view model: its state and the check-and-set guards. JSON decoding, disk reads and image decoding happen elsewhere; the repository is <code><span class=\"t-typ\">Sendable<\/span><\/code> and returns finished values.<\/p><\/details><details><summary>\"Why @MainActor and not a lock?\"<\/summary><p>The view reads this state every frame, and all mutations happen on one actor, so check-then-set needs no lock. A lock also can't be held across an <code><span class=\"t-kw\">await<\/span><\/code>.<\/p><\/details><details><summary>\"The user taps like three times quickly.\"<\/summary><p>One task per post; each new tap cancels the older one, and each request says \"liked = true/false\" rather than \"toggle\", so the final state is the last tap whichever request lands first.<\/p><\/details><details><summary>\"Where is actor re-entrancy a risk here?\"<\/summary><p>Any <code><span class=\"t-kw\">await<\/span><\/code> between checking <code>phase<\/code> and setting it. Put one there and two calls both pass the check and both load: the same bug as the image library's double download.<\/p><\/details><details><summary>Follow-up chain: \"Refresh drops the heart.\"<\/summary><ol start=\"1\"><li><em>\"User likes, then refreshes, and the heart turns off. Why?\"<\/em> → The refresh returned server state from before the PUT landed.<\/li><li><em>\"Fix it.\"<\/em> → Pending mutations are an overlay: while a like is pending, the merge keeps the local value.<\/li><li><em>\"And when the PUT fails?\"<\/em> → Remove the overlay and roll back to the server value, with a quiet toast.<\/li><\/ol><\/details><h3 id=\"performance-and-memory\">Performance and memory<\/h3><details><summary>\"It stutters on an iPhone 12. Where do you start?\"<\/summary><p>Instruments (Hangs and Animation Hitches) plus <code>os_signpost<\/code> around cell configuration, not guesses. Usual culprits: full-size decodes on main, cells measured after the image arrives, <code>reloadItems<\/code> instead of <code>reconfigureItems<\/code>, heavy cell hierarchies, formatting in <code>cellForItemAt<\/code>.<\/p><\/details><details><summary>\"What does a decoded photo cost?\"<\/summary><p>Width × height × 4 bytes, whatever the file size. A 12-megapixel photo is about 48 MB decoded, which is why cells ask for the displayed pixel size.<\/p><\/details><details><summary>\"Why no UIImage in the model?\"<\/summary><p>A model is about a kilobyte; a decoded image is megabytes. Pixels belong to visible cells, borrowed from the pipeline's bounded cache.<\/p><\/details><details><summary>\"How far ahead do you prefetch?\"<\/summary><p>Images for the next few rows at low priority, off in Low Data Mode, cancelled for rows flung past. Pages one screen ahead. Further costs data and battery for posts nobody sees.<\/p><\/details><details><summary>Follow-up chain: \"Memory warning mid-scroll.\"<\/summary><ol start=\"1\"><li><em>\"A memory warning arrives while scrolling. What happens?\"<\/em> → The image cache purges; models stay.<\/li><li><em>\"Visible cells go blank?\"<\/em> → They re-request at the same size and hit the disk cache, so it's a frame or two.<\/li><li><em>\"It still gets killed in the field.\"<\/em> → MetricKit exit reasons confirm it; then lower the memory budget and the width bucket, behind a remote flag.<\/li><\/ol><\/details><h3 id=\"testing\">Testing<\/h3><details><summary>\"How do you test pagination?\"<\/summary><p>A fake repository that returns scripted pages and can hold a response open. Call \"near end\" five times, assert one request. No view, no network.<\/p><\/details><details><summary>\"How do you test the refresh race?\"<\/summary><p>Hold page 4 open in the fake, refresh, then release page 4 and assert it was not appended. Wait by yielding, never by sleeping.<\/p><\/details><details><summary>\"What do you test in the view?\"<\/summary><p>Little: a snapshot test per cell state if the team uses them. The logic lives in the view model, which is where the unit tests go.<\/p><\/details><details><summary>\"How do you test the like overlay?\"<\/summary><p>Like a post, return a page with the old server value while the like is pending, and assert the heart stays on. Then fail the request and assert it rolls back.<\/p><\/details><details><summary>Follow-up chain: \"Your tests are flaky.\"<\/summary><ol start=\"1\"><li><em>\"Your async tests pass alone and fail in CI.\"<\/em> → They wait on wall-clock time, which other tests steal under parallel load.<\/li><li><em>\"Fix it.\"<\/em> → Fakes whose responses the test releases, and waits bounded by a count of <code><span class=\"t-typ\">Task<\/span>.yield()<\/code>s.<\/li><li><em>\"And for the real API?\"<\/em> → A contract test against recorded responses, run separately from the unit suite.<\/li><\/ol><\/details><h3 id=\"observability-rollout-security-and-accessibility\">Observability, rollout, security and accessibility<\/h3><details><summary>\"How do you know it's smooth in production?\"<\/summary><p>MetricKit's hitch rate and hang diagnostics, signposts around configuration and decode, and the image cache hit rate. Prefetch distance behind a remote flag so it can be tuned without a release.<\/p><\/details><details><summary>\"How would you roll this out?\"<\/summary><p>Behind a feature flag to a small percentage, watching hitch rate, crash rate and time-to-first-post against the old feed, then ramping. The flag is also the kill switch.<\/p><\/details><details><summary>\"Anything security-sensitive here?\"<\/summary><p>The stored feed can include private accounts' posts, so it uses file protection and is cleared on logout. Auth tokens live in the Keychain, never in the store.<\/p><\/details><details><summary>\"What about accessibility?\"<\/summary><p>Each cell is one accessibility element with author, caption and like state, plus a custom action for like. Dynamic Type changes text height, which is why that height is measured and cached per width rather than assumed.<\/p><\/details><details><summary>Follow-up chain: \"Time to first post got worse.\"<\/summary><ol start=\"1\"><li><em>\"After launch, time-to-first-post regressed 300 ms. How do you find it?\"<\/em> → A signpost from launch to first rendered post, split by phase: store read, first page, first image.<\/li><li><em>\"It's the store read.\"<\/em> → The file grew; read it off the main actor and show it as soon as it decodes, or store fewer posts.<\/li><li><em>\"How do you stop this regressing again?\"<\/em> → A performance test in CI on that signpost, and an alert on the field metric.<\/li><\/ol><\/details><h3 id=\"scale-and-change\">Scale and change<\/h3><details><summary>\"Add video posts.\"<\/summary><p>A cell that holds a player is the new memory hog. One player, reused, attached to the most visible cell only; the rest show a poster frame.<\/p><\/details><details><summary>\"Add comments and shares on each post.\"<\/summary><p>The pending-mutation overlay generalises to one per post per field, and that's when a shared post store below the view models pays for itself.<\/p><\/details><details><summary>\"Make the feed live, like chat.\"<\/summary><p>Then a socket earns its cost: seconds matter and order is chronological. That's a different design, the chat question, not a change to this one.<\/p><\/details><details><summary>\"Ten times more users. What changes on the client?\"<\/summary><p>Almost nothing: load is the server's problem. The client's levers are page size, prefetch distance and image width buckets, all behind flags.<\/p><\/details><details><summary>Follow-up chain: \"Two weeks instead of six.\"<\/summary><ol start=\"1\"><li><em>\"You have two weeks. What do you cut?\"<\/em> → Offline likes, the new-posts pill and the disk store.<\/li><li><em>\"What can't you cut?\"<\/em> → Cursor pages, the load-more guard, and sizing cells from the payload. Those are the visible bugs.<\/li><li><em>\"What's the risk you're accepting?\"<\/em> → Opening offline shows nothing, and likes fail when the network does. Both are recoverable in the next release.<\/li><\/ol><\/details><\/div><\/details><details class=\"reveal\"><summary>14 · Scorecard — mark yourself, 0 / 1 / 2<\/summary><div class=\"reveal-body\"><p>The first five rows are the public exercise's grading criteria; the rest are specific to this question.<\/p><div class=\"scroll\"><table><thead><tr><th><\/th><th>Did you…<\/th><th>0–2<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Narrate continuously, and listen when interrupted<\/td><td><\/td><\/tr><tr><td>2<\/td><td>Clarify before designing, and state your assumptions<\/td><td><\/td><\/tr><tr><td>3<\/td><td>Attach a rejected alternative and a switch condition to each choice<\/td><td><\/td><\/tr><tr><td>4<\/td><td>Say plainly where your knowledge ends<\/td><td><\/td><\/tr><tr><td>5<\/td><td>Name a smaller version that would be enough<\/td><td><\/td><\/tr><tr><td>6<\/td><td>Say out of scope <strong>first<\/strong>, including ranking<\/td><td><\/td><\/tr><tr><td>7<\/td><td>Choose cursor pagination and say why in one sentence<\/td><td><\/td><\/tr><tr><td>8<\/td><td>Size cells from width and height in the payload<\/td><td><\/td><\/tr><tr><td>9<\/td><td>Guard load-more on the main actor, and handle refresh racing it<\/td><td><\/td><\/tr><tr><td>10<\/td><td>Keep pixels out of the model; reuse the image pipeline<\/td><td><\/td><\/tr><tr><td>11<\/td><td>Make likes optimistic and idempotent, and survive a refresh<\/td><td><\/td><\/tr><tr><td>12<\/td><td>Say the idea, list the components, <em>then<\/em> sketch: three layers, about eight cards, one seam<\/td><td><\/td><\/tr><tr><td>13<\/td><td>Land the recap inside 60 seconds<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p>13+ is a pass in a real round.A zero is worth more than the total: it names the thing to read about before the next one.:::<\/p><details class=\"reveal\"><summary>15 · The 60-second recap<\/summary><div class=\"reveal-body\"><p>A photo feed is three clocks — the frame, the network and the user's thumb — and the design keeps the frame clock safe while the other two catch up. A main-actor view model owns one ordered array of small value models and a single phase enum. Pages come from the server by opaque cursor, so new posts never shift what's already loaded; the next page is requested a screen before the end, behind a guard that's atomic because nothing awaits between the check and the set, and a refresh cancels any page in flight and drops late answers by generation. Every post carries its image's width and height, so cells are sized before any pixel arrives and nothing jumps. Pixels never live in the model: cells ask the image pipeline from question 1 for the exact size they show, with prefetch a few rows ahead and off in Low Data Mode. New posts are announced with a pill, not inserted under the user's thumb. Likes change the screen at once, go to the server as idempotent PUT and DELETE, and stay on top of refreshed data until confirmed. The last feed is on disk, so the app opens with content even offline.<\/p><\/div><\/details><\/div><\/details>", "text": " an image heavy feed is one of the recurring senior mobile prompts in the first hand reports collected for this programme. the public corpus interviewers draw on uses a twitter style feed as its main worked example, and the pagination advice below matches it: cursors, not offsets. interviewer: \"we have a feed of photos — think instagram's home feed. it scrolls forever. design the client for me.\" run it as a round, not as reading set a timer. stand up. sketch. talk the whole time. do not open a section until its slot is over. clock phase what you do 0:00–0:02 the prompt repeat it back in one sentence and say how you'll use the time 0:02–0:07 clarify ask yours; then open section 1 and take its answers as the interviewer's 0:07–0:12 scope out of scope first, then 3–5 functional, then the non functional ones that matter 0:12–0:24 high level say the idea (1 min) · list the components (2) · sketch them (4) · explain each (4) · trace one request (1) 0:24–0:40 deep dives the interviewer picks; sections 9–11 are the three they pick from 0:40–0:45 follow ups and recap whatever they still probe, then the 60 second summary; the question bank afterwards what this question is really testing it looks like a question about lists. it is a question about three clocks running at once : the frame clock (16 ms, or 8 ms on a 120 hz screen), the network clock (hundreds of milliseconds per page) and the user's thumb, which is faster than both. do you pick cursor pagination, and can you say why? offsets break the moment someone posts while you scroll. this is the single most checked line in the answer. do you know the cell's height before the image arrives? layout jumps are the visible bug in most feeds, and the fix is in the api, not in the view. can you keep \"load the next page\" from firing five times? that's the concurrency content: a guard that is atomic on the main actor, and a refresh that doesn't race with a page load. do you treat the image work as solved? you built it in question 1. say \"the image pipeline from before\" and spend the time on the feed. do you keep it client side? ranking, fan out and timelines are the server's job. name them as out of scope in the first minute. traps: offset pagination; inserting new posts at the top while the user is reading; holding uiimage s in the model; a like button that flickers back when the feed refreshes; designing the ranking algorithm. ::: words used in this chapter plain definitions for the technical words this chapter uses. read once; come back when a word stops you. app, server, api — the app runs on the phone; the server is the company's computer that stores
