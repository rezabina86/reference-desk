mallest number and one on the largest. add them. if the sum is the target, you are done. if it is too small, the smallest number can't be part of the answer — even paired with the largest, it falls short — so move the left finger right. if it is too big, the largest can't be part of it, so move the right finger left. each step rules out one number for good. time o(n): every step moves one finger inward, and they can only meet once. space o(1): two positions and a sum. ::: ::: swift solution swift func twosum(_ numbers: [int], _ target: int) [int] { var left = 0 var right = numbers.count 1 while left < right { let (sum, overflowed) = numbers[left].addingreportingoverflow(numbers[right]) if !overflowed && sum == target { return [left + 1, right + 1] // positions are 1 based } // on overflow the true sum is past int's range in the direction of the larger value. let toobig = overflowed ? numbers[right] 0 : sum target if toobig { right = 1 } else { left += 1 } } return [] } within the stated constraints the plain let sum = numbers[left] + numbers[right] is fine — say so, and say why you'd guard it in production (see the trap). verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above plus seven more — the minimum two entries, zeros, a long run of equal values before the partner, a mixed sign array, and three arrays holding int.max or int.min , which crash the unguarded version. ::: ::: walk it through [2, 3, 5, 8, 13] , target 16 left right sum action 1 → 2 5 → 13 15 too small → left moves 2 → 3 5 → 13 16 found → [2, 5] [5, 5] , target 10 — left on position 1, right on position 2, sum 10, answer [1, 2] . the two fingers start on different entries, so equal values are never a problem. ::: ::: the swift trap the sum of two valid entries can crash. the answer pair always fits in int — its sum is the target — but the pairs you try on the way don't have to. with [1, 2, int.max] and target 3, the first step adds 1 + int.max , and swift traps where c would wrap. rewriting the check as numbers[left] target numbers[right] only moves the problem to the subtraction. addingreportingoverflow gives you the wrapped result plus a flag, and in a sorted array the direction of an overflow tells you which finger to move: overflowing upward means the sum is too big. the other slip here is not swift's fault: the answer is 1 based . returning [left, right] passes every self made test and fails the grader. read the statement back (the r in reacto) and you catch it. ::: ::: what they ask next \"why does moving the left pointer never skip the answer?\" → if the sum is too small with the largest remaining number, the current left number can't reach the target with anything, so discarding it is safe. same argument mirrored for the right. \"return every pair, not just one.\" → on a match, record it, move both fingers, and skip past repeats of each value so pairs aren't duplicated. that skip is the heart of the next problem. \"the array isn't sorted.\" → either sort pairs of (value, position) — o(n log n), o(n) space — or use the dictionary from problem 1, o(n) and o(n). sorting in place and returning positions doesn't work: the positions move. ::: ", "outline": []}, {"slug": "3sum", "title": "8 · 3Sum", "summary": "Given a list of whole numbers, find every distinct set of three entries that adds up to zero.", "minutes": "25", "sources": [{"ref": "", "label": "LeetCode 15 · 3Sum", "url": "https://leetcode.com/problems/3sum/"}, {"ref": "", "label": "Swift standard library · Hashable", "url": "https://developer.apple.com/documentation/swift/hashable"}], "html": "<p><em>Medium · G<\/em><\/p><p>You get an array of integers in no particular order. Find every group of three entries, at three different positions, whose values add up to zero. Return each group of <strong>values<\/strong> once: two groups made of the same three values count as one, even if they come from different positions. The order of the groups, and of the values inside each group, doesn't matter.<\/p><div class=\"scroll\"><table><thead><tr><th>Numbers<\/th><th>Groups<\/th><\/tr><\/thead><tbody><tr><td><code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/td><td><code>[[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>], [-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]]<\/code><\/td><\/tr><tr><td><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/td><td><code>[[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]]<\/code> — four zeros, but one distinct group<\/td><\/tr><tr><td><code>[<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, -<span class=\"t-num\">4<\/span>]<\/code><\/td><td><code>[]<\/code> — the only three entries add up to −1<\/td><\/tr><\/tbody><\/table><\/div><p>Constraints that matter: between 3 and 3,000 numbers, each between −100,000 and 100,000. Trying every group of three is O(n³); the target is O(n²). Because order is free, the Xcode test sorts each group and then the list of groups before comparing.<\/p><details class=\"reveal\"><summary>Pattern and cue<\/summary><div class=\"reveal-body\"><p><strong>Sort, then two pointers inside a loop.<\/strong> The cue is <em>\"groups of three\"<\/em> that <em>\"add up to\"<\/em> a target, with <em>\"distinct\"<\/em> groups. Fix the first value and what remains is problem 7 exactly: find two entries in a sorted range that sum to minus the first value. Sorting is what makes both halves work — it enables the two-pointer search, and it puts equal values next to each other so repeats can be skipped instead of filtered out afterwards.<\/p><\/div><\/details><details class=\"reveal\"><summary>Approach<\/summary><div class=\"reveal-body\"><p>Sort the numbers. Take each value in turn as the first member of a group, skipping it if it is the same as the value just before (it would find the same groups again). For each first value, run the two-finger search from problem 7 on everything to its right, looking for a pair that brings the total to zero. When a pair is found, record the group, move both fingers inward, and move the left finger past any copies of the value it just used. Once the first value is above zero you can stop: everything to its right is at least as large, so no group can add up to zero.<\/p><p>Time O(n²): the sort is O(n log n), then n first values each run an O(n) scan. Space O(1) beyond the output, or O(n) if you count the sorted copy — Swift's <code>sorted()<\/code> returns a new array, and sorting the input in place would change the caller's data.<\/p><\/div><\/details><details class=\"reveal\"><summary>Swift solution<\/summary><div class=\"reveal-body\"><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> threeSum(_ numbers: [<span class=\"t-typ\">Int<\/span>]) -&gt; [[<span class=\"t-typ\">Int<\/span>]] {\n    <span class=\"t-kw\">let<\/span> sorted = numbers.sorted()\n    <span class=\"t-kw\">var<\/span> triplets: [[<span class=\"t-typ\">Int<\/span>]] = []\n\n    <span class=\"t-kw\">for<\/span> first <span class=\"t-kw\">in<\/span> sorted.indices {\n        <span class=\"t-kw\">if<\/span> sorted[first] &gt; <span class=\"t-num\">0<\/span> { <span class=\"t-kw\">break<\/span> }                                   <span class=\"t-com\">// nothing to the right can bring it back to 0<\/span>\n        <span class=\"t-kw\">if<\/span> first &gt; <span class=\"t-num\">0<\/span> &amp;&amp; sorted[first] == sorted[first - <span class=\"t-num\">1<\/span>] { <span class=\"t-kw\">continue<\/span> }  <span class=\"t-com\">// same first value, same triplets<\/span>\n\n        <span class=\"t-kw\">var<\/span> left = first + <span class=\"t-num\">1<\/span>\n        <span class=\"t-kw\">var<\/span> right = sorted.count - <span class=\"t-num\">1<\/span>\n        <span class=\"t-kw\">while<\/span> left &lt; right {\n            <span class=\"t-kw\">let<\/span> sum = sorted[first] + sorted[left] + sorted[right]\n            <span class=\"t-kw\">if<\/span> sum &lt; <span class=\"t-num\">0<\/span> {\n                left += <span class=\"t-num\">1<\/span>\n            } <span class=\"t-kw\">else<\/span> <span class=\"t-kw\">if<\/span> sum &gt; <span class=\"t-num\">0<\/span> {\n                right -= <span class=\"t-num\">1<\/span>\n            } <span class=\"t-kw\">else<\/span> {\n                triplets.append([sorted[first], sorted[left], sorted[right]])\n                left += <span class=\"t-num\">1<\/span>\n                right -= <span class=\"t-num\">1<\/span>\n                <span class=\"t-kw\">while<\/span> left &lt; right &amp;&amp; sorted[left] == sorted[left - <span class=\"t-num\">1<\/span>] { left += <span class=\"t-num\">1<\/span> }\n            }\n        }\n    }\n    <span class=\"t-kw\">return<\/span> triplets\n}<\/code><\/pre><\/div><p>Skipping repeats of the left value is enough: once left has moved past its copies, the right value that completes the group is fixed, so a duplicate on the right can't produce a new match.<\/p><p>Verified with <code>swift test<\/code> on Swift 6.2.3 in Swift 6 mode: the three examples above, six more (empty, one and two entries, a seven-value mix with four answers, fifteen values heavy with repeats, and <code>[-<span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, -<span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>, <span class=\"t-num\">2<\/span>]<\/code>), and 2,000 random arrays checked against a brute-force O(n³) search — including a check that no group comes back twice.<\/p><\/div><\/details><details class=\"reveal\"><summary>Walk it through<\/summary><div class=\"reveal-body\"><p><strong><code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">2<\/span>]<\/code><\/strong> (already sorted)<\/p><div class=\"scroll\"><table><thead><tr><th>First<\/th><th>Left<\/th><th>Right<\/th><th>Sum<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>−2<\/td><td>0<\/td><td>2<\/td><td>0<\/td><td>record <code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">2<\/span>]<\/code>; move both<\/td><\/tr><tr><td>−2<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>record <code>[-<span class=\"t-num\">2<\/span>, <span class=\"t-num\">1<\/span>, <span class=\"t-num\">1<\/span>]<\/code>; move both, fingers cross<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>too big → right moves<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><td>2<\/td><td>too big → right moves, fingers meet<\/td><\/tr><tr><td>1<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>first value above 0 → stop<\/td><\/tr><\/tbody><\/table><\/div><p>Two groups.<\/p><p><strong><code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code><\/strong> — first value is the zero at position 0; left at 1, right at 3, sum 0, record <code>[<span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>, <span class=\"t-num\">0<\/span>]<\/code>; both move to 2 and meet. Positions 1, 2 and 3 as first value are all repeats of 0 and are skipped. One group.<\/p><\/div><\/details><details class=\"reveal\"><summary>The Swift trap<\/summary><div class=\"reveal-body\"><p><strong>A tuple can't go in a <code><span class=\"t-typ\">Set<\/span><\/code>.<\/strong> The instinct is to collect every match into a set to remove repeats — <code><span class=\"t-typ\">Set<\/span>&lt;(<span class=\"t-typ\">Int<\/span>, <span class=\"t-typ\">Int<\/span>, <span class=\"t-typ\">Int<\/span>)&gt;<\/code> — and it doesn't compile, because tuples aren't <code><span class=\"t-typ\">Hashable<\/span><\/code> in Swift. <code><span class=\"t-typ\">Set<\/span>&lt;[<span class=\"t-typ\">Int<\/span>]&gt;<\/code> does compile, but only if every group is sorted first, and it adds O(k) hashing for k results plus a conversion back to an array at the end. It is a working answer, and an interviewer will accept it with a nudge; skipping repeats in the sorted array is the one they are waiting for, and it removes the need for the set entirely. Say both, write the second.<\/p><\/div><\/details><details class=\"reveal\"><summary>What they ask next<\/summary><div class=\"reveal-body\"><ul><li><strong>\"Closest sum to a target instead of exactly zero.\"<\/strong> → Same loop; track the sum with the smallest distance to the target and move the fingers by comparing with the target. No duplicate-skipping needed.<\/li><li><strong>\"4Sum.\"<\/strong> → Two nested loops for the first two values, each skipping repeats, then the two-finger scan: O(n³). Generalises to k-sum by recursion down to two.<\/li><li><strong>\"Can you beat O(n²)?\"<\/strong> → Not in general — 3Sum is the textbook problem believed to need about n² time. Saying that is a better answer than inventing an optimisation.<\/li><\/ul><\/div><\/details>", "text": " medium · g you get an array of integers in no particular order. find every group of three entries, at three different positions, whose values add up to zero. return each group of values once: two groups made of the same three values count as one, even if they come from different positions. the order of the groups, and of the values inside each group, doesn't matter. numbers groups [ 2, 0, 1, 1, 2] [[ 2, 0, 2], [ 2, 1, 1]] [0, 0, 0, 0] [[0, 0, 0]] — four zeros, but one distinct group [1, 2, 4] [] — the only three entries add up to −1 constraints that matter: between 3 and 3,000 numbers, each between −100,000 and 100,000. trying every group of three is o(n³); the target is o(n²). because order is free, the xcode test sorts each group and then the list of groups before comparing. ::: pattern and cue sort, then two pointers inside a loop. the cue is \"groups of three\" that \"add up to\" a target, with \"distinct\" groups. fix the first value and what remains is problem 7 exactly: find two entries in a sorted range that sum to minus the first value. sorting is what makes both halves work — it enables the two pointer search, and it puts equal values next to each other so repeats can be skipped instead of filtered out afterwards. ::: ::: approach sort the numbers. take each value in turn as the first member of a group, skipping it if it is the same as the value just before (it would find the same groups again). for each first value, run the two finger search from problem 7 on everything to its right, looking for a pair that brings the total to zero. when a pair is found, record the group, move both fingers inward, and move the left finger past any copies of the value it just used. once the first value is above zero you can stop: everything to its right is at least as large, so no group can add up to zero. time o(n²): the sort is o(n log n), then n first values each run an o(n) scan. space o(1) beyond the output, or o(n) if you count the sorted copy — swift's sorted() returns a new array, and sorting the input in place would change the caller's data. ::: ::: swift solution swift func threesum(_ numbers: [int]) [[int]] { let sorted = numbers.sorted() var triplets: [[int]] = [] for first in sorted.indices { if sorted[first] 0 { break } // nothing to the right can bring it back to 0 if first 0 && sorted[first] == sorted[first 1] { continue } // same first value, same triplets var left = first + 1 var right = sorted.count 1 while left < right { let sum = sorted[first] + sorted[left] + sorted[right] if sum < 0 { left += 1 } else if sum 0 { right = 1 } else { triplets.append([sorted[first], sorted[left], sorted[right]]) left += 1 right = 1 while left < right && sorted[left] == sorted[left 1] { left += 1 } } } } return triplets } skipping repeats of the left value is enough: once left has moved past its copies, the right value that completes the group is fixed, so a duplicate on the right can't produce a new match. verified with swift test on swift 6.2.3 in swift 6 mode: the three examples above, six more (empty, one and two entries, a seven value mix with four answers, fifteen values heavy with repeats, and [ 1, 1, 1, 2, 2] ), and 2,000 random arrays checked against a brute force o(n³) search — including a check that no group comes back twice. ::: ::: walk it through [ 2, 0, 1, 1, 2] (already sorted) first left right sum action −2 0 2 0 record [ 2, 0, 2] ; move both −2 1 1 0 record [ 2, 1, 1] ; move both, fingers cross 0 1 2 3 too big → right moves 0 1 1 2 too big → right moves, fingers meet 1 — — — first value above 0 → stop two groups. [0, 0, 0, 0] — first value is the zero at position 0; left at 1, right at 3, sum 0, record [0, 0, 0] ; both move to 2 and meet. positions 1, 2 and 3 as first value are all repeats of 0 and are skipped. one group. ::: ::: the swift trap a tuple can't go in a set . the instinct is to collect every match into a set to remove repeats — set<(int, int, int) — and it doesn't compile, because tuples aren't hashable in swift. set<[int] does compile, but only if every group is sorted first, and it adds o(k) hashing for k results plus a conversion back to an array at the end. it is a working answer, and an interviewer will accept it with a nudge; skipping repeats in the sorted array is the one they are waiting for, and it removes the need for the set entirely. say both, write the second. ::: ::: what they ask next \"closest sum to a target instead of exactly zero.\" → same loop; track the sum with the smallest distance to the target and move the fingers by comparing with the target. no duplicate skipping needed. \"4sum.\" → two nested loops for the first two values, each skipping repeats, then the two finger scan: o(n³). generalises to k sum by recursion down to two. \"can you beat o(n²)?\" → not in general — 3sum is the textbook problem believed to need about n² time. saying that is a better answer than inventing an optimisation. ::: ", "outline": []}], "minutes": 206, "sources": [{"ref": "", "label": "Zalando · Technical interview for software engineers", "url": "https://jobs.zalando.com/en/blog/technical-interview-for-software-engineers"}, {"ref": "", "label": "Grind 75", "url": "https://www.techinterviewhandbook.org/grind75"}, {"ref": "", "label": "Blind 75 (original list)", "url": "https://www.teamblind.com/post/New-Year-Gift---Curated-List-of-Top-75-LeetCode-Questions-to-Save-Your-Time-OaM1orEU"}, {"ref": "", "label": "LeetCode 1 · Two Sum", "url": "https://leetcode.com/problems/two-sum/"}, {"ref": "", "label": "Swift standard library · Dictionary", "url": "https://developer.apple.com/documentation/swift/dictionary"}, {"ref": "", "label": "LeetCode 49 · Group Anagrams", "url": "https://leetcode.com/problems/group-anagrams/"}, {"ref": "", "label": "Swift standard library · Dictionary.init(grouping:by:)", "url": "https://developer.apple.com/documentation/swift/dictionary/init(grouping:by:)"}, {"ref": "SE-0206", "label": "Hashable Enhancements (per-process hash seeding)", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0206-hashable-enhancements.md"}, {"ref": "", "label": "LeetCode 347 · Top K Frequent Elements", "url": "https://leetcode.com/problems/top-k-frequent-elements/"}, {"ref": "", "label": "Swift standard library · Array.prefix(_:)", "url": "https://developer.apple.com/documentation/swift/array/prefix(_:)"}, {"ref": "", "label": "Swift Collections · Heap", "url": "https://github.com/apple/swift-collections"}, {"ref": "", "label": "LeetCode 128 · Longest Consecutive Sequence", "url": "https://leetcode.com/problems/longest-consecutive-sequence/"}, {"ref": "", "label": "Swift standard library · Set", "url": "https://developer.apple.com/documentation/swift/set"}, {"ref": "", "label": "The Swift Programming Language · Overflow Operators", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/advancedoperators/#Overflow-Operators"}, {"ref": "", "label": "LeetCode 560 · Subarray Sum Equals K", "url": "https://leetcode.com/problems/subarray-sum-equals-k/"}, {"ref": "", "label": "Swift standard library · Dictionary.subscript(_:default:)", "url": "https://developer.apple.com/documentation/swift/dictionary/subscript(_:default:)-45arb"}, {"ref": "", "label": "LeetCode 125 · Valid Palindrome", "url": "https://leetcode.com/problems/valid-palindrome/"}, {"ref": "", "label": "Swift standard library · String.Index", "url": "https://developer.apple.com/documentation/swift/string/index"}, {"ref": "", "label": "Swift standard library · Character.isLetter", "url": "https://developer.apple.com/documentation/swift/character/isletter"}, {"ref": "", "label": "LeetCode 167 · Two Sum II — Input Array Is Sorted", "url": "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"}, {"ref": "", "label": "Swift standard library · addingReportingOverflow(_:)", "url": "https://developer.apple.com/documentation/swift/int/addingreportingoverflow(_:)"}, {"ref": "", "label": "LeetCode 15 · 3Sum", "url": "https://leetcode.com/problems/3sum/"}, {"ref": "", "label": "Swift standard library · Hashable", "url": "https://developer.apple.com/documentation/swift/hashable"}]}, {"title": "Swift Concurrency", "slug": "swift-concurrency", "tagline": "How it actually works, from cores upward", "summary": "Threads, tasks, actors and isolation — built up from first principles, with the mechanism from Apple's own material. Answers the three questions that stay confusing: what an actor really is, how it differs from a thread, and why @MainActor is not the main thread.", "status": "complete", "accentIndex": 0, "chapters": [{"slug": "why-concurrency-exists", "title": "Why concurrency exists", "summary": "Cores, threads, and the two genuinely different reasons one thread isn't enough.", "minutes": "6", "sources": [{"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}], "html": "<p>Nothing in this chapter is Swift. It is the ground everything else stands on, and skipping it is why so many explanations of actors don't land.<\/p><h2 id=\"what-a-computer-actually-does\">What a computer actually does<\/h2><p>A processor core does one thing: read an instruction, carry it out, read the next. One at a time, in order, very fast.<\/p><p>A modern iPhone has several cores — six is typical. An Apple Watch has two. Each core is an independent instruction-follower. Six cores means six instructions genuinely happening at the same instant, and not one more.<\/p><p>That is the hard limit everything else is built on top of. Whenever an app appears to be \"doing many things at once\", it is either doing at most six things at once, or taking turns very quickly.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The office has <strong>six desks<\/strong>, and a desk is the only place work can actually happen. Six is the building's real capacity and it never changes. Everything that follows is about getting more done than six-things-at-once out of six desks. <strong>The desks are the cores.<\/strong> Hold onto that — people arrive in the next section, and people are a different thing.<\/p><\/blockquote><h2 id=\"what-a-thread-is\">What a thread is<\/h2><p>A <strong>thread<\/strong> is one stream of instructions with its own place to keep track of where it is — its stack of half-finished work. The operating system owns threads. It decides which thread runs on which core, and when to take a core away from one and give it to another.<\/p><p>Two things matter for everything that follows.<\/p><p><strong>A thread is expensive.<\/strong> It has a stack — memory reserved up front, typically half a megabyte or more — plus bookkeeping inside the kernel. You can have thousands, but each costs real memory whether it is doing anything or not.<\/p><p><strong>Swapping threads is expensive.<\/strong> When the OS takes a core from thread A and gives it to thread B, it saves everything A was doing and loads everything B was doing. That is a <strong>context switch<\/strong>. Individually microseconds; done constantly, it becomes the main thing the CPU is doing.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p><strong>A thread is a worker.<\/strong> That stays true for the whole of this topic — wherever you see <em>worker<\/em> or <em>staff<\/em>, it means a thread and nothing else ever does.<\/p><p>A worker is a person the company employs. They have their own locker holding their own pile of half-finished paperwork, and the locker is theirs whether or not they are currently busy. That is what makes hiring expensive.<\/p><p><strong>Workers and desks are not the same thing, and this is where people trip.<\/strong> You can employ ninety people. You still have six desks. At any instant at most six of your employees are sitting down working; the rest stand around holding paperwork. Getting one up so another can sit means packing one pile away and unpacking another — <strong>that shuffling is the context switch.<\/strong><\/p><\/blockquote><h2 id=\"why-one-thread-isn-t-enough\">Why one thread isn't enough<\/h2><p>Two reasons, and they are genuinely different problems. Keeping them apart is the single most useful distinction in the subject.<\/p><p><strong>Reason one: waiting.<\/strong> Most of what an app does is wait. For a server. For a file. For the user. While a thread waits it occupies a core and does nothing. The work isn't slow — the <em>waiting<\/em> is slow, and the thread is stuck in it.<\/p><p><strong>Reason two: actual work.<\/strong> Some things take real time because there is real computing to do. Decoding a large image. Running a model. Resizing ten thousand photos. Nothing makes that free; somebody has to do the arithmetic.<\/p><p>The fix for waiting is <em>don't sit there<\/em> — go and do something else, come back. The fix for real work is <em>use more cores<\/em>. Different problems, different mechanisms.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Both are about a worker <strong>sitting at one of your six desks<\/strong>.<\/p><p>A worker on hold to a supplier is at a desk producing nothing. One of six desks, wasted. The fix is not another person — it is <em>get up, let someone else sit, come back when the supplier answers<\/em>.<\/p><p>A worker doing a long stocktake is at a desk producing something. Nothing is wasted; the job is simply large. More people doesn't help, because there are still six desks.<\/p><p>Confusing the two is how a company ends up hiring ninety people to fix a problem that was never about headcount — which is exactly the next chapter.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>This is the distinction Apple draws in WWDC25 between <code><span class=\"t-kw\">async<\/span><\/code> and <code><span class=\"t-atr\">@concurrent<\/span><\/code>. <code><span class=\"t-kw\">async<\/span><\/code> hides <em>latency<\/em> — it exists so a thread stops sitting in a wait. <code><span class=\"t-atr\">@concurrent<\/span><\/code> moves <em>computation<\/em> — it exists so work happens somewhere other than where you called it. Asking \"is this slow because it's waiting, or slow because it's working?\" picks the tool, and picking the wrong one is the most common design error in this area.<\/p><\/blockquote><h2 id=\"concurrency-is-not-parallelism\">Concurrency is not parallelism<\/h2><p><strong>Concurrency<\/strong> is structuring a program so several things can be <em>in progress<\/em> at once. A chef with three pans going is concurrent, with two hands.<\/p><p><strong>Parallelism<\/strong> is several things actually <em>executing<\/em> in the same instant. Two chefs. It needs more cores.<\/p><p>Concurrency is a way of organising; parallelism is a hardware capability. You can have concurrency on a single core — it is just taking turns — and it still helps enormously, because most turns are spent waiting.<\/p><h2 id=\"the-two-problems-that-follow\">The two problems that follow<\/h2><p><strong>Shared data.<\/strong> Two threads change the same thing at the same moment and one change is lost, or the thing ends up in a state that should be impossible. That is a <strong>data race<\/strong>.<\/p><p>What makes data races dangerous is not how damaging they are. It is that they are <em>rare<\/em>. It doesn't go wrong in testing. It goes wrong once, on a busy day, on a customer's phone, and you cannot reproduce it on purpose.<\/p><p><strong>Too many threads.<\/strong> Each waiting thread holds memory and generates context switches. Past a point, adding threads makes everything slower.<\/p><p>Everything in Swift concurrency answers one of those two. Chapter 3 answers the second; chapters 4 to 7 answer the first.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>One filing cabinet, open to the floor. Two workers pull the same page, both write on it, one change is lost — and nobody notices for months. Meanwhile the more people you hire, the more of them stand around waiting for that one cabinet.<\/p><\/blockquote>", "text": "nothing in this chapter is swift. it is the ground everything else stands on, and skipping it is why so many explanations of actors don't land. what a computer actually does a processor core does one thing: read an instruction, carry it out, read the next. one at a time, in order, very fast. a modern iphone has several cores — six is typical. an apple watch has two. each core is an independent instruction follower. six cores means six instructions genuinely happening at the same instant, and not one more. that is the hard l ng one up so another can sit means packing one pile away and unpacking another — that shuffling is the context switch. why one thread isn't enough two reasons, and they are genuinely different problems. keeping them apart is the single most useful distinction in the subject. reason one: waiting. most of what an app does is wait. for a server. for a file. for the user. while a thread waits it occupies a core and does nothing. the work isn't slow — the waiting is slow, and the thread is stuck in it. reason two: actual work. some things take real time because there is real computing to do. decoding a large image. running a model. resizing ten thousand photos. nothing makes that free; somebody has to do the arithmetic. the fix for waiting is don't sit there — go and do something else, come back. the fix for real work is use more cores . different problems, different mechanisms. in the office. both are about a worker sitting at one of your six desks . a worker on hold to a supplier is at a desk producing nothing. one of six desks, wasted. the fix is not another person — it is get up, let someone else sit, come back when the supplier answers . a worker doing a long stocktake is at a desk producing something. nothing is wasted; the job is simply large. more people doesn't help, because there are still six desks. confusing the two is how a company ends up hiring ninety people to fix a problem that was never about headcount — which is exactly the next chapter. under the hood. this is the distinction apple draws in wwdc25 between async and @concurrent . async hides latency — it exists so a thread stops sitting in a wait. @concurrent moves computation — it exists so work happens somewhere other than where you called it. asking \"is this slow because it's waiting, or slow because it's working?\" picks the tool, and picking the wrong one is the most common design error in this area. concurrency is not parallelism concurrency is structuring a program so several things can be in progress at once. a chef with three pans going is concurrent, with two hands. parallelism is several things actually executing in the same instant. two chefs. it needs more cores. concurrency is a way of organising; parallelism is a hardware capability. you can have concurrency on a single core — it is just taking turns — and it still helps enormously, because most turns are spent waiting. the two problems that follow shared data. two threads change the same thing at the same moment and one change is lost, or the thing ends up in a state that should be impossible. that is a data race . what makes data races dangerous is not how damaging they are. it is that they are rare . it doesn't go wrong in testing. it goes wrong once, on a busy day, on a customer's phone, and you cannot reproduce it on purpose. too many threads. each waiting thread holds memory and generates context switches. past a point, adding threads makes everything slower. everything in swift concurrency answers one of those two. chapter 3 answers the second; chapters 4 to 7 answer the first. in the office. one filing cabinet, open to the floor. two workers pull the same page, both write on it, one change is lost — and nobody notices for months. meanwhile the more people you hire, the more of them stand around waiting for that one cabinet. ", "outline": [{"a": "what-a-computer-actually-does", "t": "What a computer actually does"}, {"a": "what-a-thread-is", "t": "What a thread is"}, {"a": "why-one-thread-isn-t-enough", "t": "Why one thread isn't enough"}, {"a": "concurrency-is-not-parallelism", "t": "Concurrency is not parallelism"}, {"a": "the-two-problems-that-follow", "t": "The two problems that follow"}]}, {"slug": "what-went-wrong-before", "title": "What went wrong before", "summary": "Callbacks, GCD thread explosion, locks — and the single root cause underneath all three.", "minutes": "5", "sources": [{"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}, {"ref": "", "label": "WWDCNotes · Behind the scenes (transcript detail)", "url": "https://wwdcnotes.com/documentation/wwdc21-10254-swift-concurrency-behind-the-scenes/"}], "html": "<p>Swift concurrency is not a new way to do the same thing. It is a response to three specific failures, and it is much easier to hold in your head if you know what it was reacting to.<\/p><h2 id=\"callbacks\">Callbacks<\/h2><p>The first answer to waiting: hand over a piece of code to run when the answer arrives, and return immediately.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code>loadUser(id) { user <span class=\"t-kw\">in<\/span>\n    loadAvatar(user) { image <span class=\"t-kw\">in<\/span>\n        resize(image) { small <span class=\"t-kw\">in<\/span>\n            display(small)          <span class=\"t-com\">// three levels deep, and no error handling yet<\/span>\n        }\n    }\n}<\/code><\/pre><\/div><p>It works, and it has three problems. It nests — each step buries the next. Errors must be threaded through by hand at every level. And nothing forces you to call the callback: forget one branch and the operation silently never finishes, with no complaint from the compiler.<\/p><h2 id=\"gcd-and-thread-explosion\">GCD, and thread explosion<\/h2><p>Grand Central Dispatch let you hand work to queues and managed threads for you. A big improvement, with one structural flaw: <strong>when a thread blocked, GCD brought up another thread<\/strong> to keep the remaining work moving.<\/p><p>Apple's own example:<\/p><blockquote class=\"aside plain\"><p>A news app updating a hundred feeds. Each network callback needs the database, and blocks waiting for it. GCD sees blocked threads with work still queued, so it creates more. On a six-core iPhone you end up with roughly <strong>sixteen times more threads than cores<\/strong>.<\/p><\/blockquote><p>Every one of those threads holds its stack. The OS tries to give each a fair share, so it context-switches constantly. The device now spends most of its energy on the bookkeeping of having too many threads.<\/p><p>This is <strong>thread explosion<\/strong>, and it is the specific failure Swift concurrency was built to make impossible.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Whenever a worker is stuck on hold, the manager hires another so the work keeps moving. Soon there are ninety-six people in a six-desk office, almost all on hold, and most of the day goes on deciding who gets to sit down.<\/p><\/blockquote><h2 id=\"locks\">Locks<\/h2><p>The standard answer to shared data: a lock. One holder at a time, everyone else waits.<\/p><p>Locks work, and they cost three things.<\/p><p>They are a <strong>convention, not a barrier<\/strong> — the data is still reachable, and the protection holds only while every piece of code remembers to take the lock, forever.<\/p><p>Two locks taken in opposite orders by two threads produce a <strong>deadlock<\/strong>, where both wait for each other permanently.<\/p><p>And a thread waiting on a lock is a blocked thread, which in a GCD world causes the section above.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A single key to the cabinet. It works — but the cabinet is still standing open, so the protection lasts exactly as long as everyone's memory. And two workers who take two keys in opposite orders wait for each other, politely, forever.<\/p><\/blockquote><h2 id=\"the-root-cause\">The root cause<\/h2><p>Read those two together and the common factor is blocking.<\/p><p><strong>A blocked thread is a thread that is occupied but not working<\/strong>, and every bad outcome above follows from having a lot of them. Thread explosion is blocked threads multiplying. Deadlock is blocked threads that will never unblock. Even the callback pyramid exists because the alternative — writing it straight and waiting — would block.<\/p><p>So Swift's design starts from one rule: <strong>threads must never block.<\/strong> Everything in the next chapter is a consequence of taking that seriously.<\/p>", "text": "swift concurrency is not a new way to do the same thing. it is a response to three specific failures, and it is much easier to hold in your head if you know what it was reacting to. callbacks the first answer to waiting: hand over a piece of code to run when the answer arrives, and return immediately. swift loaduser(id) { user in loadavatar(user) { image in resize(image) { small in display(small) // three levels deep, and no error handling yet } } } it works, and it has three problems. it nests — each step buries the next. errors must be threaded through by hand at every level. and nothing forces you to call the callback: forget one branch and the operation silently never finishes, with no complaint from the compiler. gcd, and thread explosion grand central dispatch let you hand work to queues and managed threads for you. a big improvement, with one structural flaw: when a thread blocked, gcd brought up another thread to keep the remaining work moving. apple's own example: a news app updating a hundred feeds. each network callback needs the database, and blocks waiting for it. gcd sees blocked threads with work still queued, so it creates more. on a six core iphone you end up with roughly sixteen times more threads than cores . every one of those threads holds its stack. the os tries to give each a fair share, so it context switches constantly. the device now spends most of its energy on the bookkeeping of having too many threads. this is thread explosion , and it is the specific failure swift concurrency was built to make impossible. in the office. whenever a worker is stuck on hold, the manager hires another so the work keeps moving. soon there are ninety six people in a six desk office, almost all on hold, and most of the day goes on deciding who gets to sit down. locks the standard answer to shared data: a lock. one holder at a time, everyone else waits. locks work, and they cost three things. they are a convention, not a barrier — the data is still reachable, and the protection holds only while every piece of code remembers to take the lock, forever. two locks taken in opposite orders by two threads produce a deadlock , where both wait for each other permanently. and a thread waiting on a lock is a blocked thread, which in a gcd world causes the section above. in the office. a single key to the cabinet. it works — but the cabinet is still standing open, so the protection lasts exactly as long as everyone's memory. and two workers who take two keys in opposite orders wait for each other, politely, forever. the root cause read those two together and the common factor is blocking. a blocked thread is a thread that is occupied but not working , and every bad outcome above follows from having a lot of them. thread explosion is blocked threads multiplying. deadlock is blocked threads that will never unblock. even the callback pyramid exists because the alternative — writing it straight and waiting — would block. so swift's design starts from one rule: threads must never block. everything in the next chapter is a consequence of taking that seriously. ", "outline": [{"a": "callbacks", "t": "Callbacks"}, {"a": "gcd-and-thread-explosion", "t": "GCD, and thread explosion"}, {"a": "locks", "t": "Locks"}, {"a": "the-root-cause", "t": "The root cause"}]}, {"slug": "tasks-async-await", "title": "Tasks, async and await", "summary": "The move that makes everything else possible — separating the work from the worker.", "minutes": "8", "sources": [{"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}], "html": "<h2 id=\"a-task-is-a-job-not-a-worker\">A task is a job, not a worker<\/h2><p>This is the central move, and everything else follows from it.<\/p><p>Under the old model, \"do this in the background\" meant <em>get a thread<\/em> — hire a worker. Workers are expensive, so you couldn't have many.<\/p><p>Under Swift concurrency you create a <strong>task<\/strong>: a description of work to be done. A task is not a thread. It is an object on the heap, cheap enough that having tens of thousands is unremarkable. Behind them sits a small, fixed pool of actual threads that pick tasks up and run them.<\/p><p><strong>Many tasks, few threads.<\/strong> That single sentence is the shape of the whole system.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Stop hiring people. Just stop confusing <em>jobs<\/em> with <em>workers<\/em>.<\/p><p>Write each job on a slip of paper and put it in a tray. A slip is not a person; it costs nothing, so you can write ten thousand. Then employ exactly <strong>six workers, one per desk<\/strong>, and have them take slips from the tray and work them.<\/p><p>Ten thousand slips, six workers, six desks, nobody standing around. <strong>Many slips, few workers<\/strong> — that's the whole rearrangement.<\/p><\/blockquote><h2 id=\"async-and-await\"><code><span class=\"t-kw\">async<\/span><\/code> and <code><span class=\"t-kw\">await<\/span><\/code><\/h2><p>A function marked <code><span class=\"t-kw\">async<\/span><\/code> is one that might need to pause. Inside it, every point where it <em>might<\/em> pause is marked <code><span class=\"t-kw\">await<\/span><\/code>:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> loadProfile(id: <span class=\"t-typ\">String<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Profile<\/span> {\n    <span class=\"t-kw\">let<\/span> data = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetch(id)      <span class=\"t-com\">// might pause here<\/span>\n    <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">try<\/span> decode(data)             <span class=\"t-com\">// ordinary work, no pause<\/span>\n}<\/code><\/pre><\/div><p><code><span class=\"t-kw\">await<\/span><\/code> is not an instruction to go elsewhere. It marks a place where the function may be <strong>suspended<\/strong>: put down, with a note of where it had got to, so the thread can run something else. When the answer arrives the task resumes — possibly on a different thread.<\/p><p>Two consequences, and they are the two people get wrong.<\/p><p><strong><code><span class=\"t-kw\">await<\/span><\/code> does not mean \"background\".<\/strong> It means \"this may pause\". Which thread continues afterwards is a separate question, answered in chapter 6.<\/p><p><strong><code><span class=\"t-kw\">await<\/span><\/code> does mean \"the world may have moved.\"<\/strong> You put the work down. Other work ran. Anything you checked before the <code><span class=\"t-kw\">await<\/span><\/code> may no longer be true after it. That single fact is the root of chapter 5.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A marked point on the slip where the worker may set it down — with a bookmark noting exactly where they had got to — and pick up somebody else's slip instead. The bookmark is the part that matters: the desk is cleared completely, so nothing of yours occupies it while you wait.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>A synchronous function keeps its local state on the thread's stack, which is why it cannot be put down — the stack frame would have to survive, and stacks don't work that way. An <code><span class=\"t-kw\">async<\/span><\/code> function is compiled differently: anything needed <em>across<\/em> a suspension point is stored in a heap-allocated <strong>async frame<\/strong>, while anything used only within one uninterrupted stretch stays on the stack. The chain of async frames is the runtime representation of a <strong>continuation<\/strong>. When the function suspends, its stack frame is destroyed and the thread's stack is reused by the next piece of work — nothing is left occupied.<\/p><\/blockquote><h2 id=\"the-cooperative-thread-pool\">The cooperative thread pool<\/h2><p>Swift's threads live in a pool with a deliberate size limit, stated by Apple plainly:<\/p><blockquote class=\"aside plain\"><p>\"The new thread pool will only spawn as many threads as there are CPU cores, thereby making sure not to overcommit the system.\"<\/p><\/blockquote><p>Six cores, six threads. Not sixteen times more. Thread explosion isn't mitigated — it is structurally impossible, because no mechanism exists that creates the seventh thread.<\/p><p>This is only safe because of the rule from chapter 2. If a pool thread could block, six blocked threads would mean a frozen app with no way to recover. <strong>The pool is small because threads never block, and threads never block because <code><span class=\"t-kw\">await<\/span><\/code> suspends instead.<\/strong><\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Six desks, six workers, permanently. Nobody is hired mid-crisis, because nobody ever stands on hold — they put the slip down instead. The small permanent staff is only possible <em>because<\/em> of that rule, and the rule is only bearable <em>because<\/em> the staff is small.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>Apple calls this the <strong>runtime contract<\/strong>: every thread must always be able to make forward progress. It is why <code><span class=\"t-kw\">await<\/span><\/code> suspends rather than waits, and why the runtime needs to know task dependencies — that knowledge is what lets it schedule without ever parking a thread.<\/p><p>It is also why semaphores and condition variables are <strong>unsafe<\/strong> here rather than merely discouraged: they create a dependency the runtime cannot see, so it cannot schedule around it, and a pool thread sits blocked. <code>os_unfair_lock<\/code> and <code><span class=\"t-typ\">NSLock<\/span><\/code> are acceptable for tight critical sections with no <code><span class=\"t-kw\">await<\/span><\/code> inside, because the runtime can always progress toward the release. Set <code><span class=\"t-typ\">LIBDISPATCH_COOPERATIVE_POOL_STRICT<\/span>=<span class=\"t-num\">1<\/span><\/code> to have a debug runtime catch violations.<\/p><\/blockquote><h2 id=\"switching-work-is-now-cheap\">Switching work is now cheap<\/h2><p>Because suspended work lives on the heap rather than on a thread's stack, a thread moving from one task to another needs no help from the operating system:<\/p><blockquote class=\"aside plain\"><p>\"When threads execute work under Swift concurrency they switch between continuations instead of performing a full thread context switch. This means that we now only pay the cost of a function call instead.\"<\/p><\/blockquote><p>A context switch costs microseconds and involves the kernel. A continuation switch costs about what calling a function costs. That difference is why a six-thread pool can service enormous numbers of tasks.<\/p><h2 id=\"interleaving\">Interleaving<\/h2><p>Put all of the above together and you get what Apple calls <strong>interleaving<\/strong>: one thread alternating between many tasks, each taking a turn whenever it can make progress.<\/p><p>Worth stating plainly, because beginners always ask: <em>on one thread, with no extra cores, does any of this help?<\/em> Yes — enormously — because the time it reclaims was time spent waiting, and waiting never needed a core.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>One clerk with forty slips on the go, working whichever has something to do right now. From outside it looks like forty people. It costs one desk.<\/p><\/blockquote>", "text": " a task is a job, not a worker this is the central move, and everything else follows from it. under the old model, \"do this in the background\" meant get a thread — hire a worker. workers are expensive, so you couldn't have many. under swift concurrency you create a task : a description of work to be done. a task is not a thread. it is an object on the heap, cheap enough that having tens of thousands is unremarkable. behind them sits a small, fixed pool of actual threads that pick tasks up and run them. many tasks, few threads. that single sentence is the shape of the whole system. in the office. stop hiring people. just stop confusing jobs with workers . write each job on a slip of paper and put it in a tray. a slip is not a person; it costs nothing, so you can write ten thousand. then employ exactly six workers, one per desk , and have them take slips from the tray and work them. ten thousand slips, six workers, six desks, nobody standing around. many slips, few workers — that's the whole rearrangement. async and await a function marked async is one that might need to pause. inside it, every point where it might pause is marked await : swift func loadprofile(id: string) async throws profile { let data = try await fetch(id) // might pause here return try decode(data) // ordinary work, no pause } await is not an instruction to go elsewhere. it marks a place where the function may be suspended : put down, with a note of where it had got to, so the thread can run something else. when the answer arrives the task resumes — possibly on a different thread. two consequences, and they are the two people get wrong. await does not mean \"background\". it means \"this may pause\". which thread continues afterwards is a separate question, answered in chapter 6. await does mean \"the world may have moved.\" you put the work down. other work ran. anything you checked before the await may no longer be true after it. that single fact is the root of chapter 5. in the office. a marked point on the slip where the worker may set it down — with a bookmark noting exactly where they had got to — and pick up somebody else's slip instead. the bookmark is the part that matters: the desk is cleared completely, so nothing of yours occupies it while you wait. under the hood. a synchronous function keeps its local state on the thread's stack, which is why it cannot be put down — the stack frame would have to survive, and stacks don't work that way. an async function is compiled differently: anything needed across a suspension point is stored in a heap allocated async frame , while anything used only within one uninterrupted stretch stays on the stack. the chain of async frames is the runtime representation of a continuation . when the function suspends, its stack frame is destroyed and the thread's stack is reused by the next piece of work — nothing is left occupied. the cooperative thread pool swift's threads live in a pool with a deliberate size limit, stated by apple plainly: \"the new thread pool will only spawn as many threads as there are cpu cores, thereby making sure not to overcommit the system.\" six cores, six threads. not sixteen times more. thread explosion isn't mitigated — it is structurally impossible, because no mechanism exists that creates the seventh thread. this is only safe because of the rule from chapter 2. if a pool thread could block, six blocked threads would mean a frozen app with no way to recover. the pool is small because threads never block, and threads never block because await suspends instead. in the office. six desks, six workers, permanently. nobody is hired mid crisis, because nobody ever stands on hold — they put the slip down instead. the small permanent staff is only possible because of that rule, and the rule is only bearable because the staff is small. under the hood. apple calls this the runtime contract : every thread must always be able to make forward progress. it is why await suspends rather than waits, and why the runtime needs to know task dependencies — that knowledge is what lets it schedule without ever parking a thread. it is also why semaphores and condition variables are unsafe here rather than merely discouraged: they create a dependency the runtime cannot see, so it cannot schedule around it, and a pool thread sits blocked. os_unfair_lock and nslock are acceptable for tight critical sections with no await inside, because the runtime can always progress toward the release. set libdispatch_cooperative_pool_strict=1 to have a debug runtime catch violations. switching work is now cheap because suspended work lives on the heap rather than on a thread's stack, a thread moving from one task to another needs no help from the operating system: \"when threads execute work under swift concurrency they switch between continuations instead of performing a full thread context switch. this means that we now only pay the cost of a function call instead.\" a context switch costs microseconds and involves the kernel. a continuation switch costs about what calling a function costs. that difference is why a six thread pool can service enormous numbers of tasks. interleaving put all of the above together and you get what apple calls interleaving : one thread alternating between many tasks, each taking a turn whenever it can make progress. worth stating plainly, because beginners always ask: on one thread, with no extra cores, does any of this help? yes — enormously — because the time it reclaims was time spent waiting, and waiting never needed a core. in the office. one clerk with forty slips on the go, working whichever has something to do right now. from outside it looks like forty people. it costs one desk. ", "outline": [{"a": "a-task-is-a-job-not-a-worker", "t": "A task is a job, not a worker"}, {"a": "async-and-await", "t": "async and await"}, {"a": "the-cooperative-thread-pool", "t": "The cooperative thread pool"}, {"a": "switching-work-is-now-cheap", "t": "Switching work is now cheap"}, {"a": "interleaving", "t": "Interleaving"}]}, {"slug": "actors", "title": "Actors", "summary": "What an actor is, and the difference between an actor and a thread.", "minutes": "9", "sources": [{"ref": "SE-0306", "label": "Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0306-actors.md"}, {"ref": "SE-0392", "label": "Custom Actor Executors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0392-custom-actor-executors.md"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<p>Chapter 3 solved <em>too many threads<\/em>. It did nothing about <em>shared data<\/em>. That is this chapter.<\/p><h2 id=\"what-an-actor-is\">What an actor is<\/h2><p>An <strong>actor<\/strong> is a thing that owns some data and is the only route to it.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">BankAccount<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> balance: <span class=\"t-typ\">Decimal<\/span> = <span class=\"t-num\">0<\/span>\n\n    <span class=\"t-kw\">func<\/span> deposit(_ amount: <span class=\"t-typ\">Decimal<\/span>) {\n        balance += amount\n    }\n\n    <span class=\"t-kw\">func<\/span> currentBalance() -&gt; <span class=\"t-typ\">Decimal<\/span> {\n        balance\n    }\n}<\/code><\/pre><\/div><p>From outside you cannot touch <code>balance<\/code>. You can only ask the actor to do something, and asking costs an <code><span class=\"t-kw\">await<\/span><\/code>:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">let<\/span> account = <span class=\"t-typ\">BankAccount<\/span>()\n<span class=\"t-kw\">await<\/span> account.deposit(<span class=\"t-num\">100<\/span>)\n<span class=\"t-kw\">let<\/span> b = <span class=\"t-kw\">await<\/span> account.currentBalance()<\/code><\/pre><\/div><p>Two callers can never be inside the actor at the same moment, so <code>balance += <span class=\"t-num\">100<\/span><\/code> cannot lose an increment. That safety is <strong>structural<\/strong> — there is no other route to the data — rather than a rule everyone has to remember. This is the difference between an actor and a lock, and it is the entire point.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>Take the cabinet out of the open office. Put it in a back room, with a counter and a clerk in front of it. Now nobody <em>can<\/em> reach the cabinet — not \"shouldn't\", can't, there is a wall. You write your request, hand it across, and wait your turn. Two people can no longer spoil the same page because neither of them ever touches it.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0306 defines an actor as \"a reference type that protects access to its mutable state.\" Cross-actor access is permitted in exactly two forms: reading an immutable <code><span class=\"t-kw\">let<\/span><\/code> within the same module, or an asynchronous call. Everything else is a compile error, not a convention.<\/p><\/blockquote><h2 id=\"how-is-an-actor-different-from-a-thread\">How is an actor different from a thread?<\/h2><p>This is the most common point of confusion, and the reason is that the question quietly assumes they are the same kind of thing. They are not.<\/p><p><strong>A thread is a worker.<\/strong> It <em>executes<\/em>. It has a stack, the OS schedules it onto a core, and while it runs it consumes a core.<\/p><p><strong>An actor is a protected area around data.<\/strong> It does not execute anything. It has no stack. The OS has never heard of it. It is not scheduled onto a core, because it isn't the sort of thing that runs.<\/p><p>Asking how an actor differs from a thread is like asking how a bank vault differs from a bank teller. One is a worker, the other is a protected place workers must go through. They are not alternatives — a real system has both.<\/p><p><strong>So what runs an actor's code?<\/strong> A thread from the pool in chapter 3. Which one? Whichever is free.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">Counter<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> n = <span class=\"t-num\">0<\/span>\n    <span class=\"t-kw\">func<\/span> bump() {\n        n += <span class=\"t-num\">1<\/span>\n        print(<span class=\"t-typ\">Thread<\/span>.current)   <span class=\"t-com\">// a DIFFERENT thread on different calls<\/span>\n    }\n}<\/code><\/pre><\/div><p>Call <code>bump()<\/code> ten times and you may see several different threads. The actor doesn't care; nothing about its guarantee depends on which thread does the work. Conversely, one pool thread will, over a second, run work belonging to dozens of actors.<\/p><p><em>(Swift discourages inspecting <code><span class=\"t-typ\">Thread<\/span>.current<\/code> from concurrent code precisely because the answer is meaningless to the model — but as a one-off demonstration it makes the point better than any paragraph.)<\/em><\/p><p><strong>The guarantee, stated exactly.<\/strong> An actor gives <strong>mutual exclusion, not thread affinity<\/strong>. SE-0392 is explicit: a serial executor guarantees that for any two jobs, all of one happens before all of the other — and deliberately says nothing about threads. Apple's wording: <em>\"Swift's concurrency design is intentionally vague about the details of how code is actually run.\"<\/em><\/p><div class=\"scroll\"><table><thead><tr><th><\/th><th>Thread<\/th><th>Actor<\/th><\/tr><\/thead><tbody><tr><td>What it is<\/td><td>a worker that executes<\/td><td>a protected region of data<\/td><\/tr><tr><td>Owned by<\/td><td>the operating system<\/td><td>your program<\/td><\/tr><tr><td>Has a stack<\/td><td>yes, ~0.5 MB+<\/td><td>no<\/td><\/tr><tr><td>Scheduled onto a core<\/td><td>yes<\/td><td>never — it doesn't run<\/td><\/tr><tr><td>How many<\/td><td>hundreds, each costs<\/td><td>millions, they're just objects<\/td><\/tr><tr><td>Created because<\/td><td>you need something executed<\/td><td>you have state to protect<\/td><\/tr><tr><td>Guarantees<\/td><td>nothing about your data<\/td><td>one access at a time<\/td><\/tr><tr><td>Runs on<\/td><td>a core<\/td><td>whatever pool thread is free<\/td><\/tr><\/tbody><\/table><\/div><p><strong>The one sentence:<\/strong> <em>a thread is who does the work; an actor is what the work must go through to reach the data.<\/em><\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The clerk is a worker. The counter is a place. The counter doesn't <em>do<\/em> anything — it is the arrangement that forces requests through one at a time. Whoever happens to be free staffs it, and it may be a different person each time. The counter never notices, and the guarantee never depended on who was standing there.<\/p><\/blockquote><h2 id=\"what-an-actor-is-made-of\">What an actor is made of<\/h2><p>Precisely, an actor is two things stuck together — and separating them is what makes chapter 6 make sense.<\/p><p><strong>An isolation domain.<\/strong> A compile-time idea: a named region of state, plus the rule that only code belonging to that region may touch it. This exists entirely in the compiler. It has no runtime existence; it is checked and then erased.<\/p><p><strong>A serial executor.<\/strong> A runtime object that accepts jobs and runs them one at a time. The thing that turns the compile-time promise into actual behaviour.<\/p><p>The split matters because the halves are independent. The domain says <em>who may touch this state<\/em>. The executor says <em>where the work runs<\/em>. Chapter 6 is entirely about what happens when people assume those are one question.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0392 formalises this. Every actor has an <code>unownedExecutor<\/code> — by default a fresh serial executor, but you can supply your own. Two different actors can be given the <em>same<\/em> executor and both remain correctly isolated from each other, because isolation is a compile-time property of the types, not of which executor they share. That is the cleanest available proof that isolation and execution are different things.<\/p><\/blockquote><h2 id=\"actor-versus-serial-queue\">Actor versus serial queue<\/h2><p>The closest older tool is a serial <code><span class=\"t-typ\">DispatchQueue<\/span><\/code>. Both give one-at-a-time access. They differ in what happens when someone has to wait — which is exactly the theme of chapter 2.<\/p><div class=\"scroll\"><table><thead><tr><th><\/th><th>Serial DispatchQueue<\/th><th>Actor<\/th><\/tr><\/thead><tbody><tr><td>Nobody's using it<\/td><td>dispatches to a thread — a context switch<\/td><td>current thread hops straight in, ~a function call<\/td><\/tr><tr><td>Someone's using it<\/td><td><strong>blocks the calling thread<\/strong><\/td><td><strong>suspends the caller<\/strong>, frees the thread<\/td><\/tr><tr><td>Blocked callers<\/td><td>occupy threads → thread explosion<\/td><td>none — nothing blocks<\/td><\/tr><tr><td>Order of work<\/td><td>strictly FIFO<\/td><td>not guaranteed FIFO<\/td><\/tr><tr><td>High-priority work stuck behind low<\/td><td>yes — priority inversion<\/td><td>no — can be run ahead<\/td><\/tr><\/tbody><\/table><\/div><p>That last row is worth understanding rather than memorising. With a serial queue, work runs in arrival order; a high-priority item behind five low-priority ones waits for all five. The old workaround was to boost the priority of everything ahead of it, which makes the five finish sooner but doesn't change that they must finish first. An actor isn't FIFO: pending work can be reordered, so the important item can go next.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A one-at-a-time window where waiting customers stand in line, versus one where you drop off a slip and go do something else. With the line, an urgent request behind five routine ones waits for all five, no matter how urgent. With slips, the urgent one can be pulled forward.<\/p><\/blockquote><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0306 states plainly that \"tasks awaiting an actor are not guaranteed to be run in the same order they originally awaited that actor.\" Non-FIFO isn't sloppiness — it is the mechanism that solves priority inversion, and it is why an actor is not a drop-in replacement for a serial queue in code that silently depended on ordering.<\/p><\/blockquote><h2 id=\"hopping-between-actors-is-cheap\">Hopping between actors is cheap<\/h2><p>When code on actor A calls actor B and B is free, no thread changes and the OS is not involved — the runtime suspends A's work item and starts B's on the same thread. Apple: <em>\"the thread did not block while hopping actors… hopping did not require a different thread.\"<\/em> The cost is close to a function call.<\/p><p>When B is busy the caller is suspended and the thread goes off to do other work. Still no blocking.<\/p><p>Compare with a serial queue, where \"busy\" means the calling thread waits — which is where thread explosion came from.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>If the back room is free, the clerk you are already talking to simply walks through — no new person, no handover. If it is busy, you leave your slip and go; nobody stands waiting.<\/p><\/blockquote>", "text": "chapter 3 solved too many threads . it did nothing about shared data . that is this chapter. what an actor is an actor is a thing that owns some data and is the only route to it. swift actor bankaccount { private var balance: decimal = 0 func deposit(_ amount: decimal) { balance += amount } func currentbalance() decimal { balance } } from outside you cannot touch balance . you can only ask the actor to do something, and asking costs an await : swift let account = bankaccount() await account.deposit(100) let b = await account.currentbalance() two callers can never be inside the actor at the same moment, so balance += 100 cannot lose an increment. that safety is structural — there is no other route to the data — rather than a rule everyone has to remember. this is the difference between an actor and a lock, and it is the entire point. in the office. take the cabinet out of the open office. put it in a back room, with a counter and a clerk in front of it. now nobody can reach the cabinet — not \"shouldn't\", can't, there is a wall. you write your request, hand it across, and wait your turn. two people can no longer spoil the same page because neither of them ever touches it. under the hood. se 0306 defines an actor as \"a reference type that protects access to its mutable state.\" cross actor access is permitted in exactly two forms: reading an immutable let within the same module, or an asynchronous call. everything else is a compile error, not a convention. how is an actor different from a thread? this is the most common point of confusion, and the reason is that the question quietly assumes they are the same kind of thing. they are not. a thread is a worker. it executes . it has a stack, the os schedules it onto a core, and while it runs it consumes a core. an actor is a protected area around data. it does not execute anything. it has no stack. the os has never heard of it. it is not scheduled onto a core, because it isn't the sort of thing that runs. asking how an actor differs from a thread is like asking how a bank vault differs from a bank teller. one is a worker, the other is a protected place workers must go through. they are not alternatives — a real system has both. so what runs an actor's code? a thread from the tion domain. a compile time idea: a named region of state, plus the rule that only code belonging to that region may touch it. this exists entirely in the compiler. it has no runtime existence; it is checked and then erased. a serial executor. a runtime object that accepts jobs and runs them one at a time. the thing that turns the compile time promise into actual behaviour. the split matters because the halves are independent. the domain says who may touch this state . the executor says where the work runs . chapter 6 is entirely about what happens when people assume those are one question. under the hood. se 0392 formalises this. every actor has an unownedexecutor — by default a fresh serial executor, but you can supply your own. two different actors can be given the same executor and both remain correctly isolated from each other, because isolation is a compile time property of the types, not of which executor they share. that is the cleanest available proof that isolation and execution are different things. actor versus serial queue the closest older tool is a serial dispatchqueue . both give one at a time access. they differ in what happens when someone has to wait — which is exactly the theme of chapter 2. serial dispatchqueue actor nobody's using it dispatches to a thread — a context switch current thread hops straight in, ~a function call someone's using it blocks the calling thread suspends the caller , frees the thread blocked callers occupy threads → thread explosion none — nothing blocks order of work strictly fifo not guaranteed fifo high priority work stuck behind low yes — priority inversion no — can be run ahead that last row is worth understanding rather than memorising. with a serial queue, work runs in arrival order; a high priority item behind five low priority ones waits for all five. the old workaround was to boost the priority of everything ahead of it, which makes the five finish sooner but doesn't change that they must finish first. an actor isn't fifo: pending work can be reordered, so the important item can go next. in the office. a one at a time window where waiting customers stand in line, versus one where you drop off a slip and go do something else. with the line, an urgent request behind five routine ones waits for all five, no matter how urgent. with slips, the urgent one can be pulled forward. under the hood. se 0306 states plainly that \"tasks awaiting an actor are not guaranteed to be run in the same order they originally awaited that actor.\" non fifo isn't sloppiness — it is the mechanism that solves priority inversion, and it is why an actor is not a drop in replacement for a serial queue in code that silently depended on ordering. hopping between actors is cheap when code on actor a calls actor b and b is free, no thread changes and the os is not involved — the runtime suspends a's work item and starts b's on the same thread. apple: \"the thread did not block while hopping actors… hopping did not require a different thread.\" the cost is close to a function call. when b is busy the caller is suspended and the thread goes off to do other work. still no blocking. compare with a serial queue, where \"busy\" means the calling thread waits — which is where thread explosion came from. in the office. if the back room is free, the clerk you are already talking to simply walks through — no new person, no handover. if it is busy, you leave your slip and go; nobody stands waiting. ", "outline": [{"a": "what-an-actor-is", "t": "What an actor is"}, {"a": "how-is-an-actor-different-from-a-thread", "t": "How is an actor different from a thread?"}, {"a": "what-an-actor-is-made-of", "t": "What an actor is made of"}, {"a": "actor-versus-serial-queue", "t": "Actor versus serial queue"}, {"a": "hopping-between-actors-is-cheap", "t": "Hopping between actors is cheap"}]}, {"slug": "reentrancy", "title": "Reentrancy", "summary": "The honest limitation — an actor stops data races, not the world moving while you wait.", "minutes": "7", "sources": [{"ref": "SE-0306", "label": "Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0306-actors.md"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<p>This is the chapter that separates people who have used actors from people who have read about them. It gets its own chapter because it is also the most-asked senior interview question in the whole area.<\/p><h2 id=\"the-guarantee-and-its-edge\">The guarantee, and its edge<\/h2><p>An actor guarantees that two pieces of code are never inside it <em>simultaneously<\/em>.<\/p><p>It does <strong>not<\/strong> guarantee that one piece of code runs start to finish without anyone else getting in.<\/p><p>Because when code inside an actor hits an <code><span class=\"t-kw\">await<\/span><\/code>, it is put down. The actor is released. Someone else gets in. When your work resumes, the world has moved.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">ImageLoader<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">var<\/span> cache: [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Data<\/span>] = [:]\n\n    <span class=\"t-kw\">func<\/span> data(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Data<\/span> {\n        <span class=\"t-kw\">if<\/span> <span class=\"t-kw\">let<\/span> cached = cache[url] { <span class=\"t-kw\">return<\/span> cached }       <span class=\"t-com\">// A: not there<\/span>\n        <span class=\"t-kw\">let<\/span> data = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> download(url)                 <span class=\"t-com\">// actor released here<\/span>\n        cache[url] = data\n        <span class=\"t-kw\">return<\/span> data\n    }\n}<\/code><\/pre><\/div><p>Two callers ask for the same image at the same time. Both reach A, both find nothing, both download, both store.<\/p><p><strong>No data race. No crash. Nothing corrupted. Two downloads.<\/strong><\/p><p>Doubled bandwidth, doubled cost, and every tool you own says the code is safe — because it is safe. It is just wrong.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>The clerk has to phone a supplier about your request. Rather than making the whole queue wait ten minutes, he sets your slip aside and serves the next person — which is the good design, and is also the catch. While your slip was aside, other requests went through. The record you checked before the call may not say the same thing after it.<\/p><\/blockquote><h2 id=\"the-single-threaded-illusion\">The single-threaded illusion<\/h2><p>Apple's name for what an actor provides is the <strong>single-threaded illusion<\/strong>: no two functions ever run <em>concurrently<\/em> on an actor, but they may <strong>interleave<\/strong> at suspension points.<\/p><p>Interleaving is a feature, not a defect. It is what prevents deadlock, what frees the thread instead of blocking it, and what lets high-priority work jump the queue. Reentrancy is the bill for all three.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>SE-0306 chose reentrancy deliberately over the alternative. A non-reentrant actor — one that refuses new work while any call is suspended — deadlocks the moment two actors await each other, and reintroduces exactly the priority inversion that chapter 4 showed actors solving. The proposal's framing is that reentrancy trades a hard failure (deadlock) for a soft one (invariants needing re-validation), and the soft one is at least fixable in your own code.<\/p><\/blockquote><h2 id=\"the-fix\">The fix<\/h2><p>Never a bigger lock. A lock changes nothing here, because the two callers were never simultaneous — the problem is a gap in time, not simultaneous access.<\/p><p>The fix is to record that work is <strong>already in flight<\/strong>, and to record it <strong>before<\/strong> suspending:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">ImageLoader<\/span> {\n\n    <span class=\"t-com\">// MARK: - Publics<\/span>\n\n    <span class=\"t-kw\">func<\/span> data(<span class=\"t-kw\">for<\/span> url: <span class=\"t-typ\">URL<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">Data<\/span> {\n        <span class=\"t-kw\">switch<\/span> cache[url] {\n        <span class=\"t-kw\">case<\/span> .ready(<span class=\"t-kw\">let<\/span> data):\n            <span class=\"t-kw\">return<\/span> data\n        <span class=\"t-kw\">case<\/span> .inFlight(<span class=\"t-kw\">let<\/span> task):\n            <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> task.value          <span class=\"t-com\">// join the existing download<\/span>\n        <span class=\"t-kw\">case<\/span> <span class=\"t-kw\">nil<\/span>:\n            <span class=\"t-kw\">break<\/span>\n        }\n\n        <span class=\"t-kw\">let<\/span> task = <span class=\"t-typ\">Task<\/span> { <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> <span class=\"t-kw\">self<\/span>.download(url) }\n        cache[url] = .inFlight(task)             <span class=\"t-com\">// ← before any await. No window exists.<\/span>\n\n        <span class=\"t-kw\">do<\/span> {\n            <span class=\"t-kw\">let<\/span> data = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> task.value\n            cache[url] = .ready(data)\n            <span class=\"t-kw\">return<\/span> data\n        } <span class=\"t-kw\">catch<\/span> {\n            cache[url] = <span class=\"t-kw\">nil<\/span>                     <span class=\"t-com\">// do
