counter. a photocopy is fine — you each end up with your own, and neither can spoil the other's. a key to a room you also hold a key to is not fine: you have handed the problem straight through the wall, and the counter did nothing for you. the four cases value types — free. swift struct money { // implicitly sendable, no annotation let amount: decimal var currency: string // var is fine — each holder has its own copy } immutable final class — declare it, the compiler verifies. swift final class config: sendable { let apikey: string // every stored property must be let let timeout: timeinterval // and every type must itself be sendable } swift infers sendable for structs and enums, never for classes. you state it; it checks you. mutable class — refused. swift final class counter: sendable { // error: stored property 'value' is mutable var value = 0 } refused because the property can be mutated, not because anything does. let versus var only matters for classes; for a struct it is irrelevant, because copying already solved the problem. protection the compiler can't see — @unchecked . swift final class imagestore: @unchecked sendable { private let lock = nslock() private var images: [url: data] = [:] func image(for url: url) data? { lock.lock(); defer { lock.unlock() } return images[url] } } a promise, not a proof. the obvious follow up is how do you know? , and the only honest answers are \"there is a lock\", \"it is immutable in practice\", or \"one task drives it, and here is where that is written down.\" the trap that catches everyone a container is only as safe as its contents. swift struct userprofile: sendable { // error — and it points at avatar let name: string let avatar: imagebuffer // a non sendable class } it is a struct, everything is let , and it still fails. copying the struct copies the reference to the buffer, not the buffer. you handed over a key and called it a photocopy. two jobs, one keyword this is the distinction that separates people who understand sendable from people who have memorised it. job checked rescued by region isolation? a value crossing a boundary at a call site by dataflow yes — a disconnected value can cross without conforming a conformance requirement ( protocol p: sendable , a sendable struct's properties) on the declaration no — there is no dataflow to analyse that is why removing & sendable from a return type sometimes compiles and removing : sendable from a protocol never does. under the hood. se 0414 (region based isolation) lets the compiler track which values can reach which others and prove a value is disconnected — nothing outside this region can still reach it. a disconnected non sendable value can safely cross, because after the transfer the sender provably cannot touch it. se 0430 ( sending ) carries that fact across a function signature. region analysis is intraprocedural: at a call site the compiler knows only the signature , not the callee's body. so a function returning a bare non sendable value is assumed to be handing back something possibly still in its own region, and the transfer is rejected. sending t is the callee promising the result is disconnected, verified inside the callee. choosing between them: a sendable bound when the type genuinely is safe to share — checked once, at the type. sending when the type isn't sendable but this particular value is exclusively owned — checked at every implementation of the signature, which is a larger maintenance surface. why it goes on a protocol sendable is transitive. anything storing an any httpclienttype needs that type to be sendable in order to be sendable itself. leave it off the contract and every holder becomes non sendable , and it spreads outward through the app. you cannot add it cheaply later, which is why it belongs on the job description written at the start rather than on any particular implementation. the bit most people miss sendable is only ever checked at a crossing. a mutable class used entirely within one domain never needs it. it is not a verdict on whether a type is well written — it is a question asked at a specific boundary, about a specific value, at a specific moment. which is why \"why does this need to be sendable ?\" has the answer \"because it crosses here — and if i move that line, it doesn't.\" ", "outline": [{"a": "the-whole-idea-in-one-question", "t": "The whole idea in one question"}, {"a": "the-four-cases", "t": "The four cases"}, {"a": "the-trap-that-catches-everyone", "t": "The trap that catches everyone"}, {"a": "two-jobs-one-keyword", "t": "Two jobs, one keyword"}, {"a": "why-it-goes-on-a-protocol", "t": "Why it goes on a protocol"}, {"a": "the-bit-most-people-miss", "t": "The bit most people miss"}]}, {"slug": "structured-concurrency-and-cancellation", "title": "Structured concurrency and cancellation", "summary": "Child tasks that cannot outlive their parent, and why cancellation is a flag rather than a kill.", "minutes": "7", "sources": [{"ref": "SE-0304", "label": "Structured concurrency", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0304-structured-concurrency.md"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<h2 id=\"tasks-that-own-other-tasks\">Tasks that own other tasks<\/h2><p>A job often needs several things at once. You can create child tasks, and the system's rule about them is the valuable part: <strong>a parent cannot return before its children have finished.<\/strong><\/p><p>Sequential — three round trips, one after another:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">let<\/span> profile  = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetchProfile(id)\n<span class=\"t-kw\">let<\/span> settings = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetchSettings(id)\n<span class=\"t-kw\">let<\/span> badges   = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> fetchBadges(id)<\/code><\/pre><\/div><p>Concurrent, a fixed number of known children:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span> profile  = fetchProfile(id)\n<span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span> settings = fetchSettings(id)\n<span class=\"t-kw\">async<\/span> <span class=\"t-kw\">let<\/span> badges   = fetchBadges(id)\n\n<span class=\"t-kw\">let<\/span> screen = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> <span class=\"t-typ\">Screen<\/span>(profile: profile, settings: settings, badges: badges)<\/code><\/pre><\/div><p>Concurrent, a number decided at runtime:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> thumbnails(<span class=\"t-kw\">for<\/span> urls: [<span class=\"t-typ\">URL<\/span>]) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; [<span class=\"t-typ\">URL<\/span>: <span class=\"t-typ\">Image<\/span>] {\n    <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> withThrowingTaskGroup(of: (<span class=\"t-typ\">URL<\/span>, <span class=\"t-typ\">Image<\/span>).<span class=\"t-kw\">self<\/span>) { group <span class=\"t-kw\">in<\/span>\n        <span class=\"t-kw\">for<\/span> url <span class=\"t-kw\">in<\/span> urls {\n            group.addTask { (url, <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> <span class=\"t-kw\">self<\/span>.thumbnail(<span class=\"t-kw\">for<\/span>: url)) }\n        }\n        <span class=\"t-kw\">return<\/span> <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> group.reduce(into: [:]) { $<span class=\"t-num\">0<\/span>[$<span class=\"t-num\">1.0<\/span>] = $<span class=\"t-num\">1.1<\/span> }\n    }\n}<\/code><\/pre><\/div><p><strong>What the parent-waits rule buys you.<\/strong> Under the old model you sent someone off to do a task and carried on — and if you finished first, or gave up, or the screen closed, that work was still out there. Nobody tracked it. It came back hours later with a result for a job that no longer existed, or held resources nothing could reclaim.<\/p><p>With structured concurrency that cannot happen. Children have a lifetime bounded by their parent's. Cancel the parent and every child is cancelled. If a child throws, the parent hears about it. Nothing is orphaned.<\/p><p>This is the quiet reason the new model produces less mess than the old one, quite apart from the data-race question.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>A job that needs three sub-jobs writes three more slips and hands them out — but is not allowed to leave for the day until all three come back. Nobody goes home leaving work outstanding that nobody is tracking.<\/p><\/blockquote><h2 id=\"task-and-the-escape-hatch\"><code><span class=\"t-typ\">Task<\/span> { }<\/code> and the escape hatch<\/h2><p><code><span class=\"t-typ\">Task<\/span> { }<\/code> is <em>unstructured<\/em> — it outlives the scope that created it and nobody waits for it — but it <strong>inherits the enclosing actor isolation, priority and task-local values<\/strong>:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-atr\">@MainActor<\/span>\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">FeedViewModel<\/span> {\n    <span class=\"t-kw\">private<\/span>(<span class=\"t-kw\">set<\/span>) <span class=\"t-kw\">var<\/span> items: [<span class=\"t-typ\">Item<\/span>] = []\n\n    <span class=\"t-kw\">func<\/span> refresh() {\n        <span class=\"t-typ\">Task<\/span> {                                  <span class=\"t-com\">// inherits @MainActor<\/span>\n            items = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> loader.load()     <span class=\"t-com\">// no MainActor.run needed<\/span>\n        }\n    }\n}<\/code><\/pre><\/div><p><code><span class=\"t-typ\">Task<\/span>.detached { }<\/code> inherits <strong>nothing<\/strong> — no actor, no priority, no task-locals, and nothing cancels it. The number of legitimate uses in an app codebase is close to zero. Reaching for it because \"this shouldn't block the UI\" is the classic misuse; the tool for that is <code><span class=\"t-atr\">@concurrent<\/span><\/code>, which keeps priority and cancellation.<\/p><h2 id=\"cancellation-is-cooperative\">Cancellation is cooperative<\/h2><p>You cannot kill a task mid-work. Cutting it off halfway would leave state half-written, which is worse than letting it finish.<\/p><p>So cancellation sets a <strong>flag<\/strong>. Something marks the task cancelled; the work notices <em>between steps<\/em> and stops.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> process(_ items: [<span class=\"t-typ\">Item<\/span>]) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; [<span class=\"t-typ\">Result<\/span>] {\n    <span class=\"t-kw\">var<\/span> results: [<span class=\"t-typ\">Result<\/span>] = []\n    <span class=\"t-kw\">for<\/span> item <span class=\"t-kw\">in<\/span> items {\n        <span class=\"t-kw\">try<\/span> <span class=\"t-typ\">Task<\/span>.checkCancellation()      <span class=\"t-com\">// throws CancellationError<\/span>\n        results.append(expensiveWork(item))\n    }\n    <span class=\"t-kw\">return<\/span> results\n}<\/code><\/pre><\/div><p>Two ways to observe it:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">try<\/span> <span class=\"t-typ\">Task<\/span>.checkCancellation()   <span class=\"t-com\">// throws — use in a throwing context<\/span>\n<span class=\"t-kw\">if<\/span> <span class=\"t-typ\">Task<\/span>.isCancelled { <span class=\"t-kw\">return<\/span> } <span class=\"t-com\">// boolean — use when returning partial work<\/span><\/code><\/pre><\/div><p>In SwiftUI, <code>.task<\/code> cancels for you when the view disappears:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code>.task(id: query) {              <span class=\"t-com\">// cancels the previous one when query changes<\/span>\n    <span class=\"t-kw\">await<\/span> viewModel.search(query)\n}<\/code><\/pre><\/div><p><strong>The consequence, exactly:<\/strong> work that never checks the flag never stops. A thirty-second loop with no check runs for its full thirty seconds after the user has left the screen, holding memory and burning battery, and no amount of <code>cancel()<\/code> at the call site changes that.<\/p><p><code>cancel()<\/code> does not stop anything. It marks the task and every child as cancelled. Built-in suspension points — <code><span class=\"t-typ\">Task<\/span>.sleep<\/code>, <code><span class=\"t-typ\">URLSession<\/span><\/code>'s async methods — throw when they notice. Your own CPU loops notice nothing unless you ask.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the office<\/p><p>You cannot snatch paperwork out of someone's hands mid-sentence. You stamp the slip <em>no longer needed<\/em>. The worker sees the stamp between steps, tidies up and stops. A worker who never looks up finishes the whole job regardless.<\/p><\/blockquote><p><strong>The trap:<\/strong> <code><span class=\"t-kw\">try<\/span>? <span class=\"t-kw\">await<\/span> <span class=\"t-typ\">Task<\/span>.sleep(...)<\/code> swallows the <code><span class=\"t-typ\">CancellationError<\/span><\/code>, so execution continues into whatever came next. If you use <code><span class=\"t-kw\">try<\/span>?<\/code>, follow it with an explicit <code><span class=\"t-kw\">guard<\/span> !<span class=\"t-typ\">Task<\/span>.isCancelled <span class=\"t-kw\">else<\/span> { <span class=\"t-kw\">return<\/span> }<\/code>.<\/p><p><strong>In a review, the question that separates people:<\/strong> <em>where do you check for cancellation?<\/em> A long synchronous loop with no check is not cancellable, whatever the paperwork says.<\/p><h2 id=\"bounding-the-width\">Bounding the width<\/h2><p>A task group with a thousand <code>addTask<\/code> calls will happily start a thousand children. If each holds a decoded image you have a memory problem, not a concurrency one:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-com\">// keep at most `limit` in flight<\/span>\n<span class=\"t-kw\">for<\/span> url <span class=\"t-kw\">in<\/span> urls {\n    <span class=\"t-kw\">if<\/span> inFlight &gt;= limit { _ = <span class=\"t-kw\">try<\/span> <span class=\"t-kw\">await<\/span> group.next(); inFlight -= <span class=\"t-num\">1<\/span> }\n    group.addTask { /* … */ }; inFlight += <span class=\"t-num\">1<\/span>\n}<\/code><\/pre><\/div><p>Structured concurrency bounds <em>lifetime<\/em>. It does not bound <em>width<\/em> — that is yours.<\/p>", "text": " tasks that own other tasks a job often needs several things at once. you can create child tasks, and the system's rule about them is the valuable part: a parent cannot return before its children have finished. sequential — three round trips, one after another: swift let profile = try await fetchprofile(id) let settings = try await fetchsettings(id) let badges = try await fetchbadges(id) concurrent, a fixed number of known children: swift async let profile = fetchprofile(id) async let settings = fetchsettings(id) async let badges = fetchbadges(id) let screen = try await screen(profile: profile, settings: settings, badges: badges) concurrent, a number decided at runtime: swift func thumbnails(for urls: [url]) async throws [url: image] { try await withthrowingtaskgroup(of: (url, image).self) { group in for url in urls { group.addtask { (url, try await self.thumbnail(for: url)) } } return try await group.reduce(into: [:]) { $0[$1.0] = $1.1 } } } what the parent waits rule buys you. under the old model you sent someone off to do a task and carried on — and if you finished first, or gave up, or the screen closed, that work was still out there. nobody tracked it. it came back hours later with a result for a job that no longer existed, or held resources nothing could reclaim. with structured concurrency that cannot happen. children have a lifetime bounded by their parent's. cancel the parent and every child is cancelled. if a child throws, the parent hears about it. nothing is orphaned. this is the quiet reason the new model produces less mess than the old one, quite apart from the data race question. in the office. a job that needs three sub jobs writes three more slips and hands them out — but is not allowed to leave for the day until all three come back. nobody goes home leaving work outstanding that nobody is tracking. task { } and the escape hatch task { } is unstructured — it outlives the scope that created it and nobody waits for it — but it inherits the enclosing actor isolation, priority and task local values : swift @mainactor final class feedviewmodel { private(set) var items: [item] = [] func refresh() { task { // inherits @mainactor items = try await loader.load() // no mainactor.run needed } } } task.detached { } inherits nothing — no actor, no priority, no task locals, and nothing cancels it. the number of legitimate uses in an app codebase is close to zero. reaching for it because \"this shouldn't block the ui\" is the classic misuse; the tool for that is @concurrent , which keeps priority and cancellation. cancellation is cooperative you cannot kill a task mid work. cutting it off halfway would leave state half written, which is worse than letting it finish. so cancellation sets a flag . something marks the task cancelled; the work notices between steps and stops. swift func process(_ items: [item]) async throws [result] { var results: [result] = [] for item in items { try task.checkcancellation() // throws cancellationerror results.append(expensivework(item)) } return results } two ways to observe it: swift try task.checkcancellation() // throws — use in a throwing context if task.iscancelled { return } // boolean — use when returning partial work in swiftui, .task cancels for you when the view disappears: swift .task(id: query) { // cancels the previous one when query changes await viewmodel.search(query) } the consequence, exactly: work that never checks the flag never stops. a thirty second loop with no check runs for its full thirty seconds after the user has left the screen, holding memory and burning battery, and no amount of cancel() at the call site changes that. cancel() does not stop anything. it marks the task and every child as cancelled. built in suspension points — task.sleep , urlsession 's async methods — throw when they notice. your own cpu loops notice nothing unless you ask. in the office. you cannot snatch paperwork out of someone's hands mid sentence. you stamp the slip no longer needed . the worker sees the stamp between steps, tidies up and stops. a worker who never looks up finishes the whole job regardless. the trap: try? await task.sleep(...) swallows the cancellationerror , so execution continues into whatever came next. if you use try? , follow it with an explicit guard !task.iscancelled else { return } . in a review, the question that separates people: where do you check for cancellation? a long synchronous loop with no check is not cancellable, whatever the paperwork says. bounding the width a task group with a thousand addtask calls will happily start a thousand children. if each holds a decoded image you have a memory problem, not a concurrency one: swift // keep at most limit in flight for url in urls { if inflight = limit { _ = try await group.next(); inflight = 1 } group.addtask { / … / }; inflight += 1 } structured concurrency bounds lifetime . it does not bound width — that is yours. ", "outline": [{"a": "tasks-that-own-other-tasks", "t": "Tasks that own other tasks"}, {"a": "task-and-the-escape-hatch", "t": "Task { } and the escape hatch"}, {"a": "cancellation-is-cooperative", "t": "Cancellation is cooperative"}, {"a": "bounding-the-width", "t": "Bounding the width"}]}, {"slug": "decision-guide", "title": "The decision guide", "summary": "Apple's ladder, the full map, and the questions to answer out loud.", "minutes": "6", "sources": [{"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}], "html": "<h2 id=\"the-ladder-apple-actually-recommends\">The ladder Apple actually recommends<\/h2><p>Not \"use concurrency\". A sequence — and you stop as soon as the problem is solved.<\/p><p><strong>Step 0 — everything on the main actor.<\/strong><\/p><blockquote class=\"aside plain\"><p>\"Your apps should start by running all of their code on the main thread… Many apps only need to use concurrency sparingly, and some don't need concurrency at all.\"<\/p><\/blockquote><p>No shared state means no data races, and the fastest correct program is the one that never left one domain.<\/p><p><strong>Step 1 — <code><span class=\"t-kw\">async<\/span><\/code> for waiting.<\/strong> The screen freezes during a network call. Make it <code><span class=\"t-kw\">async<\/span><\/code> and <code><span class=\"t-kw\">await<\/span><\/code> it. The main thread is released during the wait and picks the work back up when the answer arrives. No extra threads, no new domain, no new failure modes. This solves the large majority of real responsiveness problems.<\/p><p><strong>Step 2 — <code><span class=\"t-atr\">@concurrent<\/span><\/code> for measured work.<\/strong> Still stuttering, and Instruments shows real CPU time on the main thread — a big decode, a resize, an inference pass. Move that one function off. Profile first; the hop costs two context switches, and paying that to save nothing is a regression.<\/p><p><strong>Step 3 — an actor for shared non-UI state.<\/strong> Only once several concurrent things genuinely share state that isn't UI state: a cache, a connection pool, a token store. Apple's trigger:<\/p><blockquote class=\"aside plain\"><p>\"Use actors when you find that storing data on the main actor is causing too much code to run on the main thread.\"<\/p><\/blockquote><p><strong>The error to avoid<\/strong> is skipping to step 3 because actors are the interesting part. An actor around a stateless service serialises it for no benefit; <code><span class=\"t-atr\">@concurrent<\/span><\/code> on a small decode is a straight loss.<\/p><h2 id=\"the-isolation-cheat-sheet\">The isolation cheat sheet<\/h2><div class=\"scroll\"><table><thead><tr><th>Spelling<\/th><th>Where it runs<\/th><th>When<\/th><\/tr><\/thead><tbody><tr><td><code><span class=\"t-kw\">func<\/span> f()<\/code> in a <code><span class=\"t-atr\">@MainActor<\/span><\/code> type<\/td><td>main actor<\/td><td>UI state, view models<\/td><\/tr><tr><td><code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">func<\/span> f()<\/code><\/td><td>caller's context, synchronously<\/td><td>pure functions inside an isolated type<\/td><\/tr><tr><td><code><span class=\"t-kw\">func<\/span> f() <span class=\"t-kw\">async<\/span><\/code> (nonisolated)<\/td><td><strong>caller's actor<\/strong> (SE-0461)<\/td><td>the normal case for async work<\/td><\/tr><tr><td><code><span class=\"t-kw\">nonisolated<\/span>(nonsending) <span class=\"t-kw\">func<\/span> f() <span class=\"t-kw\">async<\/span><\/code><\/td><td>same — explicit spelling<\/td><td>when you want it stated regardless of flags<\/td><\/tr><tr><td><code><span class=\"t-atr\">@concurrent<\/span> <span class=\"t-kw\">func<\/span> f() <span class=\"t-kw\">async<\/span><\/code><\/td><td>global executor, always<\/td><td><strong>measured<\/strong> CPU work only<\/td><\/tr><tr><td><code><span class=\"t-kw\">actor<\/span> <span class=\"t-typ\">A<\/span> { <span class=\"t-kw\">func<\/span> f() }<\/code><\/td><td>A's executor, serially<\/td><td>genuinely shared mutable state<\/td><\/tr><tr><td><code><span class=\"t-typ\">Task<\/span> { }<\/code><\/td><td>inherits caller's actor<\/td><td>fire-off work from isolated code<\/td><\/tr><tr><td><code><span class=\"t-typ\">Task<\/span>.detached { }<\/code><\/td><td>nothing inherited<\/td><td>almost never<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"the-full-map\">The full map<\/h2><div class=\"scroll\"><table><thead><tr><th>In the office<\/th><th>Real name<\/th><th>What it is<\/th><th>Where it lives<\/th><\/tr><\/thead><tbody><tr><td>A desk<\/td><td>Core<\/td><td>hardware that executes instructions<\/td><td>the chip<\/td><\/tr><tr><td>A worker<\/td><td>Thread<\/td><td>a worker with a stack, scheduled by the OS<\/td><td>the OS<\/td><\/tr><tr><td>The permanent staff, one per desk<\/td><td>Cooperative pool<\/td><td>every thread Swift concurrency has<\/td><td>the runtime<\/td><\/tr><tr><td>A slip of paper in the tray<\/td><td>Task<\/td><td>a unit of work, not a worker<\/td><td>the heap<\/td><\/tr><tr><td>A slip set aside with a bookmark<\/td><td>Continuation<\/td><td>a suspended task's saved state<\/td><td>the heap<\/td><\/tr><tr><td>The marked point where a slip may be set down<\/td><td><code><span class=\"t-kw\">await<\/span><\/code><\/td><td>a point where work may be put down<\/td><td>compile + runtime<\/td><\/tr><tr><td>The rulebook: who may touch which records<\/td><td>Isolation domain<\/td><td>a region of state and who may touch it<\/td><td><strong>compile time only<\/strong><\/td><\/tr><tr><td>A back room with a counter in front<\/td><td>Actor<\/td><td>an isolation domain + a serial executor<\/td><td>both<\/td><\/tr><tr><td>The counter and its queue<\/td><td>Executor<\/td><td>runs jobs, one at a time for an actor<\/td><td>the runtime<\/td><\/tr><tr><td>The one counter facing the customers<\/td><td><code><span class=\"t-atr\">@MainActor<\/span><\/code><\/td><td>the global domain backed by the main thread<\/td><td>both<\/td><\/tr><tr><td>Work that touches no records<\/td><td><code><span class=\"t-kw\">nonisolated<\/span><\/code><\/td><td>belongs to no domain<\/td><td>compile time<\/td><\/tr><tr><td>Sending a job to the back office<\/td><td><code><span class=\"t-atr\">@concurrent<\/span><\/code><\/td><td>always run on the pool<\/td><td>both<\/td><\/tr><tr><td>A photocopy rather than a key<\/td><td><code><span class=\"t-typ\">Sendable<\/span><\/code><\/td><td>safe to carry across a boundary<\/td><td><strong>compile time only<\/strong><\/td><\/tr><tr><td>Two workers writing the same page<\/td><td>Data race<\/td><td>what the whole system exists to prevent<\/td><td>—<\/td><\/tr><tr><td>Hiring more staff who all stand on hold<\/td><td>Thread explosion<\/td><td>GCD's failure mode<\/td><td>—<\/td><\/tr><tr><td>The clerk taking a phone call mid-request<\/td><td>Actor reentrancy<\/td><td>the world moves while you're suspended<\/td><td>—<\/td><\/tr><tr><td>Standing in the office ≠ being authorised<\/td><td>isolation vs thread<\/td><td>the distinction in chapter 6<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"the-four-sentences\">The four sentences<\/h2><p>If everything compresses to anything, it is these.<\/p><p><strong>1. Many tasks, few threads.<\/strong> Tasks are cheap objects; threads are a fixed pool sized to the cores. Threads never block, which is why the pool can stay small.<\/p><p><strong>2. <code><span class=\"t-kw\">await<\/span><\/code> is a suspension point, not a thread switch.<\/strong> It guarantees the thread is released. It guarantees nothing about what is still true when you resume.<\/p><p><strong>3. An actor is not a worker, it's a protected region.<\/strong> It gives mutual exclusion, not thread affinity. Its code runs on whatever pool thread is free.<\/p><p><strong>4. Isolation is compile-time; threads are runtime.<\/strong> <code><span class=\"t-atr\">@MainActor<\/span><\/code> is a domain that happens to be backed by the main thread — which is why you can be on the thread without being in the domain.<\/p><h2 id=\"answer-these-out-loud\">Answer these out loud<\/h2><p>File closed, 90 seconds each, in trade-off shape — the decision, the alternative rejected, the boundary condition.<\/p><ol start=\"1\"><li>Why does a small fixed thread pool work when GCD's growing one didn't?<\/li><li>What does <code><span class=\"t-kw\">await<\/span><\/code> guarantee and what does it not?<\/li><li>What is the difference between an actor and a thread?<\/li><li>An actor and a serial queue both give one-at-a-time access. When does the difference matter?<\/li><li>Two callers ask an actor-backed cache for the same key at once. What happens, and why won't a lock fix it?<\/li><li>Why is <code><span class=\"t-atr\">@MainActor<\/span><\/code> not the same as the main thread? Give two independent reasons.<\/li><li>Why does <code><span class=\"t-typ\">MainActor<\/span>.assumeIsolated<\/code> exist at all?<\/li><li>What changed in Swift 6.2 about <code><span class=\"t-kw\">nonisolated<\/span> <span class=\"t-kw\">async<\/span><\/code>, and what did it break?<\/li><li>When is <code><span class=\"t-atr\">@concurrent<\/span><\/code> justified, and when is it a regression?<\/li><li>When is <code><span class=\"t-typ\">Sendable<\/span><\/code> actually required?<\/li><li>What does structured concurrency guarantee that <code><span class=\"t-typ\">Task<\/span> { }<\/code> does not?<\/li><li>Where in your code do you check for cancellation, and what happens if you don't?<\/li><\/ol>", "text": " the ladder apple actually recommends not \"use concurrency\". a sequence — and you stop as soon as the problem is solved. step 0 — everything on the main actor. \"your apps should start by running all of their code on the main thread… many apps only need to use concurrency sparingly, and some don't need concurrency at all.\" no shared state means no data races, and the fastest correct program is the one that never left one domain. step 1 — async for waiting. the screen freezes during a network call. make it async and await it. the main thread is released during the wait and picks the work back up when the answer arrives. no extra threads, no new domain, no new failure modes. this solves the large majority of real responsiveness problems. step 2 — @concurrent for measured work. still stuttering, and instruments shows real cpu time on the main thread — a big decode, a resize, an inference pass. move that one function off. profile first; the hop costs two context switches, and paying that to save nothing is a regression. step 3 — an actor for shared non ui state. only once several concurrent things genuinely share state that isn't ui state: a cache, a connection pool, a token store. apple's trigger: \"use actors when you find that storing data on the main actor is causing too much code to run on the main thread.\" the error to avoid is skipping to step 3 because actors are the interesting part. an actor around a stateless service serialises it for no benefit; @concurrent on a small decode is a straight loss. the isolation cheat sheet spelling where it runs when func f() in a @mainactor type main actor ui state, view models nonisolated func f() caller's context, synchronously pure functions inside an isolated type func f() async (nonisolated) caller's actor (se 0461) the normal case for async work nonisolated(nonsending) func f() async same — explicit spelling when you want it stated regardless of flags @concurrent func f() async global executor, always measured cpu work only actor a { func f() } a's executor, serially genuinely shared mutable state task { } inherits caller's actor fire off work from isolated code task.detached { } nothing inherited almost never the full map in the office real name what it is where it lives a desk core hardware that executes instructions the chip a worker thread a worker with a stack, scheduled by the os the os the permanent staff, one per desk cooperative pool every thread swift concurrency has the runtime a slip of paper trade off shape — the decision, the alternative rejected, the boundary condition. 1. why does a small fixed thread pool work when gcd's growing one didn't? 2. what does await guarantee and what does it not? 3. what is the difference between an actor and a thread? 4. an actor and a serial queue both give one at a time access. when does the difference matter? 5. two callers ask an actor backed cache for the same key at once. what happens, and why won't a lock fix it? 6. why is @mainactor not the same as the main thread? give two independent reasons. 7. why does mainactor.assumeisolated exist at all? 8. what changed in swift 6.2 about nonisolated async , and what did it break? 9. when is @concurrent justified, and when is it a regression? 10. when is sendable actually required? 11. what does structured concurrency guarantee that task { } does not? 12. where in your code do you check for cancellation, and what happens if you don't? ", "outline": [{"a": "the-ladder-apple-actually-recommends", "t": "The ladder Apple actually recommends"}, {"a": "the-isolation-cheat-sheet", "t": "The isolation cheat sheet"}, {"a": "the-full-map", "t": "The full map"}, {"a": "the-four-sentences", "t": "The four sentences"}, {"a": "answer-these-out-loud", "t": "Answer these out loud"}]}], "minutes": 64, "sources": [{"ref": "WWDC25", "label": "Embracing Swift concurrency", "url": "https://developer.apple.com/videos/play/wwdc2025/268/"}, {"ref": "WWDC21", "label": "Swift concurrency: Behind the scenes", "url": "https://developer.apple.com/videos/play/wwdc2021/10254/"}, {"ref": "", "label": "WWDCNotes · Behind the scenes (transcript detail)", "url": "https://wwdcnotes.com/documentation/wwdc21-10254-swift-concurrency-behind-the-scenes/"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "SE-0306", "label": "Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0306-actors.md"}, {"ref": "SE-0392", "label": "Custom Actor Executors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0392-custom-actor-executors.md"}, {"ref": "SE-0316", "label": "Global Actors", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0316-global-actors.md"}, {"ref": "", "label": "Donny Wals · Setting default actor isolation in Xcode 26", "url": "https://www.donnywals.com/setting-default-actor-isolation-in-xcode-26/"}, {"ref": "", "label": "Malcolm Hall · @MainActor does not always mean main thread (2023, pre-SE-0461)", "url": "https://www.malcolmhall.com/2023/01/31/mainactor-does-not-always-mean-main-thread/"}, {"ref": "SE-0302", "label": "Sendable and @Sendable closures", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0302-concurrent-value-and-concurrent-closures.md"}, {"ref": "SE-0414", "label": "Region based Isolation", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md"}, {"ref": "SE-0430", "label": "sending parameter and result values", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0430-transferring-parameters-and-results.md"}, {"ref": "SE-0304", "label": "Structured concurrency", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0304-structured-concurrency.md"}]}, {"title": "Mobile System Design", "slug": "system-design", "tagline": "Whiteboard questions, answered client-side", "summary": "Fourteen questions as interviewers actually ask them, each with a full answer in the shape a 45-minute round rewards: clarifying questions, scope, the box diagram, the API, two or three deep dives with their trade-offs, and the follow-ups that come after a good answer. Client-side throughout; no backend sharding.", "status": "in progress", "accentIndex": 3, "chapters": [{"slug": "the-shape-of-the-round", "title": "The shape of the round", "summary": "How a session runs as a simulated 45-minute interview, what is graded, and how each question chapter is laid out.", "minutes": "6", "sources": [{"ref": "", "label": "weeeBox · Mobile System Design (the public exercise set and its grading criteria)", "url": "https://github.com/weeeBox/mobile-system-design"}, {"ref": "", "label": "System Design Handbook · Mobile system design interview", "url": "https://www.systemdesignhandbook.com/guides/mobile-system-design-interview/"}, {"ref": "", "label": "ByteByteGo · A framework for mobile system design interviews", "url": "https://bytebytego.com/courses/mobile-system-design-interview/a-framework-for-mobile-sd-interviews"}], "html": "<p>At senior level this is usually the round that decides the outcome, and it is the one where knowing the material and passing come apart most often. What's graded is how you run 45 minutes, out loud, while someone interrupts you.<\/p><p>The chapters are also meant to be <strong>learned from<\/strong>, not only rehearsed: every component comes with an <em>Under the hood<\/em> note explaining the concept behind it (what an actor is, why a cursor beats an offset, what a decoded image costs), so the answer makes sense even the first time through. They're written to be readable by someone who doesn't code, too: each chapter opens with a <strong>Words used in this chapter<\/strong> glossary, the component table describes every part in plain words, and every component starts with an <strong>In plain words<\/strong> line and an everyday comparison before any technical detail. Every <em>Under the hood<\/em> note does the same: plain words first, then <em>the detail<\/em>.<\/p><p>So every question here is written to be <strong>performed, not read<\/strong>. The prompt is at the top; the whole answer is behind collapsed sections, in the order a real round unfolds — including the interviewer's own lines: how they'd answer your clarifying questions, which component they'd pick to go deep on, and what they'd push on next.<\/p><h2 id=\"the-45-minutes\">The 45 minutes<\/h2><div class=\"scroll\"><table><thead><tr><th>Clock<\/th><th>Phase<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td>0:00–0:02<\/td><td>The prompt<\/td><td>You repeat it back and say how you'll spend the time<\/td><\/tr><tr><td>0:02–0:07<\/td><td>Clarify<\/td><td>You ask; they answer; you state your assumptions<\/td><\/tr><tr><td>0:07–0:12<\/td><td>Scope<\/td><td>Out of scope <strong>first<\/strong>, then 3–5 features, then the non-functional ones that matter<\/td><\/tr><tr><td>0:12–0:24<\/td><td>High level<\/td><td>Say the idea · list the components · sketch them · explain each · trace one request<\/td><\/tr><tr><td>0:24–0:40<\/td><td>Deep dives<\/td><td>They pick a component and push<\/td><\/tr><tr><td>0:40–0:45<\/td><td>Follow-ups and recap<\/td><td>Whatever they still want to probe, then the whole design in 60 seconds<\/td><\/tr><\/tbody><\/table><\/div><p>About 30 working minutes. Running out of time before the deep dive is the most common way a strong candidate fails.<\/p><h2 id=\"how-to-run-a-session\">How to run a session<\/h2><ol start=\"1\"><li><strong>Timer on, standing, out loud, sketching<\/strong> on paper or an iPad. Nothing open in front of you.<\/li><li>At each phase boundary, move on whether or not you're finished. That discipline <em>is<\/em> the skill.<\/li><li>When the 35 minutes are up, open the sections one at a time and mark each <strong>clean<\/strong>, <strong>partial<\/strong> or <strong>missed<\/strong>. Then work through the question bank: read each question, answer it out loud, and only then open the answer. Finish with the scorecard section.<\/li><li>Keep the misses somewhere. A section you skip twice is a gap, not an oversight, and the second time is when it is worth reading up on.<\/li><\/ol><h2 id=\"what-is-actually-graded\">What is actually graded<\/h2><p>The public exercise set these prompts are drawn from publishes its criteria, and they are not what candidates expect: clear communication and active listening · thoughtful requirement clarification · practical trade-off analysis · <strong>honestly acknowledging the limits of your knowledge<\/strong> · balancing engineering quality against business timelines.<\/p><p>Read that list again. Only one line is about the design. The rest is about how you behave while producing it. In practice that means:<\/p><p><strong>Scoping out loud.<\/strong> Three features done properly beat eight named. <em>\"Offline editing is out of scope for this pass\"<\/em> is a positive signal.<\/p><p><strong>Trade-offs, not choices.<\/strong> Every box arrives with the alternative you rejected and the condition under which you'd switch.<\/p><p><strong>Staying client-side.<\/strong> The classic failure is drifting into sharding and QPS. You're sizing a cache and reasoning about what happens on the U-Bahn with no signal.<\/p><p><strong>Naming the smaller version.<\/strong> Saying <em>\"for a single screen, <code><span class=\"t-typ\">AsyncImage<\/span><\/code> and <code><span class=\"t-typ\">NSCache<\/span><\/code> are enough — here's when they stop being enough\"<\/em> reads as senior. Building a pipeline for a settings screen does not.<\/p><p><strong>Saying what you don't know<\/strong>, then reasoning about it anyway.<\/p><p><strong>Talking, not coding.<\/strong> A design round doesn't ask you to write code. The furthest it goes is an interface: a protocol, a model's fields, an endpoint. Mechanisms (the load-more guard, request dedupe, an optimistic like) are explained as steps, in words, with a diagram when there's a race. So the chapters do the same: Swift appears only as interfaces, never as an implementation.<\/p><h2 id=\"the-high-level-design-in-the-order-you-say-it\">The high-level design, in the order you say it<\/h2><p>The twelve minutes of high-level design run in the same five steps every time. Each step makes the next one easy to follow, which is what the interviewer is grading.<\/p><ol start=\"1\"><li><strong>Say the idea (1 min).<\/strong> Four sentences in plain words, before any box. If they stop you here, they already know the shape of the answer.<\/li><li><strong>List what you need (2 min).<\/strong> The components, in the order you'll draw them, one job each. Name each by <strong>what it does<\/strong> (\"feed repository\", \"image loader\", \"local storage\"), not by its class name; the public guides interviewers use name components by role for the same reason. Write the list on the side of the board.<\/li><li><strong>Sketch them (4 min).<\/strong> Three frames, one card per item on the list, arrows last.<\/li><li><strong>Explain each one (4 min).<\/strong> Point at each card: what it owns, <strong>its interface<\/strong> (what others can call or read), the choice inside it and the alternative you rejected. This is where \"why MVVM?\" gets answered. Methods never go on the board itself; the public frameworks keep the diagram at the level of roles and bring interfaces in when a component is discussed, and the client↔server API and data models are always asked for.<\/li><li><strong>Trace one request (1 min).<\/strong> One real flow across the cards, so they see them work together.<\/li><\/ol><h2 id=\"keep-the-whiteboard-simple\">Keep the whiteboard simple<\/h2><p>A board with twenty boxes doesn't read as thorough. It reads as someone who can't tell which parts matter, and it eats the minutes the deep dives need. The rules every chapter here follows:<\/p><ul><li><strong>Three layers for an app question.<\/strong> <em>Presentation<\/em> (the view and the view model that owns the screen's state), <em>domain<\/em> (plain models and the protocol the view model depends on), <em>data<\/em> (the implementation that decides between network and disk). No use-case classes at this size: a <code><span class=\"t-typ\">LoadNextPageUseCase<\/span><\/code> that only forwards a call is ceremony, and interviewers read it as such. <strong>Keep the server's models apart from the app's:<\/strong> the API client decodes into DTOs that mirror the JSON, and the repository maps them to domain models (and the saved format to and from them). The domain never sees the server's shape, so a server change touches one DTO and one mapping. A library question (an image loader, an analytics SDK) isn't an app, so it gets three layers of its own instead: <em>API<\/em> (what callers touch), <em>core<\/em> (the coordinator), <em>I/O<\/em> (loaders, caches, codecs).<\/li><li><strong>Each card: the role in bold, the type name underneath.<\/strong> Someone who doesn't know Swift should still be able to read the board.<\/li><li><strong>About seven or eight cards<\/strong>, at most three side by side. Something that lives inside another component (a cache the coordinator owns) is written inside that card. Anything reused from an earlier question is one dashed card, not its insides.<\/li><li><strong>One colour per layer<\/strong>, the same in every chapter and on your own board: blue for presentation or API, purple for domain or core, green for data or I/O, orange for anything that crosses the network, grey and dashed for something reused.<\/li><li><strong>A card earns its place<\/strong> only if you can say in one sentence what it owns that nothing else does.<\/li><li><strong>Arrows show who asks whom, and what comes back.<\/strong> A solid arrow points from the part that asks to the part that answers (also the direction of dependency) and is labelled <strong>request → reply<\/strong> (\"ask for posts → posts\", \"URL → bytes\"), so the data flowing back is on the board too. Show writes as well as reads (\"load · save posts\"). The one dashed arrow is \"implements\". Then the sequence diagram (or, in the room, your one traced request) replays the same flow with the replies drawn as their own arrows back up to the screen.<\/li><li><strong>Draw one protocol seam, not every one.<\/strong> Show interface and implementation as separate cards only at the boundary that defines the architecture (usually the repository). The implementation gets a dashed <strong>\"implements\" arrow pointing up<\/strong> at the protocol, so both arrows touching the protocol card point <em>at<\/em> it: the layer above uses it, the layer below implements it, and nothing in the domain points down at the data layer. That's dependency inversion on the board. (An arrow from the protocol <em>down<\/em> to the implementation would draw the opposite.) Then say it once: <em>\"Everything else is behind a protocol too, for tests. I'm drawing the one that matters.\"<\/em><\/li><li><strong>Start simple, grow under pressure.<\/strong> Every extra component (an outbox, a shared store, a socket) waits until the interviewer pushes on that area. Adding it then, with the reason, scores better than having drawn it at minute twelve.<\/li><\/ul><h2 id=\"components-and-saying-why-those-components\">Components, and saying why those components<\/h2><p>Every one of these rounds reaches <em>\"why these types and not one big one?\"<\/em>. That question is asking whether you can justify a boundary, and the useful vocabulary for it is SOLID — used as reasons, not names:<\/p><ul><li><strong>Single responsibility<\/strong> — say what would make each type change. Different reasons, different types.<\/li><li><strong>Open–closed<\/strong> — new behaviour arrives as a new conformance, not as another <code><span class=\"t-kw\">if<\/span><\/code> in the coordinator.<\/li><li><strong>Liskov<\/strong> — the contract is behavioural: every conformance must cancel, throw and be callable concurrently the same way, or callers written against the protocol break.<\/li><li><strong>Interface segregation<\/strong> — if a test double needs twelve methods to test one, the protocol is too fat.<\/li><li><strong>Dependency inversion<\/strong> — depend on protocols, inject the concrete types at the composition root. This is what makes the interesting race testable at all.<\/li><\/ul><p>And the caveat worth saying in the room: SOLID came from class hierarchies; on iOS half of it lands as value types and protocol witnesses, and pushed too far it produces thirty one-method types. <em>\"I split where the reasons to change differ, not per noun.\"<\/em><\/p><h2 id=\"the-checklist-to-touch-briefly-in-every-answer\">The checklist to touch, briefly, in every answer<\/h2><p>Data flow and ownership of state · networking (protocol, pagination, retry, cancellation) · caching (tiers, keys, eviction, invalidation) · offline behaviour and the mutation queue · concurrency (what's on the main actor, how duplicate work is avoided) · memory and performance · observability, feature flags, testing and rollout — one sentence each is enough for the last group.<\/p><h2 id=\"how-each-chapter-is-laid-out\">How each chapter is laid out<\/h2><p>Visible: the prompt, the clock, and <strong>what the question is really testing<\/strong> — the framing, not the answer. Then, collapsed: a <strong>Words used in this chapter<\/strong> glossary, and the answer:<\/p><ol start=\"1\"><li>The interviewer answers your clarifying questions<\/li><li>Requirements and scope — what you should have said<\/li><li>The idea, in 30 seconds — what you say before drawing anything<\/li><li>What we need — the components, in drawing order: role, type name, layer, one job<\/li><li>The sketch — the diagram, and how to draw it on your own board step by step<\/li><li>Each component — <strong>in plain words<\/strong> first, then what it owns, <strong>its interface<\/strong>, the choice inside it, and an <em>Under the hood<\/em> note that teaches the concept<\/li><li>One request through the sketch — a sequence diagram whose every arrow is a method from section 6<\/li><li>The server contract — endpoints and payloads<\/li><\/ol><p>9–11. Deep dives, each opened by the line the interviewer would actually use<\/p><ol start=\"12\"><li>Failure modes and 10×<\/li><li>Question bank — every area they can push on, grouped by the checklist above, each answer hidden behind its question, and a follow-up chain per area, because real rounds drill down rather than jump around<\/li><li>Scorecard — mark yourself, 0 / 1 / 2<\/li><li>The 60-second recap<\/li><\/ol><p>You did it right if all four are true: you named out-of-scope first, every choice carried a rejected alternative and a switch condition, you stayed client-side, and you could answer at least two follow-ups before opening them. The question bank is the real test of the last one: an area where you can't answer the first question out loud is the area to study next.<\/p>", "text": "at senior level this is usually the round that decides the outcome, and it is the one where knowing the material and passing come apart most often. what's graded is how you run 45 minutes, out loud, while someone interrupts you. the chapters are also meant to be learned from , not only rehearsed: every component comes with an under the hood note explaining the concept behind it (what an actor is, why a cursor beats an offset, what a decoded image costs), so the answer makes sense even the first time through. they're written to be readable by someone who doesn't code, too: each chapter opens with a words used in this chapter glossary, the component table describes every part in plain words, and every component starts with an in plain words line and an everyday comparison before any technical detail. every under the hood note does the same: plain words first, then the detail . so every question here is written to be performed, not read . the prompt is at the top; the whole answer is behind collapsed sections, in the order a real round unfolds — including the interviewer's own lines: how they'd answer your clarifying questions, which component they'd pick to go deep on, and what they'd push on next. the 45 minutes clock phase what happens 0:00–0:02 the prompt you repeat it back and say how you'll spend the time 0:02–0:07 clarify you ask; they answer; you state your assumptions 0:07–0:12 scope out of scope first , then 3–5 features, then the non functional ones that matter 0:12–0:24 high level say the idea · list the components · sketch them · explain each · trace one request 0:24–0:40 deep dives they pick a component and push 0:40–0:45 follow ups and recap whatever they still want to probe, then the whole design in 60 seconds about 30 working minutes. running out of time before the deep dive is the most common way a strong candidate fails. how to run a session 1. timer on, standing, out loud, sketching on paper or an ipad. nothing open in front of you. 2. at each phase boundary, move on whether or not you're finished. that discipline is the skill. 3. when the 35 minutes are up, open the sections one at a time and mark each clean , partial or missed . then work through the question bank: read each question, answer it out loud, and only then open the answer. finish with the scorecard section. 4. keep the misses somewhere. a section you skip twice is a gap, not an oversight, and the second time is when it is worth reading up on. what is actually graded the public exercise set these prompts are drawn from publishes its criteria, and they are not what candidates expect: clear communication and active listening · thoughtful requirement clarification · practical trade off analysis · honestly acknowledging the limits of your knowledge · balancing engineering quality against business timelines. read that list again. only one line is about the design. the rest is about how you behave while producing it. in practice that means: scoping out loud. three features done properly beat eight named. \"offline editing is out of scope for this pass\" is a positive signal. trade offs, not choices. every box arrives with the alternative you rejected and the condition under which you'd switch. staying client side. the classic failure is drifting into sharding and qps. you're sizing a cache and reasoning about what happens on the u bahn with no signal. naming the smaller version. saying \"for a single screen, asyncimage and nscache are enough — here's when they stop being enough\" reads as senior. building a pipeline for a settings screen does not. saying what you don't know , then reasoning about it anyway. talking, not coding. a design round doesn't ask you to write code. the furthest it goes is an interface: a protocol, a model's fields, an endpoint. mechanisms (the load more guard, request dedupe, an optimistic like) are explained as steps, in words, with a diagram when there's a race. so the chapters do the same: swift appears only as interfaces, never as an implementation. the high level design, in the order you say it the twelve minutes of high level design run in the same five steps every time. each step makes the next one easy to follow, which is what the interviewer is grading. 1. say the idea (1 min). four sentences in plain words, before any box. if they stop you here, they already know the shape of the answer. 2. list what you need (2 min). the components, in the order you'll draw them, one job each. name each by what it does (\"feed repository\", \"image loader\", \"local storage\"), not by its class name; the public guides interviewers use name components by role for the same reason. write the list on the side of the board. 3. sketch them (4 min). three frames, one card per item on the list, arrows last. 4. explain each one (4 min). point at each card: what it owns, its interface (what others can call or read), the choice inside it and the alternative you rejected. this is where \"why mvvm?\" gets answered. methods never go on the board itself; the public frameworks keep the diagram at the level of roles and bring interfaces in when a component is discussed, and the client↔server api and data models are always asked for. 5. trace one request (1 min). one real flow across the cards, so they see them work together. keep the whiteboard simple a board with twenty boxes doesn't read a on, you stayed client side, and you could answer at least two follow ups before opening them. the question bank is the real test of the last one: an area where you can't answer the first question out loud is the area to study next. ", "outline": [{"a": "the-45-minutes", "t": "The 45 minutes"}, {"a": "how-to-run-a-session", "t": "How to run a session"}, {"a": "what-is-actually-graded", "t": "What is actually graded"}, {"a": "the-high-level-design-in-the-order-you-say-it", "t": "The high-level design, in the order you say it"}, {"a": "keep-the-whiteboard-simple", "t": "Keep the whiteboard simple"}, {"a": "components-and-saying-why-those-components", "t": "Components, and saying why those components"}, {"a": "the-checklist-to-touch-briefly-in-every-answer", "t": "The checklist to touch, briefly, in every answer"}, {"a": "how-each-chapter-is-laid-out", "t": "How each chapter is laid out"}]}, {"slug": "image-loading-and-caching-library", "title": "01 · Image loading and caching library", "summary": "\"Design an image loading library, something like Kingfisher or Nuke.\"", "minutes": "50", "sources": [{"ref": "", "label": "weeeBox · Mobile system design exercise, Image library", "url": "https://github.com/weeeBox/mobile-system-design/blob/master/exercises/image-library.md"}, {"ref": "WWDC18", "label": "Image and graphics best practices", "url": "https://developer.apple.com/videos/play/wwdc2018/219/"}, {"ref": "WWDC21", "label": "Make blazing fast lists and collection views", "url": "https://developer.apple.com/videos/play/wwdc2021/10252/"}, {"ref": "WWDC19", "label": "Advances in networking, part 1 (Low Data Mode)", "url": "https://developer.apple.com/videos/play/wwdc2019/712/"}, {"ref": "", "label": "Apple · CGImageSourceCreateThumbnailAtIndex", "url": "https://developer.apple.com/documentation/imageio/cgimagesourcecreatethumbnailatindex(_:_:_:)"}, {"ref": "", "label": "Apple · UIImage.preparingForDisplay()", "url": "https://developer.apple.com/documentation/uikit/uiimage/3750834-preparingfordisplay"}, {"ref": "", "label": "Apple · NSCache", "url": "https://developer.apple.com/documentation/foundation/nscache"}, {"ref": "", "label": "Apple · allowsConstrainedNetworkAccess", "url": "https://developer.apple.com/documentation/foundation/urlsessionconfiguration/allowsconstrainednetworkaccess"}, {"ref": "", "label": "Apple · UICollectionViewDataSourcePrefetching", "url": "https://developer.apple.com/documentation/uikit/uicollectionviewdatasourceprefetching"}, {"ref": "SE-0461", "label": "Run nonisolated async functions on the caller's actor by default", "url": "https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md"}, {"ref": "", "label": "Nuke · request coalescing and the pipeline", "url": "https://github.com/kean/Nuke"}], "html": "<p><em>A recurring senior mobile prompt in first-hand interview reports. The public exercise interviewers draw their wording from is weeeBox's image-library brief, which also publishes the grading criteria used below.<\/em><\/p><blockquote class=\"aside plain\"><p><strong>Interviewer:<\/strong> \"We show a lot of images — feeds, avatars, a photo grid. I'd like you to design the image loading library we'd build for that. Something in the spirit of Kingfisher or Nuke. Where would you start?\"<\/p><\/blockquote><h2 id=\"run-it-as-a-round-not-as-reading\">Run it as a round, not as reading<\/h2><p>Set a timer. Stand up. Sketch on paper or an iPad. Talk the whole time — silence is the thing that fails these rounds. <strong>Do not open a section until its slot is over.<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Clock<\/th><th>Phase<\/th><th>What you do<\/th><\/tr><\/thead><tbody><tr><td>0:00–0:02<\/td><td>The prompt<\/td><td>Repeat it back in one sentence and say what you're going to do with the time<\/td><\/tr><tr><td>0:02–0:07<\/td><td>Clarify<\/td><td>Ask; then open section 1 only after you've asked yours, and take its answers as the interviewer's<\/td><\/tr><tr><td>0:07–0:12<\/td><td>Scope<\/td><td>Out of scope first, then 3–5 functional, then the non-functional ones that matter<\/td><\/tr><tr><td>0:12–0:24<\/td><td>High level<\/td><td>Say the idea (1 min) · list the components (2) · sketch them (4) · explain each (4) · trace one request (1)<\/td><\/tr><tr><td>0:24–0:40<\/td><td>Deep dives<\/td><td>The interviewer picks; sections 9–11 are the three they pick from<\/td><\/tr><tr><td>0:40–0:45<\/td><td>Follow-ups and recap<\/td><td>Whatever they still probe, then the 60-second summary; the question bank afterwards<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"what-this-question-is-really-testing\">What this question is really testing<\/h2><p>It looks like a question about caching. It isn't, quite.<\/p><ul><li><strong>Can you find the axis?<\/strong> Every decision here trades <strong>memory ↔ disk ↔ CPU ↔ bandwidth<\/strong>. A candidate who names that axis in the first five minutes has already passed the framing part.<\/li><li><strong>Do you know what a decoded image costs?<\/strong> Width × height × 4 bytes, regardless of file size. Everything about memory follows from that one fact, and it's the most common gap.<\/li><li><strong>Can you design components with reasons?<\/strong> They will ask why these types and not fewer. This is where SOLID earns its keep — not as vocabulary, but as four or five sentences about what would change and what wouldn't.<\/li><li><strong>Do you think about the same image twice?<\/strong> Two cells, one URL. Dedupe of in-flight work is the concurrency content of this question and the thing most answers miss.<\/li><li><strong>Do you know when to stop?<\/strong> <code><span class=\"t-typ\">AsyncImage<\/span><\/code> and <code><span class=\"t-typ\">NSCache<\/span><\/code> are legitimate answers for a small app. Saying so, with the condition attached, reads as senior. Building a pipeline for a settings screen does not.<\/li><\/ul><p><strong>Traps:<\/strong> drifting into CDN and backend design; describing a cache with no eviction; forgetting cancellation entirely; naming Kingfisher's features instead of designing; decoding on the main actor without noticing.<\/p><details class=\"reveal\"><summary>Words used in this chapter<\/summary><div class=\"reveal-body\"><p>Plain definitions for the technical words this chapter uses. Read once; come back when a word stops you.<\/p><ul><li><strong>URL<\/strong> — the web address of a picture.<\/li><li><strong>Library<\/strong> — reusable code other parts of the app call; here, the code that loads every picture in the app.<\/li><li><strong>Pixel<\/strong> — one coloured dot on the screen. A picture's size in pixels is how many dots wide and tall it is.<\/li><li><strong>Decode<\/strong> — a picture arrives compressed (a JPEG or HEIC file); decoding unpacks it into pixels the screen can draw. Unpacked, it's many times bigger: width × height × 4 bytes.<\/li><li><strong>Memory vs disk<\/strong> — <em>memory<\/em> is the phone's fast, small working space, emptied when the app closes; <em>disk<\/em> is its slower, larger storage that survives.<\/li><li><strong>Cache<\/strong> — a kept copy of something fetched before, so it's instant next time. <em>Eviction<\/em> is throwing old entries out when it's full.<\/li><li><strong>CDN<\/strong> — a network of servers that keep copies of files close to users; this one can also resize a picture before sending it.<\/li><li><strong>Main thread<\/strong> — the single lane that draws the screen. Slow work there (like decoding) freezes scrolling, so it's done elsewhere.<\/li><li><strong>Actor<\/strong> — a part that handles one request at a time, so two requests can never trample the same data.<\/li><li><strong>Protocol<\/strong> — a written promise of what a part can do, without how. Anything that keeps the promise can be plugged in.<\/li><li><strong>Cancel<\/strong> — stopping work nobody needs any more, such as a download for a row that scrolled away.<\/li><li><strong>Prefetch<\/strong> — fetching pictures just before they come into view, so they're already there.<\/li><li><strong>Offline<\/strong> — no internet connection.<\/li><\/ul><\/div><\/details><details class=\"reveal\"><summary>1 · The interviewer answers your clarifying questions<\/summary><div class=\"reveal-body\"><p>Ask yours first. These are the answers you'd get, and the assumptions the rest of this chapter runs on.<\/p><p><strong>\"Is this a library for one app, or an SDK other teams adopt?\"<\/strong> → <em>One app to start, but shaped so it could be extracted as a package later.<\/em><\/p><p><strong>\"Where do images come from — network only?\"<\/strong> → <em>Network mostly, but also files on disk and a few bundled assets. The public version of this exercise wants all three.<\/em><\/p><p><strong>\"Who consumes them? Views only, or code too?\"<\/strong> → <em><code><span class=\"t-typ\">UIImageView<\/span><\/code> and SwiftUI, and occasionally non-UI code that wants the image to share or export.<\/em><\/p><p><strong>\"What's the heaviest screen?\"<\/strong> → <em>A grid of thumbnails you can fling through, plus full-screen detail views.<\/em><\/p><p><strong>\"Can the server resize? Is there a CDN with a width parameter?\"<\/strong> → <em>Yes, assume <code>?w=<\/code> works and the CDN sends <code><span class=\"t-typ\">ETag<\/span><\/code> and <code><span class=\"t-typ\">Cache<\/span>-<span class=\"t-typ\">Control<\/span><\/code>.<\/em><\/p><p><strong>\"Do images need to show offline?\"<\/strong> → <em>Yes. Anything the user has seen should still appear with no network.<\/em><\/p><p><strong>\"Anything sensitive in these images?\"<\/strong> → <em>Not today. Ask me again at the end.<\/em> (They will.)<\/p><p><strong>\"What are we optimising — smoothness, data, battery?\"<\/strong> → <em>Scrolling must stay smooth on a three-year-old phone, and we've had memory-pressure kills in the field.<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>2 · Requirements and scope — what you should have said<\/summary><div class=\"reveal-body\"><p><strong>Out of scope, stated first, before any design:<\/strong> animated GIF/APNG playback, video thumbnails, editing and filters beyond resize, placeholder and transition animations (the caller owns those), plug-in loaders for arbitrary formats, and everything server-side beyond \"there is a CDN with a width parameter\". Progressive JPEG is a stretch goal if time allows.<\/p><p><strong>Functional — five, no more<\/strong><\/p><ol start=\"1\"><li>Load an image by URL from network, file or bundle, into a view or back to a caller.<\/li><li>Downsample to the size it will actually be displayed at.<\/li><li>Cache in memory and on disk; previously seen images appear offline.<\/li><li>Cancel automatically when a view stops needing the image — cell reuse, disappearance.<\/li><li>Prefetch ahead of the scroll position.<\/li><\/ol><p><strong>Non-functional that matter here<\/strong><\/p><ul><li><strong>Memory<\/strong> — decoded bitmaps are what gets the app killed. Budget them explicitly.<\/li><li><strong>Main-thread time<\/strong> — no decode and no disk I/O on the main actor; the scroll holds its frame rate.<\/li><li><strong>Bandwidth and battery<\/strong> — never fetch the same bytes twice; honour Low Data Mode.<\/li><li><strong>Correctness<\/strong> — a reused cell never shows another row's image.<\/li><li><strong>Testability<\/strong> — every I/O boundary behind a protocol.<\/li><\/ul><p>Then say the axis out loud: <em>\"Everything from here is memory against disk against CPU against bandwidth. I'll keep naming which one each choice spends.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>3 · The idea, in 30 seconds — before you draw anything<\/summary><div class=\"reveal-body\"><p>Say the whole design in plain words first:<\/p><blockquote class=\"aside plain\"><p><em>\"A view asks for an image by URL and by the size it will show it at. One coordinator checks a memory cache first; if the image is already being loaded for someone else, it waits for that load instead of starting another. Otherwise it gets the bytes from a disk cache or the network, shrinks them to the display size off the main thread, and keeps the result in memory. It's a library, not an app, so three layers of its own: the API callers touch, the core that coordinates, and the I/O that does the work.\"<\/em><\/p><\/blockquote><p>Then the axis, in one sentence: <em>\"Every choice here trades memory against disk against CPU against bandwidth.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>4 · What we need — the components, before the sketch<\/summary><div class=\"reveal-body\"><p>List them out loud, in the order you'll draw them. Name each by <strong>what it does<\/strong>, not by its class name; the type name is a detail you mention while explaining it.<\/p><div class=\"scroll\"><table><thead><tr><th>#<\/th><th>Component<\/th><th>Type name<\/th><th>Layer<\/th><th>Its one job<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>Image view helpers<\/strong><\/td><td><code>setImage<\/code> · <code><span class=\"t-typ\">LazyImage<\/span><\/code><\/td><td>API<\/td><td>The one line a screen calls to say \"show this picture here\". Calls it off if the row scrolls away.<\/td><\/tr><tr><td>2<\/td><td><strong>Image pipeline<\/strong><\/td><td><code><span class=\"t-typ\">ImagePipeline<\/span><\/code><\/td><td>Core<\/td><td>The dispatcher: is the picture ready, is someone already fetching it, or send someone.<\/td><\/tr><tr><td>3<\/td><td><strong>Memory cache<\/strong><\/td><td><code><span class=\"t-typ\">ImageMemoryCache<\/span><\/code><\/td><td>Core<\/td><td>A small, fast shelf of ready-to-show pictures in the phone's memory. Lives inside the dispatcher.<\/td><\/tr><tr><td>4<\/td><td><strong>Disk cache<\/strong><\/td><td><code><span class=\"t-typ\">ImageDiskCache<\/span><\/code><\/td><td>I/O<\/td><td>A bigger, slower drawer of downloaded files on the phone, so seen pictures show offline.<\/td><\/tr><tr><td>5<\/td><td><strong>Data loader<\/strong> (protocol)<\/td><td><code><span class=\"t-typ\">DataLoader<\/span><\/code><\/td><td>I/O<\/td><td>The job description \"get the file at this address\", written once for every source.<\/td><\/tr><tr><td>6<\/td><td><strong>Network and file loaders<\/strong><\/td><td><code><span class=\"t-typ\">NetworkDataLoader<\/span><\/code> · <code><span class=\"t-typ\">FileDataLoader<\/span><\/code><\/td><td>Sources<\/td><td>The two workers who do that job: one downloads from the internet, one reads from the phone.<\/td><\/tr><tr><td>7<\/td><td><strong>Image decoder<\/strong><\/td><td><code><span class=\"t-typ\">ImageDecoder<\/span><\/code><\/td><td>I/O<\/td><td>Unpacks the downloaded file into a picture the screen can draw, at the size it's shown.<\/td><\/tr><\/tbody><\/table><\/div><p>And what's deliberately <strong>not<\/strong> on the list yet: prefetching, revalidation, Low Data Mode, the disk index. <em>\"I'll add those if we go there.\"<\/em><\/p><\/div><\/details><details class=\"reveal\"><summary>5 · The sketch<\/summary><div class=\"reveal-body\"><div class=\"board\"><pre class=\"board-src\">flowchart TB\n  subgraph A[&quot;API&quot;]\n    Call[&quot;`**1 · Image view helpers**\nsetImage · LazyImage`&quot;]\n  end\n  subgraph C[&quot;CORE&quot;]\n    Pipe[&quot;`**2 · Image pipeline**\nImagePipeline (actor)\nchecks and fills card 3: **Memory cache**`&quot;]\n  end\n  subgraph IO[&quot;I/O&quot;]\n    Disk[&quot;`**4 · Disk cache**\nImageDiskCache`&quot;]\n    Loader[&quot;`**5 · Data loader**\n«protocol»`&quot;]\n    Dec[&quot;`**7 · Image decoder**\nImageDecoder`&quot;]\n  end\n  Net[&quot;`**6 · Network loader**\nNetworkDataLoader`&quot;]\n  File[&quot;`**6 · File loader**\nFileDataLoader`&quot;]\n  Call -- &quot;URL + size → image&quot; --&gt; Pipe\n  Pipe -- &quot;1 · read · save bytes&quot; --&gt; Disk\n  Pipe -- &quot;2 · URL → bytes&quot; --&gt; Loader\n  Pipe -- &quot;3 · bytes → image&quot; --&gt; Dec\n  Loader ~~~ Net\n  Loader ~~~ File\n  Net -. &quot;implements&quot; .-&gt; Loader\n  File -. &quot;implements&quot; .-&gt; Loader\n  class Call pres\n  class Pipe dom\n  class Disk,Loader,Dec data\n  class Net net\n  class File data<\/pre><\/div><p>Each card is <strong>what it does<\/strong> in bold, with the type name underneath.<\/p><p><strong>How to read the arrows.<\/strong> A solid arrow means <em>asks<\/em>: it points from the part that asks to the part that answers, which is also the direction of dependency. Its label reads <strong>request → reply<\/strong>, so the data coming back travels the other way along the same arrow. The dashed arrow means <em>implements<\/em>. Section 7 replays the same flow step by step. The numbers are the order on a memory miss: look on disk (and save there after a download), download, decode.<\/p><p><strong>Drawing it on Miro, step by step<\/strong> (about four minutes, talking the whole time):<\/p><ol start=\"1\"><li>Three wide frames stacked top to bottom: <strong>API<\/strong>, <strong>Core<\/strong>, <strong>I/O<\/strong>. Label them first.<\/li><li>Fill them in the order of your list, one card per component: blue for what callers touch, purple for the core, green for I/O, orange for the network.<\/li><li>Write the memory cache <em>inside<\/em> the pipeline card (the pipeline owns it and checks it first), then number the pipeline's three arrows as you draw them, labelled <strong>request → reply<\/strong>. That numbering <em>is<\/em> the algorithm on a memory miss: bytes from disk if they're there, otherwise download them and save them to disk, then decode them into an image, which goes into the memory cache and back up to the view.<\/li><li>Write «protocol» on the data loader card, put the two loaders under it, and draw a dashed \"implements\" arrow from each <strong>up<\/strong> to it. The pipeline depends on the protocol, and so do the loaders; the pipeline never points at a concrete loader. That's dependency inversion on the board. That's the one seam worth drawing: a new image source is a new card under it, never a change to the pipeline. <em>\"The caches and the decoder are behind protocols too, for tests.\"<\/em><\/li><\/ol><p>Seven cards, three frames, six arrows. Methods stay off the board; they come up when the interviewer asks about a component, which is the next section.<\/p><\/div><\/details><details class=\"reveal\"><summary>6 · Each component: its job, its interface, the choice inside it<\/summary><div class=\"reveal-body\"><p>Point at each card and cover three things: <strong>what it owns<\/strong>, <strong>its interface<\/strong> (what others can call), and <strong>the choice you made inside it<\/strong>. The <em>Under the hood<\/em> notes are for learning; they're what lets you answer the follow-up.<\/p><p>First, the one value every component passes around:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">ImageRequest<\/span>: <span class=\"t-typ\">Hashable<\/span>, <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">let<\/span> url: <span class=\"t-typ\">URL<\/span>\n    <span class=\"t-com\">/// The size it will be shown at, in pixels; nil = full size<\/span>\n    <span class=\"t-kw\">let<\/span> targetPixelSize: <span class=\"t-typ\">CGSize<\/span>?\n    <span class=\"t-com\">/// Visible rows high, prefetch low<\/span>\n    <span class=\"t-kw\">let<\/span> priority: <span class=\"t-typ\">Priority<\/span>\n    <span class=\"t-com\">/// False for prefetch, so Low Data Mode skips it<\/span>\n    <span class=\"t-kw\">let<\/span> allowsConstrainedNetwork: <span class=\"t-typ\">Bool<\/span>\n}<\/code><\/pre><\/div><h3 id=\"1-image-view-helpers-setimage-lazyimage\">1 · Image view helpers (<code>setImage<\/code>, <code><span class=\"t-typ\">LazyImage<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> the single line a screen calls to say \"show the picture at this address, at this size, here\". If the row it was for scrolls away before the picture arrives, it calls the job off so no time is wasted.<\/p><p><strong>Owns:<\/strong> the link between one view and its current request.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">extension<\/span> <span class=\"t-typ\">UIImageView<\/span> {\n    <span class=\"t-com\">/// Nil cancels and clears<\/span>\n    <span class=\"t-atr\">@MainActor<\/span> <span class=\"t-kw\">func<\/span> setImage(_ request: <span class=\"t-typ\">ImageRequest<\/span>?)\n}\n\n<span class=\"t-kw\">struct<\/span> <span class=\"t-typ\">LazyImage<\/span>: <span class=\"t-typ\">View<\/span> {\n    <span class=\"t-com\">/// SwiftUI; reloads when request changes<\/span>\n    <span class=\"t-kw\">init<\/span>(request: <span class=\"t-typ\">ImageRequest<\/span>)\n}<\/code><\/pre><\/div><p><strong>The choice inside it:<\/strong> both are thin. <code>setImage<\/code> reads the memory cache straight away, so a cached image appears in the same frame with no flicker, and remembers its request so a reused row can cancel it. When a load finishes, it checks the result is for the row's <em>current<\/em> request before showing it. That check stops the classic wrong-image-in-a-reused-row bug.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p><em>In plain words:<\/em> calling off a job only leaves the worker a note saying \"stop\"; the worker may finish before reading it. So the screen also checks that the picture it receives is still the one it wants.<\/p><p><em>The detail:<\/em> Cancelling in Swift concurrency is <em>cooperative<\/em>: cancelling a task only sets a flag, and the work stops at its next check. So a result can still arrive after you cancelled, which is why the \"is this still my request?\" check is needed on top of cancelling. SwiftUI's <code>.task(id:)<\/code> gives you both for free: it cancels the old task and starts a new one whenever the id changes.<\/p><\/blockquote><h3 id=\"2-image-pipeline-imagepipeline\">2 · Image pipeline (<code><span class=\"t-typ\">ImagePipeline<\/span><\/code>)<\/h3><p><strong>In plain words:<\/strong> the dispatcher every request goes through. It checks whether the picture is already on the ready shelf, whether someone is already fetching that same picture (then it simply waits for them), and otherwise sends someone to get it.<\/p><p><strong>Owns:<\/strong> the coordination: which images are cached, which are loading, who is waiting for each.<\/p><p><strong>Interface:<\/strong><\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImagePipelineType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-kw\">func<\/span> image(<span class=\"t-kw\">for<\/span> request: <span class=\"t-typ\">ImageRequest<\/span>) <span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span> -&gt; <span class=\"t-typ\">UIImage<\/span>\n}\n\n<span class=\"t-kw\">protocol<\/span> <span class=\"t-typ\">ImagePrefetchingType<\/span>: <span class=\"t-typ\">Sendable<\/span> {\n    <span class=\"t-com\">/// Rows about to appear, low priority<\/span>\n    <span class=\"t-kw\">func<\/span> prefetch(_ requests: [<span class=\"t-typ\">ImageRequest<\/span>])\n    <span class=\"t-com\">/// Rows the user flung past<\/span>\n    <span class=\"t-kw\">func<\/span> cancelPrefetch(_ requests: [<span class=\"t-typ\">ImageRequest<\/span>])\n}<\/code><\/pre><\/div><p><strong>The choices inside it:<\/strong> it's an <strong>actor<\/strong> that does bookkeeping only, never decoding, or every decode in the app would queue behind it. Prefetching is a <strong>separate protocol<\/strong>, so a detail screen showing one image doesn't depend on it. The core call is <code><span class=\"t-kw\">async<\/span> <span class=\"t-kw\">throws<\/span><\/code>, so cancelling comes free with the calling task, and non-UI code (share
