<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Reference Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">

<style>
:root{
  --ground:#FBFAFC; --panel:#F2EFF5; --raised:#FFFFFF;
  --ink:#17161C; --muted:#5D6C79; --faint:#8E93A0;
  --rule:#E2DDE8; --rule-soft:#EDE9F1;
  --accent:#AD3DA4; --accent-soft:#F6E9F5;
  --link:#0B4F79; --warm:#B4472F; --warm-soft:#FBEDE9;
  --code-bg:#F6F4F8;
  --t-kw:#AD3DA4; --t-typ:#0B4F79; --t-str:#C0331C; --t-com:#5D6C79; --t-num:#1C00CF; --t-atr:#7A3E9D;
  --shadow:0 1px 2px rgba(23,22,28,.05), 0 8px 24px -12px rgba(23,22,28,.18);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#1B1B20; --panel:#232329; --raised:#26262E;
    --ink:#E7E4EC; --muted:#9AA2AE; --faint:#7A818D;
    --rule:#33333C; --rule-soft:#2B2B33;
    --accent:#FF7AB2; --accent-soft:#33202C;
    --link:#6BDFFF; --warm:#FF8170; --warm-soft:#32231F;
    --code-bg:#1F1F26;
    --t-kw:#FF7AB2; --t-typ:#6BDFFF; --t-str:#FF8170; --t-com:#7F8C98; --t-num:#D9C97C; --t-atr:#C5A3E0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#1B1B20; --panel:#232329; --raised:#26262E;
  --ink:#E7E4EC; --muted:#9AA2AE; --faint:#7A818D;
  --rule:#33333C; --rule-soft:#2B2B33;
  --accent:#FF7AB2; --accent-soft:#33202C;
  --link:#6BDFFF; --warm:#FF8170; --warm-soft:#32231F;
  --code-bg:#1F1F26;
  --t-kw:#FF7AB2; --t-typ:#6BDFFF; --t-str:#FF8170; --t-com:#7F8C98; --t-num:#D9C97C; --t-atr:#C5A3E0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;
}

/* ------------------------------------------------------- programme rail */
.tl-sect{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); margin:18px 0 8px;
}
.tl{position:relative; padding-left:16px; margin:0 0 4px}
.tl::before{content:""; position:absolute; left:4px; top:8px; bottom:8px; width:1px; background:var(--rule)}
.tl a{
  position:relative; display:block; padding:6px 8px 6px 10px; border-radius:6px;
  text-decoration:none; color:var(--ink); font-size:13px; line-height:1.35;
}
.tl a::before{
  content:""; position:absolute; left:-16px; top:12px; width:7px; height:7px; border-radius:50%;
  background:var(--accent); border:2px solid var(--ground);
}
.tl a:hover{background:var(--panel)}
.tl a.on{background:var(--accent-soft); font-weight:500}
.tl a.on::before{box-shadow:0 0 0 3px var(--accent-soft)}
.tl a .n{font-family:var(--mono); font-size:10px; color:var(--faint); margin-right:6px}
.tl a.soon{opacity:.45; pointer-events:none}
.tl a.soon::before{background:none; border:2px solid var(--rule)}
.tl-more{
  display:block; width:100%; margin-top:2px; padding:5px 0 5px 26px; border:0; background:none;
  color:var(--muted); font:inherit; font-size:12px; text-align:left; cursor:pointer;
}
.tl-more:hover{color:var(--accent)}

.tp{border-top:1px solid var(--rule-soft)}
.tp:last-of-type{border-bottom:1px solid var(--rule-soft)}
.tp > button{
  display:flex; align-items:center; gap:8px; width:100%; padding:10px 2px; border:0; background:none;
  cursor:pointer; color:var(--ink); font:inherit; font-size:13.5px; text-align:left;
}
.tp > button .chev{color:var(--faint); font-size:9px; width:9px}
.tp > button .nm{flex:1}
.tp > button .ct{font-family:var(--mono); font-size:10px; color:var(--faint)}
.tp.open > button .nm{color:var(--accent); font-weight:500}
.tp .kids{padding:0 0 8px}

/* --------------------------------------------------------- on this page */
.outline{
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  padding:40px 18px 40px 20px; border-left:1px solid var(--rule);
}
.outline p.h{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); margin:0 0 10px;
}
.outline a{
  display:block; padding:5px 0 5px 10px; border-left:2px solid var(--rule); color:var(--muted);
  text-decoration:none; font-size:12.5px; line-height:1.35;
}
.outline a:hover{color:var(--ink)}
.outline a.on{border-left-color:var(--accent); color:var(--ink)}
.outline:empty{display:none}

/* ------------------------------------------------------------- progress */
.prog{display:flex; align-items:center; gap:12px; margin:0 0 26px}
.prog .lb{
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); white-space:nowrap;
}
.prog .bar{flex:1; height:3px; background:var(--rule-soft); border-radius:2px; overflow:hidden}
.prog .bar i{display:block; height:100%; background:var(--accent)}

/* ---------------------------------------------------------- index cards */
.ix-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:6px}
.ix-head h1{font-family:var(--serif); font-weight:500; font-size:clamp(28px,4vw,36px); margin:0}
.ix-head .meta{font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap}
.ix-lede{color:var(--muted); max-width:62ch; margin:0 0 32px}
.build{margin:0 0 28px}
.build > h3{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); font-weight:400; margin:0 0 12px; display:flex; gap:12px; align-items:center;
}
.build > h3::after{content:""; flex:1; height:1px; background:var(--rule-soft)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:10px}
.card{
  display:block; padding:13px 14px; border:1px solid var(--rule); border-radius:8px;
  background:var(--raised); text-decoration:none; color:var(--ink); box-shadow:var(--shadow);
}
.card:hover{border-color:var(--accent)}
.card .n{font-family:var(--mono); font-size:10.5px; color:var(--accent); letter-spacing:.08em}
.card b{display:block; font-size:14px; font-weight:600; margin:5px 0 4px; line-height:1.32}
.card span.s{display:block; color:var(--muted); font-size:12.5px; line-height:1.45}
.card.next{border-style:dashed; background:none; box-shadow:none; opacity:.62}
.card.next .n{color:var(--faint)}

.rail-foot .rail-home{display:block; color:var(--muted); text-decoration:none; margin-bottom:4px}
.rail-foot .rail-home:hover{color:var(--accent)}

/* ---------------------------------------------------------------- shell */
.shell{display:grid; grid-template-columns:270px minmax(0,1fr); min-height:100vh}
@media (min-width:1180px){.shell:has(.outline:not(:empty)){grid-template-columns:270px minmax(0,1fr) 220px}}
@media (max-width:1179px){.outline{display:none}}
.rail{
  border-right:1px solid var(--rule); background:var(--panel);
  position:sticky; top:0; height:100vh; overflow-y:auto;
  padding:22px 0 40px; display:flex; flex-direction:column; gap:18px;
}
.rail-head{padding:0 20px; display:flex; flex-direction:column; gap:3px}
.mark{
  font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:-.01em;
  background:none; border:0; padding:0; color:var(--ink); cursor:pointer; text-align:left;
}
.mark-sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}

.find{padding:0 20px}
.find input{
  width:100%; font-family:var(--sans); font-size:13px; color:var(--ink);
  background:var(--raised); border:1px solid var(--rule); border-radius:7px;
  padding:7px 10px;
}
.find input::placeholder{color:var(--faint)}

.tree{display:flex; flex-direction:column; gap:22px; padding:0 12px}
.tree-group{display:flex; flex-direction:column; gap:2px}
.tree-title{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); padding:0 8px 6px;
}
.tree a{
  display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:baseline;
  padding:5px 8px; border-radius:6px; text-decoration:none; color:var(--muted);
  font-size:13.5px; line-height:1.4;
}
.tree a:hover{background:var(--rule-soft); color:var(--ink)}
.tree a.on{background:var(--accent-soft); color:var(--ink); font-weight:500}
.tree a.on .num{color:var(--accent)}
.num{font-family:var(--mono); font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto; padding:0 20px; font-size:11.5px; color:var(--faint); font-family:var(--mono)}

/* ---------------------------------------------------------------- main */
main{padding:0 0 96px; min-width:0}
.wrap{max-width:672px; margin:0 auto; padding-inline:28px}
.topbar{
  display:none; align-items:center; gap:12px; padding:12px 18px;
  border-bottom:1px solid var(--rule); background:var(--ground);
  position:sticky; top:0; z-index:20;
}
.burger{
  font:500 13px/1 var(--sans); color:var(--ink); background:var(--panel);
  border:1px solid var(--rule); border-radius:7px; padding:8px 11px; cursor:pointer;
}

/* ---------------------------------------------------------------- home */
.hero{padding-block:64px 8px}
.hero h1{
  font-family:var(--serif); font-weight:500; font-size:clamp(34px,5.5vw,48px);
  line-height:1.1; letter-spacing:-.02em; margin:0 0 14px; text-wrap:balance;
}
.hero p{font-size:17.5px; color:var(--muted); margin:0; max-width:56ch}
.hr{height:1px; background:var(--rule); margin-block:40px}

.topic-card{
  border:1px solid var(--rule); border-radius:12px; background:var(--raised);
  padding:26px 26px 20px; box-shadow:var(--shadow); margin-bottom:20px;
}
.topic-card h2{
  font-family:var(--serif); font-weight:600; font-size:26px; letter-spacing:-.015em;
  margin:0 0 4px;
}
.topic-card h2 a{color:inherit; text-decoration:none}
.topic-card h2 a:hover{color:var(--accent)}
.tagline{font-family:var(--mono); font-size:11.5px; letter-spacing:.05em; color:var(--accent); text-transform:uppercase; margin:0 0 12px}
.topic-card>p.blurb{color:var(--muted); margin:0 0 20px; font-size:15px}
.facts{
  display:flex; flex-wrap:wrap; gap:18px; padding-top:16px; margin-top:4px;
  border-top:1px solid var(--rule-soft);
  font-family:var(--mono); font-size:11.5px; color:var(--faint); letter-spacing:.03em;
}
.facts b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}

.chapters{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.chapters li{border-top:1px solid var(--rule-soft)}
.chapters li:first-child{border-top:0}
.chapters a{
  display:grid; grid-template-columns:30px 1fr auto; gap:14px; align-items:baseline;
  padding:11px 0; text-decoration:none; color:inherit;
}
.chapters a:hover .ch-t{color:var(--accent)}
.ch-t{font-weight:500; font-size:15px}
.ch-s{grid-column:2; color:var(--muted); font-size:13.5px; line-height:1.5; margin-top:1px}
.ch-m{font-family:var(--mono); font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- chapter */
.eyebrow{
  display:flex; align-items:center; gap:10px; padding-block:48px 0;
  font-family:var(--mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint);
}
.eyebrow a{color:var(--faint); text-decoration:none}
.eyebrow a:hover{color:var(--accent)}
.eyebrow .dot{width:3px; height:3px; border-radius:50%; background:var(--rule); display:inline-block}

article h1{
  font-family:var(--serif); font-weight:500; font-size:clamp(30px,4.6vw,40px);
  line-height:1.15; letter-spacing:-.02em; margin:14px 0 10px; text-wrap:balance;
}
.lede{font-size:17px; text-wrap:pretty; color:var(--muted); margin:0 0 6px; max-width:58ch}

article h2{
  font-family:var(--serif); font-weight:600; font-size:25px; letter-spacing:-.015em;
  margin:44px 0 12px; text-wrap:balance;
}
article h3{
  font-family:var(--sans); font-weight:600; font-size:15.5px; letter-spacing:.005em;
  margin:32px 0 8px; text-wrap:balance;
}
article p{margin:0 0 16px; text-wrap:pretty}
article ul,article ol{margin:0 0 18px; padding-left:22px}
article li{margin-bottom:7px}
article li::marker{color:var(--faint)}
article hr{border:0; height:1px; background:var(--rule); margin-block:36px}
article strong{font-weight:600}
article :not(pre) > code{overflow-wrap:anywhere}

code{
  font-family:var(--mono); font-size:.875em;
  background:var(--code-bg); border:1px solid var(--rule-soft);
  border-radius:4px; padding:.08em .32em;
}
pre{
  font-family:var(--mono); font-size:13px; line-height:1.62;
  background:var(--code-bg); border:1px solid var(--rule);
  border-radius:9px; padding:16px 18px; margin:0; position:relative;
}
pre code{background:none; border:0; padding:0; font-size:inherit}
pre::after{
  content:attr(data-lang); position:absolute; top:8px; right:12px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
}
.t-kw{color:var(--t-kw)} .t-typ{color:var(--t-typ)} .t-str{color:var(--t-str)}
.t-com{color:var(--t-com); font-style:italic} .t-num{color:var(--t-num)} .t-atr{color:var(--t-atr)}
.scroll{overflow-x:auto; margin:0 0 20px; max-width:100%}

table{border-collapse:collapse; width:100%; font-size:13.5px; line-height:1.5}
th,td{text-align:left; padding:9px 14px 9px 0; border-bottom:1px solid var(--rule-soft); vertical-align:top}
th{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); font-weight:400; border-bottom:1px solid var(--rule);
}
td:first-child{color:var(--ink); font-weight:500}

.aside{margin:0 0 22px; padding:2px 0 2px 20px; border-left:2px solid var(--rule)}
.aside p:last-child{margin-bottom:0}
.aside-label{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  margin:0 0 6px !important;
}
.aside.office{border-left-color:var(--warm)}
.aside.office .aside-label{color:var(--warm)}
.aside.office p:not(.aside-label){font-family:var(--serif); font-size:17px; line-height:1.6}
.aside.hood{border-left-color:var(--accent)}
.aside.hood .aside-label{color:var(--accent)}
.aside.hood p:not(.aside-label){font-size:14.5px; color:var(--muted)}
.aside.hood code{font-size:.86em}

/* ---------------------------------------------------------------- diagram */
.dg{
  margin:0 0 24px; padding:16px; border:1px solid var(--rule); border-radius:8px;
  background:var(--panel); font-size:13.5px; line-height:1.45; overflow-x:auto;
}
.dg figcaption, .dg .dg-title{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--faint); margin:0 0 14px;
}
.dg-row{display:grid; grid-template-columns:78px minmax(0,1fr); gap:12px; align-items:center}
.dg-lane{
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); text-align:right; padding-top:2px;
}
.dg-nodes{display:flex; flex-wrap:wrap; gap:10px}
.dg-node{
  flex:1 1 150px; min-width:140px; padding:9px 11px; border:1px solid var(--rule);
  border-radius:6px; background:var(--raised); color:var(--ink); box-shadow:var(--shadow);
}
.dg-node b{display:block; font-weight:600; font-size:13.5px}
.dg-node span{display:block; margin-top:3px; color:var(--muted); font-size:12px}
.dg-node code{background:none; padding:0; font-size:12px; color:var(--muted)}
.dg-node.accent{border-color:var(--accent)}
.dg-node.accent b{color:var(--accent)}
.dg-node.warm{border-color:var(--warm)}
.dg-node.warm b{color:var(--warm)}
.dg-node.ghost{border-style:dashed; background:none; box-shadow:none}
.dg-node.ghost b{color:var(--muted)}
.dg-flow{
  display:grid; grid-template-columns:78px minmax(0,1fr); gap:12px; align-items:center;
  margin:8px 0; color:var(--muted); font-family:var(--mono); font-size:11px;
}
.dg-flow::before{content:"\2193"; text-align:right; color:var(--faint); font-size:15px}
.dg-flow.up::before{content:"\2191"}
.dg-flow.both::before{content:"\2195"}
.dg-group{
  border:1px dashed var(--rule); border-radius:8px; padding:12px 12px 4px; margin:0 0 10px;
  position:relative; background:var(--ground);
}
.dg-group > .dg-group-label{
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); margin:0 0 10px;
}
.dg-split{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px}
.dg-note{margin:10px 0 0; color:var(--muted); font-size:12.5px}
.dg-legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.dg-legend span{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--muted);
  border:1px solid var(--rule); border-radius:4px; padding:3px 7px;
}
@media (max-width:640px){
  .dg-row,.dg-flow{grid-template-columns:1fr}
  .dg-lane{text-align:left}
  .dg-flow::before{text-align:left}
  .dg-node{flex:1 1 100%}
}

/* ------------------------------------------------------- session details */
article details{
  margin:0 0 20px; padding:0 0 0 16px; border-left:2px solid var(--rule);
}
article details>summary{
  cursor:pointer; list-style:none; color:var(--accent);
  font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:4px 0;
}
article details>summary::-webkit-details-marker{display:none}
article details>summary::before{content:"\25B8  "}
article details[open]>summary::before{content:"\25BE  "}
article details[open]>summary{margin-bottom:10px}
article details>*:last-child{margin-bottom:0}
/* an H1 inside a session body is a divider, not the chapter title */
article h1:not(.title){
  font-family:var(--mono); font-size:12px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); font-weight:400; margin:48px 0 20px; padding-top:20px;
  border-top:1px solid var(--rule);
}

/* ----------------------------------------------------------------- reveal */
details.reveal{margin:0 0 22px; border:1px solid var(--rule); border-radius:6px}
details.reveal>summary{
  cursor:pointer; list-style:none; padding:10px 14px;
  font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
}
details.reveal>summary::-webkit-details-marker{display:none}
details.reveal>summary::before{content:"\25B8  "}
details.reveal[open]>summary::before{content:"\25BE  "}
details.reveal[open]>summary{border-bottom:1px solid var(--rule)}
.reveal-body{padding:14px 14px 2px}

/* ---------------------------------------------------------------- sources */
.sources{margin-top:52px; padding-top:24px; border-top:1px solid var(--rule)}
.sources h2{font-family:var(--mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); margin:0 0 14px; font-weight:400}
.src{display:flex; flex-direction:column; gap:2px}
.src a{
  display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:baseline;
  padding:8px 0; text-decoration:none; color:var(--ink); font-size:14px;
  border-bottom:1px solid var(--rule-soft);
}
.src a:hover .s-l{color:var(--accent)}
.s-r{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:var(--accent);
  background:var(--accent-soft); border-radius:4px; padding:2px 6px; white-space:nowrap;
}
.s-r:empty{display:none}
.s-l{line-height:1.45}
.s-u{display:block; font-family:var(--mono); font-size:11px; color:var(--faint); word-break:break-all; margin-top:2px}

<script type="application/json" id="payload">{"topics": [{"title": "ARC and Memory", "slug": "arc-and-memory", "tagline": "Who owns this object, and when does it go", "summary": "Automatic reference counting from the ground up — what memory is, why something has to decide when an object dies, and how Swift made the compiler do it. Answers the questions that stay confusing: why ARC isn't a garbage collector, why an object can die before the end of its scope, what weak actually costs, and why a retain cycle is a design mistake rather than a bug.", "status": "complete", "accentIndex": 1, "chapters": [{"slug": "why-memory-management-exists", "title": "Why memory management exists", "summary": "What memory is, the two places a program puts things, and why one of them needs somebody to decide when things die.", "minutes": "7", "sources": [{"ref": "", "label": "Apple · Automatic Reference Counting (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/"}, {"ref": "WWDC21", "label": "ARC in Swift: Basics and beyond", "url": "https://developer.apple.com/videos/play/wwdc2021/10216/"}], "html": "<p>Nothing in this chapter is Swift. It is the ground the rest of the topic stands on, and skipping it is why \"just use <code><span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">self<\/span><\/code>\" gets passed around as folklore instead of understood as a decision.<\/p><h2 id=\"what-memory-is\">What memory is<\/h2><p>A running app is given a large block of numbered slots to keep things in. Every photo, every string of text, every screen is somewhere in those slots. The number of a slot is an <strong>address<\/strong>, and a value that holds an address — a note saying <em>the thing you want is over there<\/em> — is a <strong>reference<\/strong>.<\/p><p>Two facts shape everything else.<\/p><p><strong>The block is finite.<\/strong> An iPhone has a few gigabytes of it, shared between your app, the system and everything else running. iOS does not swap to disk the way a Mac does, so when the system runs short it doesn't get slower — it picks apps and terminates them. An app that keeps taking more memory and never gives any back eventually gets killed while the user is in the middle of something.<\/p><p><strong>Slots must be reused.<\/strong> The app asks for space when it needs it and gives it back when it doesn't, thousands of times a second. The entire subject is one question asked over and over: <em>is anybody still using this, or can the space go back?<\/em><\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The building is your app's memory. It has a fixed number of shelves, and it is not the only library in town — the city can and does close a branch that keeps requesting more space.<\/p><p><strong>A book on a shelf is an object.<\/strong> That is the mapping for the whole topic: wherever you see <em>book<\/em>, it means one object living in memory, and nothing else ever does. A book takes up shelf space whether or not anybody is reading it.<\/p><\/blockquote><h2 id=\"the-two-places-things-live\">The two places things live<\/h2><p>A program keeps things in two quite different places, and the difference is the reason only one half of this topic is hard.<\/p><p><strong>The stack<\/strong> is scratch space belonging to one thread. Every time a function is called it gets a fresh slice for its local variables; when the function returns, the slice is discarded whole. It's fast — reserving space costs one arithmetic instruction — and it needs no thinking, because the lifetime is decided by the shape of the code. A local <code><span class=\"t-typ\">Int<\/span><\/code>, a <code><span class=\"t-typ\">CGPoint<\/span><\/code>, a <code><span class=\"t-typ\">Bool<\/span><\/code> typically live here.<\/p><p><strong>The heap<\/strong> is the shared area for things that must outlive the function that created them, or whose size isn't known in advance. Anything you can still reach after the creating function has returned lives here. Allocating from the heap is much more expensive: the runtime has to find a free region, mark it taken, and eventually hand it back.<\/p><p>That last word is the problem. The stack frees itself by construction. The heap does not.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The stack is the desk you carry over to a chair: your own workspace, yours alone, cleared the moment you stand up. Nobody has to decide when to clear it — standing up <em>is<\/em> the clearing.<\/p><p>The shelves are the heap. Anything placed there outlives your visit, can be found by other readers, and stays until somebody makes a decision about it.<\/p><\/blockquote><p>In Swift, the rough split is that <strong>structs and enums are usually stack-allocated values<\/strong>, and <strong>class instances, closures and actors always live on the heap<\/strong>. \"Usually\" is doing real work in that sentence — a struct that is captured by a closure, or stored inside a class, lives wherever its owner lives. Chapter 7 is about what follows from that.<\/p><h2 id=\"why-the-heap-needs-a-decision\">Why the heap needs a decision<\/h2><p>Say a screen loads a photo. The photo is on the heap. The screen closes. Is the photo still needed?<\/p><p>Nobody can answer that from inside the photo. The answer depends on whether anything else is still pointing at it — a cache, a share sheet, an upload in progress. So <em>something<\/em> has to keep track, and there are exactly three ways to get this wrong.<\/p><p><strong>Free it too late, or never.<\/strong> The space is never reused. Do that repeatedly and the app's footprint climbs until the system terminates it. This is a <strong>leak<\/strong>.<\/p><p><strong>Free it too early.<\/strong> Some other part of the app still holds the address and goes there expecting a photo. What it finds is whatever has since been written into those slots — garbage, or a different object entirely. That is a <strong>use-after-free<\/strong>, and it is the worst failure mode in the subject: it does not crash where the mistake was, it crashes somewhere unrelated, later, sometimes only on a customer's phone.<\/p><p><strong>Free it twice.<\/strong> The space gets handed out to someone else after the first free, and the second free rips it away from its new owner. Same class of chaos.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>Pulp a book while three people are still reading it, and each of them is suddenly staring at a page of something else. They won't report <em>\"the book was pulped\"<\/em> — they will report that page 40 of the cookbook contains a tax form, which is not a problem anybody can locate.<\/p><\/blockquote><h2 id=\"two-things-that-both-get-called-a-memory-problem\">Two things that both get called \"a memory problem\"<\/h2><p>Worth separating early, because the fixes are unrelated and the mix-up is common even among experienced engineers.<\/p><p><strong>A leak<\/strong> is memory that is still <em>allocated<\/em> but no longer <em>reachable<\/em> — nothing in the running program has any way to get to it. A retain cycle is the usual cause in Swift, and that is chapters 4 to 6.<\/p><p><strong>Abandoned memory<\/strong> is memory that is perfectly reachable and simply shouldn't still be there: an image cache with no limit, a log array that only ever grows, view controllers kept in an array \"in case we need them\". Nothing is broken, there's no cycle, nobody wrote a bug. The app just holds things it will never look at again.<\/p><p>Both show up as the same climbing line in Xcode's memory report. They have almost nothing else in common, and chapter 9 is about telling them apart, which is most of the work in a real investigation.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>A leak is a book nobody can find in the catalogue and nobody can remove, sitting on a shelf forever. Abandoned memory is a shelf of perfectly catalogued books that nobody has opened since 2019. The building is equally full either way.<\/p><\/blockquote><h2 id=\"what-the-rest-of-this-topic-is\">What the rest of this topic is<\/h2><p>The question <em>\"is anybody still using this?\"<\/em> has been answered in three different ways in mainstream languages: <strong>make the programmer say so<\/strong> (C, and Objective-C before 2011), <strong>let a runtime go and check periodically<\/strong> (Java, C#, Go), or <strong>count the owners as the program runs<\/strong> (Objective-C since 2011, and Swift). Chapter 2 is why Swift picked the third, and what that choice costs — because it does cost something, and the price is paid in exactly one place: cycles.<\/p>", "text": "nothing in this chapter is swift. it is the ground the rest of the topic stands on, and skipping it is why \"just use weak self \" gets passed around as folklore instead of understood as a decision. what memory is a running app is given a large block of numbered slots to keep things in. every photo, every string of text, every screen is somewhere in those slots. the number of a slot is an address , and a value that holds an address — a note saying the thing you want is over there — is a reference . two facts shape everything else. the block is finite. an iphone has a few gigabytes of it, shared between your app, the system and everything else running. ios does not swap to disk the way a mac does, so when the system runs short it doesn't get slower — it picks apps and terminates them. an app that keeps taking more memory and never gives any back eventually gets killed while the user is in the middle of something. slots must be reused. the app asks for space when it needs it and gives it back when it doesn't, thousands of times a second. the entire subject is one question asked over and over: is anybody still using this, or can the space go back? in the library. the building is ": "https://developer.apple.com/library/archive/documentation/Cocoa/Conceptual/MemoryMgmt/Articles/MemoryMgmt.html"}, {"ref": "", "label": "Swift · RefCount.h (runtime source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/SwiftShims/swift/shims/RefCount.h"}], "html": "<p>ARC makes much more sense as a response to two specific failures than as a feature in its own right.<\/p><h2 id=\"counting-by-hand\">Counting by hand<\/h2><p>Objective-C's original model was reference counting done by the programmer. Every object carried a count. You called <code>retain<\/code> when you took an interest, <code>release<\/code> when you lost interest, and at zero the object was destroyed.<\/p><div class=\"scroll\"><pre data-lang=\"objectivec\"><code>NSImage *image = [[NSImage alloc] initWithData:data];  // count 1\n[cache setObject:image forKey:key];                    // cache retains — count 2\n[image release];                                       // you&#x27;re done — count 1<\/code><\/pre><\/div><p>The rules were written down and they were learnable: you own what you <code>alloc<\/code>, <code>new<\/code>, <code>copy<\/code> or <code>retain<\/code>, and you must balance each one. What made it hard wasn't the rule, it was that the rule had to hold <strong>across every path through every function, forever<\/strong>, including the error paths nobody runs.<\/p><p>Miss a <code>release<\/code> and you leak. Add one too many and the object dies while somebody is still using it — chapter 1's use-after-free, reported as a crash in an unrelated place. An entire diagnostic tool, NSZombie, existed for nothing but this: keep dead objects around as tombstones so the crash at least names what you over-released.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>Every book has a tally slip in the front cover. You add a mark when you start reading, rub one out when you finish, and the book is pulped at zero. It works perfectly, right up until the day someone forgets to rub out a mark — or rubs out somebody else's.<\/p><\/blockquote><h2 id=\"garbage-collection-and-why-not\">Garbage collection, and why not<\/h2><p>The other mainstream answer: don't count anything. Periodically, the runtime pauses the program, walks outward from everything currently reachable, and reclaims whatever it didn't reach.<\/p><p>It is genuinely better in one respect, and that respect is the whole reason this chapter exists: <strong>a tracing collector reclaims cycles<\/strong>. Two objects pointing at each other are unreachable from the outside, so a walk from the roots never marks them, and they go. There is no such thing as a retain cycle in Java.<\/p><p>The costs are real, though, and they are the wrong costs for a phone.<\/p><p><strong>It needs slack.<\/strong> A collector performs acceptably when it has considerably more memory than the program's live data — headroom is what buys the amortisation. On a device where the system kills the largest app when memory runs short, spare headroom is exactly what you don't have.<\/p><p><strong>Collection is not free, and not when you choose.<\/strong> Even a good concurrent collector does work that competes with your app, at moments decided by allocation patterns rather than by you. A frame that must ship in under sixteen milliseconds does not want a visitor.<\/p><p><strong>Destruction is not deterministic.<\/strong> With counting, an object dies at a knowable point and its <code><span class=\"t-kw\">deinit<\/span><\/code> runs <em>then<\/em>. With tracing, it dies at some point after it became unreachable — maybe soon, maybe not. That matters for anything holding something scarce: a file handle, a socket, a camera, a lock.<\/p><p>Apple did ship a garbage collector for Objective-C on the Mac, and then retired it: it was deprecated with OS X Mountain Lion in 2012 and later removed, in favour of ARC. It never shipped on iOS at all.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>The alternative to tally slips is to close the building once a week, start from the front desk, and follow every reference anyone can actually reach. Whatever you never reached gets pulped. It finds the two books that only point at each other — and it closes the building.<\/p><\/blockquote><h2 id=\"the-third-answer-let-the-compiler-write-it\">The third answer: let the compiler write it<\/h2><p>Automatic Reference Counting keeps the counting model and removes the human from it. The compiler inserts the <code>retain<\/code> and <code>release<\/code> calls for you, at compile time, in the places the rules say they belong. It arrived for Objective-C in 2011 and it is the only model Swift has ever had.<\/p><p>Three things follow, and they're worth being able to say in order.<\/p><p><strong>It is not a garbage collector.<\/strong> Nothing scans, nothing pauses, nothing runs periodically. The work is ordinary instructions in your own code — inserted for you rather than typed by you.<\/p><p><strong>Destruction is deterministic.<\/strong> The last release destroys the object right there, so <code><span class=\"t-kw\">deinit<\/span><\/code> runs at a point you can reason about, and memory comes back immediately. That's what makes footprint on iOS controllable.<\/p><p><strong>It cannot reclaim a cycle.<\/strong> Counting is a local rule: each object knows how many references point <em>at<\/em> it, and nothing knows the global shape of the graph. Two objects that hold each other keep each other's count above zero, and nothing will ever come along and notice.<\/p><p>That is the bill ARC leaves you. Tracing collectors fix cycles automatically and pay with pauses and headroom; ARC gives you determinism and low footprint and hands you cycles as a design problem. <strong>Everything people call \"a memory bug in Swift\" is almost always the arrival of that bill.<\/strong><\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>Swift's runtime keeps the count in the object's header, next to its type pointer — literally part of the object. The header comments in <code><span class=\"t-typ\">RefCount<\/span>.h<\/code> open with <em>\"An object conceptually has three refcounts\"<\/em>; chapter 4 uses all three. There is no separate table, no collector thread, no mark phase. Reference counting in Swift is not a subsystem; it is a field and some arithmetic.<\/p><\/blockquote><h2 id=\"what-arc-did-not-fix\">What ARC did not fix<\/h2><p>Being clear about this saves a lot of confusion later.<\/p><p>It did not make memory management free — it made it <em>automatic and local<\/em>. Every <code>retain<\/code> is still an atomic increment on a shared counter, and chapter 8 is about what that costs when several threads are involved.<\/p><p>It did not remove the need to think about ownership. It removed the need to <em>implement<\/em> it. You still have to decide which object owns which, and the rest of this topic is really about that decision, expressed in three keywords: <code>strong<\/code>, <code><span class=\"t-kw\">weak<\/span><\/code>, <code><span class=\"t-kw\">unowned<\/span><\/code>.<\/p>", "text": "arc makes much more sense as a response to two specific failures than as a feature in its own right. counting by hand objective c's original model was reference counting done by the programmer. every object carried a count. you called retain when you took an interest, release when you lost interest, and at zero the object was destroyed. objectivec nsimage image = [[nsimage alloc] initwithdata:data]; // count 1 [cache setobject:image forkey:key]; // cache retains — count 2 [image release]; // you're done — count 1 the rules were written down and they were learnable: you own what you alloc , new , copy or retain , and you must balance each one. what made it hard wasn't the rule, it was that the rule had to hold across every path through every function, forever , including the error paths nobody runs. miss a release and you leak. add one too many and the object dies while somebody is still using it — chapter 1's use after free, reported as a crash in an unrelated place. an entire diagnostic tool, nszombie, existed for nothing but this: keep dead objects around as tombstones so the crash at least names what you over released. in the library. every book has a tally slip in the front cover. you add a mark when you start reading, rub one out when you finish, and the book is pulped at zero. it works perfectly, right up until the day someone forgets to rub out a mark — or rubs out somebody else's. garbage collection, and why not the other mainstream answer: don't count anything. periodically, the runtime pauses the program, walks outward from everything currently reachable, and reclaims whatever it didn't reach. it is genuinely better in one respect, and that respect is the whole reason this chapter exists: a tracing collector reclaims cycles . two objects pointing at each other are unreachable from the outside, so a walk from the roots never marks them, and they go. there is no such thing as a retain cycle in java. the costs are real, though, and they are the wrong costs for a phone. it needs slack. a collector performs acceptably when it has considerably more memory than the program's live data — headroom is what buys the amortisation. on a device where the system kills the largest app when memory runs short, spare headroom is exactly what you don't have. collection is not free, and not when you choose. even a good concurrent collector does work that competes with your app, at moments decided by allocation patterns rather than by you. a frame that must ship in under sixteen milliseconds does not want a visitor. destruction is not deterministic. with counting, an object dies at a knowable point and its deinit runs then . with tracing, it dies at some point after it became unreachable — maybe soon, maybe not. that matters for anything holding something scarce: a file handle, a socket, a camera, a lock. apple did ship a garbage collector for objective c on the mac, and then retired it: it was deprecated with os x mountain lion in 2012 and later removed, in favour of arc. it never shipped on ios at all. in the library. the alternative to tally slips is to close the building once a week, start from the front desk, and follow every reference anyone can actually reach. whatever you never reached gets pulped. it finds the two books that only point at each other — and it closes the building. the third answer: let the compiler write it automatic reference counting keeps the counting model and removes the human from it. the compiler inserts the retain and release calls for you, at compile time, in the places the rules say they belong. it arrived for objective c in 2011 and it is the only model swift has ever had. three things follow, and they're worth being able to say in order. it is not a garbage collector. nothing scans, nothing pauses, nothing runs periodically. the work is ordinary instructions in your own code — inserted for you rather than typed by you. destruction is deterministic. the last release destroys the object right there, so deinit runs at a point you can reason about, and memory comes back immediately. that's what makes footprint on ios controllable. it cannot reclaim a cycle. counting is a local rule: each object knows how many references point at it, and nothing knows the global shape of the graph. two objects that hold each other keep each other's count above zero, and nothing will ever come along and notice. that is the bill arc leaves you. tracing collectors fix cycles automatically and pay with pauses and headroom; arc gives you determinism and low footprint and hands you cycles as a design problem. everything people call \"a memory bug in swift\" is almost always the arrival of that bill. under the hood. swift's runtime keeps the count in the object's header, next to its type pointer — literally part of the object. the header comments in refcount.h open with \"an object conceptually has three refcounts\" ; chapter 4 uses all three. there is no separate table, no collector thread, no mark phase. reference counting in swift is not a subsystem; it is a field and some arithmetic. what arc did not fix being clear about this saves a lot of confusion later. it did not make memory management free — it made it automatic and local . every retain is still an atomic increment on a shared counter, and chapter 8 is about what that costs when several threads are involved. it did not remove the need to think about ownership. it removed the need to implement it. you still have to decide which object owns which, and the rest of this topic is really about that decision, expressed in three keywords: strong , weak , unowned . ", "outline": [{"a": "counting-by-hand", "t": "Counting by hand"}, {"a": "garbage-collection-and-why-not", "t": "Garbage collection, and why not"}, {"a": "the-third-answer-let-the-compiler-write-it", "t": "The third answer: let the compiler write it"}, {"a": "what-arc-did-not-fix", "t": "What ARC did not fix"}]}, {"slug": "how-arc-works", "title": "How ARC actually works", "summary": "Where the count lives, who inserts the retains, and why an object can die before the end of its scope.", "minutes": "8", "sources": [{"ref": "WWDC21", "label": "ARC in Swift: Basics and beyond", "url": "https://developer.apple.com/videos/play/wwdc2021/10216/"}, {"ref": "", "label": "Swift · RefCount.h (runtime source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/SwiftShims/swift/shims/RefCount.h"}, {"ref": "", "label": "Apple · Automatic Reference Counting (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/"}], "html": "<h2 id=\"the-whole-model-in-four-lines\">The whole model in four lines<\/h2><p>Every class instance carries a number: how many strong references currently point at it.<\/p><ul><li>Creating it sets the number to one.<\/li><li>Storing another strong reference to it adds one — a <strong>retain<\/strong>.<\/li><li>A strong reference going away subtracts one — a <strong>release<\/strong>.<\/li><li>At zero, <code><span class=\"t-kw\">deinit<\/span><\/code> runs and the memory is handed back.<\/li><\/ul><p>That is the entire mechanism. Everything else in this topic is either a consequence of it or a way of stepping outside it.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Document<\/span> {\n    <span class=\"t-kw\">let<\/span> name: <span class=\"t-typ\">String<\/span>\n    <span class=\"t-kw\">init<\/span>(name: <span class=\"t-typ\">String<\/span>) { <span class=\"t-kw\">self<\/span>.name = name }\n    <span class=\"t-kw\">deinit<\/span> { print(<span class=\"t-str\">&quot;\\(name) gone&quot;<\/span>) }\n}\n\n<span class=\"t-kw\">var<\/span> a: <span class=\"t-typ\">Document<\/span>? = <span class=\"t-typ\">Document<\/span>(name: <span class=\"t-str\">&quot;Invoice&quot;<\/span>)   <span class=\"t-com\">// count 1<\/span>\n<span class=\"t-kw\">var<\/span> b = a                                      <span class=\"t-com\">// count 2<\/span>\na = <span class=\"t-kw\">nil<\/span>                                        <span class=\"t-com\">// count 1 — nothing printed<\/span>\nb = <span class=\"t-kw\">nil<\/span>                                        <span class=\"t-com\">// count 0 — &quot;Invoice gone&quot;<\/span><\/code><\/pre><\/div><p>Note what the second line does <em>not<\/em> do: it doesn't copy the document. Both variables hold the address of one object. That's what \"reference type\" means, and it's why the count is needed at all — a <code><span class=\"t-kw\">struct<\/span><\/code> assignment would have made a second, independent value and none of this would apply.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>One book, one tally slip. Two readers each add a mark. The first one leaves and rubs out their mark; the book stays, because the slip isn't at zero. When the second leaves, the slip hits zero and the book is pulped — the shelf space goes back to the building immediately, not at closing time.<\/p><\/blockquote><h2 id=\"who-writes-the-retains\">Who writes the retains<\/h2><p>You never see them, and they are not magic: the Swift compiler inserts calls to <code>swift_retain<\/code> and <code>swift_release<\/code> into your code while it compiles, following ownership rules built into the language. After optimisation, the ones it can prove are unnecessary are removed. What ships is ordinary machine code with some counting in it.<\/p><p>This has a consequence people find surprising the first time.<\/p><p><strong>An object's guaranteed lifetime runs from initialisation to its last use — not to the end of its scope.<\/strong> Swift is use-based, unlike C++, which is scope-based. Once the compiler can see you will never touch a reference again, it is free to release it there, even if the variable is still nominally in scope for another forty lines.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">func<\/span> process() {\n    <span class=\"t-kw\">let<\/span> doc = <span class=\"t-typ\">Document<\/span>(name: <span class=\"t-str\">&quot;Invoice&quot;<\/span>)\n    upload(doc)\n    <span class=\"t-com\">// doc is never used again — it may be released HERE<\/span>\n    doSomethingSlow()\n}                                   <span class=\"t-com\">// ...not necessarily here<\/span><\/code><\/pre><\/div><p>So <code><span class=\"t-kw\">deinit<\/span><\/code> can run earlier than you expect, while the enclosing function is still running. That is correct behaviour, not a bug.<\/p><p>The other half of the warning matters more. Observed lifetimes can also be <strong>longer<\/strong> than the guarantee: with optimisation off, or with a value held in a register, an object may survive well past its last use. WWDC21 is blunt about this — observed object lifetimes are an emergent property of the compiler and can change as implementation details change. So code that works because an object happens to still be alive is code that works by coincidence.<\/p><p>When you genuinely need an object kept alive across a stretch of code that doesn't mention it, say so explicitly with <code>withExtendedLifetime(_:)<\/code> rather than relying on what the optimiser did last Tuesday. The better fix, where it's available, is to restructure so the thing you depend on is reachable through a strong reference you actually hold.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>You put a book back on the returns trolley the moment you stop reading it, not when you leave the building. If you need it to stay findable while you nip out for coffee, you have to say so — keeping your hand on it is not the same as it being on loan to you.<\/p><\/blockquote><h2 id=\"what-the-count-is-made-of\">What the count is made of<\/h2><p>The number isn't one number. From the Swift runtime's own header:<\/p><blockquote class=\"aside plain\"><p>An object conceptually has three refcounts… The strong RC counts strong references to the object. The unowned RC counts unowned references… The weak RC counts weak references.<\/p><\/blockquote><p>The strong count is the one from the four lines above: at zero, <code><span class=\"t-kw\">deinit<\/span><\/code> runs. The other two exist because the object's <em>storage<\/em> can't be freed at the same moment its <em>contents<\/em> are destroyed if somebody still holds a non-owning reference to it — they need something valid to find. Chapter 4 is that mechanism in full.<\/p><p>The counts are stored inline in the object's header, in the machine word after the type pointer. An extra <strong>side table<\/strong> — a small separate allocation — appears only when it has to, and forming the first <code><span class=\"t-kw\">weak<\/span><\/code> reference is what triggers it. Gaining one is a one-way operation; an object that has a side table never loses it.<\/p><p>Two practical consequences fall out of that layout:<\/p><ul><li>A class instance is never just its properties. It carries a header — type pointer plus refcount word — so a class wrapping a single <code><span class=\"t-typ\">Int<\/span><\/code> costs substantially more than an <code><span class=\"t-typ\">Int<\/span><\/code>.<\/li><li>Some objects are marked <strong>immortal<\/strong> and skip counting entirely: string literals and certain static values. Retaining one is a no-op, and its count never reaches zero because it never started.<\/li><\/ul><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>The lifecycle in <code><span class=\"t-typ\">RefCount<\/span>.h<\/code> has six states — <code><span class=\"t-typ\">LIVE<\/span><\/code>, <code><span class=\"t-typ\">DEINITING<\/span><\/code>, <code><span class=\"t-typ\">DEINITED<\/span><\/code>, <code><span class=\"t-typ\">FREED<\/span><\/code>, <code><span class=\"t-typ\">DEAD<\/span><\/code>, each with and without a side table — and they exist to answer one question: what should a <code><span class=\"t-kw\">weak<\/span><\/code> or <code><span class=\"t-kw\">unowned<\/span><\/code> read do at each moment between \"the last owner let go\" and \"the memory is gone\"? The bits live in an <code>atomic&lt;<span class=\"t-typ\">InlineRefCountBits<\/span>&gt;<\/code>, which is why chapter 8's claim about thread safety is a fact about the layout rather than a promise about your code.<\/p><\/blockquote><h2 id=\"deinit\">deinit<\/h2><p><code><span class=\"t-kw\">deinit<\/span><\/code> runs when the strong count hits zero, before the memory is released. It is the last thing the object does.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Connection<\/span> {\n    <span class=\"t-kw\">private<\/span> <span class=\"t-kw\">let<\/span> handle: <span class=\"t-typ\">FileHandle<\/span>\n    <span class=\"t-kw\">deinit<\/span> { <span class=\"t-kw\">try<\/span>? handle.close() }\n}<\/code><\/pre><\/div><p>Three rules worth holding onto.<\/p><p><strong>It is deterministic, and that's the point.<\/strong> This is what ARC buys that a tracing collector doesn't: the file closes when the last owner lets go, not eventually.<\/p><p><strong>It can run on any thread.<\/strong> Whoever released last runs it — which may well be a background thread, and which is the source of a genuinely nasty crash class when a <code><span class=\"t-kw\">deinit<\/span><\/code> touches UIKit. Chapter 8 deals with this, including Swift 6's <code>isolated <span class=\"t-kw\">deinit<\/span><\/code>.<\/p><p><strong>You cannot resurrect the object.<\/strong> By the time <code><span class=\"t-kw\">deinit<\/span><\/code> runs, the object is already dying: any <code><span class=\"t-kw\">unowned<\/span><\/code> read of it traps, and any <code><span class=\"t-kw\">weak<\/span><\/code> reference to it already reads as <code><span class=\"t-kw\">nil<\/span><\/code>. Handing <code><span class=\"t-kw\">self<\/span><\/code> to something in <code><span class=\"t-kw\">deinit<\/span><\/code> is not a thing that works.<\/p><p>The print-in-deinit trick is still the fastest way to answer \"did this screen actually go away?\", and it is how most retain cycles get found in practice — you close the screen, and nothing prints.<\/p><h2 id=\"why-none-of-this-catches-a-cycle\">Why none of this catches a cycle<\/h2><p>Look at the four lines again. Every rule is <strong>local<\/strong>: each object knows only how many references point at it. No part of the system knows the shape of the whole graph, so nothing is in a position to notice that two objects are holding each other up.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Parent<\/span> { <span class=\"t-kw\">var<\/span> child: <span class=\"t-typ\">Child<\/span>? }\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Child<\/span>  { <span class=\"t-kw\">var<\/span> parent: <span class=\"t-typ\">Parent<\/span>? }      <span class=\"t-com\">// both strong<\/span>\n\n<span class=\"t-kw\">var<\/span> p: <span class=\"t-typ\">Parent<\/span>? = <span class=\"t-typ\">Parent<\/span>()\n<span class=\"t-kw\">var<\/span> c: <span class=\"t-typ\">Child<\/span>? = <span class=\"t-typ\">Child<\/span>()\np?.child = c                                    <span class=\"t-com\">// Child count 2<\/span>\nc?.parent = p                                   <span class=\"t-com\">// Parent count 2<\/span>\np = <span class=\"t-kw\">nil<\/span>; c = <span class=\"t-kw\">nil<\/span>                                <span class=\"t-com\">// both counts 1 — neither dies<\/span><\/code><\/pre><\/div><p>Nothing in that program is unreachable in the counting sense, and nothing is reachable in the useful sense. Both objects are leaked, permanently, and no diagnostic fires. Chapters 4 to 6 are about the three keywords that prevent this, and the shapes in which it actually shows up.<\/p>", "text": " the whole model in four lines every class instance carries a number: how many strong references currently point at it. creating it sets the number to one. storing another strong reference to it adds one — a retain . a strong reference going away subtracts one — a release . at zero, deinit runs and the memory is handed back. that is the entire mechanism. everything else in this topic is either a consequence of it or a way of stepping outside it. swift final class document { let name: string init(name: string) { self.name = name } deinit { print(\"\\(name) gone\") } } var a: document? = document(name: \"invoice\") // count 1 var b = a // count 2 a = nil // count 1 — nothing printed b = nil // count 0 — \"invoice gone\" note what the second line does not do: it doesn't copy the document. both variables hold the address of one object. that's what \"reference type\" means, and it's why the count is needed at all — a struct assignment would have made a second, independent value and none of this would apply. in the library. one book, one tally slip. two readers each add a mark. the first one leaves and rubs out their mark; the book stays, because the slip isn't at zero. when the second leaves, the slip hits zero and the book is pulped — the shelf space goes back to the building immediately, not at closing time. who writes the retains you never see them, and they are not magic: the swift compiler inserts calls to swift_retain and swift_release into your code while it compiles, following ownership rules built into the language. after optimisation, the ones it can prove are unnecessary are removed. what ships is ordinary machine code with some counting in it. this has a consequence people find surprising the first time. an object's guaranteed lifetime runs from initialisation to its last use — not to the end of its scope. swift is use based, unlike c++, which is scope based. once the compiler can see you will never touch a reference again, it is free to release it there, even if the variable is still nominally in scope for another forty lines. swift func process() { let doc = document(name: \"invoice\") upload(doc) // doc is never used again — it may be released here dosomethingslow() } // ...not necessarily here so deinit can run earlier than you expect, while the enclosing function is still running. that is correct behaviour, not a bug. the other half of the warning matters more. observed lifetimes can also be longer than the guarantee: with optimisation off, or with a value held in a register, an object may survive well past its last use. wwdc21 is blunt about this — observed object lifetimes are an emergent property of the compiler and can change as implementation details change. so code that works because an object happens to still be alive is code that works by coincidence. when you genuinely need an object kept alive across a stretch of code that doesn't mention it, say so explicitly with withextendedlifetime(_:) rather than relying on what the optimiser did last tuesday. the better fix, where it's available, is to restructure so the thing you depend on is reachable through a strong reference you actually hold. in the library. you put a book back on the returns trolley the moment you stop reading it, not when you leave the building. if you need it to stay findable while you nip out for coffee, you have to say so — keeping your hand on it is not the same as it being on loan to you. what the count is made of the number isn't one number. from the swift runtime's own header: an object conceptually has three refcounts… the strong rc counts strong references to the object. the unowned rc counts unowned references… the weak rc counts weak references. the strong count is the one from the four lines above: at zero, deinit runs. the other two exist because the object's storage can't be freed at the same moment its contents are destroyed if somebody still holds a non owning reference to it — they need something valid to find. chapter 4 is that mechanism in full. the counts are stored inline in the object's header, in the machine word after the type pointer. an extra side table — a small separate allocation — appears only when it has to, and forming the first weak reference is what triggers it. gaining one is a one way operation; an object that has a side table never loses it. two practical consequences fall out of that layout: a class instance is never just its properties. it carries a header — type pointer plus refcount word — so a class wrapping a single int costs substantially more than an int . some objects are marked immortal and skip counting entirely: string literals and certain static values. retaining one is a no op, and its count never reaches zero because it never started. under the hood. the lifecycle in refcount.h has six states — live , deiniting , deinited , freed , dead , each with and without a side table — and they exist to answer one question: what should a weak or unowned read do at each moment between \"the last owner let go\" and \"the memory is gone\"? the bits live in an atomic<inlinerefcountbits , which is why chapter 8's claim about thread safety is a fact about the layout rather than a promise about your code. deinit deinit runs when the strong count hits zero, before the memory is released. it is the last thing the object does. swift final class connection { private let handle: filehandle deinit { try? handle.close() } } three rules worth holding onto. it is deterministic, and that's the point. this is what arc buys that a tracing collector doesn't: the file closes when the last owner lets go, not eventually. it can run on any thread. whoever released last runs it — which may well be a background thread, and which is the source of a genuinely nasty crash class when a deinit touches uikit. chapter 8 deals with this, including swift 6's isolated deinit . you cannot resurrect the object. by the time deinit runs, the object is already dying: any unowned read of it traps, and any weak reference to it already reads as nil . handing self to something in deinit is not a thing that works. the print in deinit trick is still the fastest way to answer \"did this screen actually go away?\", and it is how most retain cycles get found in practice — you close the screen, and nothing prints. why none of this catches a cycle look at the four lines again. every rule is local : each object knows only how many references point at it. no part of the system knows the shape of the whole graph, so nothing is in a position to notice that two objects are holding each other up. swift final class parent { var child: child? } final class child { var parent: parent? } // both strong var p: parent? = parent() var c: child? = child() p?.child = c // child count 2 c?.parent = p // parent count 2 p = nil; c = nil // both counts 1 — neither dies nothing in that program is unreachable in the counting sense, and nothing is reachable in the useful sense. both objects are leaked, permanently, and no diagnostic fires. chapters 4 to 6 are about the three keywords that prevent this, and the shapes in which it actually shows up. ", "outline": [{"a": "the-whole-model-in-four-lines", "t": "The whole model in four lines"}, {"a": "who-writes-the-retains", "t": "Who writes the retains"}, {"a": "what-the-count-is-made-of", "t": "What the count is made of"}, {"a": "deinit", "t": "deinit"}, {"a": "why-none-of-this-catches-a-cycle", "t": "Why none of this catches a cycle"}]}, {"slug": "strong-weak-unowned", "title": "Strong, weak, unowned", "summary": "The three kinds of reference, what each costs at runtime, and the rule for picking one.", "minutes": "9", "sources": [{"ref": "", "label": "Apple · Automatic Reference Counting (TSPL)", "url": "https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/"}, {"ref": "", "label": "Swift · RefCount.h (runtime source)", "url": "https://github.com/swiftlang/swift/blob/main/stdlib/public/SwiftShims/swift/shims/RefCount.h"}, {"ref": "WWDC21", "label": "ARC in Swift: Basics and beyond", "url": "https://developer.apple.com/videos/play/wwdc2021/10216/"}], "html": "<p>A reference either keeps the thing it points at alive, or it doesn't. Swift gives you one way to do the first and two ways to do the second, and the difference between those two is the only genuinely subtle part.<\/p><h2 id=\"strong\">Strong<\/h2><p>The default. No keyword — a plain <code><span class=\"t-kw\">var<\/span><\/code> or <code><span class=\"t-kw\">let<\/span><\/code> property holding a class instance is strong. It contributes to the count, and while it exists the object cannot die.<\/p><p>Use it for everything you own. A view model owns its repository; a repository owns its client; a cache owns its entries. In a healthy object graph the overwhelming majority of references are strong, and reaching for <code><span class=\"t-kw\">weak<\/span><\/code> by reflex is its own bug — see the end of chapter 5.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>A strong reference is a mark on the tally slip. While your mark is there, the book stays.<\/p><\/blockquote><h2 id=\"weak\">Weak<\/h2><p>A <code><span class=\"t-kw\">weak<\/span><\/code> reference does not contribute to the strong count, and it becomes <code><span class=\"t-kw\">nil<\/span><\/code> automatically when the object dies. It must therefore be an <code><span class=\"t-typ\">Optional<\/span><\/code> <code><span class=\"t-kw\">var<\/span><\/code> — it has to be able to become nothing, and it has to be mutable, because something other than you changes it.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">ImageLoader<\/span> {\n    <span class=\"t-kw\">weak<\/span> <span class=\"t-kw\">var<\/span> delegate: <span class=\"t-typ\">ImageLoaderDelegate<\/span>?\n}<\/code><\/pre><\/div><p>Two things happen at runtime, and knowing both is what separates a usable mental model from a slogan.<\/p><p><strong>Forming the first weak reference gives the object a side table.<\/strong> That's a second small allocation, and the object keeps it for the rest of its life. Weak variables then point at the side table rather than at the object, which is exactly how the zeroing can work: when the object dies, the table outlives it briefly, and reads through it return <code><span class=\"t-kw\">nil<\/span><\/code>.<\/p><p><strong>Reading a weak reference is not free.<\/strong> It isn't a pointer dereference; it's a runtime call that must check the object's state and, if it's still alive, hand you a <em>strong<\/em> reference to it for the duration of your use — otherwise it could die between your check and your call. That's an atomic retain and release per read, plus synchronisation around the table. Fine anywhere normal. Not fine in a loop over ten thousand items, which is a real optimisation you will occasionally have to make:<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-com\">// reads weak storage every iteration<\/span>\n<span class=\"t-kw\">for<\/span> item <span class=\"t-kw\">in<\/span> items { weakThing?.handle(item) }\n\n<span class=\"t-com\">// reads it once, then works with a strong reference<\/span>\n<span class=\"t-kw\">if<\/span> <span class=\"t-kw\">let<\/span> thing = weakThing {\n    <span class=\"t-kw\">for<\/span> item <span class=\"t-kw\">in<\/span> items { thing.handle(item) }\n}<\/code><\/pre><\/div><p>That second form is also more correct, not just faster: in the first, <code>weakThing<\/code> can become <code><span class=\"t-kw\">nil<\/span><\/code> half way through and you silently process half the list.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>A weak reference is a note at the front desk: <em>\"tell me if this book is pulped.\"<\/em> It adds no mark to the tally, so it never keeps the book alive. When the book goes, the desk quietly crosses your note out — and the only way to find out whether it's still there is to walk to the desk and ask, every time.<\/p><\/blockquote><h2 id=\"unowned\">Unowned<\/h2><p><code><span class=\"t-kw\">unowned<\/span><\/code> also contributes nothing to the strong count. The difference is what happens afterwards: <strong>nothing is zeroed, and nothing checks for you at the moment of use<\/strong>. The reference is non-optional and, by default, reading one after the object has died halts the program immediately — in the runtime's own words, unowned variable load <em>halts in <code>swift_abortRetainUnowned()<\/code><\/em>.<\/p><p>So the model is: <code><span class=\"t-kw\">unowned<\/span><\/code> is a promise you make to the compiler that this reference will never outlive its target. If the promise holds, you pay less — no side table, no optional to unwrap, a cheaper read. If it breaks, you crash deterministically rather than corrupting anything.<\/p><div class=\"scroll\"><pre data-lang=\"swift\"><code><span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">Customer<\/span> {\n    <span class=\"t-kw\">var<\/span> card: <span class=\"t-typ\">CreditCard<\/span>?\n}\n\n<span class=\"t-kw\">final<\/span> <span class=\"t-kw\">class<\/span> <span class=\"t-typ\">CreditCard<\/span> {\n    <span class=\"t-kw\">unowned<\/span> <span class=\"t-kw\">let<\/span> customer: <span class=\"t-typ\">Customer<\/span>      <span class=\"t-com\">// a card without a customer is nonsense<\/span>\n    <span class=\"t-kw\">init<\/span>(customer: <span class=\"t-typ\">Customer<\/span>) { <span class=\"t-kw\">self<\/span>.customer = customer }\n}<\/code><\/pre><\/div><p>That is the legitimate shape: the card cannot possibly outlive the customer, because the customer is the only route to it. When you can state a reason like that in one sentence, <code><span class=\"t-kw\">unowned<\/span><\/code> is right. When your sentence contains \"shouldn't\" or \"in practice\", use <code><span class=\"t-kw\">weak<\/span><\/code>.<\/p><p>There is also <code><span class=\"t-kw\">unowned<\/span>(unsafe)<\/code>, which removes the check as well. It's the equivalent of Objective-C's <code>assign<\/code> — a raw pointer with no safety net at all, reading freed memory rather than trapping. It exists for interop and hot paths; if you're reaching for it to silence a crash, you've found a lifetime bug, not a performance problem.<\/p><blockquote class=\"aside office\"><p class=\"aside-label\">In the library<\/p><p>An unowned reference is a note in your own pocket saying <em>\"book 412, I'm certain it's still on the shelf.\"<\/em> Nobody updates it. If you're right, it's the cheapest thing possible. If you're wrong, you walk to shelf 412 and the building stops you at the door — better than handing you whatever is now in that slot.<\/p><\/blockquote><h2 id=\"which-one-and-when\">Which one, and when<\/h2><p>The question to ask is never \"which is safer?\" It's <strong>can this reference outlive what it points at?<\/strong><\/p><div class=\"scroll\"><table><thead><tr><th>Situation<\/th><th>Use<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td>You own it — it should live as long as you do<\/td><td><code>strong<\/code><\/td><td>the default, and correct far more often than people assume<\/td><\/tr><tr><td>A back-pointer to something that owns you, with equal or longer life<\/td><td><code><span class=\"t-kw\">unowned<\/span><\/code><\/td><td>provably can't outlive it; no optional, no side table<\/td><\/tr><tr><td>A back-pointer whose lifetime is independent of yours<\/td><td><code><span class=\"t-kw\">weak<\/span><\/code><\/td><td>it can vanish, and you need to survive that<\/td><\/tr><tr><td>A delegate<\/td><td><code><span class=\"t-kw\">weak<\/span><\/code><\/td><td>the delegate almost always owns you; classic cycle otherwise<\/td><\/tr><tr><td>A reference held across an <code><span class=\"t-kw\">await<\/span><\/code>, a network call, or any callback<\/td><td><code><span class=\"t-kw\">weak<\/span><\/code><\/td><td>the thing can die while you're suspended; see chapter 6<\/td><\/tr><tr><td>Interop, or a measured hot path where you can prove the lifetime<\/td><td><code><span class=\"t-kw\">unowned<\/span>(unsafe)<\/code><\/td><td>no check at all — you are the check<\/td><\/tr><\/tbody><\/table><\/div><p>A useful second question when you're stuck: <strong>if this object died right now, is my code still meaningful?<\/strong> If yes, <code><span class=\"t-kw\">weak<\/span><\/code> — write the <code><span class=\"t-kw\">nil<\/span><\/code> path. If the answer is \"that can't happen and the code would be nonsense\", <code><span class=\"t-kw\">unowned<\/span><\/code> is the honest spelling, and the crash is the enforcement of what you just said.<\/p><h2 id=\"the-thing-people-get-wrong\">The thing people get wrong<\/h2><p><code><span class=\"t-kw\">weak<\/span><\/code> is not the safe default, and treating it that way causes its own class of bugs.<\/p><p>A <code><span class=\"t-kw\">weak<\/span><\/code> reference tells the reader <em>this can disappear at any moment and I'm fine with that<\/em>. When it isn't true — when the object really should have been kept alive, and something else was supposed to be holding it — the symptom isn't a crash. It's a screen that silently stops updating, a callback that never fires, a save that never happens, because by the time the work finished, <code><span class=\"t-kw\">self<\/span><\/code> was <code><span class=\"t-kw\">nil<\/span><\/code> and the closure returned early. Nothing is logged. Nothing is reported. That is far harder to find than a leak.<\/p><p>Decide ownership first. Reach for <code><span class=\"t-kw\">weak<\/span><\/code> when the answer to \"who owns this?\" is genuinely \"somebody else\", not as a way of avoiding the question.<\/p><blockquote class=\"aside hood\"><p class=\"aside-label\">Under the hood<\/p><p>The three counts exist to make the middle of an object's death safe. When the strong count reaches zero the object is deinited and its weak references start reading <code><span class=\"t-kw\">nil<\/span><\/code>, but the <em>storage<\/em> can't be freed while unowned references still exist — those have to find something valid to trap on. The unowned count keeps the allocation alive past <code><span class=\"t-kw\">deinit<\/span><\/code>; the weak count keeps the side table alive past the allocation. <code><span class=\"t-typ\">DEINITING<\/span><\/code>, <code><span class=\"t-typ\">DEINITED<\/span><\/code>, <code><span class=\"t-typ\">FREED<\/span><\/code>, <code><span class=\"t-typ\">DEAD<\/span><\/code>: four states between \"last owner let go\" and \"the space is reusable\", and all of them are there so <code><span class=\"t-kw\">weak<\/span><\/code> can be <code><span class=\"t-kw\">nil<\/span><\/code> and <code><span class=\"t-kw\">unowned<\/span><\/code> can trap instead of both reading rubbish.<\/p><\/blockquote>", "text": "a reference either keeps the thing it points at alive, or it doesn't. swift gives you one way to do the first and two ways to do the second, and the difference between those two is the only genuinely subtle part. strong the default. no keyword — a plain var or let property holding a class instance is strong. it contributes to the count, and while it exists the object cannot die. use it for everything you own. a view model owns its repository; a repository owns its client; a cache owns its entries. in a healthy object graph the overwhelming majority of references are strong, and reaching for weak by reflex is its own bug — see the end of chapter 5. in the library. a strong reference is a mark on the tally slip. while your mark is there, the book stays. weak a weak reference does not contribute to the strong count, and it becomes nil automatically when the object dies. it must therefore be an optional var — it has to be able to become nothing, and it has to be mutable, because something other than you changes it. swift final class imageloader { weak var delegate: imageloaderdelegate? } two things happen at runtime, and knowing both is what separates a usable mental model from a slogan. forming the first weak reference gives the object a side table. that's a second small allocation, and the object keeps it for the rest of its life. weak variables then point at the side table rather than at the object, which is exactly how the zeroing can work: when the object dies, the table outlives it briefly, and reads through it return nil . reading a weak reference is not free. it isn't a pointer dereference; it's a runtime call that must check the object's state and, if it's still alive, hand you a strong reference to it for the duration of your use — otherwise it could die between your check and your call. that's an atomic retain and release per read, plus synchronisation around the table. fine anywhere normal. not fine in a loop over ten thousand items, which is a real optimisation you will occasionally have to make: swift // reads weak storage every iteration for item in items { weakthing?.handle(item) } // reads it once, then works with a strong reference if let thing = weakthing { for item in items { thing.handle(item) } } that second form is also more correct, not just faster: in the first, weakthing can become nil half way through and you silently process half the list. in the library. a weak reference is a note at the front desk: \"tell me if this book is pulped.\" it adds no mark to the tally, so it never keeps the book alive. when the book goes, the desk quietly crosses your note out — and the only way to find out whether it's still there is to walk to the desk and ask, every time. unowned unowned also contributes nothing to the strong count. the difference is what happens afterwards: nothing is zeroed, and nothing checks for you at the moment of use . the reference is non optional and, by default, reading one after the object has died halts the program immediately — in the runtime's own words, unowned variable load halts in swift_abortretainunowned() . so the model is: unowned is a promise you make to the compiler that this reference will never outlive its target. if the promise holds, you pay less — no side table, no optional to unwrap, a cheaper read. if it breaks, you crash deterministically rather than corrupting anything. swift final class customer { var card: creditcard? } final class creditcard { unowned let customer: customer // a card without a customer is nonsense init(customer: customer) { self.customer = customer } } that is the legitimate shape: the card cannot possibly outlive the customer, because the customer is the only route to it. when you can state a reason like that in one sentence, unowned is right. when your sentence contains \"shouldn't\" or \"in practice\", use weak . there is also unowned(unsafe) , which removes the check as well. it's the equivalent of objective c's assign — a raw pointer with no safety net at all, reading freed memory rather than trapping. it exists for interop and hot paths; if you're reaching for it to silence a crash, you've found a lifetime bug, not a performance problem. in the library. an unowned reference is a note in your own pocket saying \"book 412, i'm certain it's still on the shelf.\" nobody updates it. if you're right, it's the cheapest thing possible. if you're wrong, you walk to shelf 412 and the building stops you at the door — better than handing you whatever is now in that slot. which one, and when the question to ask is never \"which is safer?\" it's can this reference outlive what it points at? situation use why you own it — it should live as long as you do strong the default, and correct far more often than people assume a back pointer to something that owns you, with equal or longer life unowned provably can't outlive it; no optional, no side table a back pointer whose lifetime is independent of yours weak it can vanish, and you need to survive that a delegate weak the delegate almost always owns you; classic cycle otherwise a reference held across an await , a network call, or any callback weak the thing can die while you're suspended; see chapter 6 interop, or a measured hot path where you can prove the lifetime unowned(unsafe) no check at all — you are the check a useful second question when you're stuck: if this object died right now, is my code still meaningful? if yes, weak — write the nil path. if the answer is \"that can't happen and the code would be nonsense\", unowned is the honest spelling, and the crash is the enforcement of what you just said. the thing peopl
